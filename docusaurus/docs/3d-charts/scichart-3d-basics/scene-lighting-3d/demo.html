<div id="scichart-root"></div>
<div id="lighting-controls">
    <label>Ambient <input id="ambient" type="range" min="0" max="1" step="0.01" value="0.18" /><output for="ambient">0.18</output></label>
    <label>Light mode
        <select id="light-mode">
            <option value="GlobalSpace">Global space</option>
            <option value="CameraForward">Camera forward</option>
            <option value="None">Directional off</option>
        </select>
    </label>
    <label>Direction X <input id="direction-x" type="range" min="-1" max="1" step="0.05" value="-0.25" /><output for="direction-x">-0.25</output></label>
    <label>Direction Y <input id="direction-y" type="range" min="-1" max="1" step="0.05" value="0.5" /><output for="direction-y">0.50</output></label>
    <label>Direction Z <input id="direction-z" type="range" min="-1" max="1" step="0.05" value="-0.25" /><output for="direction-z">-0.25</output></label>
</div>
