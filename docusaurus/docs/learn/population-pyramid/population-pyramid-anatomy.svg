<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The parts of a population pyramid</title>
<desc id="d">A population pyramid of Japan in 2023 (UN World Population Prospects 2024 estimates). Age groups run up the middle from 0–4 at the bottom to 100+ at the top. Male bars extend to the left in blue and female bars to the right in orange, against a shared scale in thousands. Labels point out the base (the youngest people, set by recent births, here the narrowest bar below age 85), a bulge at ages 45 to 54 (people born in the baby boom of the early 1970s), a second bulge at ages 70 to 74 (people born around the post-war baby boom), a notch at ages 65 to 69 (a smaller generation between them), the apex (the oldest people), and the much wider female bars at the top, because women on average live longer.</desc>
