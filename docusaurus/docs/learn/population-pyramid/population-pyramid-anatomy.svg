<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The parts of a population pyramid</title>
<desc id="d">A population pyramid of an imaginary country. Age groups run up the middle from 0–4 at the bottom to 85+ at the top. Male bars extend to the left in blue and female bars to the right in orange, against a shared scale in thousands. Labels point out the base (the youngest people, set by recent births), a bulge at ages 50 to 59 (a large generation born in a baby boom), a small notch at ages 40 to 44, the apex (the oldest people), and the wider female bars at the top, because women on average live longer.</desc>
