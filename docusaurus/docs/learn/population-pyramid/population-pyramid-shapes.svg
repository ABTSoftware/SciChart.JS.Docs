<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">The three main shapes of population pyramid</title>
<desc id="d">Three simplified population pyramids side by side. Expansive: a wide base that narrows quickly towards the top, like a triangle, showing many births and a growing, young population. Stationary: bars of similar width up to old age, then tapering, showing low birth and death rates and a population that is roughly stable. Constrictive: the base is narrower than the middle, showing falling births and an ageing population that may shrink.</desc>
