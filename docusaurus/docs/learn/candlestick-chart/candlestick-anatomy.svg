<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title id="title">Anatomy of a candlestick</title>
  <desc id="desc">A bullish (green) candle whose close is above its open, and a bearish (red) candle whose close is below its open. The body spans the open and close prices; the wicks reach the high and low.</desc>
  <rect width="700" height="400" rx="12" fill="#ffffff"/>

  <!-- Bullish candle: open 250, close 110, high 40, low 320 -->
  <line x1="200" y1="40" x2="200" y2="320" stroke="#26a69a" stroke-width="3"/>
  <rect x="170" y="110" width="60" height="140" fill="#26a69a"/>
  <g fill="#333" text-anchor="end">
    <text x="118" y="45">High</text>
    <text x="118" y="115">Close</text>
    <text x="118" y="255">Open</text>
    <text x="118" y="325">Low</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 4">
    <line x1="124" y1="40" x2="196" y2="40"/>
    <line x1="124" y1="110" x2="168" y2="110"/>
    <line x1="124" y1="250" x2="168" y2="250"/>
    <line x1="124" y1="320" x2="196" y2="320"/>
  </g>
  <g fill="#666" font-size="13">
    <text x="214" y="80">upper wick</text>
    <text x="240" y="184">body</text>
    <text x="214" y="290">lower wick</text>
  </g>
  <text x="200" y="365" text-anchor="middle" fill="#1b7f75" font-weight="bold">Bullish: closed above its open</text>

  <!-- Bearish candle: open 100, close 230, high 60, low 300 -->
  <line x1="500" y1="60" x2="500" y2="300" stroke="#ef5350" stroke-width="3"/>
  <rect x="470" y="100" width="60" height="130" fill="#ef5350"/>
  <g fill="#333">
    <text x="582" y="65">High</text>
    <text x="582" y="105">Open</text>
    <text x="582" y="235">Close</text>
    <text x="582" y="305">Low</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 4">
    <line x1="504" y1="60" x2="576" y2="60"/>
    <line x1="532" y1="100" x2="576" y2="100"/>
    <line x1="532" y1="230" x2="576" y2="230"/>
    <line x1="504" y1="300" x2="576" y2="300"/>
  </g>
  <text x="500" y="365" text-anchor="middle" fill="#c62828" font-weight="bold">Bearish: closed below its open</text>
</svg>
