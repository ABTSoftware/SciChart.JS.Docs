"#1f2a44" font-weight="700">5. Power to dB</text><text x="192" y="254" fill="#1f7f9e" font-size="16" font-weight="700" text-anchor="middle">0 … −120 dB</text><text x="122" y="284" fill="#1f2a44" font-size="13">10 log10 |X[k]|², scaled</text><text x="122" y="301" fill="#1f2a44" font-size="13">full-scale sine = 0 dBFS</text><rect width="165" height="110" x="300" y="200" fill="#f4f8fc" stroke="#1f2a44" stroke-width="1.5" rx="10"/><text x="312" y="222" fill="#1f2a44" font-weight="700">6. Average + hold</text><polyline fill="none" stroke="#1f7f9e" stroke-width="2" points="322.0,260.0 325.0,257.9 328.0,257.0 331.0,257.7 334.0,259.7 337.0,258.1 340.0,256.9 343.0,256.9 346.0,257.7 349.0,254.4 352.0,249.0 355.0,243.9 358.0,240.3 361.0,237.0 364.0,236.1 367.0,240.1 370.0,247.1 373.0,252.5 376.0,254.2 379.0,255.9 382.0,258.1 385.0,259.2 388.0,257.5 391.0,257.0 394.0,258.1 397.0,259.4 400.0,256.9 403.0,254.7 406.0,253.4 409.0,253.0 412.0,249.9 415.0,250.1 418.0,253.2 421.0,257.4 424.0,257.3 427.0,256.8 430.0,257.5 433.0,259.4 436.0,258.4 439.0,257.1 442.0,257.4"/><polyline fill="none" stroke="#F48420" stroke-width="2" points="322.0,251.0 325.0,251.0 328.0,251.0 331.0,251.0 334.0,250.9 337.0,250.7 340.0,250.2 343.0,249.0 346.0,246.9 349.0,243.6 352.0,239.0 355.0,233.9 358.0,229.5 361.0,227.2 364.0,227.7 367.0,230.8 370.0,235.6 373.0,240.6 376.0,244.8 379.0,247.8 382.0,249.5 385.0,250.4 388.0,250.8 391.0,250.9 394.0,250.8 397.0,250.4 400.0,249.3 403.0,247.3 406.0,244.6 409.0,242.1 412.0,241.0 415.0,242.1 418.0,244.6 421.0,247.3 424.0,249.3 427.0,250.4 430.0,250.8 433.0,251.0 436.0,251.0 439.0,251.0 442.0,251.0"/><text x="312" y="284" fill="#1f2a44" font-size="13">exponential average,</text><text x="312" y="301" fill="#1f2a44" font-size="13">peak hold per bin</text><rect width="165" height="110" x="490" y="200" fill="#f4f8fc" stroke="#1f2a44" stroke-width="1.5" rx="10"/><text x="502" y="222" fill="#1f2a44" font-weight="700">7. Display</text><rect width="120" height="34" x="512" y=