<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 350"><title>The signal chain of an FFT spectrum analyser</title><desc>Sound is sampled at 48,000 samples per second. Each block of N samples is multiplied by a Hann window, transformed with the FFT, converted to decibels, averaged and peak-held, and drawn against a logarithmic frequency axis. For N = 4,096, each block is 85 ms long and gives 2,048 bins 11.7 Hz apart.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2a44" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="350" fill="#fff"/><text x="20" y="28" fill="#1f2a44" font-size="17" font-weight="700">Inside an FFT spectrum analyser: the steps repeated for every block</text><rect width="165" height="110" x="20" y="60" fill="#f4f8fc" stroke="#1f2a44" stroke-width="1.5" rx="10"/><text x="32" y="82" fill="#1f2a44" font-weight="700">1. Capture</text><polyline fill="none" stroke="#1f7f9e" stroke-width="2" points="42.0,107.0 44.0,104.0 46.0,101.0 48.0,98.3 50.0,96.4 52.0,95.5 54.0,96.1 56.0,98.0 58.0,101.1 60.0,105.1 62.0,109.6 64.0,113.9 66.0,117.5 68.0,120.0 70.0,121.0 72.0,120.3 74.0,118.2 76.0,114.8 78.0,110.7 80.0,106.4 82.0,102.4 84.0,99.2 86.0,97.2 88.0,96.4 90.0,97.0 92.0,98.6 94.0,100.9 96.0,103.6 98.0,106.3 100.0,108.7 102.0,110.4 104.0,111.5 106.0,111.9 108.0,111.6 110.0,110.9 112.0,109.9 114.0,108.8 116.0,107.7 118.0,106.7 120.0,105.8 122.0,105.1 124.0,104.5 126.0,104.1 128.0,103.9 130.0,104.1 132.0,104.6 134.0,105.5 136.0,106.8 138.0,108.5 140.0,110.3 142.0,112.1 144.0,113.6 146.0,114.5 148.0,114.5 150.0,113.6 152.0,111.7 154.0,108.8 156.0,105.4 158.0,101.8 160.0,98.4 162.0,95.8"/><text x="32" y="144" fill="#1f2a44" font-size="13">48,000 samples/s</text><text x="32" y="161" fill="#1f2a44" font-size="13">keep the newest N</text><re