<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 400"><title>How aliasing folds frequencies: apparent frequency against true frequency at a 1 kHz sample rate</title><desc>A zigzag line shows the frequency you measure for each true input frequency when sampling at 1,000 samples per second. It rises from 0 to 500 Hz (the Nyquist frequency), folds back down to 0 Hz at 1 kHz, and repeats. Tones at 900 Hz, 1,100 Hz and 2,100 Hz all land on the same 100 Hz, while a 300 Hz tone is measured correctly.</desc><rect width="760" height="400" fill="#fff"/><rect width="128" height="230" x="80" y="70" fill="#e6f5fa"/><text x="144" y="62" fill="#1a6f8a" font-size="13" font-weight="600" text-anchor="middle">measured correctly</text><g stroke="#c9d3e0" stroke-dasharray="4 4"><line x1="208" x2="208" y1="70" y2="300"/><line x1="336" x2="336" y1="70" y2="300"/><line x1="464" x2="464" y1="70" y2="300"/><line x1="592" x2="592" y1="70" y2="300"/><line x1="720" x2="720" y1="70" y2="300"/></g><g fill="none" stroke="#33415c" stroke-width="1.5"><line x1="80" x2="730" y1="300" y2="300"/><line x1="80" x2="80" y1="300" y2="66"/></g><g fill="#33415c" font-size="13" text-anchor="middle"><text x="80" y="320">0</text><text x="208" y="320">500</text><text x="336" y="320">1,000</text><text x="464" y="320">1,500</text><text x="592" y="320">2,000</text><text x="720" y="320">2,500</text><text x="400" y="346" font-size="14" font-weight="600">True frequency of the input (Hz)</text></g><g fill="#33415c" font-size="13" text-anchor="end"><text x="72" y="304">0</text><text x="72" y="216">200</text><text x="72" y="172" fill="#1a8a5a">300</text><text x="72" y="84">500</text></g><text fill="#33415c" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 105.5 79.5)">Frequency you measure (Hz)</text><g fill="#5a6782" font-size="12" text-anchor="middle"><text x="208" y="364">fs/2 (Nyquist)</text><text x="336" y="364">fs</text><text x="464" y="364">1.5 fs</text><text x="592" y="364">2 fs</text></g><polyline fill="none" stroke="#2b7bb9" stroke-linejoin="round" stroke-width="3" points="80,300 208,80 336,300 464,80 592,300 720,80"/><g fill="#2b7bb9" font-size="12" font-style="italic"><text x="262" y="135">folds back</text><text x="262" y="150">(mirrored)</text></g><line x1="80" x2="618" y1="256" y2="256" stroke="#e8710a" stroke-dasharray="6 4" stroke-width="2"/><g stroke="#e8710a" stroke-dasharray="2 3" stroke-width="1.5"><line x1="310" x2="310" y1="256" y2="300"/><line x1="362" x2="362" y1="256" y2="300"/><line x1="618" x2="618" y1="256" y2="300"/></g><g fill="#e8710a"><circle cx="310" cy="256" r="6"/><circle cx="362" cy="256" r="6"/><circle cx="618" cy="256" r="6"/><circle cx="80" cy="256" r="5"/></g><text x="72" y="260" fill="#b35400" font-size="13" font-weight="600" text-anchor="end">100</text><g fill="#b35400" font-size="12" text-anchor="middle"><text x="300" y="290">900</text><text x="374" y="290">1,100</text><text x="642" y="290">2,100</text></g><circle cx="157" cy="168" r="6" fill="#1a8a5a"/><line x1="80" x2="157" y1="168" y2="168" stroke="#1a8a5a" stroke-dasharray="2 3" stroke-width="1.5"/><text x="170" y="173" fill="#1a8a5a" font-size="12" font-weight="600">300 Hz</text><g fill="#5c3300" font-size="13" text-anchor="end"><text x="740" y="22" font-weight="600">Sample rate fs = 1,000 Hz</text><text x="740" y="40">900, 1,100 and 2,100 Hz tones give the same samples as a 100 Hz tone</text></g><text x="400" y="392" fill="#33415c" font-size="13" text-anchor="middle">Apparent frequency = |f − k·fs|, with k the whole number nearest to f / fs</text></svg>