<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 250"><title>Where the anti-aliasing filter goes: before the analogue-to-digital converter</title><desc>A signal chain from left to right. An analogue signal with high-frequency noise goes into an anti-aliasing low-pass filter that removes everything above half the sample rate. The analogue-to-digital converter then takes a sample every 1/fs seconds, giving digital samples that can be analysed, plotted or played back through a digital-to-analogue converter and a reconstruction filter.</desc><rect width="760" height="250" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#33415c" d="m0 0 10 5-10 5z"/></marker></defs><rect width="150" height="110" x="14" y="60" fill="#f2f6fb" stroke="#9aa9c2" rx="8"/><text x="89" y="84" fill="#33415c" font-size="14" font-weight="600" text-anchor="middle">Analogue signal</text><path fill="none" stroke="#2b7bb9" stroke-width="2" d="M28 128q8-26 16 0t16 0 16 0 16 0 16 0 16 0 16 0 16 0"/><path fill="none" stroke="#c0392b" d="m28 128 3-5 3 9 3-8 3 6 3-7 3 8 3-6 3 5 3-8 3 7 3-5 3 8 3-9 3 6 3-5 3 7 3-6 3 8 3-7 3 5 3-8 3 6 3-5 3 7 3-6 3 5 3-7 3 6 3-5 3 8 3-6 3 5 3-4 3 4 3-3 3 3 3-2 3 2 3-2" opacity=".7"/><text x="89" y="160" fill="#5a6782" font-size="12" text-anchor="middle">wanted + fast noise</text><line x1="166" x2="196" y1="115" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/><rect width="170" height="134" x="198" y="48" fill="#e8f6f1" stroke="#1a8a5a" stroke-width="2" rx="8"/><text x="283" y="70" fill="#135c3d" font-size="14" font-weight="600" text-anchor="middle">Anti-aliasing filter</text><text x="283" y="87" fill="#135c3d" font-size="12" text-anchor="middle">analogue low-pass</text><line x1="214" x2="352" y1="160" y2="160" stroke="#5a6782"/><line x1="214" x2="214" y1="160" y2="98" stroke="#5a6782"/><path fill="none" stroke="#1a8a5a" stroke-width="2.5" d="M214 106h62c16 0 24 12 30 32l8 22"/><line x1="322" x2="322" y1="100" y2="160" stroke="#e8710a" stroke-dasharray="4 3" stroke-width="1.5"/><text x="322" y="175" fill="#b35400" font-size="11" text-anchor="middle">fs/2</text><line x1="370" x2="400" y1="115" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="110" x="402" y="60" fill="#f2f6fb" stroke="#9aa9c2" rx="8"/><text x="477" y="84" fill="#33415c" font-size="14" font-weight="600" text-anchor="middle">ADC</text><text x="477" y="101" fill="#5a6782" font-size="12" text-anchor="middle">a sample every 1/fs</text><line x1="416" x2="540" y1="140" y2="140" stroke="#5a6782"/><g stroke="#33415c" stroke-width="2"><line x1="424" x2="424" y1="140" y2="124"/><line x1="440" x2="440" y1="140" y2="116"/><line x1="456" x2="456" y1="140" y2="122"/><line x1="472" x2="472" y1="140" y2="138"/><line x1="488" x2="488" y1="140" y2="154"/><line x1="504" x2="504" y1="140" y2="160"/><line x1="520" x2="520" y1="140" y2="154"/><line x1="536" x2="536" y1="140" y2="140"/></g><g fill="#33415c"><circle cx="424" cy="124" r="3"/><circle cx="440" cy="116" r="3"/><circle cx="456" cy="122" r="3"/><circle cx="472" cy="138" r="3"/><circle cx="488" cy="154" r="3"/><circle cx="504" cy="160" r="3"/><circle cx="520" cy="154" r="3"/><circle cx="536" cy="140" r="3"/></g><line x1="554" x2="584" y1="115" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/><rect width="160" height="110" x="586" y="60" fill="#f2f6fb" stroke="#9aa9c2" rx="8"/><text x="666" y="84" fill="#33415c" font-size="14" font-weight="600" text-anchor="middle">Digital samples</text><g fill="#5a6782" font-size="12" text-anchor="middle"><text x="666" y="108">analyse (FFT), plot,</text><text x="666" y="125">or play back through a</text><text x="666" y="142">DAC and a</text><text x="666" y="159">reconstruction filter</text></g><text x="283" y="212" fill="#135c3d" font-size="12" text-anchor="middle">must act here, on the analogue signal:</text><text x="283" y="228" fill="#135c3d" font-size="12" text-anchor="middle">once sampled, an alias can&apos;t be removed</text><text x="477" y="212" fill="#33415c" font-size="12" text-anchor="middle">sample rate fs</text><text x="477" y="228" fill="#33415c" font-size="12" text-anchor="middle">Nyquist frequency fs/2</text></svg>