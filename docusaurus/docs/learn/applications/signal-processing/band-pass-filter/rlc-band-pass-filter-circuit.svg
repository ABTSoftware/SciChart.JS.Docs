<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 380"><title id="t">Series RLC band-pass filter circuit</title><desc id="d">An inductor L and a capacitor C in series between the input and the output, and a resistor R from the output to ground. The centre frequency is 1 divided by 2 pi times the square root of L C, the bandwidth is R divided by 2 pi L, and Q is the square root of L over C, divided by R. With L of 10 millihenries, C of 100 nanofarads and R of 100 ohms, the centre frequency is about 5.03 kilohertz, the bandwidth about 1.59 kilohertz and Q about 3.16.</desc><rect width="720" height="380" fill="#fff"/><g fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><circle cx="60" cy="80" r="6" fill="#fff"/><circle cx="60" cy="220" r="6" fill="#fff"/><line x1="66" x2="130" y1="80" y2="80"/><path d="M130 80a12 14 0 0 1 24 0 12 14 0 0 1 24 0 12 14 0 0 1 24 0 12 14 0 0 1 24 0"/><line x1="226" x2="292" y1="80" y2="80"/><line x1="292" x2="292" y1="52" y2="108" stroke-width="4"/><line x1="308" x2="308" y1="52" y2="108" stroke-width="4"/><line x1="308" x2="574" y1="80" y2="80"/><circle cx="420" cy="80" r="5" fill="#222"/><circle cx="580" cy="80" r="6" fill="#fff"/><line x1="420" x2="420" y1="80" y2="112"/><polyline points="420,112 402,120 438,134 402,148 438,162 402,176 420,184"/><line x1="420" x2="420" y1="184" y2="220"/><line x1="66" x2="574" y1="220" y2="220"/><circle cx="420" cy="220" r="5" fill="#222"/><circle cx="580" cy="220" r="6" fill="#fff"/></g><g stroke="#222" stroke-width="2.5"><line x1="420" x2="420" y1="220" y2="240"/><line x1="402" x2="438" y1="240" y2="240"/><line x1="408" x2="432" y1="247" y2="247"/><line x1="414" x2="426" y1="254" y2="254"/></g><g fill="#222" font-size="17"><text x="178" y="48" font-weight="700" text-anchor="middle">L</text><text x="300" y="40" font-weight="700" text-anchor="middle">C</text><text x="452" y="154" font-weight="700">R</text><text x="52" y="86" text-anchor="end">V<tspan dy="4" font-size="13">in</tspan></text><text x="596" y="86">V<tspan dy="4" font-size="13">out</tspan></text><text x="52" y="226" text-anchor="end">0 V</text><text x="596" y="226">0 V</text></g><g font-size="14"><text x="96" y="140" fill="#d1495b">Low f: C blocks</text><text x="96" y="160" fill="#d1495b">High f: L blocks</text><text x="96" y="186" fill="#2a6fdb">At f<tspan dy="3" font-size="11">0</tspan><tspan dy="-3">, L and C cancel:</tspan></text><text x="96" y="204" fill="#2a6fdb">all of V<tspan dy="3" font-size="11">in</tspan><tspan dy="-3"> reaches R</tspan></text></g><rect width="600" height="88" x="60" y="276" fill="#f2f5fa" stroke="#c9d3e3" rx="8"/><text xml:space="preserve" x="360" y="302" fill="#222" font-size="17" text-anchor="middle">f<tspan dy="4" font-size="12">0</tspan><tspan dy="-4"> = 1 / (2π√(LC))   ·   BW = R / (2πL)   ·   Q = √(L/C) / R</tspan></text><text x="360" y="326" fill="#444" font-size="14" text-anchor="middle">Example: L = 10 mH, C = 100 nF, R = 100 Ω → f<tspan dy="3" font-size="11">0</tspan><tspan dy="-3"> ≈ 5.03 kHz, BW ≈ 1.59 kHz, Q ≈ 3.16</tspan></text><text x="360" y="348" fill="#444" font-size="14" text-anchor="middle">−3 dB edges: f<tspan dy="3" font-size="11">L</tspan><tspan dy="-3"> ≈ 4.30 kHz and f</tspan><tspan dy="3" font-size="11">H</tspan><tspan dy="-3"> ≈ 5.89 kHz</tspan></text></svg>