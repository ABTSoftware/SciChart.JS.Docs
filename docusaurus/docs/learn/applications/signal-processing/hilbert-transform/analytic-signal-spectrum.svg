<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 500"><title id="t">What the Hilbert transform and the analytic signal do to a spectrum</title><desc id="d">Three spectra of one tone at frequency f0 with amplitude A. 1: the real signal x(t) has two lines, A/2 at minus f0 and A/2 at plus f0. 2: the Hilbert transform multiplies by minus i sgn(f): the positive line is turned by minus 90 degrees and the negative line by plus 90 degrees, and both keep their height A/2. 3: the analytic signal z = x + iH{x} keeps one line of height A at plus f0 and nothing at minus f0. Below, z(t) drawn as a rotating arrow in the complex plane: its length is the envelope A(t), its angle is the instantaneous phase phi(t), and the rate it turns, divided by 2 pi, is the instantaneous frequency.</desc><rect width="720" height="500" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="16" font-weight="700" text-anchor="middle">One tone, three spectra: why the analytic signal has no negative frequencies</text><rect width="220" height="214" x="20" y="46" fill="#f7f8fb" stroke="#e1e4ea" rx="8"/><text x="130" y="68" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">1. Real signal x(t)</text><text x="130" y="86" fill="#444" font-size="12.5" font-style="italic" font-weight="400" text-anchor="middle">X(f)</text><line x1="32" x2="228" y1="210" y2="210" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="130" x2="130" y1="214" y2="100" stroke="#bbb" stroke-dasharray="3 3"/><text x="220" y="228" fill="#444" font-size="12" font-style="italic" font-weight="400">f</text><text x="130" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">0</text><text x="70" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">−f₀</text><text x="190" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">+f₀</text><line x1="70" x2="70" y1="210" y2="168" stroke="#2B8CBE" stroke-width="3.5"/><path fill="#2B8CBE" d="m64 169 6-9 6 9Z"/><text x="70" y="153" fill="#2B8CBE" font-size="12.5" font-weight="700" text-anchor="middle">A/2</text><line x1="190" x2="190" y1="210" y2="168" stroke="#2B8CBE" stroke-width="3.5"/><path fill="#2B8CBE" d="m184 169 6-9 6 9Z"/><text x="190" y="153" fill="#2B8CBE" font-size="12.5" font-weight="700" text-anchor="middle">A/2</text><text x="130" y="250" fill="#444" font-size="12" font-weight="400" text-anchor="middle">two mirror-image lines</text><line x1="242" x2="253" y1="146" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="214" x="255" y="46" fill="#f7f8fb" stroke="#e1e4ea" rx="8"/><text x="365" y="68" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">2. Hilbert transform H{x}</text><text x="365" y="86" fill="#444" font-size="12.5" font-style="italic" font-weight="400" text-anchor="middle">−i·sgn(f)·X(f)</text><line x1="267" x2="463" y1="210" y2="210" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="365" x2="365" y1="214" y2="100" stroke="#bbb" stroke-dasharray="3 3"/><text x="455" y="228" fill="#444" font-size="12" font-style="italic" font-weight="400">f</text><text x="365" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">0</text><text x="305" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">−f₀</text><text x="425" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">+f₀</text><line x1="305" x2="305" y1="210" y2="168" stroke="#E07B17" stroke-width="3.5"/><path fill="#E07B17" d="m299 169 6-9 6 9Z"/><text x="305" y="153" fill="#E07B17" font-size="12.5" font-weight="700" text-anchor="middle">+90°</text><line x1="425" x2="425" y1="210" y2="168" stroke="#E07B17" stroke-width="3.5"/><path fill="#E07B17" d="m419 169 6-9 6 9Z"/><text x="425" y="153" fill="#E07B17" font-size="12.5" font-weight="700" text-anchor="middle">−90°</text><text x="365" y="250" fill="#444" font-size="12" font-weight="400" text-anchor="middle">same heights, phases turned</text><line x1="477" x2="488" y1="146" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="214" x="490" y="46" fill="#f7f8fb" stroke="#e1e4ea" rx="8"/><text x="600" y="68" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">3. Analytic signal z = x + iH{x}</text><text x="600" y="86" fill="#444" font-size="12.5" font-style="italic" font-weight="400" text-anchor="middle">Z(f)</text><line x1="502" x2="698" y1="210" y2="210" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="600" x2="600" y1="214" y2="100" stroke="#bbb" stroke-dasharray="3 3"/><text x="690" y="228" fill="#444" font-size="12" font-style="italic" font-weight="400">f</text><text x="600" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">0</text><text x="540" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">−f₀</text><text x="660" y="228" fill="#444" font-size="12" font-weight="400" text-anchor="middle">+f₀</text><line x1="660" x2="660" y1="210" y2="118" stroke="#6B3FA0" stroke-width="3.5"/><path fill="#6B3FA0" d="m654 119 6-9 6 9Z"/><text x="660" y="103" fill="#6B3FA0" font-size="12.5" font-weight="700" text-anchor="middle">A</text><text x="540" y="202" fill="#B42318" font-size="13" font-weight="700" text-anchor="middle">0</text><text x="600" y="250" fill="#444" font-size="12" font-weight="400" text-anchor="middle">negative side gone, positive doubled</text><text x="20" y="292" fill="#1a1a2e" font-size="15" font-weight="700">The analytic signal as a rotating arrow</text><line x1="55" x2="255" y1="398" y2="398" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="150" x2="150" y1="480" y2="308" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/><text x="250" y="416" fill="#444" font-size="12" font-weight="400" text-anchor="end">real: x(t)</text><text x="158" y="318" fill="#444" font-size="12" font-weight="400">imaginary: H{x}(t)</text><circle cx="150" cy="398" r="66" fill="none" stroke="#c9b8e6" stroke-dasharray="4 3"/><line x1="150" x2="191.4" y1="398" y2="363.3" stroke="#6B3FA0" stroke-width="3"/><path fill="#6B3FA0" d="m200.6 355.6-5.4 12.3-7.7-9.2Z"/><line x1="200.6" x2="200.6" y1="355.6" y2="398" stroke="#E07B17" stroke-dasharray="4 3" stroke-width="1.5"/><line x1="150" x2="200.6" y1="398" y2="398" stroke="#2B8CBE" stroke-width="3"/><path fill="none" stroke="#B8860B" stroke-width="1.5" d="m176 398-.1-1.8-.2-1.8-.3-1.8-.4-1.8-.6-1.7-.6-1.7-.8-1.6-1-1.6-1-1.5-1.1-1.4"/><text x="180" y="394" fill="#B8860B" font-size="13" font-weight="700">φ(t)</text><text x="206.56" y="349.58" fill="#6B3FA0" font-size="13" font-weight="700">z(t)</text><text x="170" y="364" fill="#6B3FA0" font-size="12.5" font-weight="700" text-anchor="end">|z| = A(t)</text><text x="330" y="322" fill="#444" font-size="12.5" font-weight="400">Envelope (instantaneous amplitude)</text><text x="330" y="340" fill="#6B3FA0" font-size="14.5" font-weight="700">A(t) = |z(t)| = √(x² + H{x}²)</text><text x="330" y="362" fill="#444" font-size="12.5" font-weight="400">Instantaneous phase</text><text x="330" y="380" fill="#B8860B" font-size="14.5" font-weight="700">φ(t) = arg z(t) = atan2(H{x}, x)</text><text x="330" y="402" fill="#444" font-size="12.5" font-weight="400">Instantaneous frequency</text><text x="330" y="420" fill="#1a1a2e" font-size="14.5" font-weight="700">f(t) = (1 / 2π) · dφ/dt</text><text x="330" y="442" fill="#444" font-size="12.5" font-weight="400">Back to the signal</text><text x="330" y="460" fill="#2B8CBE" font-size="14.5" font-weight="700">x(t) = Re z(t) = A(t) cos φ(t)</text></svg>