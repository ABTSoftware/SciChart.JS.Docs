<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 380"><title id="t">Envelope detection two ways: rectify and low-pass, or the Hilbert transform</title><desc id="d">Top row: a raw waveform of three fading bursts is rectified (every negative half-cycle flipped positive), then low-pass filtered. The result is the envelope, a little late and with some ripple left from the carrier. Bottom row: the same waveform goes through a Hilbert transform; the magnitude of the analytic signal, the square root of x squared plus H{x} squared, is the envelope directly, with no carrier ripple and no delay, drawn above and below the waveform. Any filter after it can be much gentler. Adapted from Burnett-Thompson (2007).</desc><rect width="720" height="380" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">Envelope detection two ways</text><text x="20" y="52" fill="#E07B17" font-size="13.5" font-weight="700">1. Rectify, then low-pass filter (the classic diode detector)</text><rect width="150" height="90" x="20" y="60" fill="#f7f8fb" stroke="#e1e4ea" rx="6"/><line x1="24" x2="166" y1="105" y2="105" stroke="#d0d4dc"/><path fill="none" stroke="#2B8CBE" d="M26 105h12.8l.3.1.4-.1h.3l.4-.1.3-.1h.4l.3.1.4.1.3.2.4.3.3.1.3-.2.4-.4.3-.6.4-.6.3-.3.4.4.3 1.1.4 1.5.3 1.4.4.5.3-1 .4-2.4.3-3.2.3-2.8.4-.8.3 2 .4 4.8.3 6.1.4 4.8.3 1.3.4-3.9.3-8.3.4-10 .3-7.5.3-1.5.4 6.4.3 12.6.4 14.4.3 10.4.4 1.3.3-9.2.4-16.9.3-18.4.4-12.4.3-.8.4 11.6.3 20 .3 20.6.4 13 .3.1.4-12.9.3-20.8.4-20.4.3-12 .4.8.3 12.6.4 19 .3 17.7.3 9.7.4-1.3.3-10.8.4-15.3.3-13.5.4-7 .3 1.5.4 8.2.3 10.8.4 9.1.3 4.3.4-1.2.3-5.4.3-6.8.4-5.4.3-2.4.4 1 .3 3.1.4 3.7.3 2.8.4 1.1.3-.5.4-1.6.3-1