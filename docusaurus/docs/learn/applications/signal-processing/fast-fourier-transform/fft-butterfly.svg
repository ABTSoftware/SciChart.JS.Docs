<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 290"><title id="t">One radix-2 FFT butterfly and its twiddle factor</title><desc id="d">Two inputs from the previous stage, a and b. The lower input b is multiplied by the twiddle factor w. Each output gets both: the upper output is a + w·b and the lower output is a − w·b. On the right, the twiddle factor is W_N^R = e^(−i2πR/N) = cos(2πR/N) − i sin(2πR/N), and for N = 8 the four values used are W⁰ = 1, W¹ = (1 − i)/√2, W² = −i and W³ = −(1 + i)/√2. Adapted from Burnett-Thompson (2007).</desc><rect width="720" height="290" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">One butterfly: two values in, two values out</text><text x="40" y="64" fill="#666" font-size="12">from previous stage</text><text x="290" y="64" fill="#666" font-size="12">to next stage</text><rect width="50" height="34" x="30" y="83" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="55" y="106" fill="#1a1a2e" font-size="17" font-style="italic" text-anchor="middle">a</text><rect width="50" height="34" x="30" y="183" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="55" y="206" fill="#1a1a2e" font-size="17" font-style="italic" text-anchor="middle">b</text><line x1="80" x2="160" y1="100" y2="100" stroke="#555" stroke-width="1.5"/><line x1="80" x2="104" y1="200" y2="200" stroke="#555" stroke-width="1.5"/><rect width="56" height="34" x="104" y="183" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="132" y="206" fill="#C2610C" font-size="16" font-weight="700" text-anchor="middle">× w</text><text x="132" y="236" fill="#C2610C" font-size="12" text-anchor="middle">twiddle factor</text><line x1="160" x2="262" y1="100" y2="100" stroke="#555" stroke-width="1.5"/><line x1="160" x2="262" y1="100" y2="200" stroke="#555" stroke-width="1.5"/><line x1="160" x2="262" y1="200" y2="100" stroke="#555" stroke-width="1.5"/><line x1="160" x2="262" y1="200" y2="200" stroke="#555" stroke-width="1.5"/><circle cx="276" cy="100" r="14" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="276" y="106" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">+</text><circle cx="276" cy="200" r="14" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="276" y="206" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">+</text><text x="238" y="218" fill="#B42318" font-size="16" font-weight="700" text-anchor="middle">−</text><line x1="290" x2="320" y1="100" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="290" x2="320" y1="200" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="90" height="34" x="322" y="83" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="367" y="106" fill="#1a1a2e" font-size="15" text-anchor="middle">a + w·b</text><rect width="90" height="34" x="322" y="183" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="367" y="206" fill="#1a1a2e" font-size="15" text-anchor="middle">a − w·b</text><text x="30" y="254" fill="#444" font-size="13">−: the value on the lower path is subtracted.</text><text x="30" y="274" fill="#444" font-size="13">1 complex multiplication and 2 additions, 2 outputs.</text><line x1="436" x2="436" y1="50" y2="270" stroke="#e5e7eb"/><text x="450" y="70" fill="#C2610C" font-size="15" font-weight="700">The twiddle factor</text><text x="450" y="98" fill="#1a1a2e" font-size="15">w = W<tspan baseline-shift="sub" font-size="10">N</tspan><tspan baseline-shift="super" dx="-7" font-size="10">R</tspan> = e<tspan baseline-shift="super" font-size="10">−i2πR/N</tspan></text><text x="450" y="122" fill="#1a1a2e" font-size="15">= cos(2πR/N) − i sin(2πR/N)</text><text x="450" y="146" fill="#666" font-size="12">a point on the unit circle, R/N of a turn</text><text x="450" y="176" fill="#1a1a2e" font-size="14" font-weight="700">For N = 8:</text><text x="450" y="200" fill="#1a1a2e" font-size="13">W<tspan baseline-shift="super" font-size="10">0</tspan> = 1</text><text x="450" y="222" fill="#1a1a2e" font-size="13">W<tspan baseline-shift="super" font-size="10">1</tspan> = (1 − i)/√2 ≈ 0.707 − 0.707i</text><text x="450" y="244" fill="#1a1a2e" font-size="13">W<tspan baseline-shift="super" font-size="10">2</tspan> = −i</text><text x="450" y="266" fill="#1a1a2e" font-size="13">W<tspan baseline-shift="super" font-size="10">3</tspan> = −(1 + i)/√2 ≈ −0.707 − 0.707i</text></svg>