<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 470"><title id="t">How a 16-point FFT splits its input into bit-reversed order</title><desc id="d">Five rows show a 16-sample signal being split. Row 1: one signal of 16 points, samples 0 to 15. Row 2: two signals of 8 points, the even samples 0 2 4 6 8 10 12 14 and the odd samples 1 3 5 7 9 11 13 15. Row 3: four signals of 4 points. Row 4: eight signals of 2 points. Row 5: sixteen single points in the order 0 8 4 12 2 10 6 14 1 9 5 13 3 11 7 15. Each position holds the sample whose 4-bit index is the position written backwards, for example position 1 = 0001 holds sample 1000 = 8. Adapted from Burnett-Thompson (2007).</desc><rect width="720" height="470" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">Splitting 16 samples into even and odd, four times over</text><text x="20" y="74" fill="#444" font-size="13">1 signal of 16</text><rect width="26" height="26" x="150" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="163" y="74" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="26" height="26" x="178" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="191" y="74" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="26" height="26" x="206" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="219" y="74" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="26" height="26" x="234" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="247" y="74" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="26" height="26" x="262" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><te