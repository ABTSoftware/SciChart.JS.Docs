<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 760 450"><title id="t">How to read an FFT magnitude spectrum</title><desc id="d">An FFT spectrum in decibels of a test signal sampled at 1,024 Hz with 1,024 samples and a Hann window. A tall peak at 50 Hz reaches 0 dB, a second peak at 120.5 Hz reaches about -7 dB, a small peak at 160 Hz reaches about -49 dB, and the rest is a noise floor near -70 dB.</desc><rect width="760" height="450" fill="#fff"/><text x="78" y="30" fill="#111827" font-size="18" font-weight="700">Reading an FFT spectrum: N = 1,024 samples at 1,024 Hz, Hann window</text><line x1="78" x2="730" y1="84.8" y2="84.8" stroke="#e5e7eb"/><text x="70" y="89.8" fill="#374151" font-size="14" text-anchor="end">0</text><line x1="78" x2="730" y1="143.8" y2="143.8" stroke="#e5e7eb"/><text x="70" y="148.8" fill="#374151" font-size="14" text-anchor="end">-20</text><line x1="78" x2="730" y1="202.9" y2="202.9" stroke="#e5e7eb"/><text x="70" y="207.9" fill="#374151" font-size="14" text-anchor="end">-40</text><line x1="78" x2="730" y1="261.9" y2="261.9" stroke="#e5e7eb"/><text x="70" y="266.9" fill="#374151" font-size="14" text-anchor="end">-60</text><line x1="78" x2="730" y1="321" y2="321" stroke="#e5e7eb"/><text x="70" y="326" fill="#374151" font-size="14" text-anchor="end">-80</text><line x1="78" x2="730" y1="380" y2="380" stroke="#e5e7eb"/><text x="70" y="385" fill="#374151" font-size="14" text-anchor="end">-100</text><line x1="78" x2="78" y1="70" y2="380" stroke="#f1f5f9"/><text x="78" y="402" fill="#374151" font-size="14" text-anchor="middle">0</text><line x1="171.1" x2="171.1" y1="70" y2="380" stroke="#f1f5f9"/><text x="171.1" y="402" fill="#374151" font-size="14" text-anchor="middle">40</text><line x1="264.3" x2="264.3" y1="70" y2="380" stroke="#f1f5f9"/><text x="264.3" y="402" fill="#374151" font-size="14" text-anchor="middle">80</te