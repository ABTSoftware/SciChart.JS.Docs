<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 760 580"><title id="t">An 8-point radix-2 FFT, worked through for one cycle of a sine wave</title><desc id="d">An 8-point decimation-in-time FFT flow graph with three stages of butterflies. The input is x[n] = sin(2πn/8), fed in bit-reversed order: x0 = 0, x4 = 0, x2 = 1, x6 = −1, x1 = √2/2, x5 = −√2/2, x3 = √2/2, x7 = −√2/2. After stage 1 (pairs 1 apart, twiddle W0) the values are 0, 0, 0, 2, 0, √2, 0, √2. After stage 2 (pairs 2 apart, twiddles W0 and W2 = −i) they are 0, −2i, 0, 2i, 0, √2 − √2i, 0, √2 + √2i. After stage 3 (pairs 4 apart, twiddles W0 to W3) the outputs in natural order are X0 = 0, X1 = −4i, X2 to X6 = 0 and X7 = 4i. Adapted from Burnett-Thompson (2007).</desc><rect width="760" height="580" fill="#fff"/><text x="380" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">8-point FFT of x[n] = sin(2πn/8), one full cycle</text><text x="118" y="70" fill="#444" font-size="13" font-weight="700" text-anchor="middle">Input, bit-reversed</text><text x="298" y="70" fill="#444" font-size="13" font-weight="700" text-anchor="middle">After stage 1</text><text x="478" y="70" fill="#444" font-size="13" font-weight="700" text-anchor="middle">After stage 2</text><text x="658" y="70" fill="#444" font-size="13" font-weight="700" text-anchor="middle">Output, in order</text><line x1="157" x2="193" y1="96" y2="96" stroke="#8a94a6" stroke-width="1.3"/><line x1="157" x2="193" y1="150" y2="150" stroke="#8a94a6" stroke-width="1.3"/><line x1="193" x2="259" y1="96" y2="96" stroke="#8a94a6" stroke-width="1.3"/><line x1="193" x2="259" y1="96" y2="150" stroke="#8a94a6" stroke-width="1.3"/><line x1="193" x2="259" y1="150" y2="96" stroke="#8a94a6" stroke-width="1.3"/><line x1="193" x2="259" y1="150" y2="150" stroke="#8a94a6" stroke-width="1.3"/><text x="175" y="145" fill="#C2610C" font-