<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" fill="#1d2a3a" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" viewBox="0 0 760 330"><title id="t">RC high-pass filter circuit and its frequency response</title><desc id="d">Left: a capacitor C in series between the input and the output, with a resistor R from the output to ground. The cutoff frequency is fc = 1 divided by 2 pi R C. Right: the gain in decibels against frequency on a log scale. Below the cutoff the gain falls by 20 dB for every tenfold drop in frequency; at the cutoff it is -3 dB; above it the gain is flat at 0 dB.</desc><rect width="760" height="330" fill="#fff"/><text x="160" y="28" font-size="15" font-weight="600" text-anchor="middle">First-order RC high-pass circuit</text><g fill="none" stroke="#1d2a3a" stroke-width="2"><circle cx="40" cy="110" r="5" fill="#fff"/><circle cx="290" cy="110" r="5" fill="#fff"/><circle cx="40" cy="230" r="5" fill="#fff"/><circle cx="290" cy="230" r="5" fill="#fff"/><line x1="45" x2="128" y1="110" y2="110"/><line x1="128" x2="128" y1="90" y2="130" stroke-width="3"/><line x1="142" x2="142" y1="90" y2="130" stroke-width="3"/><line x1="142" x2="285" y1="110" y2="110"/><line x1="220" x2="220" y1="110" y2="140"/><polyline points="220,140 232,147 208,159 232,171 208,183 232,195 220,201"/><line x1="220" x2="220" y1="201" y2="230"/><line x1="45" x2="285" y1="230" y2="230"/></g><circle cx="220" cy="110" r="3.5"/><circle cx="220" cy="230" r="3.5"/><text x="135" y="80" font-weight="600" text-anchor="middle">C</text><text x="244" y="175" font-weight="600">R</text><text x="40" y="95" text-anchor="middle">in</text><text x="290" y="95" text-anchor="middle">out</text><text x="40" y="255" text-anchor="middle">0 V</text><text x="290" y="255" text-anchor="middle">0 V</text><text x="160" y="296" font-size="15" text-anchor="middle">fc = 1 / (2π R C)</text><text x="160" y="316" fill="#55657a" text-anchor="middle">C blocks DC; fast changes pass to R</text><text x="560" y="28" font-size="15" font-weight="600" text-anchor="middle">Its frequency response</text><line x1="390" x2="390" y1="60" y2="244" stroke="#e3e7ee"/><text x="390" y="264" text-anchor="middle">fc/100</text><line x1="475" x2="475" y1="60" y2="244" stroke="#e3e7ee"/><text x="475" y="264" text-anchor="middle">fc/10</text><line x1="560" x2="560" y1="60" y2="244" stroke="#e3e7ee"/><text x="560" y="264" text-anchor="middle">fc</text><line x1="645" x2="645" y1="60" y2="244" stroke="#e3e7ee"/><text x="645" y="264" text-anchor="middle">10·fc</text><line x1="730" x2="730" y1="60" y2="244" stroke="#e3e7ee"/><text x="730" y="264" text-anchor="middle">100·fc</text><line x1="390" x2="730" y1="60" y2="60" stroke="#e3e7ee"/><text x="382" y="64" text-anchor="end">0</text><line x1="390" x2="730" y1="106" y2="106" stroke="#e3e7ee"/><text x="382" y="110" text-anchor="end">-10</text><line x1="390" x2="730" y1="152" y2="152" stroke="#e3e7ee"/><text x="382" y="156" text-anchor="end">-20</text><line x1="390" x2="730" y1="198" y2="198" stroke="#e3e7ee"/><text x="382" y="202" text-anchor="end">-30</text><line x1="390" x2="730" y1="244" y2="244" stroke="#e3e7ee"/><text x="382" y="248" text-anchor="end">-40</text><text x="348" y="152" text-anchor="middle" transform="rotate(-90 348 152)">Gain (dB)</text><text x="560" y="284" text-anchor="middle">Frequency (log scale)</text><line x1="560" x2="560" y1="60" y2="244" stroke="#e8710a" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="390" x2="730" y1="73.8" y2="73.8" stroke="#e8710a" stroke-dasharray="2 4" stroke-width="1.5"/><polyline fill="none" stroke="#1777b5" stroke-width="3" points="390.0,244.0 392.1,241.7 394.2,239.4 396.4,237.1 398.5,234.8 400.6,232.5 402.8,230.2 404.9,227.9 407.0,225.6 409.1,223.3 411.2,221.0 413.4,218.7 415.5,216.4 417.6,214.1 419.8,211.8 421.9,209.5 424.0,207.2 426.1,204.9 428.2,202.6 430.4,200.3 432.5,198.0 434.6,195.7 436.8,193.4 438.9,191.1 441.0,18