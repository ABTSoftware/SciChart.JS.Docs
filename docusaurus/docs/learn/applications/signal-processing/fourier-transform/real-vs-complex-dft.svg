<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 500"><title id="t">Real DFT and complex DFT: what goes in and what comes out</title><desc id="d">Top: the real DFT takes N real samples x[n], numbered 0 to N − 1, and returns two arrays of N/2 + 1 values, numbered 0 to N/2: Re X[k], the cosine amplitudes, and Im X[k], the sine amplitudes. Bottom: the complex DFT takes N complex samples (a real part and an imaginary part, which is all zeros for a real signal) and returns N complex values, Re X[k] and Im X[k], numbered 0 to N − 1. For a real signal the values above N/2 mirror those below it: Re X is symmetric about N/2 and Im X is antisymmetric. N = 8 is shown. Adapted from Burnett-Thompson (2007).</desc><rect width="720" height="500" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">Real DFT and complex DFT, shown for N = 8 samples</text><text x="30" y="64" fill="#1a1a2e" font-size="16" font-weight="700">Real DFT</text><text x="30" y="92" fill="#1F6FA8" font-size="14" font-weight="700">x[n]: N real samples</text><rect width="30" height="28" x="30" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="45" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="64" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="79" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="98" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="113" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="132" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="147" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="166" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="181" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><rect width="30" height="28" x="200" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="215" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">5</text><rect width="30" height="28" x="234" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="249" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">6</text><rect width="30" height="28" x="268" y="100" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="283" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">7</text><text x="45" y="144" fill="#666" font-size="12" text-anchor="middle">n = 0</text><text x="283" y="144" fill="#666" font-size="12" text-anchor="middle">N − 1</text><text x="420" y="92" fill="#C2610C" font-size="14" font-weight="700">Re X[k]: cosine amplitudes</text><rect width="30" height="28" x="420" y="100" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="435" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="454" y="100" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="469" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="488" y="100" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="503" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="522" y="100" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="537" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="556" y="100" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="571" y="119" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><text x="435" y="144" fill="#666" font-size="12" text-anchor="middle">k = 0</text><text x="571" y="144" fill="#666" font-size="12" text-anchor="middle">N/2</text><text x="596" y="119" fill="#666" font-size="12">N/2 + 1 values</text><text x="420" y="170" fill="#6B3FA0" font-size="14" font-weight="700">Im X[k]: sine amplitudes</text><rect width="30" height="28" x="420" y="178" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="435" y="197" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="454" y="178" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="469" y="197" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="488" y="178" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="503" y="197" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="522" y="178" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="537" y="197" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="556" y="178" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="571" y="197" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><text x="435" y="222" fill="#666" font-size="12" text-anchor="middle">k = 0</text><text x="571" y="222" fill="#666" font-size="12" text-anchor="middle">N/2</text><text x="596" y="197" fill="#666" font-size="12">N/2 + 1 values</text><line x1="318" x2="404" y1="126" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="361" y="118" fill="#444" font-size="12" text-anchor="middle">forward</text><line x1="404" x2="318" y1="170" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="361" y="188" fill="#444" font-size="12" text-anchor="middle">inverse</text><text x="30" y="170" fill="#444" font-size="13">N numbers in,</text><text x="30" y="188" fill="#444" font-size="13">N + 2 numbers out (Im X[0] and</text><text x="30" y="206" fill="#444" font-size="13">Im X[N/2] are always 0)</text><line x1="20" x2="700" y1="240" y2="240" stroke="#BBB" stroke-dasharray="6 4"/><text x="30" y="272" fill="#1a1a2e" font-size="16" font-weight="700">Complex DFT</text><text x="30" y="300" fill="#1F6FA8" font-size="14" font-weight="700">Re x[n]</text><rect width="30" height="28" x="30" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="45" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="64" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="79" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="98" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="113" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="132" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="147" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="166" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="181" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><rect width="30" height="28" x="200" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="215" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">5</text><rect width="30" height="28" x="234" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="249" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">6</text><rect width="30" height="28" x="268" y="308" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="283" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">7</text><text x="30" y="364" fill="#1F6FA8" font-size="14" font-weight="700">Im x[n]: all 0 for a real signal</text><rect width="30" height="28" x="30" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="45" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="64" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="79" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="98" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="113" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="132" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="147" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="166" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="181" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><rect width="30" height="28" x="200" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="215" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">5</text><rect width="30" height="28" x="234" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="249" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">6</text><rect width="30" height="28" x="268" y="372" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="283" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">7</text><text x="45" y="416" fill="#666" font-size="12" text-anchor="middle">n = 0</text><text x="283" y="416" fill="#666" font-size="12" text-anchor="middle">N − 1</text><text x="420" y="300" fill="#C2610C" font-size="14" font-weight="700">Re X[k]: cosine part</text><rect width="30" height="28" x="420" y="308" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="435" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="454" y="308" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="469" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="488" y="308" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="503" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="522" y="308" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="537" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="556" y="308" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="571" y="327" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><rect width="30" height="28" x="590" y="308" fill="#fff" stroke="#E07B17" stroke-dasharray="4 3" rx="5"/><text x="605" y="327" fill="#666" font-size="13" text-anchor="middle">5</text><rect width="30" height="28" x="624" y="308" fill="#fff" stroke="#E07B17" stroke-dasharray="4 3" rx="5"/><text x="639" y="327" fill="#666" font-size="13" text-anchor="middle">6</text><rect width="30" height="28" x="658" y="308" fill="#fff" stroke="#E07B17" stroke-dasharray="4 3" rx="5"/><text x="673" y="327" fill="#666" font-size="13" text-anchor="middle">7</text><text x="420" y="364" fill="#6B3FA0" font-size="14" font-weight="700">Im X[k]: sine part</text><rect width="30" height="28" x="420" y="372" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="435" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">0</text><rect width="30" height="28" x="454" y="372" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="469" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">1</text><rect width="30" height="28" x="488" y="372" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="503" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">2</text><rect width="30" height="28" x="522" y="372" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="537" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">3</text><rect width="30" height="28" x="556" y="372" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="571" y="391" fill="#1a1a2e" font-size="13" text-anchor="middle">4</text><rect width="30" height="28" x="590" y="372" fill="#fff" stroke="#6B3FA0" stroke-dasharray="4 3" rx="5"/><text x="605" y="391" fill="#666" font-size="13" text-anchor="middle">5</text><rect width="30" height="28" x="624" y="372" fill="#fff" stroke="#6B3FA0" stroke-dasharray="4 3" rx="5"/><text x="639" y="391" fill="#666" font-size="13" text-anchor="middle">6</text><rect width="30" height="28" x="658" y="372" fill="#fff" stroke="#6B3FA0" stroke-dasharray="4 3" rx="5"/><text x="673" y="391" fill="#666" font-size="13" text-anchor="middle">7</text><text x="435" y="416" fill="#666" font-size="12" text-anchor="middle">k = 0</text><text x="571" y="416" fill="#666" font-size="12" text-anchor="middle">N/2</text><text x="673" y="416" fill="#666" font-size="12" text-anchor="middle">N − 1</text><line x1="318" x2="404" y1="334" y2="334" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="361" y="326" fill="#444" font-size="12" text-anchor="middle">forward</text><line x1="404" x2="318" y1="378" y2="378" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="361" y="396" fill="#444" font-size="12" text-anchor="middle">inverse</text><text x="30" y="440" fill="#444" font-size="13">N complex values in, N complex values out.</text><text x="30" y="462" fill="#444" font-size="13">For a real signal, the dashed bins 5 to 7 mirror bins 3 to 1: Re X is symmetric about N/2,</text><text x="30" y="482" fill="#444" font-size="13">Im X is antisymmetric. Bins 0 to N/2 hold the same numbers as the real DFT.</text></svg>