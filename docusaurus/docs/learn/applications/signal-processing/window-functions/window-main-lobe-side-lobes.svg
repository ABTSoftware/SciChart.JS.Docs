<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 760 460"><title id="t">Anatomy of a window&apos;s spectrum: main lobe and side lobes</title><desc id="d">The spectrum a Hann window gives a single tone, in decibels, from 10 bins below to 10 bins above the tone, with the rectangular window&apos;s spectrum in grey for comparison. The Hann main lobe reaches its first nulls 2 bins either side of the tone; it is 1.44 bins wide at -3 dB and 2 bins wide at -6 dB. Half a bin from the centre it is 1.42 dB down, which is the scalloping loss. Its highest side lobe is -31.5 dB and the side lobes fall by about 18 dB per octave. The rectangular window&apos;s main lobe is narrower, with nulls at plus and minus 1 bin, but its highest side lobe is -13.3 dB and its side lobes fall by only 6 dB per octave.</desc><rect width="760" height="460" fill="#fff"/><text x="24" y="30" fill="#111827" font-size="18" font-weight="700">A window&apos;s spectrum: one main lobe, many side lobes</text><text x="24" y="50" fill="#374151" font-size="13">Level in dB for a single tone at bin 0, Hann window (blue) and no window (grey)</text><line x1="70" x2="720" y1="60" y2="60" stroke="#e5e7eb"/><text x="62" y="64" fill="#374151" font-size="13" text-anchor="end">0</text><line x1="70" x2="720" y1="126" y2="126" stroke="#e5e7eb"/><text x="62" y="130" fill="#374151" font-size="13" text-anchor="end">-20</text><line x1="70" x2="720" y1="192" y2="192" stroke="#e5e7eb"/><text x="62" y="196" fill="#374151" font-size="13" text-anchor="end">-40</text><line x1="70" x2="720" y1="258" y2="258" stroke="#e5e7eb"/><text x="62" y="262" fill="#374151" font-size="13" text-anchor="end">-60</text><line x1="70" x2="720" y1="324" y2="324" stroke="#e5e7eb"/><text x="62" y="328" fill="#374151" font-size="13" text-anchor="end">-80</text><line x1="70" x2="720" y1="390" y2="390" stroke="#e5e7eb"/><text x="62"