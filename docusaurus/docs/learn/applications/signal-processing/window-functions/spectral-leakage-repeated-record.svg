<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 760 470"><title id="t">Why spectral leakage happens</title><desc id="d">Top row: a record holding exactly 4 cycles of a sine wave. The DFT treats the record as if it repeated, and the copies join smoothly, so the spectrum is a single line at bin 4 with nothing in the other bins. Bottom row: a record holding 4.5 cycles. Where the copies join there is a jump, and the spectrum spreads into every bin: about -4 dB at bins 4 and 5, and is still about -27 dB ten bins away. Multiplying the record by a Hann window removes the jump: its spectrum, drawn as a dashed line, is wider at the peak but falls below -60 dB about seven bins from it.</desc><rect width="760" height="470" fill="#fff"/><text x="24" y="30" fill="#111827" font-size="18" font-weight="700">The DFT sees your record repeated end to end</text><text x="24" y="84" fill="#111827" font-size="15" font-weight="600">Exactly 4 cycles in the record: the copies join smoothly</text><rect width="140" height="130" x="164" y="100" fill="#50C7E0" fill-opacity=".12"/><line x1="164" x2="164" y1="96" y2="234" stroke="#6b7280" stroke-dasharray="4 3"/><line x1="304" x2="304" y1="96" y2="234" stroke="#6b7280" stroke-dasharray="4 3"/><line x1="24" x2="444" y1="165" y2="165" stroke="#e5e7eb"/><path fill="none" stroke="#1f6f8b" stroke-width="2" d="m24 118.7 2.2-7.8 2.2.4 2.2 8.5 2.2 15.5 2.1 20 2.2 21.4 2.2 19.7 2.2 14.9 2.2 7.8 2.2-.4 2.2-8.5 2.2-15.5 2.1-20 2.2-21.4 2.2-19.7 2.2-14.9 2.2-7.8 2.2.4 2.2 8.5 2.2 15.5 2.1 20 2.2 21.4 2.2 19.7 2.2 14.9 2.2 7.8 2.2-.4 2.2-8.5 2.2-15.5 2.1-20 2.2-21.4 2.2-19.7 2.2-14.9 2.2-7.8 2.2.4 2.2 8.5 2.2 15.5 2.1 20 2.2 21.4 2.2 19.7 2.2 14.9 2.2 7.8 2.2-.4 2.2-8.5 2.2-15.5 2.1-20 2.2-21.4 2.2-19.7 2.2-14.9 2.2-7.8 2.2.4 2.2 8.5 2.2 15.5 2.1 20 2.2 21.4 2.2 19.7 2.2 14.9 2.2 7.8 2.2-.4 2.2-8.5 2.2-15.5 2.1-20 2.2-21.4 2.2-19.7 