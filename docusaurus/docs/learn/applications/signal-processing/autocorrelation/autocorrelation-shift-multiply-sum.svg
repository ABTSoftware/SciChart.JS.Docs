<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 720 490"><title>Autocorrelation step by step: a signal, a copy shifted by 3 samples, and the autocorrelation at every lag</title><desc>Top: the signal x = 0, 3, 0, 0, 3, 0, 0, 3, 0 drawn as stems. Middle: the same signal shifted left by 3 samples, so its spikes sit under the original spikes. Bottom: the normalised autocorrelation r[k] for lags 0 to 8, which is 1 at lag 0, negative at lags 1 and 2, and peaks again at lag 3 (0.67) and lag 6 (0.33), showing a period of 3 samples.</desc><rect width="720" height="490" fill="#fff"/><line x1="190" x2="694" y1="100" y2="100" stroke="#8a94a6"/><text x="20" y="72" fill="#1b2a47" font-weight="700">Signal x[n]</text><text x="20" y="90" fill="#5a6478" font-size="12">n = 0 … 8</text><line x1="210" x2="210" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="210" cy="100" r="5" fill="#2a7fb8"/><text x="210" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="268" x2="268" y1="100" y2="46" stroke="#2a7fb8" stroke-width="3"/><circle cx="268" cy="46" r="5" fill="#2a7fb8"/><text x="268" y="118" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="326" x2="326" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="326" cy="100" r="5" fill="#2a7fb8"/><text x="326" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="384" x2="384" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="384" cy="100" r="5" fill="#2a7fb8"/><text x="384" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="442" x2="442" y1="100" y2="46" stroke="#2a7fb8" stroke-width="3"/><circle cx="442" cy="46" r="5" fill="#2a7fb8"/><text x="442" y="118" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="500" x2="500" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="500" cy="100" r="5" fill="#2a7fb8"/><text x="500" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="558" x2="558" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="558" cy="100" r="5" fill="#2a7fb8"/><text x="558" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="616" x2="616" y1="100" y2="46" stroke="#2a7fb8" stroke-width="3"/><circle cx="616" cy="46" r="5" fill="#2a7fb8"/><text x="616" y="118" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="674" x2="674" y1="100" y2="100" stroke="#2a7fb8" stroke-width="3"/><circle cx="674" cy="100" r="5" fill="#2a7fb8"/><text x="674" y="118" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="190" x2="694" y1="215" y2="215" stroke="#8a94a6"/><text x="20" y="187" fill="#1b2a47" font-weight="700">Copy x[n + 3]</text><text x="20" y="205" fill="#5a6478" font-size="12">shifted by lag k = 3</text><line x1="210" x2="210" y1="215" y2="215" stroke="#d9711c" stroke-width="3"/><circle cx="210" cy="215" r="5" fill="#d9711c"/><text x="210" y="233" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="268" x2="268" y1="215" y2="161" stroke="#d9711c" stroke-width="3"/><circle cx="268" cy="161" r="5" fill="#d9711c"/><text x="268" y="233" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="326" x2="326" y1="215" y2="215" stroke="#d9711c" stroke-width="3"/><circle cx="326" cy="215" r="5" fill="#d9711c"/><text x="326" y="233" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="384" x2="384" y1="215" y2="215" stroke="#d9711c" stroke-width="3"/><circle cx="384" cy="215" r="5" fill="#d9711c"/><text x="384" y="233" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="442" x2="442" y1="215" y2="161" stroke="#d9711c" stroke-width="3"/><circle cx="442" cy="161" r="5" fill="#d9711c"/><text x="442" y="233" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="500" x2="500" y1="215" y2="215" stroke="#d9711c" stroke-width="3"/><circle cx="500" cy="215" r="5" fill="#d9711c"/><text x="500" y="233" fill="#5a6478" font-size="12" text-anchor="middle">0</text><text x="558" y="233" fill="#a0a8b8" font-size="12" text-anchor="middle">–</text><text x="616" y="233" fill="#a0a8b8" font-size="12" text-anchor="middle">–</text><text x="674" y="233" fill="#a0a8b8" font-size="12" text-anchor="middle">–</text><line x1="268" x2="268" y1="126" y2="155" stroke="#3a9a5b" stroke-dasharray="4 4" stroke-width="2"/><line x1="442" x2="442" y1="126" y2="155" stroke="#3a9a5b" stroke-dasharray="4 4" stroke-width="2"/><text x="510" y="175" fill="#3a9a5b" font-size="13">spikes line up: a strong match</text><line x1="190" x2="694" y1="380" y2="380" stroke="#8a94a6"/><text x="20" y="352" fill="#1b2a47" font-weight="700">Autocorrelation r[k]</text><text x="20" y="370" fill="#5a6478" font-size="12">normalised, r[0] = 1</text><line x1="210" x2="210" y1="380" y2="305" stroke="#1b2a47" stroke-width="3"/><circle cx="210" cy="305" r="5" fill="#1b2a47"/><text x="210" y="295" fill="#1b2a47" font-size="12" text-anchor="middle">1.00</text><text x="210" y="462" fill="#5a6478" font-size="12" text-anchor="middle">0</text><line x1="268" x2="268" y1="380" y2="421.7" stroke="#1b2a47" stroke-width="3"/><circle cx="268" cy="421.7" r="5" fill="#1b2a47"/><text x="268" y="439.7" fill="#1b2a47" font-size="12" text-anchor="middle">-0.56</text><text x="268" y="462" fill="#5a6478" font-size="12" text-anchor="middle">1</text><line x1="326" x2="326" y1="380" y2="400.9" stroke="#1b2a47" stroke-width="3"/><circle cx="326" cy="400.9" r="5" fill="#1b2a47"/><text x="326" y="418.9" fill="#1b2a47" font-size="12" text-anchor="middle">-0.28</text><text x="326" y="462" fill="#5a6478" font-size="12" text-anchor="middle">2</text><line x1="384" x2="384" y1="380" y2="330" stroke="#3a9a5b" stroke-width="3"/><circle cx="384" cy="330" r="5" fill="#3a9a5b"/><text x="384" y="320" fill="#3a9a5b" font-size="12" text-anchor="middle">0.67</text><text x="384" y="462" fill="#5a6478" font-size="12" text-anchor="middle">3</text><line x1="442" x2="442" y1="380" y2="409.2" stroke="#1b2a47" stroke-width="3"/><circle cx="442" cy="409.2" r="5" fill="#1b2a47"/><text x="442" y="427.2" fill="#1b2a47" font-size="12" text-anchor="middle">-0.39</text><text x="442" y="462" fill="#5a6478" font-size="12" text-anchor="middle">4</text><line x1="500" x2="500" y1="380" y2="388.3" stroke="#1b2a47" stroke-width="3"/><circle cx="500" cy="388.3" r="5" fill="#1b2a47"/><text x="500" y="406.3" fill="#1b2a47" font-size="12" text-anchor="middle">-0.11</text><text x="500" y="462" fill="#5a6478" font-size="12" text-anchor="middle">5</text><line x1="558" x2="558" y1="380" y2="355" stroke="#3a9a5b" stroke-width="3"/><circle cx="558" cy="355" r="5" fill="#3a9a5b"/><text x="558" y="345" fill="#3a9a5b" font-size="12" text-anchor="middle">0.33</text><text x="558" y="462" fill="#5a6478" font-size="12" text-anchor="middle">6</text><line x1="616" x2="616" y1="380" y2="396.6" stroke="#1b2a47" stroke-width="3"/><circle cx="616" cy="396.6" r="5" fill="#1b2a47"/><text x="616" y="414.6" fill="#1b2a47" font-size="12" text-anchor="middle">-0.22</text><text x="616" y="462" fill="#5a6478" font-size="12" text-anchor="middle">7</text><line x1="674" x2="674" y1="380" y2="375.8" stroke="#1b2a47" stroke-width="3"/><circle cx="674" cy="375.8" r="5" fill="#1b2a47"/><text x="674" y="365.8" fill="#1b2a47" font-size="12" text-anchor="middle">0.06</text><text x="674" y="462" fill="#5a6478" font-size="12" text-anchor="middle">8</text><text x="442" y="482" fill="#5a6478" font-size="12" text-anchor="middle">lag k (samples)</text><text x="396" y="303.98" fill="#3a9a5b" font-size="13">repeats every 3 samples</text><text x="222" y="309" fill="#1b2a47" font-size="13">lag 0: a perfect match</text></svg>