<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 310"><title>SNR in decibels as a power ratio and as an amplitude ratio</title><desc>A scale of signal-to-noise ratios from 0 to 60 dB. Below each value are the matching power ratio, ten to the power dB over 10, and RMS amplitude ratio, ten to the power dB over 20. For example 20 dB is a power ratio of 100 and an amplitude ratio of 10. Notes show that adding 3 dB doubles the power, adding 6 dB doubles the amplitude, and adding 10 dB multiplies the power by ten.</desc><rect width="760" height="310" fill="#fff"/><text x="30" y="36" fill="#1f2a44" font-size="16" font-weight="700">One SNR, three ways to write it</text><text x="30" y="58" fill="#4a5568" font-size="13">dB = 10 log₁₀(power ratio) = 20 log₁₀(RMS amplitude ratio)</text><line x1="150" x2="730" y1="120" y2="120" stroke="#1f2a44" stroke-width="2"/><text x="30" y="125" fill="#1f2a44" font-weight="700">SNR (dB)</text><text x="30" y="175" fill="#1f6fb2" font-weight="700">Power ratio</text><text x="30" y="215" fill="#e08a1e" font-weight="700">Amplitude ratio</text><line x1="150" x2="150" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="150" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">0</text><line x1="150" x2="150" y1="134" y2="228" stroke="#e1e6ef"/><text x="150" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">1</text><text x="150" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">1</text><line x1="232.9" x2="232.9" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="232.9" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">3</text><line x1="232.9" x2="232.9" y1="134" y2="228" stroke="#e1e6ef"/><text x="232.9" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">2</text><text x="232.9" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">1.41</text><line x1="315.7" x2="315.7" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="315.7" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">6</text><line x1="315.7" x2="315.7" y1="134" y2="228" stroke="#e1e6ef"/><text x="315.7" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">3.98</text><text x="315.7" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">2</text><line x1="398.6" x2="398.6" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="398.6" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">10</text><line x1="398.6" x2="398.6" y1="134" y2="228" stroke="#e1e6ef"/><text x="398.6" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">10</text><text x="398.6" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">3.16</text><line x1="481.4" x2="481.4" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="481.4" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">20</text><line x1="481.4" x2="481.4" y1="134" y2="228" stroke="#e1e6ef"/><text x="481.4" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">100</text><text x="481.4" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">10</text><line x1="564.3" x2="564.3" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="564.3" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">30</text><line x1="564.3" x2="564.3" y1="134" y2="228" stroke="#e1e6ef"/><text x="564.3" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">1,000</text><text x="564.3" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">32</text><line x1="647.1" x2="647.1" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="647.1" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">40</text><line x1="647.1" x2="647.1" y1="134" y2="228" stroke="#e1e6ef"/><text x="647.1" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">10,000</text><text x="647.1" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">100</text><line x1="730" x2="730" y1="112" y2="128" stroke="#1f2a44" stroke-width="2"/><text x="730" y="104" fill="#1f2a44" font-weight="700" text-anchor="middle">60</text><line x1="730" x2="730" y1="134" y2="228" stroke="#e1e6ef"/><text x="730" y="175" fill="#1f6fb2" font-size="13" text-anchor="middle">1,000,000</text><text x="730" y="215" fill="#e08a1e" font-size="13" text-anchor="middle">1,000</text><rect width="170" height="52" x="30" y="248" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="42" y="269" fill="#1f6fb2" font-weight="700">+3 dB</text><text x="42" y="289" fill="#4a5568" font-size="13">doubles the power</text><rect width="170" height="52" x="210" y="248" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="222" y="269" fill="#e08a1e" font-weight="700">+6 dB</text><text x="222" y="289" fill="#4a5568" font-size="13">doubles the amplitude</text><rect width="170" height="52" x="390" y="248" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="402" y="269" fill="#1f2a44" font-weight="700">+10 dB</text><text x="402" y="289" fill="#4a5568" font-size="13">10 × the power</text><rect width="170" height="52" x="570" y="248" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="582" y="269" fill="#4a5568" font-weight="700">0 dB</text><text x="582" y="289" fill="#4a5568" font-size="13">signal and noise equal</text></svg>