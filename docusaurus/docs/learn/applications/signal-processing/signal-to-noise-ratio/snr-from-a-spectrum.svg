<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 430"><title>How to measure SNR from a power spectrum</title><desc>A sketch of a power spectrum: a flat, ragged noise floor and one tall signal peak. The signal power is the sum of the bins in the peak. The noise power is the noise density times the measurement bandwidth, shaded between two frequencies. The SNR is the signal power divided by that noise power. A note warns that the height of the peak above the floor is not the SNR, because the floor drops as the bins get narrower.</desc><rect width="760" height="430" fill="#fff"/><text x="80" y="40" fill="#1f2a44" font-size="16" font-weight="700">Measuring SNR from a power spectrum</text><rect width="480" height="260" x="80" y="70" fill="#f6f8fb" stroke="#c9d2e0"/><rect width="300" height="260" x="170" y="70" fill="#2a8c7e" fill-opacity=".12"/><line x1="170" x2="170" y1="70" y2="330" stroke="#2a8c7e" stroke-dasharray="5 4"/><line x1="470" x2="470" y1="70" y2="330" stroke="#2a8c7e" stroke-dasharray="5 4"/><line x1="170" x2="470" y1="352" y2="352" stroke="#2a8c7e" stroke-width="2"/><path fill="#2a8c7e" d="m170 352 8-5v10zm300 0-8-5v10z"/><text x="320" y="372" fill="#2a8c7e" font-weight="700" text-anchor="middle">Measurement bandwidth B</text><text x="320" y="400" fill="#4a5568" font-size="13" text-anchor="middle">Frequency</text><text x="66" y="200" fill="#4a5568" font-size="13" text-anchor="middle" transform="rotate(-90 66 200)">Power (dB)</text><polyline fill="none" stroke="#1f6fb2" stroke-width="1.6" points="80,255.9 84,263.9 88,267.0 92,259.4 96,255.4 100,261.7 104,264.4 108,267.5 112,255.9 116,255.5 120,265.5 124,264.4 128,269.7 132,266.9 136,261.5 140,260.6 144,274.9 148,260.6 152,258.1 156,256.3 160,262.5 164,262.7 168,260.3 172,261.7 176,263.4 180,265.5 184,267.5 188,263.0 192,253.1 196,265.5 200,254.9 204,261.1 208,254.6 212,262.0 216,258.1 220,263.1 224,278.5 228,261.8 232,266.2 236,255.4 240,260.6 244,265.3 248,261.5 252,263.9 256,262.5 260,257.0 264,264.8 268,257.9 272,271.4 276,259.5 280,265.4 284,262.0 288,266.8 292,258.8 296,263.9 300,239.3 304,186.8 308,108.4 312,106.0 316,176.6 320,243.8 324,261.2 328,270.0 332,260.1 336,264.8 340,264.5 344,263.4 348,263.0 352,262.9 356,259.0 360,256.9 364,260.0 368,265.0 372,269.6 376,266.9 380,267.3 384,265.9 388,265.5 392,262.9 396,265.9 400,270.9 404,260.4 408,258.5 412,271.8 416,263.2 420,266.9 424,266.4 428,256.3 432,274.2 436,270.9 440,262.9 444,265.8 448,262.6 452,257.6 456,261.4 460,263.9 464,267.6 468,265.5 472,262.3 476,268.8 480,258.2 484,266.0 488,267.6 492,260.5 496,253.0 500,257.5 504,263.2 508,264.6 512,269.7 516,257.0 520,262.0 524,265.2 528,261.2 532,250.2 536,266.0 540,273.6 544,267.0 548,257.4 552,259.9 556,263.1 560,274.4"/><line x1="80" x2="560" y1="262" y2="262" stroke="#e08a1e" stroke-dasharray="7 4" stroke-width="2"/><text x="554" y="290" fill="#e08a1e" font-size="13" font-weight="700" text-anchor="end">Noise floor: density N₀ per Hz</text><text x="326" y="102" fill="#1f2a44" font-size="13" font-weight="700">Signal peak</text><text x="326" y="120" fill="#4a5568" font-size="13">Pₛ = sum of its bins</text><line x1="270" x2="270" y1="94" y2="258" stroke="#4a5568" stroke-dasharray="3 3"/><path fill="#4a5568" d="m270 92-5 9h10zm0 168-5-9h10z"/><text x="262" y="172" fill="#4a5568" font-size="13" text-anchor="end">peak-to-floor</text><text x="262" y="189" fill="#4a5568" font-size="13" text-anchor="end">height</text><rect width="160" height="64" x="585" y="70" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="595" y="94" fill="#1f2a44" font-weight="700">1. Signal power</text><text x="595" y="112" fill="#4a5568" font-size="12">Pₛ = sum of the</text><text x="595" y="127" fill="#4a5568" font-size="12">peak&apos;s bins</text><rect width="160" height="64" x="585" y="148" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="595" y="172" fill="#2a8c7e" font-weight="700">2. Noise power</text><text x="595" y="190" fill="#4a5568" font-size="12">Pₙ = N₀ × B</text><rect width="160" height="64" x="585" y="226" fill="#f6f8fb" stroke="#c9d2e0" rx="8"/><text x="595" y="250" fill="#1f6fb2" font-weight="700">3. SNR</text><text x="595" y="268" fill="#4a5568" font-size="12">Pₛ / Pₙ, or</text><text x="595" y="283" fill="#4a5568" font-size="12">10 log₁₀(Pₛ / Pₙ) dB</text><rect width="160" height="84" x="585" y="304" fill="#fff4e5" stroke="#e08a1e" rx="8"/><text x="595" y="326" fill="#1f2a44" font-size="12" font-weight="700">Peak-to-floor height</text><text x="595" y="343" fill="#1f2a44" font-size="12">is not the SNR: the</text><text x="595" y="360" fill="#1f2a44" font-size="12">floor drops 3 dB each</text><text x="595" y="377" fill="#1f2a44" font-size="12">time the bins halve</text></svg>