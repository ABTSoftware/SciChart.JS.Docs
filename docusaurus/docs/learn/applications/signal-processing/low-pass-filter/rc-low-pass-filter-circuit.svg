<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 700 330"><title id="t">RC low-pass filter circuit</title><desc id="d">A resistor R in series between the input and the output, and a capacitor C from the output to ground. The cutoff frequency is 1 divided by 2 pi R C. With R of 1 kilohm and C of 220 nanofarads the cutoff is about 723 hertz.</desc><rect width="700" height="330" fill="#fff"/><g fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><circle cx="70" cy="70" r="6" fill="#fff"/><circle cx="70" cy="210" r="6" fill="#fff"/><line x1="76" x2="170" y1="70" y2="70"/><polyline points="170,70 180,52 196,88 212,52 228,88 244,52 260,88 270,70"/><line x1="270" x2="574" y1="70" y2="70"/><circle cx="380" cy="70" r="5" fill="#222"/><circle cx="580" cy="70" r="6" fill="#fff"/><line x1="380" x2="380" y1="70" y2="128"/><line x1="350" x2="410" y1="128" y2="128" stroke-width="4"/><line x1="350" x2="410" y1="144" y2="144" stroke-width="4"/><line x1="380" x2="380" y1="144" y2="210"/><line x1="76" x2="574" y1="210" y2="210"/><circle cx="380" cy="210" r="5" fill="#222"/><circle cx="580" cy="210" r="6" fill="#fff"/></g><g stroke="#222" stroke-width="2.5"><line x1="380" x2="380" y1="210" y2="232"/><line x1="362" x2="398" y1="232" y2="232"/><line x1="368" x2="392" y1="239" y2="239"/><line x1="374" x2="386" y1="246" y2="246"/></g><g fill="#222" font-size="17"><text x="220" y="40" font-weight="700" text-anchor="middle">R</text><text x="422" y="142" font-weight="700">C</text><text x="62" y="76" text-anchor="end">V<tspan dy="4" font-size="13">in</tspan></text><text x="598" y="76">V<tspan dy="4" font-size="13">out</tspan></text><text x="62" y="216" text-anchor="end">0 V</text><text x="598" y="216">0 V</text></g><g fill="#2a6fdb" font-size="14"><text x="460" y="112">Slow changes: C charges</text><text x="460" y="130">fully, V<tspan dy="3" font-size="11">out</tspan><tspan dy="-3"> follows V</tspan><tspan dy="3" font-size="11">in</tspan></text></g><g fill="#d1495b" font-size="14"><text x="460" y="160">Fast changes: C looks like</text><text x="460" y="178">a short to 0 V, little gets out</text></g><rect width="560" height="52" x="70" y="262" fill="#f2f5fa" stroke="#c9d3e3" rx="8"/><text x="350" y="286" fill="#222" font-size="18" text-anchor="middle">f<tspan dy="4" font-size="13">c</tspan><tspan dy="-4"> = 1 / (2π R C)</tspan></text><text x="350" y="306" fill="#444" font-size="14" text-anchor="middle">Example: R = 1 kΩ, C = 220 nF → f<tspan dy="3" font-size="11">c</tspan><tspan dy="-3"> = 1 / (2π × 1000 × 0.00000022) ≈ 723 Hz</tspan></text></svg>