<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 390"><title id="t">Two ways to convolve: the direct sum, or FFT, multiply and inverse FFT</title><desc id="d">The input x[n] = [1, 2, 3] (N = 3 samples) and the kernel h[n] = [0, 1, 0.5] (M = 3 samples) reach the same output y[n] = [0, 1, 2.5, 4, 1.5], N + M − 1 = 5 samples, by two routes. Route 1, direct: the convolution sum y[n] = Σ x[k] h[n − k], about N × M multiplications. Route 2, fast convolution: zero-pad both to a length L of at least N + M − 1 (here 8), take the FFT of each, multiply the spectra bin by bin, Y[k] = X[k] · H[k], then take the inverse FFT and keep the first N + M − 1 samples, about L log₂ L operations. Adapted from Burnett-Thompson (2007).</desc><rect width="720" height="390" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">Convolution two ways: same answer, different cost</text><rect width="190" height="52" x="20" y="56" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><text x="30" y="78" fill="#1F6FA8" font-size="14" font-weight="700">x[n] = [1, 2, 3]</text><text x="30" y="98" fill="#666" font-size="12">signal, N = 3 samples</text><rect width="190" height="52" x="20" y="122" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="30" y="144" fill="#C2610C" font-size="14" font-weight="700">h[n] = [0, 1, 0.5]</text><text x="30" y="164" fill="#666" font-size="12">kernel, M = 3 samples</text><rect width="258" height="90" x="258" y="70" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="387" y="92" fill="#6B3FA0" font-size="14" font-weight="700" text-anchor="middle">Route 1: direct</text><text x="387" y="118" fill="#1a1a2e" font-size="15" text-anchor="middle">y[n] = Σ<tspan baseline-shift="sub" font-size="10">k</tspan> x[k] · h[n − k]</text><text x="387" y="146" fill="#666" font-size="12" text-anchor="middle">about N × M multiplications</text><line x1="210" x2="256" y1="82" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="210" x2="256" y1="148" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="165" height="70" x="540" y="80" fill="#E3F4EA" stroke="#2E8B57" rx="5"/><text x="622" y="104" fill="#1E6B41" font-size="14" font-weight="700" text-anchor="middle">y = [0, 1, 2.5, 4, 1.5]</text><text x="622" y="122" fill="#666" font-size="12" text-anchor="middle">N + M − 1 = 5 samples</text><line x1="516" x2="538" y1="115" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="84" y="214" fill="#1a1a2e" font-size="14" font-weight="700">Route 2: fast convolution with the FFT, about L log₂ L operations</text><rect width="160" height="96" x="20" y="230" fill="#F3F3F3" stroke="#BBB" stroke-dasharray="4 3" rx="5"/><text x="100" y="254" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">1. Zero-pad</text><text x="100" y="278" fill="#1a1a2e" font-size="13" text-anchor="middle">both to length L</text><text x="100" y="297" fill="#444" font-size="13" text-anchor="middle">L ≥ N + M − 1</text><text x="100" y="316" fill="#444" font-size="13" text-anchor="middle">(here L = 8)</text><line x1="181" x2="194" y1="278" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="96" x="195" y="230" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="275" y="254" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">2. FFT each</text><text x="275" y="278" fill="#1a1a2e" font-size="13" text-anchor="middle">X[k] and H[k]</text><text x="275" y="297" fill="#444" font-size="13" text-anchor="middle">L bins each</text><line x1="356" x2="369" y1="278" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="96" x="370" y="230" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="450" y="254" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">3. Multiply</text><text x="450" y="278" fill="#1a1a2e" font-size="13" text-anchor="middle">Y[k] = X[k] · H[k]</text><text x="450" y="297" fill="#444" font-size="13" text-anchor="middle">bin by bin</text><line x1="531" x2="544" y1="278" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="96" x="545" y="230" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="625" y="254" fill="#1a1a2e" font-size="13.5" font-weight="700" text-anchor="middle">4. Inverse FFT</text><text x="625" y="278" fill="#1a1a2e" font-size="13" text-anchor="middle">y[n] = IFFT{Y[k]}</text><text x="625" y="297" fill="#444" font-size="13" text-anchor="middle">keep the first</text><text x="625" y="316" fill="#444" font-size="13" text-anchor="middle">N + M − 1 samples</text><path fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" d="M60 176v50"/><path fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" d="M622 228v-76"/><text x="20" y="350" fill="#444" font-size="13">Both routes give the same y[n]. Skip the zero-padding and the FFT route wraps the tail back onto</text><text x="20" y="370" fill="#444" font-size="13">the start (circular convolution).</text></svg>