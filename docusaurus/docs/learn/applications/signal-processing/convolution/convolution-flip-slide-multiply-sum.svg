<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 720 330"><title id="t">How one output sample of a convolution is computed</title><desc id="d">The kernel h = [0, 1, 0.5] is flipped to [0.5, 1, 0], slid so its right end sits under k = 2 of the input x = [1, 2, 3], multiplied sample by sample to give 0.5, 2 and 0, and summed to give y[2] = 2.5.</desc><rect width="720" height="330" fill="#fff"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#555" d="m0 0 10 5-10 5z"/></marker></defs><text x="360" y="28" fill="#1a1a2e" font-size="18" font-weight="700" text-anchor="middle">Computing y[2] for x = [1, 2, 3] and h = [0, 1, 0.5]</text><text x="40" y="70" fill="#C2610C" font-size="14" font-weight="700">Kernel h[k]</text><g fill="#1a1a2e" font-size="16" text-anchor="middle"><rect width="50" height="34" x="40" y="80" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="95" y="80" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="150" y="80" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="65" y="103">0</text><text x="120" y="103">1</text><text x="175" y="103">0.5</text></g><g fill="#666" font-size="12" text-anchor="middle"><text x="65" y="129">k = 0</text><text x="120" y="129">1</text><text x="175" y="129">2</text></g><line x1="120" x2="120" y1="137" y2="163" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/><text x="132" y="155" fill="#1a1a2e" font-size="14" font-weight="700">1. Flip</text><text x="40" y="185" fill="#C2610C" font-size="14" font-weight="700">Flipped h[−k]</text><g fill="#1a1a2e" font-size="16" text-anchor="middle"><rect width="50" height="34" x="40" y="195" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="95" y="195" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="150" y="195" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="65" y="218">0.5</text><text x="120" y="218">1</text><text x="175" y="218">0</text></g><g fill="#666" font-size="12" text-anchor="middle"><text x="65" y="244">k = −2</text><text x="120" y="244">−1</text><text x="175" y="244">0</text></g><path fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" d="M205 212c35 0 40-45 85-45"/><text x="40" y="276" fill="#1a1a2e" font-size="14" font-weight="700">2. Slide it right by n = 2</text><text x="40" y="296" fill="#444" font-size="13">so its last sample sits under k = 2</text><g fill="#666" font-size="12" text-anchor="middle"><text x="414" y="66">k = 0</text><text x="474" y="66">1</text><text x="534" y="66">2</text><text x="594" y="66">3</text><text x="654" y="66">4</text></g><g font-size="14" font-weight="700" text-anchor="end"><text x="376" y="98" fill="#1F6FA8">Input x[k]</text><text x="376" y="153" fill="#C2610C">h[2 − k]</text><text x="376" y="208" fill="#6B3FA0">3. Multiply</text></g><g fill="#1a1a2e" font-size="16" text-anchor="middle"><rect width="50" height="34" x="389" y="76" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><rect width="50" height="34" x="449" y="76" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><rect width="50" height="34" x="509" y="76" fill="#DCEEFB" stroke="#2B8CBE" rx="5"/><rect width="50" height="34" x="569" y="76" fill="#F3F3F3" stroke="#BBB" stroke-dasharray="4 3" rx="5"/><rect width="50" height="34" x="629" y="76" fill="#F3F3F3" stroke="#BBB" stroke-dasharray="4 3" rx="5"/><text x="414" y="99">1</text><text x="474" y="99">2</text><text x="534" y="99">3</text><text x="594" y="99" fill="#999">0</text><text x="654" y="99" fill="#999">0</text><rect width="50" height="34" x="389" y="131" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="449" y="131" fill="#FDEBD7" stroke="#E07B17" rx="5"/><rect width="50" height="34" x="509" y="131" fill="#FDEBD7" stroke="#E07B17" rx="5"/><text x="414" y="154">0.5</text><text x="474" y="154">1</text><text x="534" y="154">0</text><rect width="50" height="34" x="389" y="186" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><rect width="50" height="34" x="449" y="186" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><rect width="50" height="34" x="509" y="186" fill="#EEE5F8" stroke="#6B3FA0" rx="5"/><text x="414" y="209">0.5</text><text x="474" y="209">2</text><text x="534" y="209">0</text></g><g fill="#666" font-size="12" text-anchor="middle"><text x="414" y="236">1 × 0.5</text><text x="474" y="236">2 × 1</text><text x="534" y="236">3 × 0</text></g><rect width="290" height="44" x="389" y="252" fill="#E3F4EA" stroke="#2E8B57" rx="8"/><text x="534" y="280" fill="#1a1a2e" font-size="17" text-anchor="middle"><tspan font-weight="700">4. Sum:</tspan> y[2] = 0.5 + 2 + 0 = <tspan fill="#1E6B41" font-weight="700">2.5</tspan></text><text x="534" y="318" fill="#444" font-size="13" text-anchor="middle">Repeat for n = 0 … 4 to get y = [0, 1, 2.5, 4, 1.5]</text></svg>