<text x="528" y="304" fill="#000">Pole at s = 1</text>
<text x="80" y="77" fill="#1f4e79" font-weight="600">Critical strip, 0 &lt; σ &lt; 1 (shaded)</text>
<text x="80" y="97" fill="#1f4e79">All the non-trivial zeros lie in it</text>
<text x="80" y="158.39999999999998" fill="#d9534f" font-weight="600">Critical line, σ = ½ (dashed)</text>
<text x="80" y="178.39999999999998" fill="#8a1f1b">Riemann hypothesis: every non-trivial</text>
<text x="80" y="196.39999999999998" fill="#8a1f1b">zero lies on this line</text>
<text x="80" y="380.4" fill="#333">Zeros come in mirror-image pairs:</text>
<text x="80" y="398.4" fill="#333">if ρ is a zero, so is its conjugate</text>
<text x="530" y="47.39999999999998" fill="#3c6e2a" font-weight="600">σ &gt; 1: Σ n⁻ˢ converges</text>
<text x="80" y="522" fill="#555" font-size="12">Not to scale across axes: one unit of σ is drawn about 7 times wider than one unit of t</text>
