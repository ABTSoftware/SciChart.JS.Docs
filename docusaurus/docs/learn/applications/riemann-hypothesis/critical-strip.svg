<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 720 540"><title id="t">The complex plane of the zeta function: trivial zeros, the critical strip and the critical line</title><desc id="d">The horizontal axis is the real part sigma of s, from minus 7 to 3; the vertical axis is the imaginary part t, from minus 30 to 30. A shaded vertical band between sigma 0 and 1 is the critical strip, with a dashed line at sigma one half, the critical line. Dots on the line at heights 14.13, 21.02 and 25.01, and their mirror images below the axis, are the first non-trivial zeros. Dots on the real axis at minus 2, minus 4 and minus 6 are trivial zeros. A cross at s = 1 marks the pole. The region right of sigma 1 is where the series converges.</desc><rect width="720" height="540" fill="#fff"/><rect width="110" height="444" x="520" y="40" fill="#eef6ea"/><rect width="55" height="444" x="465" y="40" fill="#dbeaf7"/><text x="457" y="489" fill="#333" font-size="12" text-anchor="end">−30</text><text x="457" y="415" fill="#333" font-size="12" text-anchor="end">−20</text><text x="457" y="341" fill="#333" font-size="12" text-anchor="end">−10</text><text x="457" y="193" fill="#333" font-size="12" text-anchor="end">10</text><text x="457" y="119" fill="#333" font-size="12" text-anchor="end">20</text><line x1="80" x2="80" y1="258" y2="266" stroke="#333"/><text x="80" y="282" fill="#333" text-anchor="middle">−7</text><line x1="135" x2="135" y1="258" y2="266" stroke="#333"/><text x="135" y="282" fill="#333" text-anchor="middle">−6</text><line x1="190" x2="190" y1="258" y2="266" stroke="#333"/><text x="190" y="282" fill="#333" text-anchor="middle">−5</text><line x1="245" x2="245" y1="258" y2="266" stroke="#333"/><text x="245" y="282" fill="#333" text-anchor="middle">−4</text><line x1="300" x2="300" y1="258" y2="266" stroke="#333"/><text x="300" y="282" fill="#333" text-anchor="middle">−3</text><line x1="355" x2="355" y1="258" y2="266" stroke="#333"/><text x="355" y="282" fill="#333" text-anchor="middle">−2</text><line x1="410" x2="410" y1="258" y2="266" stroke="#333"/><text x="410" y="282" fill="#333" text-anchor="middle">−1</text><line x1="465" x2="465" y1="258" y2="266" stroke="#333"/><line x1="520" x2="520" y1="258" y2="266" stroke="#333"/><line x1="575" x2="575" y1="258" y2="266" stroke="#333"/><text x="575" y="282" fill="#333" text-anchor="middle">2</text><line x1="630" x2="630" y1="258" y2="266" stroke="#333"/><text x="630" y="282" fill="#333" text-anchor="middle">3</text><text x="459" y="282" fill="#333" text-anchor="end">0</text><text x="526" y="282" fill="#333">1</text><line x1="461" x2="469" y1="484" y2="484" stroke="#333"/><line x1="461" x2="469" y1="410" y2="410" stroke="#333"/><line x1="461" x2="469" y1="336" y2="336" stroke="#333"/><line x1="461" x2="469" y1="188" y2="188" stroke="#333"/><line x1="461" x2="469" y1="114" y2="114" stroke="#333"/><line x1="461" x2="469" y1="40" y2="40" stroke="#333"/><line x1="70" x2="642" y1="262" y2="262" stroke="#333" stroke-width="1.5"/><line x1="465" x2="465" y1="32" y2="492" stroke="#333" stroke-width="1.5"/><text x="642" y="252" fill="#333" text-anchor="end">σ = Re s</text><text x="457" y="40" fill="#333" text-anchor="end">t = Im s</text><line x1="492.5" x2="492.5" y1="40" y2="484" stroke="#d9534f" stroke-dasharray="6 4" stroke-width="2"/><circle cx="492.5" cy="157.4" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="162.4" fill="#8a1f1b">½ + 14.13i</text><circle cx="492.5" cy="366.6" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="371.6" fill="#8a1f1b">½ − 14.13i</text><circle cx="492.5" cy="106.44" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="111.44" fill="#8a1f1b">½ + 21.02i</text><circle cx="492.5" cy="417.56" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="422.56" fill="#8a1f1b">½ − 21.02i</text><circle cx="492.5" cy="76.92" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="81.92" fill="#8a1f1b">½ + 25.01i</text><circle cx="492.5" cy="447.08" r="5" fill="#d9534f" stroke="#fff" stroke-width="1.5"/><text x="530" y="452.08" fill="#8a1f1b">½ − 25.01i</text><circle cx="355" cy="262" r="5.5" fill="#2a6397" stroke="#fff" stroke-width="1.5"/><circle cx="245" cy="262" r="5.5" fill="#2a6397" stroke="#fff" stroke-width="1.5"/><circle cx="135" cy="262" r="5.5" fill="#2a6397" stroke="#fff" stroke-width="1.5"/><path stroke="#000" stroke-width="2.5" d="m514 256 12 12m-12 0 12-12"/><text x="245" y="214" fill="#2a6397" font-weight="600" text-anchor="middle">Trivial zeros</text><text x="245" y="232" fill="#2a6397" text-anchor="middle">at −2, −4, −6, …</text><line x1="245" x2="245" y1="238" y2="252" stroke="#2a6397"/><text x="528" y="304">Pole at s = 1</text><text x="80" y="77" fill="#1f4e79" font-weight="600">Critical strip, 0 &lt; σ &lt; 1 (shaded)</text><text x="80" y="97" fill="#1f4e79">All the non-trivial zeros lie in it</text><text x="80" y="158.4" fill="#d9534f" font-weight="600">Critical line, σ = ½ (dashed)</text><text x="80" y="178.4" fill="#8a1f1b">Riemann hypothesis: every non-trivial</text><text x="80" y="196.4" fill="#8a1f1b">zero lies on this line</text><text x="80" y="380.4" fill="#333">Zeros come in mirror-image pairs:</text><text x="80" y="398.4" fill="#333">if ρ is a zero, so is its conjugate</text><text x="530" y="47.4" fill="#3c6e2a" font-weight="600">σ &gt; 1: Σ n⁻ˢ converges</text><text x="80" y="522" fill="#555" font-size="12">Not to scale across axes: one unit of σ is drawn about 7 times wider than one unit of t</text></svg>