<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
<title id="t">The complex plane of the zeta function: trivial zeros, the critical strip and the critical line</title>
<desc id="d">The horizontal axis is the real part sigma of s, from minus 7 to 3; the vertical axis is the imaginary part t, from minus 30 to 30. A shaded vertical band between sigma 0 and 1 is the critical strip, with a dashed line at sigma one half, the critical line. Dots on the line at heights 14.13, 21.02 and 25.01, and their mirror images below the axis, are the first non-trivial zeros. Dots on the real axis at minus 2, minus 4 and minus 6 are trivial zeros. A cross at s = 1 marks the pole. The region right of sigma 1 is where the series converges.</desc>
