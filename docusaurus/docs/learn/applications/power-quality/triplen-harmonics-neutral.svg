<svg xmlns="http://www.w3.org/2000/svg" width="720" aria-labelledby="t2 d2" viewBox="0 0 720 350"><title id="t2">Why triplen harmonics add up in the neutral</title><desc id="d2">Left panel: the fundamental currents of phases L1, L2 and L3 are 120 degrees apart and sum to zero, so the neutral carries nothing. Right panel: their third harmonics are all in step, because three times 120 degrees is a full turn, so in the neutral they add to a wave three times as large.</desc><rect width="100%" height="100%" fill="#fff"/><rect width="336" height="310" x="16" y="14" fill="#f4f6fb" stroke="#d5dbe8" rx="8"/><text x="28" y="38" fill="#1d2b44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Fundamental (50 or 60 Hz)</text><text x="28" y="57" fill="#4a5873" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">120° apart: the three currents cancel, neutral = 0</text><line x1="28" x2="340" y1="180" y2="180" stroke="#c9d0de"/><path fill="none" stroke="#c0392b" stroke-width="2" d="m31 180 .8-1.3.7-1.2.8-1.3.8-1.2.7-1.3.8-1.2.8-1.3.7-1.2.8-1.3.7-1.2.8-1.3.8-1.2.7-1.2.8-1.3.8-1.2.7-1.2.8-1.2.8-1.2.7-1.2.8-1.2.8-1.2.7-1.2.8-1.2.8-1.1.7-1.2.8-1.2.8-1.1.7-1.2.8-1.1.8-1.1.7-1.1.8-1.1.7-1.1.8-1.1.8-1.1.7-1.1.8-1 .8-1.1.7-1 .8-1 .8-1 .7-1 .8-1 .8-1 .7-1 .8-.9.8-.9.7-1 .8-.9.7-.9.8-.9.8-.8.7-.9.8-.8.8-.8.7-.8.8-.8.8-.8.7-.8.8-.7.8-.8.7-.7.8-.7.8-.6.7-.7.8-.7.8-.6.7-.6.8-.6.7-.6.8-.5.8-.6.7-.5.8-.5.8-.5.7-.5.8-.4.8-.5.7-.4.8-.4.8-.4.7-.3.8-.4.8-.3.7-.3.8-.3.8-.2.7-.3.8-.2.8-.2.7-.2.8-.2.7-.1.8-.1.8-.2h.7l.8-.1.8-.1h3l.8.1.8.1h.7l.8.2.8.1.7.1.8.2.8.2.7.2.8.2.7.3.8.2.8.3.7.3.8.3.8.4.7.3.8.4.8.4.7.4.8.5.8.4.7.5.8.5.8.5.7.5.8.6.7.5.8.6.8.6.7.6.8.6.8.7.7.7.8.6.8.7.7.7.8.8.8.7.7.8.8.8.8.8.7.8.8.8.8.8.7.9.8.8.8.9.7.9.8.9.7 1 .8.9.8.9.7 1 .8 1 .8 1 .7 1 .8 1 .8 1 .7 1 .8 1.1.8 1 .7 1.1.8 1.1.8 1.1.7 1.1.8 1.1.7 1.1.8 1.1.8 1.1.7 1.2.8 1.1.8 1.2.7 1.2.8 1.1.8 1.2.7 1.2.8 1.2.8 