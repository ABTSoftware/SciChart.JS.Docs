<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a drawdown: equity curve, running peak and underwater chart</title>
<desc id="d">Ten months of account values from $100,000 to $135,000. The running peak is a dashed line. The first drawdown falls 25% from a $120,000 peak in February to a $90,000 trough in March and recovers in May, three months after the peak. The second falls 13.8% from May to July and takes five months to recover, in October. Below, the underwater chart shows the same drawdowns as a red area below zero, with the maximum drawdown of minus 25% marked.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#1a2433">Equity curve and running peak ($ thousands)</text>
<line x1="90" y1="270.0" x2="720" y2="270.0" stroke="#e3e8ef"/><text x="80" y="275.0" font-size="13" text-anchor="end" fill="#55606e">80</text>
<line x1="90" y1="203.3" x2="720" y2="203.3" stroke="#e3e8ef"/><text x="80" y="208.3" font-size="13" text-anchor="end" fill="#55606e">100</text>
<line x1="90" y1="136.7" x2="720" y2="136.7" stroke="#e3e8ef"/><text x="80" y="141.7" font-size="13" text-anchor="end" fill="#55606e">120</text>
<line x1="90" y1="70.0" x2="720" y2="70.0" stroke="#e3e8ef"/><text x="80" y="75.0" font-size="13" text-anchor="end" fill="#55606e">140</text>
<rect x="160.0" y="70" width="210.0" height="200" fill="#ef5350" fill-opacity="0.10"/>
<rect x="370.0" y="70" width="350.0" height="200" fill="#f48420" fill-opacity="0.10"/>
<polyline points="90.0,203.3 160.0,136.7 230.0,136.7 300.0,136.7 370.0,103.3 440.0,103.3 510.0,103.3 580.0,103.3 650.0,103.3 720.0,86.7" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="90.0,203.3 160.0,136.7 230.0,236.7 300.0,170.0 370.0,103.3 440.0,146.7 510.0,163.3 580.0,120.0 650.0,110.0 720.0,86.7" fill="none" stroke="#1f77b4" stroke-width="3"/>
<circle cx="90.0" cy="203.3" r="4" fill="#1f77b4"/>
<circle cx="160.0" cy="136.7" r="4" fill="#1f77b4"/>
<circle cx="230.0" cy="236.7" r="4" fill="#1f77b4"/>
<circle cx="300.0" cy="170.0" r="4" fill="#1f77b4"/>
<circle cx="370.0" cy="103.3" r="4" fill="#1f77b4"/>
<circle cx="440.0" cy="146.7" r="4" fill="#1f77b4"/>
<circle cx="510.0" cy="163.3" r="4" fill="#1f77b4"/>
<circle cx="580.0" cy="120.0" r="4" fill="#1f77b4"/>
<circle cx="650.0" cy="110.0" r="4" fill="#1f77b4"/>
<circle cx="720.0" cy="86.7" r="4" fill="#1f77b4"/>
<text x="160.0" y="124.7" font-size="14" text-anchor="middle" fill="#1a2433">Peak 120</text>
<text x="216.0" y="258.7" font-size="14" fill="#1a2433">Trough 90: <tspan fill="#c62828">max drawdown 25% ($30,000)</tspan></text>
<text x="370.0" y="91.3" font-size="14" text-anchor="middle" fill="#1a2433">Recovered</text>
<line x1="214.0" y1="136.7" x2="214.0" y2="236.7" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="726.0" y="106.7" font-size="13" text-anchor="end" fill="#55606e">135</text>
<text x="716.0" y="74.0" font-size="13" text-anchor="end" fill="#b8860b">running peak</text>
<path d="M160.0,276 V282 H370.0 V276" fill="none" stroke="#c62828" stroke-width="1.5"/><text x="265.0" y="298" font-size="13" text-anchor="middle" fill="#c62828">Drawdown: 3 months</text>
<path d="M370.0,276 V282 H720.0 V276" fill="none" stroke="#b35c00" stroke-width="1.5"/><text x="545.0" y="298" font-size="13" text-anchor="middle" fill="#b35c00">Longest drawdown: 5 months, 13.8% deep</text>
<text x="20" y="335" font-size="17" font-weight="600" fill="#1a2433">Underwater chart (drawdown from the running peak)</text>
<line x1="90" y1="350.0" x2="720" y2="350.0" stroke="#e3e8ef"/><text x="80" y="355.0" font-size="13" text-anchor="end" fill="#55606e">0%</text>
<line x1="90" y1="393.3" x2="720" y2="393.3" stroke="#e3e8ef"/><text x="80" y="398.3" font-size="13" text-anchor="end" fill="#55606e">−10%</text>
<line x1="90" y1="436.7" x2="720" y2="436.7" stroke="#e3e8ef"/><text x="80" y="441.7" font-size="13" text-anchor="end" fill="#55606e">−20%</text>
<line x1="90" y1="480.0" x2="720" y2="480.0" stroke="#e3e8ef"/><text x="80" y="485.0" font-size="13" text-anchor="end" fill="#55606e">−30%</text>
<polygon points="90.0,350.0 90.0,350.0 160.0,350.0 230.0,458.3 300.0,386.1 370.0,350.0 440.0,393.3 510.0,410.0 580.0,366.7 650.0,356.7 720.0,350.0 720.0,350.0" fill="#ef5350" fill-opacity="0.35" stroke="#c62828" stroke-width="2"/>
<line x1="90" y1="458.3" x2="720" y2="458.3" stroke="#1a2433" stroke-dasharray="4 4"/>
<text x="242.0" y="463.3" font-size="13" fill="#1a2433" dy="14">Max drawdown −25%</text>
<text x="510.0" y="428.0" font-size="13" text-anchor="middle" fill="#1a2433">−13.8%</text>
<text x="90.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Jan</text>
<text x="160.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Feb</text>
<text x="230.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Mar</text>
<text x="300.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Apr</text>
<text x="370.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">May</text>
<text x="440.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Jun</text>
<text x="510.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Jul</text>
<text x="580.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Aug</text>
<text x="650.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Sep</text>
<text x="720.0" y="525" font-size="13" text-anchor="middle" fill="#55606e">Oct</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
</svg>
