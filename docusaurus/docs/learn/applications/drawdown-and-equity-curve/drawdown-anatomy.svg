<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 540"><title id="t">Anatomy of a drawdown: equity curve, running peak and underwater chart</title><desc id="d">Ten months of account values from $100,000 to $135,000. The running peak is a dashed line. The first drawdown falls 25% from a $120,000 peak in February to a $90,000 trough in March and recovers in May, three months after the peak. The second falls 13.8% from May to July and takes five months to recover, in October. Below, the underwater chart shows the same drawdowns as a red area below zero, with the maximum drawdown of minus 25% marked.</desc><rect width="760" height="540" fill="#fff"/><text x="20" y="28" fill="#1a2433" font-size="17" font-weight="600">Equity curve and running peak ($ thousands)</text><line x1="90" x2="720" y1="270" y2="270" stroke="#e3e8ef"/><text x="80" y="275" fill="#55606e" font-size="13" text-anchor="end">80</text><line x1="90" x2="720" y1="203.3" y2="203.3" stroke="#e3e8ef"/><text x="80" y="208.3" fill="#55606e" font-size="13" text-anchor="end">100</text><line x1="90" x2="720" y1="136.7" y2="136.7" stroke="#e3e8ef"/><text x="80" y="141.7" fill="#55606e" font-size="13" text-anchor="end">120</text><line x1="90" x2="720" y1="70" y2="70" stroke="#e3e8ef"/><text x="80" y="75" fill="#55606e" font-size="13" text-anchor="end">140</text><rect width="210" height="200" x="160" y="70" fill="#ef5350" fill-opacity=".1"/><rect width="350" height="200" x="370" y="70" fill="#f48420" fill-opacity=".1"/><polyline fill="none" stroke="#b8860b" stroke-dasharray="7 5" stroke-width="2" points="90.0,203.3 160.0,136.7 230.0,136.7 300.0,136.7 370.0,103.3 440.0,103.3 510.0,103.3 580.0,103.3 650.0,103.3 720.0,86.7"/><polyline fill="none" stroke="#1f77b4" stroke-width="3" points="90.0,203.3 160.0,136.7 230.0,236.7 300.0,170.0 370.0,103.3 440.0,146.7 510.0,163.3 580.0,120.0 650.0,110.0 720.0,86.7"/><circle cx="90" cy="203.3" r="4" fill="#1f77b4"/><circle cx="160" cy="136.7" r="4" fill="#1f77b4"/><circle cx="230" cy="236.7" r="4" fill="#1f77b4"/><circle cx="300" cy="170" r="4" fill="#1f77b4"/><circle cx="370" cy="103.3" r="4" fill="#1f77b4"/><circle cx="440" cy="146.7" r="4" fill="#1f77b4"/><circle cx="510" cy="163.3" r="4" fill="#1f77b4"/><circle cx="580" cy="120" r="4" fill="#1f77b4"/><circle cx="650" cy="110" r="4" fill="#1f77b4"/><circle cx="720" cy="86.7" r="4" fill="#1f77b4"/><text x="160" y="124.7" fill="#1a2433" font-size="14" text-anchor="middle">Peak 120</text><text x="216" y="258.7" fill="#1a2433" font-size="14">Trough 90: <tspan fill="#c62828">max drawdown 25% ($30,000)</tspan></text><text x="370" y="91.3" fill="#1a2433" font-size="14" text-anchor="middle">Recovered</text><line x1="214" x2="214" y1="136.7" y2="236.7" stroke="#c62828" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><text x="726" y="106.7" fill="#55606e" font-size="13" text-anchor="end">135</text><text x="716" y="74" fill="#b8860b" font-size="13" text-anchor="end">running peak</text><path fill="none" stroke="#c62828" stroke-width="1.5" d="M160 276v6h210v-6"/><text x="265" y="298" fill="#c62828" font-size="13" text-anchor="middle">Drawdown: 3 months</text><path fill="none" stroke="#b35c00" stroke-width="1.5" d="M370 276v6h350v-6"/><text x="545" y="298" fill="#b35c00" font-size="13" text-anchor="middle">Longest drawdown: 5 months, 13.8% deep</text><text x="20" y="335" fill="#1a2433" font-size="17" font-weight="600">Underwater chart (drawdown from the running peak)</text><line x1="90" x2="720" y1="350" y2="350" stroke="#e3e8ef"/><text x="80" y="355" fill="#55606e" font-size="13" text-anchor="end">0%</text><line x1="90" x2="720" y1="393.3" y2="393.3" stroke="#e3e8ef"/><text x="80" y="398.3" fill="#55606e" font-size="13" text-anchor="end">−10%</text><line x1="90" x2="720" y1="436.7" y2="436.7" stroke="#e3e8ef"/><text x="80" y="441.7" fill="#55606e" font-size="13" text-anchor="end">−20%</text><line x1="90" x2="720" y1="480" y2="480" stroke="#e3e8ef"/><text x="80" y="485" fill="#55606e" font-size="13" text-anchor="end">−30%</text><polygon fill="#ef5350" fill-opacity=".35" stroke="#c62828" stroke-width="2" points="90.0,350.0 90.0,350.0 160.0,350.0 230.0,458.3 300.0,386.1 370.0,350.0 440.0,393.3 510.0,410.0 580.0,366.7 650.0,356.7 720.0,350.0 720.0,350.0"/><line x1="90" x2="720" y1="458.3" y2="458.3" stroke="#1a2433" stroke-dasharray="4 4"/><text x="242" y="463.3" fill="#1a2433" dy="14" font-size="13">Max drawdown −25%</text><text x="510" y="428" fill="#1a2433" font-size="13" text-anchor="middle">−13.8%</text><text x="90" y="525" fill="#55606e" font-size="13" text-anchor="middle">Jan</text><text x="160" y="525" fill="#55606e" font-size="13" text-anchor="middle">Feb</text><text x="230" y="525" fill="#55606e" font-size="13" text-anchor="middle">Mar</text><text x="300" y="525" fill="#55606e" font-size="13" text-anchor="middle">Apr</text><text x="370" y="525" fill="#55606e" font-size="13" text-anchor="middle">May</text><text x="440" y="525" fill="#55606e" font-size="13" text-anchor="middle">Jun</text><text x="510" y="525" fill="#55606e" font-size="13" text-anchor="middle">Jul</text><text x="580" y="525" fill="#55606e" font-size="13" text-anchor="middle">Aug</text><text x="650" y="525" fill="#55606e" font-size="13" text-anchor="middle">Sep</text><text x="720" y="525" fill="#55606e" font-size="13" text-anchor="middle">Oct</text><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#c62828" d="m0 0 10 5-10 5z"/></marker></defs></svg>