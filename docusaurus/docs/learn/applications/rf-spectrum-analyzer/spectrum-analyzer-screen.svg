<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
<title>How to read an RF spectrum analyser screen</title>
<desc>An annotated spectrum analyser display. Frequency runs across from 490 to 510 MHz, with the centre frequency of 500 MHz and a span of 20 MHz. Power in dBm runs up, with the reference level of minus 10 dBm at the top line and 10 dB per division. A narrow carrier peak reaches minus 20 dBm with a marker reading 500.300 MHz and minus 20.0 dBm. A rounded hump at 497 MHz is an FM signal, a flat plateau from 505 to 509 MHz is a wideband digital channel, and the ragged line near minus 90 dBm is the noise floor. The settings bar shows RBW 30 kHz, VBW 30 kHz, attenuation 20 dB.</desc>
