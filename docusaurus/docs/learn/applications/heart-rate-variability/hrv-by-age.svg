<title id="t2">Resting RMSSD by age group and sex</title>
<desc id="d2">Bar chart of mean resting RMSSD from 5-minute ECG recordings lying down in 1,906 healthy adults (Voss et al. 2015). Women: 43, 35, 26, 21 and 19 ms; men: 40, 32, 23, 20 and 19 ms for ages 25–34, 35–44, 45–54, 55–64 and 65–74. Whiskers show one standard deviation either side of the mean, about 11 to 23 ms, so individuals vary widely.</desc>
