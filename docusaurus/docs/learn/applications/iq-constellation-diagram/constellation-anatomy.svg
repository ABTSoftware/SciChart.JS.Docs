<circle cx="382.6" cy="382.6" r="7" fill="#1f77b4"/><text x="382.6" y="404.6" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#111827">1000</text>
<circle cx="382.6" cy="290.9" r="7" fill="#1f77b4"/><text x="382.6" y="312.9" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#111827">1001</text>
<circle cx="382.6" cy="199.1" r="7" fill="#1f77b4"/><text x="382.6" y="221.1" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#111827">1011</text>
<circle cx="382.6" cy="107.4" r="7" fill="#1f77b4"/><text x="382.6" y="129.4" text-anchor="middle" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#111827">1010</text>
<line x1="382.6" y1="199.1" x2="358.8" y2="174.7" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="352.3" cy="168.1" r="6" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
<line x1="107.4" y1="418.6" x2="199.1" y2="418.6" stroke="#374151" stroke-width="1.5" marker-start="url(#arrowGrey)" marker-end="url(#arrowGrey)"/><text x="153.3" y="435.6" text-anchor="middle" font-size="14" font-style="italic" fill="#111827">d</text>
<text x="485.7" y="71.0" font-size="15" font-weight="600" fill="#1f77b4">Ideal symbol positions</text><text x="485.7" y="90.0" font-size="14" fill="#374151">16 points: 4 bits per symbol</text>
<text x="485.7" y="131.9" font-size="15" font-weight="600" fill="#111827">Gray-coded bits</text><text x="485.7" y="150.9" font-size="14" fill="#374151">Neighbours differ by one bit</text>
<text x="485.7" y="201.5" font-size="15" font-weight="600" fill="#d9480f">Received sample and</text><text x="485.7" y="220.5" font-size="14" fill="#374151">error vector (for EVM)</text>
<text x="485.7" y="281.3" font-size="15" font-weight="600" fill="#7c3aed">Decision boundaries</text><text x="485.7" y="300.3" font-size="14" fill="#374151">halfway between points</text>
<text x="485.7" y="358.1" font-size="15" font-weight="600" fill="#374151">Spacing d</text><text x="485.7" y="377.1" font-size="14" fill="#374151">Errors once noise reaches d/2</text>
<line x1="479.7" y1="196.5" x2="361.3" y2="166.1" stroke="#d9480f" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
