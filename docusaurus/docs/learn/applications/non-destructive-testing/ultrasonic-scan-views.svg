<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 780 300"><title>A-scan, B-scan, C-scan and S-scan views of the same plate</title><desc>Four small panels. A-scan: one trace of amplitude against time at a single probe position. B-scan: a side-view cross-section built from many A-scans along a line, with probe position across and depth down; the flaw is a short bright line above the back wall. C-scan: a top-down plan view of the plate where colour is the echo in a depth gate; the flaw is a bright square. S-scan: a fan-shaped sector from a phased array probe, angle across and sound path outward.</desc><rect width="780" height="300" fill="#fff"/><g fill="#1d2b4a" font-size="14" font-weight="600" text-anchor="middle"><text x="97" y="26">A-scan</text><text x="292" y="26">B-scan</text><text x="487" y="26">C-scan</text><text x="682" y="26">S-scan</text></g><g fill="#4a5a78" font-size="11" text-anchor="middle"><text x="97" y="44">one position</text><text x="292" y="44">side view along a line</text><text x="487" y="44">plan view from above</text><text x="682" y="44">phased array sector</text></g><rect width="164" height="170" x="15" y="56" fill="#0f1d3a"/><path fill="none" stroke="#50C7E0" stroke-width="1.5" d="m22 210 2-140 3 140 3-100 3 100 5-10 4 10h38l3-40 3 40 3-80 3 80 3-25 3 25h42l3-50 3 50 3-110 3 110 3-40 3 40h14"/><text x="97" y="244" fill="#4a5a78" font-size="11" text-anchor="middle">amplitude ↑, time →</text><rect width="164" height="170" x="210" y="56" fill="#0f1d3a"/><rect width="164" height="8" x="210" y="56" fill="#e8d75c" opacity=".8"/><rect width="44" height="6" x="250" y="120" fill="#ff6b4a"/><path fill="none" stroke="#2fb8d9" stroke-width="2" d="M244 128q28-14 56 0" opacity=".8"/><rect width="40" height="6" x="210" y="196" fill="#e8d75c"/><rect width="80" height="6" x="294" y="196" fill="#e8d75c"/><rect width="44" height="6" x="250" y="196" fill="#2f5aa8"/><text x="292" y="244" fill="#4a5a78" font-size="11" text-anchor="middle">position →, depth ↓</text><rect width="164" height="170" x="405" y="56" fill="#0f1d3a"/><rect width="40" height="40" x="435" y="116" fill="#ff6b4a"/><rect width="48" height="48" x="431" y="112" fill="none" stroke="#2fb8d9" stroke-width="3" opacity=".7"/><rect width="8" height="130" x="520" y="76" fill="#2fb8d9"/><text x="487" y="244" fill="#4a5a78" font-size="11" text-anchor="middle">x →, y ↑, colour = gated echo</text><path fill="#0f1d3a" d="m682 60-80 138.6a160 160 0 0 0 160 0Z"/><path fill="none" stroke="#e8d75c" stroke-width="6" d="M664 176a118 118 0 0 0 36 0"/><rect width="30" height="5" x="664" y="128" fill="#ff6b4a"/><circle cx="720" cy="150" r="5" fill="#2fb8d9"/><rect width="36" height="9" x="664" y="52" fill="#3b5998" rx="2"/><text x="682" y="244" fill="#4a5a78" font-size="11" text-anchor="middle">angle ↔, sound path outward</text><text x="390" y="276" fill="#1d2b4a" font-size="11" text-anchor="middle">Same plate, same flaw: each view arranges the echoes a different way.</text></svg>