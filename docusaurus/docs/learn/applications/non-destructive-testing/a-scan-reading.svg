<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 360"><title>How to read an ultrasonic A-scan</title><desc>Left: a cross-section of a 25 mm steel plate with a contact probe on top and a flaw 12 mm deep. Right: the A-scan the probe records, amplitude against time of flight. The initial pulse sits at zero, the flaw echo at 4.05 microseconds and the back-wall echo at 8.45 microseconds. A gate over the flaw region and the formula depth equals velocity times time over two convert time to depth.</desc><rect width="760" height="360" fill="#fff"/><text x="130" y="28" fill="#1d2b4a" font-size="15" font-weight="600" text-anchor="middle">Steel plate, side view</text><rect width="52" height="26" x="104" y="50" fill="#3b5998" rx="3"/><text x="130" y="68" fill="#fff" font-size="12" text-anchor="middle">Probe</text><rect width="52" height="5" x="104" y="76" fill="#9ec5e8"/><text x="166" y="82" fill="#4a5a78" font-size="11">couplant</text><rect width="200" height="200" x="30" y="82" fill="#dfe4ec" stroke="#4a5a78" stroke-width="1.5"/><polygon fill="#50C7E0" points="108,82 152,82 168,282 92,282" opacity=".25"/><rect width="40" height="5" x="112" y="175" fill="#d9480f"/><text x="160" y="182" fill="#d9480f" font-size="12">flaw</text><line x1="44" x2="44" y1="82" y2="177" stroke="#1d2b4a"/><line x1="38" x2="50" y1="177" y2="177" stroke="#1d2b4a"/><text x="52" y="134" fill="#1d2b4a" font-size="12">12 mm</text><line x1="214" x2="214" y1="82" y2="282" stroke="#1d2b4a"/><line x1="208" x2="220" y1="282" y2="282" stroke="#1d2b4a"/><line x1="208" x2="220" y1="82" y2="82" stroke="#1d2b4a"/><text x="196" y="250" fill="#1d2b4a" font-size="12" text-anchor="end">25 mm</text><text x="130" y="302" fill="#4a5a78" font-size="12" text-anchor="middle">back wall</text><text x="130" y="330" fill="#4a5a78" font-size="12" text-anchor="middle">sound velocity v = 5.92 mm/µs</text><text x="510" y="28" fill="#1d2b4a" font-size="15" font-weight="600" text-anchor="middle">What the A-scan shows</text><line x1="290" x2="740" y1="270" y2="270" stroke="#1d2b4a" stroke-width="1.5"/><line x1="290" x2="290" y1="60" y2="270" stroke="#1d2b4a" stroke-width="1.5"/><text x="515" y="306" fill="#1d2b4a" font-size="12" text-anchor="middle">Time of flight (µs)</text><text x="276" y="165" fill="#1d2b4a" font-size="12" text-anchor="middle" transform="rotate(-90 276 165)">Amplitude (% screen height)</text><g fill="#4a5a78" font-size="11" text-anchor="middle"><text x="290" y="286">0</text><text x="380" y="286">2</text><text x="470" y="286">4</text><text x="560" y="286">6</text><text x="650" y="286">8</text><text x="740" y="286">10</text></g><path fill="none" stroke="#3b5998" stroke-width="1.6" d="m290 270 2-200 4 200 4-180 4 180 4-130 4 130 4-70 4 70 6-25 6 25"/><text x="318" y="62" fill="#1d2b4a" font-size="12">initial pulse</text><path fill="none" stroke="#d9480f" stroke-width="1.8" d="m458 270 6-40 4 40 4-120 4 120 4-75 4 75 4-20 4 20"/><text x="474" y="140" fill="#d9480f" font-size="12" text-anchor="middle">flaw echo</text><text x="474" y="125" fill="#d9480f" font-size="12" text-anchor="middle">4.05 µs</text><path fill="none" stroke="#3b5998" stroke-width="1.8" d="m656 270 6-55 4 55 4-160 4 160 4-100 4 100 4-30 4 30"/><text x="672" y="100" fill="#1d2b4a" font-size="12" text-anchor="middle">back-wall echo</text><text x="672" y="85" fill="#1d2b4a" font-size="12" text-anchor="middle">8.45 µs</text><line x1="443" x2="542" y1="232" y2="232" stroke="#b8860b" stroke-width="4"/><text x="548" y="236" fill="#b8860b" font-size="12">gate</text><path fill="none" stroke="#8a97ad" d="m520 270 3-6 3 6 3-4 3 4 4-7 3 7 3-3 3 3 4-5 3 5"/><text x="560" y="258" fill="#6b7891" font-size="11">noise (&quot;grass&quot;)</text><rect width="440" height="32" x="300" y="316" fill="#eef3fa" stroke="#c9d4e6" rx="4"/><text x="520" y="337" fill="#1d2b4a" font-size="13" text-anchor="middle">depth = v × t / 2 = 5.92 × 4.05 / 2 = 12.0 mm</text></svg>