<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How to read an ultrasonic A-scan</title>
  <desc>Left: a cross-section of a 25 mm steel plate with a contact probe on top and a flaw 12 mm deep. Right: the A-scan the probe records, amplitude against time of flight. The initial pulse sits at zero, the flaw echo at 4.05 microseconds and the back-wall echo at 8.45 microseconds. A gate over the flaw region and the formula depth equals velocity times time over two convert time to depth.</desc>
  <rect width="760" height="360" fill="#ffffff"/>

  <!-- Plate cross-section -->
  <text x="130" y="28" font-size="15" font-weight="600" fill="#1d2b4a" text-anchor="middle">Steel plate, side view</text>
  <rect x="104" y="50" width="52" height="26" rx="3" fill="#3b5998"/>
  <text x="130" y="68" font-size="12" fill="#ffffff" text-anchor="middle">Probe</text>
  <rect x="104" y="76" width="52" height="5" fill="#9ec5e8"/>
  <text x="166" y="82" font-size="11" fill="#4a5a78">couplant</text>
  <rect x="30" y="82" width="200" height="200" fill="#dfe4ec" stroke="#4a5a78" stroke-width="1.5"/>
  <!-- beam -->
  <polygon points="108,82 152,82 168,282 92,282" fill="#50C7E0" opacity="0.25"/>
  <!-- flaw at 12/25 of 200 px = 96 px below top -->
  <rect x="112" y="175" width="40" height="5" fill="#d9480f"/>
  <text x="160" y="182" font-size="12" fill="#d9480f">flaw</text>
  <!-- depth dimension -->
  <line x1="44" y1="82" x2="44" y2="177" stroke="#1d2b4a" stroke-width="1"/>
  <line x1="38" y1="177" x2="50" y2="177" stroke="#1d2b4a"/>
  <text x="52" y="134" font-size="12" fill="#1d2b4a">12 mm</text>
  <line x1="214" y1="82" x2="214" y2="282" stroke="#1d2b4a" stroke-width="1"/>
  <line x1="208" y1="282" x2="220" y2="282" stroke="#1d2b4a"/>
  <line x1="208" y1="82" x2="220" y2="82" stroke="#1d2b4a"/>
  <text x="196" y="250" font-size="12" fill="#1d2b4a" text-anchor="end">25 mm</text>
  <text x="130" y="302" font-size="12" fill="#4a5a78" text-anchor="middle">back wall</text>
  <text x="130" y="330" font-size="12" fill="#4a5a78" text-anchor="middle">sound velocity v = 5.92 mm/µs</text>

  <!-- A-scan axes -->
  <text x="510" y="28" font-size="15" font-weight="600" fill="#1d2b4a" text-anchor="middle">What the A-scan shows</text>
  <line x1="290" y1="270" x2="740" y2="270" stroke="#1d2b4a" stroke-width="1.5"/>
  <line x1="290" y1="60" x2="290" y2="270" stroke="#1d2b4a" stroke-width="1.5"/>
  <text x="515" y="306" font-size="12" fill="#1d2b4a" text-anchor="middle">Time of flight (µs)</text>
  <text x="276" y="165" font-size="12" fill="#1d2b4a" text-anchor="middle" transform="rotate(-90 276 165)">Amplitude (% screen height)</text>
  <!-- ticks: 0..10 us over 290..740, 45 px per us -->
  <g font-size="11" fill="#4a5a78" text-anchor="middle">
    <text x="290" y="286">0</text><text x="380" y="286">2</text><text x="470" y="286">4</text>
    <text x="560" y="286">6</text><text x="650" y="286">8</text><text x="740" y="286">10</text>
  </g>
  <!-- Initial pulse -->
  <path d="M290,270 L292,70 L296,270 L300,90 L304,270 L308,140 L312,270 L316,200 L320,270 L326,245 L332,270" fill="none" stroke="#3b5998" stroke-width="1.6"/>
  <text x="318" y="62" font-size="12" fill="#1d2b4a">initial pulse</text>
  <!-- Flaw echo at 4.05 us -> 290 + 182 = 472 -->
  <path d="M458,270 L464,230 L468,270 L472,150 L476,270 L480,195 L484,270 L488,250 L492,270" fill="none" stroke="#d9480f" stroke-width="1.8"/>
  <text x="474" y="140" font-size="12" fill="#d9480f" text-anchor="middle">flaw echo</text>
  <text x="474" y="125" font-size="12" fill="#d9480f" text-anchor="middle">4.05 µs</text>
  <!-- Back wall at 8.45 us -> 290 + 380 = 670 -->
  <path d="M656,270 L662,215 L666,270 L670,110 L674,270 L678,170 L682,270 L686,240 L690,270" fill="none" stroke="#3b5998" stroke-width="1.8"/>
  <text x="672" y="100" font-size="12" fill="#1d2b4a" text-anchor="middle">back-wall echo</text>
  <text x="672" y="85" font-size="12" fill="#1d2b4a" text-anchor="middle">8.45 µs</text>
  <!-- Gate from 3.4 to 5.6 us at 20% -->
  <line x1="443" y1="232" x2="542" y2="232" stroke="#b8860b" stroke-width="4"/>
  <text x="548" y="236" font-size="12" fill="#b8860b">gate</text>
  <!-- grass -->
  <path d="M520,270 l3,-6 l3,6 l3,-4 l3,4 l4,-7 l3,7 l3,-3 l3,3 l4,-5 l3,5" fill="none" stroke="#8a97ad" stroke-width="1"/>
  <text x="560" y="258" font-size="11" fill="#6b7891">noise ("grass")</text>
  <!-- formula -->
  <rect x="300" y="316" width="440" height="32" rx="4" fill="#eef3fa" stroke="#c9d4e6"/>
  <text x="520" y="337" font-size="13" fill="#1d2b4a" text-anchor="middle">depth = v × t / 2 = 5.92 × 4.05 / 2 = 12.0 mm</text>
</svg>
