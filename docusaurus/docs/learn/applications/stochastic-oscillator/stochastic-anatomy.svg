<line x1="540" x2="540" y1="206.4" y2="251.8" stroke="#1a2a44" stroke-width="3"/><line x1="540" x2="550" y1="233.6" y2="233.6" stroke="#1a2a44" stroke-width="3"/><text x="540" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">10</text>
<line x1="590" x2="590" y1="179.1" y2="233.6" stroke="#1a2a44" stroke-width="3"/><line x1="590" x2="600" y1="188.2" y2="188.2" stroke="#1a2a44" stroke-width="3"/><text x="590" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">11</text>
<line x1="640" x2="640" y1="129.1" y2="192.7" stroke="#1a2a44" stroke-width="3"/><line x1="640" x2="650" y1="138.2" y2="138.2" stroke="#1a2a44" stroke-width="3"/><text x="640" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">12</text>
<text x="70" y="322" text-anchor="start" fill="#5a6b85" font-size="12">Bar (tick on the right of each bar = close)</text>
<line x1="682" x2="682" y1="129.1" y2="251.8" stroke="#c99700" stroke-width="2"/><line x1="677" x2="687" y1="129.1" y2="129.1" stroke="#c99700" stroke-width="2"/><line x1="677" x2="687" y1="251.8" y2="251.8" stroke="#c99700" stroke-width="2"/>
<line x1="694" x2="694" y1="138.2" y2="251.8" stroke="#0f7c74" stroke-width="3"/>
<text x="678" y="322" text-anchor="end" fill="#0f7c74" font-size="13">Close 52.70: 2.50 above the low</text>
<text x="678" y="340" text-anchor="end" fill="#0f7c74" font-size="13" font-weight="600">%K = 2.50 ÷ 2.70 × 100 = 92.6</text>
<text x="20" y="378" font-size="17" font-weight="600" fill="#1a2a44">2. Oscillator: fast %K and %D (3-bar average), 0 to 100</text>
<rect x="70" y="400.0" width="670" height="34.0" fill="#ef535026"/>
<rect x="70" y="536.0" width="670" height="34.0" fill="#26a69a26"/>
<line x1="70" x2="740" y1="570.0" y2="570.0" stroke="#e3e8ef" /><text x="62" y="575.0" text-anchor="end" fill="#5a6b85" font-size="12">0</text>
<line x1="70" x2="740" y1="536.0" y2="536.0" stroke="#8a99b0" stroke-dasharray="5 4"/><text x="62" y="541.0" text-anchor="end" fill="#5a6b85" font-size="12">20</text>
<line x1="70" x2="740" y1="485.0" y2="485.0" stroke="#e3e8ef" /><text x="62" y="490.0" text-anchor="end" fill="#5a6b85" font-size="12">50</text>
<line x1="70" x2="740" y1="434.0" y2="434.0" stroke="#8a99b0" stroke-dasharray="5 4"/><text x="62" y="439.0" text-anchor="end" fill="#5a6b85" font-size="12">80</text>
<line x1="70" x2="740" y1="400.0" y2="400.0" stroke="#e3e8ef" /><text x="62" y="405.0" text-anchor="end" fill="#5a6b85" font-size="12">100</text>
<text x="78" y="416.0" fill="#b03a37" font-size="13">Overbought zone (above 80)</text>
<text x="78" y="562.0" fill="#1b7a70" font-size="13">Oversold zone (below 20)</text>
