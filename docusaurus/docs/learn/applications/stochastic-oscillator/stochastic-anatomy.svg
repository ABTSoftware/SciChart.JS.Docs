<svg xmlns="http://www.w3.org/2000/svg" width="760" height="615" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 615"><title>How the stochastic oscillator is read from a price chart</title><desc>Twelve daily price bars showing high, low and close, with a five-bar window over bars 8 to 12 marked from its lowest low of 50.20 to its highest high of 52.90. The close of 52.70 is 2.50 above the low in a 2.70 range, so fast %K is 92.6. Below, fast %K and its three-bar average %D on a 0 to 100 scale, with the overbought zone above 80 and the oversold zone below 20 shaded, %K at 93.5 in the overbought zone on bar 5, at 10.0 in the oversold zone on bar 9, and %K crossing above %D on bar 11.</desc><rect width="760" height="615" fill="#fff"/><text x="20" y="28" fill="#1a2a44" font-size="17" font-weight="600">1. Price: where does the close sit in the last 5 bars&apos; range?</text><line x1="70" x2="740" y1="260.9" y2="260.9" stroke="#e3e8ef"/><text x="62" y="265.9" fill="#5a6b85" font-size="12" text-anchor="end">50</text><line x1="70" x2="740" y1="215.5" y2="215.5" stroke="#e3e8ef"/><text x="62" y="220.5" fill="#5a6b85" font-size="12" text-anchor="end">51</text><line x1="70" x2="740" y1="170" y2="170" stroke="#e3e8ef"/><text x="62" y="175" fill="#5a6b85" font-size="12" text-anchor="end">52</text><line x1="70" x2="740" y1="124.5" y2="124.5" stroke="#e3e8ef"/><text x="62" y="129.5" fill="#5a6b85" font-size="12" text-anchor="end">53</text><line x1="70" x2="740" y1="79.1" y2="79.1" stroke="#e3e8ef"/><text x="62" y="84.1" fill="#5a6b85" font-size="12" text-anchor="end">54</text><rect width="240" height="122.7" x="420" y="129.1" fill="#f6c94a33" stroke="#c99700" stroke-dasharray="6 4" stroke-width="1.5"/><text x="420" y="121.1" fill="#7a5c00" font-size="13">5-bar window (bars 8–12): highest high 52.90</text><text x="420" y="245.8" fill="#7a5c00" dx="6" font-size="13">lowest low 50.20</text><line x1="90" x2="90" y1="215.5" y2="260.9" stroke="#8a99b0" stroke-width="3"/><line x1="90" x2="100" y1="233.6" y2="233.6" stroke="#8a99b0" stroke-width="3"/><text x="90" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">1</text><line x1="140" x2="140" y1="188.2" y2="233.6" stroke="#8a99b0" stroke-width="3"/><line x1="140" x2="150" y1="197.3" y2="197.3" stroke="#8a99b0" stroke-width="3"/><text x="140" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">2</text><line x1="190" x2="190" y1="151.8" y2="206.4" stroke="#8a99b0" stroke-width="3"/><line x1="190" x2="200" y1="174.5" y2="174.5" stroke="#8a99b0" stroke-width="3"/><text x="190" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">3</text><line x1="240" x2="240" y1="170" y2="220" stroke="#8a99b0" stroke-width="3"/><line x1="240" x2="250" y1="201.8" y2="201.8" stroke="#8a99b0" stroke-width="3"/><text x="240" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">4</text><line x1="290" x2="290" y1="120" y2="174.5" stroke="#8a99b0" stroke-width="3"/><line x1="290" x2="300" y1="129.1" y2="129.1" stroke="#8a99b0" stroke-width="3"/><text x="290" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">5</text><line x1="340" x2="340" y1="88.2" y2="142.7" stroke="#8a99b0" stroke-width="3"/><line x1="340" x2="350" y1="106.4" y2="106.4" stroke="#8a99b0" stroke-width="3"/><text x="340" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">6</text><line x1="390" x2="390" y1="101.8" y2="151.8" stroke="#8a99b0" stroke-width="3"/><line x1="390" x2="400" y1="142.7" y2="142.7" stroke="#8a99b0" stroke-width="3"/><text x="390" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">7</text><line x1="440" x2="440" y1="142.7" y2="201.8" stroke="#1a2a44" stroke-width="3"/><line x1="440" x2="450" y1="188.2" y2="188.2" stroke="#1a2a44" stroke-width="3"/><text x="440" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">8</text><line x1="490" x2="490" y1="174.5" y2="224.5" stroke="#1a2a44" stroke-width="3"/><line x1="490" x2="500" y1="210.9" y2="210.9" stroke="#1a2a44" stroke-width="3"/><text x="490" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">9</text><line x1="540" x2="540" y1="206.4" y2="251.8" stroke="#1a2a44" stroke-width="3"/><line x1="540" x2="550" y1="233.6" y2="233.6" stroke="#1a2a44" stroke-width="3"/><text x="540" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">10</text><line x1="590" x2="590" y1="179.1" y2="233.6" stroke="#1a2a44" stroke-width="3"/><line x1="590" x2="600" y1="188.2" y2="188.2" stroke="#1a2a44" stroke-width="3"/><text x="590" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">11</text><line x1="640" x2="640" y1="129.1" y2="192.7" stroke="#1a2a44" stroke-width="3"/><line x1="640" x2="650" y1="138.2" y2="138.2" stroke="#1a2a44" stroke-width="3"/><text x="640" y="300" fill="#5a6b85" font-size="12" text-anchor="middle">12</text><text x="70" y="322" fill="#5a6b85" font-size="12">Bar (tick on the right of each bar = close)</text><line x1="682" x2="682" y1="129.1" y2="251.8" stroke="#c99700" stroke-width="2"/><line x1="677" x2="687" y1="129.1" y2="129.1" stroke="#c99700" stroke-width="2"/><line x1="677" x2="687" y1="251.8" y2="251.8" stroke="#c99700" stroke-width="2"/><line x1="694" x2="694" y1="138.2" y2="251.8" stroke="#0f7c74" stroke-width="3"/><text x="678" y="322" fill="#0f7c74" font-size="13" text-anchor="end">Close 52.70: 2.50 above the low</text><text x="678" y="340" fill="#0f7c74" font-size="13" font-weight="600" text-anchor="end">%K = 2.50 ÷ 2.70 × 100 = 92.6</text><text x="20" y="378" fill="#1a2a44" font-size="17" font-weight="600">2. Oscillator: fast %K and %D (3-bar average), 0 to 100</text><rect width="670" height="34" x="70" y="400" fill="#ef535026"/><rect width="670" height="34" x="70" y="536" fill="#26a69a26"/><line x1="70" x2="740" y1="570" y2="570" stroke="#e3e8ef"/><text x="62" y="575" fill="#5a6b85" font-size="12" text-anchor="end">0</text><line x1="70" x2="740" y1="536" y2="536" stroke="#8a99b0" stroke-dasharray="5 4"/><text x="62" y="541" fill="#5a6b85" font-size="12" text-anchor="end">20</text><line x1="70" x2="740" y1="485" y2="485" stroke="#e3e8ef"/><text x="62" y="490" fill="#5a6b85" font-size="12" text-anchor="end">50</text><line x1="70" x2="740" y1="434" y2="434" stroke="#8a99b0" stroke-dasharray="5 4"/><text x="62" y="439" fill="#5a6b85" font-size="12" text-anchor="end">80</text><line x1="70" x2="740" y1="400" y2="400" stroke="#e3e8ef"/><text x="62" y="405" fill="#5a6b85" font-size="12" text-anchor="end">100</text><text x="78" y="416" fill="#b03a37" font-size="13">Overbought zone (above 80)</text><text x="78" y="562" fill="#1b7a70" font-size="13">Oversold zone (below 20)</text><path fill="none" stroke="#1f8fb4" stroke-width="3" d="m290 411 50 10.2 50 49.1 50 58.7 50 24 50-1.9 50-53.2 50-85.3"/><path fill="none" stroke="#e07a1f" stroke-dasharray="7 4" stroke-width="3" d="m390 434.2 50 39.3 50 43.9 50 27 50-10.4 50-46.8"/><circle cx="290" cy="411" r="4" fill="#1f8fb4"/><circle cx="340" cy="421.2" r="4" fill="#1f8fb4"/><circle cx="390" cy="470.3" r="4" fill="#1f8fb4"/><circle cx="440" cy="529" r="4" fill="#1f8fb4"/><circle cx="490" cy="553" r="4" fill="#1f8fb4"/><circle cx="540" cy="551.1" r="4" fill="#1f8fb4"/><circle cx="590" cy="497.9" r="4" fill="#1f8fb4"/><circle cx="640" cy="412.6" r="4" fill="#1f8fb4"/><text x="90" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">1</text><text x="140" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">2</text><text x="190" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">3</text><text x="240" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">4</text><text x="290" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">5</text><text x="340" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">6</text><text x="390" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">7</text><text x="440" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">8</text><text x="490" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">9</text><text x="540" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">10</text><text x="590" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">11</text><text x="640" y="590" fill="#5a6b85" font-size="12" text-anchor="middle">12</text><text x="298" y="403" fill="#1f5f86" font-size="13">93.5</text><text x="484" y="571" fill="#1f5f86" font-size="13" text-anchor="end">10.0</text><circle cx="568" cy="541.1" r="11" fill="none" stroke="#1a2a44" stroke-width="2"/><text x="550" y="493.5" fill="#1a2a44" font-size="13" text-anchor="end">%K crosses above %D</text><line x1="548" x2="562" y1="497.5" y2="531.1" stroke="#1a2a44"/><line x1="470" x2="500" y1="373" y2="373" stroke="#1f8fb4" stroke-width="3"/><text x="506" y="378" fill="#1a2a44" font-size="13">Fast %K</text><line x1="580" x2="610" y1="373" y2="373" stroke="#e07a1f" stroke-dasharray="7 4" stroke-width="3"/><text x="616" y="378" fill="#1a2a44" font-size="13">%D (3-bar)</text></svg>