<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 615" width="760" height="615" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
<title>How the stochastic oscillator is read from a price chart</title>
<desc>Twelve daily price bars showing high, low and close, with a five-bar window over bars 8 to 12 marked from its lowest low of 50.20 to its highest high of 52.90. The close of 52.70 is 2.50 above the low in a 2.70 range, so fast %K is 92.6. Below, fast %K and its three-bar average %D on a 0 to 100 scale, with the overbought zone above 80 and the oversold zone below 20 shaded, %K at 93.5 in the overbought zone on bar 5, at 10.0 in the oversold zone on bar 9, and %K crossing above %D on bar 11.</desc>
<rect width="760" height="615" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#1a2a44">1. Price: where does the close sit in the last 5 bars' range?</text>
<line x1="70" x2="740" y1="260.9" y2="260.9" stroke="#e3e8ef"/><text x="62" y="265.9" text-anchor="end" fill="#5a6b85" font-size="12">50</text>
<line x1="70" x2="740" y1="215.5" y2="215.5" stroke="#e3e8ef"/><text x="62" y="220.5" text-anchor="end" fill="#5a6b85" font-size="12">51</text>
<line x1="70" x2="740" y1="170.0" y2="170.0" stroke="#e3e8ef"/><text x="62" y="175.0" text-anchor="end" fill="#5a6b85" font-size="12">52</text>
<line x1="70" x2="740" y1="124.5" y2="124.5" stroke="#e3e8ef"/><text x="62" y="129.5" text-anchor="end" fill="#5a6b85" font-size="12">53</text>
<line x1="70" x2="740" y1="79.1" y2="79.1" stroke="#e3e8ef"/><text x="62" y="84.1" text-anchor="end" fill="#5a6b85" font-size="12">54</text>
<rect x="420" y="129.1" width="240" height="122.7" fill="#f6c94a33" stroke="#c99700" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="420" y="121.1" fill="#7a5c00" font-size="13">5-bar window (bars 8–12): highest high 52.90</text>
<text x="420" y="245.8" fill="#7a5c00" font-size="13" dx="6">lowest low 50.20</text>
<line x1="90" x2="90" y1="215.5" y2="260.9" stroke="#8a99b0" stroke-width="3"/><line x1="90" x2="100" y1="233.6" y2="233.6" stroke="#8a99b0" stroke-width="3"/><text x="90" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">1</text>
<line x1="140" x2="140" y1="188.2" y2="233.6" stroke="#8a99b0" stroke-width="3"/><line x1="140" x2="150" y1="197.3" y2="197.3" stroke="#8a99b0" stroke-width="3"/><text x="140" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">2</text>
<line x1="190" x2="190" y1="151.8" y2="206.4" stroke="#8a99b0" stroke-width="3"/><line x1="190" x2="200" y1="174.5" y2="174.5" stroke="#8a99b0" stroke-width="3"/><text x="190" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">3</text>
<line x1="240" x2="240" y1="170.0" y2="220.0" stroke="#8a99b0" stroke-width="3"/><line x1="240" x2="250" y1="201.8" y2="201.8" stroke="#8a99b0" stroke-width="3"/><text x="240" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">4</text>
