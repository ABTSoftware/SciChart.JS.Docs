<line x1="390" x2="390" y1="101.8" y2="151.8" stroke="#8a99b0" stroke-width="3"/><line x1="390" x2="400" y1="142.7" y2="142.7" stroke="#8a99b0" stroke-width="3"/><text x="390" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">7</text>
<line x1="440" x2="440" y1="142.7" y2="201.8" stroke="#1a2a44" stroke-width="3"/><line x1="440" x2="450" y1="188.2" y2="188.2" stroke="#1a2a44" stroke-width="3"/><text x="440" y="300" text-anchor="middle" fill="#5a6b85" font-size="12">8</text>
