<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" aria-labelledby="t d">
<title id="t">The 10-20 electrode system and the longitudinal bipolar (double banana) montage</title>
<desc id="d">Left: a head seen from above, nose at the top, with the 19 scalp electrodes of the international 10-20 system. Letters name the region (Fp frontopolar, F frontal, T temporal, C central, P parietal, O occipital), odd numbers are on the left in blue, even numbers on the right in orange and z electrodes on the midline in grey. Along the line from nasion to inion the electrodes sit at 10% and then 20% steps of the distance. A1 and A2 are the ear electrodes. Right: the same electrodes joined by arrows into the five front-to-back chains of the longitudinal bipolar montage: left temporal Fp1-F7-T7-P7-O1, left parasagittal Fp1-F3-C3-P3-O1, midline Fz-Cz-Pz, right parasagittal Fp2-F4-C4-P4-O2 and right temporal Fp2-F8-T8-P8-O2. Each arrow is one channel, the first electrode minus the second.</desc>
