<svg xmlns="http://www.w3.org/2000/svg" width="900" height="495" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 495"><title>KPI dashboard layout and the parts of a KPI tile</title><desc>Left: a wireframe of a KPI dashboard in four zones read in order. Zone 1, the headline KPI tiles, runs across the top, starting top-left with the most important KPI. Zone 2, a trend against target, sits below it. Zone 3, a breakdown by region or product, and zone 4, the variance or drill-down, share the bottom row. A dashed path shows the eye scanning the top row, then down the left side. Right: one KPI tile enlarged, with callouts for the name and period, the current value, the comparison with the target, the status in words, the sparkline and the dashed target line.</desc><rect width="900" height="495" fill="#fff"/><text x="20" y="30" fill="#1f2a44" font-size="17" font-weight="600">Layout: most important first, top-left</text><rect width="470" height="405" x="20" y="45" fill="#f3f5f9" stroke="#c9d1df" rx="8"/><g fill="#1f2a44" font-size="12"><rect width="104" height="70" x="34" y="60" fill="#dbeaf6" stroke="#2f7fb8" stroke-width="2" rx="5"/><rect width="104" height="70" x="146" y="60" fill="#fff" stroke="#9aa8bf" rx="5"/><rect width="104" height="70" x="258" y="60" fill="#fff" stroke="#9aa8bf" rx="5"/><rect width="106" height="70" x="370" y="60" fill="#fff" stroke="#9aa8bf" rx="5"/><text x="44" y="80" font-weight="600">KPI 1</text><text x="44" y="96" fill="#41506b">most important</text><text x="156" y="80" font-weight="600">KPI 2</text><text x="268" y="80" font-weight="600">KPI 3</text><text x="380" y="80" font-weight="600">KPI 4</text><polyline fill="none" stroke="#2f7fb8" stroke-width="2" points="44,120 60,114 76,117 92,108 108,110 126,100"/><polyline fill="none" stroke="#7d8aa3" stroke-width="1.5" points="156,118 172,121 188,112 204,115 220,108 238,111"/><polyline fill="none" stroke="#7d8aa3" stroke-width="1.5" points="268,112 284,116 300,110 316,118 332,114 350,120"/><polyline fill="none" stroke="#7d8aa3" stroke-width="1.5" points="380,119 396,115 412,117 428,109 444,112 464,104"/></g><rect width="442" height="140" x="34" y="142" fill="#fff" stroke="#9aa8bf" rx="5"/><g fill="#b9d3ea"><rect width="22" height="48" x="60" y="222"/><rect width="22" height="54" x="92" y="216"/><rect width="22" height="44" x="124" y="226"/><rect width="22" height="60" x="156" y="210"/><rect width="22" height="56" x="188" y="214"/><rect width="22" height="66" x="220" y="204"/><rect width="22" height="62" x="252" y="208"/><rect width="22" height="72" x="284" y="198"/><rect width="22" height="68" x="316" y="202"/><rect width="22" height="80" x="348" y="190"/><rect width="22" height="84" x="380" y="186"/><rect width="22" height="98" x="412" y="172"/></g><polyline fill="none" stroke="#c48a00" stroke-dasharray="6 4" stroke-width="2" points="71,214 103,210 135,208 167,204 199,200 231,198 263,194 295,190 327,188 359,184 391,180 423,168"/><text x="46" y="164" fill="#1f2a44" font-size="13" font-weight="600">2  Trend vs target and last period</text><rect width="216" height="144" x="34" y="294" fill="#fff" stroke="#9aa8bf" rx="5"/><text x="46" y="316" fill="#1f2a44" font-size="13" font-weight="600">3  Breakdown</text><text x="46" y="333" fill="#41506b" font-size="12">by region, product, team</text><g fill="#9aa8bf"><rect width="150" height="14" x="50" y="348"/><rect width="118" height="14" x="50" y="370"/><rect width="170" height="14" x="50" y="392"/><rect width="96" height="14" x="50" y="414"/></g><g stroke="#1f2a44" stroke-width="3"><line x1="176" x2="176" y1="345" y2="365"/><line x1="160" x2="160" y1="367" y2="387"/><line x1="182" x2="182" y1="389" y2="409"/><line x1="130" x2="130" y1="411" y2="431"/></g><rect width="216" height="144" x="260" y="294" fill="#fff" stroke="#9aa8bf" rx="5"/><text x="272" y="316" fill="#1f2a44" font-size="13" font-weight="600">4  Variance and detail</text><text x="272" y="333" fill="#41506b" font-size="12">why the number moved</text><line x1="276" x2="462" y1="400" y2="400" stroke="#7d8aa3"/><rect width="30" height="48" x="284" y="352" fill="#2f7fb8"/><rect width="30" height="40" x="326" y="352" fill="#d9661f"/><rect width="30" height=".1" x="368" y="392" fill="#2f7fb8"/><rect width="30" height="12" x="368" y="380" fill="#2f7fb8"/><rect width="30" height="20" x="410" y="380" fill="#9aa8bf"/><path fill="none" stroke="#d9661f" stroke-dasharray="7 5" stroke-width="2.5" d="M27 136h449m-449 0v308m0-156h223" opacity=".85"/><circle cx="27" cy="136" r="5" fill="#d9661f"/><text x="20" y="470" fill="#1f2a44" font-size="12.5">1 headline KPIs  ·  2 trend  ·  3 breakdown  ·  4 variance and detail</text><text x="20" y="488" fill="#d9661f" font-size="12.5">dashed line: the F-shaped scan path, across the top, then down the left with shorter sweeps</text><circle cx="126" cy="60" r="11" fill="#1f2a44"/><text x="126" y="64.5" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="525" y="30" fill="#1f2a44" font-size="17" font-weight="600">Anatomy of a KPI tile</text><rect width="230" height="180" x="560" y="70" fill="#fff" stroke="#9aa8bf" stroke-width="1.5" rx="8"/><rect width="6" height="180" x="560" y="70" fill="#d9661f"/><text x="580" y="96" fill="#41506b" font-size="14">Gross margin · Q4</text><text x="580" y="136" fill="#1f2a44" font-size="34" font-weight="700">46.1%</text><text x="580" y="162" fill="#d9661f" font-size="14">▼ −1.3 pts vs target</text><rect width="78" height="20" x="580" y="172" fill="#d9661f" rx="3"/><text x="619" y="186" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Off target</text><line x1="580" x2="770" y1="212" y2="212" stroke="#7d8aa3" stroke-dasharray="4 3" stroke-width="1.5"/><polyline fill="none" stroke="#2f7fb8" stroke-width="2.5" points="580,226 597,220 614,229 631,214 648,222 665,210 682,218 699,224 716,215 733,226 750,230 768,236"/><g fill="#1f2a44" font-size="12.5"><line x1="700" x2="810" y1="92" y2="92" stroke="#9aa8bf"/><text x="814" y="88">name and</text><text x="814" y="103">period</text><line x1="690" x2="810" y1="128" y2="128" stroke="#9aa8bf"/><text x="814" y="132">value</text><line x1="738" x2="810" y1="158" y2="158" stroke="#9aa8bf"/><text x="814" y="155">comparison,</text><text x="814" y="169">with a symbol</text><line x1="662" x2="810" y1="182" y2="186" stroke="#9aa8bf"/><text x="814" y="190">status in</text><text x="814" y="204">words</text><line x1="772" x2="810" y1="212" y2="222" stroke="#9aa8bf"/><text x="814" y="226">target line</text><line x1="768" x2="810" y1="236" y2="244" stroke="#9aa8bf"/><text x="814" y="248">12-month</text><text x="814" y="262">sparkline</text><line x1="563" x2="540" y1="250" y2="280" stroke="#9aa8bf"/><text x="525" y="296">colour bar: a second cue, never the only one</text></g><g fill="#41506b" font-size="13"><text x="525" y="340">A tile answers three questions at a glance:</text><text x="525" y="364">• Where are we? (the value)</text><text x="525" y="386">• Compared with what? (target, last period)</text><text x="525" y="408">• Getting better or worse? (the sparkline)</text></g></svg>