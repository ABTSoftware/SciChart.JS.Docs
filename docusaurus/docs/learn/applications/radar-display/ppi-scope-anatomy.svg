<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Parts of a radar display (PPI scope)</title>
<desc id="d">A circular radar display with the radar at the centre, range rings every 10 nautical miles, a bearing scale with 000 degrees at the top, a sweep line at bearing 060 with a fading afterglow behind it, a raw echo (blip), a track symbol with a trail of past plots and a velocity leader, and a data block giving the transponder code, flight level and ground speed. Numbered callouts 1 to 8 are explained in a key on the right.</desc>
