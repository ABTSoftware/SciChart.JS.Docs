<text x="252.6" y="358.8" font-size="13" fill="#1d2b44">95% error ellipse</text>
<line x1="236.6" y1="248.8" x2="162.6" y2="182.8" stroke="#1d2b44"/>
<text x="92.6" y="176.8" font-size="13" fill="#1d2b44">cocked hat</text>
</g>
<polygon points="63.0,355.6 72.0,371.6 54.0,371.6" fill="#C2410C"/>
<text x="75.0" y="367.6" font-size="15" font-weight="700" fill="#C2410C">A</text>
<polygon points="364.0,329.8 373.0,345.8 355.0,345.8" fill="#0E7490"/>
<text x="376.0" y="341.8" font-size="15" font-weight="700" fill="#0E7490">B</text>
<polygon points="200.6,89.0 209.6,105.0 191.6,105.0" fill="#15803D"/>
<text x="212.6" y="101.0" font-size="15" font-weight="700" fill="#15803D">C</text>
<path d="M236.6,246.8 L250.6,260.8 M236.6,260.8 L250.6,246.8" stroke="#DC2626" stroke-width="3"/>
<text x="20" y="438" font-size="13" fill="#1d2b44">Each line: one receiver’s measured bearing. Small errors</text>
<text x="20" y="456" font-size="13" fill="#1d2b44">leave a triangle. The fix sits at the centre of the ellipse.</text>
