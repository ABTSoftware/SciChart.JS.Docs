<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t2">Triangulation with bearings and multilateration with TDOA hyperbolas</title>
<desc id="d2">Two panels with the same three receivers A, B and C and one transmitter. Left, triangulation: three bearing lines from the receivers nearly meet, leaving a small triangle (the cocked hat) and an error ellipse around the fix. Right, TDOA: three hyperbolas, one for each pair of receivers, each the set of points with the same difference in arrival time, cross at the transmitter.</desc>
<rect width="860" height="470" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1d2b44">Triangulation (AOA): bearings cross</text>
<rect x="10" y="45" width="400" height="370" fill="none" stroke="#c9d2e3"/>
<clipPath id="caoa"><rect x="10" y="45" width="400" height="370"/></clipPath>
