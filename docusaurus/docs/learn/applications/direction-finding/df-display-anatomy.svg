<title id="t">How to read a DF (direction finding) display</title>
<desc id="d">A compass-rose DF display for one receiver with six numbered parts: 1 the bearing scale with 000 degrees (north) at the top, 2 the strobe showing the latest bearing of 063 degrees, 3 a shaded spread either side of the strobe showing how much the bearings scatter, 4 dots for recent bearings with the newest at the rim, 5 a stray bearing at 140 degrees from a reflection, and 6 the readout of bearing, spread, quality and signal level.</desc>
