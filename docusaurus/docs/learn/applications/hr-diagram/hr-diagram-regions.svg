<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The regions of a Hertzsprung–Russell diagram</title>
<desc id="d">Luminosity on a log scale from 0.0001 to a million Suns against surface temperature from 40,000 K on the left to 2,500 K on the right. The main sequence runs diagonally from hot bright stars at top left to cool dim stars at bottom right; giants sit above it on the right, supergiants across the top, white dwarfs at the bottom left. Dashed lines mark stars of equal radius: 0.01, 1 and 100 times the radius of the Sun (R☉). The Sun sits on the main sequence at 5,772 K and 1 solar luminosity. Spectral classes O to M run along the top.</desc>
