<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How to read an oscilloscope screen: a worked example</title>
  <desc id="desc">An oscilloscope screen with a 10 by 8 division grid showing a pulse train. The scale is 0.5 volts per division and 0.2 milliseconds per division. The pulse is 6 divisions tall, so it is 3 volts peak to peak. Rising edges are 4 divisions apart, so the period is 0.8 milliseconds and the frequency 1.25 kilohertz. Each pulse is high for 1 division, so the duty cycle is 25 percent. The trigger point is at the centre of the screen, on a rising edge, and the trigger level is marked on the left.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A44"/></marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8EDF5"/></marker>
  </defs>
  <rect width="860" height="500" fill="#FFFFFF"/>
  <rect x="150" y="30" width="500" height="400" fill="#1A2B4A"/>
  <g>
    <line x1="150" y1="30" x2="150" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="200" y1="30" x2="200" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="250" y1="30" x2="250" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="300" y1="30" x2="300" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="350" y1="30" x2="350" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="400" y1="30" x2="400" y2="430" stroke="#4F6690" stroke-width="2"/>
    <line x1="450" y1="30" x2="450" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="500" y1="30" x2="500" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="550" y1="30" x2="550" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="600" y1="30" x2="600" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="650" y1="30" x2="650" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="30" x2="650" y2="30" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="80" x2="650" y2="80" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="130" x2="650" y2="130" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="180" x2="650" y2="180" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="230" x2="650" y2="230" stroke="#4F6690" stroke-width="2"/>
    <line x1="150" y1="280" x2="650" y2="280" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="330" x2="650" y2="330" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="380" x2="650" y2="380" stroke="#4F6690" stroke-width="1"/>
    <line x1="150" y1="430" x2="650" y2="430" stroke="#4F6690" stroke-width="1"/>
    <line x1="396" y1="30" x2="404" y2="30" stroke="#4F6690"/>
    <line x1="396" y1="40" x2="404" y2="40" stroke="#4F6690"/>
    <line x1="396" y1="50" x2="404" y2="50" stroke="#4F6690"/>
    <line x1="396" y1="60" x2="404" y2="60" stroke="#4F6690"/>
    <line x1="396" y1="70" x2="404" y2="70" stroke="#4F6690"/>
    <line x1="396" y1="80" x2="404" y2="80" stroke="#4F6690"/>
    <line x1="396" y1="90" x2="404" y2="90" stroke="#4F6690"/>
    <line x1="396" y1="100" x2="404" y2="100" stroke="#4F6690"/>
    <line x1="396" y1="110" x2="404" y2="110" stroke="#4F6690"/>
    <line x1="396" y1="120" x2="404" y2="120" stroke="#4F6690"/>
    <line x1="396" y1="130" x2="404" y2="130" stroke="#4F6690"/>
    <line x1="396" y1="140" x2="404" y2="140" stroke="#4F6690"/>
    <line x1="396" y1="150" x2="404" y2="150" stroke="#4F6690"/>
    <line x1="396" y1="160" x2="404" y2="160" stroke="#4F6690"/>
