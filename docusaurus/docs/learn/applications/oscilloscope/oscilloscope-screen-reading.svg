<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 860 500"><title id="title">How to read an oscilloscope screen: a worked example</title><desc id="desc">An oscilloscope screen with a 10 by 8 division grid showing a pulse train. The scale is 0.5 volts per division and 0.2 milliseconds per division. The pulse is 6 divisions tall, so it is 3 volts peak to peak. Rising edges are 4 divisions apart, so the period is 0.8 milliseconds and the frequency 1.25 kilohertz. Each pulse is high for 1 division, so the duty cycle is 25 percent. The trigger point is at the centre of the screen, on a rising edge, and the trigger level is marked on the left.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1F2A44" d="m0 0 10 5-10 5z"/></marker><marker id="arrowLight" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#E8EDF5" d="m0 0 10 5-10 5z"/></marker></defs><rect width="860" height="500" fill="#FFF"/><rect width="500" height="400" x="150" y="30" fill="#1A2B4A"/><g stroke="#4F6690"><line x1="150" x2="150" y1="30" y2="430"/><line x1="200" x2="200" y1="30" y2="430"/><line x1="250" x2="250" y1="30" y2="430"/><line x1="300" x2="300" y1="30" y2="430"/><line x1="350" x2="350" y1="30" y2="430"/><line x1="400" x2="400" y1="30" y2="430" stroke-width="2"/><line x1="450" x2="450" y1="30" y2="430"/><line x1="500" x2="500" y1="30" y2="430"/><line x1="550" x2="550" y1="30" y2="430"/><line x1="600" x2="600" y1="30" y2="430"/><line x1="650" x2="650" y1="30" y2="430"/><line x1="150" x2="650" y1="30" y2="30"/><line x1="150" x2="650" y1="80" y2="80"/><line x1="150" x2="650" y1="130" y2="130"/><line x1="150" x2="650" y1="180" y2="180"/><line x1="150" x2="650" y1="230" y2="230" stroke-width="2"/><line x1="150" x2="650" y1="280" y2="280"/><line x1="150" x2="650" y1="330" y2="330"/><line x1="150" x2="650" y1="380" y2="380"/><line x1="150" x2="650" y1="430" y2="430"/><line x1="396" x2="404" y1="30" y2="30"/><line x1="396" x2="404" y1="40" y2="40"/><line x1="396" x2="404" y1="50" y2="50"/><line x1="396" x2="404" y1="60" y2="60"/><line x1="396" x2="404" y1="70" y2="70"/><line x1="396" x2="404" y1="80" y2="80"/><line x1="396" x2="404" y1="90" y2="90"/><line x1="396" x2="404" y1="100" y2="100"/><line x1="396" x2="404" y1="110" y2="110"/><line x1="396" x2="404" y1="120" y2="120"/><line x1="396" x2="404" y1="130" y2="130"/><line x1="396" x2="404" y1="140" y2="140"/><line x1="396" x2="404" y1="150" y2="150"/><line x1="396" x2="404" y1="160" y2="160"/><line x1="396" x2="404" y1="170" y2="170"/><line x1="396" x2="404" y1="180" y2="180"/><line x1="396" x2="404" y1="190" y2="190"/><line x1="396" x2="404" y1="200" y2="200"/><line x1="396" x2="404" y1="210" y2="210"/><line x1="396" x2="404" y1="220" y2="220"/><line x1="396" x2="404" y1="230" y2="230"/><line x1="396" x2="404" y1="240" y2="240"/><line x1="396" x2="404" y1="250" y2="250"/><line x1="396" x2="404" y1="260" y2="260"/><line x1="396" x2="404" y1="270" y2="270"/><line x1="396" x2="404" y1="280" y2="280"/><line x1="396" x2="404" y1="290" y2="290"/><line x1="396" x2="404" y1="300" y2="300"/><line x1="396" x2="404" y1="310" y2="310"/><line x1="396" x2="404" y1="320" y2="320"/><line x1="396" x2="404" y1="330" y2="330"/><line x1="396" x2="404" y1="340" y2="340"/><line x1="396" x2="404" y1="350" y2="350"/><line x1="396" x2="404" y1="360" y2="360"/><line x1="396" x2="404" y1="370" y2="370"/><line x1="396" x2="404" y1="380" y2="380"/><line x1="396" x2="404" y1="390" y2="390"/><line x1="396" x2="404" y1="400" y2="400"/><line x1="396" x2="404" y1="410" y2="410"/><line x1="396" x2="404" y1="420" y2="420"/><line x1="396" x2="404" y1="430" y2="430"/></g><rect width="48" height="48" x="151" y="281" fill="#50C7E0" fill-opacity=".25" stroke="#50C7E0" stroke-width="2"/><line x1="112" x2="148" y1="305" y2="305" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="300" fill="#1F2A44" font-size="14" font-weight="600" text-anchor="end">One division</text><text x="106" y="318" fill="#1F2A44" font-size="13" text-anchor="end">0.2 ms wide,</text><text x="106" y="334" fill="#1F2A44" font-size="13" text-anchor="end">0.5 V tall</text><line x1="150" x2="650" y1="230" y2="230" stroke="#F48420" stroke-dasharray="6 5" stroke-width="1.5"/><path fill="#F48420" d="m136 222 14 8-14 8z"/><text x="128" y="226" fill="#1F2A44" font-size="14" font-weight="600" text-anchor="end">Trigger level</text><text x="128" y="244" fill="#1F2A44" font-size="13" text-anchor="end">1.5 V, rising edge</text><path fill="#F6E05E" stroke="#8A7A1E" d="m136 372 14 8-14 8z"/><text x="128" y="378" fill="#1F2A44" font-size="13" text-anchor="end">0 V</text><text x="128" y="394" fill="#1F2A44" font-size="13" text-anchor="end">(ground level)</text><path fill="#F48420" d="M392 16h16l-8 14z"/><text x="414" y="22" fill="#1F2A44" font-size="13">Trigger point (time zero)</text><path fill="none" stroke="#F6E05E" stroke-linejoin="round" stroke-width="3" d="M150 380h48l4-300h46l4 300h146l4-300h46l4 300h146l4-300h48"/><line x1="402" x2="600" y1="55" y2="55" stroke="#E8EDF5" stroke-width="1.5" marker-end="url(#arrowLight)" marker-start="url(#arrowLight)"/><rect width="142" height="17" x="430" y="35" fill="#1A2B4A"/><text x="501" y="48" fill="#E8EDF5" font-size="13" text-anchor="middle">Period: 4 div = 0.8 ms</text><line x1="402" x2="450" y1="405" y2="405" stroke="#E8EDF5" stroke-width="1.5" marker-end="url(#arrowLight)" marker-start="url(#arrowLight)"/><text x="460" y="410" fill="#E8EDF5" font-size="13">High for 1 div = 0.2 ms</text><line x1="680" x2="680" y1="82" y2="378" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="652" x2="690" y1="80" y2="80" stroke="#1F2A44" stroke-dasharray="3 3"/><line x1="652" x2="690" y1="380" y2="380" stroke="#1F2A44" stroke-dasharray="3 3"/><text x="694" y="214" fill="#1F2A44" font-size="14" font-weight="600">Peak to peak</text><text x="694" y="232" fill="#1F2A44" font-size="13">6 div × 0.5 V/div</text><text x="694" y="250" fill="#1F2A44" font-size="13">= 3 V</text><text x="694" y="300" fill="#1F2A44" font-size="13">Frequency</text><text x="694" y="316" fill="#1F2A44" font-size="13">= 1 / 0.8 ms = 1.25 kHz</text><text x="694" y="340" fill="#1F2A44" font-size="13">Duty cycle</text><text x="694" y="356" fill="#1F2A44" font-size="13">= 0.2 / 0.8 = 25%</text><rect width="500" height="34" x="150" y="446" fill="#EEF2F8" stroke="#C5D0E2" rx="4"/><text x="166" y="468" fill="#1F2A44" font-size="14"><tspan fill="#9A7A00" font-weight="600">CH1</tspan>  0.5 V/div  DC</text><text x="365" y="468" fill="#1F2A44" font-size="14">Time  0.2 ms/div</text><text x="510" y="468" fill="#1F2A44" font-size="14">Trig ↑ CH1 1.5 V</text></svg>