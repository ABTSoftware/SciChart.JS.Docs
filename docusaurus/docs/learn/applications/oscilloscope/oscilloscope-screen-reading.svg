    <line x1="396" y1="330" x2="404" y2="330" stroke="#4F6690"/>
    <line x1="396" y1="340" x2="404" y2="340" stroke="#4F6690"/>
    <line x1="396" y1="350" x2="404" y2="350" stroke="#4F6690"/>
    <line x1="396" y1="360" x2="404" y2="360" stroke="#4F6690"/>
    <line x1="396" y1="370" x2="404" y2="370" stroke="#4F6690"/>
    <line x1="396" y1="380" x2="404" y2="380" stroke="#4F6690"/>
    <line x1="396" y1="390" x2="404" y2="390" stroke="#4F6690"/>
    <line x1="396" y1="400" x2="404" y2="400" stroke="#4F6690"/>
    <line x1="396" y1="410" x2="404" y2="410" stroke="#4F6690"/>
    <line x1="396" y1="420" x2="404" y2="420" stroke="#4F6690"/>
    <line x1="396" y1="430" x2="404" y2="430" stroke="#4F6690"/>
  </g>
  <!-- One division highlighted -->
  <rect x="151" y="281" width="48" height="48" fill="#50C7E0" fill-opacity="0.25" stroke="#50C7E0" stroke-width="2"/>
  <line x1="112" y1="305" x2="148" y2="305" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="106" y="300" font-size="14" text-anchor="end" fill="#1F2A44" font-weight="600">One division</text>
  <text x="106" y="318" font-size="13" text-anchor="end" fill="#1F2A44">0.2 ms wide,</text>
  <text x="106" y="334" font-size="13" text-anchor="end" fill="#1F2A44">0.5 V tall</text>
  <!-- Trigger level -->
  <line x1="150" y1="230" x2="650" y2="230" stroke="#F48420" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M136,222 L150,230 L136,238 z" fill="#F48420"/>
  <text x="128" y="226" font-size="14" text-anchor="end" fill="#1F2A44" font-weight="600">Trigger level</text>
  <text x="128" y="244" font-size="13" text-anchor="end" fill="#1F2A44">1.5 V, rising edge</text>
  <!-- Ground reference -->
  <path d="M136,372 L150,380 L136,388 z" fill="#F6E05E" stroke="#8A7A1E"/>
  <text x="128" y="378" font-size="13" text-anchor="end" fill="#1F2A44">0 V</text>
  <text x="128" y="394" font-size="13" text-anchor="end" fill="#1F2A44">(ground level)</text>
  <!-- Trigger point -->
  <path d="M392,16 L408,16 L400,30 z" fill="#F48420"/>
  <text x="414" y="22" font-size="13" fill="#1F2A44">Trigger point (time zero)</text>
  <!-- The waveform -->
  <path d="M150,380 L198,380 L202,80 L248,80 L252,380 L398,380 L402,80 L448,80 L452,380 L598,380 L602,80 L650,80" fill="none" stroke="#F6E05E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Period -->
  <line x1="402" y1="55" x2="600" y2="55" stroke="#E8EDF5" stroke-width="1.5" marker-start="url(#arrowLight)" marker-end="url(#arrowLight)"/>
  <rect x="430" y="35" width="142" height="17" fill="#1A2B4A"/>
  <text x="501" y="48" font-size="13" text-anchor="middle" fill="#E8EDF5">Period: 4 div = 0.8 ms</text>
  <!-- High time -->
  <line x1="402" y1="405" x2="450" y2="405" stroke="#E8EDF5" stroke-width="1.5" marker-start="url(#arrowLight)" marker-end="url(#arrowLight)"/>
  <text x="460" y="410" font-size="13" fill="#E8EDF5">High for 1 div = 0.2 ms</text>
  <!-- Peak to peak -->
  <line x1="680" y1="82" x2="680" y2="378" stroke="#1F2A44" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="652" y1="80" x2="690" y2="80" stroke="#1F2A44" stroke-dasharray="3 3"/>
  <line x1="652" y1="380" x2="690" y2="380" stroke="#1F2A44" stroke-dasharray="3 3"/>
  <text x="694" y="214" font-size="14" fill="#1F2A44" font-weight="600">Peak to peak</text>
  <text x="694" y="232" font-size="13" fill="#1F2A44">6 div × 0.5 V/div</text>
  <text x="694" y="250" font-size="13" fill="#1F2A44">= 3 V</text>
  <!-- Results and settings -->
  <text x="694" y="300" font-size="13" fill="#1F2A44">Frequency</text>
  <text x="694" y="316" font-size="13" fill="#1F2A44">= 1 / 0.8 ms = 1.25 kHz</text>
  <text x="694" y="340" font-size="13" fill="#1F2A44">Duty cycle</text>
  <text x="694" y="356" font-size="13" fill="#1F2A44">= 0.2 / 0.8 = 25%</text>
  <rect x="150" y="446" width="500" height="34" rx="4" fill="#EEF2F8" stroke="#C5D0E2"/>
  <text x="166" y="468" font-size="14" fill="#1F2A44"><tspan font-weight="600" fill="#9A7A00">CH1</tspan>  0.5 V/div  DC</text>
  <text x="365" y="468" font-size="14" fill="#1F2A44">Time  0.2 ms/div</text>
  <text x="510" y="468" font-size="14" fill="#1F2A44">Trig ↑ CH1 1.5 V</text>
</svg>
