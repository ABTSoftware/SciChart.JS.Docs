<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The SIGINT processing chain, from antenna to emitter list</title>
  <desc>Eight stages in two rows. Top row: antenna, receiver, digitiser producing IQ samples, and FFT producing the spectrum and waterfall. Bottom row: detection against a threshold, parameter measurement of frequency, bandwidth and timing, direction finding giving a bearing, and classification and logging into the emitter list and activity timeline. Under each stage, the dashboard view it feeds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4A6B"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1B2440">From radio waves to an emitter list</text>
  <text x="24" y="58" font-size="15" fill="#4A5675">Each stage turns raw signal into something smaller and more meaningful. Blue labels: the dashboard view it feeds.</text>

  <!-- Row 1 -->
  <g font-size="16" fill="#1B2440">
    <rect x="24" y="86" width="196" height="104" rx="10" fill="#EEF3FB" stroke="#3B4A6B" stroke-width="1.5"/>
    <text x="40" y="114" font-weight="700">1. Antenna</text>
    <text x="40" y="138" font-size="14" fill="#4A5675">Picks up every signal</text>
    <text x="40" y="157" font-size="14" fill="#4A5675">in its frequency range</text>

    <rect x="258" y="86" width="196" height="104" rx="10" fill="#EEF3FB" stroke="#3B4A6B" stroke-width="1.5"/>
    <text x="274" y="114" font-weight="700">2. Receiver</text>
    <text x="274" y="138" font-size="14" fill="#4A5675">Tunes to a band, filters</text>
    <text x="274" y="157" font-size="14" fill="#4A5675">and amplifies it</text>

    <rect x="492" y="86" width="196" height="104" rx="10" fill="#EEF3FB" stroke="#3B4A6B" stroke-width="1.5"/>
    <text x="508" y="114" font-weight="700">3. Digitiser</text>
    <text x="508" y="138" font-size="14" fill="#4A5675">Samples the band as</text>
    <text x="508" y="157" font-size="14" fill="#4A5675">IQ data (two channels)</text>

    <rect x="726" y="86" width="210" height="104" rx="10" fill="#EEF3FB" stroke="#3B4A6B" stroke-width="1.5"/>
    <text x="742" y="114" font-weight="700">4. FFT</text>
    <text x="742" y="138" font-size="14" fill="#4A5675">Power in each frequency</text>
    <text x="742" y="157" font-size="14" fill="#4A5675">bin, many times a second</text>
  </g>
  <g stroke="#3B4A6B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="138" x2="254" y2="138"/>
    <line x1="454" y1="138" x2="488" y2="138"/>
    <line x1="688" y1="138" x2="722" y2="138"/>
  </g>
  <g font-size="14" fill="#1F6FC5" font-weight="600">
    <text x="508" y="214">IQ and constellation plots</text>
    <text x="742" y="214">Spectrum and waterfall</text>
  </g>

  <!-- Turn down to row 2 -->
  <path d="M 831 190 L 831 236 L 122 236 L 122 266" fill="none" stroke="#3B4A6B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g font-size="16" fill="#1B2440">
    <rect x="24" y="270" width="196" height="104" rx="10" fill="#FFF3E8" stroke="#B5651D" stroke-width="1.5"/>
    <text x="40" y="298" font-weight="700">5. Detect</text>
    <text x="40" y="322" font-size="14" fill="#4A5675">Mark bins above a</text>
    <text x="40" y="341" font-size="14" fill="#4A5675">threshold over the noise</text>

    <rect x="258" y="270" width="196" height="104" rx="10" fill="#FFF3E8" stroke="#B5651D" stroke-width="1.5"/>
    <text x="274" y="298" font-weight="700">6. Measure</text>
    <text x="274" y="322" font-size="14" fill="#4A5675">Centre frequency, width,</text>
    <text x="274" y="341" font-size="14" fill="#4A5675">level, on and off times</text>

    <rect x="492" y="270" width="196" height="104" rx="10" fill="#FFF3E8" stroke="#B5651D" stroke-width="1.5"/>
    <text x="508" y="298" font-weight="700">7. Direction-find</text>
    <text x="508" y="322" font-size="14" fill="#4A5675">Bearing from several</text>
    <text x="508" y="341" font-size="14" fill="#4A5675">antennas or stations</text>

    <rect x="726" y="270" width="210" height="104" rx="10" fill="#FFF3E8" stroke="#B5651D" stroke-width="1.5"/>
    <text x="742" y="298" font-weight="700">8. Classify and log</text>
    <text x="742" y="322" font-size="14" fill="#4A5675">Group into emitters,</text>
    <text x="742" y="341" font-size="14" fill="#4A5675">guess the type, record</text>
  </g>
  <g stroke="#3B4A6B" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="322" x2="254" y2="322"/>
    <line x1="454" y1="322" x2="488" y2="322"/>
    <line x1="688" y1="322" x2="722" y2="322"/>
  </g>
  <g font-size="14" fill="#1F6FC5" font-weight="600">
    <text x="40" y="398">Threshold line on the</text>
    <text x="40" y="416">spectrum</text>
    <text x="274" y="398">Emitter list columns</text>
    <text x="508" y="398">Polar DF plot</text>
    <text x="742" y="398">Emitter list and</text>
    <text x="742" y="416">activity timeline</text>
  </g>
  <text x="24" y="452" font-size="13" fill="#4A5675">Stages 1 to 4 handle every signal in the band; from stage 5 on, the system works only with the signals it has found.</text>
</svg>
