<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" role="img" aria-labelledby="t d">
<title id="t">How to read an ultrasound image: a labelled B-mode scan</title>
<desc id="d">A labelled drawing of a fan-shaped B-mode ultrasound image from a curved probe. The probe sits at the top, so the top of the image is the skin and depth increases downwards, with a depth scale in centimetres on the right edge. An orientation marker dot at the top left matches the marker on the side of the probe. Labelled from the top: a bright skin line, dark (hypoechoic) fat, striped muscle between bright fascia lines, and grey (isoechoic) organ tissue with a speckled texture. A vessel crossing the image is coloured by colour Doppler: red on the left, where the flow comes towards the probe, and blue on the right, where the same flow moves away, with a black gap in the middle where the flow is at right angles to the beam. A black (anechoic) fluid-filled cyst has a brighter band below it, posterior enhancement. A small bright (hyperechoic) stone casts a dark acoustic shadow below it. A bright curved boundary lies deeper down.</desc>
