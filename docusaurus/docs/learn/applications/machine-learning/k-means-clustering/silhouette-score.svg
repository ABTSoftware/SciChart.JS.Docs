<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" aria-labelledby="t2 d2" viewBox="0 0 760 440"><title id="t2">How the silhouette of one point is computed</title><desc id="d2">Three clusters. One point i in the blue cluster has solid lines to the other blue points, whose mean length is a = 1.36, and dashed lines to the orange cluster, the nearest other cluster, whose mean length is b = 4.68. A third, green cluster is further away (mean 5.68) and is ignored. The silhouette is s = (b − a) / max(a, b) = 0.71. A scale from −1 to 1 shows: near 1, well inside its cluster; near 0, on a boundary; below 0, probably in the wrong cluster.</desc><rect width="760" height="440" fill="#fff"/><line x1="110" x2="78" y1="300" y2="252" stroke="#1F77B4" stroke-width="2"/><line x1="110" x2="134" y1="300" y2="236" stroke="#1F77B4" stroke-width="2"/><line x1="110" x2="90" y1="300" y2="332" stroke="#1F77B4" stroke-width="2"/><line x1="110" x2="278" y1="300" y2="284" stroke="#E8590C" stroke-dasharray="6 4" stroke-width="2"/><line x1="110" x2="310" y1="300" y2="244" stroke="#E8590C" stroke-dasharray="6 4" stroke-width="2"/><line x1="110" x2="294" y1="300" y2="324" stroke="#E8590C" stroke-dasharray="6 4" stroke-width="2"/><circle cx="110" cy="300" r="8" fill="#1F77B4"/><circle cx="78" cy="252" r="8" fill="#1F77B4"/><circle cx="134" cy="236" r="8" fill="#1F77B4"/><circle cx="90" cy="332" r="8" fill="#1F77B4"/><circle cx="278" cy="284" r="8" fill="#E8590C"/><circle cx="310" cy="244" r="8" fill="#E8590C"/><circle cx="294" cy="324" r="8" fill="#E8590C"/><circle cx="198" cy="116" r="8" fill="#2F9E44"/><circle cx="238" cy="92" r="8" fill="#2F9E44"/><circle cx="174" cy="76" r="8" fill="#2F9E44"/><circle cx="110" cy="300" r="12" fill="none" stroke="#1F2937" stroke-width="2.5"/><text x="32" y="305" fill="#1F2937" font-size="15" font-weight="600" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">point i</text><text x="54" y="204" fill="#1F77B4" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">own cluster</text><text x="270" y="212" fill="#E8590C" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">nearest other cluster</text><text x="254" y="64" fill="#2F9E44" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">further cluster: ignored</text><text x="430" y="80" fill="#1F77B4" font-size="15" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan font-weight="600">a = 1.36</tspan>  mean of the solid lines</text><text x="430" y="108" fill="#E8590C" font-size="15" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif"><tspan font-weight="600">b = 4.68</tspan>  mean of the dashed lines</text><text x="430" y="130" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">(green cluster: mean 5.68, larger, so not b)</text><text x="430" y="172" fill="#1F2937" font-size="17" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">s = (b − a) / max(a, b)</text><text x="430" y="198" fill="#1F2937" font-size="17" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">  = (4.68 − 1.36) / 4.68 = <tspan font-weight="600">0.71</tspan></text><line x1="430" x2="730" y1="270" y2="270" stroke="#1F2937" stroke-width="2"/><line x1="430" x2="430" y1="264" y2="276" stroke="#1F2937" stroke-width="2"/><text x="430" y="294" fill="#1F2937" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">−1</text><line x1="580" x2="580" y1="264" y2="276" stroke="#1F2937" stroke-width="2"/><text x="580" y="294" fill="#1F2937" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">0</text><line x1="730" x2="730" y1="264" y2="276" stroke="#1F2937" stroke-width="2"/><text x="730" y="294" fill="#1F2937" font-size="14" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">1</text><path fill="#1F77B4" d="m686.29 262-7-12h14z"/><text x="686.29" y="244" fill="#1F77B4" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">point i</text><text x="430" y="320" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">below 0: closer to</text><text x="430" y="336" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">another cluster</text><text x="580" y="320" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">near 0: on</text><text x="580" y="336" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">a boundary</text><text x="730" y="320" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="end">near 1: well inside</text><text x="730" y="336" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" text-anchor="end">its own cluster</text><text x="430" y="390" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">The silhouette score of a clustering is the mean</text><text x="430" y="408" fill="#374151" font-size="13" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif">of s over every point.</text></svg>