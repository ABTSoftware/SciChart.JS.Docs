<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" aria-labelledby="t d" viewBox="0 0 760 300"><title id="t">K-means on six points: start, first iteration and convergence</title><desc id="d">Three panels. Panel 1: six grey points P1 to P6 and two starting centroids placed on P1 and P3. Panel 2: points are assigned to the nearest centroid (P1 and P2 blue, P3 to P6 orange), with the dashed boundary halfway between the centroids; arrows move the centroids to the means (1.5, 1.5) and (5, 4.5); inertia falls from 66 to 20. Panel 3: P3 switches to blue; the centroids move to (1.67, 2) and (6, 5), no point changes again, and the inertia is 6.67.</desc><defs><marker id="arr1F77B4" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1F77B4" d="m0 0 10 5-10 5z"/></marker><marker id="arrE8590C" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#E8590C" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="300" fill="#fff"/><rect width="208" height="182" x="16" y="60" fill="#F8FAFC" stroke="#CBD5E1"/><line x1="42" x2="42" y1="60" y2="242" stroke="#E5E7EB"/><line x1="68" x2="68" y1="60" y2="242" stroke="#E5E7EB"/><line x1="94" x2="94" y1="60" y2="242" stroke="#E5E7EB"/><line x1="120" x2="120" y1="60" y2="242" stroke="#E5E7EB"/><line x1="146" x2="146" y1="60" y2="242" stroke="#E5E7EB"/><line x1="172" x2="172" y1="60" y2="242" stroke="#E5E7EB"/><line x1="198" x2="198" y1="60" y2="242" stroke="#E5E7EB"/><line x1="16" x2="224" y1="216" y2="216" stroke="#E5E7EB"/><line x1="16" x2="224" y1="190" y2="190" stroke="#E5E7EB"/><line x1="16" x2="224" y1="164" y2="164" stroke="#E5E7EB"/><line x1="16" x2="224" y1="138" y2="138" stroke="#E5E7EB"/><line x1="16" x2="224" y1="112" y2="112" stroke="#E5E7EB"/><line x1="16" x2="224" y1="86" y2="86" stroke="#E5E7EB"/><line x1="16" x2="120" y1="138" y2="242" stroke="#1F2937" stroke-dasharray="5 4" stroke-width