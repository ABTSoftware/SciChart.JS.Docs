<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 560"><title id="title">How six kinds of classifier shape a decision boundary</title><desc id="desc">Six schematic panels, each split into a red class region and a blue class region by a dark boundary line. Logistic regression and LDA give a straight line. An RBF support vector machine gives a smooth closed curve. A decision tree gives a staircase of horizontal and vertical steps. A random forest gives a finer staircase that follows a curve, with faint copies showing the averaged trees. k-nearest neighbours with k = 1 gives a jagged line with small islands of the other class. Naive Bayes and QDA give an ellipse.</desc><rect width="900" height="560" fill="#FFF"/><g transform="translate(30 20)"><clipPath id="t0"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t0)"><rect width="260" height="180" fill="#F4C7CB"/><path fill="#C7DAF2" d="M50 0h210v180h-50Z"/><path fill="none" stroke="#1B2A41" stroke-width="2.5" d="m50 0 160 180"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">Logistic regression, LDA</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">a straight line</text></g><g transform="translate(320 20)"><clipPath id="t1"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t1)"><rect width="260" height="180" fill="#F4C7CB"/><path fill="#C7DAF2" d="M70 60c40-50 135-35 130 20-4 50-50 25-60 65s-80 25-85-15c-5-30-15-48 15-70"/><path fill="none" stroke="#1B2A41" stroke-width="2.5" d="M70 60c40-50 135-35 130 20-4 50-50 25-60 65s-80 25-85-15c-5-30-15-48 15-70Z"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">RBF SVM</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">a smooth curve of any shape</text></g><g transform="translate(610 20)"><clipPath id="t2"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t2)"><rect width="260" height="180" fill="#F4C7CB"/><path fill="#C7DAF2" d="M0 125h95V75h75V35h90v145H0Z"/><path fill="none" stroke="#1B2A41" stroke-width="2.5" d="M0 125h95V75h75V35h90"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">Decision tree</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">axis-aligned steps</text></g><g transform="translate(30 285)"><clipPath id="t3"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t3)"><rect width="260" height="180" fill="#F4C7CB"/><path fill="#C7DAF2" d="M0 139h16v-1h16v-1h16v-3h16v-4h16v-4h16v-6h16v-6h16v-8h16v-8h16v-9h16V79h16V68h16V56h16V43h16V29h16V14h4v166H0Z"/><path fill="none" stroke="#1B2A41" stroke-opacity=".25" stroke-width="1.2" d="M0 129h16v-1h16v-1h16v-3h16v-4h16v-4h16v-6h16v-6h16v-8h16v-8h16v-9h16V69h16V58h16V46h16V33h16V19h16V4h4"/><path fill="none" stroke="#1B2A41" stroke-opacity=".25" stroke-width="1.2" d="M0 149h16v-1h16v-1h16v-3h16v-4h16v-4h16v-6h16v-6h16v-8h16v-8h16v-9h16V89h16V78h16V66h16V53h16V39h16V24h4"/><path fill="none" stroke="#1B2A41" stroke-width="2.5" d="M0 139h16v-1h16v-1h16v-3h16v-4h16v-4h16v-6h16v-6h16v-8h16v-8h16v-9h16V79h16V68h16V56h16V43h16V29h16V14h4"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">Random forest</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">many small steps, averaged</text></g><g transform="translate(320 285)"><clipPath id="t4"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t4)"><rect width="260" height="180" fill="#F4C7CB"/><path fill="#C7DAF2" d="m0 60 21 1.35L38 95.3 60 92l12 .2 15 17.25 12-26.8 13 17.55 19-1.35 18 25.3 13 6.55 15-30.75 15 31.25 16-9.4 18 5.3 13 2.55L260 168v12H0Z"/><path fill="none" stroke="#1B2A41" stroke-width="2.5" d="m0 60 21 1.35L38 95.3 60 92l12 .2 15 17.25 12-26.8 13 17.55 19-1.35 18 25.3 13 6.55 15-30.75 15 31.25 16-9.4 18 5.3 13 2.55L260 168"/><path fill="#F4C7CB" stroke="#1B2A41" stroke-width="2" d="m45 140 17-12 16 10-6 18-20 2Z"/><path fill="#C7DAF2" stroke="#1B2A41" stroke-width="2" d="m200 40 14-10 14 12-12 14Z"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">k-nearest neighbours, k = 1</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">jagged, with islands</text></g><g transform="translate(610 285)"><clipPath id="t5"><rect width="260" height="180" rx="6"/></clipPath><g clip-path="url(#t5)"><rect width="260" height="180" fill="#F4C7CB"/><ellipse cx="135" cy="92" fill="#C7DAF2" stroke="#1B2A41" stroke-width="2.5" rx="82" ry="52" transform="rotate(-18 135 92)"/></g><rect width="260" height="180" fill="none" stroke="#8A97AB" rx="6"/><text x="130" y="206" fill="#1B2A41" font-size="16" font-weight="600" text-anchor="middle">Naive Bayes, QDA</text><text x="130" y="228" fill="#3C4A60" font-size="15" text-anchor="middle">a curve from two bell shapes</text></g></svg>