<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 500"><title id="title">Anatomy of a decision boundary plot</title><desc id="desc">A two-feature plot split into a red region on the left and a blue region on the right by a dark curved line, the decision boundary, where the predicted probability is 0.5. Dashed curves either side mark probabilities of 0.25 and 0.75, and the strip between them is shaded paler as the uncertain zone. Solid dots are training points and pale outlined dots are test points. One pale blue test point sits on the red side and is circled as a misclassified point. A box in the top-right corner gives the test accuracy. Numbered badges 1 to 6 match the list on the right.</desc><rect width="900" height="500" fill="#FFF"/><clipPath id="plot"><rect width="490" height="420" x="70" y="30"/></clipPath><g clip-path="url(#plot)"><rect width="490" height="420" x="70" y="30" fill="#C7DAF2"/><path fill="#F4C7CB" d="M70 30h180c100 130 0 270 130 420H70Z"/><path fill="#FFF" fill-opacity=".45" d="M205 30c100 130 0 270 130 420h90C295 300 395 160 295 30Z"/><path fill="none" stroke="#D7263D" stroke-dasharray="7 5" stroke-width="1.5" d="M205 30c100 130 0 270 130 420"/><path fill="none" stroke="#1F6FD1" stroke-dasharray="7 5" stroke-width="1.5" d="M295 30c100 130 0 270 130 420"/><path fill="none" stroke="#1B2A41" stroke-width="3" d="M250 30c100 130 0 270 130 420"/><circle cx="506" cy="227" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="173" cy="245" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="373" cy="351" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="132" cy="165" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="131" cy="358" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="532" cy="417" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="384" cy="284" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="161" cy="56" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="176" cy="142" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="104" cy="226" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="288" cy="370" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="539" cy="428" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="468" cy="319" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="232" cy="137" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="435" cy="202" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="471" cy="197" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="521" cy="372" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="90" cy="130" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="500" cy="229" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="531" cy="201" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="123" cy="289" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="440" cy="153" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="129" cy="176" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="524" cy="338" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="143" cy="144" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="135" cy="73" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="449" cy="118" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="142" cy="210" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="186" cy="153" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="527" cy="355" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="227" cy="386" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="185" cy="200" r="7" fill="#D7263D" stroke="#FFF" stroke-width="1.5"/><circle cx="474" cy="294" r="7" fill="#1F6FD1" stroke="#FFF" stroke-width="1.5"/><circle cx="135" cy="426" r="7" fill="#D7263D" fill-opacity=".35" stroke="#D7263D" stroke-width="2"/><circle cx="200" cy="330" r="7" fill="#1F6FD1" fill-opacity=".35" stroke="#1F6FD1" stroke-width="2"/><circle cx="200" cy="330" r="15" fill="none" stroke="#1B2A41" stroke-dasharray="4 3" stroke-width="2"/></g><rect width="490" height="420" x="70" y="30" fill="none" stroke="#8A97AB"/><rect width="120" height="30" x="430" y="40" fill="#1B2A41" rx="4"/><text x="490" y="61" fill="#FFF" font-size="15" text-anchor="middle">Test: 92%</text><text x="315" y="485" fill="#3C4A60" font-size="16" text-anchor="middle">Feature 1</text><text x="30" y="240" fill="#3C4A60" font-size="16" text-anchor="middle" transform="rotate(-90 30 240)">Feature 2</text><text x="262" y="440" fill="#D7263D" font-size="14">P = 0.25</text><text x="436" y="440" fill="#1F6FD1" font-size="14">P = 0.75</text><circle cx="330" cy="230" r="14" fill="#1B2A41"/><text x="330" y="235" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">1</text><circle cx="110" cy="90" r="14" fill="#1B2A41"/><text x="110" y="95" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">2</text><circle cx="262" cy="175" r="14" fill="#1B2A41"/><text x="262" y="180" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">3</text><circle cx="470" cy="400" r="14" fill="#1B2A41"/><text x="470" y="405" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">4</text><circle cx="170" cy="310" r="14" fill="#1B2A41"/><text x="170" y="315" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">5</text><circle cx="410" cy="55" r="14" fill="#1B2A41"/><text x="410" y="60" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">6</text><g fill="#1B2A41" font-size="16"><text x="590" y="60" font-size="18" font-weight="700">Reading the plot</text><g transform="translate(590 95)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="38" y="5">Boundary: the predicted class</text><text x="38" y="25">flips here (P = 0.5)</text></g><g transform="translate(590 160)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="38" y="5">Deep colour: the model</text><text x="38" y="25">is confident</text></g><g transform="translate(590 225)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="38" y="5">Pale band: uncertain zone</text><text x="38" y="25">between P = 0.25 and 0.75</text></g><g transform="translate(590 290)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="38" y="5">Solid dots: training points;</text><text x="38" y="25">pale dots: held-out test points</text></g><g transform="translate(590 355)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="38" y="5">Test point on the wrong side:</text><text x="38" y="25">a misclassification</text></g><g transform="translate(590 420)"><circle cx="14" r="14"/><text x="14" y="5" fill="#FFF" font-size="15" font-weight="700" text-anchor="middle">6</text><text x="38" y="5">Share of test points</text><text x="38" y="25">classified correctly</text></g></g></svg>