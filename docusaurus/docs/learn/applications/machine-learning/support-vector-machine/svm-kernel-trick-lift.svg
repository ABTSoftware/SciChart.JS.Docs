<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" aria-labelledby="t2 d2" style="font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 780 400"><title id="t2">The kernel trick, worked example</title><desc id="d2">Left: in two dimensions, four orange points at radius 0.5 sit inside four blue points at radius 1, and no straight line separates them. Right: a side view after lifting each point to height z = x1 squared plus x2 squared. The orange points rise to 0.25 and the blue points to 1, on a parabola. A flat plane at z = 0.625 now separates them, with margins at 0.25 and 1, a margin width of 0.75. The plane meets the parabola at x1 = plus or minus 0.79, which back in two dimensions is a dashed circle of radius 0.79.</desc><rect width="780" height="400" fill="#fff"/><defs><marker id="ar2" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1F2A44" d="m0 0 10 5-10 5z"/></marker></defs><text x="170" y="34" fill="#1F2A44" font-size="15" font-weight="600" text-anchor="middle">1. In 2D: not linearly separable</text><line x1="20" x2="320" y1="210" y2="210" stroke="#8A94A8"/><line x1="170" x2="170" y1="60" y2="360" stroke="#8A94A8"/><text x="320" y="228" fill="#4A556B" font-size="12" text-anchor="end">x1</text><text x="178" y="70" fill="#4A556B" font-size="12">x2</text><circle cx="170" cy="210" r="94.9" fill="none" stroke="#2E9E57" stroke-dasharray="7 5" stroke-width="2.5"/><text x="243.2" y="136.8" fill="#2E9E57" font-size="12.5">r = 0.79</text><circle cx="230" cy="210" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="110" cy="210" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="170" cy="150" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="170" cy="270" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="290" cy="210" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="50" cy="210" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="170" cy="90" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="170" cy="330" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><text x="230" y="232" fill="#1F2A44" font-size="12" text-anchor="middle">0.5</text><text x="290" y="232" fill="#1F2A44" font-size="12" text-anchor="middle">1</text><line x1="330" x2="400" y1="200" y2="200" stroke="#1F2A44" stroke-width="2" marker-end="url(#ar2)"/><text x="365" y="186" fill="#1F2A44" font-size="12.5" text-anchor="middle">lift</text><text x="365" y="222" fill="#1F2A44" font-size="12" text-anchor="middle">z = x1² + x2²</text><text x="600" y="34" fill="#1F2A44" font-size="15" font-weight="600" text-anchor="middle">2. Lifted (side view): a flat plane separates</text><line x1="440" x2="760" y1="330" y2="330" stroke="#8A94A8"/><line x1="600" x2="600" y1="330" y2="61.2" stroke="#8A94A8"/><text x="760" y="348" fill="#4A556B" font-size="12" text-anchor="end">x1</text><text x="608" y="67.7" fill="#4A556B" font-size="12">z</text><rect width="320" height="161.2" x="440" y="115" fill="#E7ECF4"/><path fill="none" stroke="#8E6CD8" stroke-width="2.5" d="m490 69.8 2 9.4 2 9.2 2 9.1 2 8.8 2 8.7 2 8.5 2 8.4 2 8.1 2 8 2 7.8 2 7.7 2 7.5 2 7.3 2 7.1 2 7 2 6.8 2 6.6 2 6.5 2 6.2 2 6.1 2 6 2 5.7 2 5.6 2 5.5 2 5.2 2 5.1 2 4.9 2 4.7 2 4.6 2 4.3 2 4.3 2 4 2 3.9 2 3.7 2 3.5 2 3.4 2 3.1 2 3 2 2.9 2 2.6 2 2.5 2 2.4 2 2.1 2 2 2 1.8 2 1.6 2 1.5 2 1.3 2 1.1 2 1 2 .7 2 .6 2 .5 2 .2 2 .1 2-.1 2-.2 2-.5 2-.6 2-.7 2-1 2-1.1 2-1.3 2-1.5 2-1.6 2-1.8 2-2 2-2.1 2-2.4 2-2.4 2-2.7 2-2.9 2-3 2-3.1 2-3.4 2-3.5 2-3.7 2-3.9 2-4 2-4.3 2-4.3 2-4.6 2-4.7 2-4.9 2-5.1 2-5.2 2-5.5 2-5.6 2-5.7 2-5.9 2-6.2 2-6.2 2-6.5 2-6.6 2-6.8 2-7 2-7.1 2-7.3 2-7.5 2-7.6 2-7.9 2-8 2-8.1 2-8.4 2-8.5 2-8.7 2-8.8 2-9.1 2-9.2 2-9.4"/><line x1="440" x2="760" y1="195.6" y2="195.6" stroke="#2E9E57" stroke-width="3"/><line x1="440" x2="760" y1="276.2" y2="276.2" stroke="#1F2A44" stroke-dasharray="7 5" stroke-width="1.5"/><line x1="440" x2="760" y1="115" y2="115" stroke="#1F2A44" stroke-dasharray="7 5" stroke-width="1.5"/><text x="442" y="186.6" fill="#2E9E57" font-size="12.5">z = 0.625</text><text x="600" y="186.6" fill="#2E9E57" stroke="#E7ECF4" stroke-width="4" font-size="12.5" paint-order="stroke" text-anchor="middle">separating plane</text><text x="442" y="102" fill="#1F2A44" font-size="12">z = 1</text><text x="442" y="295.2" fill="#1F2A44" font-size="12">z = 0.25</text><circle cx="650" cy="276.2" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="550" cy="276.2" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="600" cy="276.2" r="8" fill="#E0731A" stroke="#fff" stroke-width="1.5"/><circle cx="700" cy="115" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="500" cy="115" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="600" cy="115" r="8" fill="#2B8FB3" stroke="#fff" stroke-width="1.5"/><circle cx="520.9" cy="195.6" r="5" fill="#2E9E57"/><line x1="520.9" x2="520.9" y1="195.6" y2="330" stroke="#2E9E57" stroke-dasharray="3 3"/><circle cx="679.1" cy="195.6" r="5" fill="#2E9E57"/><line x1="679.1" x2="679.1" y1="195.6" y2="330" stroke="#2E9E57" stroke-dasharray="3 3"/><text x="679.1" y="348" fill="#2E9E57" font-size="12" text-anchor="middle">0.79</text><text x="520.9" y="348" fill="#2E9E57" font-size="12" text-anchor="middle">−0.79</text><line x1="745" x2="745" y1="115" y2="276.2" stroke="#1F2A44" stroke-width="1.5" marker-end="url(#ar2)" marker-start="url(#ar2)"/><text x="738" y="233.2" fill="#1F2A44" font-size="12" text-anchor="end">width 0.75</text><text x="390" y="385" fill="#4A556B" font-size="12.5" text-anchor="middle">Inner points rise to z = 0.25, outer points to z = 1. Points on the x2 axis overlap in this view.</text></svg>