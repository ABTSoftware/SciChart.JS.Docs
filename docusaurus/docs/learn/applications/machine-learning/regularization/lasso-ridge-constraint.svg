<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" aria-labelledby="t d" viewBox="0 0 900 470"><title id="t">Why lasso sets coefficients to zero and ridge does not</title><desc id="d">Two panels in the plane of two coefficients, beta 1 and beta 2. In each, brown ellipses are contours of equal residual sum of squares around the least squares estimate. Left: the lasso constraint is a diamond with corners on the axes; the smallest ellipse that touches it meets it at the corner on the beta 1 axis, so beta 2 is exactly zero. Right: the ridge constraint is a circle with no corners; the ellipse touches it at a point where both coefficients are non-zero but smaller.</desc><rect width="900" height="470" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><text x="230" y="42" fill="#d7301f" font-size="18" font-weight="600" text-anchor="middle">Lasso (L1): diamond</text><line x1="40" x2="420" y1="281.11" y2="281.11" stroke="#555" stroke-width="1.2"/><line x1="166.67" x2="166.67" y1="407.78" y2="70" stroke="#555" stroke-width="1.2"/><text x="416" y="301.11" fill="#333" font-size="15" text-anchor="end">β₁</text><text x="174.67" y="84" fill="#333" font-size="15">β₂</text><polygon fill="#d7301f33" stroke="#d7301f" stroke-width="2.5" points="251.1111111111111,281.1111111111111 166.66666666666666,196.66666666666663 82.22222222222221,281.1111111111111 166.66666666666666,365.55555555555554"/><text x="48.44" y="395.11" fill="#d7301f" font-size="13">Allowed: |β₁| + |β₂| ≤ t</text><path fill="none" stroke="#8a5a00" stroke-dasharray="5 4" stroke-width="1.2" d="m343.2 197.5.9.8.8.9.8.9.9.8.8.9.8.9.8.9.8.9.8.9.8 1 .7.9.8.9.7.9.8 1 .7.9.7.9.7 1 .7.9.7 1 .6.9.7 1 .6.9.6 1 .7.9.6 1 .5 1 .6.9.6 1 .5.9.6 1 .5.9.5 1 .5 1 .5.9.4.9.5 1 .4.9.4 1 .4.9.4 1 .4.9.3.9.4.9.3.9.3 1 .3.9.3.9.3.9.2.8.2.9.3.9.2.9.1.8.2.9.2.8.1.9.1.8.1.8.1.8v.8l.1.8v3.9l-.1.7v.7l-.1.7-.1.7-.1.7-.2.7-.1.7-.2.6-.2.7-.2.6-.2.6-.2.6-.3.6-.2.6-.3.5-.3.6-.3.5-.4.6-.3.5