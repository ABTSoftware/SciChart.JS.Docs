<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 400"><title>How an isolation forest isolates an anomaly with few random splits</title><desc>Left: a scatter of about sixty readings in a cluster, plus one reading far to the upper right. Two random cuts, a vertical cut numbered 1 and a horizontal cut numbered 2, are enough to put the far reading in a box of its own, while the few cluster readings on the same side of cut 1 need more; a reading in the middle of the cluster needs many more cuts. Right: the same cuts drawn as a tree. The far reading ends at depth 2, the cluster reading at a path length of about 9. The anomaly score is 2 to the power of minus the average depth divided by c of n, so a short average depth gives a score near 1.</desc><rect width="900" height="400" fill="#fff"/><text x="190" y="30" fill="#1a2b4a" font-size="18" font-weight="600" text-anchor="middle">Random cuts in feature space</text><rect width="300" height="300" x="40" y="50" fill="#f6f8fc" stroke="#555" stroke-width="1.5"/><line x1="205" x2="205" y1="50" y2="350" stroke="#e8590c" stroke-width="2.5"/><line x1="205" x2="340" y1="125" y2="125" stroke="#e8590c" stroke-width="2.5"/><circle cx="205" cy="334" r="11" fill="#e8590c"/><text x="205" y="339" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="324" cy="125" r="11" fill="#e8590c"/><text x="324" y="130" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text><line x1="139" x2="139" y1="152" y2="314" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="175" x2="175" y1="152" y2="314" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="76" x2="238" y1="242" y2="242" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="76" x2="238" y1="212" y2="212" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="163" x2="163" y1="152" y2="314" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><line x1="76" x2="238" y1="221" y2="221" stroke="#8a94a6" stroke-dasharray="4 3" stroke-width="1.2"/><circle cx="117.3" cy="218.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="183.8" cy="245.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="114.1" cy="232" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="168.3" cy="197.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="117.5" cy="268.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="175.2" cy="215.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="200" cy="200.5" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="150.9" cy="238.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="130.5" cy="264.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="156.9" cy="225.6" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="143.7" cy="231.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="162.2" cy="209.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="186.9" cy="223.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="100.3" cy="208.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="111.4" cy="235.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="109.8" cy="229.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="130.6" cy="223.6" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="179.3" cy="269.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="145.4" cy="210.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="151.2" cy="218.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="157.1" cy="260.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="170.9" cy="254.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="210.2" cy="245.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="174.6" cy="229.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="182.6" cy="248.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="184" cy="233.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="191.9" cy="211.3" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="158.2" cy="253.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="177" cy="216" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="203.3" cy="241.3" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="170.6" cy="214.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="162.5" cy="223.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="159.5" cy="248" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="123.6" cy="241.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="171.7" cy="184.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="183.3" cy="198.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="177.3" cy="209" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="159.5" cy="206.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="207.2" cy="239.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="133.2" cy="171.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="161.3" cy="200.9" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="180.2" cy="264.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="159.3" cy="207.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="157.8" cy="256.5" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="150.6" cy="218.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="187.5" cy="208.7" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="155.8" cy="189.4" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="131.2" cy="206.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="187.4" cy="238.8" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="100.3" cy="257.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="161.1" cy="214.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="200.4" cy="260.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="154.1" cy="210.5" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="149.3" cy="301.1" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="178.2" cy="160.6" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="184.1" cy="257.5" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="141.6" cy="223.3" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="157.4" cy="183.3" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="151.5" cy="174.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="133.4" cy="244.2" r="4" fill="#1f77b4" fill-opacity=".8"/><circle cx="156.9" cy="225.6" r="7" fill="none" stroke="#2b8a3e" stroke-width="2.5"/><circle cx="298" cy="98" r="6" fill="#d6336c"/><text x="290" y="86" fill="#d6336c" font-size="13" text-anchor="middle">anomaly</text><text x="40" y="374" fill="#444" font-size="13">Grey dashed: some of the cuts needed for the</text><text x="40" y="392" fill="#444" font-size="13">green-ringed reading inside the cluster</text><text x="650" y="30" fill="#1a2b4a" font-size="18" font-weight="600" text-anchor="middle">The same cuts as a tree</text><rect width="124" height="32" x="588" y="64" fill="#fff" stroke="#1a2b4a" stroke-width="1.5" rx="8"/><text x="650" y="85" fill="#1a2b4a" font-size="13" text-anchor="middle">cut 1: x &lt; 0.55?</text><line x1="650" x2="530" y1="96" y2="144" stroke="#555" stroke-width="1.5"/><text x="582" y="124" fill="#666" font-size="12" text-anchor="end">yes</text><line x1="650" x2="770" y1="96" y2="144" stroke="#555" stroke-width="1.5"/><text x="718" y="124" fill="#666" font-size="12">no</text><polygon fill="#e7f0fb" stroke="#1f77b4" stroke-width="1.5" points="530,146 450,300 610,300"/><text x="530" y="250" fill="#1a2b4a" font-size="13" text-anchor="middle">the cluster:</text><text x="530" y="268" fill="#1a2b4a" font-size="13" text-anchor="middle">many more cuts</text><circle cx="530" cy="314" r="7" fill="none" stroke="#2b8a3e" stroke-width="2.5"/><text x="545" y="319" fill="#2b8a3e" font-size="13">path length ≈ 9</text><rect width="124" height="32" x="708" y="144" fill="#fff" stroke="#1a2b4a" stroke-width="1.5" rx="8"/><text x="770" y="165" fill="#1a2b4a" font-size="13" text-anchor="middle">cut 2: y &lt; 0.75?</text><line x1="770" x2="700" y1="176" y2="224" stroke="#555" stroke-width="1.5"/><text x="727" y="204" fill="#666" font-size="12" text-anchor="end">yes</text><line x1="770" x2="840" y1="176" y2="224" stroke="#555" stroke-width="1.5"/><text x="813" y="204" fill="#666" font-size="12">no</text><rect width="124" height="32" x="638" y="224" fill="#e7f0fb" stroke="#1f77b4" stroke-width="1.5" rx="8"/><text x="700" y="245" fill="#1a2b4a" font-size="13" text-anchor="middle">a few readings</text><text x="700" y="276" fill="#444" font-size="13" text-anchor="middle">more cuts</text><rect width="100" height="32" x="790" y="224" fill="#fde8ef" stroke="#d6336c" stroke-width="1.5" rx="8"/><text x="840" y="245" fill="#d6336c" font-size="13" text-anchor="middle">anomaly</text><text x="840" y="276" fill="#d6336c" font-size="13" text-anchor="middle">depth 2</text><text x="650" y="355" fill="#1a2b4a" font-size="15" text-anchor="middle">score s = 2^(−average depth / c(n))</text><text x="650" y="377" fill="#444" font-size="13" text-anchor="middle">short paths give s near 1; typical paths give s of about 0.5 or less</text></svg>