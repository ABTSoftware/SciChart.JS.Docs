509.8,416.0 513.0,416.0 516.2,416.0 519.5,416.0 522.8,416.0 526.0,416.0 529.2,416.0 532.5,416.0 535.8,416.0 539.0,416.0 542.2,416.0 545.5,416.0 548.8,416.0 552.0,416.0 555.2,416.0 558.5,416.0 561.8,416.0 565.0,416.0 568.2,416.0 571.5,416.0 574.8,416.0 578.0,416.0 581.2,416.0 584.5,416.0 587.8,416.0 591.0,416.0 594.2,416.0 597.5,416.0 600.8,416.0 604.0,416.0 607.2,413.6 610.5,410.1 613.8,406.6 617.0,403.0 620.2,399.5 623.5,396.0 626.8,392.5 630.0,389.0 633.2,385.5 636.5,382.0 639.8,378.5 643.0,375.0 646.2,371.4 649.5,367.9 652.8,364.4 656.0,360.9 659.2,357.4 662.5,353.9 665.8,350.4 669.0,346.9 672.2,343.4 675.5,339.9 678.8,336.3 682.0,332.8 685.2,329.3 688.5,325.8 691.8,322.3 695.0,318.8 698.2,315.3 701.5,311.8 704.8,308.3 708.0,304.8 711.2,301.2"/><text x="630" y="478" fill="#333" font-size="14" text-anchor="middle">z = 3·max(0, 2x + 1) − 4  →  a bend at x = −0.5</text></g></svg>