<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" aria-labelledby="t d" viewBox="0 0 860 490"><title id="t">Where an activation function sits in a neural network unit</title><desc id="d">Three inputs are multiplied by weights and summed with a bias to give a pre-activation z. The activation function f bends z into the unit&apos;s output a, which feeds the next layer. Below, two stacked linear layers, y = 2x + 1 then z = 3y − 4, collapse into one line z = 6x − 1, while putting a ReLU between them gives a bent line.</desc><rect width="860" height="490" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4a5a78" d="m0 0 10 5-10 5z"/></marker></defs><circle cx="70" cy="60" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/><text x="70" y="66" fill="#1d3557" font-size="17" text-anchor="middle">x₁</text><line x1="92" x2="262" y1="60" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/><text x="150" y="73" fill="#4a5a78" font-size="15">w₁</text><circle cx="70" cy="120" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/><text x="70" y="126" fill="#1d3557" font-size="17" text-anchor="middle">x₂</text><line x1="92" x2="262" y1="120" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/><text x="150" y="112" fill="#4a5a78" font-size="15">w₂</text><circle cx="70" cy="180" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/><text x="70" y="186" fill="#1d3557" font-size="17" text-anchor="middle">x₃</text><line x1="92" x2="262" y1="180" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/><text x="150" y="151" fill="#4a5a78" font-size="15">w₃</text><circle cx="292" cy="120" r="30" fill="#fff4e6" stroke="#e07b00" stroke-width="2.2"/><text x="292" y="129" fill="#7a3e00" font-size="26" text-anchor="middle">Σ</text><text x="292" y="180" fill="#333" font-size="15" text-anchor="middle">+ bias b</text><line x1="322" x2="420" y1="120" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/><text x="371" y="110" fill="#1d3557" font-size="17" font-style="italic" text-anchor="middle">z</text><rect width="130" height="96" x="424" y="72" fill="#eef8f0" stroke="#2a9d5c" stroke-width="2.2" rx="12"/><line x1="438" x2="540" y1="150" y2="150" stroke="#b8c4d6"/><line x1="489" x2="489" y1="84" y2="160" stroke="#b8c4d6"/><polyline fill="none" stroke="#2a9d5c" stroke-width="3" points="438.0,150.1 440.6,150.1 443.1,150.2 445.6,150.2 448.2,150.3 450.8,150.5 453.3,150.6 455.9,150.8 458.4,151.1 460.9,151.4 463.5,151.7 466.1,152.0 468.6,152.3 471.1,152.6 473.7,152.8 476.2,152.9 478.8,152.8 481.4,152.5 483.9,151.9 486.4,151.1 489.0,150.0 491.6,148.6 494.1,146.8 496.6,144.8 499.2,142.6 501.8,140.1 504.3,137.5 506.9,134.8 509.4,131.9 511.9,129.1 514.5,126.2 517.0,123.3 519.6,120.5 522.1,117.7 524.7,114.9 527.2,112.2 529.8,109.5 532.4,106.9 534.9,104.3 537.5,101.7 540.0,99.1"/><text x="489" y="64" fill="#1f6b3f" font-size="15" text-anchor="middle">activation f</text><line x1="554" x2="660" y1="120" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/><text x="607" y="110" fill="#1d3557" font-size="17" font-style="italic" text-anchor="middle">a = f(z)</text><rect width="160" height="64" x="664" y="88" fill="#f3f0fa" stroke="#6a4fb3" stroke-width="2" rx="10"/><text x="744" y="116" fill="#3d2a7a" font-size="15" text-anchor="middle">next layer</text><text x="744" y="138" fill="#3d2a7a" font-size="13" text-anchor="middle">(or the output)</text><text x="292" y="216" fill="#555" font-size="14" text-anchor="middle">z = w₁x₁ + w₂x₂ + w₃x₃ + b</text><text x="489" y="196" fill="#555" font-size="14" text-anchor="middle">the only non-linear step</text><line x1="30" x2="830" y1="240" y2="240" stroke="#e3e8f0" stroke-width="2"/><text x="220" y="272" fill="#222" font-size="16" font-weight="600" text-anch