<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" aria-labelledby="t2 d2" viewBox="0 0 860 420"><title id="t2">How the gradient shrinks through sigmoid layers but not through active ReLU units</title><desc id="d2">Bars show the largest share of the output gradient that can reach each of six layers, counting back from the output. With sigmoid, each layer multiplies the gradient by at most 0.25, so it falls to 1, 0.25, 0.0625, 0.016, 0.0039 and 0.001. With ReLU, an active unit passes the gradient on unchanged, so every bar stays at 1, while an inactive unit passes nothing.</desc><rect width="860" height="420" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><text x="430" y="34" fill="#222" font-size="17" font-weight="600" text-anchor="middle">Largest share of the gradient that reaches each layer (weights ignored)</text><line x1="90" x2="800" y1="330" y2="330" stroke="#999"/><line x1="90" x2="800" y1="267.5" y2="267.5" stroke="#eef1f6"/><text x="82" y="272.5" fill="#666" font-size="13" text-anchor="end">0.25</text><line x1="90" x2="800" y1="205" y2="205" stroke="#eef1f6"/><text x="82" y="210" fill="#666" font-size="13" text-anchor="end">0.5</text><line x1="90" x2="800" y1="142.5" y2="142.5" stroke="#eef1f6"/><text x="82" y="147.5" fill="#666" font-size="13" text-anchor="end">0.75</text><line x1="90" x2="800" y1="80" y2="80" stroke="#eef1f6"/><text x="82" y="85" fill="#666" font-size="13" text-anchor="end">1</text><rect width="40" height="250" x="110" y="80" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="156" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="130" y="74" fill="#1d4f7a" font-size="13" text-anchor="middle">1</text><text x="153" y="352" fill="#333" font-size="14" text-anchor="middle">output</text><rect width="40" height="62.5" x="225" y="267.5" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="271" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="245" y="261.5" fill="#1d4f7a" font-size="13" text-anchor="middle">0.25</text><text x="268" y="352" fill="#333" font-size="14" text-anchor="middle">1 back</text><rect width="40" height="15.6" x="340" y="314.4" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="386" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="360" y="308.4" fill="#1d4f7a" font-size="13" text-anchor="middle">0.0625</text><text x="383" y="352" fill="#333" font-size="14" text-anchor="middle">2 back</text><rect width="40" height="3.9" x="455" y="326.1" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="501" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="475" y="320.1" fill="#1d4f7a" font-size="13" text-anchor="middle">0.0156</text><text x="498" y="352" fill="#333" font-size="14" text-anchor="middle">3 back</text><rect width="40" height="1" x="570" y="329" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="616" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="590" y="323" fill="#1d4f7a" font-size="13" text-anchor="middle">0.0039</text><text x="613" y="352" fill="#333" font-size="14" text-anchor="middle">4 back</text><rect width="40" height=".8" x="685" y="329.8" fill="#50a7d8" rx="3"/><rect width="40" height="250" x="731" y="80" fill="#2a9d5c" fill-opacity=".85" rx="3"/><text x="705" y="323.8" fill="#1d4f7a" font-size="13" text-anchor="middle">0.001</text><text x="728" y="352" fill="#333" font-size="14" text-anchor="middle">5 back</text><text x="455" y="376" fill="#333" font-size="14" text-anchor="middle">Layer, counting back from the output</text><rect width="16" height="16" x="250" y="392" fill="#50a7d8" rx="2"/><text x="272" y="405" fill="#333" font-size="14">Sigmoid: ×0.25 at best per layer</text><rect width="16" height="16" x="520" y="392" fill="#2a9d5c" rx="2"/><text x="542" y="405" fill="#333" font-size="14">ReLU, active unit: ×1 per layer</text></g></svg>