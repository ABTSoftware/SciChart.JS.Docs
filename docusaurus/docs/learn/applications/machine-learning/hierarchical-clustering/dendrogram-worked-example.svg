<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 800 420"><title>Five points and their complete-linkage dendrogram</title><desc>Left: five points A to E on a grid, with A and B close together on the left, C and D close together in the middle and E on the right. Right: the dendrogram built from them with complete linkage. A and B join at height 2, C and D at 3, E joins C and D at 5, and the two groups join at 10.44. A dashed cut line at height 4 crosses three vertical branches, giving three clusters: A and B, C and D, and E.</desc><rect width="800" height="420" fill="#fff"/><text x="40" y="30" fill="#1f2a44" font-size="16" font-weight="600">1. Five points</text><g stroke="#e3e8f0"><line x1="60" x2="340" y1="300" y2="300"/><line x1="60" x2="340" y1="272" y2="272"/><line x1="60" x2="340" y1="244" y2="244"/><line x1="60" x2="340" y1="216" y2="216"/><line x1="60" x2="340" y1="188" y2="188"/><line x1="60" x2="60" y1="188" y2="300"/><line x1="116" x2="116" y1="188" y2="300"/><line x1="172" x2="172" y1="188" y2="300"/><line x1="228" x2="228" y1="188" y2="300"/><line x1="284" x2="284" y1="188" y2="300"/><line x1="340" x2="340" y1="188" y2="300"/></g><g fill="#5b6780" font-size="12" text-anchor="middle"><text x="60" y="318">0</text><text x="116" y="318">2</text><text x="172" y="318">4</text><text x="228" y="318">6</text><text x="284" y="318">8</text><text x="340" y="318">10</text></g><g fill="#5b6780" font-size="12" text-anchor="end"><text x="30" y="304">0</text><text x="30" y="248">2</text><text x="30" y="192">4</text></g><ellipse cx="60" cy="272" fill="#2a7fd4" fill-opacity=".1" stroke="#2a7fd4" stroke-width="1.5" rx="20" ry="44"/><ellipse cx="228" cy="258" fill="#e07a10" fill-opacity=".1" stroke="#e07a10" stroke-width="1.5" rx="20" ry="58"/><circle cx="340" cy="216" r="20" fill="#2e9e57" fill-opacity=".1" stroke="#2e9e57" stroke-width="1.5"/><g stroke="#fff" stroke-width="1.5"><circle cx="60" cy="300" r="7" fill="#2a7fd4"/><circle cx="60" cy="244" r="7" fill="#2a7fd4"/><circle cx="228" cy="300" r="7" fill="#e07a10"/><circle cx="228" cy="216" r="7" fill="#e07a10"/><circle cx="340" cy="216" r="7" fill="#2e9e57"/></g><g fill="#1f2a44" font-size="14" font-weight="600"><text x="86" y="305">A (0, 0)</text><text x="86" y="249">B (0, 2)</text><text x="252" y="305">C (6, 0)</text><text x="252" y="221">D (6, 3)</text><text x="300" y="186">E (10, 3)</text></g><text x="40" y="356" fill="#1f2a44" font-size="13">Smallest distances: A–B 2, C–D 3, D–E 4, C–E 5.</text><text x="40" y="376" fill="#1f2a44" font-size="13">The cut at height 4 (right) crosses three</text><text x="40" y="394" fill="#1f2a44" font-size="13">branches, giving these three clusters.</text><text x="420" y="30" fill="#1f2a44" font-size="16" font-weight="600">2. Complete-linkage dendrogram</text><line x1="440" x2="440" y1="60" y2="330" stroke="#5b6780"/><g fill="#5b6780" font-size="12" text-anchor="end"><text x="434" y="334">0</text><text x="434" y="285">2</text><text x="434" y="236">4</text><text x="434" y="187">6</text><text x="434" y="138">8</text><text x="434" y="89">10</text></g><g stroke="#5b6780"><line x1="436" x2="440" y1="330" y2="330"/><line x1="436" x2="440" y1="281" y2="281"/><line x1="436" x2="440" y1="232" y2="232"/><line x1="436" x2="440" y1="183" y2="183"/><line x1="436" x2="440" y1="134" y2="134"/><line x1="436" x2="440" y1="85" y2="85"/></g><text x="404" y="200" fill="#1f2a44" font-size="13" text-anchor="middle" transform="rotate(-90 404 200)">Merge height (distance)</text><g fill="none" stroke-width="3"><path stroke="#2a7fd4" d="M480 330v-49h60v49"/><path stroke="#e07a10" d="M610 330v-73.5h60V330"/><path stroke="#8a96ad" d="M640 256.5v-49h100V330"/><path stroke="#8a96ad" d="M510 281V74h180v133.5"/></g><g fill="#1f2a44" font-size="14" font-weight="600" text-anchor="middle"><text x="480" y="350">A</text><text x="540" y="350">B</text><text x="610" y="350">C</text><text x="670" y="350">D</text><text x="740" y="350">E</text></g><g fill="#1f2a44" font-size="12"><text x="546" y="277">2</text><text x="676" y="252">3</text><text x="746" y="203">5</text><text x="696" y="70">10.44</text></g><line x1="445" x2="785" y1="232" y2="232" stroke="#c0392b" stroke-dasharray="7 5" stroke-width="2"/><text x="522" y="226" fill="#c0392b" font-size="13">cut at 4</text><g fill="#1f2a44" font-size="12"><circle cx="532" cy="112" r="10"/><text x="532" y="116" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="548" y="110">tallest join: the two</text><text x="548" y="125">groups are far apart</text><circle cx="452" cy="374" r="10"/><text x="452" y="378" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="468" y="378">leaves: one per point, in tree order</text></g><text x="420" y="404" fill="#1f2a44" font-size="13">Join height = distance between the merged clusters.</text></svg>