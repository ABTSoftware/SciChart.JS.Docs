<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How to read VWAP and its bands on an intraday chart</title>
<desc id="d">A simulated trading day of 39 ten-minute bars. The VWAP line starts at the first bar, follows the price closely in the busy morning and flattens in the afternoon. Shaded bands at one and two standard deviations widen through the morning. Labels mark the anchor, a stretch where price stays above VWAP, a pullback to VWAP, a close beyond the outer band and the flattening late in the day. A volume pane underneath shows the U-shaped volume pattern.</desc>
