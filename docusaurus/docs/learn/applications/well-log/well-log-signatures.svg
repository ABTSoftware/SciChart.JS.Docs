<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How common rocks and fluids look on a well log</title>
<desc id="d">An idealised well log with depth increasing downwards. A lithology column, then three tracks: gamma ray from 0 to 150 API with sand shaded yellow and shale grey either side of a cutoff; deep resistivity on a logarithmic scale from 0.2 to 2,000 ohm-metres; and neutron porosity (dashed) with bulk density (solid) on compatible sandstone scales, with the gas crossover shaded orange. From the top: shale (high gamma ray, low resistivity, neutron well left of density); gas sand (low gamma ray, high resistivity, density crossing to the left of neutron); a gas-water contact where resistivity drops and the crossover ends; water sand (low gamma ray, low resistivity, curves overlay); shale; oil sand (high resistivity, little crossover); shale; tight limestone (high resistivity but almost no porosity); shale.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="60.0" y="30" text-anchor="middle" font-size="13" fill="#333">Rock</text>
<text x="190.0" y="30" text-anchor="middle" font-size="13" fill="#1a8a43">Gamma ray (API)</text>
<text x="107" y="47" font-size="12" fill="#1a8a43">0</text>
<text x="273" y="47" text-anchor="end" font-size="12" fill="#1a8a43">150</text>
<text x="190.0" y="47" text-anchor="middle" font-size="12" fill="#1a8a43">75</text>
<text x="375.0" y="30" text-anchor="middle" font-size="13" fill="#c62828">Deep resistivity (ohm·m)</text>
<text x="292" y="47" font-size="12" fill="#c62828">0.2</text>
<text x="458" y="47" text-anchor="end" font-size="12" fill="#c62828">2000</text>
<text x="375.0" y="47" text-anchor="middle" font-size="12" fill="#c62828">20</text>
<text x="560.0" y="30" text-anchor="middle" font-size="13" fill="#1e5fbf">Neutron (v/v), dashed</text>
<text x="477" y="47" font-size="12" fill="#1e5fbf">0.45</text>
<text x="643" y="47" text-anchor="end" font-size="12" fill="#1e5fbf">−0.15</text>
<text x="560.0" y="68" text-anchor="middle" font-size="13" fill="#c62828">Density (g/cc), solid</text>
<text x="477" y="85" font-size="12" fill="#c62828">1.90</text>
<text x="643" y="85" text-anchor="end" font-size="12" fill="#c62828">2.90</text>
