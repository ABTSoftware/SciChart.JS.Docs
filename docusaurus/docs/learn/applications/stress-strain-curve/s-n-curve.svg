<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" fill="#1f2a44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 440"><title>S-N (fatigue) curves on logarithmic axes</title><desc>Stress amplitude against the number of cycles to failure, both on logarithmic axes from 1,000 to 1,000,000,000 cycles and 50 to 500 MPa. A steel with a tensile strength of 380 MPa follows a straight sloping line from about 342 MPa at 1,000 cycles to its endurance limit of about 190 MPa near one million cycles, then runs flat: below that stress a smooth specimen usually does not fail. An aluminium alloy has no flat part: its line keeps falling, so its fatigue strength is quoted at a stated number of cycles, such as 500 million. A few scattered test points sit around the steel line.</desc><rect width="760" height="440" fill="#fff"/><path stroke="#e3e8f0" d="M90 370V40"/><text x="90" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">3</tspan></text><path stroke="#e3e8f0" d="M191.7 370V40"/><text x="191.7" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">4</tspan></text><path stroke="#e3e8f0" d="M293.3 370V40"/><text x="293.3" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">5</tspan></text><path stroke="#e3e8f0" d="M395 370V40"/><text x="395" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">6</tspan></text><path stroke="#e3e8f0" d="M496.7 370V40"/><text x="496.7" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">7</tspan></text><path stroke="#e3e8f0" d="M598.3 370V40"/><text x="598.3" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">8</tspan></text><path stroke="#e3e8f0" d="M700 370V40"/><text x="700" y="390" font-size="13" text-anchor="middle">10<tspan dy="-6" font-size="10">9</tspan></text><path stroke="#e3e8f0" d="M90 370h610"/><text x="82" y="375" font-size="13" text-anchor="end">50</text><path stroke="#e3e8f0" d="M90 270.7h610"/><text x="82" y="275.7" font-size="13" text-anchor="end">100</text><path stroke="#e3e8f0" d="M90 171.3h610"/><text x="82" y="176.3" font-size="13" text-anchor="end">200</text><path stroke="#e3e8f0" d="M90 113.2h610"/><text x="82" y="118.2" font-size="13" text-anchor="end">300</text><path stroke="#e3e8f0" d="M90 40h610"/><text x="82" y="45" font-size="13" text-anchor="end">500</text><path stroke="#1f2a44" stroke-width="1.5" d="M90 370h610m-610 0V40"/><text x="395" y="418" text-anchor="middle">Cycles to failure, N (log scale)</text><text x="30" y="205" text-anchor="middle" transform="rotate(-90 30 205)">Stress amplitude, S (MPa, log scale)</text><path fill="none" stroke="#1565c0" stroke-width="3" d="m90 94.4 305 84.3h305"/><text x="120.6" y="82.4" fill="#1565c0" font-weight="600">Steel (UTS 380 MPa)</text><path stroke="#1f2a44" marker-end="url(#ah)" d="M395 198.7v-14"/><text x="401" y="204.7">Knee: endurance limit ≈ 0.5 × UTS</text><text x="514.6" y="168.7" fill="#1565c0">Below this: usually no fatigue failure</text><path fill="none" stroke="#e65100" stroke-dasharray="9 5" stroke-width="3" d="m90 151.3 10.2 2.2 10.1 2.1 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.1 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.1 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.1 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.1 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.1 10.2 2.2 10.1 2.2 10.2 2.2 10.2 2.1 10.1 2.2 10.2 2.2 10.2 2.2 10.1 2.2 10.2 2.1 10.2 2.2 10.1 2.2L700 282"/><text x="120.6" y="201.8" fill="#e65100" font-weight="600">Aluminium alloy</text><circle cx="669.4" cy="275.4" r="5" fill="#fff" stroke="#e65100" stroke-width="2"/><text x="663.4" y="299.4" text-anchor="end">No knee: fatigue strength quoted at a set life, e.g. 5 × 10<tspan dy="-6" font-size="10">8</tspan><tspan dy="6"> cycles</tspan></text><circle cx="206.1" cy="119.5" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="139.6" cy="98.4" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="262.2" cy="143.9" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="254.6" cy="137.8" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="130.4" cy="108.5" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="144.5" cy="108.2" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="232.7" cy="131.9" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="179.5" cy="122.9" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="286.4" cy="138.4" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="225.4" cy="135.3" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="378.6" cy="158.5" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="197.1" cy="119.3" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="158.6" cy="108.2" r="4" fill="#1565c0" fill-opacity=".55"/><circle cx="336.2" cy="157.7" r="4" fill="#1565c0" fill-opacity=".55"/><text x="99.9" y="321.8" fill="#3f5175" font-size="13">Each dot is one specimen: fatigue lives scatter widely,</text><text x="99.9" y="338.8" fill="#3f5175" font-size="13">so S-N curves are fitted to many tests at each stress.</text><defs><marker id="ah" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z"/></marker></defs><text x="90" y="432" fill="#6b7a99" font-size="12">Illustrative, fully reversed loading. Steel line: the 0.9 × UTS at 10³ and 0.5 × UTS at 10⁶ cycles estimate.</text></svg>