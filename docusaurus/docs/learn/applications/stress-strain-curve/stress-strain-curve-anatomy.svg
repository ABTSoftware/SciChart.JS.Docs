<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2a44">
<title>Annotated stress-strain curve of a ductile metal</title>
<desc>Engineering stress against engineering strain for a ductile metal, not to scale. The curve rises in a straight line through the elastic region, whose slope is Young's modulus, up to the proportional limit. A dashed line parallel to it, starting at 0.2% strain, crosses the curve at the 0.2% offset yield strength. The curve then rises more slowly through strain hardening to its highest point, the ultimate tensile strength, where necking begins, and falls until the specimen fractures. Bands along the bottom name the elastic, strain hardening and necking regions; the uniform elongation and the elongation at fracture are marked under the strain axis.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2a44"/></marker></defs>
