<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How to read a market depth chart</title>
<desc id="d">A depth chart of a small order book. Green bid steps rise to the left of the best bid at 100.00, red ask steps rise to the right of the best ask at 100.02. The gap between them is the 0.02 spread, with the mid price of 100.01 marked by a dashed line. A tall red step at 100.06 is labelled as an ask wall of 2,600. An orange band from 100.02 to 100.04 shows the price levels a market buy of 1,200 walks through.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<line x1="90" x2="730" y1="370.0" y2="370.0" stroke="#e5e8ef"/>
<text x="82" y="374.0" font-size="13" text-anchor="end" fill="#444">0</text>
<line x1="90" x2="730" y1="323.8" y2="323.8" stroke="#e5e8ef"/>
<text x="82" y="327.8" font-size="13" text-anchor="end" fill="#444">1,000</text>
<line x1="90" x2="730" y1="277.7" y2="277.7" stroke="#e5e8ef"/>
<text x="82" y="281.7" font-size="13" text-anchor="end" fill="#444">2,000</text>
<line x1="90" x2="730" y1="231.5" y2="231.5" stroke="#e5e8ef"/>
<text x="82" y="235.5" font-size="13" text-anchor="end" fill="#444">3,000</text>
<line x1="90" x2="730" y1="185.4" y2="185.4" stroke="#e5e8ef"/>
<text x="82" y="189.4" font-size="13" text-anchor="end" fill="#444">4,000</text>
<line x1="90" x2="730" y1="139.2" y2="139.2" stroke="#e5e8ef"/>
<text x="82" y="143.2" font-size="13" text-anchor="end" fill="#444">5,000</text>
<line x1="90" x2="730" y1="93.1" y2="93.1" stroke="#e5e8ef"/>
<text x="82" y="97.1" font-size="13" text-anchor="end" fill="#444">6,000</text>
<line x1="111.3" x2="111.3" y1="370" y2="375" stroke="#444"/>
<text x="111.3" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.94</text>
<line x1="154.0" x2="154.0" y1="370" y2="375" stroke="#444"/>
<text x="154.0" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.95</text>
<line x1="196.7" x2="196.7" y1="370" y2="375" stroke="#444"/>
<text x="196.7" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.96</text>
<line x1="239.3" x2="239.3" y1="370" y2="375" stroke="#444"/>
<text x="239.3" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.97</text>
<line x1="282.0" x2="282.0" y1="370" y2="375" stroke="#444"/>
<text x="282.0" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.98</text>
<line x1="324.7" x2="324.7" y1="370" y2="375" stroke="#444"/>
<text x="324.7" y="390" font-size="12.5" text-anchor="middle" fill="#444">99.99</text>
<line x1="367.3" x2="367.3" y1="370" y2="375" stroke="#444"/>
<text x="367.3" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.00</text>
<line x1="410.0" x2="410.0" y1="370" y2="375" stroke="#444"/>
<text x="410.0" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.01</text>
<line x1="452.7" x2="452.7" y1="370" y2="375" stroke="#444"/>
<text x="452.7" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.02</text>
<line x1="495.3" x2="495.3" y1="370" y2="375" stroke="#444"/>
<text x="495.3" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.03</text>
<line x1="538.0" x2="538.0" y1="370" y2="375" stroke="#444"/>
<text x="538.0" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.04</text>
<line x1="580.7" x2="580.7" y1="370" y2="375" stroke="#444"/>
<text x="580.7" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.05</text>
<line x1="623.3" x2="623.3" y1="370" y2="375" stroke="#444"/>
<text x="623.3" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.06</text>
<line x1="666.0" x2="666.0" y1="370" y2="375" stroke="#444"/>
<text x="666.0" y="390" font-size="12.5" text-anchor="middle" fill="#444">100.07</text>
<line x1="90" x2="730" y1="370" y2="370" stroke="#444"/>
<line x1="90" x2="90" y1="60" y2="370" stroke="#444"/>
<text x="410.0" y="414" font-size="14" text-anchor="middle" fill="#222">Price</text>
<text transform="translate(26 220.0) rotate(-90)" font-size="14" text-anchor="middle" fill="#222">Cumulative size</text>
<rect x="452.7" y="60" width="85.3" height="310" fill="#f5a623" fill-opacity="0.18"/>
<polygon points="90.0,370.0 90.0,143.8 154.0,143.8 154.0,180.8 196.7,180.8 196.7,213.1 239.3,213.1 239.3,282.3 282.0,282.3 282.0,323.8 324.7,323.8 324.7,351.5 367.3,351.5 367.3,370.0" fill="#26a69a" fill-opacity="0.35"/>
<polyline points="90.0,143.8 154.0,143.8 154.0,180.8 196.7,180.8 196.7,213.1 239.3,213.1 239.3,282.3 282.0,282.3 282.0,323.8 324.7,323.8 324.7,351.5 367.3,351.5 367.3,370.0" fill="none" stroke="#1b7f75" stroke-width="2.5"/>
<polygon points="452.7,370.0 452.7,356.2 495.3,356.2 495.3,333.1 538.0,333.1 538.0,296.2 580.7,296.2 580.7,240.8 623.3,240.8 623.3,120.8 666.0,120.8 666.0,88.5 730.0,88.5 730.0,370.0" fill="#ef5350" fill-opacity="0.30"/>
<polyline points="452.7,370.0 452.7,356.2 495.3,356.2 495.3,333.1 538.0,333.1 538.0,296.2 580.7,296.2 580.7,240.8 623.3,240.8 623.3,120.8 666.0,120.8 666.0,88.5 730.0,88.5" fill="none" stroke="#c62828" stroke-width="2.5"/>
<line x1="410.0" x2="410.0" y1="60" y2="370" stroke="#333" stroke-dasharray="5 4"/>
<text x="410.0" y="54" font-size="13" text-anchor="middle" fill="#222">Mid 100.01</text>
<line x1="367.3" x2="452.7" y1="340" y2="340" stroke="#333" stroke-width="1.5"/>
<line x1="367.3" x2="367.3" y1="334" y2="346" stroke="#333" stroke-width="1.5"/>
<line x1="452.7" x2="452.7" y1="334" y2="346" stroke="#333" stroke-width="1.5"/>
<text x="410.0" y="330" font-size="13" text-anchor="middle" fill="#222">Spread 0.02</text>
<text x="363.3" y="289.2" font-size="13" text-anchor="end" fill="#1b7f75">Best bid</text>
<text x="363.3" y="305.2" font-size="13" text-anchor="end" fill="#1b7f75">100.00 (400)</text>
<text x="456.7" y="266.2" font-size="13" fill="#c62828">Best ask</text>
<text x="456.7" y="282.2" font-size="13" fill="#c62828">100.02 (300)</text>
<line x1="606.3" y1="171.5" x2="620.3" y2="185.4" stroke="#c62828" stroke-width="1.5"/>
<text x="614.8" y="162.3" font-size="13" text-anchor="end" fill="#c62828">Ask wall: 2,600 at 100.06</text>
<text x="100" y="76" font-size="13" fill="#1b7f75">Bids: all buy orders at or above</text>
<text x="100" y="92" font-size="13" fill="#1b7f75">each price, added up to the left</text>
<text x="516.7" y="76" font-size="13" fill="#c62828" text-anchor="end">Asks: all sell orders at or below</text>
<text x="516.7" y="92" font-size="13" fill="#c62828" text-anchor="end">each price, added up to the right</text>
<text x="495.3" y="432" font-size="13" text-anchor="middle" fill="#b36b00">A market buy of 1,200 fills from 100.02 to 100.04</text>
</svg>
