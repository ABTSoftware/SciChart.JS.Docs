<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Parts of a pleth (photoplethysmogram) pulse</title>
  <desc id="desc">Two seconds of a normal pleth waveform from a pulse oximeter, drawn with more blood volume upwards. One pulse is labelled: the steep systolic upstroke, the systolic peak, the dicrotic notch and the smaller diastolic or reflected wave after it. A vertical arrow marks the pulse amplitude, the pulsing (AC) part of the signal. A horizontal arrow marks the beat-to-beat interval, from which the pulse rate is worked out. A box on the right defines the perfusion index as AC divided by DC times 100 per cent.</desc>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
  <g stroke="#d5dbe3" stroke-width="1">
    <line x1="90" y1="90" x2="560" y2="90"/>
    <line x1="90" y1="195" x2="560" y2="195"/>
  </g>
  <line x1="90" y1="60" x2="90" y2="300" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="560" y2="300" stroke="#5b6b7c" stroke-width="1.5"/>
  <g font-size="13" fill="#3c4a5a" text-anchor="middle">
    <text x="90" y="318">0</text>
    <text x="207.5" y="318">0.5</text>
    <text x="325" y="318">1.0</text>
    <text x="442.5" y="318">1.5</text>
    <text x="560" y="318">2.0</text>
  </g>
  <text x="560" y="336" font-size="13" fill="#1d2b3a" text-anchor="end">Time (s)</text>
  <text x="40" y="180" font-size="14" fill="#1d2b3a" text-anchor="middle" transform="rotate(-90 40 180)">Pleth: blood volume (auto-scaled)</text>

