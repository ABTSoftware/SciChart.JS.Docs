  <!-- features of the pulse that starts at 0.85 s -->
  <circle cx="325" cy="90" r="5" fill="#d32f2f"/>
  <text x="325" y="74" font-size="13" font-weight="600" fill="#1d2b3a" text-anchor="middle">Systolic peak</text>
  <line x1="303" y1="214" x2="252" y2="238" stroke="#3c4a5a" stroke-width="1.2"/>
  <text x="246" y="252" font-size="12" fill="#1d2b3a" text-anchor="middle">Systolic upstroke</text>
  <circle cx="362.6" cy="257.2" r="5" fill="#7b3fa0"/>
