  <text x="362.6" y="338" font-size="12" fill="#1d2b3a" text-anchor="middle">Dicrotic notch</text>
  <line x1="388" y1="210" x2="420" y2="176" stroke="#3c4a5a" stroke-width="1.2"/>
  <text x="424" y="166" font-size="12" fill="#1d2b3a">Diastolic</text>
  <text x="424" y="181" font-size="12" fill="#1d2b3a">(reflected) wave</text>

  <!-- AC amplitude -->
  <line x1="330" y1="90" x2="580" y2="90" stroke="#b5571b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="560" y1="300" x2="580" y2="300" stroke="#b5571b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="575" y1="96" x2="575" y2="294" stroke="#b5571b" stroke-width="1.5"/>
  <path d="M575,91 l-5,9 l10,0 z M575,299 l-5,-9 l10,0 z" fill="#b5571b"/>
  <text x="592" y="195" font-size="12" fill="#b5571b" text-anchor="middle" transform="rotate(-90 592 195)">AC: pulse amplitude</text>

  <!-- interval -->
  <g stroke="#2e7d32" stroke-width="1.5">
    <line x1="292" y1="362" x2="492" y2="362"/>
    <line x1="292" y1="354" x2="292" y2="370"/>
    <line x1="492" y1="354" x2="492" y2="370"/>
  </g>
  <text x="392" y="388" font-size="12" fill="#2e7d32" text-anchor="middle">Beat-to-beat interval: pulse rate = 60 ÷ interval in seconds</text>

  <!-- perfusion index box -->
  <rect x="608" y="90" width="184" height="170" rx="8" fill="#f3f7fb" stroke="#9fb3c8"/>
  <text x="621" y="116" font-size="14" font-weight="700" fill="#1d2b3a">Perfusion index</text>
  <text x="621" y="142" font-size="14" fill="#1d2b3a">PI = AC ÷ DC × 100%</text>
  <g font-size="12" fill="#1d2b3a">
    <text x="621" y="170">AC: light absorbed by the</text>
    <text x="621" y="185">pulsing arterial blood</text>
    <text x="621" y="210">DC: the steady part, from</text>
    <text x="621" y="225">skin, bone, venous blood and</text>
    <text x="621" y="240">non-pulsing arterial blood</text>
  </g>
</svg>
