<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The phases of a normal capnogram</title>
  <desc id="desc">One breath of a normal time capnogram, CO2 in mmHg against time in seconds. Phase I is the flat baseline at zero while CO2-free gas passes the sensor. Phase II is the steep rise as alveolar gas reaches the sensor. Phase III is the alveolar plateau, rising slightly to the end-tidal CO2 point at the end of expiration, normally 35 to 45 mmHg. Phase 0, also called phase IV, is the steep fall at the start of inspiration. The alpha angle between phases II and III and the beta angle between phase III and the downstroke are marked. Brackets show expiration and inspiration.</desc>
  <rect x="0" y="0" width="800" height="410" fill="#ffffff"/>

  <!-- phase bands (first breath) -->
  <rect x="90" y="60" width="145" height="270" fill="#eef2f7"/>
  <rect x="235" y="60" width="25" height="270" fill="#fde8d0"/>
  <rect x="260" y="60" width="240" height="270" fill="#e6f3e8"/>
  <rect x="500" y="60" width="20" height="270" fill="#f4e2f1"/>

  <!-- grid and y axis -->
  <g stroke="#d5dbe3" stroke-width="1">
    <line x1="90" y1="276" x2="770" y2="276"/>
    <line x1="90" y1="222" x2="770" y2="222"/>
    <line x1="90" y1="168" x2="770" y2="168"/>
    <line x1="90" y1="114" x2="770" y2="114"/>
    <line x1="90" y1="60" x2="770" y2="60"/>
  </g>
  <line x1="90" y1="60" x2="90" y2="330" stroke="#5b6b7c" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="770" y2="330" stroke="#5b6b7c" stroke-width="1.5"/>
  <g font-size="13" fill="#3c4a5a" text-anchor="end">
    <text x="82" y="334">0</text>
    <text x="82" y="280">10</text>
    <text x="82" y="226">20</text>
    <text x="82" y="172">30</text>
    <text x="82" y="118">40</text>
    <text x="82" y="64">50</text>
  </g>
  <text x="34" y="195" font-size="14" fill="#1d2b3a" text-anchor="middle" transform="rotate(-90 34 195)">CO₂ (mmHg)</text>
  <g font-size="13" fill="#3c4a5a" text-anchor="middle">
    <text x="90" y="348">0</text>
    <text x="190" y="348">1</text>
    <text x="290" y="348">2</text>
    <text x="390" y="348">3</text>
    <text x="490" y="348">4</text>
    <text x="590" y="348">5</text>
    <text x="690" y="348">6</text>
  </g>
  <text x="770" y="348" font-size="13" fill="#1d2b3a" text-anchor="end">Time (s)</text>

  <!-- normal range band for EtCO2 -->
  <rect x="440" y="87" width="120" height="54" fill="#2e7d32" fill-opacity="0.10" stroke="#2e7d32" stroke-dasharray="4 3" stroke-width="1"/>

  <!-- waveform -->
  <path d="M90,330 L235,330 C247,330 248,148 260,146.4 L500,124.8 C508,124.8 510,330 520,330 L675,330" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M675,330 C687,330 688,148 700,146.4 L770,140" fill="none" stroke="#1f6f8b" stroke-width="3" stroke-opacity="0.45"/>

  <!-- alpha and beta angles -->
  <path d="M252,170 A24,24 0 0 0 283,144" fill="none" stroke="#b5571b" stroke-width="1.5"/>
  <text x="275" y="168" font-size="15" font-style="italic" fill="#b5571b">α</text>
  <path d="M476,127 A24,24 0 0 0 504,148" fill="none" stroke="#8e3b86" stroke-width="1.5"/>
  <text x="482" y="152" font-size="15" font-style="italic" fill="#8e3b86">β</text>

  <!-- end-tidal point -->
  <circle cx="500" cy="124.8" r="6" fill="#d32f2f" stroke="#ffffff" stroke-width="1.5"/>
  <text x="500" y="78" font-size="14" font-weight="600" fill="#1d2b3a" text-anchor="middle">End-tidal CO₂ (EtCO₂)</text>
  <text x="566" y="118" font-size="12" fill="#2e7d32">normal 35–45 mmHg</text>

  <!-- phase labels -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1d2b3a">
    <text x="162" y="80">I</text>
    <text x="247" y="80">II</text>
    <text x="360" y="80">III</text>
    <text x="510" y="300" font-size="14">0</text>
  </g>
  <g font-size="12" fill="#1d2b3a">
    <text x="98" y="290">Phase I: baseline,</text>
    <text x="98" y="306">CO₂-free gas.</text>
    <text x="98" y="322">Should read 0</text>
    <text x="300" y="240">Phase II: steep rise as</text>
    <text x="300" y="256">alveolar gas reaches the sensor</text>
    <text x="300" y="186">Phase III: alveolar plateau,</text>
    <text x="300" y="202">rising slowly to the end-tidal point</text>
    <text x="528" y="200">Phase 0 (also</text>
    <text x="528" y="216">called phase IV):</text>
    <text x="528" y="232">inspiration</text>
    <text x="528" y="248">washes CO₂ out</text>
  </g>
  <line x1="298" y1="244" x2="258" y2="236" stroke="#b5571b" stroke-width="1.2"/>

  <!-- expiration / inspiration brackets -->
  <g stroke="#3c4a5a" stroke-width="1.5" fill="none">
    <path d="M210,362 L210,370 L500,370 L500,362"/>
    <path d="M503,362 L503,370 L675,370 L675,362"/>
  </g>
  <g font-size="13" fill="#1d2b3a" text-anchor="middle">
    <text x="355" y="390">Expiration</text>
    <text x="589" y="390">Inspiration</text>
  </g>
  <text x="722" y="128" font-size="12" fill="#1f6f8b" fill-opacity="0.8" text-anchor="middle">next breath</text>
</svg>
