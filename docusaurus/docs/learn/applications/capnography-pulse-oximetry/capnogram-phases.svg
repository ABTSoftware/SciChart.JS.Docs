<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 800 410"><title id="title">The phases of a normal capnogram</title><desc id="desc">One breath of a normal time capnogram, CO2 in mmHg against time in seconds. Phase I is the flat baseline at zero while CO2-free gas passes the sensor. Phase II is the steep rise as alveolar gas reaches the sensor. Phase III is the alveolar plateau, rising slightly to the end-tidal CO2 point at the end of expiration, normally 35 to 45 mmHg. Phase 0, also called phase IV, is the steep fall at the start of inspiration. The alpha angle between phases II and III and the beta angle between phase III and the downstroke are marked. Brackets show expiration and inspiration.</desc><rect width="800" height="410" fill="#fff"/><rect width="145" height="270" x="90" y="60" fill="#eef2f7"/><rect width="25" height="270" x="235" y="60" fill="#fde8d0"/><rect width="240" height="270" x="260" y="60" fill="#e6f3e8"/><rect width="20" height="270" x="500" y="60" fill="#f4e2f1"/><g stroke="#d5dbe3"><line x1="90" x2="770" y1="276" y2="276"/><line x1="90" x2="770" y1="222" y2="222"/><line x1="90" x2="770" y1="168" y2="168"/><line x1="90" x2="770" y1="114" y2="114"/><line x1="90" x2="770" y1="60" y2="60"/></g><line x1="90" x2="90" y1="60" y2="330" stroke="#5b6b7c" stroke-width="1.5"/><line x1="90" x2="770" y1="330" y2="330" stroke="#5b6b7c" stroke-width="1.5"/><g fill="#3c4a5a" font-size="13" text-anchor="end"><text x="82" y="334">0</text><text x="82" y="280">10</text><text x="82" y="226">20</text><text x="82" y="172">30</text><text x="82" y="118">40</text><text x="82" y="64">50</text></g><text x="34" y="195" fill="#1d2b3a" font-size="14" text-anchor="middle" transform="rotate(-90 34 195)">CO₂ (mmHg)</text><g fill="#3c4a5a" font-size="13" text-anchor="middle"><text x="90" y="348">0</text><text x="190" y="348">1</text><text x="290" y="348">2</text><text x="390" y="348">3</text><text x="490" y="348">4</text><text x="590" y="348">5</text><text x="690" y="348">6</text></g><text x="770" y="348" fill="#1d2b3a" font-size="13" text-anchor="end">Time (s)</text><rect width="120" height="54" x="440" y="87" fill="#2e7d32" fill-opacity=".1" stroke="#2e7d32" stroke-dasharray="4 3"/><path fill="none" stroke="#1f6f8b" stroke-linejoin="round" stroke-width="3" d="M90 330h145c12 0 13-182 25-183.6l240-21.6c8 0 10 205.2 20 205.2h155"/><path fill="none" stroke="#1f6f8b" stroke-opacity=".45" stroke-width="3" d="M675 330c12 0 13-182 25-183.6l70-6.4"/><path fill="none" stroke="#b5571b" stroke-width="1.5" d="M252 170a24 24 0 0 0 31-26"/><text x="275" y="168" fill="#b5571b" font-size="15" font-style="italic">α</text><path fill="none" stroke="#8e3b86" stroke-width="1.5" d="M476 127a24 24 0 0 0 28 21"/><text x="482" y="152" fill="#8e3b86" font-size="15" font-style="italic">β</text><circle cx="500" cy="124.8" r="6" fill="#d32f2f" stroke="#fff" stroke-width="1.5"/><text x="500" y="78" fill="#1d2b3a" font-size="14" font-weight="600" text-anchor="middle">End-tidal CO₂ (EtCO₂)</text><text x="566" y="118" fill="#2e7d32" font-size="12">normal 35–45 mmHg</text><g fill="#1d2b3a" font-size="15" font-weight="700" text-anchor="middle"><text x="162" y="80">I</text><text x="247" y="80">II</text><text x="360" y="80">III</text><text x="510" y="300" font-size="14">0</text></g><g fill="#1d2b3a" font-size="12"><text x="98" y="290">Phase I: baseline,</text><text x="98" y="306">CO₂-free gas.</text><text x="98" y="322">Should read 0</text><text x="300" y="240">Phase II: steep rise as</text><text x="300" y="256">alveolar gas reaches the sensor</text><text x="300" y="186">Phase III: alveolar plateau,</text><text x="300" y="202">rising slowly to the end-tidal point</text><text x="528" y="200">Phase 0 (also</text><text x="528" y="216">called phase IV):</text><text x="528" y="232">inspiration</text><text x="528" y="248">washes CO₂ out</text></g><line x1="298" x2="258" y1="244" y2="236" stroke="#b5571b" stroke-width="1.2"/><g fill="none" stroke="#3c4a5a" stroke-width="1.5"><path d="M210 362v8h290v-8"/><path d="M503 362v8h172v-8"/></g><g fill="#1d2b3a" font-size="13" text-anchor="middle"><text x="355" y="390">Expiration</text><text x="589" y="390">Inspiration</text></g><text x="722" y="128" fill="#1f6f8b" fill-opacity=".8" font-size="12" text-anchor="middle">next breath</text></svg>