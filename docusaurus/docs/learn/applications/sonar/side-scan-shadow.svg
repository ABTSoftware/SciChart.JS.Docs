<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How a side scan sonar image forms, and how a shadow gives an object's height</title>
  <desc>Top: a side view of a towfish 15 m above a flat seabed, sending a fan of sound to one side. An object 3 m high stands 80 m out; behind it, a strip of seabed 20 m long gets no sound, the acoustic shadow. The height is H times L divided by R plus L, so 15 times 20 over 100 equals 3 m. Bottom: the matching line of the side scan image: a dark water-column gap under the towfish, bright seabed returns, a bright object echo, then a dark shadow, then seabed again.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="19" font-weight="600" fill="#1b2a47">Side view: the towfish, the object and its shadow</text>
  <!-- sea surface -->
  <line x1="20" y1="58" x2="740" y2="58" stroke="#7aa7d6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="740" y="50" font-size="14" text-anchor="end" fill="#3d5a80">sea surface</text>
  <!-- seabed -->
  <rect x="20" y="230" width="720" height="22" fill="#d8c7a3"/>
  <line x1="20" y1="230" x2="740" y2="230" stroke="#8a6d3b" stroke-width="2"/>
  <text x="30" y="247" font-size="14" fill="#5b4520">seabed</text>
  <!-- towfish -->
  <line x1="40" y1="58" x2="76" y2="104" stroke="#555" stroke-width="1.5"/>
  <rect x="62" y="100" width="44" height="12" rx="6" fill="#1b2a47"/>
  <text x="112" y="128" font-size="14" fill="#1b2a47">towfish</text>
  <!-- beam fan -->
  <path d="M 100 106 L 740 160 L 740 230 L 250 230 Z" fill="#f3b44a" fill-opacity="0.18"/>
  <!-- height H -->
  <line x1="84" y1="112" x2="84" y2="230" stroke="#1b2a47" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="92" y="190" font-size="15" fill="#1b2a47">H = 15 m</text>
  <!-- object -->
  <rect x="455" y="186" width="18" height="44" fill="#c0392b"/>
  <text x="440" y="218" font-size="15" text-anchor="end" fill="#c0392b">object, h = 3 m</text>
  <!-- grazing ray over the top of the object to the end of the shadow -->
  <line x1="100" y1="106" x2="473" y2="186" stroke="#e08e0b" stroke-width="2"/>
  <line x1="473" y1="186" x2="563" y2="230" stroke="#e08e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- shadow on the seabed -->
  <rect x="473" y="230" width="90" height="22" fill="#3b3b3b" fill-opacity="0.85"/>
  <text x="518" y="246" font-size="14" text-anchor="middle" fill="#ffffff">shadow</text>
  <!-- dimension lines -->
  <line x1="84" y1="270" x2="473" y2="270" stroke="#1b2a47" stroke-width="1.2"/>
  <line x1="84" y1="264" x2="84" y2="276" stroke="#1b2a47" stroke-width="1.2"/>
  <line x1="473" y1="264" x2="473" y2="276" stroke="#1b2a47" stroke-width="1.2"/>
  <text x="278" y="290" font-size="15" text-anchor="middle" fill="#1b2a47">R = 80 m to the shadow's start</text>
  <line x1="473" y1="270" x2="563" y2="270" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="563" y1="264" x2="563" y2="276" stroke="#c0392b" stroke-width="1.2"/>
  <text x="566" y="290" font-size="15" fill="#c0392b">L = 20 m</text>
  <!-- formula -->
  <text x="740" y="100" font-size="16" text-anchor="end" fill="#1b2a47">h = H × L ÷ (R + L)</text>
  <text x="740" y="122" font-size="16" text-anchor="end" fill="#1b2a47">= 15 × 20 ÷ 100 = 3 m</text>
  <!-- image strip -->
  <text x="20" y="338" font-size="19" font-weight="600" fill="#1b2a47">The same line in the side scan image</text>
  <defs>
    <linearGradient id="seabedFade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="1" stop-color="#b9893a"/>
    </linearGradient>
  </defs>
  <rect x="84" y="356" width="166" height="40" fill="#20160a"/>
  <rect x="250" y="356" width="205" height="40" fill="url(#seabedFade)"/>
  <rect x="455" y="356" width="18" height="40" fill="#fff7dc"/>
  <rect x="473" y="356" width="90" height="40" fill="#20160a"/>
  <rect x="563" y="356" width="177" height="40" fill="#b9893a"/>
  <line x1="84" y1="356" x2="84" y2="396" stroke="#1b2a47" stroke-width="2"/>
  <text x="167" y="420" font-size="14" text-anchor="middle" fill="#1b2a47">water column: no echo yet</text>
  <text x="352" y="420" font-size="14" text-anchor="middle" fill="#1b2a47">seabed returns</text>
  <text x="464" y="442" font-size="14" text-anchor="middle" fill="#c0392b">bright echo</text>
  <text x="518" y="420" font-size="14" text-anchor="middle" fill="#1b2a47">dark shadow</text>
  <text x="652" y="420" font-size="14" text-anchor="middle" fill="#1b2a47">seabed again</text>
  <text x="84" y="462" font-size="13" fill="#3d5a80">Range across →  ·  each ping adds one line, and the lines stack into the image as the towfish moves</text>
</svg>
