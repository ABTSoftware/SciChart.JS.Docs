<svg xmlns="http://www.w3.org/2000/svg" width="839" height="766" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 839 766"><title id="t">Parts of an ECG waveform on ECG paper</title><desc id="d">Two heartbeats from lead II drawn on ECG paper at 25 mm per second and 10 mm per millivolt. Labels mark the P wave, the Q, R and S waves of the QRS complex, the T wave and a small U wave. Brackets show the PR interval (0.16 s), the QRS duration (0.09 s), the ST segment and the QT interval (0.37 s). The RR interval between the two R waves is 0.80 s: 4 large squares or 20 small squares, so the heart rate is 300 / 4 = 1500 / 20 = 75 beats per minute. A calibration pulse at the start is 1 mV tall, which is 10 mm.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="70" x2="70" y1="100" y2="496" stroke="#ec8fa1" stroke-width="1.6"/><line x1="88" x2="88" y1="100" y2="496" stroke="#f8d3da"/><line x1="106" x2="106" y1="100" y2="496" stroke="#f8d3da"/><line x1="124" x2="124" y1="100" y2="496" stroke="#f8d3da"/><line x1="142" x2="142" y1="100" y2="496" stroke="#f8d3da"/><line x1="160" x2="160" y1="100" y2="496" stroke="#ec8fa1" stroke-width="1.6"/><line x1="178" x2="178" y1="100" y2="496" stroke="#f8d3da"/><line x1="196" x2="196" y1="100" y2="496" stroke="#f8d3da"/><line x1="214" x2="214" y1="100" y2="496" stroke="#f8d3da"/><line x1="232" x2="232" y1="100" y2="496" stroke="#f8d3da"/><line x1="250" x2="250" y1="100" y2="496" stroke="#ec8fa1" stroke-width="1.6"/><line x1="268" x2="268" y1="100" y2="496" stroke="#f8d3da"/><line x1="286" x2="286" y1="100" y2="496" stroke="#f8d3da"/><line x1="304" x2="304" y1="100" y2="496" stroke="#f8d3da"/><line x1="322" x2="322" y1="100" y2="496" stroke="#f8d3da"/><line x1="340" x2="340" y1="100" y2="496" stroke="#ec8fa1" stroke-width="1.6"/><line x1="358" x2="358" y1="100" y2="496" stroke="#f8d3da"/><line x1="376" x2="376" y1="100" y2="496" stroke="#f8d3da"/><line x1="3