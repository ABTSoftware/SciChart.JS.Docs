<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 839 766" width="839" height="766" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Parts of an ECG waveform on ECG paper</title>
<desc id="d">Two heartbeats from lead II drawn on ECG paper at 25 mm per second and 10 mm per millivolt. Labels mark the P wave, the Q, R and S waves of the QRS complex, the T wave and a small U wave. Brackets show the PR interval (0.16 s), the QRS duration (0.09 s), the ST segment and the QT interval (0.37 s). The RR interval between the two R waves is 0.80 s: 4 large squares or 20 small squares, so the heart rate is 300 / 4 = 1500 / 20 = 75 beats per minute. A calibration pulse at the start is 1 mV tall, which is 10 mm.</desc>
