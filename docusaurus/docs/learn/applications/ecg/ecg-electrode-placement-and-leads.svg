<circle cx="266" cy="232.5" r="9" fill="#7b3fa0" stroke="#fff" stroke-width="2"/><text x="266.0" y="258.5" font-size="15" font-weight="700" fill="#7b3fa0" text-anchor="middle">V3</text>
<circle cx="290" cy="252" r="9" fill="#7b3fa0" stroke="#fff" stroke-width="2"/><text x="290.0" y="278.0" font-size="15" font-weight="700" fill="#7b3fa0" text-anchor="middle">V4</text>
<circle cx="338" cy="254" r="9" fill="#1f77b4" stroke="#fff" stroke-width="2"/><text x="338.0" y="280.0" font-size="15" font-weight="700" fill="#1f77b4" text-anchor="middle">V5</text>
