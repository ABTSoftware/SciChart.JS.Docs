<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 630" width="940" height="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ECG electrode placement and the directions of the 12 leads</title>
<desc id="d">Left: a front view of the chest with the ten electrodes of a 12-lead ECG. Four limb electrodes: right arm (RA), left arm (LA), left leg (LL) and right leg (RL, the ground). Six chest electrodes: V1 in the fourth intercostal space just right of the sternum, V2 in the fourth intercostal space just left of it, V4 in the fifth intercostal space on the midclavicular line, V3 halfway between V2 and V4, V5 on the anterior axillary line and V6 on the mid-axillary line, both level with V4. Top right: the six limb leads in the frontal plane: I at 0 degrees, II at plus 60, III at plus 120, aVF at plus 90, aVL at minus 30 and aVR at minus 150. Bottom right: the six chest leads in the horizontal plane, seen from below, fanning from V1 at the front right to V6 at the patient's left side. Colours group the leads by the wall of the heart they face: inferior (II, III, aVF), lateral (I, aVL, V5, V6), septal (V1, V2) and anterior (V3, V4).</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="34.0" fill="#1d2a44" font-size="20" font-weight="700">Where the 10 electrodes go</text>
<text x="20.0" y="56.0" font-size="14" fill="#555">Front view: the patient's right is on your left</text>
