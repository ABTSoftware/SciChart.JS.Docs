<text x="20.0" y="575.0" font-size="13" fill="#555">Limb electrodes can sit anywhere along each limb; on monitors and</text>
<text x="20.0" y="593.0" font-size="13" fill="#555">exercise tests they move to the shoulders and lower abdomen.</text>
<text x="470.0" y="34.0" fill="#1d2a44" font-size="20" font-weight="700">Limb leads: the frontal plane</text>
