<svg xmlns="http://www.w3.org/2000/svg" width="940" height="630" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 940 630"><title id="t">ECG electrode placement and the directions of the 12 leads</title><desc id="d">Left: a front view of the chest with the ten electrodes of a 12-lead ECG. Four limb electrodes: right arm (RA), left arm (LA), left leg (LL) and right leg (RL, the ground). Six chest electrodes: V1 in the fourth intercostal space just right of the sternum, V2 in the fourth intercostal space just left of it, V4 in the fifth intercostal space on the midclavicular line, V3 halfway between V2 and V4, V5 on the anterior axillary line and V6 on the mid-axillary line, both level with V4. Top right: the six limb leads in the frontal plane: I at 0 degrees, II at plus 60, III at plus 120, aVF at plus 90, aVL at minus 30 and aVR at minus 150. Bottom right: the six chest leads in the horizontal plane, seen from below, fanning from V1 at the front right to V6 at the patient&apos;s left side. Colours group the leads by the wall of the heart they face: inferior (II, III, aVF), lateral (I, aVL, V5, V6), septal (V1, V2) and anterior (V3, V4).</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="34" fill="#1d2a44" font-size="20" font-weight="700">Where the 10 electrodes go</text><text x="20" y="56" fill="#555" font-size="14">Front view: the patient&apos;s right is on your left</text><path fill="#f3ece6" stroke="#b9a99b" stroke-width="2" d="M150 90q70 20 140 0l80 30q25 15 22 55l-12 215q-10 80-40 110H100q-30-30-40-110L48 175q-3-40 22-55Z"/><path fill="#f3ece6" stroke="#b9a99b" stroke-width="2" d="M48 175 25 330l30 5 7-75"/><path fill="#f3ece6" stroke="#b9a99b" stroke-width="2" d="m392 175 23 155-30 5-7-75"/><rect width="18" height="190" x="211" y="112" fill="#e6dbd1" stroke="#b9a99b" rx="8"/><path fill="none" stroke="#b9a99b" stroke-dasharray="5 5" d="M90 215q130-14 275 6"/><path fill="none" stroke="#b9a99b" stroke-dasharray="5 5" d="M90 248q130-14 275 6"/><text x="52" y="199" fill="#7a6a5c" font-size="12">4th intercostal space</text><text x="52" y="270" fill="#7a6a5c" font-size="12">5th intercostal space</text><line x1="290" x2="290" y1="150" y2="316" stroke="#b9a99b" stroke-dasharray="3 5"/><text x="290" y="330" fill="#7a6a5c" font-size="12" text-anchor="middle">midclavicular line</text><line x1="338" x2="338" y1="150" y2="336" stroke="#b9a99b" stroke-dasharray="3 5"/><text x="338" y="350" fill="#7a6a5c" font-size="12" text-anchor="middle">anterior axillary line</text><line x1="380" x2="380" y1="150" y2="356" stroke="#b9a99b" stroke-dasharray="3 5"/><text x="380" y="370" fill="#7a6a5c" font-size="12" text-anchor="middle">mid-axillary line</text><circle cx="198" cy="209" r="9" fill="#d35400" stroke="#fff" stroke-width="2"/><text x="192" y="195" fill="#d35400" font-size="15" font-weight="700" text-anchor="middle">V1</text><circle cx="242" cy="209" r="9" fill="#d35400" stroke="#fff" stroke-width="2"/><text x="248" y="195" fill="#d35400" font-size="15" font-weight="700" text-anchor="middle">V2</text><circle cx="266" cy="232.5" r="9" fill="#7b3fa0" stroke="#fff" stroke-width="2"/><text x="266" y="258.5" fill="#7b3fa0" font-size="15" font-weight="700" text-anchor="middle">V3</text><circle cx="290" cy="252" r="9" fill="#7b3fa0" stroke="#fff" stroke-width="2"/><text x="290" y="278" fill="#7b3fa0" font-size="15" font-weight="700" text-anchor="middle">V4</text><circle cx="338" cy="254" r="9" fill="#1f77b4" stroke="#fff" stroke-width="2"/><text x="338" y="280" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">V5</text><circle cx="376" cy="257" r="9" fill="#1f77b4" stroke="#fff" stroke-width="2"/><text x="380" y="283" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">V6</text><circle cx="40" cy="318" r="9" fill="#1d2a44" stroke="#fff" stroke-width="2"/><text x="40" y="348" fill="#1d2a44" font-size="15" font-weight="700" text-anchor="middle">RA</text><circle cx="400" cy="318" r="9" fill="#1d2a44" stroke="#fff" stroke-width="2"/><text x="400" y="348" fill="#1d2a44" font-size="15" font-weight="700" text-anchor="middle">LA</text><circle cx="135" cy="480" r="9" fill="#8a8a8a" stroke="#fff" stroke-width="2"/><text x="135" y="464" fill="#8a8a8a" font-size="15" font-weight="700" text-anchor="middle">RL</text><circle cx="305" cy="480" r="9" fill="#1d2a44" stroke="#fff" stroke-width="2"/><text x="305" y="464" fill="#1d2a44" font-size="15" font-weight="700" text-anchor="middle">LL</text><text x="135" y="525" fill="#555" font-size="13" text-anchor="middle">right leg: ground</text><text x="305" y="525" fill="#555" font-size="13" text-anchor="middle">left leg</text><text x="20" y="575" fill="#555" font-size="13">Limb electrodes can sit anywhere along each limb; on monitors and</text><text x="20" y="593" fill="#555" font-size="13">exercise tests they move to the shoulders and lower abdomen.</text><text x="470" y="34" fill="#1d2a44" font-size="20" font-weight="700">Limb leads: the frontal plane</text><circle cx="680" cy="190" r="105" fill="none" stroke="#d8d8d8"/><defs><marker id="m-inferior" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2e7d32" d="m0 0 10 5-10 5z"/></marker><marker id="m-lateral" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f77b4" d="m0 0 10 5-10 5z"/></marker><marker id="m-septal" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d35400" d="m0 0 10 5-10 5z"/></marker><marker id="m-anterior" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7b3fa0" d="m0 0 10 5-10 5z"/></marker><marker id="m-avr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b6b6b" d="m0 0 10 5-10 5z"/></marker></defs><line x1="575" x2="680" y1="190" y2="190" stroke="#1f77b4" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="785" y1="190" y2="190" stroke="#1f77b4" stroke-width="3" marker-end="url(#m-lateral)"/><text x="809" y="195" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">I<tspan dx="3" font-size="12" font-weight="400">0°</tspan></text><line x1="627.5" x2="680" y1="99.1" y2="190" stroke="#2e7d32" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="732.5" y1="190" y2="280.9" stroke="#2e7d32" stroke-width="3" marker-end="url(#m-inferior)"/><text x="744.5" y="306.7" fill="#2e7d32" font-size="15" font-weight="700" text-anchor="middle">II<tspan dx="3" font-size="12" font-weight="400">+60°</tspan></text><line x1="732.5" x2="680" y1="99.1" y2="190" stroke="#2e7d32" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="627.5" y1="190" y2="280.9" stroke="#2e7d32" stroke-width="3" marker-end="url(#m-inferior)"/><text x="615.5" y="306.7" fill="#2e7d32" font-size="15" font-weight="700" text-anchor="middle">III<tspan dx="3" font-size="12" font-weight="400">+120°</tspan></text><line x1="680" x2="680" y1="85" y2="190" stroke="#2e7d32" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="680" y1="190" y2="295" stroke="#2e7d32" stroke-width="3" marker-end="url(#m-inferior)"/><text x="680" y="324" fill="#2e7d32" font-size="15" font-weight="700" text-anchor="middle">aVF<tspan dx="3" font-size="12" font-weight="400">+90°</tspan></text><line x1="589.1" x2="680" y1="242.5" y2="190" stroke="#1f77b4" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="770.9" y1="190" y2="137.5" stroke="#1f77b4" stroke-width="3" marker-end="url(#m-lateral)"/><text x="791.7" y="130.5" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">aVL<tspan dx="3" font-size="12" font-weight="400">−30°</tspan></text><line x1="770.9" x2="680" y1="242.5" y2="190" stroke="#6b6b6b" stroke-dasharray="4 4" stroke-opacity=".35"/><line x1="680" x2="589.1" y1="190" y2="137.5" stroke="#6b6b6b" stroke-width="3" marker-end="url(#m-avr)"/><text x="568.3" y="130.5" fill="#6b6b6b" font-size="15" font-weight="700" text-anchor="middle">aVR<tspan dx="3" font-size="12" font-weight="400">−150°</tspan></text><text x="483" y="194" fill="#555" font-size="12">patient&apos;s right</text><text x="835" y="212" fill="#555" font-size="12" text-anchor="middle">patient&apos;s left</text><text x="470" y="352" fill="#1d2a44" font-size="20" font-weight="700">Chest leads: the horizontal plane</text><text x="470" y="372" fill="#555" font-size="14">Seen from the feet: front of the chest at the top</text><path fill="none" stroke="#d8d8d8" d="M560 525a120 90 0 0 1 240 0"/><line x1="680" x2="639.9" y1="525" y2="438.9" stroke="#d35400" stroke-width="3" marker-end="url(#m-septal)"/><text x="631.4" y="425.8" fill="#d35400" font-size="15" font-weight="700" text-anchor="middle">V1</text><line x1="680" x2="676.7" y1="525" y2="430.1" stroke="#d35400" stroke-width="3" marker-end="url(#m-septal)"/><text x="676" y="415.1" fill="#d35400" font-size="15" font-weight="700" text-anchor="middle">V2</text><line x1="680" x2="709.4" y1="525" y2="434.6" stroke="#7b3fa0" stroke-width="3" marker-end="url(#m-anterior)"/><text x="715.5" y="420.6" fill="#7b3fa0" font-size="15" font-weight="700" text-anchor="middle">V3</text><line x1="680" x2="738.5" y1="525" y2="450.1" stroke="#7b3fa0" stroke-width="3" marker-end="url(#m-anterior)"/><text x="750.8" y="439.4" fill="#7b3fa0" font-size="15" font-weight="700" text-anchor="middle">V4</text><line x1="680" x2="763.9" y1="525" y2="480.4" stroke="#1f77b4" stroke-width="3" marker-end="url(#m-lateral)"/><text x="781.5" y="476" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">V5</text><line x1="680" x2="774.6" y1="525" y2="516.7" stroke="#1f77b4" stroke-width="3" marker-end="url(#m-lateral)"/><text x="794.6" y="520" fill="#1f77b4" font-size="15" font-weight="700" text-anchor="middle">V6</text><circle cx="680" cy="525" r="4" fill="#1d2a44"/><rect width="16" height="16" x="470" y="560" fill="#2e7d32" rx="3"/><text x="494" y="573" fill="#1d2a44" font-size="14">Inferior: II, III, aVF</text><rect width="16" height="16" x="700" y="560" fill="#1f77b4" rx="3"/><text x="724" y="573" fill="#1d2a44" font-size="14">Lateral: I, aVL, V5, V6</text><rect width="16" height="16" x="470" y="586" fill="#d35400" rx="3"/><text x="494" y="599" fill="#1d2a44" font-size="14">Septal: V1, V2</text><rect width="16" height="16" x="700" y="586" fill="#7b3fa0" rx="3"/><text x="724" y="599" fill="#1d2a44" font-size="14">Anterior: V3, V4</text></svg>