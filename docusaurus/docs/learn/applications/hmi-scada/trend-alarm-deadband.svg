<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">Reading an HMI trend: pen, alarm limits and deadband</title>
  <desc id="d">A ten-minute trend of a reactor temperature, TI-101, from 08:40 to 08:50, with the newest value at the right. A dashed high alarm limit sits at 80 degrees and a low limit at 20 degrees, with a shaded 5-degree deadband below the high limit. The temperature rises through 80 at point 1, where the high alarm is raised. It dips to 79 and 77 at point 2, inside the deadband, so the alarm stays active instead of clearing and re-raising. It falls below 75 at point 3, where the alarm returns to normal. A cursor line reads 88.0 degrees at 08:44:23.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1b2433">
    <!-- Trend panel: grey, as on a high-performance HMI -->
    <rect x="70" y="50" width="570" height="260" fill="#e4e6ea" stroke="#9aa3ae"/>
    <text x="70" y="36" font-size="15" font-weight="700">TI-101 Reactor temperature (°C)</text>
    <text x="640" y="36" font-size="12" text-anchor="end" fill="#4a5568">Time span: 10 min · live</text>

    <!-- Y axis: 0 to 100, y = 300 - 2.4 v -->
    <g font-size="11" text-anchor="end" fill="#4a5568">
      <text x="62" y="304">0</text>
      <text x="62" y="184">50</text>
      <text x="62" y="64">100</text>
    </g>
    <line x1="70" y1="180" x2="640" y2="180" stroke="#cdd2d8"/>

    <!-- Deadband under the HI limit: 75 to 80 -->
    <rect x="70" y="108" width="570" height="12" fill="#f2c94c" opacity="0.35"/>
    <line x1="70" y1="108" x2="640" y2="108" stroke="#a4501c" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="646" y="112" font-size="12" fill="#a4501c" font-weight="700">HI 80</text>
    <text x="646" y="127" font-size="11" fill="#8a6d1a">deadband 5</text>
    <line x1="70" y1="252" x2="640" y2="252" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 4"/>
    <text x="646" y="256" font-size="12" fill="#1f6f8b" font-weight="700">LO 20</text>

    <!-- The pen: grey while normal, coloured while in alarm -->
    <polyline fill="none" stroke="#3b4350" stroke-width="2.5" points="70,168 120,160.8 170,148.8 220,127.2 260,108"/>
    <polyline fill="none" stroke="#c0392b" stroke-width="3" points="260,108 290,93.6 320,88.8 345,103.2 365,110.4 385,105.6 405,112.8 425,115.2 438,120"/>
    <polyline fill="none" stroke="#3b4350" stroke-width="2.5" points="438,120 445,122.4 480,141.6 530,156 580,163.2 640,160.8"/>

    <!-- Cursor -->
    <line x1="320" y1="50" x2="320" y2="310" stroke="#5b6573" stroke-dasharray="2 3"/>
    <rect x="326" y="58" width="128" height="22" rx="4" fill="#ffffff" stroke="#9aa3ae"/>
    <text x="332" y="73" font-size="11">08:44:23 · 88.0 °C</text>

    <!-- Markers -->
    <g font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="260" cy="108" r="11" fill="#c0392b"/>
      <text x="260" y="112">1</text>
      <circle cx="405" cy="140" r="11" fill="#8a6d1a"/>
      <text x="405" y="144">2</text>
      <circle cx="445" cy="146" r="11" fill="#3b4350"/>
      <text x="445" y="150">3</text>
    </g>
    <line x1="405" y1="129" x2="405" y2="115" stroke="#8a6d1a" stroke-width="1.5"/>
    <line x1="442" y1="135" x2="439" y2="123" stroke="#3b4350" stroke-width="1.5"/>

    <!-- Time axis -->
    <g font-size="11" text-anchor="middle" fill="#4a5568">
      <text x="70" y="328">08:40</text>
      <text x="184" y="328">08:42</text>
      <text x="298" y="328">08:44</text>
      <text x="412" y="328">08:46</text>
      <text x="526" y="328">08:48</text>
      <text x="640" y="328">08:50</text>
    </g>
    <text x="640" y="344" font-size="11" text-anchor="middle" font-weight="700" fill="#1b2433">now</text>

    <!-- Key -->
    <g font-size="13">
      <circle cx="82" cy="378" r="9" fill="#c0392b"/>
      <text x="82" y="382" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
      <text x="100" y="382">Crosses HI 80: the alarm is raised, and the pen turns red while it lasts.</text>
      <circle cx="82" cy="408" r="9" fill="#8a6d1a"/>
      <text x="82" y="412" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
      <text x="100" y="412">Dips to 79 and 77, inside the deadband: the alarm stays on instead of chattering.</text>
      <circle cx="82" cy="438" r="9" fill="#3b4350"/>
      <text x="82" y="442" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
      <text x="100" y="442">Falls below 75 (HI minus the deadband): the alarm returns to normal.</text>
    </g>
  </g>
</svg>
