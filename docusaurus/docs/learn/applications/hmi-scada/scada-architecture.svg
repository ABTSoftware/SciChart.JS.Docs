<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d">
  <title id="t">The layers of a SCADA system</title>
  <desc id="d">Five layers from bottom to top: field devices such as level, flow and pressure transmitters, pumps and valves; controllers (PLCs and RTUs) that run the local control logic; the communications network, carrying protocols such as Modbus, DNP3, OPC UA and IEC 61850; the SCADA server with its historian and alarm server; and the HMI clients, operator stations, web and mobile screens and the engineering station. Measurements and alarms travel up; commands and setpoints travel down.</desc>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6f8b"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a4501c"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1b2433">
    <!-- Layer 5: HMI clients -->
    <rect x="20" y="20" width="560" height="96" rx="10" fill="#eef1f5" stroke="#8a97a8"/>
    <text x="36" y="44" font-size="15" font-weight="700">HMI clients</text>
    <text x="36" y="62" font-size="12" fill="#4a5568">What people see and use</text>
    <rect x="200" y="34" width="112" height="66" rx="6" fill="#ffffff" stroke="#8a97a8"/>
    <text x="256" y="62" font-size="12" text-anchor="middle">Operator</text>
    <text x="256" y="78" font-size="12" text-anchor="middle">station</text>
    <rect x="324" y="34" width="112" height="66" rx="6" fill="#ffffff" stroke="#8a97a8"/>
    <text x="380" y="62" font-size="12" text-anchor="middle">Web and</text>
    <text x="380" y="78" font-size="12" text-anchor="middle">mobile screens</text>
    <rect x="448" y="34" width="118" height="66" rx="6" fill="#ffffff" stroke="#8a97a8"/>
    <text x="507" y="62" font-size="12" text-anchor="middle">Engineering</text>
    <text x="507" y="78" font-size="12" text-anchor="middle">station</text>

    <!-- Layer 4: SCADA server -->
    <rect x="20" y="132" width="560" height="96" rx="10" fill="#e7f0f6" stroke="#6f93ad"/>
    <text x="36" y="156" font-size="15" font-weight="700">SCADA server</text>
    <text x="36" y="174" font-size="12" fill="#4a5568">Polls, stores, raises</text>
    <text x="36" y="190" font-size="12" fill="#4a5568">alarms</text>
    <rect x="200" y="146" width="112" height="66" rx="6" fill="#ffffff" stroke="#6f93ad"/>
    <text x="256" y="174" font-size="12" text-anchor="middle">Tag database</text>
    <text x="256" y="190" font-size="12" text-anchor="middle">(live values)</text>
    <rect x="324" y="146" width="112" height="66" rx="6" fill="#ffffff" stroke="#6f93ad"/>
    <text x="380" y="174" font-size="12" text-anchor="middle">Historian</text>
    <text x="380" y="190" font-size="12" text-anchor="middle">(trend history)</text>
    <rect x="448" y="146" width="118" height="66" rx="6" fill="#ffffff" stroke="#6f93ad"/>
    <text x="507" y="174" font-size="12" text-anchor="middle">Alarm server</text>
    <text x="507" y="190" font-size="12" text-anchor="middle">(limits, log)</text>

    <!-- Layer 3: communications -->
    <rect x="20" y="244" width="560" height="96" rx="10" fill="#f3efe6" stroke="#ad9a6f"/>
    <text x="36" y="268" font-size="15" font-weight="700">Communications</text>
    <text x="36" y="286" font-size="12" fill="#4a5568">Ethernet, fibre, radio,</text>
    <text x="36" y="302" font-size="12" fill="#4a5568">cellular, satellite</text>
    <g font-size="12" text-anchor="middle">
      <rect x="200" y="270" width="80" height="30" rx="15" fill="#ffffff" stroke="#ad9a6f"/>
      <text x="240" y="289">Modbus</text>
      <rect x="290" y="270" width="72" height="30" rx="15" fill="#ffffff" stroke="#ad9a6f"/>
      <text x="326" y="289">DNP3</text>
      <rect x="372" y="270" width="80" height="30" rx="15" fill="#ffffff" stroke="#ad9a6f"/>
      <text x="412" y="289">OPC UA</text>
      <rect x="462" y="270" width="104" height="30" rx="15" fill="#ffffff" stroke="#ad9a6f"/>
      <text x="514" y="289">IEC 61850</text>
    </g>

    <!-- Layer 2: controllers -->
    <rect x="20" y="356" width="560" height="96" rx="10" fill="#eaf3ec" stroke="#76a683"/>
    <text x="36" y="380" font-size="15" font-weight="700">Controllers</text>
    <text x="36" y="398" font-size="12" fill="#4a5568">Run the control logic</text>
    <text x="36" y="414" font-size="12" fill="#4a5568">on site</text>
    <rect x="200" y="370" width="174" height="66" rx="6" fill="#ffffff" stroke="#76a683"/>
    <text x="287" y="398" font-size="12" text-anchor="middle">PLC</text>
    <text x="287" y="414" font-size="12" text-anchor="middle">(plant or machine)</text>
    <rect x="392" y="370" width="174" height="66" rx="6" fill="#ffffff" stroke="#76a683"/>
    <text x="479" y="398" font-size="12" text-anchor="middle">RTU</text>
    <text x="479" y="414" font-size="12" text-anchor="middle">(remote site)</text>

    <!-- Layer 1: field devices -->
    <rect x="20" y="468" width="560" height="110" rx="10" fill="#f5edf0" stroke="#a87a8c"/>
    <text x="36" y="492" font-size="15" font-weight="700">Field devices</text>
    <text x="36" y="510" font-size="12" fill="#4a5568">Measure and act</text>
    <g font-size="12" text-anchor="middle">
      <rect x="200" y="482" width="86" height="40" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="243" y="506">Level</text>
      <rect x="294" y="482" width="86" height="40" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="337" y="506">Flow</text>
      <rect x="388" y="482" width="86" height="40" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="431" y="506">Pressure</text>
      <rect x="482" y="482" width="84" height="40" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="524" y="506">Temperature</text>
      <rect x="200" y="530" width="180" height="36" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="290" y="552">Pumps and motors</text>
      <rect x="388" y="530" width="178" height="36" rx="6" fill="#ffffff" stroke="#a87a8c"/>
      <text x="477" y="552">Valves and breakers</text>
    </g>

    <!-- Arrows: data up, commands down -->
    <line x1="630" y1="560" x2="630" y2="40" stroke="#1f6f8b" stroke-width="3" marker-end="url(#up)"/>
    <line x1="700" y1="40" x2="700" y2="560" stroke="#a4501c" stroke-width="3" marker-end="url(#down)"/>
    <text transform="translate(620 300) rotate(-90)" font-size="13" text-anchor="middle" fill="#1f6f8b" font-weight="700">Measurements and alarms</text>
    <text transform="translate(724 300) rotate(90)" font-size="13" text-anchor="middle" fill="#a4501c" font-weight="700">Commands and setpoints</text>
  </g>
</svg>
