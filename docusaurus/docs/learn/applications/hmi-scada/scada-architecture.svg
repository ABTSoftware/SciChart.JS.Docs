<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" aria-labelledby="t d" viewBox="0 0 760 600"><title id="t">The layers of a SCADA system</title><desc id="d">Five layers from bottom to top: field devices such as level, flow and pressure transmitters, pumps and valves; controllers (PLCs and RTUs) that run the local control logic; the communications network, carrying protocols such as Modbus, DNP3, OPC UA and IEC 61850; the SCADA server with its historian and alarm server; and the HMI clients, operator stations, web and mobile screens and the engineering station. Measurements and alarms travel up; commands and setpoints travel down.</desc><defs><marker id="up" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#1f6f8b" d="m0 0 10 5-10 5z"/></marker><marker id="down" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="5" refY="5" viewBox="0 0 10 10"><path fill="#a4501c" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="600" fill="#fff"/><g fill="#1b2433" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="560" height="96" x="20" y="20" fill="#eef1f5" stroke="#8a97a8" rx="10"/><text x="36" y="44" font-size="15" font-weight="700">HMI clients</text><text x="36" y="62" fill="#4a5568" font-size="12">What people see and use</text><rect width="112" height="66" x="200" y="34" fill="#fff" stroke="#8a97a8" rx="6"/><text x="256" y="62" font-size="12" text-anchor="middle">Operator</text><text x="256" y="78" font-size="12" text-anchor="middle">station</text><rect width="112" height="66" x="324" y="34" fill="#fff" stroke="#8a97a8" rx="6"/><text x="380" y="62" font-size="12" text-anchor="middle">Web and</text><text x="380" y="78" font-size="12" text-anchor="middle">mobile screens</text><rect width="118" height="66" x="448" y="34" fill="#fff" stroke="#8a97a8" rx="6"/><text x="507" y="62" font-size="12" text-anchor="middle">Engineering</text><text x="507" y="78" font-size="12" text-anchor="middle">station</text><rect width="560" height="96" x="20" y="132" fill="#e7f0f6" stroke="#6f93ad" rx="10"/><text x="36" y="156" font-size="15" font-weight="700">SCADA server</text><text x="36" y="174" fill="#4a5568" font-size="12">Polls, stores, raises</text><text x="36" y="190" fill="#4a5568" font-size="12">alarms</text><rect width="112" height="66" x="200" y="146" fill="#fff" stroke="#6f93ad" rx="6"/><text x="256" y="174" font-size="12" text-anchor="middle">Tag database</text><text x="256" y="190" font-size="12" text-anchor="middle">(live values)</text><rect width="112" height="66" x="324" y="146" fill="#fff" stroke="#6f93ad" rx="6"/><text x="380" y="174" font-size="12" text-anchor="middle">Historian</text><text x="380" y="190" font-size="12" text-anchor="middle">(trend history)</text><rect width="118" height="66" x="448" y="146" fill="#fff" stroke="#6f93ad" rx="6"/><text x="507" y="174" font-size="12" text-anchor="middle">Alarm server</text><text x="507" y="190" font-size="12" text-anchor="middle">(limits, log)</text><rect width="560" height="96" x="20" y="244" fill="#f3efe6" stroke="#ad9a6f" rx="10"/><text x="36" y="268" font-size="15" font-weight="700">Communications</text><text x="36" y="286" fill="#4a5568" font-size="12">Ethernet, fibre, radio,</text><text x="36" y="302" fill="#4a5568" font-size="12">cellular, satellite</text><g font-size="12" text-anchor="middle"><rect width="80" height="30" x="200" y="270" fill="#fff" stroke="#ad9a6f" rx="15"/><text x="240" y="289">Modbus</text><rect width="72" height="30" x="290" y="270" fill="#fff" stroke="#ad9a6f" rx="15"/><text x="326" y="289">DNP3</text><rect width="80" height="30" x="372" y="270" fill="#fff" stroke="#ad9a6f" rx="15"/><text x="412" y="289">OPC UA</text><rect width="104" height="30" x="462" y="270" fill="#fff" stroke="#ad9a6f" rx="15"/><text x="514" y="289">IEC 61850</text></g><rect width="560" height="96" x="20" y="356" fill="#eaf3ec" stroke="#76a683" rx="10"/><text x="36" y="380" font-size="15" font-weight="700">Controllers</text><text x="36" y="398" fill="#4a5568" font-size="12">Run the control logic</text><text x="36" y="414" fill="#4a5568" font-size="12">on site</text><rect width="174" height="66" x="200" y="370" fill="#fff" stroke="#76a683" rx="6"/><text x="287" y="398" font-size="12" text-anchor="middle">PLC</text><text x="287" y="414" font-size="12" text-anchor="middle">(plant or machine)</text><rect width="174" height="66" x="392" y="370" fill="#fff" stroke="#76a683" rx="6"/><text x="479" y="398" font-size="12" text-anchor="middle">RTU</text><text x="479" y="414" font-size="12" text-anchor="middle">(remote site)</text><rect width="560" height="110" x="20" y="468" fill="#f5edf0" stroke="#a87a8c" rx="10"/><text x="36" y="492" font-size="15" font-weight="700">Field devices</text><text x="36" y="510" fill="#4a5568" font-size="12">Measure and act</text><g font-size="12" text-anchor="middle"><rect width="86" height="40" x="200" y="482" fill="#fff" stroke="#a87a8c" rx="6"/><text x="243" y="506">Level</text><rect width="86" height="40" x="294" y="482" fill="#fff" stroke="#a87a8c" rx="6"/><text x="337" y="506">Flow</text><rect width="86" height="40" x="388" y="482" fill="#fff" stroke="#a87a8c" rx="6"/><text x="431" y="506">Pressure</text><rect width="84" height="40" x="482" y="482" fill="#fff" stroke="#a87a8c" rx="6"/><text x="524" y="506">Temperature</text><rect width="180" height="36" x="200" y="530" fill="#fff" stroke="#a87a8c" rx="6"/><text x="290" y="552">Pumps and motors</text><rect width="178" height="36" x="388" y="530" fill="#fff" stroke="#a87a8c" rx="6"/><text x="477" y="552">Valves and breakers</text></g><line x1="630" x2="630" y1="560" y2="40" stroke="#1f6f8b" stroke-width="3" marker-end="url(#up)"/><line x1="700" x2="700" y1="40" y2="560" stroke="#a4501c" stroke-width="3" marker-end="url(#down)"/><text fill="#1f6f8b" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 460 -160)">Measurements and alarms</text><text fill="#a4501c" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(90 212 512)">Commands and setpoints</text></g></svg>