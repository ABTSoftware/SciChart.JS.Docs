<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Axial, coronal and sagittal planes, and how each MRI view is oriented</title><desc id="d">A box representing the head, cut by three coloured planes: the axial plane is horizontal and splits top from bottom, the coronal plane is vertical and splits front from back, and the sagittal plane is vertical and splits left from right. Beside it, three small panels show how each view is displayed: axial with the patient's right on the viewer's left and the front at the top, coronal with right on the left and the top of the head at the top, and sagittal with the face to the left and the top of the head at the top.</desc><rect width="860" height="400" fill="#FFFFFF"/><line x1="152.5" y1="279.6" x2="152.5" y2="89.6" stroke="#5A6B88" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="152.5" y1="279.6" x2="57.5" y2="340.4" stroke="#5A6B88" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="152.5" y1="279.6" x2="342.5" y2="279.6" stroke="#5A6B88" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="152.5" y1="89.6" x2="57.5" y2="150.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="152.5" y1="89.6" x2="342.5" y2="89.6" stroke="#5A6B88" stroke-width="1.5"/><line x1="57.5" y1="340.4" x2="57.5" y2="150.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="57.5" y1="340.4" x2="247.5" y2="340.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="57.5" y1="150.4" x2="247.5" y2="150.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="342.5" y1="279.6" x2="342.5" y2="89.6" stroke="#5A6B88" stroke-width="1.5"/><line x1="342.5" y1="279.6" x2="247.5" y2="340.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="342.5" y1="89.6" x2="247.5" y2="150.4" stroke="#5A6B88" stroke-width="1.5"/><line x1="247.5" y1="340.4" x2="247.5" y2="150.4" stroke="#5A6B88" stroke-width="1.5"/><polygon points="152.5,184.6 342.5,184.6 247.5,245.4 57.5,245.4" fill="#F5A623" fill-opacity="0.35" stroke="#F5A623" stroke-width="2"/><polygon points="105.0,310.0 295.0,310.0 295.0,120.0 105.0,120.0" fill="#50C7E0" fill-opacity="0.35" stroke="#50C7E0" stroke-width="2"/><polygon points="247.5,279.6 152.5,340.4 152.5,150.4 247.5,89.6" fill="#7ED957" fill-opacity="0.35" stroke="#7ED957" stroke-width="2"/><text x="228.5" y="75.8" text-anchor="middle" font-size="15" fill="#1B2A47" font-weight="normal">Superior (head)</text><text x="255.5" y="344.4" text-anchor="start" font-size="15" fill="#1B2A47" font-weight="normal">Inferior (feet)</text><text x="27.5" y="390.4" text-anchor="start" font-size="15" fill="#1B2A47" font-weight="normal">Anterior (face, nearest you)</text><text x="348.5" y="85.6" text-anchor="start" font-size="15" fill="#1B2A47" font-weight="normal">Posterior</text><text x="350.5" y="189.6" text-anchor="start" font-size="15" fill="#1B2A47" font-weight="normal">Left</text><text x="51.5" y="250.4" text-anchor="end" font-size="15" fill="#1B2A47" font-weight="normal">Right</text><text x="253.5" y="261.4" text-anchor="start" font-size="15" fill="#B57400" font-weight="bold">Axial</text><text x="99.0" y="124.0" text-anchor="end" font-size="15" fill="#1F8FAE" font-weight="bold">Coronal</text><text x="144.5" y="342.4" text-anchor="end" font-size="15" fill="#3F8F1E" font-weight="bold">Sagittal</text><text x="200" y="28" text-anchor="middle" font-size="16" fill="#1B2A47" font-weight="bold">The three planes through the head</text><text x="650" y="28" text-anchor="middle" font-size="16" fill="#1B2A47" font-weight="bold">How each view is shown</text><rect x="470" y="70" width="108" height="108" rx="6" fill="#0B1020" stroke="#F5A623" stroke-width="3"/><ellipse cx="524.0" cy="127.0" rx="23" ry="28" fill="#8A93A6"/><path d="M518.0,102.0 L524.0,93.0 L530.0,102.0 Z" fill="#8A93A6"/><text x="478" y="129.0" text-anchor="start" font-size="14" font-weight="bold" fill="#FFFFFF">R</text><text x="570" y="129.0" text-anchor="end" font-size="14" font-weight="bold" fill="#FFFFFF">L</text><text x="524.0" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">A</text><text x="524.0" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">P</text><text x="524.0" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#B57400">Axial</text><text x="524.0" y="218" text-anchor="middle" font-size="13" fill="#5A6B88">seen from the feet</text><rect x="595" y="70" width="108" height="108" rx="6" fill="#0B1020" stroke="#50C7E0" stroke-width="3"/><ellipse cx="649.0" cy="120.0" rx="25" ry="25" fill="#8A93A6"/><rect x="640.0" y="141.0" width="18" height="17" fill="#8A93A6"/><text x="603" y="129.0" text-anchor="start" font-size="14" font-weight="bold" fill="#FFFFFF">R</text><text x="695" y="129.0" text-anchor="end" font-size="14" font-weight="bold" fill="#FFFFFF">L</text><text x="649.0" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">S</text><text x="649.0" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">I</text><text x="649.0" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F8FAE">Coronal</text><text x="649.0" y="218" text-anchor="middle" font-size="13" fill="#5A6B88">seen from the front</text><rect x="720" y="70" width="108" height="108" rx="6" fill="#0B1020" stroke="#7ED957" stroke-width="3"/><ellipse cx="778.0" cy="120.0" rx="27" ry="24" fill="#8A93A6"/><path d="M753.0,122.0 L744.0,130.0 L755.0,133.0 Z" fill="#8A93A6"/><rect x="778.0" y="140.0" width="15" height="18" fill="#8A93A6"/><text x="728" y="129.0" text-anchor="start" font-size="14" font-weight="bold" fill="#FFFFFF">A</text><text x="820" y="129.0" text-anchor="end" font-size="14" font-weight="bold" fill="#FFFFFF">P</text><text x="774.0" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">S</text><text x="774.0" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">I</text><text x="774.0" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#3F8F1E">Sagittal</text><text x="774.0" y="218" text-anchor="middle" font-size="13" fill="#5A6B88">seen from the side</text><rect x="464" y="272" width="380" height="96" rx="8" fill="#F2F5FA" stroke="#D5DCE8"/><text x="476" y="296" font-size="14" fill="#1B2A47">Radiological convention: the patient's right is</text><text x="476" y="316" font-size="14" fill="#1B2A47">on the viewer's left in axial and coronal views,</text><text x="476" y="336" font-size="14" fill="#1B2A47">as if facing the patient (or looking up from the feet).</text><text x="476" y="356" font-size="14" fill="#1B2A47">Sagittal views usually show the face to the left.</text></svg>