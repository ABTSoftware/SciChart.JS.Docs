<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t1 d1">
<title id="t1">Payoff and profit of a long call at expiry</title>
<desc id="d1">A long call with a strike of 100 bought for a premium of 4.45. The payoff line is zero up to the strike and then rises one for one. The profit line is the payoff moved down by the premium: a flat loss of 4.45 below the strike, a kink at 100, zero at the breakeven of 104.45, and profit above it with no upper limit.</desc>
