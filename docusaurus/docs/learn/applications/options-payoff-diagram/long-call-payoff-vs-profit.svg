 x2="139.8" y1="112.3" y2="112.3" stroke="#2A6FB0" stroke-width="3.5"/><text x="149.7" y="117.3" fill="#1F2A44" font-size="15">Profit at expiry = payoff − premium</text><circle cx="374.4" cy="338.4" r="5" fill="#1F2A44"/><text x="382.4" y="360.4" fill="#1F2A44" font-size="14">Kink at the strike, 100</text><circle cx="437.7" cy="288" r="6" fill="#E0B300" stroke="#1F2A44"/><text x="431.7" y="276" fill="#1F2A44" font-size="14" text-anchor="end">Breakeven 104.45</text><text x="104.2" y="360.4" fill="#D64541" font-size="14">Max loss 4.45: the premium</text><text x="566.4" y="254" fill="#1E8C7E" font-size="14">Profit, no upper limit</text><text x="146.9" y="254" fill="#1F2A44" font-size="13">Slope 0: delta 0 at expiry</text><text x="623.3" y="186" fill="#1F2A44" font-size="13">Slope 1: delta 1</text><text x="90" y="28" fill="#1F2A44" font-size="16" font-weight="700">Long call: strike 100, premium 4.45</text></g></svg>