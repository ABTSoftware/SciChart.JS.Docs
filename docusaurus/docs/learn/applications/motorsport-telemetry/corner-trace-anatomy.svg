<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 540"><title id="title">How one corner looks in the speed, brake and throttle traces</title><desc id="desc">Three traces stacked against distance through one corner. The speed trace is flat on the straight, falls from the braking point to the minimum corner speed at the apex, then rises on the exit. The brake trace jumps to peak pressure at the braking point, then is released gradually (trail braking) and reaches zero just before the apex. The throttle trace drops to zero at the lift, stays at zero through a short coasting phase where neither pedal is pressed, then rises progressively from the throttle pickup to full throttle on the exit.</desc><rect width="760" height="540" fill="#fff"/><rect width="138" height="430" x="262" y="40" fill="#fdecea"/><rect width="32" height="430" x="400" y="40" fill="#f1f1f4"/><rect width="90" height="430" x="432" y="40" fill="#e9f6ee"/><text x="331" y="56" fill="#9b2c2c" font-size="13" text-anchor="middle">Braking zone</text><text x="416" y="56" fill="#4a4a5a" font-size="13" text-anchor="middle">Coast</text><text x="477" y="56" fill="#22663d" font-size="13" text-anchor="middle">Exit</text><text x="20" y="140" fill="#1d2433" font-size="15" font-weight="600">Speed</text><text x="20" y="160" fill="#5a6475" font-size="12">km/h</text><text x="20" y="295" fill="#1d2433" font-size="15" font-weight="600">Brake</text><text x="20" y="315" fill="#5a6475" font-size="12">0–100%</text><text x="20" y="415" fill="#1d2433" font-size="15" font-weight="600">Throttle</text><text x="20" y="435" fill="#5a6475" font-size="12">0–100%</text><line x1="120" x2="740" y1="215" y2="215" stroke="#c9ced8"/><line x1="120" x2="740" y1="335" y2="335" stroke="#c9ced8"/><line x1="120" x2="740" y1="455" y2="455" stroke="#c9ced8"/><line x1="120" x2="120" y1="70" y2="455" stroke="#c9ced8"/><line x1="262" x2="262" y1="40" y2="470" stroke="#9b2c2c" stroke-dasharray="5 4"/><line x1="420" x2="420" y1="40" y2="470" stroke="#1d2433" stroke-dasharray="5 4"/><line x1="522" x2="522" y1="40" y2="470" stroke="#22663d" stroke-dasharray="5 4"/><path fill="none" stroke="#1f6fb2" stroke-width="3.5" d="m120 82 142-2c38 8 78 50 118 88 18 16 30 22 40 23 20 0 50-23 102-51 58-28 128-44 218-50"/><circle cx="420" cy="191" r="5" fill="#1d2433"/><text x="430" y="207" fill="#1d2433" font-size="13">Minimum corner speed (apex)</text><text x="140" y="104" fill="#1f6fb2" font-size="13">Top speed on the straight</text><path fill="none" stroke="#c53030" stroke-width="3.5" d="M120 333h136l14-81 48-2c22 12 42 46 62 68 10 10 16 14 20 15h340"/><text x="276" y="244" fill="#9b2c2c" font-size="13">Peak pressure</text><text x="408" y="268" fill="#9b2c2c" font-size="13">Trail braking:</text><text x="408" y="283" fill="#9b2c2c" font-size="13">gradual release</text><path fill="none" stroke="#2f855a" stroke-width="3.5" d="M120 375h130l12 78h170c20-5 46-33 68-61 10-12 16-16 22-17h218"/><text x="138" y="368" fill="#2f855a" font-size="13">Full throttle</text><text x="530" y="440" fill="#22663d" font-size="13">Throttle pickup</text><text x="560" y="368" fill="#2f855a" font-size="13">Full throttle again</text><text x="262" y="490" fill="#9b2c2c" font-size="13" text-anchor="middle">Braking point</text><text x="420" y="490" fill="#1d2433" font-size="13" text-anchor="middle">Apex</text><text x="522" y="490" fill="#22663d" font-size="13" text-anchor="middle">Full throttle</text><text x="430" y="526" fill="#1d2433" font-size="14" text-anchor="middle">Lap distance through the corner →</text></svg>