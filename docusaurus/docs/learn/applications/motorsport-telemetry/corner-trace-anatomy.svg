<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How one corner looks in the speed, brake and throttle traces</title>
  <desc id="desc">Three traces stacked against distance through one corner. The speed trace is flat on the straight, falls from the braking point to the minimum corner speed at the apex, then rises on the exit. The brake trace jumps to peak pressure at the braking point, then is released gradually (trail braking) and reaches zero just before the apex. The throttle trace drops to zero at the lift, stays at zero through a short coasting phase where neither pedal is pressed, then rises progressively from the throttle pickup to full throttle on the exit.</desc>
  <rect width="760" height="540" fill="#ffffff"/>

  <!-- phase bands -->
  <rect x="262" y="40" width="138" height="430" fill="#fdecea"/>
  <rect x="400" y="40" width="32" height="430" fill="#f1f1f4"/>
  <rect x="432" y="40" width="90" height="430" fill="#e9f6ee"/>
  <text x="331" y="56" font-size="13" fill="#9b2c2c" text-anchor="middle">Braking zone</text>
  <text x="416" y="56" font-size="13" fill="#4a4a5a" text-anchor="middle">Coast</text>
  <text x="477" y="56" font-size="13" fill="#22663d" text-anchor="middle">Exit</text>

  <!-- row labels -->
  <text x="20" y="140" font-size="15" font-weight="600" fill="#1d2433">Speed</text>
  <text x="20" y="160" font-size="12" fill="#5a6475">km/h</text>
  <text x="20" y="295" font-size="15" font-weight="600" fill="#1d2433">Brake</text>
  <text x="20" y="315" font-size="12" fill="#5a6475">0–100%</text>
  <text x="20" y="415" font-size="15" font-weight="600" fill="#1d2433">Throttle</text>
  <text x="20" y="435" font-size="12" fill="#5a6475">0–100%</text>

  <!-- row frames -->
  <line x1="120" y1="215" x2="740" y2="215" stroke="#c9ced8"/>
  <line x1="120" y1="335" x2="740" y2="335" stroke="#c9ced8"/>
  <line x1="120" y1="455" x2="740" y2="455" stroke="#c9ced8"/>
  <line x1="120" y1="70" x2="120" y2="455" stroke="#c9ced8"/>

  <!-- guide lines -->
  <line x1="262" y1="40" x2="262" y2="470" stroke="#9b2c2c" stroke-dasharray="5 4"/>
  <line x1="420" y1="40" x2="420" y2="470" stroke="#1d2433" stroke-dasharray="5 4"/>
  <line x1="522" y1="40" x2="522" y2="470" stroke="#22663d" stroke-dasharray="5 4"/>

  <!-- speed trace -->
  <path d="M120 82 L262 80 C300 88 340 130 380 168 C398 184 410 190 420 191 C440 191 470 168 522 140 C580 112 650 96 740 90" fill="none" stroke="#1f6fb2" stroke-width="3.5"/>
  <circle cx="420" cy="191" r="5" fill="#1d2433"/>
  <text x="430" y="207" font-size="13" fill="#1d2433">Minimum corner speed (apex)</text>
  <text x="140" y="104" font-size="13" fill="#1f6fb2">Top speed on the straight</text>

  <!-- brake trace -->
  <path d="M120 333 L256 333 L270 252 L318 250 C340 262 360 296 380 318 C390 328 396 332 400 333 L740 333" fill="none" stroke="#c53030" stroke-width="3.5"/>
  <text x="276" y="244" font-size="13" fill="#9b2c2c">Peak pressure</text>
  <text x="408" y="268" font-size="13" fill="#9b2c2c">Trail braking:</text>
  <text x="408" y="283" font-size="13" fill="#9b2c2c">gradual release</text>

  <!-- throttle trace -->
  <path d="M120 375 L250 375 L262 453 L432 453 C452 448 478 420 500 392 C510 380 516 376 522 375 L740 375" fill="none" stroke="#2f855a" stroke-width="3.5"/>
  <text x="138" y="368" font-size="13" fill="#2f855a">Full throttle</text>
  <text x="530" y="440" font-size="13" fill="#22663d">Throttle pickup</text>
  <text x="560" y="368" font-size="13" fill="#2f855a">Full throttle again</text>

  <!-- guide labels -->
  <text x="262" y="490" font-size="13" fill="#9b2c2c" text-anchor="middle">Braking point</text>
  <text x="420" y="490" font-size="13" fill="#1d2433" text-anchor="middle">Apex</text>
  <text x="522" y="490" font-size="13" fill="#22663d" text-anchor="middle">Full throttle</text>
  <text x="430" y="526" font-size="14" fill="#1d2433" text-anchor="middle">Lap distance through the corner →</text>
</svg>
