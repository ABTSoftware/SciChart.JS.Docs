<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
<title>A PID feedback control loop</title>
<desc>The setpoint enters a summing junction, which subtracts the measured process variable to give the error e. The error feeds three parallel paths, proportional Kp times e, integral Ki times the integral of e, and derivative Kd times the rate of change of e, which add to give the controller output u. The output passes through actuator limits into the process, where a load disturbance also enters. The process variable leaves the process, and a sensor feeds it back to the summing junction.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<!-- setpoint in -->
<text x="14" y="105" fill="#C25E00">Setpoint</text>
<text x="14" y="122" fill="#C25E00">r(t)</text>
<line x1="14" y1="132" x2="82" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- summing junction -->
<circle cx="100" cy="132" r="17" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="100" y="137" text-anchor="middle" font-size="16">Σ</text>
<text x="70" y="124" font-size="13">+</text>
<text x="106" y="168" font-size="15">−</text>
<!-- error -->
<line x1="117" y1="132" x2="178" y2="132" stroke="#333" stroke-width="2"/>
<text x="130" y="122" fill="#333">error e</text>
<!-- split to three paths -->
<line x1="178" y1="62" x2="178" y2="202" stroke="#333" stroke-width="2"/>
<line x1="178" y1="62" x2="206" y2="62" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="178" y1="132" x2="206" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="178" y1="202" x2="206" y2="202" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- PID box outline -->
<rect x="194" y="20" width="236" height="226" rx="10" fill="none" stroke="#7A8699" stroke-dasharray="6 4"/>
<text x="312" y="240" text-anchor="middle" fill="#5B6577" font-size="13">PID controller</text>
<rect x="208" y="40" width="150" height="44" rx="6" fill="#E3F6EA" stroke="#1E8A44" stroke-width="2"/>
<text x="283" y="60" text-anchor="middle" fill="#14612F" font-weight="600">P: Kp · e</text>
<text x="283" y="77" text-anchor="middle" fill="#14612F" font-size="12">acts on the present error</text>
<rect x="208" y="110" width="150" height="44" rx="6" fill="#FBE6F8" stroke="#A2359A" stroke-width="2"/>
<text x="283" y="130" text-anchor="middle" fill="#7A1F73" font-weight="600">I: Ki · ∫e dt</text>
<text x="283" y="147" text-anchor="middle" fill="#7A1F73" font-size="12">acts on past error</text>
<rect x="208" y="180" width="150" height="44" rx="6" fill="#FDF6D6" stroke="#A88A00" stroke-width="2"/>
<text x="283" y="200" text-anchor="middle" fill="#6E5A00" font-weight="600">D: Kd · de/dt</text>
<text x="283" y="217" text-anchor="middle" fill="#6E5A00" font-size="12">predicts from the trend</text>
<!-- sum of terms -->
<line x1="358" y1="62" x2="395" y2="62" stroke="#333" stroke-width="2"/>
<line x1="395" y1="62" x2="395" y2="115" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="358" y1="132" x2="378" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="358" y1="202" x2="395" y2="202" stroke="#333" stroke-width="2"/>
<line x1="395" y1="202" x2="395" y2="149" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<circle cx="395" cy="132" r="15" fill="#ffffff" stroke="#333" stroke-width="2"/>
<text x="395" y="137" text-anchor="middle" font-size="16">Σ</text>
<!-- output to actuator -->
<line x1="410" y1="132" x2="466" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="413" y="120" fill="#333" font-size="13">output u</text>
<rect x="468" y="104" width="96" height="56" rx="6" fill="#FDECEC" stroke="#C62828" stroke-width="2"/>
<text x="516" y="128" text-anchor="middle" fill="#8E1B1B" font-weight="600">Actuator</text>
<text x="516" y="146" text-anchor="middle" fill="#8E1B1B" font-size="12">limits 0–100%</text>
<line x1="564" y1="132" x2="598" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- process -->
<rect x="600" y="104" width="110" height="56" rx="6" fill="#E4F1FB" stroke="#1F78B4" stroke-width="2"/>
<text x="655" y="128" text-anchor="middle" fill="#124B73" font-weight="600">Process</text>
<text x="655" y="146" text-anchor="middle" fill="#124B73" font-size="12">heater or motor</text>
<!-- disturbance -->
<text x="655" y="40" text-anchor="middle" fill="#333">Load disturbance d</text>
<line x1="655" y1="48" x2="655" y2="102" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- process variable out -->
<line x1="710" y1="132" x2="748" y2="132" stroke="#333" stroke-width="2"/>
<text x="732" y="190" text-anchor="end" fill="#1F78B4">process</text>
<text x="732" y="206" text-anchor="end" fill="#1F78B4">variable y</text>
<line x1="740" y1="132" x2="740" y2="290" stroke="#333" stroke-width="2"/>
<line x1="740" y1="290" x2="560" y2="290" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="460" y="268" width="98" height="44" rx="6" fill="#F1F3F6" stroke="#5B6577" stroke-width="2"/>
<text x="509" y="295" text-anchor="middle" fill="#333" font-weight="600">Sensor</text>
<line x1="460" y1="290" x2="100" y2="290" stroke="#333" stroke-width="2"/>
<line x1="100" y1="290" x2="100" y2="151" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="250" y="282" text-anchor="middle" fill="#333">measured process variable (feedback)</text>
</svg>
