<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 760 330"><title>A PID feedback control loop</title><desc>The setpoint enters a summing junction, which subtracts the measured process variable to give the error e. The error feeds three parallel paths, proportional Kp times e, integral Ki times the integral of e, and derivative Kd times the rate of change of e, which add to give the controller output u. The output passes through actuator limits into the process, where a load disturbance also enters. The process variable leaves the process, and a sensor feeds it back to the summing junction.</desc><rect width="100%" height="100%" fill="#fff"/><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#333" d="m0 0 10 5-10 5z"/></marker></defs><text x="14" y="105" fill="#C25E00">Setpoint</text><text x="14" y="122" fill="#C25E00">r(t)</text><line x1="14" x2="82" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/><circle cx="100" cy="132" r="17" fill="#fff" stroke="#333" stroke-width="2"/><text x="100" y="137" font-size="16" text-anchor="middle">Σ</text><text x="70" y="124" font-size="13">+</text><text x="106" y="168" font-size="15">−</text><line x1="117" x2="178" y1="132" y2="132" stroke="#333" stroke-width="2"/><text x="130" y="122" fill="#333">error e</text><line x1="178" x2="178" y1="62" y2="202" stroke="#333" stroke-width="2"/><line x1="178" x2="206" y1="62" y2="62" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="178" x2="206" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="178" x2="206" y1="202" y2="202" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect width="236" height="226" x="194" y="20" fill="none" stroke="#7A8699" stroke-dasharray="6 4" rx="10"/><text x="312" y="240" fill="#5B6577" font-size="13" text-anchor="middle">PID controller</text><rect width="150" height="44" x="208" y="40" fill="#E3F6EA" stroke="#1E8A44" stroke-width="2" rx="6"/><text x="283" y="60" fill="#14612F" font-weight="600" text-anchor="middle">P: Kp · e</text><text x="283" y="77" fill="#14612F" font-size="12" text-anchor="middle">acts on the present error</text><rect width="150" height="44" x="208" y="110" fill="#FBE6F8" stroke="#A2359A" stroke-width="2" rx="6"/><text x="283" y="130" fill="#7A1F73" font-weight="600" text-anchor="middle">I: Ki · ∫e dt</text><text x="283" y="147" fill="#7A1F73" font-size="12" text-anchor="middle">acts on past error</text><rect width="150" height="44" x="208" y="180" fill="#FDF6D6" stroke="#A88A00" stroke-width="2" rx="6"/><text x="283" y="200" fill="#6E5A00" font-weight="600" text-anchor="middle">D: Kd · de/dt</text><text x="283" y="217" fill="#6E5A00" font-size="12" text-anchor="middle">predicts from the trend</text><line x1="358" x2="395" y1="62" y2="62" stroke="#333" stroke-width="2"/><line x1="395" x2="395" y1="62" y2="115" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="358" x2="378" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="358" x2="395" y1="202" y2="202" stroke="#333" stroke-width="2"/><line x1="395" x2="395" y1="202" y2="149" stroke="#333" stroke-width="2" marker-end="url(#a)"/><circle cx="395" cy="132" r="15" fill="#fff" stroke="#333" stroke-width="2"/><text x="395" y="137" font-size="16" text-anchor="middle">Σ</text><line x1="410" x2="466" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="413" y="120" fill="#333" font-size="13">output u</text><rect width="96" height="56" x="468" y="104" fill="#FDECEC" stroke="#C62828" stroke-width="2" rx="6"/><text x="516" y="128" fill="#8E1B1B" font-weight="600" text-anchor="middle">Actuator</text><text x="516" y="146" fill="#8E1B1B" font-size="12" text-anchor="middle">limits 0–100%</text><line x1="564" x2="598" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect width="110" height="56" x="600" y="104" fill="#E4F1FB" stroke="#1F78B4" stroke-width="2" rx="6"/><text x="655" y="128" fill="#124B73" font-weight="600" text-anchor="middle">Process</text><text x="655" y="146" fill="#124B73" font-size="12" text-anchor="middle">heater or motor</text><text x="655" y="40" fill="#333" text-anchor="middle">Load disturbance d</text><line x1="655" x2="655" y1="48" y2="102" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="710" x2="748" y1="132" y2="132" stroke="#333" stroke-width="2"/><text x="732" y="190" fill="#1F78B4" text-anchor="end">process</text><text x="732" y="206" fill="#1F78B4" text-anchor="end">variable y</text><line x1="740" x2="740" y1="132" y2="290" stroke="#333" stroke-width="2"/><line x1="740" x2="560" y1="290" y2="290" stroke="#333" stroke-width="2" marker-end="url(#a)"/><rect width="98" height="44" x="460" y="268" fill="#F1F3F6" stroke="#5B6577" stroke-width="2" rx="6"/><text x="509" y="295" fill="#333" font-weight="600" text-anchor="middle">Sensor</text><line x1="460" x2="100" y1="290" y2="290" stroke="#333" stroke-width="2"/><line x1="100" x2="100" y1="290" y2="151" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="250" y="282" fill="#333" text-anchor="middle">measured process variable (feedback)</text></svg>