<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="760" height="425" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
<title>Anatomy of a closed-loop step response</title>
<desc>A setpoint steps from 0 to 1. The process variable starts after a short dead time, rises through 10% and 90% of the step (the rise time), peaks above the setpoint (the overshoot), and enters a band of plus or minus 2% around the setpoint for good (the settling time). A second, dashed grey response from a proportional-only controller levels off below the setpoint, leaving a steady-state error.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
