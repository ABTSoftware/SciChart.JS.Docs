<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 400"><title>How a telemetry system works, from sensor to screen</title><desc>Two rows of steps. On the vehicle: sensors, signal conditioning, sampling and encoding, then framing into a PCM frame or packet with a sync word and a time stamp. A downlink by radio, satellite relay or cable carries the frames to the ground. On the ground: the ground station receives the stream, finds the frame sync and decommutates the channels; the raw counts are converted to engineering units with calibrations; the display shows strip charts, readouts and alarms; and everything is archived for playback. A dashed uplink arrow from the ground back to the vehicle shows telecommand, the commands sent the other way.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4a5568" d="m0 0 10 5-10 5z"/></marker><marker id="arrowUp" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7b5ea7" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="400" fill="#fff"/><rect width="736" height="132" x="12" y="28" fill="#f3f8fc" stroke="#9cc3dc" stroke-dasharray="5 4" rx="12"/><text x="26" y="50" fill="#1f6f94" font-size="14" font-weight="bold">On the vehicle or remote site (aircraft, rocket, car, pipeline)</text><rect width="736" height="132" x="12" y="242" fill="#fdf6ef" stroke="#e8b98c" stroke-dasharray="5 4" rx="12"/><text x="26" y="366" fill="#b35c12" font-size="14" font-weight="bold">On the ground (control room, pit wall, ground station)</text><g fill="#2d3748" font-size="12" text-anchor="middle"><rect width="158" height="78" x="28" y="64" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="107" y="86" fill="#1f6f94" font-size="14" font-weight="bold">1. Sensors</text><text x="107" y="106">temperature, pressure,</text><text x="107" y="122">strain, acceleration</text><rect width="158" height="78" x="210" y="64" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="289" y="86" fill="#1f6f94" font-size="14" font-weight="bold">2. Conditioning</text><text x="289" y="106">amplify, offset and</text><text x="289" y="122">anti-alias filter</text><rect width="158" height="78" x="392" y="64" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="471" y="86" fill="#1f6f94" font-size="14" font-weight="bold">3. Sampling</text><text x="471" y="106">ADC turns volts into</text><text x="471" y="122">counts, at each rate</text><rect width="158" height="78" x="574" y="64" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="653" y="86" fill="#1f6f94" font-size="14" font-weight="bold">4. Framing</text><text x="653" y="106">PCM frame or packet:</text><text x="653" y="122">sync word, time, data</text><rect width="158" height="78" x="574" y="258" fill="#fff" stroke="#e07a1f" stroke-width="2" rx="8"/><text x="653" y="280" fill="#b35c12" font-size="14" font-weight="bold">5. Receive</text><text x="653" y="300">frame sync, then split</text><text x="653" y="316">out each channel</text><rect width="158" height="78" x="392" y="258" fill="#fff" stroke="#e07a1f" stroke-width="2" rx="8"/><text x="471" y="280" fill="#b35c12" font-size="14" font-weight="bold">6. Convert</text><text x="471" y="300">counts to engineering</text><text x="471" y="316">units (°C, bar, g)</text><rect width="158" height="78" x="210" y="258" fill="#fff" stroke="#e07a1f" stroke-width="2" rx="8"/><text x="289" y="280" fill="#b35c12" font-size="14" font-weight="bold">7. Display</text><text x="289" y="300">strip charts, readouts,</text><text x="289" y="316">limits and alarms</text><rect width="158" height="78" x="28" y="258" fill="#fff" stroke="#e07a1f" stroke-width="2" rx="8"/><text x="107" y="280" fill="#b35c12" font-size="14" font-weight="bold">8. Archive</text><text x="107" y="300">record every frame</text><text x="107" y="316">for playback</text></g><g fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"><line x1="187" x2="208" y1="103" y2="103"/><line x1="369" x2="390" y1="103" y2="103"/><line x1="551" x2="572" y1="103" y2="103"/><line x1="573" x2="552" y1="297" y2="297"/><line x1="391" x2="370" y1="297" y2="297"/><line x1="209" x2="188" y1="297" y2="297"/><path d="M653 143v17l-10 12 20 12-20 12 20 12-20 12 10 12v24"/></g><text x="632" y="194" fill="#2d3748" font-size="13" font-weight="bold" text-anchor="end">Downlink: telemetry</text><text x="632" y="211" fill="#4a5568" font-size="12" text-anchor="end">by radio, satellite relay</text><text x="632" y="226" fill="#4a5568" font-size="12" text-anchor="end">or cable</text><path fill="none" stroke="#7b5ea7" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrowUp)" d="M198 257v-94"/><text x="212" y="194" fill="#7b5ea7" font-size="13" font-weight="bold">Uplink: telecommand</text><text x="212" y="211" fill="#5b4a7a" font-size="12">commands sent back to the vehicle</text><text x="402" y="22" fill="#4a5568" font-size="12" text-anchor="middle">Telemetry flows down; commands flow up</text></svg>