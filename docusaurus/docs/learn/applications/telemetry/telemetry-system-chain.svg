<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
<title>How a telemetry system works, from sensor to screen</title>
<desc>Two rows of steps. On the vehicle: sensors, signal conditioning, sampling and encoding, then framing into a PCM frame or packet with a sync word and a time stamp. A downlink by radio, satellite relay or cable carries the frames to the ground. On the ground: the ground station receives the stream, finds the frame sync and decommutates the channels; the raw counts are converted to engineering units with calibrations; the display shows strip charts, readouts and alarms; and everything is archived for playback. A dashed uplink arrow from the ground back to the vehicle shows telecommand, the commands sent the other way.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
<marker id="arrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b5ea7"/></marker>
</defs>
<rect width="760" height="400" fill="#ffffff"/>
<rect x="12" y="28" width="736" height="132" rx="12" fill="#f3f8fc" stroke="#9cc3dc" stroke-dasharray="5 4"/>
<text x="26" y="50" font-size="14" font-weight="bold" fill="#1f6f94">On the vehicle or remote site (aircraft, rocket, car, pipeline)</text>
<rect x="12" y="242" width="736" height="132" rx="12" fill="#fdf6ef" stroke="#e8b98c" stroke-dasharray="5 4"/>
<text x="26" y="366" font-size="14" font-weight="bold" fill="#b35c12">On the ground (control room, pit wall, ground station)</text>

<g font-size="12" fill="#2d3748" text-anchor="middle">
<rect x="28" y="64" width="158" height="78" rx="8" fill="#ffffff" stroke="#2e86ab" stroke-width="2"/>
<text x="107" y="86" font-size="14" font-weight="bold" fill="#1f6f94">1. Sensors</text>
<text x="107" y="106">temperature, pressure,</text>
<text x="107" y="122">strain, acceleration</text>

<rect x="210" y="64" width="158" height="78" rx="8" fill="#ffffff" stroke="#2e86ab" stroke-width="2"/>
<text x="289" y="86" font-size="14" font-weight="bold" fill="#1f6f94">2. Conditioning</text>
<text x="289" y="106">amplify, offset and</text>
<text x="289" y="122">anti-alias filter</text>

<rect x="392" y="64" width="158" height="78" rx="8" fill="#ffffff" stroke="#2e86ab" stroke-width="2"/>
<text x="471" y="86" font-size="14" font-weight="bold" fill="#1f6f94">3. Sampling</text>
<text x="471" y="106">ADC turns volts into</text>
<text x="471" y="122">counts, at each rate</text>

<rect x="574" y="64" width="158" height="78" rx="8" fill="#ffffff" stroke="#2e86ab" stroke-width="2"/>
<text x="653" y="86" font-size="14" font-weight="bold" fill="#1f6f94">4. Framing</text>
<text x="653" y="106">PCM frame or packet:</text>
<text x="653" y="122">sync word, time, data</text>

<rect x="574" y="258" width="158" height="78" rx="8" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
<text x="653" y="280" font-size="14" font-weight="bold" fill="#b35c12">5. Receive</text>
<text x="653" y="300">frame sync, then split</text>
<text x="653" y="316">out each channel</text>

<rect x="392" y="258" width="158" height="78" rx="8" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
<text x="471" y="280" font-size="14" font-weight="bold" fill="#b35c12">6. Convert</text>
<text x="471" y="300">counts to engineering</text>
<text x="471" y="316">units (°C, bar, g)</text>

<rect x="210" y="258" width="158" height="78" rx="8" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
<text x="289" y="280" font-size="14" font-weight="bold" fill="#b35c12">7. Display</text>
<text x="289" y="300">strip charts, readouts,</text>
<text x="289" y="316">limits and alarms</text>

<rect x="28" y="258" width="158" height="78" rx="8" fill="#ffffff" stroke="#e07a1f" stroke-width="2"/>
<text x="107" y="280" font-size="14" font-weight="bold" fill="#b35c12">8. Archive</text>
<text x="107" y="300">record every frame</text>
<text x="107" y="316">for playback</text>
</g>

<g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)">
<line x1="187" y1="103" x2="208" y2="103"/>
<line x1="369" y1="103" x2="390" y2="103"/>
<line x1="551" y1="103" x2="572" y2="103"/>
<line x1="573" y1="297" x2="552" y2="297"/>
<line x1="391" y1="297" x2="370" y2="297"/>
<line x1="209" y1="297" x2="188" y2="297"/>
<path d="M653,143 L653,160 L643,172 L663,184 L643,196 L663,208 L643,220 L653,232 L653,256"/>
</g>
<text x="632" y="194" font-size="13" font-weight="bold" fill="#2d3748" text-anchor="end">Downlink: telemetry</text>
<text x="632" y="211" font-size="12" fill="#4a5568" text-anchor="end">by radio, satellite relay</text>
<text x="632" y="226" font-size="12" fill="#4a5568" text-anchor="end">or cable</text>

<path d="M198,257 L198,163" stroke="#7b5ea7" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowUp)"/>
<text x="212" y="194" font-size="13" font-weight="bold" fill="#7b5ea7">Uplink: telecommand</text>
<text x="212" y="211" font-size="12" fill="#5b4a7a">commands sent back to the vehicle</text>
<text x="402" y="22" font-size="12" fill="#4a5568" text-anchor="middle">Telemetry flows down; commands flow up</text>
</svg>
