<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 606' width='760' height='606' font-family='system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>
<title>Five PRI types: pulse trains and their PRI sequences</title>
<desc>For each of five pulse repetition interval types, a pulse train on a time line on the left, and on the right a plot of PRI against pulse number. Constant: evenly spaced pulses, a flat line of dots. Staggered: a repeating cycle of three intervals, dots stepping up through three levels and repeating. Jittered: uneven spacing, dots scattered randomly about a mean. Sliding: intervals growing steadily, dots on a rising ramp. Dwell-and-switch: one interval held for several pulses then another, dots on two flat levels.</desc>
