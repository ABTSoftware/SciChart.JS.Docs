<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 410' width='760' height='410' font-family='system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>
<title>The parts of a radar pulse train that a passive receiver measures</title>
<desc>Two radar pulses on a time axis, each a burst of carrier wave inside a flat-topped envelope. Labels show the time of arrival at the leading edge of the first pulse, the pulse width across the pulse, the amplitude as the height of the envelope, and the pulse repetition interval from the start of one pulse to the start of the next. Notes say the frequency is the carrier inside the pulse, and the angle of arrival is the direction the pulse comes from.</desc>
