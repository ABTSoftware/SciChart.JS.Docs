<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 360"><title>Moving a time series from a server to a browser chart, fast</title><desc>Three stages. On the server or database: the data is stored as columns, in a columnar time series database, Arrow or Parquet; timestamps become deltas of deltas and values become deltas of scaled integers; the deltas are zig-zag mapped and written as varints, or packed bit by bit Gorilla-style; the frame may then be compressed with gzip, Brotli or zstd. Over the network: one binary WebSocket frame or HTTP response per batch. In the browser: a Web Worker receives the ArrayBuffer and decodes it into one Float64Array per column, then transfers the buffers to the main thread without copying; the main thread calls appendRange once per channel and the chart draws the new data on the GPU. Each stage notes what it avoids: no text parsing, no per-sample objects, no work on the main thread beyond appending.</desc><defs><marker id="arr2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4a5568" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="360" fill="#fff"/><rect width="236" height="336" x="12" y="12" fill="#fdf6ef" stroke="#e8b98c" stroke-dasharray="5 4" rx="12"/><text x="130" y="38" fill="#b35c12" font-size="15" font-weight="bold" text-anchor="middle">Server or database</text><rect width="236" height="336" x="512" y="12" fill="#f3f8fc" stroke="#9cc3dc" stroke-dasharray="5 4" rx="12"/><text x="630" y="38" fill="#1f6f94" font-size="15" font-weight="bold" text-anchor="middle">Browser</text><text x="380" y="38" fill="#5b4a8a" font-size="15" font-weight="bold" text-anchor="middle">Network</text><g fill="#2d3748" font-size="12" text-anchor="middle"><rect width="204" height="54" x="28" y="54" fill="#fff" stroke="#d08a1d" stroke-width="2" rx="8"/><text x="130" y="76" font-weight="bold">1. Stored as columns</text><text x="130" y="94">columnar database, Arrow, Parquet</text><rect width="204" height="70" x="28" y="124" fill="#fff" stroke="#d08a1d" stroke-width="2" rx="8"/><text x="130" y="146" font-weight="bold">2. Encode differences</text><text x="130" y="164">time: delta of delta</text><text x="130" y="180">values: delta of scaled integers</text><rect width="204" height="54" x="28" y="210" fill="#fff" stroke="#d08a1d" stroke-width="2" rx="8"/><text x="130" y="232" font-weight="bold">3. Pack small numbers</text><text x="130" y="250">zig-zag varint, or Gorilla bits</text><rect width="204" height="54" x="28" y="280" fill="#fff" stroke="#d08a1d" stroke-dasharray="4 3" stroke-width="2" rx="8"/><text x="130" y="302" font-weight="bold">4. Optional: gzip, Brotli, zstd</text><text x="130" y="320">helps text formats most</text><line x1="130" x2="130" y1="108" y2="122" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><line x1="130" x2="130" y1="194" y2="208" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><line x1="130" x2="130" y1="264" y2="278" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><rect width="196" height="76" x="282" y="150" fill="#f4f0fb" stroke="#7b5ea7" stroke-width="2" rx="8"/><text x="380" y="174" font-weight="bold">Binary WebSocket frame</text><text x="380" y="192">or HTTP response body:</text><text x="380" y="210">an ArrayBuffer per batch</text><line x1="232" x2="270" y1="300" y2="300" stroke="#4a5568" stroke-width="2"/><line x1="270" x2="270" y1="300" y2="188" stroke="#4a5568" stroke-width="2"/><line x1="270" x2="280" y1="188" y2="188" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><line x1="478" x2="526" y1="188" y2="110" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><rect width="204" height="88" x="528" y="54" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="630" y="76" font-weight="bold">5. Web Worker decodes</text><text x="630" y="94">bytes → one Float64Array</text><text x="630" y="110">per column, off the</text><text x="630" y="126">main thread</text><rect width="204" height="70" x="528" y="158" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="630" y="180" font-weight="bold">6. Transfer, don&apos;t copy</text><text x="630" y="198">postMessage with the</text><text x="630" y="214">buffers in the transfer list</text><rect width="204" height="90" x="528" y="244" fill="#fff" stroke="#2e86ab" stroke-width="2" rx="8"/><text x="630" y="266" font-weight="bold">7. appendRange, then draw</text><text x="630" y="284">dataSeries.appendRange(</text><text x="630" y="300">  times, values)</text><text x="630" y="318">once per channel per batch</text><line x1="630" x2="630" y1="142" y2="156" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/><line x1="630" x2="630" y1="228" y2="242" stroke="#4a5568" stroke-width="2" marker-end="url(#arr2)"/></g><g fill="#4a5568" font-size="11.5" text-anchor="middle"><text x="380" y="262">Avoids: text parsing,</text><text x="380" y="278">field names on every sample,</text><text x="380" y="294">one object per point,</text><text x="380" y="310">decoding on the UI thread</text></g></svg>