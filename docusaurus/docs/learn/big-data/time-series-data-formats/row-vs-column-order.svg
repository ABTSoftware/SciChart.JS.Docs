<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 470"><title>The same telemetry samples in row order and in column order</title><desc>Four samples, each with a time in microseconds, a speed, a throttle and a brake value. On the left, row order: each sample is one JSON object, so the bytes of time, speed, throttle and brake are interleaved and the field names repeat in every row. On the right, column order: all the times sit together, then all the speeds, then all the throttles, then all the brakes. Neighbouring values in a column are close, so their differences are tiny (a first step of 1000 microseconds, then changes of 0 and 3; speed changes of 4, minus 1 and 12 hundredths of a km/h), which is what delta and varint encoding exploit. Each column maps straight onto one Float64Array, which a chart data series accepts with a single appendRange call.</desc><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4a5568" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="470" fill="#fff"/><rect width="340" height="446" x="12" y="12" fill="#fdf6ef" stroke="#e8b98c" stroke-dasharray="5 4" rx="12"/><text x="30" y="40" fill="#b35c12" font-size="16" font-weight="bold">Row order (JSON objects)</text><text x="30" y="60" fill="#4a5568" font-size="12">one record per sample, fields interleaved</text><g fill="#2d3748" font-family="Menlo, Consolas, monospace" font-size="12"><rect width="304" height="30" x="30" y="76" fill="#fff" stroke="#e8b98c" rx="5"/><text x="40" y="96">{&quot;t&quot;:0,&quot;speed&quot;:212.37,&quot;throttle&quot;:…}</text><rect width="304" height="30" x="30" y="112" fill="#fff" stroke="#e8b98c" rx="5"/><text x="40" y="132">{&quot;t&quot;:1000,&quot;speed&quot;:212.41,&quot;throttle&quot;:…}</text><rect width="304" height="30" x="30" y="148" fill="#fff" stroke="#e8b98c" rx="5"/><text x="40" y="168">{&quot;t&quot;:2000,&quot;speed&quot;:212.40,&quot;throttle&quot;:…}</text><rect width="304" height="30" x="30" y="184" fill="#fff" stroke="#e8b98c" rx="5"/><text x="40" y="204">{&quot;t&quot;:3003,&quot;speed&quot;:212.52,&quot;throttle&quot;:…}</text></g><text x="30" y="246" fill="#b35c12" font-size="13" font-weight="bold">In memory and on the wire</text><g fill="#fff" font-size="11" text-anchor="middle"><rect width="38" height="26" x="30" y="258" fill="#2e86ab"/><text x="49" y="275">t</text><rect width="38" height="26" x="68" y="258" fill="#3a9d5d"/><text x="87" y="275">spd</text><rect width="38" height="26" x="106" y="258" fill="#d08a1d"/><text x="125" y="275">thr</text><rect width="38" height="26" x="144" y="258" fill="#c0504d"/><text x="163" y="275">brk</text><rect width="38" height="26" x="182" y="258" fill="#2e86ab"/><text x="201" y="275">t</text><rect width="38" height="26" x="220" y="258" fill="#3a9d5d"/><text x="239" y="275">spd</text><rect width="38" height="26" x="258" y="258" fill="#d08a1d"/><text x="277" y="275">thr</text><rect width="38" height="26" x="296" y="258" fill="#c0504d"/><text x="315" y="275">brk</text></g><g fill="#2d3748" font-size="12.5"><text x="30" y="316">• field names repeat in every record</text><text x="30" y="338">• numbers travel as text and must be parsed</text><text x="30" y="360">• one object allocated per sample</text><text x="30" y="382">• similar values sit far apart, so</text><text x="42" y="400">compressors find less to squeeze</text><text x="30" y="422">• good for: small payloads, APIs that</text><text x="42" y="440">return a handful of records</text></g><line x1="356" x2="402" y1="150" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arr)"/><text x="379" y="140" fill="#4a5568" font-size="11" text-anchor="middle">vs</text><rect width="340" height="446" x="408" y="12" fill="#f3f8fc" stroke="#9cc3dc" stroke-dasharray="5 4" rx="12"/><text x="426" y="40" fill="#1f6f94" font-size="16" font-weight="bold">Column order (one array per field)</text><text x="426" y="60" fill="#4a5568" font-size="12">all times, then all speeds, and so on</text><g fill="#2d3748" font-family="Menlo, Consolas, monospace" font-size="12"><rect width="304" height="30" x="426" y="76" fill="#fff" stroke="#2e86ab" stroke-width="1.5" rx="5"/><text x="436" y="96">t:     0  1000  2000  3003</text><rect width="304" height="30" x="426" y="112" fill="#fff" stroke="#3a9d5d" stroke-width="1.5" rx="5"/><text x="436" y="132">speed: 212.37 212.41 212.40 212.52</text><rect width="304" height="30" x="426" y="148" fill="#fff" stroke="#d08a1d" stroke-width="1.5" rx="5"/><text x="436" y="168">throttle: …</text><rect width="304" height="30" x="426" y="184" fill="#fff" stroke="#c0504d" stroke-width="1.5" rx="5"/><text x="436" y="204">brake:    …</text></g><text x="426" y="246" fill="#1f6f94" font-size="13" font-weight="bold">In memory and on the wire</text><g fill="#fff" font-size="11" text-anchor="middle"><rect width="38" height="26" x="426" y="258" fill="#2e86ab"/><text x="445" y="275">t</text><rect width="38" height="26" x="464" y="258" fill="#2e86ab"/><text x="483" y="275">t</text><rect width="38" height="26" x="502" y="258" fill="#3a9d5d"/><text x="521" y="275">spd</text><rect width="38" height="26" x="540" y="258" fill="#3a9d5d"/><text x="559" y="275">spd</text><rect width="38" height="26" x="578" y="258" fill="#d08a1d"/><text x="597" y="275">thr</text><rect width="38" height="26" x="616" y="258" fill="#d08a1d"/><text x="635" y="275">thr</text><rect width="38" height="26" x="654" y="258" fill="#c0504d"/><text x="673" y="275">brk</text><rect width="38" height="26" x="692" y="258" fill="#c0504d"/><text x="711" y="275">brk</text></g><g fill="#2d3748" font-size="12.5"><text x="426" y="316">• differences between neighbours are tiny:</text><text x="438" y="336" font-family="Menlo, Consolas, monospace" font-size="11.5">t  1000  0  +3   (delta of delta)</text><text x="438" y="354" font-family="Menlo, Consolas, monospace" font-size="11.5">speed  +4  −1  +12 (hundredths)</text><text x="426" y="378">• each column becomes one Float64Array</text><text x="426" y="400">• one appendRange call per channel,</text><text x="438" y="418">no per-sample objects</text><text x="426" y="442">• good for: large and streaming series</text></g></svg>