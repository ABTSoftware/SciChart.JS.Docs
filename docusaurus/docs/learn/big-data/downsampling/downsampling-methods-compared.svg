<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 720 490"><title id="t">Five ways to downsample the same 12 points</title><desc id="d">A 12-point series with one spike, reduced to about six points by every-nth sampling, pair averaging, min-max, M4 and largest-triangle-three-buckets. Every-nth loses the spike and averaging shrinks it; min-max, M4 and LTTB keep it.</desc><rect width="720" height="490" fill="#fff"/><text x="360" y="26" fill="#1a1a2e" font-size="18" font-weight="bold" text-anchor="middle">Downsampling 12 points to about 6: which methods keep the spike?</text><rect width="228" height="205" x="12" y="52" fill="#f7f9fc" stroke="#d5dbe5" rx="8"/><text x="22" y="74" fill="#1a1a2e" font-size="14" font-weight="bold">Original: 12 points</text><line x1="30" x2="228" y1="212" y2="212" stroke="#9aa5b5"/><polyline fill="none" stroke="#1f6f8b" stroke-width="2" points="30.0,183.8 48.0,174.5 66.0,183.8 84.0,165.1 102.0,174.5 120.0,174.5 138.0,165.1 156.0,99.4 174.0,174.5 192.0,183.8 210.0,174.5 228.0,183.8"/><circle cx="30" cy="183.8" r="4" fill="#1f6f8b"/><circle cx="48" cy="174.5" r="4" fill="#1f6f8b"/><circle cx="66" cy="183.8" r="4" fill="#1f6f8b"/><circle cx="84" cy="165.1" r="4" fill="#1f6f8b"/><circle cx="102" cy="174.5" r="4" fill="#1f6f8b"/><circle cx="120" cy="174.5" r="4" fill="#1f6f8b"/><circle cx="138" cy="165.1" r="4" fill="#1f6f8b"/><circle cx="156" cy="99.4" r="4" fill="#1f6f8b"/><circle cx="174" cy="174.5" r="4" fill="#1f6f8b"/><circle cx="192" cy="183.8" r="4" fill="#1f6f8b"/><circle cx="210" cy="174.5" r="4" fill="#1f6f8b"/><circle cx="228" cy="183.8" r="4" fill="#1f6f8b"/><text x="164" y="104.4" fill="#1a1a2e" font-size="13">12</text><text x="22" y="240" fill="#1f6f8b" font-size="13.5" font-weight="bold">One spike: point 8, value 12</text><rect width="228" height="205" x="246" y="52" fill="#f7f9fc" stroke="#d5dbe5" rx="8"/><text x="256" y="74" fill="#1a1a2