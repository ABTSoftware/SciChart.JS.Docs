<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Five ways to downsample the same 12 points</title>
<desc id="d">A 12-point series with one spike, reduced to about six points by every-nth sampling, pair averaging, min-max, M4 and largest-triangle-three-buckets. Every-nth loses the spike and averaging shrinks it; min-max, M4 and LTTB keep it.</desc>
