<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
<title id="t">How SVG, Canvas and WebGL or WebGPU draw a chart</title>
<desc id="d">Three rows. SVG: the data becomes one element per point in the page, then the browser styles, lays out and paints every element on the CPU. Canvas: JavaScript issues a drawing command per point on the CPU into a bitmap. WebGL or WebGPU: the data is copied into a GPU buffer and shaders draw all the points in parallel on the graphics card. The right-hand column shows the CPU work per point falling from high to low.</desc>
<rect width="860" height="470" fill="#ffffff"/>
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1F2A44">How each approach turns data into pixels</text>
<text x="776" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#6B7280">CPU work per point</text>
<text x="30" y="143" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F2A44">SVG</text>
