<text x="300.0" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44">per point</text>
<line x1="356" y1="138" x2="368" y2="138" stroke="#1F2A44" stroke-width="2"/>
<polygon points="366,132 374,138 366,144" fill="#1F2A44"/>
