<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" aria-labelledby="t d" viewBox="0 0 860 470"><title id="t">How SVG, Canvas and WebGL or WebGPU draw a chart</title><desc id="d">Three rows. SVG: the data becomes one element per point in the page, then the browser styles, lays out and paints every element on the CPU. Canvas: JavaScript issues a drawing command per point on the CPU into a bitmap. WebGL or WebGPU: the data is copied into a GPU buffer and shaders draw all the points in parallel on the graphics card. The right-hand column shows the CPU work per point falling from high to low.</desc><rect width="860" height="470" fill="#fff"/><text x="30" y="36" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">How each approach turns data into pixels</text><text x="776" y="72" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CPU work per point</text><text x="30" y="143" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">SVG</text><rect width="104" height="66" x="120" y="105" fill="#EAF6FA" stroke="#9FB3C8" rx="8"/><text x="172" y="142" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Data</text><line x1="228" x2="240" y1="138" y2="138" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="238,132 246,138 238,144"/><rect width="104" height="66" x="248" y="105" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="300" y="133" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">One element</text><text x="300" y="151" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">per point</text><line x1="356" x2="368" y1="138" y2="138" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="366,132 374,138 366,144"/><rect width="104" height="66" x="376" y="105" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="428" y="133" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Style + layout</text><text x="428" y="151" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">(CPU)</text><line x1="484" x2="496" y1="138" y2="138" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="494,132 502,138 494,144"/><rect width="104" height="66" x="504" y="105" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="556" y="133" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Paint</text><text x="556" y="151" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">(CPU)</text><line x1="612" x2="624" y1="138" y2="138" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="622,132 630,138 622,144"/><rect width="70" height="66" x="632" y="105" fill="#1F2A44" rx="8"/><text x="667" y="143" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Screen</text><rect width="128" height="24" x="712" y="125" fill="#EEF1F5" rx="4"/><rect width="128" height="24" x="712" y="125" fill="#D9534F" rx="4"/><text x="776" y="171" fill="#D9534F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">High</text><text x="30" y="263" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Canvas</text><rect width="104" height="66" x="120" y="225" fill="#EAF6FA" stroke="#9FB3C8" rx="8"/><text x="172" y="262" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Data</text><line x1="228" x2="240" y1="258" y2="258" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="238,252 246,258 238,264"/><rect width="104" height="66" x="248" y="225" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="300" y="253" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">A draw call</text><text x="300" y="271" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">per point (CPU)</text><line x1="356" x2="368" y1="258" y2="258" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="366,252 374,258 366,264"/><rect width="104" height="66" x="376" y="225" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="428" y="262" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Bitmap</text><line x1="484" x2="496" y1="258" y2="258" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="494,252 502,258 494,264"/><rect width="70" height="66" x="504" y="225" fill="#1F2A44" rx="8"/><text x="539" y="263" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Screen</text><rect width="128" height="24" x="712" y="245" fill="#EEF1F5" rx="4"/><rect width="70" height="24" x="712" y="245" fill="#E0A21A" rx="4"/><text x="776" y="291" fill="#E0A21A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Medium</text><text x="30" y="373" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">WebGL /</text><text x="30" y="393" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">WebGPU</text><rect width="104" height="66" x="120" y="345" fill="#EAF6FA" stroke="#9FB3C8" rx="8"/><text x="172" y="382" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Data</text><line x1="228" x2="240" y1="378" y2="378" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="238,372 246,378 238,384"/><rect width="104" height="66" x="248" y="345" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="300" y="373" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Copy to GPU</text><text x="300" y="391" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">buffer</text><line x1="356" x2="368" y1="378" y2="378" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="366,372 374,378 366,384"/><rect width="104" height="66" x="376" y="345" fill="#F4F7FB" stroke="#9FB3C8" rx="8"/><text x="428" y="373" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">Shaders draw</text><text x="428" y="391" fill="#1F2A44" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">in parallel (GPU)</text><line x1="484" x2="496" y1="378" y2="378" stroke="#1F2A44" stroke-width="2"/><polygon fill="#1F2A44" points="494,372 502,378 494,384"/><rect width="70" height="66" x="504" y="345" fill="#1F2A44" rx="8"/><text x="539" y="383" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Screen</text><rect width="128" height="24" x="712" y="365" fill="#EEF1F5" rx="4"/><rect width="19" height="24" x="712" y="365" fill="#2E9E6B" rx="4"/><text x="776" y="411" fill="#2E9E6B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Low</text><text x="30" y="452" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="13">Simplified. Every approach also has fixed costs per frame; what grows with the number of points is what limits big data.</text></svg>