<title id="t">Four shapes to look for in a network graph</title>
<desc id="d">Four small networks side by side. Hub and spoke: one central node linked to many others. Clusters: two dense groups joined by one link. Chain: nodes in a line, each linked only to the next. Core and periphery: a tightly linked centre with loosely attached nodes around it.</desc>
