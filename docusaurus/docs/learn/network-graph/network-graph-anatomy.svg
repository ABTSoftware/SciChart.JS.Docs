<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">The parts of a network graph</title>
<desc id="d">Two clusters of nodes, blue on the left and orange on the right, joined by a single bridge node. Callouts mark a node, an edge, a hub with many connections, the bridge, a thick weighted edge, an isolated node with no connections, and each cluster.</desc>
