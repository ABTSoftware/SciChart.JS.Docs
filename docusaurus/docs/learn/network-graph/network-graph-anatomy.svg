<line x1="235" y1="300" x2="440" y2="300" stroke="#9AA6B8" stroke-width="2.2" stroke-linecap="round"/>
<line x1="440" y1="300" x2="600" y2="300" stroke="#9AA6B8" stroke-width="2.2" stroke-linecap="round"/>
<line x1="600" y1="300" x2="660" y2="215" stroke="#9AA6B8" stroke-width="2.2" stroke-linecap="round"/>
