<text x="40" y="52" font-size="17" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Hub</tspan><tspan x="40" dy="21" font-size="15" fill="#475569">many connections (high degree)</tspan></text>
<line x1="330" y1="120" x2="432" y2="288" stroke="#64748B" stroke-width="1.4"/><circle cx="432" cy="288" r="3" fill="#64748B"/>
<text x="320" y="52" font-size="17" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Bridge</tspan><tspan x="320" dy="21" font-size="15" fill="#475569">the only link between the two clusters</tspan></text>
<line x1="745" y1="120" x2="690" y2="266" stroke="#64748B" stroke-width="1.4"/><circle cx="690" cy="266" r="3" fill="#64748B"/>
<text x="640" y="52" font-size="17" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Weighted edge</tspan><tspan x="640" dy="21" font-size="15" fill="#475569">thicker = stronger or more frequent</tspan></text>
<line x1="120" y1="500" x2="175" y2="418" stroke="#64748B" stroke-width="1.4"/><circle cx="175" cy="418" r="3" fill="#64748B"/>
<text x="40" y="525" font-size="17" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Node</tspan><tspan x="40" dy="21" font-size="15" fill="#475569">one item: a person, a computer, a page</tspan></text>
<line x1="380" y1="495" x2="340" y2="300" stroke="#64748B" stroke-width="1.4"/><circle cx="340" cy="300" r="3" fill="#64748B"/>
<text x="340" y="525" font-size="17" fill="#1F2937" text-anchor="start"><tspan font-weight="700">Edge (link)</tspan><tspan x="340" dy="21" font-size="15" fill="#475569">a connection between two nodes</tspan></text>
<line x1="800" y1="500" x2="826" y2="481" stroke="#64748B" stroke-width="1.4"/><circle cx="826" cy="481" r="3" fill="#64748B"/>
<text x="890" y="525" font-size="17" fill="#1F2937" text-anchor="end"><tspan font-weight="700">Isolate</tspan><tspan x="890" dy="21" text-anchor="end" font-size="15" fill="#475569">no connections</tspan></text>
<text x="80" y="170" font-size="15" font-weight="600" fill="#2F80C0">Cluster</text>
<text x="752" y="200" font-size="15" font-weight="600" fill="#E07B24">Cluster</text>
