<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title id="title">Positive, negative and no correlation in a scatter plot</title>
  <desc id="desc">Three small scatter plots. In the first, the dots rise from bottom left to top right with an upward trend line: a positive correlation, with one outlier far below the pattern. In the second, the dots fall from top left to bottom right with a downward trend line: a negative correlation. In the third, the dots form a shapeless cloud with no trend: no correlation.</desc>
  <rect width="700" height="360" rx="12" fill="#ffffff"/>
  <!-- Positive correlation -->
  <g stroke="#333" stroke-width="2"><line x1="30" y1="40" x2="30" y2="230"/><line x1="30" y1="230" x2="220" y2="230"/></g>
  <line x1="38" y1="217" x2="212" y2="50" stroke="#F48420" stroke-width="3" stroke-dasharray="8 4"/>
  <g fill="#2a7fb8" fill-opacity="0.75">
    <circle cx="95" cy="152" r="5"/>
    <circle cx="52" cy="194" r="5"/>
    <circle cx="131" cy="133" r="5"/>
    <circle cx="126" cy="129" r="5"/>
    <circle cx="46" cy="224" r="5"/>
    <circle cx="55" cy="210" r="5"/>
    <circle cx="112" cy="145" r="5"/>
    <circle cx="78" cy="196" r="5"/>
    <circle cx="147" cy="87" r="5"/>
    <circle cx="107" cy="163" r="5"/>
    <circle cx="206" cy="46" r="5"/>
    <circle cx="89" cy="164" r="5"/>
    <circle cx="64" cy="191" r="5"/>
    <circle cx="179" cy="64" r="5"/>
    <circle cx="70" cy="219" r="5"/>
    <circle cx="103" cy="173" r="5"/>
    <circle cx="133" cy="120" r="5"/>
    <circle cx="75" cy="188" r="5"/>
    <circle cx="156" cy="116" r="5"/>
    <circle cx="140" cy="111" r="5"/>
    <circle cx="117" cy="154" r="5"/>
    <circle cx="159" cy="65" r="5"/>
    <circle cx="81" cy="204" r="5"/>
    <circle cx="189" cy="74" r="5"/>
    <circle cx="164" cy="104" r="5"/>
    <circle cx="60" cy="156" r="5"/>
    <circle cx="111" cy="150" r="5"/>
    <circle cx="123" cy="148" r="5"/>
  </g>
  <circle cx="178" cy="196" r="5" fill="#c62828"/>
  <circle cx="178" cy="196" r="11" fill="none" stroke="#c62828" stroke-width="1.5"/>
  <text x="162" y="201" text-anchor="end" fill="#c62828" font-size="13">outlier</text>
  <text x="125" y="264" text-anchor="middle" fill="#1b7f75" font-weight="bold">Positive correlation</text>
  <text x="125" y="286" text-anchor="middle" fill="#666" font-size="13">As x rises, y rises</text>
  <text x="220" y="246" text-anchor="end" fill="#666" font-size="12">x</text>
  <text x="22" y="50" text-anchor="end" fill="#666" font-size="12">y</text>
  <!-- Negative correlation -->
  <g stroke="#333" stroke-width="2"><line x1="255" y1="40" x2="255" y2="230"/><line x1="255" y1="230" x2="445" y2="230"/></g>
  <line x1="263" y1="50" x2="437" y2="217" stroke="#F48420" stroke-width="3" stroke-dasharray="8 4"/>
  <g fill="#2a7fb8" fill-opacity="0.75">
    <circle cx="271" cy="63" r="5"/>
    <circle cx="362" cy="177" r="5"/>
    <circle cx="414" cy="218" r="5"/>
    <circle cx="366" cy="126" r="5"/>
    <circle cx="364" cy="185" r="5"/>
    <circle cx="426" cy="210" r="5"/>
    <circle cx="346" cy="134" r="5"/>
    <circle cx="384" cy="179" r="5"/>
    <circle cx="375" cy="128" r="5"/>
    <circle cx="313" cy="96" r="5"/>
    <circle cx="330" cy="115" r="5"/>
    <circle cx="343" cy="131" r="5"/>
    <circle cx="293" cy="67" r="5"/>
    <circle cx="396" cy="182" r="5"/>
    <circle cx="287" cy="64" r="5"/>
    <circle cx="414" cy="187" r="5"/>
    <circle cx="278" cy="78" r="5"/>
    <circle cx="416" cy="200" r="5"/>
    <circle cx="405" cy="186" r="5"/>
    <circle cx="336" cy="130" r="5"/>
    <circle cx="326" cy="72" r="5"/>
    <circle cx="290" cy="100" r="5"/>
    <circle cx="295" cy="72" r="5"/>
    <circle cx="347" cy="118" r="5"/>
    <circle cx="365" cy="152" r="5"/>
    <circle cx="336" cy="118" r="5"/>
    <circle cx="328" cy="153" r="5"/>
    <circle cx="383" cy="190" r="5"/>
  </g>
  <text x="350" y="264" text-anchor="middle" fill="#c62828" font-weight="bold">Negative correlation</text>
  <text x="350" y="286" text-anchor="middle" fill="#666" font-size="13">As x rises, y falls</text>
  <text x="445" y="246" text-anchor="end" fill="#666" font-size="12">x</text>
  <text x="247" y="50" text-anchor="end" fill="#666" font-size="12">y</text>
  <!-- No correlation -->
  <g stroke="#333" stroke-width="2"><line x1="480" y1="40" x2="480" y2="230"/><line x1="480" y1="230" x2="670" y2="230"/></g>
  <g fill="#2a7fb8" fill-opacity="0.75">
    <circle cx="578" cy="113" r="5"/>
    <circle cx="605" cy="220" r="5"/>
    <circle cx="643" cy="82" r="5"/>
    <circle cx="639" cy="78" r="5"/>
    <circle cx="557" cy="154" r="5"/>
    <circle cx="507" cy="109" r="5"/>
    <circle cx="500" cy="217" r="5"/>
    <circle cx="525" cy="199" r="5"/>
    <circle cx="548" cy="220" r="5"/>
    <circle cx="490" cy="201" r="5"/>
    <circle cx="507" cy="161" r="5"/>
    <circle cx="494" cy="64" r="5"/>
    <circle cx="595" cy="202" r="5"/>
    <circle cx="533" cy="164" r="5"/>
    <circle cx="552" cy="207" r="5"/>
    <circle cx="635" cy="46" r="5"/>
    <circle cx="569" cy="138" r="5"/>
    <circle cx="504" cy="211" r="5"/>
    <circle cx="548" cy="180" r="5"/>
    <circle cx="631" cy="199" r="5"/>
    <circle cx="493" cy="49" r="5"/>
    <circle cx="580" cy="202" r="5"/>
    <circle cx="582" cy="224" r="5"/>
    <circle cx="580" cy="46" r="5"/>
    <circle cx="637" cy="98" r="5"/>
    <circle cx="534" cy="160" r="5"/>
    <circle cx="518" cy="83" r="5"/>
    <circle cx="581" cy="82" r="5"/>
  </g>
  <text x="575" y="264" text-anchor="middle" fill="#555555" font-weight="bold">No correlation</text>
  <text x="575" y="286" text-anchor="middle" fill="#666" font-size="13">No pattern</text>
  <text x="670" y="246" text-anchor="end" fill="#666" font-size="12">x</text>
  <text x="472" y="50" text-anchor="end" fill="#666" font-size="12">y</text>
  <!-- Legend -->
  <line x1="200" y1="335" x2="240" y2="335" stroke="#F48420" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="248" y="340" fill="#333" font-size="13">trend line (line of best fit)</text>
  <circle cx="438" cy="335" r="5" fill="#2a7fb8" fill-opacity="0.75"/>
  <text x="450" y="340" fill="#333" font-size="13">one data point</text>
</svg>
