<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Histogram vs bar graph: the same 20 deliveries drawn both ways</title>
<desc id="d">Left: a histogram of 20 delivery times in 10-minute bins from 10 to 60 minutes, with touching bars of 4, 10, 4, 1 and 1 deliveries in numeric order. Right: a bar graph of the same 20 deliveries by delivery area, with separate bars sorted largest first: North 7, Centre 6, East 4 and West 3.</desc>
