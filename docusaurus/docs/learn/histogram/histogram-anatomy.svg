<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="title">Anatomy of a histogram, and common distribution shapes</title>
  <desc id="desc">Top: a histogram whose horizontal axis is split into equal-width bins and whose vertical axis shows frequency, the number of values in each bin. The bars touch because the bins are continuous ranges; the tallest bar is the most common range. Bottom: four common shapes. Normal (symmetric, bell-shaped), right-skewed (a long tail to the right), left-skewed (a long tail to the left) and bimodal (two peaks).</desc>
  <rect width="700" height="580" rx="12" fill="#ffffff"/>
  <!-- Anatomy -->
  <g stroke="#555" stroke-width="1.5"><line x1="150" y1="40" x2="150" y2="260"/><line x1="150" y1="260" x2="530" y2="260"/></g>
  <rect x="150" y="245" width="40" height="15" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="190" y="215" width="40" height="45" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="230" y="170" width="40" height="90" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="270" y="110" width="40" height="150" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="310" y="65" width="40" height="195" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="350" y="95" width="40" height="165" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="390" y="155" width="40" height="105" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="430" y="200" width="40" height="60" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="470" y="230" width="40" height="30" fill="#2f80c8" stroke="#ffffff" stroke-width="1.5"/>
  <g fill="#333" font-size="12" text-anchor="middle">
    <text x="150" y="276">150</text>
    <text x="190" y="276">155</text>
    <text x="230" y="276">160</text>
    <text x="270" y="276">165</text>
    <text x="310" y="276">170</text>
    <text x="350" y="276">175</text>
    <text x="390" y="276">180</text>
    <text x="430" y="276">185</text>
    <text x="470" y="276">190</text>
    <text x="510" y="276">195</text>
  </g>
  <text x="330.0" y="326" text-anchor="middle" fill="#333">Measured value (e.g. height in cm), split into bins</text>
  <g fill="#333" font-size="12" text-anchor="end">
    <text x="144" y="264">0</text>
    <text x="144" y="189">5</text>
    <text x="144" y="114">10</text>
  </g>
  <text x="120" y="165" text-anchor="middle" fill="#333" transform="rotate(-90 120 165)">Frequency (count)</text>
  <g stroke="#c0392b" stroke-width="1.5" fill="none"><path d="M230 282 v6 h40 v-6"/></g>
  <text x="250.0" y="304" text-anchor="middle" fill="#c0392b" font-size="13">bin width (5 cm)</text>
  <line x1="352.0" y1="67" x2="420.0" y2="55" stroke="#999" stroke-dasharray="4 4"/>
  <text x="425.0" y="59" fill="#333" font-size="13">tallest bar: the most common range</text>
  <text x="425.0" y="77" fill="#666" font-size="13">(13 values between 170 and 175)</text>
  <line x1="390" y1="185" x2="500" y2="185" stroke="#333" stroke-dasharray="4 4"/>
  <text x="505" y="189" fill="#333" font-size="13">bars touch: the bins are</text>
  <text x="505" y="207" fill="#333" font-size="13">continuous ranges, no gaps</text>
  <!-- Distribution shapes -->
  <line x1="20" y1="355" x2="680" y2="355" stroke="#ddd"/>
  <text x="350" y="382" text-anchor="middle" font-weight="bold" font-size="15" fill="#222">Common shapes</text>
  <g stroke="#555" stroke-width="1"><line x1="30" y1="520" x2="171" y2="520"/></g>
  <rect x="33" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="48" y="498" width="15" height="22" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="63" y="476" width="15" height="44" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="78" y="443" width="15" height="77" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="93" y="421" width="15" height="99" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="108" y="443" width="15" height="77" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="123" y="476" width="15" height="44" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="138" y="498" width="15" height="22" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="153" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <text x="100.5" y="542" text-anchor="middle" font-weight="bold" fill="#222">Normal</text>
  <text x="100.5" y="560" text-anchor="middle" fill="#666" font-size="13">symmetric bell</text>
  <g stroke="#555" stroke-width="1"><line x1="195" y1="520" x2="336" y2="520"/></g>
  <rect x="198" y="487" width="15" height="33" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="213" y="432" width="15" height="88" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="228" y="421" width="15" height="99" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="243" y="443" width="15" height="77" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="258" y="465" width="15" height="55" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="273" y="487" width="15" height="33" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="288" y="498" width="15" height="22" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="303" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="318" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <text x="265.5" y="542" text-anchor="middle" font-weight="bold" fill="#222">Right-skewed</text>
  <text x="265.5" y="560" text-anchor="middle" fill="#666" font-size="13">long tail to the right</text>
  <g stroke="#555" stroke-width="1"><line x1="360" y1="520" x2="501" y2="520"/></g>
  <rect x="363" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="378" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="393" y="498" width="15" height="22" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="408" y="487" width="15" height="33" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="423" y="465" width="15" height="55" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="438" y="443" width="15" height="77" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="453" y="421" width="15" height="99" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="468" y="432" width="15" height="88" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="483" y="487" width="15" height="33" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <text x="430.5" y="542" text-anchor="middle" font-weight="bold" fill="#222">Left-skewed</text>
  <text x="430.5" y="560" text-anchor="middle" fill="#666" font-size="13">long tail to the left</text>
  <g stroke="#555" stroke-width="1"><line x1="525" y1="520" x2="666" y2="520"/></g>
  <rect x="528" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="543" y="476" width="15" height="44" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="558" y="432" width="15" height="88" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="573" y="465" width="15" height="55" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="588" y="498" width="15" height="22" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="603" y="465" width="15" height="55" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="618" y="432" width="15" height="88" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="633" y="476" width="15" height="44" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <rect x="648" y="509" width="15" height="11" fill="#2f80c8" stroke="#ffffff" stroke-width="1"/>
  <text x="595.5" y="542" text-anchor="middle" font-weight="bold" fill="#222">Bimodal</text>
  <text x="595.5" y="560" text-anchor="middle" fill="#666" font-size="13">two peaks</text>
</svg>
