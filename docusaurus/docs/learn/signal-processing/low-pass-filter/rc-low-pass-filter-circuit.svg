<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">RC low-pass filter circuit</title>
<desc id="d">A resistor R in series between the input and the output, and a capacitor C from the output to ground. The cutoff frequency is 1 divided by 2 pi R C. With R of 1 kilohm and C of 220 nanofarads the cutoff is about 723 hertz.</desc>
<rect width="700" height="330" fill="#ffffff"/>
<g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- input terminals -->
  <circle cx="70" cy="70" r="6" fill="#fff"/>
  <circle cx="70" cy="210" r="6" fill="#fff"/>
  <!-- top wire to resistor -->
  <line x1="76" y1="70" x2="170" y2="70"/>
  <!-- resistor (zigzag) -->
  <polyline points="170,70 180,52 196,88 212,52 228,88 244,52 260,88 270,70"/>
  <!-- wire to node and output -->
  <line x1="270" y1="70" x2="574" y2="70"/>
  <circle cx="380" cy="70" r="5" fill="#222"/>
  <circle cx="580" cy="70" r="6" fill="#fff"/>
  <!-- capacitor -->
  <line x1="380" y1="70" x2="380" y2="128"/>
  <line x1="350" y1="128" x2="410" y2="128" stroke-width="4"/>
  <line x1="350" y1="144" x2="410" y2="144" stroke-width="4"/>
  <line x1="380" y1="144" x2="380" y2="210"/>
  <!-- bottom (ground) wire -->
  <line x1="76" y1="210" x2="574" y2="210"/>
  <circle cx="380" cy="210" r="5" fill="#222"/>
  <circle cx="580" cy="210" r="6" fill="#fff"/>
</g>
<!-- ground symbol -->
<g stroke="#222" stroke-width="2.5">
  <line x1="380" y1="210" x2="380" y2="232"/>
  <line x1="362" y1="232" x2="398" y2="232"/>
  <line x1="368" y1="239" x2="392" y2="239"/>
  <line x1="374" y1="246" x2="386" y2="246"/>
</g>
<g font-size="17" fill="#222">
  <text x="220" y="40" text-anchor="middle" font-weight="700">R</text>
  <text x="422" y="142" font-weight="700">C</text>
  <text x="62" y="76" text-anchor="end">V<tspan font-size="13" dy="4">in</tspan></text>
  <text x="598" y="76">V<tspan font-size="13" dy="4">out</tspan></text>
  <text x="62" y="216" text-anchor="end">0 V</text>
  <text x="598" y="216">0 V</text>
</g>
<!-- explanation arrows -->
<g font-size="14" fill="#2a6fdb">
  <text x="460" y="112">Slow changes: C charges</text>
  <text x="460" y="130">fully, V<tspan font-size="11" dy="3">out</tspan><tspan dy="-3"> follows V</tspan><tspan font-size="11" dy="3">in</tspan></text>
</g>
<g font-size="14" fill="#d1495b">
  <text x="460" y="160">Fast changes: C looks like</text>
  <text x="460" y="178">a short to 0 V, little gets out</text>
</g>
<!-- formula -->
<rect x="70" y="262" width="560" height="52" rx="8" fill="#f2f5fa" stroke="#c9d3e3"/>
<text x="350" y="286" text-anchor="middle" font-size="18" fill="#222">f<tspan font-size="13" dy="4">c</tspan><tspan dy="-4"> = 1 / (2π R C)</tspan></text>
<text x="350" y="306" text-anchor="middle" font-size="14" fill="#444">Example: R = 1 kΩ, C = 220 nF → f<tspan font-size="11" dy="3">c</tspan><tspan dy="-3"> = 1 / (2π × 1000 × 0.00000022) ≈ 723 Hz</tspan></text>
</svg>
