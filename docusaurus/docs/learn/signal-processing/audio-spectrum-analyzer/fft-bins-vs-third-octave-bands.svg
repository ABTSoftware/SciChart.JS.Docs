<path d="M311.3,138v6h66.2v-6" fill="none" stroke="#F48420" stroke-width="2"/>
<text x="344.4" y="162" text-anchor="middle" font-size="13" fill="#1f2a44">≈21 bins</text>
<path d="M443.8,138v6h66.2v-6" fill="none" stroke="#F48420" stroke-width="2"/>
<text x="476.9" y="162" text-anchor="middle" font-size="13" fill="#1f2a44">≈85 bins</text>
<path d="M642.5,138v6h66.2v-6" fill="none" stroke="#F48420" stroke-width="2"/>
<text x="675.6" y="162" text-anchor="middle" font-size="13" fill="#1f2a44">≈680 bins</text>
<text x="70" y="182" font-size="13" fill="#6b7a99">Orange brackets: one octave each. Bins per octave = lower edge / bin width (11.7 Hz).</text>
