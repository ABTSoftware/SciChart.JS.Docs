<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
<title>FFT bins compared with 1/3-octave bands on a log frequency axis</title>
<desc>Top: FFT bins 11.7 Hz apart (N = 4,096 at 48 kHz) are sparse in the bass and crowd together in the treble: about 3 bins in the octave from 31.5 Hz, 21 from 250 Hz, 85 from 1 kHz and 680 from 8 kHz. Bottom: pink noise analysed both ways. As an FFT line it falls 3 dB per octave; as 1/3-octave bars it is flat.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="700" fill="#1f2a44">FFT bins vs 1/3-octave bands (N = 4,096 at 48 kHz)</text>
<text x="20" y="62" font-weight="700" fill="#1f2a44">Bins are equally spaced in hertz, so on a log axis they crowd into the treble</text>
