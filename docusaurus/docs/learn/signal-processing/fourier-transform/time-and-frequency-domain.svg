<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The Fourier transform moves a signal between the time domain and the frequency domain</title>
<desc id="d">Left: a 3 Hz sine wave of amplitude 1 plus an 8 Hz sine wave of amplitude 0.5 add up to a more complex signal over one second. Right: the Fourier transform of that signal is a spectrum with two spikes, height 1 at 3 Hz and height 0.5 at 8 Hz. An arrow labelled Fourier transform points from the signal to the spectrum, and an arrow labelled inverse Fourier transform points back.</desc>
