<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Real DFT and complex DFT: what goes in and what comes out</title>
  <desc id="d">Top: the real DFT takes N real samples x[n], numbered 0 to N − 1, and returns two arrays of N/2 + 1 values, numbered 0 to N/2: Re X[k], the cosine amplitudes, and Im X[k], the sine amplitudes. Bottom: the complex DFT takes N complex samples (a real part and an imaginary part, which is all zeros for a real signal) and returns N complex values, Re X[k] and Im X[k], numbered 0 to N − 1. For a real signal the values above N/2 mirror those below it: Re X is symmetric about N/2 and Im X is antisymmetric. N = 8 is shown. Adapted from Burnett-Thompson (2007).</desc>
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Real DFT and complex DFT, shown for N = 8 samples</text>
  <text x="30" y="64" font-size="16" font-weight="700" fill="#1a1a2e">Real DFT</text>
  <text x="30" y="92" font-size="14" font-weight="700" fill="#1F6FA8">x[n]: N real samples</text>
  <rect x="30" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="45" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="64" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="79" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="98" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="113" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="132" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="147" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="166" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="181" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <rect x="200" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="215" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">5</text>
  <rect x="234" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="249" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">6</text>
  <rect x="268" y="100" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="283" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">7</text>
  <text x="45" y="144" text-anchor="middle" font-size="12" fill="#666">n = 0</text>
  <text x="283" y="144" text-anchor="middle" font-size="12" fill="#666">N − 1</text>
  <text x="420" y="92" font-size="14" font-weight="700" fill="#C2610C">Re X[k]: cosine amplitudes</text>
  <rect x="420" y="100" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="435" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="454" y="100" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="469" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="488" y="100" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="503" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="522" y="100" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="537" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="556" y="100" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="571" y="119" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <text x="435" y="144" text-anchor="middle" font-size="12" fill="#666">k = 0</text>
  <text x="571" y="144" text-anchor="middle" font-size="12" fill="#666">N/2</text>
  <text x="596" y="119" font-size="12" fill="#666">N/2 + 1 values</text>
  <text x="420" y="170" font-size="14" font-weight="700" fill="#6B3FA0">Im X[k]: sine amplitudes</text>
  <rect x="420" y="178" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="435" y="197" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="454" y="178" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="469" y="197" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="488" y="178" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="503" y="197" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="522" y="178" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="537" y="197" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="556" y="178" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="571" y="197" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <text x="435" y="222" text-anchor="middle" font-size="12" fill="#666">k = 0</text>
  <text x="571" y="222" text-anchor="middle" font-size="12" fill="#666">N/2</text>
  <text x="596" y="197" font-size="12" fill="#666">N/2 + 1 values</text>
  <line x1="318" y1="126" x2="404" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="118" text-anchor="middle" font-size="12" fill="#444">forward</text>
  <line x1="404" y1="170" x2="318" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="188" text-anchor="middle" font-size="12" fill="#444">inverse</text>
  <text x="30" y="170" font-size="13" fill="#444">N numbers in,</text>
  <text x="30" y="188" font-size="13" fill="#444">N + 2 numbers out (Im X[0] and</text>
  <text x="30" y="206" font-size="13" fill="#444">Im X[N/2] are always 0)</text>
  <line x1="20" y1="240" x2="700" y2="240" stroke="#BBBBBB" stroke-dasharray="6 4"/>
  <text x="30" y="272" font-size="16" font-weight="700" fill="#1a1a2e">Complex DFT</text>
  <text x="30" y="300" font-size="14" font-weight="700" fill="#1F6FA8">Re x[n]</text>
  <rect x="30" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="45" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="64" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="79" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="98" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="113" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="132" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="147" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="166" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="181" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <rect x="200" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="215" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">5</text>
  <rect x="234" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="249" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">6</text>
  <rect x="268" y="308" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="283" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">7</text>
  <text x="30" y="364" font-size="14" font-weight="700" fill="#1F6FA8">Im x[n]: all 0 for a real signal</text>
  <rect x="30" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="45" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="64" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="79" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="98" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="113" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="132" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="147" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="166" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="181" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <rect x="200" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="215" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">5</text>
  <rect x="234" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="249" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">6</text>
  <rect x="268" y="372" width="30" height="28" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="283" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">7</text>
  <text x="45" y="416" text-anchor="middle" font-size="12" fill="#666">n = 0</text>
  <text x="283" y="416" text-anchor="middle" font-size="12" fill="#666">N − 1</text>
  <text x="420" y="300" font-size="14" font-weight="700" fill="#C2610C">Re X[k]: cosine part</text>
  <rect x="420" y="308" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="435" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="454" y="308" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="469" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="488" y="308" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="503" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="522" y="308" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="537" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="556" y="308" width="30" height="28" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="571" y="327" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <rect x="590" y="308" width="30" height="28" rx="5" fill="#ffffff" stroke="#E07B17" stroke-dasharray="4 3"/>
  <text x="605" y="327" text-anchor="middle" font-size="13" fill="#666">5</text>
  <rect x="624" y="308" width="30" height="28" rx="5" fill="#ffffff" stroke="#E07B17" stroke-dasharray="4 3"/>
  <text x="639" y="327" text-anchor="middle" font-size="13" fill="#666">6</text>
  <rect x="658" y="308" width="30" height="28" rx="5" fill="#ffffff" stroke="#E07B17" stroke-dasharray="4 3"/>
  <text x="673" y="327" text-anchor="middle" font-size="13" fill="#666">7</text>
  <text x="420" y="364" font-size="14" font-weight="700" fill="#6B3FA0">Im X[k]: sine part</text>
  <rect x="420" y="372" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="435" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">0</text>
  <rect x="454" y="372" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="469" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">1</text>
  <rect x="488" y="372" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="503" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">2</text>
  <rect x="522" y="372" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="537" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">3</text>
  <rect x="556" y="372" width="30" height="28" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="571" y="391" text-anchor="middle" font-size="13" fill="#1a1a2e">4</text>
  <rect x="590" y="372" width="30" height="28" rx="5" fill="#ffffff" stroke="#6B3FA0" stroke-dasharray="4 3"/>
  <text x="605" y="391" text-anchor="middle" font-size="13" fill="#666">5</text>
  <rect x="624" y="372" width="30" height="28" rx="5" fill="#ffffff" stroke="#6B3FA0" stroke-dasharray="4 3"/>
  <text x="639" y="391" text-anchor="middle" font-size="13" fill="#666">6</text>
  <rect x="658" y="372" width="30" height="28" rx="5" fill="#ffffff" stroke="#6B3FA0" stroke-dasharray="4 3"/>
  <text x="673" y="391" text-anchor="middle" font-size="13" fill="#666">7</text>
  <text x="435" y="416" text-anchor="middle" font-size="12" fill="#666">k = 0</text>
  <text x="571" y="416" text-anchor="middle" font-size="12" fill="#666">N/2</text>
  <text x="673" y="416" text-anchor="middle" font-size="12" fill="#666">N − 1</text>
  <line x1="318" y1="334" x2="404" y2="334" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="326" text-anchor="middle" font-size="12" fill="#444">forward</text>
  <line x1="404" y1="378" x2="318" y2="378" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="396" text-anchor="middle" font-size="12" fill="#444">inverse</text>
  <text x="30" y="440" font-size="13" fill="#444">N complex values in, N complex values out.</text>
  <text x="30" y="462" font-size="13" fill="#444">For a real signal, the dashed bins 5 to 7 mirror bins 3 to 1: Re X is symmetric about N/2,</text>
  <text x="30" y="482" font-size="13" fill="#444">Im X is antisymmetric. Bins 0 to N/2 hold the same numbers as the real DFT.</text>
</svg>
