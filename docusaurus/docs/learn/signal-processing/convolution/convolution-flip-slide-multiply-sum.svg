<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How one output sample of a convolution is computed</title>
  <desc id="d">The kernel h = [0, 1, 0.5] is flipped to [0.5, 1, 0], slid so its right end sits under k = 2 of the input x = [1, 2, 3], multiplied sample by sample to give 0.5, 2 and 0, and summed to give y[2] = 2.5.</desc>
  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Computing y[2] for x = [1, 2, 3] and h = [0, 1, 0.5]</text>

  <!-- Left: the kernel, then flipped -->
  <text x="40" y="70" font-size="14" font-weight="700" fill="#C2610C">Kernel h[k]</text>
  <g font-size="16" text-anchor="middle" fill="#1a1a2e">
    <rect x="40" y="80" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="95" y="80" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="150" y="80" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <text x="65" y="103">0</text><text x="120" y="103">1</text><text x="175" y="103">0.5</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="65" y="129">k = 0</text><text x="120" y="129">1</text><text x="175" y="129">2</text>
  </g>
  <line x1="120" y1="137" x2="120" y2="163" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="155" font-size="14" font-weight="700" fill="#1a1a2e">1. Flip</text>
  <text x="40" y="185" font-size="14" font-weight="700" fill="#C2610C">Flipped h[−k]</text>
  <g font-size="16" text-anchor="middle" fill="#1a1a2e">
    <rect x="40" y="195" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="95" y="195" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="150" y="195" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <text x="65" y="218">0.5</text><text x="120" y="218">1</text><text x="175" y="218">0</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="65" y="244">k = −2</text><text x="120" y="244">−1</text><text x="175" y="244">0</text>
  </g>
  <path d="M205,212 C240,212 245,167 290,167" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="276" font-size="14" font-weight="700" fill="#1a1a2e">2. Slide it right by n = 2</text>
  <text x="40" y="296" font-size="13" fill="#444">so its last sample sits under k = 2</text>

  <!-- Right: the input, the slid kernel, the products and the sum -->
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="414" y="66">k = 0</text><text x="474" y="66">1</text><text x="534" y="66">2</text><text x="594" y="66">3</text><text x="654" y="66">4</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="end">
    <text x="376" y="98" fill="#1F6FA8">Input x[k]</text>
    <text x="376" y="153" fill="#C2610C">h[2 − k]</text>
    <text x="376" y="208" fill="#6B3FA0">3. Multiply</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#1a1a2e">
    <rect x="389" y="76" width="50" height="34" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
    <rect x="449" y="76" width="50" height="34" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
    <rect x="509" y="76" width="50" height="34" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
    <rect x="569" y="76" width="50" height="34" rx="5" fill="#F3F3F3" stroke="#BBBBBB" stroke-dasharray="4 3"/>
    <rect x="629" y="76" width="50" height="34" rx="5" fill="#F3F3F3" stroke="#BBBBBB" stroke-dasharray="4 3"/>
    <text x="414" y="99">1</text><text x="474" y="99">2</text><text x="534" y="99">3</text>
    <text x="594" y="99" fill="#999">0</text><text x="654" y="99" fill="#999">0</text>

    <rect x="389" y="131" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="449" y="131" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <rect x="509" y="131" width="50" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
    <text x="414" y="154">0.5</text><text x="474" y="154">1</text><text x="534" y="154">0</text>

    <rect x="389" y="186" width="50" height="34" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
    <rect x="449" y="186" width="50" height="34" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
    <rect x="509" y="186" width="50" height="34" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
    <text x="414" y="209">0.5</text><text x="474" y="209">2</text><text x="534" y="209">0</text>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="414" y="236">1 × 0.5</text><text x="474" y="236">2 × 1</text><text x="534" y="236">3 × 0</text>
  </g>
  <rect x="389" y="252" width="290" height="44" rx="8" fill="#E3F4EA" stroke="#2E8B57"/>
  <text x="534" y="280" text-anchor="middle" font-size="17" fill="#1a1a2e"><tspan font-weight="700">4. Sum:</tspan> y[2] = 0.5 + 2 + 0 = <tspan font-weight="700" fill="#1E6B41">2.5</tspan></text>
  <text x="534" y="318" text-anchor="middle" font-size="13" fill="#444">Repeat for n = 0 … 4 to get y = [0, 1, 2.5, 4, 1.5]</text>
</svg>
