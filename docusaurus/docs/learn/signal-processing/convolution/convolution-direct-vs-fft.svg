<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two ways to convolve: the direct sum, or FFT, multiply and inverse FFT</title>
  <desc id="d">The input x[n] = [1, 2, 3] (N = 3 samples) and the kernel h[n] = [0, 1, 0.5] (M = 3 samples) reach the same output y[n] = [0, 1, 2.5, 4, 1.5], N + M − 1 = 5 samples, by two routes. Route 1, direct: the convolution sum y[n] = Σ x[k] h[n − k], about N × M multiplications. Route 2, fast convolution: zero-pad both to a length L of at least N + M − 1 (here 8), take the FFT of each, multiply the spectra bin by bin, Y[k] = X[k] · H[k], then take the inverse FFT and keep the first N + M − 1 samples, about L log₂ L operations. Adapted from Burnett-Thompson (2007).</desc>
  <rect x="0" y="0" width="720" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Convolution two ways: same answer, different cost</text>
  <rect x="20" y="56" width="190" height="52" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="30" y="78" font-size="14" font-weight="700" fill="#1F6FA8">x[n] = [1, 2, 3]</text>
  <text x="30" y="98" font-size="12" fill="#666">signal, N = 3 samples</text>
  <rect x="20" y="122" width="190" height="52" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="30" y="144" font-size="14" font-weight="700" fill="#C2610C">h[n] = [0, 1, 0.5]</text>
  <text x="30" y="164" font-size="12" fill="#666">kernel, M = 3 samples</text>
  <rect x="258" y="70" width="258" height="90" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="387" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Route 1: direct</text>
  <text x="387" y="118" text-anchor="middle" font-size="15" fill="#1a1a2e">y[n] = Σ<tspan font-size="10" baseline-shift="sub">k</tspan> x[k] · h[n − k]</text>
  <text x="387" y="146" text-anchor="middle" font-size="12" fill="#666">about N × M multiplications</text>
  <line x1="210" y1="82" x2="256" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="148" x2="256" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="80" width="165" height="70" rx="5" fill="#E3F4EA" stroke="#2E8B57"/>
  <text x="622" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1E6B41">y = [0, 1, 2.5, 4, 1.5]</text>
  <text x="622" y="122" text-anchor="middle" font-size="12" fill="#666">N + M − 1 = 5 samples</text>
  <line x1="516" y1="115" x2="538" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="84" y="214" font-size="14" font-weight="700" fill="#1a1a2e">Route 2: fast convolution with the FFT, about L log₂ L operations</text>
  <rect x="20" y="230" width="160" height="96" rx="5" fill="#F3F3F3" stroke="#BBBBBB" stroke-dasharray="4 3"/>
  <text x="100" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">1. Zero-pad</text>
  <text x="100" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">both to length L</text>
  <text x="100" y="297" text-anchor="middle" font-size="13" fill="#444">L ≥ N + M − 1</text>
  <text x="100" y="316" text-anchor="middle" font-size="13" fill="#444">(here L = 8)</text>
  <line x1="181" y1="278" x2="194" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="195" y="230" width="160" height="96" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="275" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">2. FFT each</text>
  <text x="275" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">X[k] and H[k]</text>
  <text x="275" y="297" text-anchor="middle" font-size="13" fill="#444">L bins each</text>
  <line x1="356" y1="278" x2="369" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="230" width="160" height="96" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="450" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">3. Multiply</text>
  <text x="450" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">Y[k] = X[k] · H[k]</text>
  <text x="450" y="297" text-anchor="middle" font-size="13" fill="#444">bin by bin</text>
  <line x1="531" y1="278" x2="544" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="545" y="230" width="160" height="96" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="625" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">4. Inverse FFT</text>
  <text x="625" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">y[n] = IFFT{Y[k]}</text>
  <text x="625" y="297" text-anchor="middle" font-size="13" fill="#444">keep the first</text>
  <text x="625" y="316" text-anchor="middle" font-size="13" fill="#444">N + M − 1 samples</text>
  <path d="M60,176 L60,226" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M622,228 L622,152" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="350" font-size="13" fill="#444">Both routes give the same y[n]. Skip the zero-padding and the FFT route wraps the tail back onto</text>
  <text x="20" y="370" font-size="13" fill="#444">the start (circular convolution).</text>
</svg>
