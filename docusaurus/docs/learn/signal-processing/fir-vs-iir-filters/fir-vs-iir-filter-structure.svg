<text x="560" y="518" text-anchor="middle" font-size="13" font-weight="600" fill="#e07a1f">feedback path: past outputs</text>
<text x="24" y="550" text-anchor="start" font-size="13" font-weight="400" fill="#555">Infinite memory: each output is fed back in, so an impulse dies away gradually but never ends exactly.</text>
