<text x="220" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#2a6fdb">b₀</text>
<line x1="235" y1="372" x2="366" y2="372" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="123" y1="428" x2="205" y2="428" stroke="#333" stroke-width="1.6"/>
