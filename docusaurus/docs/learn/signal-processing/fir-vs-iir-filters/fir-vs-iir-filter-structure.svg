<line x1="623" y1="215" x2="700" y2="215" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="706" y="220" text-anchor="start" font-size="15" font-weight="600" fill="#222">y[n]</text>
<text x="24" y="262" text-anchor="start" font-size="13" font-weight="400" fill="#555">Finite memory: an impulse at x[n] has left the delay line after 4 samples, so the output returns to exactly 0.</text>
<line x1="20" x2="740" y1="282" y2="282" stroke="#d5d9e0"/>
<text x="24" y="312" text-anchor="start" font-size="17" font-weight="700" fill="#8a3d00">IIR: feed-forward plus feedback (one biquad)</text>
<text x="24" y="332" text-anchor="start" font-size="14" font-weight="400" fill="#444">y[n] = b₀x[n] + b₁x[n−1] + b₂x[n−2] − a₁y[n−1] − a₂y[n−2]</text>
