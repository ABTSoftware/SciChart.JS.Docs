<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 565" width="760" height="565" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">FIR and IIR filter structures</title>
<desc id="d">Top: an FIR filter as a tapped delay line. The input passes through a chain of one-sample delays, each delayed copy is multiplied by a coefficient b0 to b3, and the products are added to give the output, with no path back from the output. Bottom: a second-order IIR section (biquad). The input side is the same, but the output is also delayed, multiplied by minus a1 and minus a2, and fed back into the sum, so the output depends on its own past values.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="760" height="565" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="17" font-weight="700" fill="#1b3a6b">FIR: feed-forward only</text>
<text x="24" y="52" text-anchor="start" font-size="14" font-weight="400" fill="#444">y[n] = b₀x[n] + b₁x[n−1] + b₂x[n−2] + b₃x[n−3]</text>
<text x="30" y="105" text-anchor="start" font-size="15" font-weight="600" fill="#222">x[n]</text>
