<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Why spectral leakage happens</title>
<desc id="d">Top row: a record holding exactly 4 cycles of a sine wave. The DFT treats the record as if it repeated, and the copies join smoothly, so the spectrum is a single line at bin 4 with nothing in the other bins. Bottom row: a record holding 4.5 cycles. Where the copies join there is a jump, and the spectrum spreads into every bin: about -4 dB at bins 4 and 5, and is still about -27 dB ten bins away. Multiplying the record by a Hann window removes the jump: its spectrum, drawn as a dashed line, is wider at the peak but falls below -60 dB about six bins from it.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="24" y="30" font-size="18" font-weight="700" fill="#111827">The DFT sees your record repeated end to end</text>
<text x="24" y="84" font-size="15" font-weight="600" fill="#111827">Exactly 4 cycles in the record: the copies join smoothly</text>
