<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Building a square wave from its odd harmonics</title>
<desc>Left: the first three non-zero terms of a square wave's Fourier series, sine waves at 1, 3 and 5 times the fundamental with amplitudes 4/π ≈ 1.27, 4/(3π) ≈ 0.42 and 4/(5π) ≈ 0.25. Right: their sum, the partial sum with N = 5, drawn over the square wave it approximates, with the coefficients b_n = 4/(nπ) for odd n and 0 for even n.</desc>
<rect width="900" height="420" fill="#ffffff"/>
