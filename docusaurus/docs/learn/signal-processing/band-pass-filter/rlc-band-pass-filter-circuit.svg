<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Series RLC band-pass filter circuit</title>
<desc id="d">An inductor L and a capacitor C in series between the input and the output, and a resistor R from the output to ground. The centre frequency is 1 divided by 2 pi times the square root of L C, the bandwidth is R divided by 2 pi L, and Q is the square root of L over C, divided by R. With L of 10 millihenries, C of 100 nanofarads and R of 100 ohms, the centre frequency is about 5.03 kilohertz, the bandwidth about 1.59 kilohertz and Q about 3.16.</desc>
<rect width="720" height="380" fill="#ffffff"/>
<g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- input terminals -->
  <circle cx="60" cy="80" r="6" fill="#fff"/>
  <circle cx="60" cy="220" r="6" fill="#fff"/>
  <!-- wire to inductor -->
  <line x1="66" y1="80" x2="130" y2="80"/>
  <!-- inductor: four loops -->
  <path d="M130,80 a12,14 0 0 1 24,0 a12,14 0 0 1 24,0 a12,14 0 0 1 24,0 a12,14 0 0 1 24,0"/>
  <!-- wire to capacitor -->
  <line x1="226" y1="80" x2="292" y2="80"/>
  <!-- series capacitor (vertical plates) -->
  <line x1="292" y1="52" x2="292" y2="108" stroke-width="4"/>
  <line x1="308" y1="52" x2="308" y2="108" stroke-width="4"/>
  <!-- wire to output node and output -->
  <line x1="308" y1="80" x2="574" y2="80"/>
  <circle cx="420" cy="80" r="5" fill="#222"/>
  <circle cx="580" cy="80" r="6" fill="#fff"/>
  <!-- resistor to ground (vertical zigzag) -->
  <line x1="420" y1="80" x2="420" y2="112"/>
  <polyline points="420,112 402,120 438,134 402,148 438,162 402,176 420,184"/>
  <line x1="420" y1="184" x2="420" y2="220"/>
  <!-- ground rail -->
  <line x1="66" y1="220" x2="574" y2="220"/>
  <circle cx="420" cy="220" r="5" fill="#222"/>
  <circle cx="580" cy="220" r="6" fill="#fff"/>
</g>
<g stroke="#222" stroke-width="2.5">
  <line x1="420" y1="220" x2="420" y2="240"/>
  <line x1="402" y1="240" x2="438" y2="240"/>
  <line x1="408" y1="247" x2="432" y2="247"/>
  <line x1="414" y1="254" x2="426" y2="254"/>
</g>
<g font-size="17" fill="#222">
  <text x="178" y="48" text-anchor="middle" font-weight="700">L</text>
  <text x="300" y="40" text-anchor="middle" font-weight="700">C</text>
  <text x="452" y="154" font-weight="700">R</text>
  <text x="52" y="86" text-anchor="end">V<tspan font-size="13" dy="4">in</tspan></text>
  <text x="596" y="86">V<tspan font-size="13" dy="4">out</tspan></text>
  <text x="52" y="226" text-anchor="end">0 V</text>
  <text x="596" y="226">0 V</text>
</g>
<!-- what happens at each frequency -->
<g font-size="14">
  <text x="96" y="140" fill="#d1495b">Low f: C blocks</text>
  <text x="96" y="160" fill="#d1495b">High f: L blocks</text>
  <text x="96" y="186" fill="#2a6fdb">At f<tspan font-size="11" dy="3">0</tspan><tspan dy="-3">, L and C cancel:</tspan></text>
  <text x="96" y="204" fill="#2a6fdb">all of V<tspan font-size="11" dy="3">in</tspan><tspan dy="-3"> reaches R</tspan></text>
</g>
<!-- formulas -->
<rect x="60" y="276" width="600" height="88" rx="8" fill="#f2f5fa" stroke="#c9d3e3"/>
<text x="360" y="302" text-anchor="middle" font-size="17" fill="#222" xml:space="preserve">f<tspan font-size="12" dy="4">0</tspan><tspan dy="-4"> = 1 / (2π√(LC))   ·   BW = R / (2πL)   ·   Q = √(L/C) / R</tspan></text>
<text x="360" y="326" text-anchor="middle" font-size="14" fill="#444">Example: L = 10 mH, C = 100 nF, R = 100 Ω → f<tspan font-size="11" dy="3">0</tspan><tspan dy="-3"> ≈ 5.03 kHz, BW ≈ 1.59 kHz, Q ≈ 3.16</tspan></text>
<text x="360" y="348" text-anchor="middle" font-size="14" fill="#444">−3 dB edges: f<tspan font-size="11" dy="3">L</tspan><tspan dy="-3"> ≈ 4.30 kHz and f</tspan><tspan font-size="11" dy="3">H</tspan><tspan dy="-3"> ≈ 5.89 kHz</tspan></text>
</svg>
