<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two ways to correlate: the direct sum, or FFT, conjugate-multiply and inverse FFT</title>
  <desc id="d">The mean-removed signal x[n] = [−1, 2, −1, −1, 2, −1, −1, 2, −1] (N = 9 samples) is correlated with itself (or with a second signal y[n] for cross-correlation) by two routes that give the same lag sums: 18, −10, −5, 12, −7, −2, 6, −4, 1 at lags 0 to 8. Route 1, direct: c[k] = Σ x[n] · x[n + k], about N² multiplications. Route 2, fast correlation: zero-pad to a length L of at least 2N − 1 (here 32), take the FFT X[k], multiply each bin by its complex conjugate, X*[k] · X[k] = |X[k]|² (the highlighted step that differs from convolution), then take the inverse FFT and keep lags 0 to N − 1, about L log₂ L operations. Adapted from Burnett-Thompson (2007).</desc>
  <rect x="0" y="0" width="720" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Correlation two ways: same answer, different cost</text>
  <rect x="20" y="56" width="190" height="52" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="30" y="78" font-size="14" font-weight="700" fill="#1F6FA8">x[n], N = 9 samples</text>
  <text x="30" y="98" font-size="12" fill="#666">mean removed first</text>
  <rect x="20" y="122" width="190" height="52" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="30" y="144" font-size="14" font-weight="700" fill="#1F6FA8">the same x[n]</text>
  <text x="30" y="164" font-size="12" fill="#666">or y[n], for cross-correlation</text>
  <rect x="258" y="70" width="258" height="90" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="387" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#6B3FA0">Route 1: direct</text>
  <text x="387" y="118" text-anchor="middle" font-size="15" fill="#1a1a2e">c[k] = Σ<tspan font-size="10" baseline-shift="sub">n</tspan> x[n] · x[n + k]</text>
  <text x="387" y="146" text-anchor="middle" font-size="12" fill="#666">about N² multiplications</text>
  <line x1="210" y1="82" x2="256" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="148" x2="256" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="80" width="165" height="70" rx="5" fill="#E3F4EA" stroke="#2E8B57"/>
  <text x="622" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1E6B41">c = [18, −10, −5, 12, …]</text>
  <text x="622" y="122" text-anchor="middle" font-size="12" fill="#666">lag sums for k = 0 … N − 1</text>
  <text x="622" y="139" text-anchor="middle" font-size="12" fill="#666">÷ 18 gives r[k]</text>
  <line x1="516" y1="115" x2="538" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="84" y="214" font-size="14" font-weight="700" fill="#1a1a2e">Route 2: fast correlation with the FFT, about L log₂ L operations</text>
  <rect x="20" y="230" width="160" height="96" rx="5" fill="#F3F3F3" stroke="#BBBBBB" stroke-dasharray="4 3"/>
  <text x="100" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">1. Zero-pad</text>
  <text x="100" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">to length L</text>
  <text x="100" y="297" text-anchor="middle" font-size="13" fill="#444">L ≥ 2N − 1</text>
  <text x="100" y="316" text-anchor="middle" font-size="13" fill="#444">(here L = 32)</text>
  <line x1="181" y1="278" x2="194" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="195" y="230" width="160" height="96" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="275" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">2. FFT</text>
  <text x="275" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">X[k]</text>
  <text x="275" y="297" text-anchor="middle" font-size="13" fill="#444">L bins</text>
  <line x1="356" y1="278" x2="369" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="230" width="160" height="96" rx="5" fill="#FDEBD7" stroke="#E07B17" stroke-width="2.5"/>
  <text x="450" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C2610C">3. Conjugate, multiply</text>
  <text x="450" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">X*[k] · X[k] = |X[k]|²</text>
  <text x="450" y="297" text-anchor="middle" font-size="13" fill="#444">X* = complex conjugate</text>
  <text x="450" y="316" text-anchor="middle" font-size="13" fill="#444">(X*[k] · Y[k] for cross)</text>
  <line x1="531" y1="278" x2="544" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="545" y="230" width="160" height="96" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="625" y="254" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a2e">4. Inverse FFT</text>
  <text x="625" y="278" text-anchor="middle" font-size="13" fill="#1a1a2e">c[k] = IFFT{|X[k]|²}</text>
  <text x="625" y="297" text-anchor="middle" font-size="13" fill="#444">keep lags</text>
  <text x="625" y="316" text-anchor="middle" font-size="13" fill="#444">0 … N − 1</text>
  <path d="M60,176 L60,226" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M622,228 L622,152" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="350" font-size="13" fill="#444">The only change from convolution is step 3: conjugating one spectrum undoes the flip, so the copy</text>
  <text x="20" y="370" font-size="13" fill="#444">slides without being reversed. Without the zero-padding, the end of the signal wraps onto its start.</text>
</svg>
