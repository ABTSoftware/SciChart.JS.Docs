<text x="326" y="462" text-anchor="middle" fill="#5a6478" font-size="12">2</text>
<line x1="384" y1="380" x2="384" y2="330.0" stroke="#3a9a5b" stroke-width="3"/>
<circle cx="384" cy="330.0" r="5" fill="#3a9a5b"/>
<text x="384" y="320.0" text-anchor="middle" fill="#3a9a5b" font-size="12">0.67</text>
<text x="384" y="462" text-anchor="middle" fill="#5a6478" font-size="12">3</text>
<line x1="442" y1="380" x2="442" y2="409.2" stroke="#1b2a47" stroke-width="3"/>
<circle cx="442" cy="409.2" r="5" fill="#1b2a47"/>
<text x="442" y="427.2" text-anchor="middle" fill="#1b2a47" font-size="12">-0.39</text>
<text x="442" y="462" text-anchor="middle" fill="#5a6478" font-size="12">4</text>
<line x1="500" y1="380" x2="500" y2="388.3" stroke="#1b2a47" stroke-width="3"/>
<circle cx="500" cy="388.3" r="5" fill="#1b2a47"/>
<text x="500" y="406.3" text-anchor="middle" fill="#1b2a47" font-size="12">-0.11</text>
<text x="500" y="462" text-anchor="middle" fill="#5a6478" font-size="12">5</text>
<line x1="558" y1="380" x2="558" y2="355.0" stroke="#3a9a5b" stroke-width="3"/>
<circle cx="558" cy="355.0" r="5" fill="#3a9a5b"/>
<text x="558" y="345.0" text-anchor="middle" fill="#3a9a5b" font-size="12">0.33</text>
<text x="558" y="462" text-anchor="middle" fill="#5a6478" font-size="12">6</text>
<line x1="616" y1="380" x2="616" y2="396.6" stroke="#1b2a47" stroke-width="3"/>
<circle cx="616" cy="396.6" r="5" fill="#1b2a47"/>
<text x="616" y="414.6" text-anchor="middle" fill="#1b2a47" font-size="12">-0.22</text>
<text x="616" y="462" text-anchor="middle" fill="#5a6478" font-size="12">7</text>
<line x1="674" y1="380" x2="674" y2="375.8" stroke="#1b2a47" stroke-width="3"/>
<circle cx="674" cy="375.8" r="5" fill="#1b2a47"/>
