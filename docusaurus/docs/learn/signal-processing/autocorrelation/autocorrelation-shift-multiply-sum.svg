<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14">
<title>Autocorrelation step by step: a signal, a copy shifted by 3 samples, and the autocorrelation at every lag</title>
<desc>Top: the signal x = 0, 3, 0, 0, 3, 0, 0, 3, 0 drawn as stems. Middle: the same signal shifted left by 3 samples, so its spikes sit under the original spikes. Bottom: the normalised autocorrelation r[k] for lags 0 to 8, which is 1 at lag 0, negative at lags 1 and 2, and peaks again at lag 3 (0.67) and lag 6 (0.33), showing a period of 3 samples.</desc>
<rect width="720" height="490" fill="#ffffff"/>
<line x1="190" y1="100" x2="694" y2="100" stroke="#8a94a6" stroke-width="1"/>
<text x="20" y="72" font-weight="700" fill="#1b2a47">Signal x[n]</text>
<text x="20" y="90" fill="#5a6478" font-size="12">n = 0 … 8</text>
<line x1="210" y1="100" x2="210" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="210" cy="100" r="5" fill="#2a7fb8"/>
<text x="210" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="268" y1="100" x2="268" y2="46" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="268" cy="46" r="5" fill="#2a7fb8"/>
<text x="268" y="118" text-anchor="middle" fill="#5a6478" font-size="12">3</text>
<line x1="326" y1="100" x2="326" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="326" cy="100" r="5" fill="#2a7fb8"/>
<text x="326" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="384" y1="100" x2="384" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="384" cy="100" r="5" fill="#2a7fb8"/>
<text x="384" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="442" y1="100" x2="442" y2="46" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="442" cy="46" r="5" fill="#2a7fb8"/>
<text x="442" y="118" text-anchor="middle" fill="#5a6478" font-size="12">3</text>
<line x1="500" y1="100" x2="500" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="500" cy="100" r="5" fill="#2a7fb8"/>
<text x="500" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="558" y1="100" x2="558" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="558" cy="100" r="5" fill="#2a7fb8"/>
<text x="558" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="616" y1="100" x2="616" y2="46" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="616" cy="46" r="5" fill="#2a7fb8"/>
<text x="616" y="118" text-anchor="middle" fill="#5a6478" font-size="12">3</text>
<line x1="674" y1="100" x2="674" y2="100" stroke="#2a7fb8" stroke-width="3"/>
<circle cx="674" cy="100" r="5" fill="#2a7fb8"/>
<text x="674" y="118" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="190" y1="215" x2="694" y2="215" stroke="#8a94a6" stroke-width="1"/>
<text x="20" y="187" font-weight="700" fill="#1b2a47">Copy x[n + 3]</text>
<text x="20" y="205" fill="#5a6478" font-size="12">shifted by lag k = 3</text>
<line x1="210" y1="215" x2="210" y2="215" stroke="#d9711c" stroke-width="3"/>
<circle cx="210" cy="215" r="5" fill="#d9711c"/>
<text x="210" y="233" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="268" y1="215" x2="268" y2="161" stroke="#d9711c" stroke-width="3"/>
<circle cx="268" cy="161" r="5" fill="#d9711c"/>
<text x="268" y="233" text-anchor="middle" fill="#5a6478" font-size="12">3</text>
<line x1="326" y1="215" x2="326" y2="215" stroke="#d9711c" stroke-width="3"/>
<circle cx="326" cy="215" r="5" fill="#d9711c"/>
<text x="326" y="233" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="384" y1="215" x2="384" y2="215" stroke="#d9711c" stroke-width="3"/>
<circle cx="384" cy="215" r="5" fill="#d9711c"/>
<text x="384" y="233" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="442" y1="215" x2="442" y2="161" stroke="#d9711c" stroke-width="3"/>
