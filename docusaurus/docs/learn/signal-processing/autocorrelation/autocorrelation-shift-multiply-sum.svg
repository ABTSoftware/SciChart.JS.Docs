<line x1="500" y1="215" x2="500" y2="215" stroke="#d9711c" stroke-width="3"/>
<circle cx="500" cy="215" r="5" fill="#d9711c"/>
<text x="500" y="233" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<text x="558" y="233" text-anchor="middle" fill="#a0a8b8" font-size="12">–</text>
<text x="616" y="233" text-anchor="middle" fill="#a0a8b8" font-size="12">–</text>
<text x="674" y="233" text-anchor="middle" fill="#a0a8b8" font-size="12">–</text>
<line x1="268" y1="126" x2="268" y2="155" stroke="#3a9a5b" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="442" y1="126" x2="442" y2="155" stroke="#3a9a5b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="510" y="175" fill="#3a9a5b" font-size="13">spikes line up: a strong match</text>
<line x1="190" y1="380" x2="694" y2="380" stroke="#8a94a6" stroke-width="1"/>
<text x="20" y="352" font-weight="700" fill="#1b2a47">Autocorrelation r[k]</text>
<text x="20" y="370" fill="#5a6478" font-size="12">normalised, r[0] = 1</text>
<line x1="210" y1="380" x2="210" y2="305.0" stroke="#1b2a47" stroke-width="3"/>
<circle cx="210" cy="305.0" r="5" fill="#1b2a47"/>
<text x="210" y="295.0" text-anchor="middle" fill="#1b2a47" font-size="12">1.00</text>
<text x="210" y="462" text-anchor="middle" fill="#5a6478" font-size="12">0</text>
<line x1="268" y1="380" x2="268" y2="421.7" stroke="#1b2a47" stroke-width="3"/>
<circle cx="268" cy="421.7" r="5" fill="#1b2a47"/>
<text x="268" y="439.7" text-anchor="middle" fill="#1b2a47" font-size="12">-0.56</text>
