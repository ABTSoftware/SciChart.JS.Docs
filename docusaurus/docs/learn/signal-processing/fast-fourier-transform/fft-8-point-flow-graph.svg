<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">An 8-point radix-2 FFT, worked through for one cycle of a sine wave</title>
  <desc id="d">An 8-point decimation-in-time FFT flow graph with three stages of butterflies. The input is x[n] = sin(2πn/8), fed in bit-reversed order: x0 = 0, x4 = 0, x2 = 1, x6 = −1, x1 = √2/2, x5 = −√2/2, x3 = √2/2, x7 = −√2/2. After stage 1 (pairs 1 apart, twiddle W0) the values are 0, 0, 0, 2, 0, √2, 0, √2. After stage 2 (pairs 2 apart, twiddles W0 and W2 = −i) they are 0, −2i, 0, 2i, 0, √2 − √2i, 0, √2 + √2i. After stage 3 (pairs 4 apart, twiddles W0 to W3) the outputs in natural order are X0 = 0, X1 = −4i, X2 to X6 = 0 and X7 = 4i. Adapted from Burnett-Thompson (2007).</desc>
  <rect x="0" y="0" width="760" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
