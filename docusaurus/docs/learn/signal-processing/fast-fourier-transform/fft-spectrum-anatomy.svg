<line y1="70" y2="380" x1="543.7" x2="543.7" stroke="#f1f5f9"/><text x="543.7" y="402" text-anchor="middle" font-size="14" fill="#374151">200</text>
<line y1="70" y2="380" x1="636.9" x2="636.9" stroke="#f1f5f9"/><text x="636.9" y="402" text-anchor="middle" font-size="14" fill="#374151">240</text>
