<line x1="78" x2="730" y1="202.9" y2="202.9" stroke="#e5e7eb"/><text x="70" y="207.9" text-anchor="end" font-size="14" fill="#374151">-40</text>
<line x1="78" x2="730" y1="261.9" y2="261.9" stroke="#e5e7eb"/><text x="70" y="266.9" text-anchor="end" font-size="14" fill="#374151">-60</text>
<line x1="78" x2="730" y1="321.0" y2="321.0" stroke="#e5e7eb"/><text x="70" y="326.0" text-anchor="end" font-size="14" fill="#374151">-80</text>
