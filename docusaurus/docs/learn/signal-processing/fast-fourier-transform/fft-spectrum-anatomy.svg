<line y1="70" y2="380" x1="78.0" x2="78.0" stroke="#f1f5f9"/><text x="78.0" y="402" text-anchor="middle" font-size="14" fill="#374151">0</text>
<line y1="70" y2="380" x1="171.1" x2="171.1" stroke="#f1f5f9"/><text x="171.1" y="402" text-anchor="middle" font-size="14" fill="#374151">40</text>
<line y1="70" y2="380" x1="264.3" x2="264.3" stroke="#f1f5f9"/><text x="264.3" y="402" text-anchor="middle" font-size="14" fill="#374151">80</text>
<line y1="70" y2="380" x1="357.4" x2="357.4" stroke="#f1f5f9"/><text x="357.4" y="402" text-anchor="middle" font-size="14" fill="#374151">120</text>
