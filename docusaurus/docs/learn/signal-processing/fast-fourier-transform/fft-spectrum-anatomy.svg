<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How to read an FFT magnitude spectrum</title>
<desc id="d">An FFT spectrum in decibels of a test signal sampled at 1,024 Hz with 1,024 samples and a Hann window. A tall peak at 50 Hz reaches 0 dB, a second peak at 120.5 Hz reaches about -7 dB, a small peak at 160 Hz reaches about -49 dB, and the rest is a noise floor near -70 dB.</desc>
