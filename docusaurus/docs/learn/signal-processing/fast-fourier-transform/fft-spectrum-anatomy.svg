<text x="404" y="432" text-anchor="middle" font-size="15" fill="#111827">Frequency (Hz): bin k is at k × fs / N = k × 1 Hz</text>
<text transform="translate(22 225) rotate(-90)" text-anchor="middle" font-size="15" fill="#111827">Amplitude (dB re 1)</text>
<g font-size="14" fill="#111827">
  <line x1="194.4" y1="84.8" x2="234.4" y2="88.8" stroke="#111827"/>
  <text x="238.4" y="93.8">1. Strongest tone: 50 Hz at 0 dB (amplitude 1)</text>
  <line x1="359.8" y1="106.7" x2="389.8" y2="132.7" stroke="#111827"/>
  <text x="393.8" y="137.7">2. 120.5 Hz tone, amplitude 0.5 (-6 dB),</text>
