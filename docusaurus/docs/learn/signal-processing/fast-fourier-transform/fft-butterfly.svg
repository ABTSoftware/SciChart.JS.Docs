<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One radix-2 FFT butterfly and its twiddle factor</title>
  <desc id="d">Two inputs from the previous stage, a and b. The lower input b is multiplied by the twiddle factor w. Each output gets both: the upper output is a + w·b and the lower output is a − w·b. On the right, the twiddle factor is W_N^R = e^(−i2πR/N) = cos(2πR/N) − i sin(2πR/N), and for N = 8 the four values used are W⁰ = 1, W¹ = (1 − i)/√2, W² = −i and W³ = −(1 + i)/√2. Adapted from Burnett-Thompson (2007).</desc>
  <rect x="0" y="0" width="720" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">One butterfly: two values in, two values out</text>
  <text x="40" y="64" font-size="12" fill="#666">from previous stage</text>
  <text x="290" y="64" font-size="12" fill="#666">to next stage</text>
  <rect x="30" y="83" width="50" height="34" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="55" y="106" text-anchor="middle" font-size="17" font-style="italic" fill="#1a1a2e">a</text>
  <rect x="30" y="183" width="50" height="34" rx="5" fill="#DCEEFB" stroke="#2B8CBE"/>
  <text x="55" y="206" text-anchor="middle" font-size="17" font-style="italic" fill="#1a1a2e">b</text>
  <line x1="80" y1="100" x2="160" y2="100" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="200" x2="104" y2="200" stroke="#555" stroke-width="1.5"/>
  <rect x="104" y="183" width="56" height="34" rx="5" fill="#FDEBD7" stroke="#E07B17"/>
  <text x="132" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#C2610C">× w</text>
  <text x="132" y="236" text-anchor="middle" font-size="12" fill="#C2610C">twiddle factor</text>
  <line x1="160" y1="100" x2="262" y2="100" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="100" x2="262" y2="200" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="200" x2="262" y2="100" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="200" x2="262" y2="200" stroke="#555" stroke-width="1.5"/>
  <circle cx="276" cy="100" r="14" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="276" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">+</text>
  <circle cx="276" cy="200" r="14" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="276" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">+</text>
  <text x="238" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#B42318">−</text>
  <line x1="290" y1="100" x2="320" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="200" x2="320" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="322" y="83" width="90" height="34" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="367" y="106" text-anchor="middle" font-size="15" fill="#1a1a2e">a + w·b</text>
  <rect x="322" y="183" width="90" height="34" rx="5" fill="#EEE5F8" stroke="#6B3FA0"/>
  <text x="367" y="206" text-anchor="middle" font-size="15" fill="#1a1a2e">a − w·b</text>
  <text x="30" y="254" font-size="13" fill="#444">−: the value on the lower path is subtracted.</text>
  <text x="30" y="274" font-size="13" fill="#444">1 complex multiplication and 2 additions, 2 outputs.</text>
  <line x1="436" y1="50" x2="436" y2="270" stroke="#e5e7eb"/>
  <text x="450" y="70" font-size="15" font-weight="700" fill="#C2610C">The twiddle factor</text>
  <text x="450" y="98" font-size="15" fill="#1a1a2e">w = W<tspan font-size="10" baseline-shift="sub">N</tspan><tspan font-size="10" dx="-7" baseline-shift="super">R</tspan> = e<tspan font-size="10" baseline-shift="super">−i2πR/N</tspan></text>
  <text x="450" y="122" font-size="15" fill="#1a1a2e">= cos(2πR/N) − i sin(2πR/N)</text>
  <text x="450" y="146" font-size="12" fill="#666">a point on the unit circle, R/N of a turn</text>
  <text x="450" y="176" font-size="14" font-weight="700" fill="#1a1a2e">For N = 8:</text>
  <text x="450" y="200" font-size="13" fill="#1a1a2e">W<tspan font-size="10" baseline-shift="super">0</tspan> = 1</text>
  <text x="450" y="222" font-size="13" fill="#1a1a2e">W<tspan font-size="10" baseline-shift="super">1</tspan> = (1 − i)/√2 ≈ 0.707 − 0.707i</text>
  <text x="450" y="244" font-size="13" fill="#1a1a2e">W<tspan font-size="10" baseline-shift="super">2</tspan> = −i</text>
  <text x="450" y="266" font-size="13" fill="#1a1a2e">W<tspan font-size="10" baseline-shift="super">3</tspan> = −(1 + i)/√2 ≈ −0.707 − 0.707i</text>
</svg>
