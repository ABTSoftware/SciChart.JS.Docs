<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How aliasing folds frequencies: apparent frequency against true frequency at a 1 kHz sample rate</title>
  <desc>A zigzag line shows the frequency you measure for each true input frequency when sampling at 1,000 samples per second. It rises from 0 to 500 Hz (the Nyquist frequency), folds back down to 0 Hz at 1 kHz, and repeats. Tones at 900 Hz, 1,100 Hz and 2,100 Hz all land on the same 100 Hz, while a 300 Hz tone is measured correctly.</desc>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- the band you can measure: 0 to fs/2 -->
  <rect x="80" y="70" width="128" height="230" fill="#e6f5fa"/>
  <text x="144" y="62" text-anchor="middle" font-size="13" fill="#1a6f8a" font-weight="600">measured correctly</text>

  <!-- gridlines at fs/2 multiples -->
  <g stroke="#c9d3e0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="208" y1="70" x2="208" y2="300"/>
    <line x1="336" y1="70" x2="336" y2="300"/>
    <line x1="464" y1="70" x2="464" y2="300"/>
    <line x1="592" y1="70" x2="592" y2="300"/>
    <line x1="720" y1="70" x2="720" y2="300"/>
  </g>

  <!-- axes -->
  <g stroke="#33415c" stroke-width="1.5" fill="none">
    <line x1="80" y1="300" x2="730" y2="300"/>
    <line x1="80" y1="300" x2="80" y2="66"/>
  </g>
  <g font-size="13" fill="#33415c" text-anchor="middle">
    <text x="80" y="320">0</text>
    <text x="208" y="320">500</text>
    <text x="336" y="320">1,000</text>
    <text x="464" y="320">1,500</text>
    <text x="592" y="320">2,000</text>
    <text x="720" y="320">2,500</text>
    <text x="400" y="346" font-size="14" font-weight="600">True frequency of the input (Hz)</text>
  </g>
  <g font-size="13" fill="#33415c" text-anchor="end">
    <text x="72" y="304">0</text>
    <text x="72" y="216">200</text>
    <text x="72" y="172" fill="#1a8a5a">300</text>
    <text x="72" y="84">500</text>
  </g>
  <text transform="translate(26 185) rotate(-90)" text-anchor="middle" font-size="14" font-weight="600" fill="#33415c">Frequency you measure (Hz)</text>

  <!-- key frequencies -->
  <g font-size="12" fill="#5a6782" text-anchor="middle">
    <text x="208" y="364">fs/2 (Nyquist)</text>
    <text x="336" y="364">fs</text>
    <text x="464" y="364">1.5 fs</text>
    <text x="592" y="364">2 fs</text>
  </g>

  <!-- the folding zigzag -->
  <polyline points="80,300 208,80 336,300 464,80 592,300 720,80" fill="none" stroke="#2b7bb9" stroke-width="3" stroke-linejoin="round"/>
  <g font-size="12" fill="#2b7bb9" font-style="italic">
    <text x="262" y="135">folds back</text>
    <text x="262" y="150">(mirrored)</text>
  </g>

  <!-- every tone on this line reads as 100 Hz -->
  <line x1="80" y1="256" x2="618" y2="256" stroke="#e8710a" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#e8710a" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="310" y1="256" x2="310" y2="300"/>
    <line x1="362" y1="256" x2="362" y2="300"/>
    <line x1="618" y1="256" x2="618" y2="300"/>
  </g>
  <g fill="#e8710a">
    <circle cx="310" cy="256" r="6"/>
    <circle cx="362" cy="256" r="6"/>
    <circle cx="618" cy="256" r="6"/>
    <circle cx="80" cy="256" r="5"/>
  </g>
  <text x="72" y="260" font-size="13" fill="#b35400" font-weight="600" text-anchor="end">100</text>
  <g font-size="12" fill="#b35400" text-anchor="middle">
    <text x="300" y="290">900</text>
    <text x="374" y="290">1,100</text>
    <text x="642" y="290">2,100</text>
  </g>

  <!-- a tone below the Nyquist frequency -->
  <circle cx="157" cy="168" r="6" fill="#1a8a5a"/>
  <line x1="80" y1="168" x2="157" y2="168" stroke="#1a8a5a" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="170" y="173" font-size="12" fill="#1a8a5a" font-weight="600">300 Hz</text>

  <!-- explanation -->
  <g font-size="13" fill="#5c3300" text-anchor="end">
    <text x="740" y="22" font-weight="600">Sample rate fs = 1,000 Hz</text>
    <text x="740" y="40">900, 1,100 and 2,100 Hz tones give the same samples as a 100 Hz tone</text>
  </g>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#33415c">Apparent frequency = |f − k·fs|, with k the whole number nearest to f / fs</text>
</svg>
