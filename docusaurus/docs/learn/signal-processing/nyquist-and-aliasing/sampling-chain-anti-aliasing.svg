<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Where the anti-aliasing filter goes: before the analogue-to-digital converter</title>
  <desc>A signal chain from left to right. An analogue signal with high-frequency noise goes into an anti-aliasing low-pass filter that removes everything above half the sample rate. The analogue-to-digital converter then takes a sample every 1/fs seconds, giving digital samples that can be analysed, plotted or played back through a digital-to-analogue converter and a reconstruction filter.</desc>
  <rect width="760" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33415c"/>
    </marker>
  </defs>

  <!-- 1. analogue input -->
  <rect x="14" y="60" width="150" height="110" rx="8" fill="#f2f6fb" stroke="#9aa9c2"/>
  <text x="89" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#33415c">Analogue signal</text>
  <path d="M28,128 q8,-26 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#2b7bb9" stroke-width="2"/>
  <path d="M28,128 l3,-5 l3,9 l3,-8 l3,6 l3,-7 l3,8 l3,-6 l3,5 l3,-8 l3,7 l3,-5 l3,8 l3,-9 l3,6 l3,-5 l3,7 l3,-6 l3,8 l3,-7 l3,5 l3,-8 l3,6 l3,-5 l3,7 l3,-6 l3,5 l3,-7 l3,6 l3,-5 l3,8 l3,-6 l3,5 l3,-4 l3,4 l3,-3 l3,3 l3,-2 l3,2 l3,-2" fill="none" stroke="#c0392b" stroke-width="1" opacity="0.7"/>
  <text x="89" y="160" text-anchor="middle" font-size="12" fill="#5a6782">wanted + fast noise</text>

  <line x1="166" y1="115" x2="196" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. anti-aliasing filter -->
  <rect x="198" y="48" width="170" height="134" rx="8" fill="#e8f6f1" stroke="#1a8a5a" stroke-width="2"/>
  <text x="283" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#135c3d">Anti-aliasing filter</text>
  <text x="283" y="87" text-anchor="middle" font-size="12" fill="#135c3d">analogue low-pass</text>
  <line x1="214" y1="160" x2="352" y2="160" stroke="#5a6782" stroke-width="1"/>
  <line x1="214" y1="160" x2="214" y2="98" stroke="#5a6782" stroke-width="1"/>
  <path d="M214,106 L276,106 C292,106 300,118 306,138 L314,160" fill="none" stroke="#1a8a5a" stroke-width="2.5"/>
  <line x1="322" y1="100" x2="322" y2="160" stroke="#e8710a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="322" y="175" text-anchor="middle" font-size="11" fill="#b35400">fs/2</text>

  <line x1="370" y1="115" x2="400" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. ADC -->
  <rect x="402" y="60" width="150" height="110" rx="8" fill="#f2f6fb" stroke="#9aa9c2"/>
  <text x="477" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#33415c">ADC</text>
  <text x="477" y="101" text-anchor="middle" font-size="12" fill="#5a6782">a sample every 1/fs</text>
  <line x1="416" y1="140" x2="540" y2="140" stroke="#5a6782" stroke-width="1"/>
  <g stroke="#33415c" stroke-width="2">
    <line x1="424" y1="140" x2="424" y2="124"/>
    <line x1="440" y1="140" x2="440" y2="116"/>
    <line x1="456" y1="140" x2="456" y2="122"/>
    <line x1="472" y1="140" x2="472" y2="138"/>
    <line x1="488" y1="140" x2="488" y2="154"/>
    <line x1="504" y1="140" x2="504" y2="160"/>
    <line x1="520" y1="140" x2="520" y2="154"/>
    <line x1="536" y1="140" x2="536" y2="140"/>
  </g>
  <g fill="#33415c">
    <circle cx="424" cy="124" r="3"/><circle cx="440" cy="116" r="3"/><circle cx="456" cy="122" r="3"/><circle cx="472" cy="138" r="3"/>
    <circle cx="488" cy="154" r="3"/><circle cx="504" cy="160" r="3"/><circle cx="520" cy="154" r="3"/><circle cx="536" cy="140" r="3"/>
  </g>

  <line x1="554" y1="115" x2="584" y2="115" stroke="#33415c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. digital -->
  <rect x="586" y="60" width="160" height="110" rx="8" fill="#f2f6fb" stroke="#9aa9c2"/>
  <text x="666" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#33415c">Digital samples</text>
  <g font-size="12" fill="#5a6782" text-anchor="middle">
    <text x="666" y="108">analyse (FFT), plot,</text>
    <text x="666" y="125">or play back through a</text>
    <text x="666" y="142">DAC and a</text>
    <text x="666" y="159">reconstruction filter</text>
  </g>

  <!-- notes -->
  <text x="283" y="212" text-anchor="middle" font-size="12" fill="#135c3d">must act here, on the analogue signal:</text>
  <text x="283" y="228" text-anchor="middle" font-size="12" fill="#135c3d">once sampled, an alias can't be removed</text>
  <text x="477" y="212" text-anchor="middle" font-size="12" fill="#33415c">sample rate fs</text>
  <text x="477" y="228" text-anchor="middle" font-size="12" fill="#33415c">Nyquist frequency fs/2</text>
</svg>
