<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Twin-T notch filter circuit</title>
<desc id="d">Two T networks in parallel between the input and the output. The upper T is a low-pass T: two resistors R in series, with a capacitor 2C from their middle to ground. The lower T is a high-pass T: two capacitors C in series, with a resistor R/2 from their middle to ground. At the notch frequency f0 = 1 / (2 pi R C) the two paths deliver equal and opposite signals, which cancel at the output. With R = 31.6 kilohms and C = 100 nanofarads, f0 is about 50.4 hertz. The passive circuit has a Q of 1/4.</desc>
<rect width="700" height="440" fill="#ffffff"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
  <!-- input and output terminals, shared wiring -->
  <g stroke="#222">
    <circle cx="50" cy="170" r="6" fill="#fff"/>
    <line x1="56" y1="170" x2="90" y2="170"/>
    <line x1="90" y1="90" x2="90" y2="250"/>
    <line x1="560" y1="90" x2="560" y2="250"/>
    <line x1="560" y1="170" x2="614" y2="170"/>
    <circle cx="620" cy="170" r="6" fill="#fff"/>
    <!-- ground rail -->
    <circle cx="50" cy="340" r="6" fill="#fff"/>
    <line x1="56" y1="340" x2="614" y2="340"/>
    <circle cx="620" cy="340" r="6" fill="#fff"/>
  </g>
  <!-- upper T: low-pass T (R, R, 2C) -->
  <g stroke="#2a6fdb">
    <line x1="90" y1="90" x2="140" y2="90"/>
    <polyline points="140,90 150,72 166,108 182,72 198,108 214,72 220,90"/>
    <line x1="220" y1="90" x2="380" y2="90"/>
    <polyline points="380,90 390,72 406,108 422,72 438,108 454,72 460,90"/>
    <line x1="460" y1="90" x2="560" y2="90"/>
    <!-- 2C from the middle to ground -->
    <line x1="300" y1="90" x2="300" y2="150"/>
    <line x1="270" y1="150" x2="330" y2="150" stroke-width="4"/>
    <line x1="270" y1="164" x2="330" y2="164" stroke-width="4"/>
    <line x1="300" y1="164" x2="300" y2="340"/>
  </g>
  <!-- lower T: high-pass T (C, C, R/2) -->
  <g stroke="#d1495b">
    <line x1="90" y1="250" x2="190" y2="250"/>
    <line x1="190" y1="228" x2="190" y2="272" stroke-width="4"/>
    <line x1="204" y1="228" x2="204" y2="272" stroke-width="4"/>
    <line x1="204" y1="250" x2="292" y2="250"/>
    <!-- hop over the 2C wire: the two wires don't connect -->
    <path d="M292,250 A8,8 0 0 1 308,250"/>
    <line x1="308" y1="250" x2="480" y2="250"/>
    <line x1="480" y1="228" x2="480" y2="272" stroke-width="4"/>
    <line x1="494" y1="228" x2="494" y2="272" stroke-width="4"/>
    <line x1="494" y1="250" x2="560" y2="250"/>
    <!-- R/2 from the middle to ground -->
    <line x1="410" y1="250" x2="410" y2="268"/>
    <polyline points="410,268 394,274 426,284 394,294 426,304 394,314 410,320"/>
    <line x1="410" y1="320" x2="410" y2="340"/>
  </g>
</g>
<!-- junction dots -->
<g fill="#222">
  <circle cx="90" cy="170" r="5"/>
  <circle cx="560" cy="170" r="5"/>
  <circle cx="300" cy="340" r="5"/>
  <circle cx="410" cy="340" r="5"/>
</g>
<circle cx="300" cy="90" r="5" fill="#2a6fdb"/>
<circle cx="410" cy="250" r="5" fill="#d1495b"/>
<!-- component labels -->
<g font-size="17" font-weight="700">
  <text x="180" y="62" text-anchor="middle" fill="#2a6fdb">R</text>
  <text x="420" y="62" text-anchor="middle" fill="#2a6fdb">R</text>
  <text x="342" y="163" fill="#2a6fdb">2C</text>
  <text x="197" y="220" text-anchor="middle" fill="#d1495b">C</text>
  <text x="487" y="220" text-anchor="middle" fill="#d1495b">C</text>
  <text x="436" y="300" fill="#d1495b">R/2</text>
</g>
<g font-size="17" fill="#222">
  <text x="40" y="176" text-anchor="end">V<tspan font-size="13" dy="4">in</tspan></text>
  <text x="634" y="176">V<tspan font-size="13" dy="4">out</tspan></text>
  <text x="40" y="346" text-anchor="end">0 V</text>
  <text x="634" y="346">0 V</text>
</g>
<!-- what each T does -->
<g font-size="14">
  <text x="350" y="28" text-anchor="middle" fill="#2a6fdb">Low-pass T (R, R, 2C): passes low frequencies, phase lags</text>
  <text x="104" y="292" fill="#d1495b">High-pass T</text>
  <text x="104" y="309" fill="#d1495b">(C, C, R/2): passes</text>
  <text x="104" y="326" fill="#d1495b">high, phase leads</text>
</g>
<text x="572" y="214" font-size="13" fill="#444">At f₀ the</text>
<text x="572" y="230" font-size="13" fill="#444">paths cancel</text>
<!-- formula -->
<rect x="70" y="370" width="560" height="56" rx="8" fill="#f2f5fa" stroke="#c9d3e3"/>
<text x="350" y="394" text-anchor="middle" font-size="18" fill="#222">f<tspan font-size="13" dy="4">0</tspan><tspan dy="-4"> = 1 / (2π R C)</tspan></text>
<text x="350" y="415" text-anchor="middle" font-size="14" fill="#444">Example: R = 31.6 kΩ, C = 100 nF → f<tspan font-size="11" dy="3">0</tspan><tspan dy="-3"> ≈ 50.4 Hz. Passive twin-T: Q = 1/4</tspan></text>
</svg>
