<text x="204.0" y="400.1" font-size="16" font-weight="700" fill="#1F2A3C">P</text>
<text x="560" y="130" font-size="18" font-weight="700" fill="#1F2A3C">Reading point P</text>
<text x="560" y="170" font-size="16" font-weight="700" fill="#D9670B">1  Clay: 30%</text>
<text x="560" y="194" font-size="14" font-weight="400" fill="#1F2A3C">Follow the line parallel to the base</text>
<text x="560" y="216" font-size="14" font-weight="400" fill="#1F2A3C">to the left side.</text>
<text x="560" y="252" font-size="16" font-weight="700" fill="#1C86A8">2  Silt: 20%</text>
<text x="560" y="276" font-size="14" font-weight="400" fill="#1F2A3C">Follow the line parallel to the left</text>
<text x="560" y="298" font-size="14" font-weight="400" fill="#1F2A3C">side up to the right side.</text>
<text x="560" y="334" font-size="16" font-weight="700" fill="#A87A00">3  Sand: 50%</text>
<text x="560" y="358" font-size="14" font-weight="400" fill="#1F2A3C">Follow the line parallel to the right</text>
<text x="560" y="380" font-size="14" font-weight="400" fill="#1F2A3C">side down to the base.</text>
<text x="560" y="416" font-size="16" font-weight="700" fill="#1F2A3C">Check: 30 + 20 + 50 = 100</text>
<text x="560" y="440" font-size="14" font-weight="400" fill="#1F2A3C">Each line runs parallel to the side</text>
<text x="560" y="462" font-size="14" font-weight="400" fill="#1F2A3C">opposite that component's corner,</text>
<text x="560" y="484" font-size="14" font-weight="400" fill="#1F2A3C">where it is 0%.</text>
</svg>
