<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>How to read a point on a ternary plot</title>
<desc>A ternary plot with sand at the bottom-left corner, silt at the bottom-right corner and clay at the top. One point is read three times: follow the horizontal gridline to the left side to read 30% clay, the gridline parallel to the left side up to the right side to read 20% silt, and the gridline parallel to the right side down to the base to read 50% sand. The three values add up to 100%.</desc>
