<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" width="780" height="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Two ways to lay out a treemap: strips and squarified</title>
<desc>The same seven values (6, 6, 4, 3, 2, 2 and 1) laid out two ways in the same box. Cut into strips, the smallest rectangle is 16 times taller than it is wide. With the squarified layout, built in three rows, no rectangle is more than 2.8 times longer than it is wide.</desc>
<rect width="780" height="368" fill="#ffffff"/>
<text x="30" y="40" font-size="17" font-weight="700" fill="#1d2a3a">1. Cut into strips (slice and dice)</text>
<rect x="30.0" y="70.0" width="77.5" height="210.0" fill="#8A6FD1" fill-opacity="0.99" stroke="#ffffff" stroke-width="2"/>
<text x="68.8" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="107.5" y="70.0" width="77.5" height="210.0" fill="#8A6FD1" fill-opacity="0.99" stroke="#ffffff" stroke-width="2"/>
<text x="146.2" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="185.0" y="70.0" width="51.7" height="210.0" fill="#8A6FD1" fill-opacity="0.81" stroke="#ffffff" stroke-width="2"/>
<text x="210.8" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="236.7" y="70.0" width="38.8" height="210.0" fill="#8A6FD1" fill-opacity="0.72" stroke="#ffffff" stroke-width="2"/>
<text x="256.0" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="275.4" y="70.0" width="25.8" height="210.0" fill="#8A6FD1" fill-opacity="0.63" stroke="#ffffff" stroke-width="2"/>
<text x="288.3" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="301.2" y="70.0" width="25.8" height="210.0" fill="#8A6FD1" fill-opacity="0.63" stroke="#ffffff" stroke-width="2"/>
<text x="314.2" y="180.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="327.1" y="70.0" width="12.9" height="210.0" fill="#8A6FD1" fill-opacity="0.54" stroke="#ffffff" stroke-width="2"/>
<text x="30" y="316" font-size="14" fill="#1d2a3a" font-weight="700">Longest side up to 16 times the shortest.</text>
<text x="30" y="335" font-size="14" fill="#3c4a5c" >Thin slivers are hard to compare</text>
<text x="30" y="354" font-size="14" fill="#3c4a5c" >and leave no room for labels.</text>
<text x="440" y="40" font-size="17" font-weight="700" fill="#1d2a3a">2. Squarified, in rows</text>
<rect x="440.0" y="70.0" width="155.0" height="105.0" fill="#2E9CB8" fill-opacity="0.99" stroke="#ffffff" stroke-width="2"/>
<text x="517.5" y="127.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="440.0" y="175.0" width="155.0" height="105.0" fill="#2E9CB8" fill-opacity="0.99" stroke="#ffffff" stroke-width="2"/>
<text x="517.5" y="232.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="595.0" y="70.0" width="88.6" height="122.5" fill="#2E9CB8" fill-opacity="0.81" stroke="#ffffff" stroke-width="2"/>
<text x="639.3" y="136.2" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="683.6" y="70.0" width="66.4" height="122.5" fill="#2E9CB8" fill-opacity="0.72" stroke="#ffffff" stroke-width="2"/>
<text x="716.8" y="136.2" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="595.0" y="192.5" width="62.0" height="87.5" fill="#2E9CB8" fill-opacity="0.63" stroke="#ffffff" stroke-width="2"/>
<text x="626.0" y="241.2" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="657.0" y="192.5" width="62.0" height="87.5" fill="#2E9CB8" fill-opacity="0.63" stroke="#ffffff" stroke-width="2"/>
<text x="688.0" y="241.2" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="719.0" y="192.5" width="31.0" height="87.5" fill="#2E9CB8" fill-opacity="0.54" stroke="#ffffff" stroke-width="2"/>
<text x="734.5" y="241.2" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="441.5" y="71.5" width="152.0" height="207.0" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="446.0" y="76.0" width="46" height="19" rx="3" fill="#ffffff"/>
<text x="469.0" y="90.0" font-size="13" font-weight="700" fill="#1d2a3a" text-anchor="middle">row 1</text>
<rect x="596.5" y="71.5" width="152.0" height="119.5" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="601.0" y="76.0" width="46" height="19" rx="3" fill="#ffffff"/>
<text x="624.0" y="90.0" font-size="13" font-weight="700" fill="#1d2a3a" text-anchor="middle">row 2</text>
<rect x="596.5" y="194.0" width="152.0" height="84.5" fill="none" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="601.0" y="198.5" width="46" height="19" rx="3" fill="#ffffff"/>
<text x="624.0" y="212.5" font-size="13" font-weight="700" fill="#1d2a3a" text-anchor="middle">row 3</text>
<text x="440" y="316" font-size="14" fill="#1d2a3a" font-weight="700">Longest side up to 2.8 times the shortest.</text>
<text x="440" y="335" font-size="14" fill="#3c4a5c" >Rows are added along the shorter side while</text>
<text x="440" y="354" font-size="14" fill="#3c4a5c" >they make the rectangles squarer.</text>
</svg>
