<path d="M70.0,210.7 L75.6,205.0 L81.2,194.0 L86.8,187.5 L92.4,170.5 L98.0,161.7 L103.6,165.8 L109.2,159.3 L114.7,160.9 L120.3,138.9 L125.9,155.9 L131.5,153.5 L137.1,143.6 L142.7,129.7 L148.3,120.8 L153.9,117.9 L293.7,122.4 L299.3,114.1 L304.9,120.2 L310.5,125.2 L316.1,126.5 L321.7,140.5 L327.3,157.7 L332.9,163.7 L338.5,195.6 L344.1,174.7 L349.7,187.4 L355.3,195.4 L360.8,192.4 L366.4,187.9 L372.0,211.8 L377.6,220.5 L383.2,215.1 L388.8,221.6 L394.4,235.7 L400.0,232.6" fill="none" stroke="#d35400" stroke-width="2.2" stroke-linejoin="round"/>
<text x="70" y="32" font-size="16" font-weight="bold" fill="#d35400">Joined across the gap</text>
<text x="70" y="50" font-size="13" fill="#444">The straight line invents six hours of data</text>
<text x="223.8" y="148.0" text-anchor="middle" font-size="12" fill="#6b7685">Not recorded: the real peak</text>
