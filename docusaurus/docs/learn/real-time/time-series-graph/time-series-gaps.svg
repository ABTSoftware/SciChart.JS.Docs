<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Gaps in a time series: joined versus broken</title>
<desc>The same day of power readings, 06:00 to 21:00, with the meter offline from 10:00 to 16:00. On the left the line is joined straight across the gap, which suggests demand stayed near 80 kW and hides the midday peak that really happened, drawn faintly. On the right the line stops at the gap and a shaded band marks the outage, so nothing is invented.</desc>
<rect width="780" height="330" fill="#ffffff"/>
<rect x="70" y="60" width="330" height="200" fill="#f6f7f9" stroke="#c9ced6"/>
<line x1="137.1" y1="60" x2="137.1" y2="260" stroke="#e3e6eb"/><text x="137.1" y="278" text-anchor="middle" font-size="12" fill="#555">9:00</text>
<line x1="204.2" y1="60" x2="204.2" y2="260" stroke="#e3e6eb"/><text x="204.2" y="278" text-anchor="middle" font-size="12" fill="#555">12:00</text>
<line x1="271.4" y1="60" x2="271.4" y2="260" stroke="#e3e6eb"/><text x="271.4" y="278" text-anchor="middle" font-size="12" fill="#555">15:00</text>
<line x1="338.5" y1="60" x2="338.5" y2="260" stroke="#e3e6eb"/><text x="338.5" y="278" text-anchor="middle" font-size="12" fill="#555">18:00</text>
<text x="64" y="224.0" text-anchor="end" font-size="12" fill="#555">60</text>
<text x="64" y="144.0" text-anchor="end" font-size="12" fill="#555">80</text>
<text x="64" y="64.0" text-anchor="end" font-size="12" fill="#555">100</text>
