<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 780 330"><title>Gaps in a time series: joined versus broken</title><desc>The same day of power readings, 06:00 to 21:00, with the meter offline from 10:00 to 16:00. On the left the line is joined straight across the gap, which suggests demand stayed near 80 kW and hides the midday peak that really happened, drawn faintly. On the right the line stops at the gap and a shaded band marks the outage, so nothing is invented.</desc><rect width="780" height="330" fill="#fff"/><rect width="330" height="200" x="70" y="60" fill="#f6f7f9" stroke="#c9ced6"/><line x1="137.1" x2="137.1" y1="60" y2="260" stroke="#e3e6eb"/><text x="137.1" y="278" fill="#555" font-size="12" text-anchor="middle">9:00</text><line x1="204.2" x2="204.2" y1="60" y2="260" stroke="#e3e6eb"/><text x="204.2" y="278" fill="#555" font-size="12" text-anchor="middle">12:00</text><line x1="271.4" x2="271.4" y1="60" y2="260" stroke="#e3e6eb"/><text x="271.4" y="278" fill="#555" font-size="12" text-anchor="middle">15:00</text><line x1="338.5" x2="338.5" y1="60" y2="260" stroke="#e3e6eb"/><text x="338.5" y="278" fill="#555" font-size="12" text-anchor="middle">18:00</text><text x="64" y="224" fill="#555" font-size="12" text-anchor="end">60</text><text x="64" y="144" fill="#555" font-size="12" text-anchor="end">80</text><text x="64" y="64" fill="#555" font-size="12" text-anchor="end">100</text><path fill="none" stroke="#9aa5b4" stroke-dasharray="3 3" stroke-width="1.3" d="m153.9 117.9 5.6-1.9 5.6 1.2 5.6-16.2 5.6-11.2 5.6-25.4 5.6 14.7 5.6-1.5 5.5 4.3 5.6 12 5.6 12.8 5.6 1.1 5.6-15.1 5.6-5.7 5.6-6.8 5.6 28.5 5.6-4.5 5.6-4.2 5.6-7.4 5.6 15.8 5.6-5.6 5.6 5.9 5.5 15.3 5.6-16.9 5.6 20.8 5.6-5.5"/><path fill="none" stroke="#d35400" stroke-linejoin="round" stroke-width="2.2" d="m70 210.7 5.6-5.7 5.6-11 5.6-6.5 5.6-17 5.6-8.8 5.6 4.1 5.6-6.5 5.5 1.6 5.6-22 5.6 17 5.6-2.4 5.6-9.9 5.6-13.9 5.6-8.9 5.6-2.9 139.8 4.5 5.6-8.3 5.6 6.1 5.6 5 5.6 1.3 5.6 14 5.6 17.2 5.6 6 5.6 31.9 5.6-20.9 5.6 12.7 5.6 8 5.5-3 5.6-4.5 5.6 23.9 5.6 8.7 5.6-5.4 5.6 6.5 5.6 14.1 5.6-3.1"/><text x="70" y="32" fill="#d35400" font-size="16" font-weight="bold">Joined across the gap</text><text x="70" y="50" fill="#444" font-size="13">The straight line invents six hours of data</text><text x="223.8" y="148" fill="#6b7685" font-size="12" text-anchor="middle">Not recorded: the real peak</text><rect width="330" height="200" x="430" y="60" fill="#f6f7f9" stroke="#c9ced6"/><line x1="497.1" x2="497.1" y1="60" y2="260" stroke="#e3e6eb"/><text x="497.1" y="278" fill="#555" font-size="12" text-anchor="middle">9:00</text><line x1="564.2" x2="564.2" y1="60" y2="260" stroke="#e3e6eb"/><text x="564.2" y="278" fill="#555" font-size="12" text-anchor="middle">12:00</text><line x1="631.4" x2="631.4" y1="60" y2="260" stroke="#e3e6eb"/><text x="631.4" y="278" fill="#555" font-size="12" text-anchor="middle">15:00</text><line x1="698.5" x2="698.5" y1="60" y2="260" stroke="#e3e6eb"/><text x="698.5" y="278" fill="#555" font-size="12" text-anchor="middle">18:00</text><text x="424" y="224" fill="#555" font-size="12" text-anchor="end">60</text><text x="424" y="144" fill="#555" font-size="12" text-anchor="end">80</text><text x="424" y="64" fill="#555" font-size="12" text-anchor="end">100</text><path fill="none" stroke="#9aa5b4" stroke-dasharray="3 3" stroke-width="1.3" d="m513.9 117.9 5.6-1.9 5.6 1.2 5.6-16.2 5.6-11.2 5.6-25.4 5.6 14.7 5.6-1.5 5.5 4.3 5.6 12 5.6 12.8 5.6 1.1 5.6-15.1 5.6-5.7 5.6-6.8 5.6 28.5 5.6-4.5 5.6-4.2 5.6-7.4 5.6 15.8 5.6-5.6 5.6 5.9 5.5 15.3 5.6-16.9 5.6 20.8 5.6-5.5"/><rect width="134.2" height="200" x="516.7" y="60" fill="#e74c3c" fill-opacity=".13"/><text x="583.8" y="250" fill="#c0392b" font-size="13" text-anchor="middle">Meter offline</text><path fill="none" stroke="#2e5c8a" stroke-linejoin="round" stroke-width="2.2" d="m430 210.7 5.6-5.7 5.6-11 5.6-6.5 5.6-17 5.6-8.8 5.6 4.1 5.6-6.5 5.5 1.6 5.6-22 5.6 17 5.6-2.4 5.6-9.9 5.6-13.9 5.6-8.9 5.6-2.9m139.8 4.5 5.6-8.3 5.6 6.1 5.6 5 5.6 1.3 5.6 14 5.6 17.2 5.6 6 5.6 31.9 5.6-20.9 5.6 12.7 5.6 8 5.5-3 5.6-4.5 5.6 23.9 5.6 8.7 5.6-5.4 5.6 6.5 5.6 14.1 5.6-3.1"/><text x="430" y="32" fill="#2e5c8a" font-size="16" font-weight="bold">Broken at the gap</text><text x="430" y="50" fill="#444" font-size="13">The outage is visible; nothing is invented</text><text x="70" y="318" fill="#444" font-size="12">Power demand (kW), Tuesday 10 March 2026 (UTC)</text></svg>