<line x1="564.2" y1="60" x2="564.2" y2="260" stroke="#e3e6eb"/><text x="564.2" y="278" text-anchor="middle" font-size="12" fill="#555">12:00</text>
<line x1="631.4" y1="60" x2="631.4" y2="260" stroke="#e3e6eb"/><text x="631.4" y="278" text-anchor="middle" font-size="12" fill="#555">15:00</text>
<line x1="698.5" y1="60" x2="698.5" y2="260" stroke="#e3e6eb"/><text x="698.5" y="278" text-anchor="middle" font-size="12" fill="#555">18:00</text>
<text x="424" y="224.0" text-anchor="end" font-size="12" fill="#555">60</text>
