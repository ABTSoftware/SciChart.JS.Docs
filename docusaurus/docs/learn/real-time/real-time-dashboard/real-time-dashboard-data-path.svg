<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 470"><title>The data path of a real-time dashboard, from source to screen</title><desc>Top row, on the server side: 1, data sources such as sensors, PLCs, devices, applications and market feeds; 2, ingest through an MQTT broker, message queue or gateway; 3, process and store: clean, aggregate, check alarm limits and write to a time-series database or historian. An arrow labelled &quot;push over the network&quot; leads to the bottom row, in the browser: 4, receive through a WebSocket or server-sent events, or by polling; 5, buffer the new readings in typed arrays and circular buffers; 6, draw the charts at the dashboard&apos;s update rate, on the screen&apos;s next frame. A timeline underneath shows how latency adds up: sampling, then network and processing, then waiting for the next dashboard update (up to one update interval, for example 100 milliseconds at 10 hertz), then waiting for the next screen frame (up to about 17 milliseconds at 60 hertz).</desc><defs><marker id="rtdArrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#3d4a5c" d="m0 0 10 5-10 5z"/></marker></defs><rect width="760" height="470" fill="#fff"/><text x="20" y="26" fill="#2b5876" font-size="14" font-weight="bold">Server side</text><g fill="#2d3748" font-size="12" text-anchor="middle"><rect width="210" height="104" x="20" y="38" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2" rx="10"/><text x="125" y="62" fill="#2b5876" font-size="14" font-weight="bold">1. Sources</text><text x="125" y="84">sensors, PLCs, devices,</text><text x="125" y="100">apps and logs,</text><text x="125" y="116">market feeds</text><rect width="210" height="104" x="275" y="38" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2" rx="10"/><text x="380" y="62" fill="#2b5876" font-size="14" font-weight="bold">2. Ingest</text><text x="380" y="84">MQTT broker,</text><text x="380" y="100">message queue</text><text x="380" y="116">or gateway</text><rect width="210" height="104" x="530" y="38" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2" rx="10"/><text x="635" y="62" fill="#2b5876" font-size="14" font-weight="bold">3. Process and store</text><text x="635" y="84">clean, aggregate,</text><text x="635" y="100">check alarm limits,</text><text x="635" y="116">time-series database</text></g><line x1="231" x2="271" y1="90" y2="90" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/><line x1="486" x2="526" y1="90" y2="90" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/><path fill="none" stroke="#3d4a5c" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#rtdArrow)" d="M635 143v27H125v26"/><rect width="168" height="20" x="296" y="160" fill="#fff"/><text x="380" y="175" fill="#3d4a5c" font-size="13" font-style="italic" text-anchor="middle">push over the network</text><g fill="#2d3748" font-size="12" text-anchor="middle"><rect width="210" height="104" x="20" y="200" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2" rx="10"/><text x="125" y="224" fill="#5a3a8a" font-size="14" font-weight="bold">4. Receive</text><text x="125" y="246">WebSocket or</text><text x="125" y="262">server-sent events,</text><text x="125" y="278">or poll every few seconds</text><rect width="210" height="104" x="275" y="200" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2" rx="10"/><text x="380" y="224" fill="#5a3a8a" font-size="14" font-weight="bold">5. Buffer</text><text x="380" y="246">typed arrays,</text><text x="380" y="262">circular (FIFO) buffers,</text><text x="380" y="278">keep the last N seconds</text><rect width="210" height="104" x="530" y="200" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2" rx="10"/><text x="635" y="224" fill="#5a3a8a" font-size="14" font-weight="bold">6. Draw</text><text x="635" y="246">append new points,</text><text x="635" y="262">scroll the time axes,</text><text x="635" y="278">at the update rate</text></g><line x1="231" x2="271" y1="252" y2="252" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/><line x1="486" x2="526" y1="252" y2="252" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/><text x="740" y="324" fill="#5a3a8a" font-size="14" font-weight="bold" text-anchor="end">In the browser</text><text x="20" y="364" fill="#2d3748" font-size="14" font-weight="bold">How latency adds up, from event to pixels</text><g font-size="12" text-anchor="middle"><rect width="110" height="34" x="20" y="376" fill="#cfe5f3"/><text x="75" y="397" fill="#1d3f57">sample</text><rect width="230" height="34" x="130" y="376" fill="#9cc8e4"/><text x="245" y="397" fill="#1d3f57">network and processing</text><rect width="250" height="34" x="360" y="376" fill="#c9b6e6"/><text x="485" y="397" fill="#3b2463">wait for the next update</text><rect width="130" height="34" x="610" y="376" fill="#e3d7f3"/><text x="675" y="397" fill="#3b2463">next frame</text><text x="485" y="430" fill="#4a5568">up to 1 update interval:</text><text x="485" y="446" fill="#4a5568">1 s at 1 Hz, 100 ms at 10 Hz</text><text x="675" y="430" fill="#4a5568">up to ~17 ms</text><text x="675" y="446" fill="#4a5568">on a 60 Hz screen</text><text x="245" y="430" fill="#4a5568">milliseconds on a LAN,</text><text x="245" y="446" fill="#4a5568">more over cellular or satellite</text></g></svg>