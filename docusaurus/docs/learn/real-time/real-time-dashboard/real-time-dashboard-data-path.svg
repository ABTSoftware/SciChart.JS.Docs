<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
<title>The data path of a real-time dashboard, from source to screen</title>
<desc>Top row, on the server side: 1, data sources such as sensors, PLCs, devices, applications and market feeds; 2, ingest through an MQTT broker, message queue or gateway; 3, process and store: clean, aggregate, check alarm limits and write to a time-series database or historian. An arrow labelled "push over the network" leads to the bottom row, in the browser: 4, receive through a WebSocket or server-sent events, or by polling; 5, buffer the new readings in typed arrays and circular buffers; 6, draw the charts at the dashboard's update rate, on the screen's next frame. A timeline underneath shows how latency adds up: sampling, then network and processing, then waiting for the next dashboard update (up to one update interval, for example 100 milliseconds at 10 hertz), then waiting for the next screen frame (up to about 17 milliseconds at 60 hertz).</desc>
<defs>
<marker id="rtdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4a5c"/></marker>
</defs>
<rect width="760" height="470" fill="#ffffff"/>

<!-- Server side -->
<text x="20" y="26" font-size="14" font-weight="bold" fill="#2b5876">Server side</text>
<g font-size="12" fill="#2d3748" text-anchor="middle">
<rect x="20" y="38" width="210" height="104" rx="10" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2"/>
<text x="125" y="62" font-size="14" font-weight="bold" fill="#2b5876">1. Sources</text>
<text x="125" y="84">sensors, PLCs, devices,</text>
<text x="125" y="100">apps and logs,</text>
<text x="125" y="116">market feeds</text>

<rect x="275" y="38" width="210" height="104" rx="10" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2"/>
<text x="380" y="62" font-size="14" font-weight="bold" fill="#2b5876">2. Ingest</text>
<text x="380" y="84">MQTT broker,</text>
<text x="380" y="100">message queue</text>
<text x="380" y="116">or gateway</text>

<rect x="530" y="38" width="210" height="104" rx="10" fill="#eef6fb" stroke="#3b8dbd" stroke-width="2"/>
<text x="635" y="62" font-size="14" font-weight="bold" fill="#2b5876">3. Process and store</text>
<text x="635" y="84">clean, aggregate,</text>
<text x="635" y="100">check alarm limits,</text>
<text x="635" y="116">time-series database</text>
</g>
<line x1="231" y1="90" x2="271" y2="90" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/>
<line x1="486" y1="90" x2="526" y2="90" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/>

<!-- Push over the network -->
<path d="M635,143 V170 H125 V196" fill="none" stroke="#3d4a5c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rtdArrow)"/>
<rect x="296" y="160" width="168" height="20" fill="#ffffff"/>
<text x="380" y="175" font-size="13" font-style="italic" fill="#3d4a5c" text-anchor="middle">push over the network</text>

<!-- In the browser -->
<g font-size="12" fill="#2d3748" text-anchor="middle">
<rect x="20" y="200" width="210" height="104" rx="10" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2"/>
<text x="125" y="224" font-size="14" font-weight="bold" fill="#5a3a8a">4. Receive</text>
<text x="125" y="246">WebSocket or</text>
<text x="125" y="262">server-sent events,</text>
<text x="125" y="278">or poll every few seconds</text>

<rect x="275" y="200" width="210" height="104" rx="10" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2"/>
<text x="380" y="224" font-size="14" font-weight="bold" fill="#5a3a8a">5. Buffer</text>
<text x="380" y="246">typed arrays,</text>
<text x="380" y="262">circular (FIFO) buffers,</text>
<text x="380" y="278">keep the last N seconds</text>

<rect x="530" y="200" width="210" height="104" rx="10" fill="#f6f1fb" stroke="#7a52b3" stroke-width="2"/>
<text x="635" y="224" font-size="14" font-weight="bold" fill="#5a3a8a">6. Draw</text>
<text x="635" y="246">append new points,</text>
<text x="635" y="262">scroll the time axes,</text>
<text x="635" y="278">at the update rate</text>
</g>
<line x1="231" y1="252" x2="271" y2="252" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/>
<line x1="486" y1="252" x2="526" y2="252" stroke="#3d4a5c" stroke-width="2" marker-end="url(#rtdArrow)"/>
<text x="740" y="324" font-size="14" font-weight="bold" fill="#5a3a8a" text-anchor="end">In the browser</text>

<!-- Latency timeline -->
<text x="20" y="364" font-size="14" font-weight="bold" fill="#2d3748">How latency adds up, from event to pixels</text>
<g font-size="12" text-anchor="middle">
<rect x="20" y="376" width="110" height="34" fill="#cfe5f3"/>
<text x="75" y="397" fill="#1d3f57">sample</text>
<rect x="130" y="376" width="230" height="34" fill="#9cc8e4"/>
<text x="245" y="397" fill="#1d3f57">network and processing</text>
<rect x="360" y="376" width="250" height="34" fill="#c9b6e6"/>
<text x="485" y="397" fill="#3b2463">wait for the next update</text>
<rect x="610" y="376" width="130" height="34" fill="#e3d7f3"/>
<text x="675" y="397" fill="#3b2463">next frame</text>
<text x="485" y="430" fill="#4a5568">up to 1 update interval:</text>
<text x="485" y="446" fill="#4a5568">1 s at 1 Hz, 100 ms at 10 Hz</text>
<text x="675" y="430" fill="#4a5568">up to ~17 ms</text>
<text x="675" y="446" fill="#4a5568">on a 60 Hz screen</text>
<text x="245" y="430" fill="#4a5568">milliseconds on a LAN,</text>
<text x="245" y="446" fill="#4a5568">more over cellular or satellite</text>
</g>
</svg>
