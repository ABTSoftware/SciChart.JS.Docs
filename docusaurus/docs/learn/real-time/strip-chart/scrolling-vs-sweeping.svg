<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Scrolling and sweeping strip charts compared</title>
<desc>Two panels showing the same signal. In the scrolling panel the whole trace moves to the left and the newest reading is always at the right-hand edge. In the sweeping panel the trace stays still: a write point moves from left to right, new data is drawn to its left, a small gap sits just ahead of it, and older data from the previous sweep is still showing to its right until it is overwritten.</desc>
