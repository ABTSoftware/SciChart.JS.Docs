<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" width="760" height="475" font-family="Helvetica, Arial, sans-serif">
<title>How to read a strip chart</title>
<desc>A strip chart with three lanes, temperature, pressure and flow, each with its own scale. New readings enter at the right-hand edge, labelled now, and older readings move left and off the chart. A dashed red line marks a high alarm limit on the temperature lane. A vertical dashed line marks the same moment in all three lanes, where pressure jumps, temperature starts to rise and flow drops.</desc>
