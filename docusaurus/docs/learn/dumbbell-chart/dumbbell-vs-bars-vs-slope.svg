<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">The same before-and-after data as clustered bars, a dumbbell chart and a slope chart</title>
<desc id="d">Average waiting time in minutes at four clinics, 2023 and 2025 (sample data), drawn three ways. Left: clustered bars, two bars per clinic from zero. Middle: a dumbbell chart, one row per clinic with a grey 2023 dot and a teal 2025 dot joined by a line. Right: a slope chart, with a 2023 column and a 2025 column and one line per clinic between them.</desc>
<rect width="900" height="450" fill="#ffffff"/>
<text x="450" y="28" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Average wait (minutes), 2023 vs 2025, sample data</text>
<circle cx="370" cy="50" r="7" fill="#8A96A8"/><text x="382" y="55" font-size="13" fill="#1F2937">2023</text>
<circle cx="440" cy="50" r="7" fill="#1F9BB8"/><text x="452" y="55" font-size="13" fill="#1F2937">2025</text>
<text x="150" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Clustered bars</text>
<text x="450" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Dumbbell chart</text>
<text x="750" y="92" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">Slope chart</text>
<line x1="40" y1="340.0" x2="270" y2="340.0" stroke="#E5E7EB"/><text x="34" y="344.0" font-size="11" fill="#5B6472" text-anchor="end">0</text>
<line x1="40" y1="291.1" x2="270" y2="291.1" stroke="#E5E7EB"/><text x="34" y="295.1" font-size="11" fill="#5B6472" text-anchor="end">10</text>
<line x1="40" y1="242.2" x2="270" y2="242.2" stroke="#E5E7EB"/><text x="34" y="246.2" font-size="11" fill="#5B6472" text-anchor="end">20</text>
<line x1="40" y1="193.3" x2="270" y2="193.3" stroke="#E5E7EB"/><text x="34" y="197.3" font-size="11" fill="#5B6472" text-anchor="end">30</text>
<line x1="40" y1="144.4" x2="270" y2="144.4" stroke="#E5E7EB"/><text x="34" y="148.4" font-size="11" fill="#5B6472" text-anchor="end">40</text>
<rect x="52" y="173.8" width="19" height="166.2" fill="#8A96A8"/>
<rect x="73" y="232.4" width="19" height="107.6" fill="#1F9BB8"/>
