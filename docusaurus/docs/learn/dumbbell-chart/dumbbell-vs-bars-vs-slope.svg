<line x1="680" y1="149.3" x2="820" y2="222.7" stroke="#B5BFCC" stroke-width="3"/>
<circle cx="680" cy="149.3" r="6" fill="#8A96A8"/><circle cx="820" cy="222.7" r="6" fill="#1F9BB8"/>
<text x="670" y="153.3" font-size="11" fill="#1F2937" text-anchor="end">C 41</text>
<text x="830" y="226.7" font-size="11" fill="#1F2937">31 C</text>
<line x1="680" y1="325.3" x2="820" y2="303.3" stroke="#B5BFCC" stroke-width="3"/>
<circle cx="680" cy="325.3" r="6" fill="#8A96A8"/><circle cx="820" cy="303.3" r="6" fill="#1F9BB8"/>
<text x="670" y="329.3" font-size="11" fill="#1F2937" text-anchor="end">D 17</text>
<text x="830" y="307.3" font-size="11" fill="#1F2937">20 D</text>
<text x="150" y="396" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">Shows each value from zero,</text>
<text x="150" y="411" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">but the change is two bars apart</text>
<text x="470" y="396" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">The change is a line you can</text>
<text x="470" y="411" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">see, compare and sort</text>
<text x="750" y="396" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">The change is a slope; labels</text>
<text x="750" y="411" font-size="12" fill="#5B6472" text-anchor="middle" font-style="italic">crowd as categories grow</text>
</svg>