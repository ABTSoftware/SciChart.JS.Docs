<line x1="503.3" y1="118" x2="503.3" y2="340" stroke="#E5E7EB"/><text x="503.3" y="358" font-size="11" fill="#5B6472" text-anchor="middle">35</text>
<line x1="570.0" y1="118" x2="570.0" y2="340" stroke="#E5E7EB"/><text x="570.0" y="358" font-size="11" fill="#5B6472" text-anchor="middle">45</text>
