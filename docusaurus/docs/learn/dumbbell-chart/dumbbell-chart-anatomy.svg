<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">The parts of a dumbbell chart</title>
<desc id="d">A horizontal dumbbell chart of average hours of sleep on weekdays and at weekends for four age groups (sample data). Each row has a grey weekday dot and a teal weekend dot joined by a line, with the difference written beside it. Callouts label the start dot, the end dot, the connecting line that shows the gap, the gap label, the legend and the value axis, which does not start at zero.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="150" y="34" font-size="17" font-weight="bold" fill="#1F2937">Average hours of sleep, weekdays vs weekends</text>
<text x="150" y="54" font-size="13" fill="#5B6472">Sample data, by age group</text>
<circle cx="156" cy="80" r="7" fill="#8A96A8"/><text x="168" y="85" font-size="14" fill="#1F2937">Weekday</text>
<circle cx="246" cy="80" r="7" fill="#1F9BB8"/><text x="258" y="85" font-size="14" fill="#1F2937">Weekend</text>
<line x1="150.0" y1="102" x2="150.0" y2="430" stroke="#E5E7EB"/>
<text x="150.0" y="448" font-size="13" fill="#5B6472" text-anchor="middle">6</text>
<line x1="208.3" y1="102" x2="208.3" y2="430" stroke="#E5E7EB"/>
<text x="208.3" y="448" font-size="13" fill="#5B6472" text-anchor="middle">6.5</text>
<line x1="266.7" y1="102" x2="266.7" y2="430" stroke="#E5E7EB"/>
<text x="266.7" y="448" font-size="13" fill="#5B6472" text-anchor="middle">7</text>
<line x1="325.0" y1="102" x2="325.0" y2="430" stroke="#E5E7EB"/>
<text x="325.0" y="448" font-size="13" fill="#5B6472" text-anchor="middle">7.5</text>
<line x1="383.3" y1="102" x2="383.3" y2="430" stroke="#E5E7EB"/>
<text x="383.3" y="448" font-size="13" fill="#5B6472" text-anchor="middle">8</text>
<line x1="441.7" y1="102" x2="441.7" y2="430" stroke="#E5E7EB"/>
<text x="441.7" y="448" font-size="13" fill="#5B6472" text-anchor="middle">8.5</text>
<line x1="500.0" y1="102" x2="500.0" y2="430" stroke="#E5E7EB"/>
<text x="500.0" y="448" font-size="13" fill="#5B6472" text-anchor="middle">9</text>
<text x="325.0" y="470" font-size="13" fill="#5B6472" text-anchor="middle">Hours of sleep per night</text>
<text x="136" y="135" font-size="14" fill="#1F2937" text-anchor="end">18–29</text>
<line x1="255.0" y1="130" x2="430.0" y2="130" stroke="#B5BFCC" stroke-width="5" stroke-linecap="round"/>
<circle cx="255.0" cy="130" r="9" fill="#8A96A8"/><circle cx="430.0" cy="130" r="9" fill="#1F9BB8"/>
<text x="446.0" y="135" font-size="13" fill="#5B6472">+1.5 h</text>
<text x="136" y="225" font-size="14" fill="#1F2937" text-anchor="end">30–44</text>
<line x1="220.0" y1="220" x2="336.7" y2="220" stroke="#B5BFCC" stroke-width="5" stroke-linecap="round"/>
<circle cx="220.0" cy="220" r="9" fill="#8A96A8"/><circle cx="336.7" cy="220" r="9" fill="#1F9BB8"/>
<text x="352.7" y="225" font-size="13" fill="#5B6472">+1.0 h</text>
<text x="136" y="315" font-size="14" fill="#1F2937" text-anchor="end">45–64</text>
<line x1="243.3" y1="310" x2="313.3" y2="310" stroke="#B5BFCC" stroke-width="5" stroke-linecap="round"/>
<circle cx="243.3" cy="310" r="9" fill="#8A96A8"/><circle cx="313.3" cy="310" r="9" fill="#1F9BB8"/>
<text x="329.3" y="315" font-size="13" fill="#5B6472">+0.6 h</text>
<text x="136" y="405" font-size="14" fill="#1F2937" text-anchor="end">65+</text>
<line x1="313.3" y1="400" x2="336.7" y2="400" stroke="#B5BFCC" stroke-width="5" stroke-linecap="round"/>
<circle cx="313.3" cy="400" r="9" fill="#8A96A8"/><circle cx="336.7" cy="400" r="9" fill="#1F9BB8"/>
<text x="352.7" y="405" font-size="13" fill="#5B6472">+0.2 h</text>
<line x1="255.0" y1="160" x2="255.0" y2="141" stroke="#C2410C" stroke-width="1.5"/><circle cx="255.0" cy="141" r="3" fill="#C2410C"/>
<text x="255.0" y="174" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="middle">Start dot</text>
<text x="255.0" y="190" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">first value (weekday)</text>
<line x1="430.0" y1="160" x2="430.0" y2="141" stroke="#C2410C" stroke-width="1.5"/><circle cx="430.0" cy="141" r="3" fill="#C2410C"/>
<text x="430.0" y="174" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="middle">End dot</text>
<text x="430.0" y="190" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">second value (weekend)</text>
<line x1="278.3" y1="250" x2="278.3" y2="223" stroke="#C2410C" stroke-width="1.5"/><circle cx="278.3" cy="223" r="3" fill="#C2410C"/>
<text x="278.3" y="264" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="middle">Connecting line</text>
<text x="278.3" y="280" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">its length is the gap</text>
<line x1="600.0" y1="310" x2="377.3" y2="306" stroke="#C2410C" stroke-width="1.5"/><circle cx="377.3" cy="306" r="3" fill="#C2410C"/>
<text x="608.0" y="306" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="start">Gap label</text>
<text x="608.0" y="322" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start">the difference, written out</text>
<line x1="600.0" y1="80" x2="320.0" y2="80" stroke="#C2410C" stroke-width="1.5"/><circle cx="320.0" cy="80" r="3" fill="#C2410C"/>
<text x="608.0" y="77" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="start">Legend</text>
<text x="608.0" y="93" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start">one colour for each end</text>
<line x1="210.0" y1="500" x2="150.0" y2="454" stroke="#C2410C" stroke-width="1.5"/><circle cx="150.0" cy="454" r="3" fill="#C2410C"/>
<text x="216.0" y="496" font-size="13" font-weight="bold" fill="#C2410C" text-anchor="start">Value axis</text>
<text x="216.0" y="512" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="start">starts at 6, not 0: the gap is what you read</text>
</svg>