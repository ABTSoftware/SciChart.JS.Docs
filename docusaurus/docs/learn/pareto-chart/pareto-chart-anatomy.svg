<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomy of a Pareto chart</title>
<desc id="d">A Pareto chart with six bars sorted from largest to smallest, labelled A to E and Other. A cumulative percentage line rises against a right-hand axis from 0 to 100 percent and crosses a dashed 80 percent reference line after the third bar. The first three causes are marked as the vital few, giving 82 percent of the total; the rest are marked as the useful many.</desc>
<rect width="960" height="520" fill="#ffffff"/>
<text x="480.0" y="34.0" font-size="21" text-anchor="middle" fill="#1c2333" font-weight="700" >Anatomy of a Pareto chart</text>
<line x1="90" y1="400.0" x2="610" y2="400.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="405.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >0</text>
<line x1="90" y1="334.0" x2="610" y2="334.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="339.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >10</text>
<line x1="90" y1="268.0" x2="610" y2="268.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="273.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >20</text>
<line x1="90" y1="202.0" x2="610" y2="202.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="207.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >30</text>
<line x1="90" y1="136.0" x2="610" y2="136.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="141.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >40</text>
<line x1="90" y1="70.0" x2="610" y2="70.0" stroke="#e3e7ee" stroke-width="1"/>
<text x="82.0" y="75.0" font-size="13" text-anchor="end" fill="#5b6475" font-weight="normal" >50</text>
<text x="618.0" y="405.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >0%</text>
<text x="618.0" y="339.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >20%</text>
<text x="618.0" y="273.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >40%</text>
<text x="618.0" y="207.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >60%</text>
<text x="618.0" y="141.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >80%</text>
<text x="618.0" y="75.0" font-size="13" text-anchor="start" fill="#5b6475" font-weight="normal" >100%</text>
<line x1="90" y1="70" x2="90" y2="400" stroke="#5b6475" stroke-width="1.2"/>
<line x1="610" y1="70" x2="610" y2="400" stroke="#5b6475" stroke-width="1.2"/>
<line x1="90" y1="400" x2="610" y2="400" stroke="#5b6475" stroke-width="1.2"/>
<rect x="104.7" y="103.0" width="57.2" height="297.0" rx="5" fill="#f48420"/>
<text x="133.3" y="97.0" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >45</text>
<text x="133.3" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >A</text>
<rect x="191.4" y="235.0" width="57.2" height="165.0" rx="5" fill="#c39859"/>
<text x="220.0" y="229.0" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >25</text>
<text x="220.0" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >B</text>
<rect x="278.1" y="320.8" width="57.2" height="79.2" rx="5" fill="#92ac93"/>
<text x="306.7" y="314.8" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >12</text>
<text x="306.7" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >C</text>
<rect x="364.7" y="347.2" width="57.2" height="52.8" rx="5" fill="#61c0cc"/>
<text x="393.3" y="341.2" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >8</text>
<text x="393.3" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >D</text>
<rect x="451.4" y="360.4" width="57.2" height="39.6" rx="5" fill="#43c3c4"/>
<text x="480.0" y="354.4" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >6</text>
<text x="480.0" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >E</text>
<rect x="538.1" y="373.6" width="57.2" height="26.4" rx="5" fill="#30bc9a"/>
<text x="566.7" y="367.6" font-size="13" text-anchor="middle" fill="#1c2333" font-weight="600" >4</text>
<text x="566.7" y="419.0" font-size="15" text-anchor="middle" fill="#1c2333" font-weight="normal" >Other</text>
<line x1="90" y1="136.0" x2="610" y2="136.0" stroke="#d6336c" stroke-width="2" stroke-dasharray="7 5"/>
<polyline fill="none" stroke="#1c2333" stroke-width="2.5" points="133.3,251.5 220.0,169.0 306.7,129.4 393.3,103.0 480.0,83.2 566.7,70.0"/>
<circle cx="133.3" cy="251.5" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<circle cx="220.0" cy="169.0" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<circle cx="306.7" cy="129.4" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<circle cx="393.3" cy="103.0" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<circle cx="480.0" cy="83.2" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<circle cx="566.7" cy="70.0" r="5" fill="#ffffff" stroke="#1c2333" stroke-width="2.5"/>
<text x="30.0" y="235.0" font-size="15" text-anchor="middle" fill="#5b6475" font-weight="600" transform="rotate(-90 30 235.0)">Count (or cost)</text>
<text x="676.0" y="235.0" font-size="15" text-anchor="middle" fill="#5b6475" font-weight="600" transform="rotate(90 676 235.0)">Cumulative %</text>
<path d="M94.0,442 v8 H346.0 v-8" fill="none" stroke="#d6336c" stroke-width="2"/>
<text x="220.0" y="470.0" font-size="15" text-anchor="middle" fill="#d6336c" font-weight="700" >Vital few: 3 causes, 82%</text>
<path d="M354.0,442 v8 H606.0 v-8" fill="none" stroke="#5b6475" stroke-width="2"/>
<text x="480.0" y="470.0" font-size="15" text-anchor="middle" fill="#5b6475" font-weight="700" >Useful many: 18%</text>
<line x1="413.3" y1="171.8" x2="436.7" y2="96.1" stroke="#1c2333" stroke-width="1.3"/>
<text x="353.3" y="188.8" font-size="15" text-anchor="start" fill="#1c2333" font-weight="700" >Cumulative line:</text>
<text x="353.3" y="207.8" font-size="15" text-anchor="start" fill="#1c2333" font-weight="normal" >rises fast,</text>
<text x="353.3" y="226.8" font-size="15" text-anchor="start" fill="#1c2333" font-weight="normal" >then flattens</text>
<line x1="656" y1="136.0" x2="704" y2="136.0" stroke="#d6336c" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="710.0" y="141.0" font-size="15" text-anchor="start" fill="#d6336c" font-weight="700" >80% reference line:</text>
<text x="710.0" y="160.0" font-size="15" text-anchor="start" fill="#d6336c" font-weight="normal" >where the cumulative</text>
<text x="710.0" y="179.0" font-size="15" text-anchor="start" fill="#d6336c" font-weight="normal" >line crosses it is</text>
<text x="710.0" y="198.0" font-size="15" text-anchor="start" fill="#d6336c" font-weight="normal" >the cut-off</text>
<line x1="704" y1="315" x2="490.0" y2="350.4" stroke="#1c2333" stroke-width="1.3"/>
<circle cx="490.0" cy="350.4" r="3" fill="#1c2333"/>
<text x="710.0" y="320.0" font-size="15" text-anchor="start" fill="#1c2333" font-weight="700" >Bars sorted from</text>
<text x="710.0" y="339.0" font-size="15" text-anchor="start" fill="#1c2333" font-weight="normal" >largest to smallest,</text>
<text x="710.0" y="358.0" font-size="15" text-anchor="start" fill="#1c2333" font-weight="normal" >“Other” always last</text>
</svg>
