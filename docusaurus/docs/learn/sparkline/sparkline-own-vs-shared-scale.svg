<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The same sparklines on their own scales and on one shared scale</title>
<desc id="d">Three pumps' flow rates drawn twice. On the left each row has its own vertical scale: Pump A, which rose by 4 litres a minute, looks the same as Pump B, which rose by 40, and Pump C's small random wobble looks like a dramatic zigzag. On the right all rows share one scale from 95 to 145 litres a minute: Pump B's rise stands out, Pump A is almost flat and Pump C is a flat line.</desc>
