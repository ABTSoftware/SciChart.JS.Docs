<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-labelledby="t d">
<title id="t">Where an activation function sits in a neural network unit</title>
<desc id="d">Three inputs are multiplied by weights and summed with a bias to give a pre-activation z. The activation function f bends z into the unit's output a, which feeds the next layer. Below, two stacked linear layers, y = 2x + 1 then z = 3y − 4, collapse into one line z = 6x − 1, while putting a ReLU between them gives a bent line.</desc>
<rect width="860" height="490" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a78"/></marker></defs>
<circle cx="70" cy="60" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/>
<text x="70" y="66" font-size="17" text-anchor="middle" fill="#1d3557">x₁</text>
<line x1="92" y1="60" x2="262" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="150" y="73.0" font-size="15" fill="#4a5a78">w₁</text>
<circle cx="70" cy="120" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/>
<text x="70" y="126" font-size="17" text-anchor="middle" fill="#1d3557">x₂</text>
<line x1="92" y1="120" x2="262" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="150" y="112.0" font-size="15" fill="#4a5a78">w₂</text>
<circle cx="70" cy="180" r="22" fill="#e8f4fb" stroke="#2b7bb9" stroke-width="2"/>
<text x="70" y="186" font-size="17" text-anchor="middle" fill="#1d3557">x₃</text>
<line x1="92" y1="180" x2="262" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="150" y="151.0" font-size="15" fill="#4a5a78">w₃</text>
<circle cx="292" cy="120" r="30" fill="#fff4e6" stroke="#e07b00" stroke-width="2.2"/>
<text x="292" y="129" font-size="26" text-anchor="middle" fill="#7a3e00">Σ</text>
<text x="292" y="180" font-size="15" text-anchor="middle" fill="#333">+ bias b</text>
<line x1="322" y1="120" x2="420" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="371" y="110" font-size="17" text-anchor="middle" fill="#1d3557" font-style="italic">z</text>
<rect x="424" y="72" width="130" height="96" rx="12" fill="#eef8f0" stroke="#2a9d5c" stroke-width="2.2"/>
<line x1="438" y1="150" x2="540" y2="150" stroke="#b8c4d6"/><line x1="489" y1="84" x2="489" y2="160" stroke="#b8c4d6"/>
<polyline points="438.0,150.1 440.6,150.1 443.1,150.2 445.6,150.2 448.2,150.3 450.8,150.5 453.3,150.6 455.9,150.8 458.4,151.1 460.9,151.4 463.5,151.7 466.1,152.0 468.6,152.3 471.1,152.6 473.7,152.8 476.2,152.9 478.8,152.8 481.4,152.5 483.9,151.9 486.4,151.1 489.0,150.0 491.6,148.6 494.1,146.8 496.6,144.8 499.2,142.6 501.8,140.1 504.3,137.5 506.9,134.8 509.4,131.9 511.9,129.1 514.5,126.2 517.0,123.3 519.6,120.5 522.1,117.7 524.7,114.9 527.2,112.2 529.8,109.5 532.4,106.9 534.9,104.3 537.5,101.7 540.0,99.1" fill="none" stroke="#2a9d5c" stroke-width="3"/>
<text x="489" y="64" font-size="15" text-anchor="middle" fill="#1f6b3f">activation f</text>
<line x1="554" y1="120" x2="660" y2="120" stroke="#4a5a78" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="607" y="110" font-size="17" text-anchor="middle" fill="#1d3557" font-style="italic">a = f(z)</text>
<rect x="664" y="88" width="160" height="64" rx="10" fill="#f3f0fa" stroke="#6a4fb3" stroke-width="2"/>
<text x="744" y="116" font-size="15" text-anchor="middle" fill="#3d2a7a">next layer</text>
<text x="744" y="138" font-size="13" text-anchor="middle" fill="#3d2a7a">(or the output)</text>
<text x="292" y="216" font-size="14" text-anchor="middle" fill="#555">z = w₁x₁ + w₂x₂ + w₃x₃ + b</text>
<text x="489" y="196" font-size="14" text-anchor="middle" fill="#555">the only non-linear step</text>
<line x1="30" y1="240" x2="830" y2="240" stroke="#e3e8f0" stroke-width="2"/>
<text x="220" y="272" font-size="16" text-anchor="middle" fill="#222" font-weight="600">Two linear layers: still one straight line</text>
<line x1="80" y1="380" x2="360" y2="380" stroke="#b8c4d6"/><line x1="220" y1="290" x2="220" y2="455" stroke="#b8c4d6"/>
<text x="120" y="398" font-size="12" text-anchor="middle" fill="#777">-2</text>
<text x="170" y="398" font-size="12" text-anchor="middle" fill="#777">-1</text>
<text x="270" y="398" font-size="12" text-anchor="middle" fill="#777">1</text>
<text x="320" y="398" font-size="12" text-anchor="middle" fill="#777">2</text>
<text x="362" y="374" font-size="13" fill="#777" text-anchor="end">x</text>
<polyline points="168.0,445.2 171.2,441.6 174.5,438.1 177.8,434.6 181.0,431.1 184.2,427.6 187.5,424.1 190.8,420.6 194.0,417.1 197.2,413.6 200.5,410.1 203.8,406.6 207.0,403.0 210.2,399.5 213.5,396.0 216.8,392.5 220.0,389.0 223.2,385.5 226.5,382.0 229.8,378.5 233.0,375.0 236.2,371.4 239.5,367.9 242.8,364.4 246.0,360.9 249.2,357.4 252.5,353.9 255.8,350.4 259.0,346.9 262.2,343.4 265.5,339.9 268.8,336.3 272.0,332.8 275.2,329.3 278.5,325.8 281.8,322.3 285.0,318.8 288.2,315.3 291.5,311.8 294.8,308.3 298.0,304.8 301.2,301.2" fill="none" stroke="#2b7bb9" stroke-width="3"/>
<text x="220" y="478" font-size="14" text-anchor="middle" fill="#333">y = 2x + 1, then z = 3y − 4  →  z = 6x − 1</text>
<text x="630" y="272" font-size="16" text-anchor="middle" fill="#222" font-weight="600">The same layers with ReLU between them</text>
<line x1="490" y1="380" x2="770" y2="380" stroke="#b8c4d6"/><line x1="630" y1="290" x2="630" y2="455" stroke="#b8c4d6"/>
<text x="530" y="398" font-size="12" text-anchor="middle" fill="#777">-2</text>
<text x="580" y="398" font-size="12" text-anchor="middle" fill="#777">-1</text>
<text x="680" y="398" font-size="12" text-anchor="middle" fill="#777">1</text>
<text x="730" y="398" font-size="12" text-anchor="middle" fill="#777">2</text>
<text x="772" y="374" font-size="13" fill="#777" text-anchor="end">x</text>
<polyline points="500.0,416.0 503.2,416.0 506.5,416.0 509.8,416.0 513.0,416.0 516.2,416.0 519.5,416.0 522.8,416.0 526.0,416.0 529.2,416.0 532.5,416.0 535.8,416.0 539.0,416.0 542.2,416.0 545.5,416.0 548.8,416.0 552.0,416.0 555.2,416.0 558.5,416.0 561.8,416.0 565.0,416.0 568.2,416.0 571.5,416.0 574.8,416.0 578.0,416.0 581.2,416.0 584.5,416.0 587.8,416.0 591.0,416.0 594.2,416.0 597.5,416.0 600.8,416.0 604.0,416.0 607.2,413.6 610.5,410.1 613.8,406.6 617.0,403.0 620.2,399.5 623.5,396.0 626.8,392.5 630.0,389.0 633.2,385.5 636.5,382.0 639.8,378.5 643.0,375.0 646.2,371.4 649.5,367.9 652.8,364.4 656.0,360.9 659.2,357.4 662.5,353.9 665.8,350.4 669.0,346.9 672.2,343.4 675.5,339.9 678.8,336.3 682.0,332.8 685.2,329.3 688.5,325.8 691.8,322.3 695.0,318.8 698.2,315.3 701.5,311.8 704.8,308.3 708.0,304.8 711.2,301.2" fill="none" stroke="#2a9d5c" stroke-width="3"/>
<text x="630" y="478" font-size="14" text-anchor="middle" fill="#333">z = 3·max(0, 2x + 1) − 4  →  a bend at x = −0.5</text>
</g></svg>