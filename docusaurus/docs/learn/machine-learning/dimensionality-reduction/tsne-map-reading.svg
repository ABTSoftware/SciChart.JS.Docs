<title id="t2">What a t-SNE map keeps and what it changes</title>
<desc id="d2">Left: three groups in the original data, a tight small blue group, a wide orange group and a green group far away from both. Right: the same groups in a t-SNE map, where all three come out about the same size and roughly evenly spaced. Callouts: 1, neighbours stay together; 2, cluster sizes are evened out; 3, the gaps between clusters are not to scale; 4, the axes have no units or meaning.</desc>
