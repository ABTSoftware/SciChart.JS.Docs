<title id="t">PCA on five points: finding the first principal component</title>
<desc id="d">Left: five points with x from 1 to 5 and y equal to 2, 1, 4, 3, 5, their mean at (3, 3), the first principal component as a long arrow along the diagonal and the second as a short arrow across it, with each point projected onto the first component. Right: the one-dimensional result, the PC1 scores on a number line at minus 2.12 (two points), 0.71 (two points) and 2.83, with the variance of each component: 4.5 (90%) and 0.5 (10%).</desc>
