<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>How an isolation forest isolates an anomaly with few random splits</title>
<desc>Left: a scatter of about sixty readings in a cluster, plus one reading far to the upper right. Two random cuts, a vertical cut numbered 1 and a horizontal cut numbered 2, are enough to put the far reading in a box of its own, while the few cluster readings on the same side of cut 1 need more; a reading in the middle of the cluster needs many more cuts. Right: the same cuts drawn as a tree. The far reading ends at depth 2, the cluster reading at a path length of about 9. The anomaly score is 2 to the power of minus the average depth divided by c of n, so a short average depth gives a score near 1.</desc>
