<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" width="900" height="312" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>The three types of anomaly: point, contextual and collective</title>
<desc>Three small time series charts. Left: a noisy flat signal with one reading far above the rest, marked as a point anomaly. Middle: a daily cycle where a reading at night sits at the usual daytime level, normal in value but abnormal for the time, marked as a contextual anomaly. Right: a daily cycle where one whole day stays flat; no single reading is out of range but the run of readings together is abnormal, marked as a collective anomaly.</desc>
<rect width="900" height="312" fill="#ffffff"/>
<text x="150" y="28" font-size="19" font-weight="600" fill="#1a2b4a" text-anchor="middle">Point anomaly</text>
<text x="150" y="50" font-size="14" fill="#444" text-anchor="middle">One reading is far from all the others</text>
<line x1="20" y1="250" x2="280" y2="250" stroke="#555" stroke-width="1.5"/>
<line x1="20" y1="60" x2="20" y2="250" stroke="#555" stroke-width="1.5"/>
<text x="150" y="272" font-size="14" fill="#444" text-anchor="middle">time</text>
<text x="450" y="28" font-size="19" font-weight="600" fill="#1a2b4a" text-anchor="middle">Contextual anomaly</text>
<text x="450" y="50" font-size="14" fill="#444" text-anchor="middle">A normal value at the wrong time</text>
<line x1="320" y1="250" x2="580" y2="250" stroke="#555" stroke-width="1.5"/>
<line x1="320" y1="60" x2="320" y2="250" stroke="#555" stroke-width="1.5"/>
<text x="450" y="272" font-size="14" fill="#444" text-anchor="middle">time</text>
<text x="750" y="28" font-size="19" font-weight="600" fill="#1a2b4a" text-anchor="middle">Collective anomaly</text>
<text x="750" y="50" font-size="14" fill="#444" text-anchor="middle">Each reading is normal; the run is not</text>
<line x1="620" y1="250" x2="880" y2="250" stroke="#555" stroke-width="1.5"/>
<line x1="620" y1="60" x2="620" y2="250" stroke="#555" stroke-width="1.5"/>
<text x="750" y="272" font-size="14" fill="#444" text-anchor="middle">time</text>
