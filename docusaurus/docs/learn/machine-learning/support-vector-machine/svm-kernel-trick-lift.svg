<text x="600" y="34" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">2. Lifted (side view): a flat plane separates</text>
<line x1="440.0" y1="330.0" x2="760.0" y2="330.0" stroke="#8A94A8"/><line x1="600.0" y1="330.0" x2="600.0" y2="61.2" stroke="#8A94A8"/>
