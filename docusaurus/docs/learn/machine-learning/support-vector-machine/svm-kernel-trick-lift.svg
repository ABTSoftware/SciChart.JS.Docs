<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t2 d2" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t2">The kernel trick, worked example</title>
<desc id="d2">Left: in two dimensions, four orange points at radius 0.5 sit inside four blue points at radius 1, and no straight line separates them. Right: a side view after lifting each point to height z = x1 squared plus x2 squared. The orange points rise to 0.25 and the blue points to 1, on a parabola. A flat plane at z = 0.625 now separates them, with margins at 0.25 and 1, a margin width of 0.75. The plane meets the parabola at x1 = plus or minus 0.79, which back in two dimensions is a dashed circle of radius 0.79.</desc>
