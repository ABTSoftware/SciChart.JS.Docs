<circle cx="590.0" cy="52.0" r="11" fill="#1F2A44"/><text x="590.0" y="56.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="608" y="57" font-size="14" font-weight="600" fill="#1F2A44">Hyperplane (decision boundary)</text>
<text x="608" y="76" font-size="12.5" fill="#4A556B">f(x) = w·x + b = 0</text>
<circle cx="590.0" cy="114.0" r="11" fill="#1F2A44"/><text x="590.0" y="118.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="608" y="119" font-size="14" font-weight="600" fill="#1F2A44">Margins</text>
<text x="608" y="138" font-size="12.5" fill="#4A556B">f(x) = +1 and f(x) = −1</text>
<circle cx="590.0" cy="176.0" r="11" fill="#1F2A44"/><text x="590.0" y="180.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="608" y="181" font-size="14" font-weight="600" fill="#1F2A44">Support vectors</text>
<text x="608" y="200" font-size="12.5" fill="#4A556B">points on or inside the margins</text>
<circle cx="590.0" cy="238.0" r="11" fill="#1F2A44"/><text x="590.0" y="242.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="608" y="243" font-size="14" font-weight="600" fill="#1F2A44">Weight vector w</text>
<text x="608" y="262" font-size="12.5" fill="#4A556B">at right angles to the hyperplane</text>
<circle cx="590.0" cy="300.0" r="11" fill="#1F2A44"/><text x="590.0" y="304.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="608" y="305" font-size="14" font-weight="600" fill="#1F2A44">Margin width</text>
<text x="608" y="324" font-size="12.5" fill="#4A556B">2 / ‖w‖, which training maximises</text>
<circle cx="590.0" cy="362.0" r="11" fill="#1F2A44"/><text x="590.0" y="366.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="608" y="367" font-size="14" font-weight="600" fill="#1F2A44">Slack ξ (soft margin)</text>
<text x="608" y="386" font-size="12.5" fill="#4A556B">inside the band: 0 &lt; ξ &lt; 1; wrong side: ξ &gt; 1</text>
