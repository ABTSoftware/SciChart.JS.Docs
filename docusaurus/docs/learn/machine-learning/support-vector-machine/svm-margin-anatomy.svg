<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t1 d1" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t1">Anatomy of a support vector machine</title>
<desc id="d1">Two classes of points separated by a solid line, the hyperplane where f(x) = 0. Dashed lines on each side mark the margins at f(x) = +1 and -1. Three points lie on the dashed lines and are circled as support vectors. An arrow perpendicular to the hyperplane shows the weight vector w, and a bracket across the band gives its width, 2 divided by the length of w. One point sits inside the band and another on the wrong side, each with a slack value, as allowed by a soft margin.</desc>
