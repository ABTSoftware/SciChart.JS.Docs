<rect width="260" height="180" rx="6" fill="none" stroke="#8A97AB" stroke-width="1"/>
<text x="130.0" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#1B2A41">Naive Bayes, QDA</text>
<text x="130.0" y="228" text-anchor="middle" font-size="15" fill="#3C4A60">a curve from two bell shapes</text>
