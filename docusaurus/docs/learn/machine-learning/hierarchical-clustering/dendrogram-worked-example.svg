<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Five points and their complete-linkage dendrogram</title>
  <desc>Left: five points A to E on a grid, with A and B close together on the left, C and D close together in the middle and E on the right. Right: the dendrogram built from them with complete linkage. A and B join at height 2, C and D at 3, E joins C and D at 5, and the two groups join at 10.44. A dashed cut line at height 4 crosses three vertical branches, giving three clusters: A and B, C and D, and E.</desc>
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Left panel: the points -->
  <text x="40" y="30" font-size="16" font-weight="600" fill="#1f2a44">1. Five points</text>
  <g stroke="#e3e8f0" stroke-width="1">
    <line x1="60" y1="300" x2="340" y2="300"/><line x1="60" y1="272" x2="340" y2="272"/><line x1="60" y1="244" x2="340" y2="244"/><line x1="60" y1="216" x2="340" y2="216"/><line x1="60" y1="188" x2="340" y2="188"/>
    <line x1="60" y1="188" x2="60" y2="300"/><line x1="116" y1="188" x2="116" y2="300"/><line x1="172" y1="188" x2="172" y2="300"/><line x1="228" y1="188" x2="228" y2="300"/><line x1="284" y1="188" x2="284" y2="300"/><line x1="340" y1="188" x2="340" y2="300"/>
  </g>
  <g font-size="12" fill="#5b6780" text-anchor="middle">
    <text x="60" y="318">0</text><text x="116" y="318">2</text><text x="172" y="318">4</text><text x="228" y="318">6</text><text x="284" y="318">8</text><text x="340" y="318">10</text>
  </g>
  <g font-size="12" fill="#5b6780" text-anchor="end">
    <text x="30" y="304">0</text><text x="30" y="248">2</text><text x="30" y="192">4</text>
  </g>
  <!-- cluster outlines for the cut at height 4 -->
  <ellipse cx="60" cy="272" rx="20" ry="44" fill="#2a7fd4" fill-opacity="0.10" stroke="#2a7fd4" stroke-width="1.5"/>
  <ellipse cx="228" cy="258" rx="20" ry="58" fill="#e07a10" fill-opacity="0.10" stroke="#e07a10" stroke-width="1.5"/>
  <circle cx="340" cy="216" r="20" fill="#2e9e57" fill-opacity="0.10" stroke="#2e9e57" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="60" cy="300" r="7" fill="#2a7fd4"/><circle cx="60" cy="244" r="7" fill="#2a7fd4"/>
    <circle cx="228" cy="300" r="7" fill="#e07a10"/><circle cx="228" cy="216" r="7" fill="#e07a10"/>
    <circle cx="340" cy="216" r="7" fill="#2e9e57"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1f2a44">
    <text x="86" y="305">A (0, 0)</text><text x="86" y="249">B (0, 2)</text>
    <text x="252" y="305">C (6, 0)</text><text x="252" y="221">D (6, 3)</text>
    <text x="300" y="186">E (10, 3)</text>
  </g>
  <text x="40" y="356" font-size="13" fill="#1f2a44">Smallest distances: A–B 2, C–D 3, D–E 4, C–E 5.</text>
  <text x="40" y="376" font-size="13" fill="#1f2a44">The cut at height 4 (right) crosses three</text>
  <text x="40" y="394" font-size="13" fill="#1f2a44">branches, giving these three clusters.</text>

  <!-- Right panel: the dendrogram -->
  <text x="420" y="30" font-size="16" font-weight="600" fill="#1f2a44">2. Complete-linkage dendrogram</text>
  <line x1="440" y1="60" x2="440" y2="330" stroke="#5b6780" stroke-width="1"/>
  <g font-size="12" fill="#5b6780" text-anchor="end">
    <text x="434" y="334">0</text><text x="434" y="285">2</text><text x="434" y="236">4</text><text x="434" y="187">6</text><text x="434" y="138">8</text><text x="434" y="89">10</text>
  </g>
  <g stroke="#5b6780" stroke-width="1"><line x1="436" y1="330" x2="440" y2="330"/><line x1="436" y1="281" x2="440" y2="281"/><line x1="436" y1="232" x2="440" y2="232"/><line x1="436" y1="183" x2="440" y2="183"/><line x1="436" y1="134" x2="440" y2="134"/><line x1="436" y1="85" x2="440" y2="85"/></g>
  <text x="404" y="200" font-size="13" fill="#1f2a44" transform="rotate(-90 404 200)" text-anchor="middle">Merge height (distance)</text>
  <g fill="none" stroke-width="3">
    <path d="M480 330 V281 H540 V330" stroke="#2a7fd4"/>
    <path d="M610 330 V256.5 H670 V330" stroke="#e07a10"/>
    <path d="M640 256.5 V207.5 H740 V330" stroke="#8a96ad"/>
    <path d="M510 281 V74 H690 V207.5" stroke="#8a96ad"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1f2a44" text-anchor="middle">
    <text x="480" y="350">A</text><text x="540" y="350">B</text><text x="610" y="350">C</text><text x="670" y="350">D</text><text x="740" y="350">E</text>
  </g>
  <g font-size="12" fill="#1f2a44">
    <text x="546" y="277">2</text><text x="676" y="252">3</text><text x="746" y="203">5</text><text x="696" y="70">10.44</text>
  </g>
  <!-- cut line -->
  <line x1="445" y1="232" x2="785" y2="232" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="522" y="226" font-size="13" fill="#c0392b">cut at 4</text>
  <!-- callouts -->
  <g font-size="12" fill="#1f2a44">
    <circle cx="532" cy="112" r="10" fill="#1f2a44"/><text x="532" y="116" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
    <text x="548" y="110">tallest join: the two</text><text x="548" y="125">groups are far apart</text>
    <circle cx="452" cy="374" r="10" fill="#1f2a44"/><text x="452" y="378" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
    <text x="468" y="378">leaves: one per point, in tree order</text>
  </g>
  <text x="420" y="404" font-size="13" fill="#1f2a44">Join height = distance between the merged clusters.</text>
</svg>
