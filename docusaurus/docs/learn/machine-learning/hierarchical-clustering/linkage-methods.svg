<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Four linkage methods measuring the distance between the same two clusters</title>
  <desc>Four panels show the same two clusters, three points on the left and four on the right. Single linkage uses the shortest line between them, complete linkage the longest, average linkage the mean of all twelve lines between them, and Ward's method the centroids of the clusters and how much the spread grows if they merge.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <defs>
    <g id="pts">
      <ellipse cx="87" cy="88" rx="48" ry="45" fill="#2a7fd4" fill-opacity="0.08" stroke="#2a7fd4" stroke-width="1"/>
      <ellipse cx="260" cy="105" rx="52" ry="52" fill="#e07a10" fill-opacity="0.08" stroke="#e07a10" stroke-width="1"/>
      <g stroke="#ffffff" stroke-width="1.5">
        <circle cx="60" cy="90" r="7" fill="#2a7fd4"/><circle cx="90" cy="60" r="7" fill="#2a7fd4"/><circle cx="110" cy="115" r="7" fill="#2a7fd4"/>
        <circle cx="230" cy="70" r="7" fill="#e07a10"/><circle cx="260" cy="110" r="7" fill="#e07a10"/><circle cx="290" cy="80" r="7" fill="#e07a10"/><circle cx="250" cy="140" r="7" fill="#e07a10"/>
      </g>
    </g>
  </defs>

  <!-- Single -->
  <g transform="translate(20 40)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#1f2a44">Single linkage</text>
    <line x1="110" y1="115" x2="230" y2="70" stroke="#2e9e57" stroke-width="3"/>
    <use href="#pts"/>
    <text x="0" y="180" font-size="13" fill="#1f2a44">Distance = the closest pair of points.</text>
    <text x="0" y="198" font-size="13" fill="#5b6780">Follows long, thin shapes; chains through noise.</text>
  </g>
  <!-- Complete -->
  <g transform="translate(420 40)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#1f2a44">Complete linkage</text>
    <line x1="60" y1="90" x2="290" y2="80" stroke="#c0392b" stroke-width="3"/>
    <use href="#pts"/>
    <text x="0" y="180" font-size="13" fill="#1f2a44">Distance = the farthest pair of points.</text>
    <text x="0" y="198" font-size="13" fill="#5b6780">Compact clusters of similar diameter.</text>
  </g>
  <!-- Average -->
  <g transform="translate(20 270)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#1f2a44">Average linkage</text>
    <g stroke="#7a52c7" stroke-width="1.2" stroke-opacity="0.7">
      <line x1="60" y1="90" x2="230" y2="70"/><line x1="60" y1="90" x2="260" y2="110"/><line x1="60" y1="90" x2="290" y2="80"/><line x1="60" y1="90" x2="250" y2="140"/>
      <line x1="90" y1="60" x2="230" y2="70"/><line x1="90" y1="60" x2="260" y2="110"/><line x1="90" y1="60" x2="290" y2="80"/><line x1="90" y1="60" x2="250" y2="140"/>
      <line x1="110" y1="115" x2="230" y2="70"/><line x1="110" y1="115" x2="260" y2="110"/><line x1="110" y1="115" x2="290" y2="80"/><line x1="110" y1="115" x2="250" y2="140"/>
    </g>
    <use href="#pts"/>
    <text x="0" y="180" font-size="13" fill="#1f2a44">Distance = the mean of all 3 × 4 = 12 pairs.</text>
    <text x="0" y="198" font-size="13" fill="#5b6780">A middle way; less swayed by one stray point.</text>
  </g>
  <!-- Ward -->
  <g transform="translate(420 270)">
    <text x="0" y="0" font-size="16" font-weight="600" fill="#1f2a44">Ward's method</text>
    <use href="#pts"/>
    <line x1="87" y1="88" x2="257" y2="100" stroke="#1f2a44" stroke-width="2" stroke-dasharray="6 4"/>
    <g stroke="#1f2a44" stroke-width="3"><path d="M80 81 L94 95 M94 81 L80 95"/><path d="M250 93 L264 107 M264 93 L250 107"/></g>
    <text x="0" y="180" font-size="13" fill="#1f2a44">Cost = how much the spread around the centroid (×)</text>
    <text x="0" y="198" font-size="13" fill="#1f2a44">grows if the two merge. Even, round clusters.</text>
  </g>
</svg>
