<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="t2 d2">
<title id="t2">How the threshold splits two score distributions</title>
<desc id="d2">Score distributions of negative cases (left) and positive cases (right) overlap. A vertical threshold line splits them: positives above it are true positives, negatives above it are false positives, positives below it are false negatives and negatives below it are true negatives. Moving the threshold left raises both the true and false positive rates.</desc>
