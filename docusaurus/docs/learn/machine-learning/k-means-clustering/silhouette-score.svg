<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t2 d2">
<title id="t2">How the silhouette of one point is computed</title>
<desc id="d2">Three clusters. One point i in the blue cluster has solid lines to the other blue points, whose mean length is a = 1.36, and dashed lines to the orange cluster, the nearest other cluster, whose mean length is b = 4.68. A third, green cluster is further away (mean 5.68) and is ignored. The silhouette is s = (b − a) / max(a, b) = 0.71. A scale from −1 to 1 shows: near 1, well inside its cluster; near 0, on a boundary; below 0, probably in the wrong cluster.</desc>
<rect width="760" height="440" fill="white"/>
<line x1="110" y1="300.0" x2="78.0" y2="252.0" stroke="#1F77B4" stroke-width="2"/>
<line x1="110" y1="300.0" x2="134.0" y2="236.0" stroke="#1F77B4" stroke-width="2"/>
<line x1="110" y1="300.0" x2="90.0" y2="332.0" stroke="#1F77B4" stroke-width="2"/>
<line x1="110" y1="300.0" x2="278.0" y2="284.0" stroke="#E8590C" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="110" y1="300.0" x2="310" y2="244.0" stroke="#E8590C" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="110" y1="300.0" x2="294.0" y2="324.0" stroke="#E8590C" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="110" cy="300.0" r="8" fill="#1F77B4"/>
<circle cx="78.0" cy="252.0" r="8" fill="#1F77B4"/>
<circle cx="134.0" cy="236.0" r="8" fill="#1F77B4"/>
<circle cx="90.0" cy="332.0" r="8" fill="#1F77B4"/>
<circle cx="278.0" cy="284.0" r="8" fill="#E8590C"/>
<circle cx="310" cy="244.0" r="8" fill="#E8590C"/>
<circle cx="294.0" cy="324.0" r="8" fill="#E8590C"/>
<circle cx="198.0" cy="116.00000000000001" r="8" fill="#2F9E44"/>
<circle cx="238.0" cy="92.00000000000003" r="8" fill="#2F9E44"/>
<circle cx="174.0" cy="76.00000000000001" r="8" fill="#2F9E44"/>
<circle cx="110" cy="300.0" r="12" fill="none" stroke="#1F2937" stroke-width="2.5"/>
<text x="32" y="305.0" font-size="15" font-weight="600" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">point i</text>
<text x="54.0" y="204.0" font-size="14" fill="#1F77B4" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">own cluster</text>
<text x="270" y="212.0" font-size="14" fill="#E8590C" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">nearest other cluster</text>
<text x="254.0" y="63.999999999999986" font-size="14" fill="#2F9E44" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">further cluster: ignored</text>
<text x="430" y="80" font-size="15" fill="#1F77B4" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan font-weight="600">a = 1.36</tspan>  mean of the solid lines</text>
<text x="430" y="108" font-size="15" fill="#E8590C" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan font-weight="600">b = 4.68</tspan>  mean of the dashed lines</text>
<text x="430" y="130" font-size="13" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">(green cluster: mean 5.68, larger, so not b)</text>
<text x="430" y="172" font-size="17" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">s = (b − a) / max(a, b)</text>
<text x="430" y="198" font-size="17" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">  = (4.68 − 1.36) / 4.68 = <tspan font-weight="600">0.71</tspan></text>
<line x1="430" y1="270" x2="730" y2="270" stroke="#1F2937" stroke-width="2"/>
<line x1="430.0" y1="264" x2="430.0" y2="276" stroke="#1F2937" stroke-width="2"/><text x="430.0" y="294" font-size="14" text-anchor="middle" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">−1</text>
<line x1="580.0" y1="264" x2="580.0" y2="276" stroke="#1F2937" stroke-width="2"/><text x="580.0" y="294" font-size="14" text-anchor="middle" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text>
<line x1="730.0" y1="264" x2="730.0" y2="276" stroke="#1F2937" stroke-width="2"/><text x="730.0" y="294" font-size="14" text-anchor="middle" fill="#1F2937" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1</text>
<path d="M686.2881839529373,262 l-7,-12 h14 z" fill="#1F77B4"/><text x="686.2881839529373" y="244" font-size="13" text-anchor="middle" fill="#1F77B4" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">point i</text>
<text x="430" y="320" font-size="13" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">below 0: closer to</text><text x="430" y="336" font-size="13" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">another cluster</text>
<text x="580.0" y="320" font-size="13" text-anchor="middle" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">near 0: on</text><text x="580.0" y="336" font-size="13" text-anchor="middle" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">a boundary</text>
<text x="730" y="320" font-size="13" text-anchor="end" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">near 1: well inside</text><text x="730" y="336" font-size="13" text-anchor="end" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">its own cluster</text>
<text x="430" y="390" font-size="13" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">The silhouette score of a clustering is the mean</text><text x="430" y="408" font-size="13" fill="#374151" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">of s over every point.</text>
</svg>