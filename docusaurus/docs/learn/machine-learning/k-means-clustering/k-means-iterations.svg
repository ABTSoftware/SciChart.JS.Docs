<title id="t">K-means on six points: start, first iteration and convergence</title>
<desc id="d">Three panels. Panel 1: six grey points P1 to P6 and two starting centroids placed on P1 and P3. Panel 2: points are assigned to the nearest centroid (P1 and P2 blue, P3 to P6 orange), with the dashed boundary halfway between the centroids; arrows move the centroids to the means (1.5, 1.5) and (5, 4.5); inertia falls from 66 to 20. Panel 3: P3 switches to blue; the centroids move to (1.67, 2) and (6, 5), no point changes again, and the inertia is 6.67.</desc>
