<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The parts of a combo chart</title>
<desc>A combo chart of a warehouse's monthly shipments as columns against a left axis and its average dispatch time as a line against a right axis. Numbered markers point to the shared x-axis, the left axis for the columns, the right axis for the line, the legend, and the point where the line crosses the columns, which has no meaning.</desc>
<rect width="760" height="560" fill="#FFFFFF"/>
<rect x="120" y="22" width="18" height="14" rx="3" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<text x="144" y="34" font-size="14" fill="#1F2A3C">Shipments (left axis)</text>
<line x1="310" y1="29" x2="336" y2="29" stroke="#D9650B" stroke-width="3"/>
<circle cx="323" cy="29" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<text x="344" y="34" font-size="14" fill="#1F2A3C">Average dispatch time (right axis)</text>
<line x1="110" y1="340.0" x2="650" y2="340.0" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="344.0" text-anchor="end" font-size="13" fill="#2A9DBA">0</text>
<line x1="110" y1="301.4" x2="650" y2="301.4" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="305.4" text-anchor="end" font-size="13" fill="#2A9DBA">1,000</text>
<line x1="110" y1="262.9" x2="650" y2="262.9" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="266.9" text-anchor="end" font-size="13" fill="#2A9DBA">2,000</text>
<line x1="110" y1="224.3" x2="650" y2="224.3" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="228.3" text-anchor="end" font-size="13" fill="#2A9DBA">3,000</text>
<line x1="110" y1="185.7" x2="650" y2="185.7" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="189.7" text-anchor="end" font-size="13" fill="#2A9DBA">4,000</text>
<line x1="110" y1="147.1" x2="650" y2="147.1" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="151.1" text-anchor="end" font-size="13" fill="#2A9DBA">5,000</text>
<line x1="110" y1="108.6" x2="650" y2="108.6" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="112.6" text-anchor="end" font-size="13" fill="#2A9DBA">6,000</text>
<line x1="110" y1="70.0" x2="650" y2="70.0" stroke="#E3E7EE" stroke-width="1"/>
<text x="102" y="74.0" text-anchor="end" font-size="13" fill="#2A9DBA">7,000</text>
<line x1="650" y1="340.0" x2="655" y2="340.0" stroke="#D9650B" stroke-width="1.5"/>
<text x="659" y="344.0" font-size="13" fill="#D9650B">0 h</text>
<line x1="650" y1="272.5" x2="655" y2="272.5" stroke="#D9650B" stroke-width="1.5"/>
<text x="659" y="276.5" font-size="13" fill="#D9650B">10 h</text>
<line x1="650" y1="205.0" x2="655" y2="205.0" stroke="#D9650B" stroke-width="1.5"/>
<text x="659" y="209.0" font-size="13" fill="#D9650B">20 h</text>
<line x1="650" y1="137.5" x2="655" y2="137.5" stroke="#D9650B" stroke-width="1.5"/>
<text x="659" y="141.5" font-size="13" fill="#D9650B">30 h</text>
<line x1="650" y1="70.0" x2="655" y2="70.0" stroke="#D9650B" stroke-width="1.5"/>
<text x="659" y="74.0" font-size="13" fill="#D9650B">40 h</text>
<line x1="110" y1="70" x2="110" y2="340" stroke="#2A9DBA" stroke-width="2"/>
<line x1="650" y1="70" x2="650" y2="340" stroke="#D9650B" stroke-width="2"/>
<line x1="110" y1="340" x2="650" y2="340" stroke="#5B6578" stroke-width="1.5"/>
<rect x="119.0" y="219.7" width="27.0" height="120.3" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="164.0" y="225.1" width="27.0" height="114.9" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="209.0" y="208.5" width="27.0" height="131.5" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="254.0" y="210.8" width="27.0" height="129.2" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="299.0" y="201.9" width="27.0" height="138.1" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="344.0" y="205.4" width="27.0" height="134.6" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="389.0" y="214.3" width="27.0" height="125.7" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="434.0" y="212.7" width="27.0" height="127.3" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="479.0" y="196.5" width="27.0" height="143.5" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="524.0" y="179.9" width="27.0" height="160.1" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="569.0" y="128.6" width="27.0" height="211.4" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<rect x="614.0" y="103.6" width="27.0" height="236.4" rx="4" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5"/>
<text x="132.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Jan</text>
<text x="177.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Feb</text>
<text x="222.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Mar</text>
<text x="267.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Apr</text>
<text x="312.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">May</text>
<text x="357.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Jun</text>
<text x="402.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Jul</text>
<text x="447.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Aug</text>
<text x="492.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Sep</text>
<text x="537.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Oct</text>
<text x="582.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Nov</text>
<text x="627.5" y="358" text-anchor="middle" font-size="13" fill="#5B6578">Dec</text>
<polyline points="132.5,215.1 177.5,217.8 222.5,211.8 267.5,213.8 312.5,209.1 357.5,211.1 402.5,216.5 447.5,214.4 492.5,203.7 537.5,186.1 582.5,140.9 627.5,116.6" fill="none" stroke="#D9650B" stroke-width="3" stroke-linejoin="round"/>
<circle cx="132.5" cy="215.1" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="177.5" cy="217.8" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="222.5" cy="211.8" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="267.5" cy="213.8" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="312.5" cy="209.1" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="357.5" cy="211.1" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="402.5" cy="216.5" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="447.5" cy="214.4" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="492.5" cy="203.7" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="537.5" cy="186.1" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="582.5" cy="140.9" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<circle cx="627.5" cy="116.6" r="4.5" fill="#FFFFFF" stroke="#D9650B" stroke-width="2.5"/>
<text transform="translate(52,205.0) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#2A9DBA">Shipments per month</text>
<text transform="translate(702,205.0) rotate(90)" text-anchor="middle" font-size="13" font-weight="600" fill="#D9650B">Average dispatch time (hours)</text>
<circle cx="380.0" cy="380" r="12" fill="#1F2A3C"/><text x="380.0" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<circle cx="22" cy="80" r="12" fill="#1F2A3C"/><text x="22" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="732" cy="80" r="12" fill="#1F2A3C"/><text x="732" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<circle cx="104" cy="29" r="12" fill="#1F2A3C"/><text x="104" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<circle cx="582.5" cy="140.9" r="16" fill="none" stroke="#1F2A3C" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="552.5" cy="116.875" r="12" fill="#1F2A3C"/><text x="552.5" y="121.875" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<circle cx="50" cy="412" r="12" fill="#1F2A3C"/><text x="50" y="417" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="72" y="417" font-size="14" fill="#1F2A3C">Shared x-axis: both series use the same months (or categories).</text>
<circle cx="50" cy="438" r="12" fill="#1F2A3C"/><text x="50" y="443" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="72" y="443" font-size="14" fill="#1F2A3C">Left axis: read the columns against this scale. It starts at zero.</text>
<circle cx="50" cy="464" r="12" fill="#1F2A3C"/><text x="50" y="469" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="72" y="469" font-size="14" fill="#1F2A3C">Right axis: read the line against this scale. Its colour matches the line.</text>
<circle cx="50" cy="490" r="12" fill="#1F2A3C"/><text x="50" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="72" y="495" font-size="14" fill="#1F2A3C">Legend: names each series and says which axis it uses.</text>
<circle cx="50" cy="516" r="12" fill="#1F2A3C"/><text x="50" y="521" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<text x="72" y="521" font-size="14" fill="#1F2A3C">Where the line meets a column means nothing: the two scales are independent.</text>
</svg>
