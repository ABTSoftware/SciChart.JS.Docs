<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 760 360"><title id="t">How to read a logarithmic axis</title><desc id="d">A base-10 logarithmic axis from 1 to 1,000. The major ticks 1, 10, 100 and 1,000 are equally spaced, and each gap is one decade, a factor of 10. Minor ticks for 2 to 9 times each power of ten get closer together towards the next power. Equal distances are equal ratios: 2 to 4 is as long as 50 to 100. The point halfway between 10 and 100 is about 32, not 55, and a point on the second minor tick after 100 reads 300.</desc><rect width="760" height="360" fill="#fff"/><path fill="none" stroke="#1b75bb" stroke-width="2" d="M73 122v-10h200.7v10"/><text x="173.3" y="104" fill="#1b75bb" font-size="16" font-weight="bold" text-anchor="middle">×10</text><path fill="none" stroke="#1b75bb" stroke-width="2" d="M279.7 122v-10h200.6v10"/><text x="380" y="104" fill="#1b75bb" font-size="16" font-weight="bold" text-anchor="middle">×10</text><path fill="none" stroke="#1b75bb" stroke-width="2" d="M486.3 122v-10H687v10"/><text x="586.7" y="104" fill="#1b75bb" font-size="16" font-weight="bold" text-anchor="middle">×10</text><text x="380" y="34" fill="#1f2937" font-size="15" text-anchor="middle">Each decade (1 to 10, 10 to 100, 100 to 1,000) is the same width</text><line x1="70" x2="690" y1="170" y2="170" stroke="#334155" stroke-width="2"/><line x1="70" x2="70" y1="156" y2="184" stroke="#334155" stroke-width="2.5"/><text x="70" y="208" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">1</text><line x1="276.7" x2="276.7" y1="156" y2="184" stroke="#334155" stroke-width="2.5"/><text x="276.7" y="208" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">10</text><line x1="483.3" x2="483.3" y1="156" y2="184" stroke="#334155" stroke-width="2.5"/><text x="483.3" y="208" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">100</text><line x1="690" x2="690" y1="156" y2="184" stroke="#334155" stroke-width="2.5"/><text x="690" y="208" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">1,000</text><line x1="132.2" x2="132.2" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="132.2" y="194" fill="#64748b" font-size="11" text-anchor="middle">2</text><line x1="168.6" x2="168.6" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="168.6" y="194" fill="#64748b" font-size="11" text-anchor="middle">3</text><line x1="194.4" x2="194.4" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="194.4" y="194" fill="#64748b" font-size="11" text-anchor="middle">4</text><line x1="214.5" x2="214.5" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="214.5" y="194" fill="#64748b" font-size="11" text-anchor="middle">5</text><line x1="230.8" x2="230.8" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="230.8" y="194" fill="#64748b" font-size="11" text-anchor="middle">6</text><line x1="244.7" x2="244.7" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="244.7" y="194" fill="#64748b" font-size="11" text-anchor="middle">7</text><line x1="256.6" x2="256.6" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="256.6" y="194" fill="#64748b" font-size="11" text-anchor="middle">8</text><line x1="267.2" x2="267.2" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="267.2" y="194" fill="#64748b" font-size="11" text-anchor="middle">9</text><line x1="338.9" x2="338.9" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="338.9" y="194" fill="#64748b" font-size="11" text-anchor="middle">20</text><line x1="375.3" x2="375.3" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="401.1" x2="401.1" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="421.1" x2="421.1" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="421.1" y="194" fill="#64748b" font-size="11" text-anchor="middle">50</text><line x1="437.5" x2="437.5" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="451.3" x2="451.3" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="463.3" x2="463.3" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="473.9" x2="473.9" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="545.5" x2="545.5" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="545.5" y="194" fill="#64748b" font-size="11" text-anchor="middle">200</text><line x1="581.9" x2="581.9" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="607.8" x2="607.8" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="627.8" x2="627.8" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><text x="627.8" y="194" fill="#64748b" font-size="11" text-anchor="middle">500</text><line x1="644.2" x2="644.2" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="658" x2="658" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="670" x2="670" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="680.5" x2="680.5" y1="163" y2="177" stroke="#334155" stroke-width="1.2"/><line x1="132.2" x2="194.4" y1="144" y2="144" stroke="#2f9e44" stroke-width="2"/><path fill="none" stroke="#2f9e44" stroke-width="2" d="m187.4 140 7 4-7 4"/><circle cx="132.2" cy="144" r="3" fill="#2f9e44"/><text x="163.3" y="137" fill="#2f9e44" font-size="13" font-weight="bold" text-anchor="middle">2 → 4: ×2</text><line x1="421.1" x2="483.3" y1="144" y2="144" stroke="#2f9e44" stroke-width="2"/><path fill="none" stroke="#2f9e44" stroke-width="2" d="m476.3 140 7 4-7 4"/><circle cx="421.1" cy="144" r="3" fill="#2f9e44"/><text x="452.2" y="137" fill="#2f9e44" font-size="13" font-weight="bold" text-anchor="middle">50 → 100: ×2</text><circle cx="380" cy="170" r="6" fill="#d6336c"/><line x1="380" x2="380" y1="214" y2="250" stroke="#d6336c" stroke-width="1.5"/><text x="380" y="268" fill="#d6336c" font-size="14" text-anchor="middle">Halfway from 10 to 100</text><text x="380" y="286" fill="#d6336c" font-size="14" text-anchor="middle">is about 32, not 55</text><circle cx="581.9" cy="170" r="6" fill="#1b75bb"/><line x1="581.9" x2="581.9" y1="214" y2="250" stroke="#1b75bb" stroke-width="1.5"/><text x="581.9" y="268" fill="#1b75bb" font-size="14" text-anchor="middle">2nd minor tick after 100:</text><text x="581.9" y="286" fill="#1b75bb" font-size="14" text-anchor="middle">3 × 100 = 300</text><text x="100.2" y="268" fill="#1f2937" font-size="14">Minor ticks: 2 to 9 × the</text><text x="100.2" y="286" fill="#1f2937" font-size="14">power of ten, closer</text><text x="100.2" y="304" fill="#1f2937" font-size="14">together towards the next</text><text x="380" y="348" fill="#1f2937" font-size="14" text-anchor="middle">Equal distances are equal ratios, so there is no zero: the axis could carry on to 0.1, 0.01 … forever</text></svg>