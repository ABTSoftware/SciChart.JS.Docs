<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 760 400"><title id="t">The same data on a linear y-axis and on a logarithmic y-axis</title><desc id="d">A value that starts at 100 and doubles every week for 10 weeks, drawn twice. On the linear axis (left) the first six weeks look flat and the curve shoots up at the end. On the logarithmic axis (right) the same points form a straight line, because the value grows at the same rate every week.</desc><rect width="760" height="400" fill="#fff"/><text x="197" y="32" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">Linear y-axis</text><line x1="62" x2="332" y1="300" y2="300" stroke="#d6dde6"/><text x="54" y="305" fill="#1f2937" font-size="13" text-anchor="end">0</text><line x1="62" x2="332" y1="247.7" y2="247.7" stroke="#d6dde6"/><text x="54" y="252.7" fill="#1f2937" font-size="13" text-anchor="end">25,000</text><line x1="62" x2="332" y1="195.5" y2="195.5" stroke="#d6dde6"/><text x="54" y="200.5" fill="#1f2937" font-size="13" text-anchor="end">50,000</text><line x1="62" x2="332" y1="143.2" y2="143.2" stroke="#d6dde6"/><text x="54" y="148.2" fill="#1f2937" font-size="13" text-anchor="end">75,000</text><line x1="62" x2="332" y1="90.9" y2="90.9" stroke="#d6dde6"/><text x="54" y="95.9" fill="#1f2937" font-size="13" text-anchor="end">100,000</text><text x="72" y="320" fill="#1f2937" font-size="13" text-anchor="middle">0</text><text x="122" y="320" fill="#1f2937" font-size="13" text-anchor="middle">2</text><text x="172" y="320" fill="#1f2937" font-size="13" text-anchor="middle">4</text><text x="222" y="320" fill="#1f2937" font-size="13" text-anchor="middle">6</text><text x="272" y="320" fill="#1f2937" font-size="13" text-anchor="middle">8</text><text x="322" y="320" fill="#1f2937" font-size="13" text-anchor="middle">10</text><text x="197" y="342" fill="#1f2937" font-size="14" text-anchor="middle">Week</text><line x1="62" x2="62" y1="70" y2="300" stroke="#8a96a8"/><line x1="62" x2="332" y1="300" y2="300" stroke="#8a96a8"/><polyline fill="none" stroke="#1b75bb" stroke-width="3" points="72.0,299.8 97.0,299.6 122.0,299.2 147.0,298.3 172.0,296.7 197.0,293.3 222.0,286.6 247.0,273.2 272.0,246.5 297.0,192.9 322.0,85.9"/><circle cx="72" cy="299.8" r="4.5" fill="#1b75bb"/><circle cx="97" cy="299.6" r="4.5" fill="#1b75bb"/><circle cx="122" cy="299.2" r="4.5" fill="#1b75bb"/><circle cx="147" cy="298.3" r="4.5" fill="#1b75bb"/><circle cx="172" cy="296.7" r="4.5" fill="#1b75bb"/><circle cx="197" cy="293.3" r="4.5" fill="#1b75bb"/><circle cx="222" cy="286.6" r="4.5" fill="#1b75bb"/><circle cx="247" cy="273.2" r="4.5" fill="#1b75bb"/><circle cx="272" cy="246.5" r="4.5" fill="#1b75bb"/><circle cx="297" cy="192.9" r="4.5" fill="#1b75bb"/><circle cx="322" cy="85.9" r="4.5" fill="#1b75bb"/><text x="76" y="180" fill="#d6336c" font-size="13">Weeks 0 to 6 look flat:</text><text x="76" y="197" fill="#d6336c" font-size="13">100 to 6,400 is lost at this scale</text><text x="197" y="386" fill="#1f2937" font-size="13" text-anchor="middle">Each gridline step adds the same amount (+25,000)</text><text x="577" y="32" fill="#1f2937" font-size="18" font-weight="bold" text-anchor="middle">Logarithmic y-axis</text><line x1="442" x2="712" y1="277.3" y2="277.3" stroke="#eef1f5"/><line x1="442" x2="712" y1="264" y2="264" stroke="#eef1f5"/><line x1="442" x2="712" y1="254.6" y2="254.6" stroke="#eef1f5"/><line x1="442" x2="712" y1="247.3" y2="247.3" stroke="#eef1f5"/><line x1="442" x2="712" y1="241.3" y2="241.3" stroke="#eef1f5"/><line x1="442" x2="712" y1="236.3" y2="236.3" stroke="#eef1f5"/><line x1="442" x2="712" y1="231.9" y2="231.9" stroke="#eef1f5"/><line x1="442" x2="712" y1="228" y2="228" stroke="#eef1f5"/><line x1="442" x2="712" y1="201.9" y2="201.9" stroke="#eef1f5"/><line x1="442" x2="712" y1="188.6" y2="188.6" stroke="#eef1f5"/><line x1="442" x2="712" y1="179.2" y2="179.2" stroke="#eef1f5"/><line x1="442" x2="712" y1="171.9" y2="171.9" stroke="#eef1f5"/><line x1="442" x2="712" y1="165.9" y2="165.9" stroke="#eef1f5"/><line x1="442" x2="712" y1="160.9" y2="160.9" stroke="#eef1f5"/><line x1="442" x2="712" y1="156.5" y2="156.5" stroke="#eef1f5"/><line x1="442" x2="712" y1="152.6" y2="152.6" stroke="#eef1f5"/><line x1="442" x2="712" y1="126.5" y2="126.5" stroke="#eef1f5"/><line x1="442" x2="712" y1="113.2" y2="113.2" stroke="#eef1f5"/><line x1="442" x2="712" y1="103.8" y2="103.8" stroke="#eef1f5"/><line x1="442" x2="712" y1="96.5" y2="96.5" stroke="#eef1f5"/><line x1="442" x2="712" y1="90.5" y2="90.5" stroke="#eef1f5"/><line x1="442" x2="712" y1="85.5" y2="85.5" stroke="#eef1f5"/><line x1="442" x2="712" y1="81.1" y2="81.1" stroke="#eef1f5"/><line x1="442" x2="712" y1="77.2" y2="77.2" stroke="#eef1f5"/><line x1="442" x2="712" y1="300" y2="300" stroke="#d6dde6"/><text x="434" y="305" fill="#1f2937" font-size="13" text-anchor="end">100</text><line x1="442" x2="712" y1="224.6" y2="224.6" stroke="#d6dde6"/><text x="434" y="229.6" fill="#1f2937" font-size="13" text-anchor="end">1,000</text><line x1="442" x2="712" y1="149.2" y2="149.2" stroke="#d6dde6"/><text x="434" y="154.2" fill="#1f2937" font-size="13" text-anchor="end">10,000</text><line x1="442" x2="712" y1="73.8" y2="73.8" stroke="#d6dde6"/><text x="434" y="78.8" fill="#1f2937" font-size="13" text-anchor="end">100,000</text><text x="452" y="320" fill="#1f2937" font-size="13" text-anchor="middle">0</text><text x="502" y="320" fill="#1f2937" font-size="13" text-anchor="middle">2</text><text x="552" y="320" fill="#1f2937" font-size="13" text-anchor="middle">4</text><text x="602" y="320" fill="#1f2937" font-size="13" text-anchor="middle">6</text><text x="652" y="320" fill="#1f2937" font-size="13" text-anchor="middle">8</text><text x="702" y="320" fill="#1f2937" font-size="13" text-anchor="middle">10</text><text x="577" y="342" fill="#1f2937" font-size="14" text-anchor="middle">Week</text><line x1="442" x2="442" y1="70" y2="300" stroke="#8a96a8"/><line x1="442" x2="712" y1="300" y2="300" stroke="#8a96a8"/><polyline fill="none" stroke="#1b75bb" stroke-width="3" points="452.0,300.0 477.0,277.3 502.0,254.6 527.0,231.9 552.0,209.2 577.0,186.5 602.0,163.8 627.0,141.1 652.0,118.4 677.0,95.7 702.0,73.0"/><circle cx="452" cy="300" r="4.5" fill="#1b75bb"/><circle cx="477" cy="277.3" r="4.5" fill="#1b75bb"/><circle cx="502" cy="254.6" r="4.5" fill="#1b75bb"/><circle cx="527" cy="231.9" r="4.5" fill="#1b75bb"/><circle cx="552" cy="209.2" r="4.5" fill="#1b75bb"/><circle cx="577" cy="186.5" r="4.5" fill="#1b75bb"/><circle cx="602" cy="163.8" r="4.5" fill="#1b75bb"/><circle cx="627" cy="141.1" r="4.5" fill="#1b75bb"/><circle cx="652" cy="118.4" r="4.5" fill="#1b75bb"/><circle cx="677" cy="95.7" r="4.5" fill="#1b75bb"/><circle cx="702" cy="73" r="4.5" fill="#1b75bb"/><text x="702" y="236.3" fill="#d6336c" font-size="13" text-anchor="end">Straight line: the same</text><text x="702" y="253.3" fill="#d6336c" font-size="13" text-anchor="end">growth (×2) every week</text><text x="577" y="386" fill="#1f2937" font-size="13" text-anchor="middle">Each gridline step multiplies by the same factor (×10)</text></svg>