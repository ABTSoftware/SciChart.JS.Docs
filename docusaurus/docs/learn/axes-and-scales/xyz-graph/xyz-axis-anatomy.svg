<text x="700.0" y="60.0" font-size="15" text-anchor="start" fill="#2e3440" font-weight="bold">Read a point in three steps</text>
<text x="700.0" y="82.0" font-size="14" text-anchor="start" fill="#5b6475" font-weight="normal">Across the floor along x, back along z,</text>
<text x="700.0" y="100.0" font-size="14" text-anchor="start" fill="#5b6475" font-weight="normal">then up along y. Write it as (x, y, z).</text>
<text x="700.0" y="122.0" font-size="14" text-anchor="start" fill="#5b6475" font-weight="normal">Hollow circles are P’s shadows on the</text>
