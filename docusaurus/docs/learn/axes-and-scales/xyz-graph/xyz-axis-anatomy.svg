<text x="605.2" y="195.4" font-size="14" text-anchor="start" fill="#5b6475" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Back wall (x–y): x = 7, y = 6</text>
