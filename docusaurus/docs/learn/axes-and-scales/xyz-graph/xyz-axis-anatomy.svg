<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 980 600"><title id="t">An XYZ graph: the x, y and z axes and how to read a point</title><desc id="d">A 3D axis box drawn as the corner of a room. The x axis runs across from 0 to 10, the y axis points up from 0 to 10 and the z axis runs back into the page from 0 to 10, all starting at the origin (0, 0, 0). Point P at (7, 6, 3) is reached by moving 7 along x, 3 along z, then 6 up. Dashed lines drop from P to its shadows: on the floor at x 7 and z 3, on the back wall at x 7 and y 6, and on the side wall at z 3 and y 6.</desc><rect width="980" height="600" fill="#fff"/><defs><marker id="ax" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f77b4" d="m0 0 10 5-10 5z"/></marker><marker id="ay" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d6400f" d="m0 0 10 5-10 5z"/></marker><marker id="az" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2a9d55" d="m0 0 10 5-10 5z"/></marker></defs><polygon fill="#eef5ec" stroke="#b9c4b4" points="250.0,480.0 550.0,480.0 685.2,385.4 385.2,385.4"/><polygon fill="#eef2f8" stroke="#b4bccb" points="385.2,385.4 685.2,385.4 685.2,85.4 385.2,85.4"/><polygon fill="#f8f0ea" stroke="#cbbcb0" points="250.0,480.0 385.2,385.4 385.2,85.4 250.0,180.0"/><line x1="310" x2="445.2" y1="480" y2="385.4" stroke="#d5dae3"/><line x1="277" x2="577" y1="461.1" y2="461.1" stroke="#d5dae3"/><line x1="445.2" x2="445.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="325.4" y2="325.4" stroke="#d5dae3"/><line x1="250" x2="385.2" y1="420" y2="325.4" stroke="#d5dae3"/><line x1="277" x2="277" y1="461.1" y2="161.1" stroke="#d5dae3"/><line x1="370" x2="505.2" y1="480" y2="385.4" stroke="#d5dae3"/><line x1="304.1" x2="604.1" y1="442.1" y2="442.1" stroke="#d5dae3"/><line x1="505.2" x2="505.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="265.4" y2="265.4" stroke="#d5dae3"/><line x1="250" x2="385.2" y1="360" y2="265.4" stroke="#d5dae3"/><line x1="304.1" x2="304.1" y1="442.1" y2="142.1" stroke="#d5dae3"/><line x1="430" x2="565.2" y1="480" y2="385.4" stroke="#d5dae3"/><line x1="331.1" x2="631.1" y1="423.2" y2="423.2" stroke="#d5dae3"/><line x1="565.2" x2="565.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="205.4" y2="205.4" stroke="#d5dae3"/><line x1="250" x2="385.2" y1="300" y2="205.4" stroke="#d5dae3"/><line x1="331.1" x2="331.1" y1="423.2" y2="123.2" stroke="#d5dae3"/><line x1="490" x2="625.2" y1="480" y2="385.4" stroke="#d5dae3"/><line x1="358.1" x2="658.1" y1="404.3" y2="404.3" stroke="#d5dae3"/><line x1="625.2" x2="625.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="145.4" y2="145.4" stroke="#d5dae3"/><line x1="250" x2="385.2" y1="240" y2="145.4" stroke="#d5dae3"/><line x1="358.1" x2="358.1" y1="404.3" y2="104.3" stroke="#d5dae3"/><line x1="550" x2="685.2" y1="480" y2="385.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="385.4" y2="385.4" stroke="#d5dae3"/><line x1="685.2" x2="685.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="685.2" y1="85.4" y2="85.4" stroke="#d5dae3"/><line x1="250" x2="385.2" y1="180" y2="85.4" stroke="#d5dae3"/><line x1="385.2" x2="385.2" y1="385.4" y2="85.4" stroke="#d5dae3"/><line x1="250" x2="589" y1="480" y2="480" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#ax)"/><line x1="250" x2="250" y1="480" y2="141" stroke="#d6400f" stroke-width="2.5" marker-end="url(#ay)"/><line x1="250" x2="414.9" y1="480" y2="364.5" stroke="#2a9d55" stroke-width="2.5" marker-end="url(#az)"/><line x1="250" x2="250" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="250" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">0</text><line x1="310" x2="310" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="310" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">2</text><line x1="250" x2="244" y1="420" y2="420" stroke="#d6400f" stroke-width="1.5"/><text x="240" y="424" fill="#d6400f" font-size="13" text-anchor="end">2</text><line x1="277" x2="271" y1="461.1" y2="463.1" stroke="#2a9d55" stroke-width="1.5"/><text x="267" y="467.1" fill="#2a9d55" font-size="13" text-anchor="end">2</text><line x1="370" x2="370" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="370" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">4</text><line x1="250" x2="244" y1="360" y2="360" stroke="#d6400f" stroke-width="1.5"/><text x="240" y="364" fill="#d6400f" font-size="13" text-anchor="end">4</text><line x1="304.1" x2="298.1" y1="442.1" y2="444.1" stroke="#2a9d55" stroke-width="1.5"/><text x="294.1" y="448.1" fill="#2a9d55" font-size="13" text-anchor="end">4</text><line x1="430" x2="430" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="430" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">6</text><line x1="250" x2="244" y1="300" y2="300" stroke="#d6400f" stroke-width="1.5"/><text x="240" y="304" fill="#d6400f" font-size="13" text-anchor="end">6</text><line x1="331.1" x2="325.1" y1="423.2" y2="425.2" stroke="#2a9d55" stroke-width="1.5"/><text x="321.1" y="429.2" fill="#2a9d55" font-size="13" text-anchor="end">6</text><line x1="490" x2="490" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="490" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">8</text><line x1="250" x2="244" y1="240" y2="240" stroke="#d6400f" stroke-width="1.5"/><text x="240" y="244" fill="#d6400f" font-size="13" text-anchor="end">8</text><line x1="358.1" x2="352.1" y1="404.3" y2="406.3" stroke="#2a9d55" stroke-width="1.5"/><text x="348.1" y="410.3" fill="#2a9d55" font-size="13" text-anchor="end">8</text><line x1="550" x2="550" y1="480" y2="486" stroke="#1f77b4" stroke-width="1.5"/><text x="550" y="502" fill="#1f77b4" font-size="13" text-anchor="middle">10</text><line x1="250" x2="244" y1="180" y2="180" stroke="#d6400f" stroke-width="1.5"/><text x="240" y="184" fill="#d6400f" font-size="13" text-anchor="end">10</text><line x1="385.2" x2="379.2" y1="385.4" y2="387.4" stroke="#2a9d55" stroke-width="1.5"/><text x="375.2" y="391.4" fill="#2a9d55" font-size="13" text-anchor="end">10</text><text x="597" y="485" fill="#1f77b4" font-size="17" font-weight="bold">x axis</text><text x="597" y="504" fill="#5b6475" font-size="14">across (width)</text><text x="242" y="129" fill="#d6400f" font-size="17" font-weight="bold" text-anchor="middle">y axis</text><text x="294" y="129" fill="#5b6475" font-size="14">up (height)</text><text x="420.9" y="358.5" fill="#2a9d55" font-size="17" font-weight="bold">z axis</text><text x="420.9" y="377.5" fill="#5b6475" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" paint-order="stroke">back (depth)</text><circle cx="250" cy="480" r="5" fill="#2e3440"/><text x="238" y="520" fill="#2e3440" font-size="14" font-weight="bold" text-anchor="middle">Origin (0, 0, 0)</text><line x1="250" x2="460" y1="480" y2="480" stroke="#e07b00" stroke-width="3"/><line x1="460" x2="500.5" y1="480" y2="451.6" stroke="#2a9d55" stroke-width="3"/><line x1="500.5" x2="500.5" y1="451.6" y2="271.6" stroke="#d6400f" stroke-width="3"/><line x1="250" x2="460" y1="480" y2="480" stroke="#1f77b4" stroke-opacity=".55" stroke-width="4"/><line x1="500.5" x2="595.2" y1="271.6" y2="205.4" stroke="#e07b00" stroke-dasharray="6 4" stroke-width="1.8"/><line x1="500.5" x2="290.5" y1="271.6" y2="271.6" stroke="#e07b00" stroke-dasharray="6 4" stroke-width="1.8"/><circle cx="500.5" cy="451.6" r="5" fill="#fff" stroke="#e07b00" stroke-width="2.5"/><circle cx="595.2" cy="205.4" r="5" fill="#fff" stroke="#e07b00" stroke-width="2.5"/><circle cx="290.5" cy="271.6" r="5" fill="#fff" stroke="#e07b00" stroke-width="2.5"/><circle cx="500.5" cy="271.6" r="8" fill="#e07b00" stroke="#fff" stroke-width="2"/><text x="514.5" y="265.6" fill="#e07b00" font-size="18" font-weight="bold">P = (7, 6, 3)</text><text x="355" y="470" fill="#1f77b4" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" font-weight="bold" paint-order="stroke" text-anchor="middle">1. 7 across</text><text x="494.3" y="463.8" fill="#2a9d55" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" font-weight="bold" paint-order="stroke">2. 3 back</text><text x="510.5" y="361.6" fill="#d6400f" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" font-weight="bold" paint-order="stroke">3. 6 up</text><line x1="506.5" x2="612.5" y1="451.6" y2="451.6" stroke="#5b6475" stroke-dasharray="2 3"/><text x="618.5" y="456.6" fill="#5b6475" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" paint-order="stroke">Floor (x–z): x = 7, z = 3</text><text x="605.2" y="195.4" fill="#5b6475" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" paint-order="stroke">Back wall (x–y): x = 7, y = 6</text><text x="298.5" y="295.6" fill="#5b6475" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" paint-order="stroke">Side wall (z–y):</text><text x="298.5" y="313.6" fill="#5b6475" stroke="#fff" stroke-linejoin="round" stroke-width="4" font-size="14" paint-order="stroke">z = 3, y = 6</text><text x="700" y="60" fill="#2e3440" font-size="15" font-weight="bold">Read a point in three steps</text><text x="700" y="82" fill="#5b6475" font-size="14">Across the floor along x, back along z,</text><text x="700" y="100" fill="#5b6475" font-size="14">then up along y. Write it as (x, y, z).</text><text x="700" y="122" fill="#5b6475" font-size="14">Hollow circles are P’s shadows on the</text><text x="700" y="140" fill="#5b6475" font-size="14">floor and walls (dashed lines).</text><text x="700" y="166" fill="#5b6475" font-size="14" font-style="italic">Here y is up. Many maths books put z up.</text></svg>