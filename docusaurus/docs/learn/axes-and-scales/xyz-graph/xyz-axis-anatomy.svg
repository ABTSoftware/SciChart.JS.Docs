<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">An XYZ graph: the x, y and z axes and how to read a point</title>
<desc id="d">A 3D axis box drawn as the corner of a room. The x axis runs across from 0 to 10, the y axis points up from 0 to 10 and the z axis runs back into the page from 0 to 10, all starting at the origin (0, 0, 0). Point P at (7, 6, 3) is reached by moving 7 along x, 3 along z, then 6 up. Dashed lines drop from P to its shadows: on the floor at x 7 and z 3, on the back wall at x 7 and y 6, and on the side wall at z 3 and y 6.</desc>
