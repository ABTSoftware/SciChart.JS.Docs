<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 1000 430"><title id="t">One point read in 3D and in its three 2D views</title><desc id="d">Point P at (7, 6, 3) drawn four ways. In a small 3D box it is hard to tell how far back it sits. In the front view, looking along z, it is at x 7 and y 6. In the top view, looking down y, it is at x 7 and z 3. In the side view, looking along x, it is at z 3 and y 6. Each 2D view loses one coordinate, so two views are needed to recover all three.</desc><rect width="1000" height="430" fill="#fff"/><defs><marker id="ax" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f77b4" d="m0 0 10 5-10 5z"/></marker><marker id="ay" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d6400f" d="m0 0 10 5-10 5z"/></marker><marker id="az" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2a9d55" d="m0 0 10 5-10 5z"/></marker></defs><text x="130" y="50" fill="#2e3440" font-size="17" font-weight="bold" text-anchor="middle">3D view</text><polygon fill="#eef5ec" stroke="#b9c4b4" points="60.0,330.0 210.0,330.0 283.7,278.4 133.7,278.4"/><polygon fill="#eef2f8" stroke="#b4bccb" points="133.7,278.4 283.7,278.4 283.7,128.4 133.7,128.4"/><polygon fill="#f8f0ea" stroke="#cbbcb0" points="60.0,330.0 133.7,278.4 133.7,128.4 60.0,180.0"/><line x1="60" x2="225" y1="330" y2="330" stroke="#1f77b4" stroke-width="2" marker-end="url(#ax)"/><line x1="60" x2="60" y1="330" y2="165" stroke="#d6400f" stroke-width="2" marker-end="url(#ay)"/><line x1="60" x2="144.8" y1="330" y2="270.6" stroke="#2a9d55" stroke-width="2" marker-end="url(#az)"/><text x="229" y="335" fill="#1f77b4" font-size="15" font-weight="bold">x</text><text x="56" y="159" fill="#d6400f" 