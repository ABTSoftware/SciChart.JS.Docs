<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">One point read in 3D and in its three 2D views</title>
<desc id="d">Point P at (7, 6, 3) drawn four ways. In a small 3D box it is hard to tell how far back it sits. In the front view, looking along z, it is at x 7 and y 6. In the top view, looking down y, it is at x 7 and z 3. In the side view, looking along x, it is at z 3 and y 6. Each 2D view loses one coordinate, so two views are needed to recover all three.</desc>
