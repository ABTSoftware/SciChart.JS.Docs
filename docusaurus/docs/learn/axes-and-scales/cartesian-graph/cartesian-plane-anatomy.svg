<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 800 640"><title>The parts of a Cartesian graph</title><desc>A Cartesian plane with a horizontal x-axis and a vertical y-axis crossing at the origin (0, 0), with whole-number ticks from minus 8 to 8 across and minus 6 to 6 up. The four quadrants are numbered I to IV anticlockwise from the top right, with the signs of x and y in each: I (+, +), II (−, +), III (−, −), IV (+, −). Point P at (−3, 2) is plotted by moving 3 units left from the origin along the x-axis, then 2 units up. Point Q at (4, −2) sits in quadrant IV. One grid square is one unit on both axes.</desc><defs><marker id="ah" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2a44" d="m0 0 10 5-10 5z"/></marker><marker id="ao" markerHeight="8" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d9480f" d="m0 0 10 5-10 5z"/></marker></defs><rect width="800" height="640" fill="#fff"/><rect width="352" height="264" x="400" y="52" fill="#e7f5ff"/><rect width="352" height="264" x="48" y="52" fill="#fff4e6"/><rect width="352" height="264" x="48" y="316" fill="#f3f0ff"/><rect width="352" height="264" x="400" y="316" fill="#ebfbee"/><line x1="48" x2="48" y1="52" y2="580" stroke="#c9d3df"/><line x1="92" x2="92" y1="52" y2="580" stroke="#c9d3df"/><line x1="136" x2="136" y1="52" y2="580" stroke="#c9d3df"/><line x1="180" x2="180" y1="52" y2="580" stroke="#c9d3df"/><line x1="224" x2="224" y1="52" y2="580" stroke="#c9d3df"/><line x1="268" x2="268" y1="52" y2="580" stroke="#c9d3df"/><line x1="312" x2="312" y1="52" y2="580" stroke="#c9d3df"/><line x1="356" x2="356" y1="52" y2="580" stroke="#c9d3df"/><line x1="400" x2="400" y1="52" y2="580" stroke="#c9d3df"/><line x1="444" x2="444" y1="52" y2="580" stroke="#c9d3df"/><line x1="488" x2="488" y1="52" y2="580" stroke="#c9d3df"/><line x1="532" x2="532" y1="52" y2="580" stroke="#c9d3df"/><line x1="576" x2="576" y1="52" y2="580" stroke="#c9d3df"/><line x1="620" x2="620" y1="52" y2="580" stroke="#c9d3df"/><line x1="664" x2="664" y1="52" y2="580" stroke="#c9d3df"/><line x1="708" x2="708" y1="52" y2="580" stroke="#c9d3df"/><line x1="752" x2="752" y1="52" y2="580" stroke="#c9d3df"/><line x1="48" x2="752" y1="580" y2="580" stroke="#c9d3df"/><line x1="48" x2="752" y1="536" y2="536" stroke="#c9d3df"/><line x1="48" x2="752" y1="492" y2="492" stroke="#c9d3df"/><line x1="48" x2="752" y1="448" y2="448" stroke="#c9d3df"/><line x1="48" x2="752" y1="404" y2="404" stroke="#c9d3df"/><line x1="48" x2="752" y1="360" y2="360" stroke="#c9d3df"/><line x1="48" x2="752" y1="316" y2="316" stroke="#c9d3df"/><line x1="48" x2="752" y1="272" y2="272" stroke="#c9d3df"/><line x1="48" x2="752" y1="228" y2="228" stroke="#c9d3df"/><line x1="48" x2="752" y1="184" y2="184" stroke="#c9d3df"/><line x1="48" x2="752" y1="140" y2="140" stroke="#c9d3df"/><line x1="48" x2="752" y1="96" y2="96" stroke="#c9d3df"/><line x1="48" x2="752" y1="52" y2="52" stroke="#c9d3df"/><line x1="34" x2="770" y1="316" y2="316" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah)"/><line x1="400" x2="400" y1="594" y2="34" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="756" y="342" fill="#1f2a44" font-size="17" font-weight="700" text-anchor="end">x-axis</text><text x="414" y="42" fill="#1f2a44" font-size="17" font-weight="700">y-axis</text><line x1="48" x2="48" y1="311" y2="321" stroke="#1f2a44" stroke-width="2"/><line x1="92" x2="92" y1="311" y2="321" stroke="#1f2a44" stroke-width="2"/><line x1="136" x2="136" y1="311" y2="321" stroke="#1f2a44" stroke-width="2"/><text x="136" y="337" fill="#1f2a44" font-size="14" text-anchor="middle">−6</text><line x1="180" x2="180" y1="311" y2="321" stroke="#1f2a44" stroke-width="2"/><line x1="224" x2="224" y1="311" y2="321" stroke="#