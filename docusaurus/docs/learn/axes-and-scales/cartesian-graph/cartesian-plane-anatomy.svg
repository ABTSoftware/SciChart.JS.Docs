 y1="228" y2="228" stroke="#1f2a44" stroke-width="2"/><text x="390" y="233" fill="#1f2a44" font-size="14" text-anchor="end">2</text><line x1="395" x2="405" y1="184" y2="184" stroke="#1f2a44" stroke-width="2"/><line x1="395" x2="405" y1="140" y2="140" stroke="#1f2a44" stroke-width="2"/><text x="390" y="145" fill="#1f2a44" font-size="14" text-anchor="end">4</text><line x1="395" x2="405" y1="96" y2="96" stroke="#1f2a44" stroke-width="2"/><line x1="395" x2="405" y1="52" y2="52" stroke="#1f2a44" stroke-width="2"/><circle cx="400" cy="316" r="5" fill="#1f2a44"/><text x="392" y="338" fill="#1f2a44" font-size="15" font-weight="700" text-anchor="end">O (0, 0)</text><text x="620" y="91.6" fill="#1f2a44" font-size="20" font-weight="700" text-anchor="middle">Quadrant I</text><text x="620" y="113.6" fill="#3b4a66" font-size="15" text-anchor="middle">x &gt; 0, y &gt; 0  (+, +)</text><text x="180" y="91.6" fill="#1f2a44" font-size="20" font-weight="700" text-anchor="middle">Quadrant II</text><text x="180" y="113.6" fill="#3b4a66" font-size="15" text-anchor="middle">x &lt; 0, y &gt; 0  (−, +)</text><text x="180" y="509.6" fill="#1f2a44" font-size="20" font-weight="700" text-anchor="middle">Quadrant III</text><text x="180" y="531.6" fill="#3b4a66" font-size="15" text-anchor="middle">x &lt; 0, y &lt; 0  (−, −)</text><text x="637.6" y="509.6" fill="#1f2a44" font-size="20" font-weight="700" text-anchor="middle">Quadrant IV</text><text x="637.6" y="531.6" fill="#3b4a66" font-size="15" text-anchor="middle">x &gt; 0, y &lt; 0  (+, −)</text><line x1="397" x2="271" y1="304" y2="304" stroke="#d9480f" stroke-width="3" marker-end="url(#ao)"/><text x="334" y="296" fill="#d9480f" font-size="14" font-weight="700" text-anchor="middle">1. 3 left</text><line x1="256" x2="256" y1="302" y2="232" stroke="#d9480f" stroke-width="3" marker-end="url(#ao)"/><text x="250" y="278" fill="#d9480f" font-size="14" font-weight="700" text-anchor="end">2. 2 up</text><line x1="268" x2="400" y1="228" y2="228" stroke="#1971c2" stroke-dasharray="6 4" stroke-width="2"/><line x1="268" x2="268" y1="228" y2="316" stroke="#1971c2" stroke-dasharray="6 4" stroke-width="2"/><circle cx="268" cy="228" r="8" fill="#1971c2" stroke="#fff" stroke-width="2"/><text x="256" y="216" fill="#1971c2" font-size="18" font-weight="700" text-anchor="end">P (−3, 2)</text><line x1="576" x2="400" y1="404" y2="404" stroke="#1971c2" stroke-dasharray="6 4" stroke-width="2"/><line x1="576" x2="576" y1="404" y2="316" stroke="#1971c2" stroke-dasharray="6 4" stroke-width="2"/><circle cx="576" cy="404" r="8" fill="#1971c2" stroke="#fff" stroke-width="2"/><text x="590" y="410" fill="#1971c2" font-size="18" font-weight="700">Q (4, −2)</text><text x="400" y="630" fill="#3b4a66" font-size="15" text-anchor="middle">Scale: one grid square = 1 unit, the same across and up</text></svg>