<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The parts of a Cartesian graph</title>
<desc>A Cartesian plane with a horizontal x-axis and a vertical y-axis crossing at the origin (0, 0), with whole-number ticks from minus 8 to 8 across and minus 6 to 6 up. The four quadrants are numbered I to IV anticlockwise from the top right, with the signs of x and y in each: I (+, +), II (−, +), III (−, −), IV (+, −). Point P at (−3, 2) is plotted by moving 3 units left from the origin along the x-axis, then 2 units up. Point Q at (4, −2) sits in quadrant IV. One grid square is one unit on both axes.</desc>
