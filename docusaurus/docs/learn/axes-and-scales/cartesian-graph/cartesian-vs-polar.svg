<text x="520" y="76.4" font-size="13" fill="#3b4a66" text-anchor="middle">90°</text>
<line x1="520" y1="390" x2="822.4000000000001" y2="390" stroke="#1f2a44" stroke-width="2.5"/>
<line x1="520" y1="390" x2="520" y2="87.59999999999997" stroke="#1f2a44" stroke-width="1.5"/>
<line x1="520" y1="390" x2="688" y2="166" stroke="#d9480f" stroke-width="4"/>
<text x="590.0" y="255.6" font-size="16" font-weight="700" fill="#d9480f" text-anchor="end">r = 5</text>
<path d="M 592.8 390 A 72.8 72.8 0 0 0 563.7 331.8" fill="none" stroke="#d9480f" stroke-width="3"/>
<text x="601.2" y="364.8" font-size="16" font-weight="700" fill="#d9480f">θ ≈ 53.1°</text>
<circle cx="688" cy="166" r="8" fill="#1971c2" stroke="#fff" stroke-width="2"/>
<text x="702" y="156" font-size="18" font-weight="700" fill="#1971c2">(5, 53.1°)</text>
<text x="648" y="34" font-size="19" font-weight="700" fill="#1f2a44" text-anchor="middle">Polar: (r, θ)</text>
<text x="648" y="56" font-size="14" fill="#3b4a66" text-anchor="middle">How far out, at what angle</text>
<text x="430.0" y="456" font-size="15" fill="#3b4a66" text-anchor="middle">The same point: r = √(3² + 4²) = 5 and θ = arctan(4 ÷ 3) ≈ 53.1°</text>
</svg>
