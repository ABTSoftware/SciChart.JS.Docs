<line x1="520" y1="390" x2="598.3" y2="97.9" stroke="#d5dde7"/>
<text x="798.9" y="234.0" font-size="13" fill="#3b4a66" text-anchor="middle">30°</text>
<text x="681.0" y="116.1" font-size="13" fill="#3b4a66" text-anchor="middle">60°</text>
