<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>One point in Cartesian and polar coordinates</title>
<desc>Two panels show the same point. Left, on a Cartesian grid, the point is found by its distances along the axes: x = 3 across and y = 4 up, written (3, 4). Right, on a polar grid of rings and spokes, the same point is found by its distance from the centre, r = 5, and its angle anticlockwise from the horizontal axis, about 53.1 degrees.</desc>
<rect width="860" height="470" fill="#ffffff"/>
<line x1="70" y1="390" x2="70" y2="74" stroke="#d5dde7"/>
<line x1="126" y1="390" x2="126" y2="74" stroke="#d5dde7"/>
<line x1="182" y1="390" x2="182" y2="74" stroke="#d5dde7"/>
<line x1="238" y1="390" x2="238" y2="74" stroke="#d5dde7"/>
<line x1="294" y1="390" x2="294" y2="74" stroke="#d5dde7"/>
<line x1="350" y1="390" x2="350" y2="74" stroke="#d5dde7"/>
<line x1="406" y1="390" x2="406" y2="74" stroke="#d5dde7"/>
<line x1="70" y1="390" x2="396" y2="390" stroke="#d5dde7"/>
<line x1="70" y1="334" x2="396" y2="334" stroke="#d5dde7"/>
<line x1="70" y1="278" x2="396" y2="278" stroke="#d5dde7"/>
