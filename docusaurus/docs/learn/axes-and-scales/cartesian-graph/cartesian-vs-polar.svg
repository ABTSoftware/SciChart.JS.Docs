<line x1="70" y1="390" x2="70" y2="64" stroke="#1f2a44" stroke-width="2.5"/>
<text x="126" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">1</text>
<text x="60" y="339" font-size="14" fill="#1f2a44" text-anchor="end">1</text>
<text x="182" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">2</text>
<text x="60" y="283" font-size="14" fill="#1f2a44" text-anchor="end">2</text>
<text x="238" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">3</text>
<text x="60" y="227" font-size="14" fill="#1f2a44" text-anchor="end">3</text>
<text x="294" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">4</text>
