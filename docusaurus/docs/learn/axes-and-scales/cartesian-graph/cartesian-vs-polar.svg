<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 860 470"><title>One point in Cartesian and polar coordinates</title><desc>Two panels show the same point. Left, on a Cartesian grid, the point is found by its distances along the axes: x = 3 across and y = 4 up, written (3, 4). Right, on a polar grid of rings and spokes, the same point is found by its distance from the centre, r = 5, and its angle anticlockwise from the horizontal axis, about 53.1 degrees.</desc><rect width="860" height="470" fill="#fff"/><line x1="70" x2="70" y1="390" y2="74" stroke="#d5dde7"/><line x1="126" x2="126" y1="390" y2="74" stroke="#d5dde7"/><line x1="182" x2="182" y1="390" y2="74" stroke="#d5dde7"/><line x1="238" x2="238" y1="390" y2="74" stroke="#d5dde7"/><line x1="294" x2="294" y1="390" y2="74" stroke="#d5dde7"/><line x1="350" x2="350" y1="390" y2="74" stroke="#d5dde7"/><line x1="406" x2="406" y1="390" y2="74" stroke="#d5dde7"/><line x1="70" x2="396" y1="390" y2="390" stroke="#d5dde7"/><line x1="70" x2="396" y1="334" y2="334" stroke="#d5dde7"/><line x1="70" x2="396" y1="278" y2="278" stroke="#d5dde7"/><line x1="70" x2="396" y1="222" y2="222" stroke="#d5dde7"/><line x1="70" x2="396" y1="166" y2="166" stroke="#d5dde7"/><line x1="70" x2="396" y1="110" y2="110" stroke="#d5dde7"/><line x1="70" x2="406" y1="390" y2="390" stroke="#1f2a44" stroke-width="2.5"/><line x1="70" x2="70" y1="390" y2="64" stroke="#1f2a44" stroke-width="2.5"/><text x="126" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">1</text><text x="60" y="339" fill="#1f2a44" font-size="14" text-anchor="end">1</text><text x="182" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">2</text><text x="60" y="283" fill="#1f2a44" font-size="14" text-anchor="end">2</text><text x="238" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">3</text><text x="60" y="227" fill="#1f2a44" font-size="14" text-anchor="end">3</text><text x="294" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">4</text><text x="60" y="171" fill="#1f2a44" font-size="14" text-anchor="end">4</text><text x="350" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">5</text><text x="60" y="115" fill="#1f2a44" font-size="14" text-anchor="end">5</text><text x="60" y="410" fill="#1f2a44" font-size="14" text-anchor="end">0</text><line x1="70" x2="238" y1="382" y2="382" stroke="#d9480f" stroke-width="4"/><text x="154" y="374" fill="#d9480f" font-size="16" font-weight="700" text-anchor="middle">x = 3</text><line x1="246" x2="246" y1="390" y2="166" stroke="#d9480f" stroke-width="4"/><text x="254" y="283" fill="#d9480f" font-size="16" font-weight="700">y = 4</text><line x1="70" x2="238" y1="166" y2="166" stroke="#1971c2" stroke-dasharray="6 4" stroke-width="2"/><circle cx="238" cy="166" r="8" fill="#1971c2" stroke="#fff" stroke-width="2"/><text x="252" y="156" fill="#1971c2" font-size="18" font-weight="700">(3, 4)</text><text x="198" y="34" fill="#1f2a44" font-size="19" font-weight="700" text-anchor="middle">Cartesian: (x, y)</text><text x="198" y="56" fill="#3b4a66" font-size="14" text-anchor="middle">How far across, how far up</text><path fill="none" stroke="#d5dde7" d="M576 390a56 56 0 0 0-56-56"/><text x="576" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">1</text><path fill="none" stroke="#d5dde7" d="M632 390a112 112 0 0 0-112-112"/><text x="632" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">2</text><path fill="none" stroke="#d5dde7" d="M688 390a168 168 0 0 0-168-168"/><text x="688" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">3</text><path fill="none" stroke="#d5dde7" d="M744 390a224 224 0 0 0-224-224"/><text x="744" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">4</text><path fill="none" stroke="#d5dde7" d="M800 390a280 280 0 0 0-280-280"/><text x="800" y="410" fill="#1f2a44" font-size="14" text-anchor="middle">5</text><line x1="520" x2="812.1" y1="390" y2="311.7" stroke="#d5dde7"/><line x1="520" x2="781.9" y1="390" y2="238.8" stroke="#d5dde7"/><line x1="520" x2="733.8" y1="390" y2="176.2" stroke="#d5dde7"/><line x1="520" x2="671.2" y1="390" y2="128.1" stroke="#d5dde7"/><line x1="520" x2="598.3" y1="390" y2="97.9" stroke="#d5dde7"/><text x="798.9" y="234" fill="#3b4a66" font-size="13" text-anchor="middle">30°</text><text x="681" y="116.1" fill="#3b4a66" font-size="13" text-anchor="middle">60°</text><text x="842" y="395" fill="#3b4a66" font-size="13">0°</text><text x="520" y="76.4" fill="#3b4a66" font-size="13" text-anchor="middle">90°</text><line x1="520" x2="822.4" y1="390" y2="390" stroke="#1f2a44" stroke-width="2.5"/><line x1="520" x2="520" y1="390" y2="87.6" stroke="#1f2a44" stroke-width="1.5"/><line x1="520" x2="688" y1="390" y2="166" stroke="#d9480f" stroke-width="4"/><text x="590" y="255.6" fill="#d9480f" font-size="16" font-weight="700" text-anchor="end">r = 5</text><path fill="none" stroke="#d9480f" stroke-width="3" d="M592.8 390a72.8 72.8 0 0 0-29.1-58.2"/><text x="601.2" y="364.8" fill="#d9480f" font-size="16" font-weight="700">θ ≈ 53.1°</text><circle cx="688" cy="166" r="8" fill="#1971c2" stroke="#fff" stroke-width="2"/><text x="702" y="156" fill="#1971c2" font-size="18" font-weight="700">(5, 53.1°)</text><text x="648" y="34" fill="#1f2a44" font-size="19" font-weight="700" text-anchor="middle">Polar: (r, θ)</text><text x="648" y="56" fill="#3b4a66" font-size="14" text-anchor="middle">How far out, at what angle</text><text x="430" y="456" fill="#3b4a66" font-size="15" text-anchor="middle">The same point: r = √(3² + 4²) = 5 and θ = arctan(4 ÷ 3) ≈ 53.1°</text></svg>