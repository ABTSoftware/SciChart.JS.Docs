<text x="350" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">5</text>
<text x="60" y="115" font-size="14" fill="#1f2a44" text-anchor="end">5</text>
<text x="60" y="410" font-size="14" fill="#1f2a44" text-anchor="end">0</text>
<line x1="70" y1="382" x2="238" y2="382" stroke="#d9480f" stroke-width="4"/>
<text x="154.0" y="374" font-size="16" font-weight="700" fill="#d9480f" text-anchor="middle">x = 3</text>
<line x1="246" y1="390" x2="246" y2="166" stroke="#d9480f" stroke-width="4"/>
<text x="254" y="283" font-size="16" font-weight="700" fill="#d9480f">y = 4</text>
<line x1="70" y1="166" x2="238" y2="166" stroke="#1971c2" stroke-width="2" stroke-dasharray="6 4"/>
