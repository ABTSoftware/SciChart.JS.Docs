<text x="252" y="156" font-size="18" font-weight="700" fill="#1971c2">(3, 4)</text>
<text x="198" y="34" font-size="19" font-weight="700" fill="#1f2a44" text-anchor="middle">Cartesian: (x, y)</text>
<text x="198" y="56" font-size="14" fill="#3b4a66" text-anchor="middle">How far across, how far up</text>
<path d="M 576 390 A 56 56 0 0 0 520 334" fill="none" stroke="#d5dde7"/>
<text x="576" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">1</text>
<path d="M 632 390 A 112 112 0 0 0 520 278" fill="none" stroke="#d5dde7"/>
<text x="632" y="410" font-size="14" fill="#1f2a44" text-anchor="middle">2</text>
