<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title id="title">How a kernel density estimate is built</title>
  <desc id="desc">Seven data values are marked as ticks on a horizontal axis. Above each one sits a small dashed bell-shaped bump of the same size. Adding the bumps together gives the solid density curve: high where values are close together, around 4 and around 8, and low where there are few values.</desc>
