<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Four common bullet chart variants</title>
<desc id="d">Four horizontal bullet charts. Standard: orders shipped on time, 82 percent against a 78 percent target, with the dark poor band on the left. Lower is better: defects per 1,000 units, 4.2 against a target of 3.5, with the bands reversed so the dark poor band is on the right. With a projection: revenue quarter to date, a dark bar to 52 thousand dollars and a lighter segment to a projected 94 thousand, against a 100 thousand target. Scale not from zero: an average rating of 4.1 out of 5 shown as a dot on a scale from 3 to 5, against a target of 4.4.</desc>
