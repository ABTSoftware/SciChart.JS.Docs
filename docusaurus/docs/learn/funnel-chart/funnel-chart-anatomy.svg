<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">The parts of a funnel chart</title>
<desc id="d">A funnel chart of a sales pipeline with four stages: 800 leads, 320 qualified, 120 proposals sent and 36 won. Centred bars get shorter at each stage, with faint tapered connectors between them. Numbered markers show the stage bar, the count with its overall conversion, the step conversion between two stages, the drop-off, and the final outcome of 4.5% of leads.</desc>
<rect width="760" height="560" fill="#FFFFFF"/>
<rect x="130.0" y="60" width="420.0" height="46" rx="4" fill="#2B8FB3"/>
<text x="118" y="88.0" text-anchor="end" font-size="15" fill="#4A5568">Leads</text>
<text x="560.0" y="88.0" font-size="15" font-weight="600" fill="#1B2A4A">800</text>
<polygon points="130.0,106 550.0,106 424.0,150 256.0,150" fill="#2B8FB3" fill-opacity="0.18"/>
<text x="340" y="133.0" text-anchor="middle" font-size="14" fill="#1B2A4A">40% continue</text>
<rect x="256.0" y="150" width="168.0" height="46" rx="4" fill="#2B8FB3"/>
<text x="118" y="178.0" text-anchor="end" font-size="15" fill="#4A5568">Qualified</text>
<text x="434.0" y="178.0" font-size="15" font-weight="600" fill="#1B2A4A">320 (40% of leads)</text>
<polygon points="256.0,196 424.0,196 371.5,240 308.5,240" fill="#2B8FB3" fill-opacity="0.18"/>
<text x="340" y="223.0" text-anchor="middle" font-size="14" fill="#1B2A4A">37.5% continue</text>
<rect x="308.5" y="240" width="63.0" height="46" rx="4" fill="#2B8FB3"/>
<text x="118" y="268.0" text-anchor="end" font-size="15" fill="#4A5568">Proposal sent</text>
<text x="381.5" y="268.0" font-size="15" font-weight="600" fill="#1B2A4A">120 (15% of leads)</text>
<polygon points="308.5,286 371.5,286 349.4,330 330.6,330" fill="#2B8FB3" fill-opacity="0.18"/>
<text x="340" y="313.0" text-anchor="middle" font-size="14" fill="#1B2A4A">30% continue</text>
<rect x="330.6" y="330" width="18.9" height="46" rx="4" fill="#2B8FB3"/>
<text x="118" y="358.0" text-anchor="end" font-size="15" fill="#4A5568">Won</text>
<text x="359.4" y="358.0" font-size="15" font-weight="600" fill="#1B2A4A">36 (4.5% of leads)</text>
<circle cx="165" cy="83" r="12" fill="#D6336C"/><text x="165" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<circle cx="596" cy="173" r="12" fill="#D6336C"/><text x="596" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="410" cy="218" r="12" fill="#D6336C"/><text x="410" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<circle cx="232" cy="128" r="12" fill="#D6336C"/><text x="232" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<circle cx="518" cy="353" r="12" fill="#D6336C"/><text x="518" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<line x1="40" y1="408" x2="720" y2="408" stroke="#E2E8F0"/>
<circle cx="52" cy="433" r="12" fill="#D6336C"/><text x="52" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="74" y="438" font-size="14" fill="#1B2A4A">Stage: one step of the process. The bar's width is the number that reached it.</text>
<circle cx="52" cy="459" r="12" fill="#D6336C"/><text x="52" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="74" y="464" font-size="14" fill="#1B2A4A">Count and overall conversion: the stage as a share of the first stage (320 ÷ 800 = 40%).</text>
<circle cx="52" cy="485" r="12" fill="#D6336C"/><text x="52" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="74" y="490" font-size="14" fill="#1B2A4A">Step conversion: the share of the stage above that reached this one (120 ÷ 320 = 37.5%).</text>
<circle cx="52" cy="511" r="12" fill="#D6336C"/><text x="52" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="74" y="516" font-size="14" fill="#1B2A4A">Drop-off: the shaded taper shows the people lost between two stages (800 − 320 = 480).</text>
<circle cx="52" cy="537" r="12" fill="#D6336C"/><text x="52" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<text x="74" y="542" font-size="14" fill="#1B2A4A">Outcome: 36 of the 800 leads were won, 4.5% overall.</text>
</svg>
