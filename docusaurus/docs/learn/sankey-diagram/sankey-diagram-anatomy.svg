<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">The parts of a Sankey diagram</title>
<desc id="d">Six nodes in three columns, labelled A to F, joined by curved links whose widths match their values. Callouts mark a source node, a link and its value, a middle node whose inflow equals its outflow (70 in, 70 out), the end nodes, and the three stages.</desc>
