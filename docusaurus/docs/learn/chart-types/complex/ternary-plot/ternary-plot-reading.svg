<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 820 560"><title>How to read a point on a ternary plot</title><desc>A ternary plot with sand at the bottom-left corner, silt at the bottom-right corner and clay at the top. One point is read three times: follow the horizontal gridline to the left side to read 30% clay, the gridline parallel to the left side up to the right side to read 20% silt, and the gridline parallel to the right side down to the base to read 50% sand. The three values add up to 100%.</desc><rect width="820" height="560" fill="#FFF"/><line x1="110" x2="470" y1="445.4" y2="445.4" stroke="#D5DCE6"/><line x1="310" x2="130" y1="168.2" y2="480" stroke="#D5DCE6"/><line x1="450" x2="270" y1="480" y2="168.2" stroke="#D5DCE6"/><line x1="130" x2="450" y1="410.7" y2="410.7" stroke="#D5DCE6"/><line x1="330" x2="170" y1="202.9" y2="480" stroke="#D5DCE6"/><line x1="410" x2="250" y1="480" y2="202.9" stroke="#D5DCE6"/><line x1="150" x2="430" y1="376.1" y2="376.1" stroke="#D5DCE6"/><line x1="350" x2="210" y1="237.5" y2="480" stroke="#D5DCE6"/><line x1="370" x2="230" y1="480" y2="237.5" stroke="#D5DCE6"/><line x1="170" x2="410" y1="341.4" y2="341.4" stroke="#D5DCE6"/><line x1="370" x2="250" y1="272.2" y2="480" stroke="#D5DCE6"/><line x1="330" x2="210" y1="480" y2="272.2" stroke="#D5DCE6"/><line x1="190" x2="390" y1="306.8" y2="306.8" stroke="#D5DCE6"/><line x1="390" x2="290" y1="306.8" y2="480" stroke="#D5DCE6"/><line x1="290" x2="190" y1="480" y2="306.8" stroke="#D5DCE6"/><line x1="210" x2="370" y1="272.2" y2="272.2" stroke="#D5DCE6"/><line x1="410" x2="330" y1="341.4" y2="480" stroke="#D5DCE6"/><line x1="250" x2="170" y1="480" y2="341.4" stroke="#D5DCE6"/><line x1="230" x2="350" y1="237.5" y2="237.5" stroke="#D5DCE6"/><line x1="430" x2="370" y1="376.1" y2="480" stroke="#D5DCE6"/><line x1="210" x2="150" y1="480" y2="376.1" stroke="#D5DCE6"/><line x1="250" x2="330" y1="202.9" y2="202.9" stroke="#D5DCE6"/><line x1="450" x2="410" y1="410.7" y2="480" stroke="#D5DCE6"/><line x1="170" x2="130" y1="480" y2="410.7" stroke="#D5DCE6"/><line x1="270" x2="310" y1="168.2" y2="168.2" stroke="#D5DCE6"/><line x1="470" x2="450" y1="445.4" y2="480" stroke="#D5DCE6"/><line x1="130" x2="110" y1="480" y2="445.4" stroke="#D5DCE6"/><polygon fill="none" stroke="#1F2A3C" stroke-width="2" points="90.0,480.0 490.0,480.0 290.0,133.6"/><line x1="90" x2="82" y1="480" y2="480" stroke="#D9670B" stroke-width="1.5"/><text x="78" y="485" fill="#D9670B" font-size="15" text-anchor="end">0</text><line x1="290" x2="294" y1="133.6" y2="126.7" stroke="#1C86A8" stroke-width="1.5"/><text x="299" y="128.7" fill="#1C86A8" font-size="15">0</text><line x1="490" x2="494" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="496" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">0</text><line x1="130" x2="122" y1="410.7" y2="410.7" stroke="#D9670B" stroke-width="1.5"/><text x="118" y="415.7" fill="#D9670B" font-size="15" text-anchor="end">20</text><line x1="330" x2="334" y1="202.9" y2="195.9" stroke="#1C86A8" stroke-width="1.5"/><text x="339" y="197.9" fill="#1C86A8" font-size="15">20</text><line x1="410" x2="414" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="416" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">20</text><line x1="170" x2="162" y1="341.4" y2="341.4" stroke="#D9670B" stroke-width="1.5"/><text x="158" y="346.4" fill="#D9670B" font-size="15" text-anchor="end">40</text><line x1="370" x2="374" y1="272.2" y2="265.2" stroke="#1C86A8" stroke-width="1.5"/><text x="379" y="267.2" fill="#1C86A8" font-size="15">40</text><line x1="330" x2="334" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="336" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">40</text><line x1="210" x2="202" y1="272.2" y2="272.2" stroke="#D9670B" stroke-width="1.5"/><text x="198" y="277.2" fill="#D9670B" font-size="15" text-anchor="end">60</text><line x1="410" x2="414" y1="341.4" y2="334.5" stroke="#1C86A8" stroke-width="1.5"/><text x="419" y="336.5" fill="#1C86A8" font-size="15">60</text><line x1="250" x2="254" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="256" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">60</text><line x1="250" x2="242" y1="202.9" y2="202.9" stroke="#D9670B" stroke-width="1.5"/><text x="238" y="207.9" fill="#D9670B" font-size="15" text-anchor="end">80</text><line x1="450" x2="454" y1="410.7" y2="403.8" stroke="#1C86A8" stroke-width="1.5"/><text x="459" y="405.8" fill="#1C86A8" font-size="15">80</text><line x1="170" x2="174" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="176" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">80</text><line x1="290" x2="282" y1="133.6" y2="133.6" stroke="#D9670B" stroke-width="1.5"/><text x="278" y="138.6" fill="#D9670B" font-size="15" text-anchor="end">100</text><line x1="490" x2="494" y1="480" y2="473.1" stroke="#1C86A8" stroke-width="1.5"/><text x="499" y="475.1" fill="#1C86A8" font-size="15">100</text><line x1="90" x2="94" y1="480" y2="486.9" stroke="#A87A00" stroke-width="1.5"/><text x="96" y="502.9" fill="#A87A00" font-size="15" text-anchor="middle">100</text><text x="290" y="99.6" fill="#D9670B" font-size="17" font-weight="700" text-anchor="middle">100% clay</text><text x="82" y="526" fill="#A87A00" font-size="17" font-weight="700" text-anchor="middle">100% sand</text><text x="498" y="526" fill="#1C86A8" font-size="17" font-weight="700" text-anchor="middle">100% silt</text><line x1="230" x2="150" y1="376.1" y2="376.1" stroke="#D9670B" stroke-dasharray="7 4" stroke-width="3"/><circle cx="150" cy="376.1" r="5" fill="#D9670B"/><line x1="230" x2="330" y1="376.1" y2="202.9" stroke="#1C86A8" stroke-dasharray="7 4" stroke-width="3"/><circle cx="330" cy="202.9" r="5" fill="#1C86A8"/><line x1="230" x2="290" y1="376.1" y2="480" stroke="#A87A00" stroke-dasharray="7 4" stroke-width="3"/><circle cx="290" cy="480" r="5" fill="#A87A00"/><circle cx="172" cy="362.1" r="11" fill="#D9670B"/><text x="172" y="367.1" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="300" cy="208.9" r="11" fill="#1C86A8"/><text x="300" y="213.9" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="264" cy="464" r="11" fill="#A87A00"/><text x="264" y="469" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">3</text><circle cx="230" cy="376.1" r="8" fill="#1F2A3C" stroke="#FFF" stroke-width="2"/><text x="204" y="400.1" fill="#1F2A3C" font-size="16" font-weight="700">P</text><text x="560" y="130" fill="#1F2A3C" font-size="18" font-weight="700">Reading point P</text><text x="560" y="170" fill="#D9670B" font-size="16" font-weight="700">1  Clay: 30%</text><text x="560" y="194" fill="#1F2A3C" font-size="14" font-weight="400">Follow the line parallel to the base</text><text x="560" y="216" fill="#1F2A3C" font-size="14" font-weight="400">to the left side.</text><text x="560" y="252" fill="#1C86A8" font-size="16" font-weight="700">2  Silt: 20%</text><text x="560" y="276" fill="#1F2A3C" font-size="14" font-weight="400">Follow the line parallel to the left</text><text x="560" y="298" fill="#1F2A3C" font-size="14" font-weight="400">side up to the right side.</text><text x="560" y="334" fill="#A87A00" font-size="16" font-weight="700">3  Sand: 50%</text><text x="560" y="358" fill="#1F2A3C" font-size="14" font-weight="400">Follow the line parallel to the right</text><text x="560" y="380" fill="#1F2A3C" font-size="14" font-weight="400">side down to the base.</text><text x="560" y="416" fill="#1F2A3C" font-size="16" font-weight="700">Check: 30 + 20 + 50 = 100</text><text x="560" y="440" fill="#1F2A3C" font-size="14" font-weight="400">Each line runs parallel to the side</text><text x="560" y="462" fill="#1F2A3C" font-size="14" font-weight="400">opposite that component&apos;s corner,</text><text x="560" y="484" fill="#1F2A3C" font-size="14" font-weight="400">where it is 0%.</text></svg>