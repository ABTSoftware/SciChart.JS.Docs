<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 780 390"><title id="t">The same three numbers drawn three ways</title><desc id="d">Three drawings of 1,000 visitors, 500 sign-ups and 50 buyers. A decorative funnel with a fixed taper makes the buyers band look almost half the size of the top band, when buyers are 5% of visitors. A funnel tapered by value gives the sign-ups band 37% of the top band&apos;s area although sign-ups are 50% of visitors. Centred bars give lengths of 100%, 50% and 5%, matching the data.</desc><rect width="780" height="390" fill="#FFF"/><text x="130" y="40" fill="#1B2A4A" font-size="17" font-weight="700" text-anchor="middle">Decorative funnel</text><polygon fill="#9AA5B1" points="20.0,78 240.0,78 213.3,139 46.7,139"/><text x="130" y="114" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">1,000</text><polygon fill="#9AA5B1" points="46.7,142 213.3,142 186.7,203 73.3,203"/><text x="130" y="178" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">500</text><polygon fill="#9AA5B1" points="73.3,206 186.7,206 160.0,267 100.0,267"/><text x="130" y="242" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">50</text><text x="130" y="306" fill="#4A5568" font-size="13" text-anchor="middle">The taper is fixed, not drawn from</text><text x="130" y="325" fill="#4A5568" font-size="13" text-anchor="middle">the data. Buyers look almost half</text><text x="130" y="344" fill="#4A5568" font-size="13" text-anchor="middle">the top band; they are 5% of it.</text><text x="390" y="40" fill="#1B2A4A" font-size="17" font-weight="700" text-anchor="middle">Funnel tapered by value</text><polygon fill="#2B8FB3" fill-opacity=".75" points="280.0,78 500.0,78 445.0,139 335.0,139"/><text x="390" y="114" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">1,000</text><polygon fill="#2B8FB3" fill-opacity=".75" points="335.0,142 445.0,142 395.5,203 384.5,203"/><text x="390" y="178" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">500</text><polygon fill="#2B8FB3" fill-opacity=".75" points="384.5,206 395.5,206 395.5,267 384.5,267"/><text x="403.5" y="242" fill="#1B2A4A" font-size="14" font-weight="600">50</text><text x="390" y="306" fill="#4A5568" font-size="13" text-anchor="middle">Each band runs from one stage&apos;s</text><text x="390" y="325" fill="#4A5568" font-size="13" text-anchor="middle">value to the next, so its area mixes</text><text x="390" y="344" fill="#4A5568" font-size="13" text-anchor="middle">two stages: Sign-ups get 37% of the</text><text x="390" y="363" fill="#4A5568" font-size="13" text-anchor="middle">top band&apos;s area for 50% of the people.</text><text x="650" y="40" fill="#1B2A4A" font-size="17" font-weight="700" text-anchor="middle">Centred bars</text><rect width="220" height="40" x="540" y="90" fill="#2B8FB3" rx="3"/><text x="650" y="115" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">1,000</text><rect width="110" height="40" x="595" y="154" fill="#2B8FB3" rx="3"/><text x="650" y="179" fill="#FFF" font-size="14" font-weight="600" text-anchor="middle">500</text><rect width="11" height="40" x="644.5" y="218" fill="#2B8FB3" rx="3"/><text x="663.5" y="243" fill="#1B2A4A" font-size="14" font-weight="600">50</text><text x="650" y="306" fill="#4A5568" font-size="13" text-anchor="middle">Each bar&apos;s length is its value:</text><text x="650" y="325" fill="#4A5568" font-size="13" text-anchor="middle">100%, 50% and 5%. Easy to compare,</text><text x="650" y="344" fill="#4A5568" font-size="13" text-anchor="middle">with nothing to misjudge.</text><text x="390" y="62" fill="#4A5568" font-size="13" text-anchor="middle">Top to bottom: 1,000 visitors, 500 sign-ups, 50 buyers</text><line x1="260" x2="260" y1="78" y2="340" stroke="#E2E8F0"/><line x1="520" x2="520" y1="78" y2="340" stroke="#E2E8F0"/></svg>