<svg xmlns="http://www.w3.org/2000/svg" width="780" height="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 780 368"><title>Two ways to lay out a treemap: strips and squarified</title><desc>The same seven values (6, 6, 4, 3, 2, 2 and 1) laid out two ways in the same box. Cut into strips, the smallest rectangle is 16 times taller than it is wide. With the squarified layout, no rectangle is more than 2.8 times longer than it is wide.</desc><rect width="780" height="368" fill="#fff"/><text x="30" y="40" fill="#1d2a3a" font-size="17" font-weight="700">1. Cut into strips (slice and dice)</text><rect width="77.5" height="210" x="30" y="70" fill="#8A6FD1" fill-opacity=".99" stroke="#fff" stroke-width="2"/><text x="68.8" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text><rect width="77.5" height="210" x="107.5" y="70" fill="#8A6FD1" fill-opacity=".99" stroke="#fff" stroke-width="2"/><text x="146.2" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text><rect width="51.7" height="210" x="185" y="70" fill="#8A6FD1" fill-opacity=".81" stroke="#fff" stroke-width="2"/><text x="210.8" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text><rect width="38.8" height="210" x="236.7" y="70" fill="#8A6FD1" fill-opacity=".72" stroke="#fff" stroke-width="2"/><text x="256" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text><rect width="25.8" height="210" x="275.4" y="70" fill="#8A6FD1" fill-opacity=".63" stroke="#fff" stroke-width="2"/><text x="288.3" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><rect width="25.8" height="210" x="301.2" y="70" fill="#8A6FD1" fill-opacity=".63" stroke="#fff" stroke-width="2"/><text x="314.2" y="180" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><rect width="12.9" height="210" x="327.1" y="70" fill="#8A6FD1" fill-opacity=".54" stroke="#fff" stroke-width="2"/><text x="30" y="316" fill="#1d2a3a" font-size="14" font-weight="700">Longest side up to 16 times the shortest.</text><text x="30" y="335" fill="#3c4a5c" font-size="14">Thin slivers are hard to compare</text><text x="30" y="354" fill="#3c4a5c" font-size="14">and leave no room for labels.</text><text x="440" y="40" fill="#1d2a3a" font-size="17" font-weight="700">2. Squarified, in rows</text><rect width="155" height="105" x="440" y="70" fill="#2E9CB8" fill-opacity=".99" stroke="#fff" stroke-width="2"/><text x="517.5" y="127.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text><rect width="155" height="105" x="440" y="175" fill="#2E9CB8" fill-opacity=".99" stroke="#fff" stroke-width="2"/><text x="517.5" y="232.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text><rect width="88.6" height="122.5" x="595" y="70" fill="#2E9CB8" fill-opacity=".81" stroke="#fff" stroke-width="2"/><text x="639.3" y="136.2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text><rect width="66.4" height="122.5" x="683.6" y="70" fill="#2E9CB8" fill-opacity=".72" stroke="#fff" stroke-width="2"/><text x="716.8" y="136.2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text><rect width="62" height="87.5" x="595" y="192.5" fill="#2E9CB8" fill-opacity=".63" stroke="#fff" stroke-width="2"/><text x="626" y="241.2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><rect width="62" height="87.5" x="657" y="192.5" fill="#2E9CB8" fill-opacity=".63" stroke="#fff" stroke-width="2"/><text x="688" y="241.2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><rect width="31" height="87.5" x="719" y="192.5" fill="#2E9CB8" fill-opacity=".54" stroke="#fff" stroke-width="2"/><text x="734.5" y="241.2" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text><rect width="152" height="207" x="441.5" y="71.5" fill="none" stroke="#1d2a3a" stroke-dasharray="6 4" stroke-width="2"/><rect width="46" height="19" x="446" y="76" fill="#fff" rx="3"/><text x="469" y="90" fill="#1d2a3a" font-size="13" font-weight="700" text-anchor="middle">row 1</text><rect width="152" height="119.5" x="596.5" y="71.5" fill="none" stroke="#1d2a3a" stroke-dasharray="6 4" stroke-width="2"/><rect width="46" height="19" x="601" y="76" fill="#fff" rx="3"/><text x="624" y="90" fill="#1d2a3a" font-size="13" font-weight="700" text-anchor="middle">row 2</text><rect width="59" height="84.5" x="596.5" y="194" fill="none" stroke="#1d2a3a" stroke-dasharray="6 4" stroke-width="2"/><rect width="59" height="84.5" x="658.5" y="194" fill="none" stroke="#1d2a3a" stroke-dasharray="6 4" stroke-width="2"/><rect width="28" height="84.5" x="720.5" y="194" fill="none" stroke="#1d2a3a" stroke-dasharray="6 4" stroke-width="2"/><rect width="66" height="19" x="601" y="198.5" fill="#fff" rx="3"/><text x="634" y="212.5" fill="#1d2a3a" font-size="13" font-weight="700" text-anchor="middle">rows 3–5</text><text x="440" y="316" fill="#1d2a3a" font-size="14" font-weight="700">Longest side up to 2.8 times the shortest.</text><text x="440" y="335" fill="#3c4a5c" font-size="14">Rows are added along the shorter side while</text><text x="440" y="354" fill="#3c4a5c" font-size="14">they make the rectangles squarer.</text></svg>