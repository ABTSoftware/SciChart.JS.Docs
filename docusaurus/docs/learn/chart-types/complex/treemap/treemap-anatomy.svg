<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 780 400"><title>The parts of a treemap</title><desc>A treemap of a total of 100 split into two groups. Group A (60) holds leaves A1 (30), A2 (18) and A3 (12); group B (40) holds B1 (22), B2 (12) and B3 (6). Callouts mark a group rectangle and its header, a leaf whose area matches its value, colour showing the group, and a small leaf whose label is left out.</desc><rect width="780" height="400" fill="#fff"/><text x="30" y="34" fill="#1d2a3a" font-size="17" font-weight="700">A treemap of a total of 100</text><rect width="258" height="294" x="33" y="63" fill="#2E9CB8" fill-opacity=".16" stroke="#2E9CB8" stroke-width="1.5"/><text x="41" y="82" fill="#1d2a3a" font-size="15" font-weight="700">Group A  (60)</text><rect width="250" height="131" x="37" y="91" fill="#2E9CB8" stroke="#fff" stroke-width="2"/><text x="162" y="154.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">A1</text><text x="162" y="172.5" fill="#fff" font-size="14" text-anchor="middle">30</text><rect width="150" height="131" x="37" y="222" fill="#2E9CB8" stroke="#fff" stroke-width="2"/><text x="112" y="285.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">A2</text><text x="112" y="303.5" fill="#fff" font-size="14" text-anchor="middle">18</text><rect width="100" height="131" x="187" y="222" fill="#2E9CB8" stroke="#fff" stroke-width="2"/><text x="237" y="285.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">A3</text><text x="237" y="303.5" fill="#fff" font-size="14" text-anchor="middle">12</text><rect width="170" height="294" x="297" y="63" fill="#E07A1F" fill-opacity=".16" stroke="#E07A1F" stroke-width="1.5"/><text x="305" y="82" fill="#1d2a3a" font-size="15" font-weight="700">Group B  (40)</text><rect width="162" height="144.1" x="301" y="91" fill="#E07A1F" stroke="#fff" stroke-width="2"/><text x="382" y="161.1" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">B1</text><text x="382" y="179.1" fill="#fff" font-size="14" text-anchor="middle">22</text><rect width="108" height="117.9" x="301" y="235.1" fill="#E07A1F" stroke="#fff" stroke-width="2"/><text x="355" y="292.1" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">B2</text><text x="355" y="310.1" fill="#fff" font-size="14" text-anchor="middle">12</text><rect width="54" height="117.9" x="409" y="235.1" fill="#E07A1F" stroke="#fff" stroke-width="2"/><line x1="407" x2="497" y1="75" y2="73" stroke="#55657a" stroke-width="1.2"/><circle cx="407" cy="75" r="3.5" fill="#1d2a3a"/><text x="505" y="78" fill="#1d2a3a" font-size="15" font-weight="700">Group (parent)</text><text x="505" y="96" fill="#3c4a5c" font-size="14">Its area is the group total, 40</text><text x="505" y="114" fill="#3c4a5c" font-size="14">Header: name and total</text><line x1="449" x2="497" y1="183.1" y2="163" stroke="#55657a" stroke-width="1.2"/><circle cx="449" cy="183.1" r="3.5" fill="#1d2a3a"/><text x="505" y="168" fill="#1d2a3a" font-size="15" font-weight="700">Leaf rectangle</text><text x="505" y="186" fill="#3c4a5c" font-size="14">Area matches its value:</text><text x="505" y="204" fill="#3c4a5c" font-size="14">B1 is 22% of the whole</text><line x1="467" x2="497" y1="245.3" y2="253" stroke="#55657a" stroke-width="1.2"/><circle cx="467" cy="245.3" r="3.5" fill="#1d2a3a"/><text x="505" y="258" fill="#1d2a3a" font-size="15" font-weight="700">Colour shows the group</text><text x="505" y="276" fill="#3c4a5c" font-size="14">All of group B is orange</text><line x1="436" x2="497" y1="323.5" y2="323" stroke="#55657a" stroke-width="1.2"/><circle cx="436" cy="323.5" r="3.5" fill="#1d2a3a"/><text x="505" y="328" fill="#1d2a3a" font-size="15" font-weight="700">Small leaf (B3, 6)</text><text x="505" y="346" fill="#3c4a5c" font-size="14">Label left out: hover or</text><text x="505" y="364" fill="#3c4a5c" font-size="14">zoom in to read it</text></svg>