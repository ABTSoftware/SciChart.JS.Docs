<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" aria-labelledby="t d">
<title id="t">One county, three ways to map its population density</title>
<desc id="d">Kershaw County, South Carolina, had 65,403 people on 726.6 square miles of land in 2020, so its population density was 65,403 divided by 726.6, or 90 people per square mile. A choropleth map shades the whole county in the colour of the 50 to 250 class. A dot density map with one dot per 1,000 people puts 65 dots at random places inside the county. A 3D map raises the county as a block whose height stands for 90 people per square mile.</desc>
<rect width="1000" height="660" fill="#FFFFFF"/>
<text x="30" y="40" fill="#1B2733" font-size="21" font-weight="700">1. Divide people by land area</text>
<text x="30" y="66" fill="#4A5868" font-size="17">Kershaw County, South Carolina, 2020</text>
