<g fill="#1B2733" font-size="18"><text x="265" y="130">65,403 people</text><text x="265" y="160">÷ 726.6 sq miles of land</text><line x1="265" y1="174" x2="470" y2="174" stroke="#1B2733" stroke-width="1.2"/><text x="265" y="200" font-weight="700">= 90 people per sq mile</text></g>
<text x="530" y="40" fill="#1B2733" font-size="21" font-weight="700">2. Choropleth: shade the whole county</text>
<text x="530" y="66" fill="#4A5868" font-size="17">The colour of its class, 50 to 250</text>
