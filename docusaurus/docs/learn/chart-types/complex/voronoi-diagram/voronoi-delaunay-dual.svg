<title id="t">Voronoi diagram and Delaunay triangulation</title>
<desc id="d">Sixteen sites with their Voronoi cell edges drawn as solid dark lines and the Delaunay triangulation drawn as dashed orange lines joining every pair of sites whose cells share an edge. One Delaunay triangle is shaded; its circumcircle is drawn dashed in purple, contains no other site, and its centre sits exactly on a Voronoi vertex.</desc>
