<line x1="590" y1="65" x2="622" y2="65" stroke="#2b3a55" stroke-width="2.5"/><text x="634" y="70" font-size="16" font-weight="700" fill="#1b1b1b">Voronoi edges</text><text x="634" y="91" font-size="15" fill="#333">Boundaries between cells</text><line x1="590" y1="118" x2="622" y2="118" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 4"/><text x="634" y="123" font-size="16" font-weight="700" fill="#1b1b1b">Delaunay edges</text><text x="634" y="144" font-size="15" fill="#333">Join two sites whose cells</text><text x="634" y="163" font-size="15" fill="#333">share an edge, and cross it</text><text x="634" y="182" font-size="15" fill="#333">at a right angle when they meet</text><rect x="594" y="199" width="24" height="20" fill="#ffd8a8"/><text x="634" y="214" font-size="16" font-weight="700" fill="#1b1b1b">One Delaunay triangle</text><text x="634" y="235" font-size="15" fill="#333">Its three sites' cells meet</text><text x="634" y="254" font-size="15" fill="#333">at one Voronoi vertex</text><circle cx="606" cy="281" r="11" fill="none" stroke="#7048e8" stroke-width="2.2" stroke-dasharray="3 4"/><circle cx="606" cy="281" r="5" fill="#7048e8"/><text x="634" y="286" font-size="16" font-weight="700" fill="#1b1b1b">Empty circumcircle</text><text x="634" y="307" font-size="15" fill="#333">Centred on that vertex, with</text><text x="634" y="326" font-size="15" fill="#333">no other site inside it</text></g>
