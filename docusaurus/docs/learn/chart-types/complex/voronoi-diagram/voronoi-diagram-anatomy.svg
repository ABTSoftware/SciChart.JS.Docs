<circle cx="274.4" cy="305.2" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
<circle cx="394.0" cy="81.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
<circle cx="414.8" cy="248.0" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
