<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d">
<title id="t">Parts of a Voronoi diagram</title>
<desc id="d">Nine sites in a rectangle, each surrounded by its Voronoi cell in a pale colour. Numbered callouts mark a site, the highlighted cell around the central site, an edge crossed at a right angle by the dashed line joining its two sites, a vertex with a dashed circle through the three sites around it that contains no other site, and an unbounded cell at the edge of the frame.</desc>
<rect width="860" height="400" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<polygon points="152.4,152.9 132.8,40.0 30.0,40.0 30.0,221.3 52.8,218.0" fill="#dbe9f6" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="52.8,218.0 194.0,315.1 248.5,231.3 207.5,163.9 152.4,152.9" fill="#fde2c8" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="207.5,163.9 297.8,67.9 297.8,40.0 132.8,40.0 152.4,152.9" fill="#d9f0d3" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="377.9,168.1 297.8,68.0 207.5,163.9 248.5,231.3 329.8,240.3" fill="#9cc3ea" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="375.3,352.0 329.8,240.3 248.5,231.3 194.0,315.1 197.6,352.0" fill="#d9f0d3" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="414.1,163.6 500.6,40.0 297.8,40.0 297.8,68.0 377.9,168.1" fill="#fde2c8" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="550.0,284.4 414.1,163.6 377.9,168.1 329.8,240.3 375.3,352.0 550.0,352.0" fill="#efdcf2" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="500.6,40.0 414.1,163.6 550.0,284.4 550.0,40.0" fill="#dbe9f6" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="197.6,352.0 194.0,315.1 52.8,218.0 30.0,221.3 30.0,352.0" fill="#efdcf2" stroke="#2b3a55" stroke-width="2" stroke-linejoin="round"/>
<line x1="290.0" y1="164.8" x2="414.8" y2="248.0" stroke="#d9480f" stroke-width="2" stroke-dasharray="7 5"/>
