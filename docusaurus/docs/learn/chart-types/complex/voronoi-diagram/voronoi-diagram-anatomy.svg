<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" aria-labelledby="t d" viewBox="0 0 860 400"><title id="t">Parts of a Voronoi diagram</title><desc id="d">Nine sites in a rectangle, each surrounded by its Voronoi cell in a pale colour. Numbered callouts mark a site, the highlighted cell around the central site, an edge crossed at a right angle by the dashed line joining its two sites, a vertex with a dashed circle through the three sites around it that contains no other site, and an unbounded cell at the edge of the frame.</desc><rect width="860" height="400" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><polygon fill="#dbe9f6" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="152.4,152.9 132.8,40.0 30.0,40.0 30.0,221.3 52.8,218.0"/><polygon fill="#fde2c8" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="52.8,218.0 194.0,315.1 248.5,231.3 207.5,163.9 152.4,152.9"/><polygon fill="#d9f0d3" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="207.5,163.9 297.8,67.9 297.8,40.0 132.8,40.0 152.4,152.9"/><polygon fill="#9cc3ea" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="377.9,168.1 297.8,68.0 207.5,163.9 248.5,231.3 329.8,240.3"/><polygon fill="#d9f0d3" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="375.3,352.0 329.8,240.3 248.5,231.3 194.0,315.1 197.6,352.0"/><polygon fill="#fde2c8" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="414.1,163.6 500.6,40.0 297.8,40.0 297.8,68.0 377.9,168.1"/><polygon fill="#efdcf2" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="550.0,284.4 414.1,163.6 377.9,168.1 329.8,240.3 375.3,352.0 550.0,352.0"/><polygon fill="#dbe9f6" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="500.6,40.0 414.1,163.6 550.0,284.4 550.0,40.0"/><polygon fill="#efdcf2" stroke="#2b3a55" stroke-linejoin="round" stroke-width="2" points="197.6,352.0 194.0,315.1 52.8,218.0 30.0,221.3 30.0,352.0"/><line x1="290" x2="414.8" y1="164.8" y2="248" stroke="#d9480f" stroke-dasharray="7 5" stroke-width="2"/><path fill="none" stroke="#d9480f" stroke-width="2" d="m360.7 211.9-5.5 8.4-8.3-5.6"/><circle cx="207.5" cy="163.9" r="82.5" fill="none" stroke="#7048e8" stroke-dasharray="6 5" stroke-width="2"/><line x1="207.5" x2="170.4" y1="163.9" y2="237.6" stroke="#7048e8" stroke-width="1.5"/><line x1="207.5" x2="201.6" y1="163.9" y2="81.6" stroke="#7048e8" stroke-width="1.5"/><line x1="207.5" x2="290" y1="163.9" y2="164.8" stroke="#7048e8" stroke-width="1.5"/><circle cx="207.5" cy="163.9" r="6" fill="#7048e8" stroke="#fff" stroke-width="2"/><circle cx="82" cy="102.4" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="170.4" cy="237.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="201.6" cy="81.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="290" cy="164.8" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="274.4" cy="305.2" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="394" cy="81.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="414.8" cy="248" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="498" cy="154.4" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><circle cx="113.2" cy="320.8" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/><rect width="520" height="312" x="30" y="40" fill="none" stroke="#2b3a55" stroke-width="2"/><circle cx="104" cy="84.4" r="13" fill="#1f3a68"/><text x="104" y="89.4" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text><circle cx="282" cy="194.8" r="13" fill="#1f3a68"/><text x="282" y="199.8" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><circle cx="378.4" cy="200.4" r="13" fill="#1f3a68"/><text x="378.4" y="205.4" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text><circle cx="209.5" cy="189.9" r="13" fill="#1f3a68"/><text x="209.5" y="194.9" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text><circle cx="500" cy="188.4" r="13" fill="#1f3a68"/><text x="500" y="193.4" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">5</text><circle cx="602" cy="61" r="13" fill="#1f3a68"/><text x="602" y="66" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="624" y="66" fill="#1b1b1b" font-size="16" font-weight="700">Site</text><text x="624" y="87" fill="#333" font-size="15">The point a cell is built around</text><text x="624" y="106" fill="#333" font-size="15">(also called a seed or generator)</text><circle cx="602" cy="133" r="13" fill="#1f3a68"/><text x="602" y="138" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="624" y="138" fill="#1b1b1b" font-size="16" font-weight="700">Cell</text><text x="624" y="159" fill="#333" font-size="15">Every point closer to this site</text><text x="624" y="178" fill="#333" font-size="15">than to any other site</text><circle cx="602" cy="205" r="13" fill="#1f3a68"/><text x="602" y="210" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="624" y="210" fill="#1b1b1b" font-size="16" font-weight="700">Edge</text><text x="624" y="231" fill="#333" font-size="15">Part of the perpendicular</text><text x="624" y="250" fill="#333" font-size="15">bisector of two sites</text><circle cx="602" cy="277" r="13" fill="#1f3a68"/><text x="602" y="282" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="624" y="282" fill="#1b1b1b" font-size="16" font-weight="700">Vertex</text><text x="624" y="303" fill="#333" font-size="15">Equally far from three sites; the</text><text x="624" y="322" fill="#333" font-size="15">circle through them is empty</text><circle cx="602" cy="349" r="13" fill="#1f3a68"/><text x="602" y="354" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="624" y="354" fill="#1b1b1b" font-size="16" font-weight="700">Unbounded cell</text><text x="624" y="375" fill="#333" font-size="15">Sites on the outside have open</text><text x="624" y="394" fill="#333" font-size="15">cells, cut here by the frame</text></g></svg>