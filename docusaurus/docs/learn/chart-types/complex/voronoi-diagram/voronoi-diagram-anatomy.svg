<line x1="207.5" y1="163.9" x2="290.0" y2="164.8" stroke="#7048e8" stroke-width="1.5"/>
<circle cx="207.5" cy="163.9" r="6" fill="#7048e8" stroke="#fff" stroke-width="2"/>
<circle cx="82.0" cy="102.4" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
<circle cx="170.4" cy="237.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
<circle cx="201.6" cy="81.6" r="6" fill="#1b1b1b" stroke="#fff" stroke-width="2"/>
