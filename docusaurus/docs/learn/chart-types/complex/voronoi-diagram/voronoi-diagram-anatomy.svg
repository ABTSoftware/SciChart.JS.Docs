<circle cx="104.0" cy="84.4" r="13" fill="#1f3a68"/><text x="104.0" y="89.4" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">1</text><circle cx="282.0" cy="194.8" r="13" fill="#1f3a68"/><text x="282.0" y="199.8" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">2</text><circle cx="378.4" cy="200.4" r="13" fill="#1f3a68"/><text x="378.4" y="205.4" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">3</text><circle cx="209.5" cy="189.9" r="13" fill="#1f3a68"/><text x="209.5" y="194.9" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">4</text><circle cx="500.0" cy="188.4" r="13" fill="#1f3a68"/><text x="500.0" y="193.4" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">5</text><circle cx="602.0" cy="61.0" r="13" fill="#1f3a68"/><text x="602.0" y="66.0" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">1</text><text x="624" y="66" font-size="16" font-weight="700" fill="#1b1b1b">Site</text><text x="624" y="87" font-size="15" fill="#333">The point a cell is built around</text><text x="624" y="106" font-size="15" fill="#333">(also called a seed or generator)</text><circle cx="602.0" cy="133.0" r="13" fill="#1f3a68"/><text x="602.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">2</text><text x="624" y="138" font-size="16" font-weight="700" fill="#1b1b1b">Cell</text><text x="624" y="159" font-size="15" fill="#333">Every point closer to this site</text><text x="624" y="178" font-size="15" fill="#333">than to any other site</text><circle cx="602.0" cy="205.0" r="13" fill="#1f3a68"/><text x="602.0" y="210.0" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">3</text><text x="624" y="210" font-size="16" font-weight="700" fill="#1b1b1b">Edge</text><text x="624" y="231" font-size="15" fill="#333">Part of the perpendicular</text><text x="624" y="250" font-size="15" fill="#333">bisector of two sites</text><circle cx="602.0" cy="277.0" r="13" fill="#1f3a68"/><text x="602.0" y="282.0" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">4</text><text x="624" y="282" font-size="16" font-weight="700" fill="#1b1b1b">Vertex</text><text x="624" y="303" font-size="15" fill="#333">Equally far from three sites; the</text><text x="624" y="322" font-size="15" fill="#333">circle through them is empty</text><circle cx="602.0" cy="349.0" r="13" fill="#1f3a68"/><text x="602.0" y="354.0" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">5</text><text x="624" y="354" font-size="16" font-weight="700" fill="#1b1b1b">Unbounded cell</text><text x="624" y="375" font-size="15" fill="#333">Sites on the outside have open</text><text x="624" y="394" font-size="15" fill="#333">cells, cut here by the frame</text></g>
</svg>
