<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="t d">
<title id="t">How Renko bricks form from daily closing prices</title>
<desc id="d">Left: ten daily closing prices from 100.00 to 102.10 plotted as a line, with dashed lines every 1 dollar marking the box boundaries. Right: the six Renko bricks they make with a 1 dollar box and a two-box reversal: up bricks on days 3, 4 and 4, down bricks on days 7 and 8, and an up brick on day 10. Days 2, 5, 6 and 9 make no brick.</desc>
<rect width="860" height="480" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<line x1="80" y1="400.0" x2="430" y2="400.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="400.0" x2="820" y2="400.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="405.0" font-size="15" text-anchor="end" fill="#333">$99</text>
<text x="510" y="405.0" font-size="15" text-anchor="end" fill="#333">$99</text>
<line x1="80" y1="334.0" x2="430" y2="334.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="334.0" x2="820" y2="334.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="339.0" font-size="15" text-anchor="end" fill="#333">$100</text>
<text x="510" y="339.0" font-size="15" text-anchor="end" fill="#333">$100</text>
<line x1="80" y1="268.0" x2="430" y2="268.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="268.0" x2="820" y2="268.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="273.0" font-size="15" text-anchor="end" fill="#333">$101</text>
<text x="510" y="273.0" font-size="15" text-anchor="end" fill="#333">$101</text>
<line x1="80" y1="202.0" x2="430" y2="202.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="202.0" x2="820" y2="202.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="207.0" font-size="15" text-anchor="end" fill="#333">$102</text>
<text x="510" y="207.0" font-size="15" text-anchor="end" fill="#333">$102</text>
<line x1="80" y1="136.0" x2="430" y2="136.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="136.0" x2="820" y2="136.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="141.0" font-size="15" text-anchor="end" fill="#333">$103</text>
<text x="510" y="141.0" font-size="15" text-anchor="end" fill="#333">$103</text>
<line x1="80" y1="70.0" x2="430" y2="70.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<line x1="520" y1="70.0" x2="820" y2="70.0" stroke="#c5cedb" stroke-dasharray="4 4"/>
<text x="70" y="75.0" font-size="15" text-anchor="end" fill="#333">$104</text>
<text x="510" y="75.0" font-size="15" text-anchor="end" fill="#333">$104</text>
<text x="255.0" y="40" font-size="18" font-weight="600" text-anchor="middle" fill="#1b2a44">1. Daily closing prices</text>
<text x="670.0" y="40" font-size="18" font-weight="600" text-anchor="middle" fill="#1b2a44">2. Renko bricks ($1 box)</text>
<polyline points="100.0,334.0 134.4,294.4 168.9,248.2 203.3,109.6 237.8,188.8 272.2,221.8 306.7,274.6 341.1,347.2 375.6,287.8 410.0,195.4" fill="none" stroke="#2a6397" stroke-width="2.5"/>
<circle cx="100.0" cy="334.0" r="6" fill="#8a96a8" stroke="#ffffff" stroke-width="1.5"/>
<text x="100.0" y="424" font-size="14" text-anchor="middle" fill="#333">1</text>
<circle cx="134.4" cy="294.4" r="6" fill="#8a96a8" stroke="#ffffff" stroke-width="1.5"/>
<text x="134.4" y="424" font-size="14" text-anchor="middle" fill="#333">2</text>
<circle cx="168.9" cy="248.2" r="6" fill="#26a69a" stroke="#ffffff" stroke-width="1.5"/>
<text x="168.9" y="424" font-size="14" text-anchor="middle" fill="#333">3</text>
<circle cx="203.3" cy="109.6" r="6" fill="#26a69a" stroke="#ffffff" stroke-width="1.5"/>
<text x="203.3" y="424" font-size="14" text-anchor="middle" fill="#333">4</text>
<circle cx="237.8" cy="188.8" r="6" fill="#8a96a8" stroke="#ffffff" stroke-width="1.5"/>
<text x="237.8" y="424" font-size="14" text-anchor="middle" fill="#333">5</text>
<circle cx="272.2" cy="221.8" r="6" fill="#8a96a8" stroke="#ffffff" stroke-width="1.5"/>
<text x="272.2" y="424" font-size="14" text-anchor="middle" fill="#333">6</text>
<circle cx="306.7" cy="274.6" r="6" fill="#ef5350" stroke="#ffffff" stroke-width="1.5"/>
<text x="306.7" y="424" font-size="14" text-anchor="middle" fill="#333">7</text>
<circle cx="341.1" cy="347.2" r="6" fill="#ef5350" stroke="#ffffff" stroke-width="1.5"/>
<text x="341.1" y="424" font-size="14" text-anchor="middle" fill="#333">8</text>
<circle cx="375.6" cy="287.8" r="6" fill="#8a96a8" stroke="#ffffff" stroke-width="1.5"/>
<text x="375.6" y="424" font-size="14" text-anchor="middle" fill="#333">9</text>
<circle cx="410.0" cy="195.4" r="6" fill="#26a69a" stroke="#ffffff" stroke-width="1.5"/>
<text x="410.0" y="424" font-size="14" text-anchor="middle" fill="#333">10</text>
<text x="255.0" y="448" font-size="15" text-anchor="middle" fill="#333">Day</text>
<text x="90.0" y="363.7" font-size="13" fill="#b03a37">Day 7: the close is at least two boxes below the $103 top,</text>
<text x="90.0" y="379.7" font-size="13" fill="#b03a37">so the first down brick forms ($102 to $101)</text>
<rect x="524.0" y="268.0" width="42.0" height="66.0" fill="#26a69a" stroke="#14233c" stroke-width="1"/>
<text x="545.0" y="306.0" font-size="13" text-anchor="middle" fill="#ffffff">day 3</text>
<text x="545.0" y="424" font-size="14" text-anchor="middle" fill="#333">1</text>
<rect x="574.0" y="202.0" width="42.0" height="66.0" fill="#26a69a" stroke="#14233c" stroke-width="1"/>
<text x="595.0" y="240.0" font-size="13" text-anchor="middle" fill="#ffffff">day 4</text>
<text x="595.0" y="424" font-size="14" text-anchor="middle" fill="#333">2</text>
<rect x="624.0" y="136.0" width="42.0" height="66.0" fill="#26a69a" stroke="#14233c" stroke-width="1"/>
<text x="645.0" y="174.0" font-size="13" text-anchor="middle" fill="#ffffff">day 4</text>
<text x="645.0" y="424" font-size="14" text-anchor="middle" fill="#333">3</text>
<rect x="674.0" y="202.0" width="42.0" height="66.0" fill="#ef5350" stroke="#14233c" stroke-width="1"/>
<text x="695.0" y="240.0" font-size="13" text-anchor="middle" fill="#ffffff">day 7</text>
<text x="695.0" y="424" font-size="14" text-anchor="middle" fill="#333">4</text>
<rect x="724.0" y="268.0" width="42.0" height="66.0" fill="#ef5350" stroke="#14233c" stroke-width="1"/>
<text x="745.0" y="306.0" font-size="13" text-anchor="middle" fill="#ffffff">day 8</text>
<text x="745.0" y="424" font-size="14" text-anchor="middle" fill="#333">5</text>
<rect x="774.0" y="202.0" width="42.0" height="66.0" fill="#26a69a" stroke="#14233c" stroke-width="1"/>
<text x="795.0" y="240.0" font-size="13" text-anchor="middle" fill="#ffffff">day 10</text>
<text x="795.0" y="424" font-size="14" text-anchor="middle" fill="#333">6</text>
<text x="670.0" y="448" font-size="15" text-anchor="middle" fill="#333">Brick number (no time axis)</text>
<text x="80" y="472" font-size="13" fill="#555">Grey points made no brick. Green: up brick formed. Red: down brick formed.</text>
</g></svg>