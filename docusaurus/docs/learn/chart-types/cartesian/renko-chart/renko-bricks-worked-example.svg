<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" aria-labelledby="t d" viewBox="0 0 860 480"><title id="t">How Renko bricks form from daily closing prices</title><desc id="d">Left: ten daily closing prices from 100.00 to 102.10 plotted as a line, with dashed lines every 1 dollar marking the box boundaries. Right: the six Renko bricks they make with a 1 dollar box and a two-box reversal: up bricks on days 3, 4 and 4, down bricks on days 7 and 8, and an up brick on day 10. Days 2, 5, 6 and 9 make no brick.</desc><rect width="860" height="480" fill="#fff"/><g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><line x1="80" x2="430" y1="400" y2="400" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="400" y2="400" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="405" fill="#333" font-size="15" text-anchor="end">$99</text><text x="510" y="405" fill="#333" font-size="15" text-anchor="end">$99</text><line x1="80" x2="430" y1="334" y2="334" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="334" y2="334" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="339" fill="#333" font-size="15" text-anchor="end">$100</text><text x="510" y="339" fill="#333" font-size="15" text-anchor="end">$100</text><line x1="80" x2="430" y1="268" y2="268" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="268" y2="268" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="273" fill="#333" font-size="15" text-anchor="end">$101</text><text x="510" y="273" fill="#333" font-size="15" text-anchor="end">$101</text><line x1="80" x2="430" y1="202" y2="202" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="202" y2="202" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="207" fill="#333" font-size="15" text-anchor="end">$102</text><text x="510" y="207" fill="#333" font-size="15" text-anchor="end">$102</text><line x1="80" x2="430" y1="136" y2="136" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="136" y2="136" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="141" fill="#333" font-size="15" text-anchor="end">$103</text><text x="510" y="141" fill="#333" font-size="15" text-anchor="end">$103</text><line x1="80" x2="430" y1="70" y2="70" stroke="#c5cedb" stroke-dasharray="4 4"/><line x1="520" x2="820" y1="70" y2="70" stroke="#c5cedb" stroke-dasharray="4 4"/><text x="70" y="75" fill="#333" font-size="15" text-anchor="end">$104</text><text x="510" y="75" fill="#333" font-size="15" text-anchor="end">$104</text><text x="255" y="40" fill="#1b2a44" font-size="18" font-weight="600" text-anchor="middle">1. Daily closing prices</text><text x="670" y="40" fill="#1b2a44" font-size="18" font-weight="600" text-anchor="middle">2. Renko bricks ($1 box)</text><polyline fill="none" stroke="#2a6397" stroke-width="2.5" points="100.0,334.0 134.4,294.4 168.9,248.2 203.3,109.6 237.8,188.8 272.2,221.8 306.7,274.6 341.1,347.2 375.6,287.8 410.0,195.4"/><circle cx="100" cy="334" r="6" fill="#8a96a8" stroke="#fff" stroke-width="1.5"/><text x="100" y="424" fill="#333" font-size="14" text-anchor="middle">1</text><circle cx="134.4" cy="294.4" r="6" fill="#8a96a8" stroke="#fff" stroke-width="1.5"/><text x="134.4" y="424" fill="#333" font-size="14" text-anchor="middle">2</text><circle cx="168.9" cy="248.2" r="6" fill="#26a69a" stroke="#fff" stroke-width="1.5"/><text x="168.9" y="424" fill="#333" font-size="14" text-anchor="middle">3</text><circle cx="203.3" cy="109.6" r="6" fill="#26a69a" stroke="#fff" stroke-width="1.5"/><text x="203.3" y="424" fill="#333" font-size="14" text-anchor="middle">4</text><circle cx="237.8" cy="188.8" r="6" fill="#8a96a8" stroke="#fff" stroke-width="1.5"/><text x="237.8" y="424" fill="#333" font-size="14" text-anchor="middle">5</text><circle cx="272.2" cy="221.8" r="6" fill="#8a96a8" stroke="#fff" stroke-width="1.5"/><text x="272.2" y="424" fill="#333" font-size="14" text-anchor="middle">6</text><circle cx="306.7" cy="274.6" r="6" fill="#ef5350" stroke="#fff" stroke-width="1.5"/><text x="306.7" y="424" fill="#333" font-size="14" text-anchor="middle">7</text><circle cx="341.1" cy="347.2" r="6" fill="#ef5350" stroke="#fff" stroke-width="1.5"/><text x="341.1" y="424" fill="#333" font-size="14" text-anchor="middle">8</text><circle cx="375.6" cy="287.8" r="6" fill="#8a96a8" stroke="#fff" stroke-width="1.5"/><text x="375.6" y="424" fill="#333" font-size="14" text-anchor="middle">9</text><circle cx="410" cy="195.4" r="6" fill="#26a69a" stroke="#fff" stroke-width="1.5"/><text x="410" y="424" fill="#333" font-size="14" text-anchor="middle">10</text><text x="255" y="448" fill="#333" font-size="15" text-anchor="middle">Day</text><text x="90" y="363.7" fill="#b03a37" font-size="13">Day 7: the close is at least two boxes below the $103 top,</text><text x="90" y="379.7" fill="#b03a37" font-size="13">so the first down brick forms ($102 to $101)</text><rect width="42" height="66" x="524" y="268" fill="#26a69a" stroke="#14233c"/><text x="545" y="306" fill="#fff" font-size="13" text-anchor="middle">day 3</text><text x="545" y="424" fill="#333" font-size="14" text-anchor="middle">1</text><rect width="42" height="66" x="574" y="202" fill="#26a69a" stroke="#14233c"/><text x="595" y="240" fill="#fff" font-size="13" text-anchor="middle">day 4</text><text x="595" y="424" fill="#333" font-size="14" text-anchor="middle">2</text><rect width="42" height="66" x="624" y="136" fill="#26a69a" stroke="#14233c"/><text x="645" y="174" fill="#fff" font-size="13" text-anchor="middle">day 4</text><text x="645" y="424" fill="#333" font-size="14" text-anchor="middle">3</text><rect width="42" height="66" x="674" y="202" fill="#ef5350" stroke="#14233c"/><text x="695" y="240" fill="#fff" font-size="13" text-anchor="middle">day 7</text><text x="695" y="424" fill="#333" font-size="14" text-anchor="middle">4</text><rect width="42" height="66" x="724" y="268" fill="#ef5350" stroke="#14233c"/><text x="745" y="306" fill="#fff" font-size="13" text-anchor="middle">day 8</text><text x="745" y="424" fill="#333" font-size="14" text-anchor="middle">5</text><rect width="42" height="66" x="774" y="202" fill="#26a69a" stroke="#14233c"/><text x="795" y="240" fill="#fff" font-size="13" text-anchor="middle">day 10</text><text x="795" y="424" fill="#333" font-size="14" text-anchor="middle">6</text><text x="670" y="448" fill="#333" font-size="15" text-anchor="middle">Brick number (no time axis)</text><text x="80" y="472" fill="#555" font-size="13">Grey points made no brick. Green: up brick formed. Red: down brick formed.</text></g></svg>