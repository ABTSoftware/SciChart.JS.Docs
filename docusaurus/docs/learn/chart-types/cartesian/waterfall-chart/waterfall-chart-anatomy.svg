<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 670"><title id="t">The parts of a waterfall chart</title><desc id="d">A month of household money as a waterfall chart. A grey starting bar of 1,200 dollars, a green floating bar for salary (+2,400), red floating bars for rent (-950) and bills (-310), a grey subtotal bar after fixed costs (2,340), red bars for groceries (-420) and a car repair (-380), a green bar for freelance work (+300), and a grey end-of-month total of 1,840 dollars. Dashed connector lines join the top of each bar to the start of the next. Numbered markers, explained in a key below, point out the starting value, an increase, a decrease, a connector line, the subtotal and the end total.</desc><rect width="900" height="670" fill="#fff"/><line x1="120" x2="870" y1="450" y2="450" stroke="#E2E8F0"/><text x="110" y="455" fill="#475569" font-size="15" text-anchor="end">$0</text><line x1="120" x2="870" y1="347.5" y2="347.5" stroke="#E2E8F0"/><text x="110" y="352.5" fill="#475569" font-size="15" text-anchor="end">$1,000</text><line x1="120" x2="870" y1="245" y2="245" stroke="#E2E8F0"/><text x="110" y="250" fill="#475569" font-size="15" text-anchor="end">$2,000</text><line x1="120" x2="870" y1="142.5" y2="142.5" stroke="#E2E8F0"/><text x="110" y="147.5" fill="#475569" font-size="15" text-anchor="end">$3,000</text><line x1="120" x2="870" y1="40" y2="40" stroke="#E2E8F0"/><text x="110" y="45" fill="#475569" font-size="15" text-anchor="end">$4,000</text><line x1="120" x2="870" y1="450" y2="450" stroke="#334155" stroke-width="1.5"/><text x="34" y="245" fill="#334155" font-size="16" text-anchor="middle" transform="rotate(-90 34 245)">Running total</text><rect width="51.7" height="123" x="135.8" y="327" fill="#64748B" rx="2"/><text x="161.7" y="319" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">$1,200</text><text x="161.7" y="474" fill="#334155" font-size="15" text-anchor="middle">Start of</text><text x="161.7" y="492" fill="#334155" font-size="15" text-anchor="middle">month</text><line x1="187.5" x2="219.2" y1="327" y2="327" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="246" x="219.2" y="81" fill="#1E9E8F" rx="2"/><text x="245" y="73" fill="#1E9E8F" font-size="15" font-weight="700" text-anchor="middle">+$2,400</text><text x="245" y="474" fill="#334155" font-size="15" text-anchor="middle">Salary</text><line x1="270.8" x2="302.5" y1="81" y2="81" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="97.4" x="302.5" y="81" fill="#E5484D" rx="2"/><text x="328.3" y="73" fill="#E5484D" font-size="15" font-weight="700" text-anchor="middle">−$950</text><text x="328.3" y="474" fill="#334155" font-size="15" text-anchor="middle">Rent</text><line x1="354.2" x2="385.8" y1="178.4" y2="178.4" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="31.8" x="385.8" y="178.4" fill="#E5484D" rx="2"/><text x="411.7" y="170.4" fill="#E5484D" font-size="15" font-weight="700" text-anchor="middle">−$310</text><text x="411.7" y="474" fill="#334155" font-size="15" text-anchor="middle">Bills</text><line x1="437.5" x2="469.2" y1="210.2" y2="210.2" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="239.8" x="469.2" y="210.2" fill="#64748B" rx="2"/><text x="495" y="202.2" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">$2,340</text><text x="495" y="474" fill="#334155" font-size="15" text-anchor="middle">After fixed</text><text x="495" y="492" fill="#334155" font-size="15" text-anchor="middle">costs</text><line x1="520.8" x2="552.5" y1="210.2" y2="210.2" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="43.1" x="552.5" y="210.2" fill="#E5484D" rx="2"/><text x="578.3" y="202.2" fill="#E5484D" font-size="15" font-weight="700" text-anchor="middle">−$420</text><text x="578.3" y="474" fill="#334155" font-size="15" text-anchor="middle">Groceries</text><line x1="604.2" x2="635.8" y1="253.2" y2="253.2" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="30.8" x="635.8" y="222.4" fill="#1E9E8F" rx="2"/><text x="661.7" y="214.4" fill="#1E9E8F" font-size="15" font-weight="700" text-anchor="middle">+$300</text><text x="661.7" y="474" fill="#334155" font-size="15" text-anchor="middle">Freelance</text><text x="661.7" y="492" fill="#334155" font-size="15" text-anchor="middle">work</text><line x1="687.5" x2="719.2" y1="222.4" y2="222.4" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="38.9" x="719.2" y="222.4" fill="#E5484D" rx="2"/><text x="745" y="214.4" fill="#E5484D" font-size="15" font-weight="700" text-anchor="middle">−$380</text><text x="745" y="474" fill="#334155" font-size="15" text-anchor="middle">Car</text><text x="745" y="492" fill="#334155" font-size="15" text-anchor="middle">repair</text><line x1="770.8" x2="802.5" y1="261.4" y2="261.4" stroke="#64748B" stroke-dasharray="4 3" stroke-width="1.5"/><rect width="51.7" height="188.6" x="802.5" y="261.4" fill="#64748B" rx="2"/><text x="828.3" y="253.4" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">$1,840</text><text x="828.3" y="474" fill="#334155" font-size="15" text-anchor="middle">End of</text><text x="828.3" y="492" fill="#334155" font-size="15" text-anchor="middle">month</text><circle cx="161.7" cy="388.5" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="161.7" y="393.5" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">1</text><circle cx="245" cy="204" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="245" y="209" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">2</text><circle cx="328.3" cy="129.7" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="328.3" y="134.7" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">3</text><circle cx="453.3" cy="232.2" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="453.3" y="237.2" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">4</text><circle cx="495" cy="330.1" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="495" y="335.1" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">5</text><circle cx="828.3" cy="355.7" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="828.3" y="360.7" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">6</text><circle cx="92" cy="533" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="92" y="538" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="112" y="538" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">Starting value:</tspan> a full bar from zero</text><circle cx="492" cy="533" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="492" y="538" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="512" y="538" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">Increase:</tspan> floats up from the last total</text><circle cx="92" cy="567" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="92" y="572" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="112" y="572" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">Decrease:</tspan> floats down from the last total</text><circle cx="492" cy="567" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="492" y="572" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="512" y="572" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">Connector:</tspan> carries the total to the next bar</text><circle cx="92" cy="601" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="92" y="606" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="112" y="606" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">Subtotal:</tspan> the running total so far, from zero</text><circle cx="492" cy="601" r="13" fill="#fff" stroke="#0F172A" stroke-width="2"/><text x="492" y="606" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">6</text><text x="512" y="606" fill="#334155" font-size="15"><tspan fill="#0F172A" font-weight="700">End total:</tspan> where the running total ends up</text></svg>