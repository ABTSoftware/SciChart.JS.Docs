<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15" viewBox="0 0 700 400"><title id="title">Anatomy of an area chart and a stacked area chart</title><desc id="desc">Left: an area chart, where a line shows the values and the space between the line and a baseline at zero is filled. Right: a stacked area chart with three series, where each band&apos;s thickness is that series&apos; value and the top edge shows the total of all three.</desc><rect width="700" height="400" fill="#fff" rx="12"/><text x="185" y="34" fill="#333" font-size="17" font-weight="bold" text-anchor="middle">Area chart</text><text x="525" y="34" fill="#333" font-size="17" font-weight="bold" text-anchor="middle">Stacked area chart</text><path fill="#2a7fb8" fill-opacity=".35" d="m50 220 45-30 45 15 45-55 45 15 45-45 45 15v175H50Z"/><polyline fill="none" stroke="#2a7fb8" stroke-linejoin="round" stroke-width="3" points="50,220 95,190 140,205 185,150 230,165 275,120 320,135"/><line x1="40" x2="330" y1="310" y2="310" stroke="#333" stroke-width="2"/><line x1="140" x2="182" y1="90" y2="146" stroke="#999" stroke-dasharray="4 4"/><text x="70" y="82" fill="#333">Line: the values</text><text x="185" y="255" fill="#1d5f8a" font-weight="bold" text-anchor="middle">Filled area</text><text x="185" y="335" fill="#333" text-anchor="middle">Baseline (usually zero)</text><text x="185" y="355" fill="#666" font-size="13" text-anchor="middle">The fill makes the size of each value easy to see</text><path fill="#882B91" fill-opacity=".85" d="m390 250 45-10 45 5 45-15 45 5 45-10 45-5v90H390Z"/><path fill="#29aade" fill-opacity=".85" d="m390 200 45-15h45l45-10 45-5 45-15 45-10v75l-45 5-45 10-45-5-45 15-45-5-45 10Z"/><path fill="#F48420" fill-opacity=".85" d="m390 170 45-20 45 5 45-20h45l45-20 45-15v45l-45 10-45 15-45 5-45 10h-45l-45 15Z"/><polyline fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2.5" points="390,170 435,150 480,155 525,135 570,135 615,115 660,100"/><line x1="380" x2="670" y1="310" y2="310" stroke="#333" stroke-width="2"/><g fill="#fff" font-size="14" font-weight="bold" text-anchor="middle"><text x="525" y="272">Series A</text><text x="525" y="200">Series B</text><text x="525" y="161">Series C</text></g><line x1="460" x2="478" y1="90" y2="151" stroke="#999" stroke-dasharray="4 4"/><text x="400" y="82" fill="#333">Top edge: the total</text><text x="525" y="335" fill="#333" text-anchor="middle">Each band&apos;s thickness is</text><text x="525" y="355" fill="#333" text-anchor="middle">that series&apos; own value</text></svg>