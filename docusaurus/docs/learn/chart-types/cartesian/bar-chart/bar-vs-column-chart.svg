<svg xmlns="http://www.w3.org/2000/svg" width="700" height="570" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 700 570"><title id="title">Bar chart, column chart, stacked column chart and grouped column chart compared</title><desc id="desc">Four small charts of the same kind of data. A bar chart draws horizontal bars with the categories down the side. A column chart draws vertical bars with the categories along the bottom. A stacked column chart piles each category&apos;s parts on top of each other so the full height is the total. A grouped column chart puts each category&apos;s parts side by side so they are easy to compare.</desc><rect width="700" height="570" fill="#fff" rx="12"/><text x="20" y="32" fill="#222" font-size="16" font-weight="bold">Bar chart (horizontal)</text><g stroke="#555" stroke-width="1.5"><line x1="90" x2="90" y1="50" y2="222"/><line x1="90" x2="320" y1="222" y2="222"/></g><rect width="200" height="28" x="90" y="58" fill="#2f80c8"/><text x="82" y="77" fill="#333" text-anchor="end">North</text><rect width="160" height="28" x="90" y="100" fill="#2f80c8"/><text x="82" y="119" fill="#333" text-anchor="end">South</text><rect width="120" height="28" x="90" y="142" fill="#2f80c8"/><text x="82" y="161" fill="#333" text-anchor="end">East</text><rect width="70" height="28" x="90" y="184" fill="#2f80c8"/><text x="82" y="203" fill="#333" text-anchor="end">West</text><text x="205" y="244" fill="#666" font-size="13" text-anchor="middle">value (length of the bar)</text><text x="370" y="32" fill="#222" font-size="16" font-weight="bold">Column chart (vertical)</text><g stroke="#555" stroke-width="1.5"><line x1="390" x2="390" y1="50" y2="200"/><line x1="390" x2="670" y1="200" y2="200"/></g><rect width="40" height="140" x="410" y="60" fill="#2f80c8"/><text x="430" y="218" fill="#333" text-anchor="middle">North</text><rect width="40" height="112" x="475" y="88" fill="#2f80c8"/><text x="495" y="218" fill="#333" text-anchor="middle">South</text><rect width="40" height="84" x="540" y="116" fill="#2f80c8"/><text x="560" y="218" fill="#333" text-anchor="middle">East</text><rect width="40" height="49" x="605" y="151" fill="#2f80c8"/><text x="625" y="218" fill="#333" text-anchor="middle">West</text><text x="530" y="244" fill="#666" font-size="13" text-anchor="middle">value (height of the column)</text><text x="20" y="300" fill="#222" font-size="16" font-weight="bold">Stacked column chart</text><g stroke="#555" stroke-width="1.5"><line x1="40" x2="40" y1="318" y2="500"/><line x1="40" x2="320" y1="500" y2="500"/></g><rect width="40" height="60" x="60" y="440" fill="#2f80c8" stroke="#fff"/><rect width="40" height="40" x="60" y="400" fill="#8e44ad" stroke="#fff"/><rect width="40" height="30" x="60" y="370" fill="#f39c12" stroke="#fff"/><text x="80" y="364" fill="#333" font-size="13" text-anchor="middle">130</text><text x="80" y="518" fill="#333" text-anchor="middle">North</text><rect width="40" height="50" x="125" y="450" fill="#2f80c8" stroke="#fff"/><rect width="40" height="50" x="125" y="400" fill="#8e44ad" stroke="#fff"/><rect width="40" height="40" x="125" y="360" fill="#f39c12" stroke="#fff"/><text x="145" y="354" fill="#333" font-size="13" text-anchor="middle">140</text><text x="145" y="518" fill="#333" text-anchor="middle">South</text><rect width="40" height="40" x="190" y="460" fill="#2f80c8" stroke="#fff"/><rect width="40" height="30" x="190" y="430" fill="#8e44ad" stroke="#fff"/><rect width="40" height="20" x="190" y="410" fill="#f39c12" stroke="#fff"/><text x="210" y="404" fill="#333" font-size="13" text-anchor="middle">90</text><text x="210" y="518" fill="#333" text-anchor="middle">East</text><rect width="40" height="70" x="255" y="430" fill="#2f80c8" stroke="#fff"/><rect width="40" height="35" x="255" y="395" fill="#8e44ad" stroke="#fff"/><rect width="40" height="45" x="255" y="350" fill="#f39c12" stroke="#fff"/><text x="275" y="344" fill="#333" font-size="13" text-anchor="middle">150</text><text x="275" y="518" fill="#333" text-anchor="middle">West</text><text x="180" y="540" fill="#666" font-size="13" text-anchor="middle">full height = the total; each band = one part</text><text x="370" y="300" fill="#222" font-size="16" font-weight="bold">Grouped column chart</text><g stroke="#555" stroke-width="1.5"><line x1="390" x2="390" y1="318" y2="500"/><line x1="390" x2="670" y1="500" y2="500"/></g><rect width="16" height="108" x="398" y="392" fill="#2f80c8"/><rect width="16" height="72" x="416" y="428" fill="#8e44ad"/><rect width="16" height="54" x="434" y="446" fill="#f39c12"/><text x="425" y="518" fill="#333" text-anchor="middle">North</text><rect width="16" height="90" x="466" y="410" fill="#2f80c8"/><rect width="16" height="90" x="484" y="410" fill="#8e44ad"/><rect width="16" height="72" x="502" y="428" fill="#f39c12"/><text x="493" y="518" fill="#333" text-anchor="middle">South</text><rect width="16" height="72" x="534" y="428" fill="#2f80c8"/><rect width="16" height="54" x="552" y="446" fill="#8e44ad"/><rect width="16" height="36" x="570" y="464" fill="#f39c12"/><text x="561" y="518" fill="#333" text-anchor="middle">East</text><rect width="16" height="126" x="602" y="374" fill="#2f80c8"/><rect width="16" height="63" x="620" y="437" fill="#8e44ad"/><rect width="16" height="81" x="638" y="419" fill="#f39c12"/><text x="629" y="518" fill="#333" text-anchor="middle">West</text><text x="530" y="540" fill="#666" font-size="13" text-anchor="middle">parts side by side, from the same baseline</text><g fill="#333" font-size="13"><rect width="12" height="12" x="230" y="553" fill="#2f80c8"/><text x="248" y="564">Part A</text><rect width="12" height="12" x="320" y="553" fill="#8e44ad"/><text x="338" y="564">Part B</text><rect width="12" height="12" x="410" y="553" fill="#f39c12"/><text x="428" y="564">Part C</text></g></svg>