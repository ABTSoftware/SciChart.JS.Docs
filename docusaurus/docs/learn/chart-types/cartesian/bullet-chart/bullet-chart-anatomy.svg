<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 960 430"><title id="t">Anatomy of a bullet chart</title><desc id="d">One horizontal bullet chart for monthly sign-ups in thousands, on a scale from 0 to 10. Three grey bands mark the qualitative ranges: dark grey for poor from 0 to 5, mid grey for satisfactory from 5 to 7.5 and light grey for good from 7.5 to 10. A dark bar shows the actual value, 6.8 thousand, and a short vertical line shows the target, 8 thousand. Numbered callouts name the qualitative ranges, the text label, the quantitative scale, the featured measure and the comparative measure.</desc><rect width="960" height="430" fill="#fff"/><text x="480" y="36" fill="#1c2333" font-size="22" font-weight="700" text-anchor="middle">Anatomy of a bullet chart</text><rect width="315" height="66" x="250" y="130" fill="#999"/><rect width="157.5" height="66" x="565" y="130" fill="#BFBFBF"/><rect width="157.5" height="66" x="722.5" y="130" fill="#E6E6E6"/><rect width="428.4" height="22" x="250" y="152" fill="#111"/><rect width="4" height="44.9" x="752" y="140.6" fill="#111"/><line x1="250" x2="250" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="250" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">0k</text><line x1="376" x2="376" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="376" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">2k</text><line x1="502" x2="502" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="502" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">4k</text><line x1="628" x2="628" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="628" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">6k</text><line x1="754" x2="754" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="754" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">8k</text><line x1="880" x2="880" y1="196" y2="203" stroke="#9ca3af" stroke-width="1.5"/><text x="880" y="220" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">10k</text><text x="232" y="160" fill="#1c2333" font-size="19" font-weight="700" text-anchor="end">Sign-ups</text><text x="232" y="182" fill="#4b5563" font-size="14" font-weight="400" text-anchor="end">thousands, this month</text><path fill="none" stroke="#4b5563" stroke-width="1.5" d="M253 122v-8h309v8"/><text x="407.5" y="106" fill="#1c2333" font-size="16" font-weight="400" text-anchor="middle">Poor</text><path fill="none" stroke="#4b5563" stroke-width="1.5" d="M568 122v-8h151.5v8"/><text x="643.8" y="106" fill="#1c2333" font-size="16" font-weight="400" text-anchor="middle">Satisfactory</text><path fill="none" stroke="#4b5563" stroke-width="1.5" d="M725.5 122v-8H877v8"/><text x="801.2" y="106" fill="#1c2333" font-size="16" font-weight="400" text-anchor="middle">Good</text><circle cx="220" cy="96" r="12" fill="#C2185B"/><text x="220" y="101" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="200" y="101" fill="#C2185B" font-size="16" font-weight="700" text-anchor="end">Qualitative ranges</text><line x1="160" x2="160" y1="190" y2="284" stroke="#4b5563" stroke-dasharray="4 3" stroke-width="1.2"/><circle cx="160" cy="300" r="12" fill="#C2185B"/><text x="160" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="160" y="332" fill="#1c2333" font-size="16" font-weight="700" text-anchor="middle">Text label</text><text x="160" y="352" fill="#4b5563" font-size="14" font-weight="400" text-anchor="middle">what is measured</text><line x1="439" x2="439" y1="228" y2="284" stroke="#4b5563" stroke-dasharray="4 3" stroke-width="1.2"/><circle cx="439" cy="300" r="12" fill="#C2185B"/><text x="439" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="439" y="332" fill="#1c2333" font-size="16" font-weight="700" text-anchor="middle">Quantitative scale</text><text x="439" y="352" fill="#4b5563" font-size="14" font-weight="400" text-anchor="middle">starts at zero</text><line x1="653.2" x2="653.2" y1="171" y2="284" stroke="#4b5563" stroke-dasharray="4 3" stroke-width="1.2"/><circle cx="653.2" cy="300" r="12" fill="#C2185B"/><text x="653.2" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="653.2" y="332" fill="#1c2333" font-size="16" font-weight="700" text-anchor="middle">Featured measure</text><text x="653.2" y="352" fill="#4b5563" font-size="14" font-weight="400" text-anchor="middle">actual: 6.8k</text><line x1="754" x2="823.3" y1="185.4" y2="284" stroke="#4b5563" stroke-dasharray="4 3" stroke-width="1.2"/><circle cx="823.3" cy="300" r="12" fill="#C2185B"/><text x="823.3" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="823.3" y="332" fill="#1c2333" font-size="16" font-weight="700" text-anchor="middle">Comparative measure</text><text x="823.3" y="352" fill="#4b5563" font-size="14" font-weight="400" text-anchor="middle">target: 8k</text><text x="480" y="416" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">Darker grey = worse. The bar shows the result; the short line shows the target.</text></svg>