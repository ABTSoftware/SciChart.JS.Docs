<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 960 640"><title id="t">Four common bullet chart variants</title><desc id="d">Four horizontal bullet charts. Standard: orders shipped on time, 82 percent against a 78 percent target, with the dark poor band on the left. Lower is better: defects per 1,000 units, 4.2 against a target of 3.5, with the bands reversed so the dark poor band is on the right. With a projection: revenue quarter to date, a dark bar to 52 thousand dollars and a lighter segment to a projected 94 thousand, against a 100 thousand target. Scale not from zero: an average rating of 4.1 out of 5 shown as a dot on a scale from 3 to 5, against a target of 4.4.</desc><rect width="960" height="640" fill="#fff"/><text x="480" y="36" fill="#1c2333" font-size="22" font-weight="700" text-anchor="middle">Four common bullet chart variants</text><text x="40" y="84" fill="#C2185B" font-size="18" font-weight="700">Standard</text><text x="138" y="84" fill="#4b5563" font-size="15" font-weight="400">Higher is better: dark band on the left</text><rect width="285" height="46" x="330" y="102" fill="#999"/><rect width="142.5" height="46" x="615" y="102" fill="#BFBFBF"/><rect width="142.5" height="46" x="757.5" y="102" fill="#E6E6E6"/><rect width="467.4" height="15.3" x="330" y="117.3" fill="#111"/><rect width="4" height="31.3" x="772.6" y="109.4" fill="#111"/><line x1="330" x2="330" y1="148" y2="155" stroke="#9ca3af" stroke-width="1.5"/><text x="330" y="172" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">0%</text><line x1="472.5" x2="472.5" y1="148" y2="155" stroke="#9ca3af" stroke-width="1.5"/><text x="472.5" y="172" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">25%</text><line x1="615" x2="615" y1="148" y2="155" stroke="#9ca3af" stroke-width="1.5"/><text x="615" y="172" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">50%</text><line x1="757.5" x2="757.5" y1="148" y2="155" stroke="#9ca3af" stroke-width="1.5"/><text x="757.5" y="172" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">75%</text><line x1="900" x2="900" y1="148" y2="155" stroke="#9ca3af" stroke-width="1.5"/><text x="900" y="172" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">100%</text><text x="314" y="130" fill="#1c2333" font-size="16" font-weight="600" text-anchor="end">Orders shipped on time (%)</text><text x="40" y="224" fill="#C2185B" font-size="18" font-weight="700">Lower is better</text><text x="211.5" y="224" fill="#4b5563" font-size="15" font-weight="400">Bands reversed: the dark band is on the right</text><rect width="171" height="46" x="330" y="242" fill="#E6E6E6"/><rect width="171" height="46" x="501" y="242" fill="#BFBFBF"/><rect width="228" height="46" x="672" y="242" fill="#999"/><rect width="239.4" height="15.3" x="330" y="257.3" fill="#111"/><rect width="4" height="31.3" x="527.5" y="249.4" fill="#111"/><line x1="330" x2="330" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="330" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">0</text><line x1="444" x2="444" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="444" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">2</text><line x1="558" x2="558" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="558" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">4</text><line x1="672" x2="672" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="672" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">6</text><line x1="786" x2="786" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="786" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">8</text><line x1="900" x2="900" y1="288" y2="295" stroke="#9ca3af" stroke-width="1.5"/><text x="900" y="312" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">10</text><text x="314" y="270" fill="#1c2333" font-size="16" font-weight="600" text-anchor="end">Defects per 1,000 units</text><text x="40" y="364" fill="#C2185B" font-size="18" font-weight="700">With a projection</text><text x="232.5" y="364" fill="#4b5563" font-size="15" font-weight="400">Lighter segment: where the period is likely to end</text><rect width="285" height="46" x="330" y="382" fill="#999"/><rect width="142.5" height="46" x="615" y="382" fill="#BFBFBF"/><rect width="142.5" height="46" x="757.5" y="382" fill="#E6E6E6"/><rect width="247" height="15.3" x="330" y="397.3" fill="#111"/><rect width="199.5" height="15.3" x="577" y="397.3" fill="#6b6b6b"/><rect width="4" height="31.3" x="803" y="389.4" fill="#111"/><line x1="330" x2="330" y1="428" y2="435" stroke="#9ca3af" stroke-width="1.5"/><text x="330" y="452" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">$0k</text><line x1="472.5" x2="472.5" y1="428" y2="435" stroke="#9ca3af" stroke-width="1.5"/><text x="472.5" y="452" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">$30k</text><line x1="615" x2="615" y1="428" y2="435" stroke="#9ca3af" stroke-width="1.5"/><text x="615" y="452" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">$60k</text><line x1="757.5" x2="757.5" y1="428" y2="435" stroke="#9ca3af" stroke-width="1.5"/><text x="757.5" y="452" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">$90k</text><line x1="900" x2="900" y1="428" y2="435" stroke="#9ca3af" stroke-width="1.5"/><text x="900" y="452" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">$120k</text><text x="314" y="410" fill="#1c2333" font-size="16" font-weight="600" text-anchor="end">Revenue, quarter to date</text><text x="40" y="504" fill="#C2185B" font-size="18" font-weight="700">Scale not from zero</text><text x="253.5" y="504" fill="#4b5563" font-size="15" font-weight="400">A dot replaces the bar, whose length would mislead</text><rect width="228" height="46" x="330" y="522" fill="#999"/><rect width="142.5" height="46" x="558" y="522" fill="#BFBFBF"/><rect width="199.5" height="46" x="700.5" y="522" fill="#E6E6E6"/><circle cx="643.5" cy="545" r="9.2" fill="#111"/><rect width="4" height="31.3" x="727" y="529.4" fill="#111"/><line x1="330" x2="330" y1="568" y2="575" stroke="#9ca3af" stroke-width="1.5"/><text x="330" y="592" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">3</text><line x1="472.5" x2="472.5" y1="568" y2="575" stroke="#9ca3af" stroke-width="1.5"/><text x="472.5" y="592" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">3.5</text><line x1="615" x2="615" y1="568" y2="575" stroke="#9ca3af" stroke-width="1.5"/><text x="615" y="592" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">4</text><line x1="757.5" x2="757.5" y1="568" y2="575" stroke="#9ca3af" stroke-width="1.5"/><text x="757.5" y="592" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">4.5</text><line x1="900" x2="900" y1="568" y2="575" stroke="#9ca3af" stroke-width="1.5"/><text x="900" y="592" fill="#4b5563" font-size="15" font-weight="400" text-anchor="middle">5</text><text x="314" y="550" fill="#1c2333" font-size="16" font-weight="600" text-anchor="end">Average rating (out of 5)</text></svg>