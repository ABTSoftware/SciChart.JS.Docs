<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 420"><title id="t">Histogram vs bar graph: the same 20 deliveries drawn both ways</title><desc id="d">Left: a histogram of 20 delivery times in 10-minute bins from 10 to 60 minutes, with touching bars of 4, 10, 4, 1 and 1 deliveries in numeric order. Right: a bar graph of the same 20 deliveries by delivery area, with separate bars sorted largest first: North 7, Centre 6, East 4 and West 3.</desc><rect width="760" height="420" fill="#fff"/><text x="215" y="40" fill="#14233C" font-size="19" font-weight="700" text-anchor="middle">Histogram</text><text x="215" y="62" fill="#4A5568" font-size="14" text-anchor="middle">How long did the deliveries take?</text><line x1="80" x2="350" y1="320" y2="320" stroke="#E2E8F0"/><text x="72" y="325" fill="#4A5568" font-size="13" text-anchor="end">0</text><line x1="80" x2="350" y1="278" y2="278" stroke="#E2E8F0"/><text x="72" y="283" fill="#4A5568" font-size="13" text-anchor="end">2</text><line x1="80" x2="350" y1="236" y2="236" stroke="#E2E8F0"/><text x="72" y="241" fill="#4A5568" font-size="13" text-anchor="end">4</text><line x1="80" x2="350" y1="194" y2="194" stroke="#E2E8F0"/><text x="72" y="199" fill="#4A5568" font-size="13" text-anchor="end">6</text><line x1="80" x2="350" y1="152" y2="152" stroke="#E2E8F0"/><text x="72" y="157" fill="#4A5568" font-size="13" text-anchor="end">8</text><line x1="80" x2="350" y1="110" y2="110" stroke="#E2E8F0"/><text x="72" y="115" fill="#4A5568" font-size="13" text-anchor="end">10</text><text fill="#4A5568" font-size="13" text-anchor="middle" transform="rotate(-90 128.5 86.5)">Deliveries</text><text x="215" y="368" fill="#14233C" font-size="14" text-anchor="middle">Delivery time (minutes)</text><rect width="54" height="84" x="80" y="236" fill="#30BC9A" stroke="#fff" stroke-width="1.5"/><text x="107" y="230" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">4</text><rect width="54" height="210" x="134" y="110" fill="#30BC9A" stroke="#fff" stroke-width="1.5"/><text x="161" y="104" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">10</text><rect width="54" height="84" x="188" y="236" fill="#30BC9A" stroke="#fff" stroke-width="1.5"/><text x="215" y="230" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">4</text><rect width="54" height="21" x="242" y="299" fill="#30BC9A" stroke="#fff" stroke-width="1.5"/><text x="269" y="293" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">1</text><rect width="54" height="21" x="296" y="299" fill="#30BC9A" stroke="#fff" stroke-width="1.5"/><text x="323" y="293" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="80" y="340" fill="#4A5568" font-size="13" text-anchor="middle">10</text><text x="134" y="340" fill="#4A5568" font-size="13" text-anchor="middle">20</text><text x="188" y="340" fill="#4A5568" font-size="13" text-anchor="middle">30</text><text x="242" y="340" fill="#4A5568" font-size="13" text-anchor="middle">40</text><text x="296" y="340" fill="#4A5568" font-size="13" text-anchor="middle">50</text><text x="350" y="340" fill="#4A5568" font-size="13" text-anchor="middle">60</text><text x="605" y="40" fill="#14233C" font-size="19" font-weight="700" text-anchor="middle">Bar graph</text><text x="605" y="62" fill="#4A5568" font-size="14" text-anchor="middle">Which area did they go to?</text><line x1="470" x2="740" y1="320" y2="320" stroke="#E2E8F0"/><text x="462" y="325" fill="#4A5568" font-size="13" text-anchor="end">0</text><line x1="470" x2="740" y1="278" y2="278" stroke="#E2E8F0"/><text x="462" y="283" fill="#4A5568" font-size="13" text-anchor="end">2</text><line x1="470" x2="740" y1="236" y2="236" stroke="#E2E8F0"/><text x="462" y="241" fill="#4A5568" font-size="13" text-anchor="end">4</text><line x1="470" x2="740" y1="194" y2="194" stroke="#E2E8F0"/><text x="462" y="199" fill="#4A5568" font-size="13" text-anchor="end">6</text><line x1="470" x2="740" y1="152" y2="152" stroke="#E2E8F0"/><text x="462" y="157" fill="#4A5568" font-size="13" text-anchor="end">8</text><line x1="470" x2="740" y1="110" y2="110" stroke="#E2E8F0"/><text x="462" y="115" fill="#4A5568" font-size="13" text-anchor="end">10</text><text fill="#4A5568" font-size="13" text-anchor="middle" transform="rotate(-90 323.5 -108.5)">Deliveries</text><text x="605" y="368" fill="#14233C" font-size="14" text-anchor="middle">Delivery area</text><rect width="42" height="147" x="482.8" y="173" fill="#F48420"/><text x="503.8" y="167" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">7</text><text x="503.8" y="340" fill="#4A5568" font-size="13" text-anchor="middle">North</text><rect width="42" height="126" x="550.2" y="194" fill="#F48420"/><text x="571.2" y="188" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="571.2" y="340" fill="#4A5568" font-size="13" text-anchor="middle">Centre</text><rect width="42" height="84" x="617.8" y="236" fill="#F48420"/><text x="638.8" y="230" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="638.8" y="340" fill="#4A5568" font-size="13" text-anchor="middle">East</text><rect width="42" height="63" x="685.2" y="257" fill="#F48420"/><text x="706.2" y="251" fill="#14233C" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="706.2" y="340" fill="#4A5568" font-size="13" text-anchor="middle">West</text><line x1="80" x2="350" y1="320" y2="320" stroke="#14233C" stroke-width="1.5"/><line x1="470" x2="740" y1="320" y2="320" stroke="#14233C" stroke-width="1.5"/><text x="215" y="398" fill="#4A5568" font-size="13" font-style="italic" text-anchor="middle">Bars touch: one continuous number line</text><text x="605" y="398" fill="#4A5568" font-size="13" font-style="italic" text-anchor="middle">Gaps: separate categories, any order</text></svg>