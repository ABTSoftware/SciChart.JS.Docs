<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 700 580"><title id="title">Anatomy of a histogram, and common distribution shapes</title><desc id="desc">Top: a histogram whose horizontal axis is split into equal-width bins and whose vertical axis shows frequency, the number of values in each bin. The bars touch because the bins are continuous ranges; the tallest bar is the most common range. Bottom: four common shapes. Normal (symmetric, bell-shaped), right-skewed (a long tail to the right), left-skewed (a long tail to the left) and bimodal (two peaks).</desc><rect width="700" height="580" fill="#fff" rx="12"/><g stroke="#555" stroke-width="1.5"><line x1="150" x2="150" y1="40" y2="260"/><line x1="150" x2="530" y1="260" y2="260"/></g><rect width="40" height="15" x="150" y="245" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="45" x="190" y="215" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="90" x="230" y="170" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="150" x="270" y="110" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="195" x="310" y="65" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="165" x="350" y="95" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="105" x="390" y="155" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="60" x="430" y="200" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><rect width="40" height="30" x="470" y="230" fill="#2f80c8" stroke="#fff" stroke-width="1.5"/><g fill="#333" font-size="12" text-anchor="middle"><text x="150" y="276">150</text><text x="190" y="276">155</text><text x="230" y="276">160</text><text x="270" y="276">165</text><text x="310" y="276">170</text><text x="350" y="276">175</text><text x="390" y="276">180</text><text x="430" y="276">185</text><text x="470" y="276">190</text><text x="510" y="276">195</text></g><text x="330" y="326" fill="#333" text-anchor="middle">Measured value (e.g. height in cm), split into bins</text><g fill="#333" font-size="12" text-anchor="end"><text x="144" y="264">0</text><text x="144" y="189">5</text><text x="144" y="114">10</text></g><text x="120" y="165" fill="#333" text-anchor="middle" transform="rotate(-90 120 165)">Frequency (count)</text><path fill="none" stroke="#c0392b" stroke-width="1.5" d="M230 282v6h40v-6"/><text x="250" y="304" fill="#c0392b" font-size="13" text-anchor="middle">bin width (5 cm)</text><line x1="352" x2="420" y1="67" y2="55" stroke="#999" stroke-dasharray="4 4"/><text x="425" y="59" fill="#333" font-size="13">tallest bar: the most common range</text><text x="425" y="77" fill="#666" font-size="13">(13 values between 170 and 175)</text><line x1="390" x2="500" y1="185" y2="185" stroke="#333" stroke-dasharray="4 4"/><text x="505" y="189" fill="#333" font-size="13">bars touch: the bins are</text><text x="505" y="207" fill="#333" font-size="13">continuous ranges, no gaps</text><line x1="20" x2="680" y1="355" y2="355" stroke="#ddd"/><text x="350" y="382" fill="#222" font-size="15" font-weight="bold" text-anchor="middle">Common shapes</text><line x1="30" x2="171" y1="520" y2="520" stroke="#555"/><rect width="15" height="11" x="33" y="509" fill="#2f80c8" stroke="#fff"/><rect width="15" height="22" x="48" y="498" fill="#2f80c8" stroke="#fff"/><rect width="15" height="44" x="63" y="476" fill="#2f80c8" stroke="#fff"/><rect width="15" height="77" x="78" y="443" fill="#2f80c8" stroke="#fff"/><rect width="15" height="99" x="93" y="421" fill="#2f80c8" stroke="#fff"/><rect width="15" height="77" x="108" y="443" fill="#2f80c8" stroke="#fff"/><rect width="15" height="44" x="123" y="476" fill="#2f80c8" stroke="#fff"/><rect width="15" height="22" x="138" y="498" fill="#2f80c8" stroke="#fff"/><rect width="15" height="11" x="153" y="509" fill="#2f80c8" stroke="#fff"/><text x="100.5" y="542" fill="#222" font-weight="bold" text-anchor="middle">Normal</text><text x="100.5" y="560" fill="#666" font-size="13" text-anchor="middle">symmetric bell</text><line x1="195" x2="336" y1="520" y2="520" stroke="#555"/><rect width="15" height="33" x="198" y="487" fill="#2f80c8" stroke="#fff"/><rect width="15" height="88" x="213" y="432" fill="#2f80c8" stroke="#fff"/><rect width="15" height="99" x="228" y="421" fill="#2f80c8" stroke="#fff"/><rect width="15" height="77" x="243" y="443" fill="#2f80c8" stroke="#fff"/><rect width="15" height="55" x="258" y="465" fill="#2f80c8" stroke="#fff"/><rect width="15" height="33" x="273" y="487" fill="#2f80c8" stroke="#fff"/><rect width="15" height="22" x="288" y="498" fill="#2f80c8" stroke="#fff"/><rect width="15" height="11" x="303" y="509" fill="#2f80c8" stroke="#fff"/><rect width="15" height="11" x="318" y="509" fill="#2f80c8" stroke="#fff"/><text x="265.5" y="542" fill="#222" font-weight="bold" text-anchor="middle">Right-skewed</text><text x="265.5" y="560" fill="#666" font-size="13" text-anchor="middle">long tail to the right</text><line x1="360" x2="501" y1="520" y2="520" stroke="#555"/><rect width="15" height="11" x="363" y="509" fill="#2f80c8" stroke="#fff"/><rect width="15" height="11" x="378" y="509" fill="#2f80c8" stroke="#fff"/><rect width="15" height="22" x="393" y="498" fill="#2f80c8" stroke="#fff"/><rect width="15" height="33" x="408" y="487" fill="#2f80c8" stroke="#fff"/><rect width="15" height="55" x="423" y="465" fill="#2f80c8" stroke="#fff"/><rect width="15" height="77" x="438" y="443" fill="#2f80c8" stroke="#fff"/><rect width="15" height="99" x="453" y="421" fill="#2f80c8" stroke="#fff"/><rect width="15" height="88" x="468" y="432" fill="#2f80c8" stroke="#fff"/><rect width="15" height="33" x="483" y="487" fill="#2f80c8" stroke="#fff"/><text x="430.5" y="542" fill="#222" font-weight="bold" text-anchor="middle">Left-skewed</text><text x="430.5" y="560" fill="#666" font-size="13" text-anchor="middle">long tail to the left</text><line x1="525" x2="666" y1="520" y2="520" stroke="#555"/><rect width="15" height="11" x="528" y="509" fill="#2f80c8" stroke="#fff"/><rect width="15" height="44" x="543" y="476" fill="#2f80c8" stroke="#fff"/><rect width="15" height="88" x="558" y="432" fill="#2f80c8" stroke="#fff"/><rect width="15" height="55" x="573" y="465" fill="#2f80c8" stroke="#fff"/><rect width="15" height="22" x="588" y="498" fill="#2f80c8" stroke="#fff"/><rect width="15" height="55" x="603" y="465" fill="#2f80c8" stroke="#fff"/><rect width="15" height="88" x="618" y="432" fill="#2f80c8" stroke="#fff"/><rect width="15" height="44" x="633" y="476" fill="#2f80c8" stroke="#fff"/><rect width="15" height="11" x="648" y="509" fill="#2f80c8" stroke="#fff"/><text x="595.5" y="542" fill="#222" font-weight="bold" text-anchor="middle">Bimodal</text><text x="595.5" y="560" fill="#666" font-size="13" text-anchor="middle">two peaks</text></svg>