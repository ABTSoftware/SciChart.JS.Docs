<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 560"><title>The parts of a combo chart</title><desc>A combo chart of a warehouse&apos;s monthly shipments as columns against a left axis and its average dispatch time as a line against a right axis. Numbered markers point to the shared x-axis, the left axis for the columns, the right axis for the line, the legend, and the point where the line crosses the columns, which has no meaning.</desc><rect width="760" height="560" fill="#FFF"/><rect width="18" height="14" x="120" y="22" fill="#7FD3E6" stroke="#2A9DBA" stroke-width="1.5" rx="3"/><text x="144" y="34" fill="#1F2A3C" font-size="14">Shipments (left axis)</text><line x1="310" x2="336" y1="29" y2="29" stroke="#D9650B" stroke-width="3"/><circle cx="323" cy="29" r="4.5" fill="#FFF" stroke="#D9650B" stroke-width="2.5"/><text x="344" y="34" fill="#1F2A3C" font-size="14">Average dispatch time (right axis)</text><line x1="110" x2="650" y1="340" y2="340" stroke="#E3E7EE"/><text x="102" y="344" fill="#2A9DBA" font-size="13" text-anchor="end">0</text><line x1="110" x2="650" y1="301.4" y2="301.4" stroke="#E3E7EE"/><text x="102" y="305.4" fill="#2A9DBA" font-size="13" text-anchor="end">1,000</text><line x1="110" x2="650" y1="262.9" y2="262.9" stroke="#E3E7EE"/><text x="102" y="266.9" fill="#2A9DBA" font-size="13" text-anchor="end">2,000</text><line x1="110" x2="650" y1="224.3" y2="224.3" stroke="#E3E7EE"/><text x="102" y="228.3" fill="#2A9DBA" font-size="13" text-anchor="end">3,000</text><line x1="110" x2="650" y1="185.7" y2="185.7" stroke="#E3E7EE"/><text x="102" y="189.7" fill="#2A9DBA" font-size="13" text-anchor="end">4,000</text><line x1="110" x2="650" y1="147.1" y2="147.1" stroke="#E3E7EE"/><text x="102" y="151.1" fill="#2A9DBA" font-size="13" text-anchor="end">5,000</text><line x1="110" x2="650" y1="108.6" y2="108.6" stroke="#E3E7EE"/><text x="102" y="112.6" fill="#2A9DBA" font-size="13" 