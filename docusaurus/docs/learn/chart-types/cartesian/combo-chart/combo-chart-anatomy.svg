"417" fill="#1F2A3C" font-size="14">Shared x-axis: both series use the same months (or categories).</text><circle cx="50" cy="438" r="12" fill="#1F2A3C"/><text x="50" y="443" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="72" y="443" fill="#1F2A3C" font-size="14">Left axis: read the columns against this scale. It starts at zero.</text><circle cx="50" cy="464" r="12" fill="#1F2A3C"/><text x="50" y="469" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="72" y="469" fill="#1F2A3C" font-size="14">Right axis: read the line against this scale. Its colour matches the line.</text><circle cx="50" cy="490" r="12" fill="#1F2A3C"/><text x="50" y="495" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="72" y="495" fill="#1F2A3C" font-size="14">Legend: names each series and says which axis it uses.</text><circle cx="50" cy="516" r="12" fill="#1F2A3C"/><text x="50" y="521" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="72" y="521" fill="#1F2A3C" font-size="14">Where the line meets a column means nothing: the two scales are independent.</text></svg>