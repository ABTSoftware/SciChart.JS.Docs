<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 900"><title>The same combo chart data drawn three ways</title><desc>Three charts of the same monthly shipments and average dispatch times. In the first, the right axis runs from 0 to 40 hours and the line rises gently above the columns. In the second, the right axis runs from 16 to 34 hours, so the same line starts near the bottom, runs through the columns and climbs steeply. In the third, both series are indexed to January equals 100 on one shared axis, showing shipments up 96% and dispatch time up 79%.</desc><rect width="760" height="900" fill="#FFF"/><text x="24" y="40" fill="#1F2A3C" font-size="16" font-weight="700">A. Right axis from 0 to 40 hours</text><text x="24" y="60" fill="#5B6578" font-size="13">Both axes start at zero. Dispatch time rises by about four-fifths, and the line shows that.</text><line x1="110" x2="650" y1="250" y2="250" stroke="#E3E7EE"/><text x="102" y="254" fill="#2A9DBA" font-size="13" text-anchor="end">0</text><line x1="110" x2="650" y1="201.4" y2="201.4" stroke="#E3E7EE"/><text x="102" y="205.4" fill="#2A9DBA" font-size="13" text-anchor="end">2,000</text><line x1="110" x2="650" y1="152.9" y2="152.9" stroke="#E3E7EE"/><text x="102" y="156.9" fill="#2A9DBA" font-size="13" text-anchor="end">4,000</text><line x1="110" x2="650" y1="104.3" y2="104.3" stroke="#E3E7EE"/><text x="102" y="108.3" fill="#2A9DBA" font-size="13" text-anchor="end">6,000</text><line x1="650" x2="655" y1="250" y2="250" stroke="#D9650B" stroke-width="1.5"/><text x="659" y="254" fill="#D9650B" font-size="13">0 h</text><line x1="650" x2="655" y1="207.5" y2="207.5" stroke="#D9650B" stroke-width="1.5"/><text x="659" y="211.5" fill="#D9650B" font-size="13">10 h</text><line x1="650" x2="655" y1="165" y2="165" stroke="#D9650B" stroke-width="1.5"/><text x="659" y="169" fill="#D9650B" font-size="13">20 h</text><line x1="650" x2="655" y1="122.5" y2