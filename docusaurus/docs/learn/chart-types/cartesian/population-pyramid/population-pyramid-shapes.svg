<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 960 460"><title id="t">The three main shapes of population pyramid</title><desc id="d">Three simplified population pyramids side by side. Expansive: a wide base that narrows quickly towards the top, like a triangle, showing many births and a growing, young population. Stationary: bars of similar width up to old age, then tapering, showing low birth and death rates and a population that is roughly stable. Constrictive: the base is narrower than the middle, showing falling births and an ageing population that may shrink.</desc><rect width="960" height="460" fill="#fff"/><text x="200" y="40" fill="#1F2937" font-size="20" font-weight="700" text-anchor="middle">Expansive</text><rect width="110.5" height="13" x="85.5" y="344" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="110.5" height="13" x="204" y="344" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="91.6" height="13" x="104.4" y="327" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="91.6" height="13" x="204" y="327" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="75.9" height="13" x="120.1" y="310" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="75.9" height="13" x="204" y="310" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="63" height="13" x="133" y="293" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="63" height="13" x="204" y="293" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="52.2" height="13" x="143.8" y="276" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="52.2" height="13" x="204" y="276" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="43.3" height="13" x="152.7" y="259" fill="#2F9FBF" fill-opacity=".85" rx="2"/><rect width="43.3" height="13" x="204" y="259" fill="#E8892B" fill-opacity=".85" rx="2"/><rect width="35.9" height="13" x="160.1" y="242" fill="#2F9FBF"