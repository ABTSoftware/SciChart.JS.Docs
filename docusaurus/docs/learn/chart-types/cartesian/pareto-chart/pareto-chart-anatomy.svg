<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 960 520"><title id="t">Anatomy of a Pareto chart</title><desc id="d">A Pareto chart with six bars sorted from largest to smallest, labelled A to E and Other. A cumulative percentage line rises against a right-hand axis from 0 to 100 percent and reaches a dashed 80 percent reference line at the third bar. The first three causes are marked as the vital few, giving 82 percent of the total; the rest are marked as the useful many.</desc><rect width="960" height="520" fill="#fff"/><text x="480" y="34" fill="#1c2333" font-size="21" font-weight="700" text-anchor="middle">Anatomy of a Pareto chart</text><line x1="90" x2="610" y1="400" y2="400" stroke="#e3e7ee"/><text x="82" y="405" fill="#5b6475" font-size="13" text-anchor="end">0</text><line x1="90" x2="610" y1="334" y2="334" stroke="#e3e7ee"/><text x="82" y="339" fill="#5b6475" font-size="13" text-anchor="end">10</text><line x1="90" x2="610" y1="268" y2="268" stroke="#e3e7ee"/><text x="82" y="273" fill="#5b6475" font-size="13" text-anchor="end">20</text><line x1="90" x2="610" y1="202" y2="202" stroke="#e3e7ee"/><text x="82" y="207" fill="#5b6475" font-size="13" text-anchor="end">30</text><line x1="90" x2="610" y1="136" y2="136" stroke="#e3e7ee"/><text x="82" y="141" fill="#5b6475" font-size="13" text-anchor="end">40</text><line x1="90" x2="610" y1="70" y2="70" stroke="#e3e7ee"/><text x="82" y="75" fill="#5b6475" font-size="13" text-anchor="end">50</text><text x="618" y="405" fill="#5b6475" font-size="13">0%</text><text x="618" y="339" fill="#5b6475" font-size="13">20%</text><text x="618" y="273" fill="#5b6475" font-size="13">40%</text><text x="618" y="207" fill="#5b6475" font-size="13">60%</text><text x="618" y="141" fill="#5b6475" font-size="13">80%</text><text x="618" y="75" fill="#5b6475" font-size="13">100%</text><line x1="90" x2="90" y1="70" y2="400" stroke="#5b6475" stroke-width="1.2"/><line x1="610" x2="610" y1="70" y2="400" stroke="#5b6475" stroke-width="1.2"/><line x1="90" x2="610" y1="400" y2="400" stroke="#5b6475" stroke-width="1.2"/><rect width="57.2" height="297" x="104.7" y="103" fill="#f48420" rx="5"/><text x="133.3" y="97" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">45</text><text x="133.3" y="419" fill="#1c2333" font-size="15" text-anchor="middle">A</text><rect width="57.2" height="165" x="191.4" y="235" fill="#c39859" rx="5"/><text x="220" y="229" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">25</text><text x="220" y="419" fill="#1c2333" font-size="15" text-anchor="middle">B</text><rect width="57.2" height="79.2" x="278.1" y="320.8" fill="#92ac93" rx="5"/><text x="306.7" y="314.8" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">12</text><text x="306.7" y="419" fill="#1c2333" font-size="15" text-anchor="middle">C</text><rect width="57.2" height="52.8" x="364.7" y="347.2" fill="#61c0cc" rx="5"/><text x="393.3" y="341.2" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">8</text><text x="393.3" y="419" fill="#1c2333" font-size="15" text-anchor="middle">D</text><rect width="57.2" height="39.6" x="451.4" y="360.4" fill="#43c3c4" rx="5"/><text x="480" y="354.4" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">6</text><text x="480" y="419" fill="#1c2333" font-size="15" text-anchor="middle">E</text><rect width="57.2" height="26.4" x="538.1" y="373.6" fill="#30bc9a" rx="5"/><text x="566.7" y="367.6" fill="#1c2333" font-size="13" font-weight="600" text-anchor="middle">4</text><text x="566.7" y="419" fill="#1c2333" font-size="15" text-anchor="middle">Other</text><line x1="90" x2="610" y1="136" y2="136" stroke="#d6336c" stroke-dasharray="7 5" stroke-width="2"/><polyline fill="none" stroke="#1c2333" stroke-width="2.5" points="133.3,251.5 220.0,169.0 306.7,129.4 393.3,103.0 480.0,83.2 566.7,70.0"/><circle cx="133.3" cy="251.5" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><circle cx="220" cy="169" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><circle cx="306.7" cy="129.4" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><circle cx="393.3" cy="103" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><circle cx="480" cy="83.2" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><circle cx="566.7" cy="70" r="5" fill="#fff" stroke="#1c2333" stroke-width="2.5"/><text x="30" y="235" fill="#5b6475" font-size="15" font-weight="600" text-anchor="middle" transform="rotate(-90 30 235)">Count (or cost)</text><text x="676" y="235" fill="#5b6475" font-size="15" font-weight="600" text-anchor="middle" transform="rotate(90 676 235)">Cumulative %</text><path fill="none" stroke="#d6336c" stroke-width="2" d="M94 442v8h252v-8"/><text x="220" y="470" fill="#d6336c" font-size="15" font-weight="700" text-anchor="middle">Vital few: 3 causes, 82%</text><path fill="none" stroke="#5b6475" stroke-width="2" d="M354 442v8h252v-8"/><text x="480" y="470" fill="#5b6475" font-size="15" font-weight="700" text-anchor="middle">Useful many: 18%</text><line x1="413.3" x2="436.7" y1="171.8" y2="96.1" stroke="#1c2333" stroke-width="1.3"/><text x="353.3" y="188.8" fill="#1c2333" font-size="15" font-weight="700">Cumulative line:</text><text x="353.3" y="207.8" fill="#1c2333" font-size="15">rises fast,</text><text x="353.3" y="226.8" fill="#1c2333" font-size="15">then flattens</text><line x1="656" x2="704" y1="136" y2="136" stroke="#d6336c" stroke-dasharray="3 3" stroke-width="1.3"/><text x="710" y="141" fill="#d6336c" font-size="15" font-weight="700">80% reference line:</text><text x="710" y="160" fill="#d6336c" font-size="15">where the cumulative</text><text x="710" y="179" fill="#d6336c" font-size="15">line crosses it is</text><text x="710" y="198" fill="#d6336c" font-size="15">the cut-off</text><line x1="704" x2="490" y1="315" y2="350.4" stroke="#1c2333" stroke-width="1.3"/><circle cx="490" cy="350.4" r="3" fill="#1c2333"/><text x="710" y="320" fill="#1c2333" font-size="15" font-weight="700">Bars sorted from</text><text x="710" y="339" fill="#1c2333" font-size="15">largest to smallest,</text><text x="710" y="358" fill="#1c2333" font-size="15">“Other” always last</text></svg>