<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 330"><title>Time bars versus tick bars built from the same trades</title><desc>43 trades over six minutes: steady at first, a burst in the fourth minute, then steady again. Above the trades, one-minute time bars all have the same width but hold between 4 and 17 trades. Below, five-trade tick bars all hold the same number of trades but last very different times: a few seconds each during the burst, up to over a minute when trading is slow. The last tick bar is still forming.</desc><rect width="760" height="330" fill="#fff"/><text x="60" y="26" fill="#1f2a44" font-size="15" font-weight="600">Time bars: one per minute</text><rect width="106" height="40" x="62" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="115" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">7 trades</text><rect width="106" height="40" x="172" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="225" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">6 trades</text><rect width="106" height="40" x="282" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="335" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">4 trades</text><rect width="106" height="40" x="392" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="445" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">17 trades</text><rect width="106" height="40" x="502" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="555" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">5 trades</text><rect width="106" height="40" x="612" y="38" fill="#2a6397" fill-opacity=".12" stroke="#2a6397" rx="5"/><text x="665" y="63" fill="#1f2a44" font-size="14" text-anchor="middle">4 trades</text><line x1="60" x2="720" y1="150" y2="150" stroke="#555" s