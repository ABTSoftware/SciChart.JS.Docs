<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Time bars versus tick bars built from the same trades</title>
<desc>43 trades over six minutes: steady at first, a burst in the fourth minute, then steady again. Above the trades, one-minute time bars all have the same width but hold between 4 and 17 trades. Below, five-trade tick bars all hold the same number of trades but last very different times: a few seconds each during the burst, up to over a minute when trading is slow. The last tick bar is still forming.</desc>
