<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 800 440"><title>How to read an error bar, and how to measure the overlap between two</title><desc>Left: one error bar around a group mean of 12.03 cm, with a marker at the mean, upper and lower arms, caps at each end, and the bar running from 10.89 to 13.17 cm, a 95% confidence interval for 10 plants. Right: the 95% confidence intervals of two groups, Low dose (12.38 to 14.18 cm) and Medium dose (13.87 to 15.95 cm), overlapping by 0.31 cm, about a third of an average arm of 0.97 cm.</desc><rect width="800" height="440" fill="#fff"/><text x="200" y="34" fill="#1f2937" font-size="19" font-weight="700" text-anchor="middle">Reading one error bar</text><text x="600" y="34" fill="#1f2937" font-size="19" font-weight="700" text-anchor="middle">Comparing two error bars</text><line x1="400" x2="400" y1="20" y2="420" stroke="#e5e7eb" stroke-width="2"/><line x1="50" x2="50" y1="80" y2="386" stroke="#9ca3af" stroke-width="1.5"/><g fill="#6b7280" font-size="14" text-anchor="end"><text x="42" y="385">10</text><text x="42" y="325">11</text><text x="42" y="265">12</text><text x="42" y="205">13</text><text x="42" y="145">14</text></g><g stroke="#d1d5db"><line x1="46" x2="54" y1="380" y2="380"/><line x1="46" x2="54" y1="320" y2="320"/><line x1="46" x2="54" y1="260" y2="260"/><line x1="46" x2="54" y1="200" y2="200"/><line x1="46" x2="54" y1="140" y2="140"/></g><text x="14" y="240" fill="#6b7280" font-size="14" text-anchor="middle" transform="rotate(-90 14 240)">Height (cm)</text><line x1="170" x2="170" y1="189.8" y2="326.6" stroke="#be185d" stroke-width="4"/><line x1="148" x2="192" y1="189.8" y2="189.8" stroke="#be185d" stroke-width="4"/><line x1="148" x2="192" y1="326.6" y2="326.6" stroke="#be185d" stroke-width="4"/><circle cx="170" cy="258.2" r="9" fill="#be185d" stroke="#fff" stroke-width="2"/><g fill="#1f2937" font-size="15"><line x1="196" x2="236" y1="189.8" y2="189.8" stroke="#6b7280" stroke-dasharray="3 3"/><text x="242" y="186"><tspan font-weight="700">Cap</tspan> (top)</text><text x="242" y="204" fill="#6b7280">13.17 cm</text><line x1="182" x2="236" y1="258.2" y2="258.2" stroke="#6b7280" stroke-dasharray="3 3"/><text x="242" y="254"><tspan font-weight="700">Marker</tspan>: the mean</text><text x="242" y="272" fill="#6b7280">12.03 cm</text><line x1="196" x2="236" y1="326.6" y2="326.6" stroke="#6b7280" stroke-dasharray="3 3"/><text x="242" y="323"><tspan font-weight="700">Cap</tspan> (bottom)</text><text x="242" y="341" fill="#6b7280">10.89 cm</text></g><g fill="none" stroke="#374151" stroke-width="1.5"><path d="M138 192h-6v63h6"/><path d="M138 261h-6v63h6"/></g><g fill="#374151" font-size="14" text-anchor="end"><text x="126" y="222">upper</text><text x="126" y="238">arm</text><text x="126" y="291">lower</text><text x="126" y="307">arm</text></g><text x="40" y="410" fill="#374151" font-size="14">Each arm: 1.14 cm. Here: a 95% CI, n = 10.</text><text x="40" y="428" fill="#374151" font-size="14">Captions must say which: SD, SE or CI, and n.</text><line x1="470" x2="470" y1="80" y2="386" stroke="#9ca3af" stroke-width="1.5"/><g fill="#6b7280" font-size="14" text-anchor="end"><text x="462" y="385">12</text><text x="462" y="315">13</text><text x="462" y="245">14</text><text x="462" y="175">15</text><text x="462" y="105">16</text></g><g stroke="#d1d5db"><line x1="466" x2="474" y1="380" y2="380"/><line x1="466" x2="474" y1="310" y2="310"/><line x1="466" x2="474" y1="240" y2="240"/><line x1="466" x2="474" y1="170" y2="170"/><line x1="466" x2="474" y1="100" y2="100"/></g><rect width="250" height="21.7" x="476" y="227.4" fill="#fde68a" opacity=".8"/><line x1="540" x2="540" y1="227.4" y2="353.4" stroke="#0e7490" stroke-width="4"/><line x1="522" x2="558" y1="227.4" y2="227.4" stroke="#0e7490" stroke-width="4"/><line x1="522" x2="558" y1="353.4" y2="353.4" stroke="#0e7490" stroke-width="4"/><circle cx="540" cy="290.4" r="9" fill="#0e7490" stroke="#fff" stroke-width="2"/><text x="540" y="380" fill="#1f2937" font-size="15" font-weight="700" text-anchor="middle">Low dose</text><line x1="640" x2="640" y1="103.5" y2="249.1" stroke="#0e7490" stroke-width="4"/><line x1="622" x2="658" y1="103.5" y2="103.5" stroke="#0e7490" stroke-width="4"/><line x1="622" x2="658" y1="249.1" y2="249.1" stroke="#0e7490" stroke-width="4"/><circle cx="640" cy="176.3" r="9" fill="#0e7490" stroke="#fff" stroke-width="2"/><text x="640" y="88" fill="#1f2937" font-size="15" font-weight="700" text-anchor="middle">Medium dose</text><g fill="#1f2937" font-size="14"><text x="732" y="236" font-weight="700">overlap</text><text x="732" y="252">0.31 cm</text></g><text x="470" y="410" fill="#374151" font-size="14">95% CIs overlap by about a third of an arm,</text><text x="470" y="428" fill="#374151" font-size="14">yet a t-test gives P = 0.015: a real difference.</text></svg>