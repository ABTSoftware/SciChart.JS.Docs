<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Anatomy of a correlation matrix</title>
<desc>A four by four correlation matrix of pump readings (load, flow, pressure and ambient temperature) drawn as a heatmap on a diverging blue to red scale. Callouts mark the diagonal of ones, a single cell (flow and pressure, r = −0.82), the upper triangle that mirrors the lower one, and the colour scale centred on zero.</desc>
<rect width="800" height="470" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="600" fill="#1d2433">How to read a correlation matrix</text>
<text x="100" y="120" font-size="15" text-anchor="end" fill="#1d2433">Load</text>
<text x="147" y="68" font-size="15" text-anchor="middle" fill="#1d2433">Load</text>
<text x="100" y="194" font-size="15" text-anchor="end" fill="#1d2433">Flow</text>
<text x="221" y="68" font-size="15" text-anchor="middle" fill="#1d2433">Flow</text>
<text x="100" y="268" font-size="15" text-anchor="end" fill="#1d2433">Pressure</text>
<text x="295" y="68" font-size="15" text-anchor="middle" fill="#1d2433">Pressure</text>
<text x="100" y="342" font-size="15" text-anchor="end" fill="#1d2433">Ambient</text>
<text x="369" y="68" font-size="15" text-anchor="middle" fill="#1d2433">Ambient</text>
<rect x="110" y="78" width="74" height="74" fill="#e5484d" stroke="#ffffff" stroke-width="2"/>
<text x="147" y="121" font-size="17" text-anchor="middle" fill="#ffffff">1.00</text>
<rect x="184" y="78" width="74" height="74" fill="#e65459" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="221" y="121" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">0.93</text>
<rect x="258" y="78" width="74" height="74" fill="#5a97e8" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="295" y="121" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">−0.77</text>
<rect x="332" y="78" width="74" height="74" fill="#f1d3d4" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="369" y="121" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">0.19</text>
<rect x="110" y="152" width="74" height="74" fill="#e65459" stroke="#ffffff" stroke-width="2"/>
<text x="147" y="195" font-size="17" text-anchor="middle" fill="#ffffff">0.93</text>
<rect x="184" y="152" width="74" height="74" fill="#e5484d" stroke="#ffffff" stroke-width="2"/>
<text x="221" y="195" font-size="17" text-anchor="middle" fill="#ffffff">1.00</text>
<rect x="258" y="152" width="74" height="74" fill="#5091e8" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="295" y="195" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">−0.82</text>
<rect x="332" y="152" width="74" height="74" fill="#f1d7d8" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="369" y="195" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">0.17</text>
<rect x="110" y="226" width="74" height="74" fill="#5a97e8" stroke="#ffffff" stroke-width="2"/>
<text x="147" y="269" font-size="17" text-anchor="middle" fill="#ffffff">−0.77</text>
<rect x="184" y="226" width="74" height="74" fill="#5091e8" stroke="#ffffff" stroke-width="2"/>
<text x="221" y="269" font-size="17" text-anchor="middle" fill="#ffffff">−0.82</text>
<rect x="258" y="226" width="74" height="74" fill="#e5484d" stroke="#ffffff" stroke-width="2"/>
<text x="295" y="269" font-size="17" text-anchor="middle" fill="#ffffff">1.00</text>
<rect x="332" y="226" width="74" height="74" fill="#94baed" stroke="#ffffff" stroke-width="2" fill-opacity="0.35"/>
<text x="369" y="269" font-size="17" text-anchor="middle" fill="#1d2433" fill-opacity="0.6">−0.48</text>
<rect x="110" y="300" width="74" height="74" fill="#f1d3d4" stroke="#ffffff" stroke-width="2"/>
<text x="147" y="343" font-size="17" text-anchor="middle" fill="#1d2433">0.19</text>
<rect x="184" y="300" width="74" height="74" fill="#f1d7d8" stroke="#ffffff" stroke-width="2"/>
<text x="221" y="343" font-size="17" text-anchor="middle" fill="#1d2433">0.17</text>
<rect x="258" y="300" width="74" height="74" fill="#94baed" stroke="#ffffff" stroke-width="2"/>
<text x="295" y="343" font-size="17" text-anchor="middle" fill="#1d2433">−0.48</text>
<rect x="332" y="300" width="74" height="74" fill="#e5484d" stroke="#ffffff" stroke-width="2"/>
<text x="369" y="343" font-size="17" text-anchor="middle" fill="#ffffff">1.00</text>
<rect x="113" y="81" width="68" height="68" fill="none" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="187" y="155" width="68" height="68" fill="none" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="261" y="229" width="68" height="68" fill="none" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="335" y="303" width="68" height="68" fill="none" stroke="#1d2433" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="184" y="226" width="74" height="74" fill="none" stroke="#F2A900" stroke-width="4"/>
<circle cx="392" cy="396" r="13" fill="#1d2433"/><text x="392" y="401" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="258" cy="300" r="13" fill="#1d2433"/><text x="258" y="305" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="424" cy="115" r="13" fill="#1d2433"/><text x="424" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<defs><linearGradient id="cm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2c7be5"/><stop offset="0.5" stop-color="#f4f4f4"/><stop offset="1" stop-color="#e5484d"/></linearGradient></defs>
<rect x="450" y="78" width="22" height="296" fill="url(#cm)" stroke="#9aa3b2"/>
<line x1="472" y1="78" x2="478" y2="78" stroke="#1d2433"/><text x="482" y="83" font-size="14" fill="#1d2433">+1</text>
<line x1="472" y1="226" x2="478" y2="226" stroke="#1d2433"/><text x="482" y="231" font-size="14" fill="#1d2433">0</text>
<line x1="472" y1="374" x2="478" y2="374" stroke="#1d2433"/><text x="482" y="379" font-size="14" fill="#1d2433">−1</text>
<circle cx="461" cy="396" r="13" fill="#1d2433"/><text x="461" y="401" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="530" cy="84" r="13" fill="#1d2433"/><text x="530" y="89" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="552" y="89" font-size="15" font-weight="600" fill="#1d2433">Diagonal</text>
<text x="552" y="110" font-size="14" fill="#3a4357">Each variable against itself:</text>
<text x="552" y="129" font-size="14" fill="#3a4357">always exactly 1. Skip it.</text>
<circle cx="530" cy="166" r="13" fill="#1d2433"/><text x="530" y="171" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="552" y="171" font-size="15" font-weight="600" fill="#1d2433">One cell = one pair</text>
<text x="552" y="192" font-size="14" fill="#3a4357">Pressure (row) and Flow (column):</text>
<text x="552" y="211" font-size="14" fill="#3a4357">r = −0.82, as flow rises,</text>
<text x="552" y="230" font-size="14" fill="#3a4357">pressure falls.</text>
<circle cx="530" cy="267" r="13" fill="#1d2433"/><text x="530" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="552" y="272" font-size="15" font-weight="600" fill="#1d2433">Upper triangle</text>
<text x="552" y="293" font-size="14" fill="#3a4357">A mirror image of the lower one</text>
<text x="552" y="312" font-size="14" fill="#3a4357">(r of A with B = r of B with A).</text>
<text x="552" y="331" font-size="14" fill="#3a4357">Read one half only.</text>
<circle cx="530" cy="368" r="13" fill="#1d2433"/><text x="530" y="373" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="552" y="373" font-size="15" font-weight="600" fill="#1d2433">Diverging colour scale</text>
<text x="552" y="394" font-size="14" fill="#3a4357">Centred on 0. Hue = direction,</text>
<text x="552" y="413" font-size="14" fill="#3a4357">depth of colour = strength.</text>
<text x="20" y="436" font-size="13" fill="#5a6378">Pearson r from 10 readings of a pump (sample data). Values run from −1 (perfect negative)</text>
<text x="20" y="454" font-size="13" fill="#5a6378">through 0 (no linear link) to +1 (perfect positive).</text>
</svg>
