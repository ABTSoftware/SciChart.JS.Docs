<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 800 470"><title>Anatomy of a correlation matrix</title><desc>A four by four correlation matrix of pump readings (load, flow, pressure and ambient temperature) drawn as a heatmap on a diverging blue to red scale. Callouts mark the diagonal of ones, a single cell (flow and pressure, r = −0.82), the upper triangle that mirrors the lower one, and the colour scale centred on zero.</desc><rect width="800" height="470" fill="#fff"/><text x="20" y="32" fill="#1d2433" font-size="19" font-weight="600">How to read a correlation matrix</text><text x="100" y="120" fill="#1d2433" font-size="15" text-anchor="end">Load</text><text x="147" y="68" fill="#1d2433" font-size="15" text-anchor="middle">Load</text><text x="100" y="194" fill="#1d2433" font-size="15" text-anchor="end">Flow</text><text x="221" y="68" fill="#1d2433" font-size="15" text-anchor="middle">Flow</text><text x="100" y="268" fill="#1d2433" font-size="15" text-anchor="end">Pressure</text><text x="295" y="68" fill="#1d2433" font-size="15" text-anchor="middle">Pressure</text><text x="100" y="342" fill="#1d2433" font-size="15" text-anchor="end">Ambient</text><text x="369" y="68" fill="#1d2433" font-size="15" text-anchor="middle">Ambient</text><rect width="74" height="74" x="110" y="78" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="147" y="121" fill="#fff" font-size="17" text-anchor="middle">1.00</text><rect width="74" height="74" x="184" y="78" fill="#e65459" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="221" y="121" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">0.93</text><rect width="74" height="74" x="258" y="78" fill="#5a97e8" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="295" y="121" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">−0.77</text><rect width="74" height="74" x="332" y="78" fill="#f1d3d4" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="369" y="121" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">0.19</text><rect width="74" height="74" x="110" y="152" fill="#e65459" stroke="#fff" stroke-width="2"/><text x="147" y="195" fill="#fff" font-size="17" text-anchor="middle">0.93</text><rect width="74" height="74" x="184" y="152" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="221" y="195" fill="#fff" font-size="17" text-anchor="middle">1.00</text><rect width="74" height="74" x="258" y="152" fill="#5091e8" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="295" y="195" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">−0.82</text><rect width="74" height="74" x="332" y="152" fill="#f1d7d8" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="369" y="195" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">0.17</text><rect width="74" height="74" x="110" y="226" fill="#5a97e8" stroke="#fff" stroke-width="2"/><text x="147" y="269" fill="#fff" font-size="17" text-anchor="middle">−0.77</text><rect width="74" height="74" x="184" y="226" fill="#5091e8" stroke="#fff" stroke-width="2"/><text x="221" y="269" fill="#fff" font-size="17" text-anchor="middle">−0.82</text><rect width="74" height="74" x="258" y="226" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="295" y="269" fill="#fff" font-size="17" text-anchor="middle">1.00</text><rect width="74" height="74" x="332" y="226" fill="#94baed" fill-opacity=".35" stroke="#fff" stroke-width="2"/><text x="369" y="269" fill="#1d2433" fill-opacity=".6" font-size="17" text-anchor="middle">−0.48</text><rect width="74" height="74" x="110" y="300" fill="#f1d3d4" stroke="#fff" stroke-width="2"/><text x="147" y="343" fill="#1d2433" font-size="17" text-anchor="middle">0.19</text><rect width="74" height="74" x="184" y="300" fill="#f1d7d8" stroke="#fff" stroke-width="2"/><text x="221" y="343" fill="#1d2433" font-size="17" text-anchor="middle">0.17</text><rect width="74" height="74" x="258" y="300" fill="#94baed" stroke="#fff" stroke-width="2"/><text x="295" y="343" fill="#1d2433" font-size="17" text-anchor="middle">−0.48</text><rect width="74" height="74" x="332" y="300" fill="#e5484d" stroke="#fff" stroke-width="2"/><text x="369" y="343" fill="#fff" font-size="17" text-anchor="middle">1.00</text><rect width="68" height="68" x="113" y="81" fill="none" stroke="#1d2433" stroke-dasharray="6 4" stroke-width="2"/><rect width="68" height="68" x="187" y="155" fill="none" stroke="#1d2433" stroke-dasharray="6 4" stroke-width="2"/><rect width="68" height="68" x="261" y="229" fill="none" stroke="#1d2433" stroke-dasharray="6 4" stroke-width="2"/><rect width="68" height="68" x="335" y="303" fill="none" stroke="#1d2433" stroke-dasharray="6 4" stroke-width="2"/><rect width="74" height="74" x="184" y="226" fill="none" stroke="#F2A900" stroke-width="4"/><circle cx="392" cy="396" r="13" fill="#1d2433"/><text x="392" y="401" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text><circle cx="258" cy="300" r="13" fill="#1d2433"/><text x="258" y="305" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text><circle cx="424" cy="115" r="13" fill="#1d2433"/><text x="424" y="120" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3</text><defs><linearGradient id="cm" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#2c7be5"/><stop offset=".5" stop-color="#f4f4f4"/><stop offset="1" stop-color="#e5484d"/></linearGradient></defs><rect width="22" height="296" x="450" y="78" fill="url(#cm)" stroke="#9aa3b2"/><line x1="472" x2="478" y1="78" y2="78" stroke="#1d2433"/><text x="482" y="83" fill="#1d2433" font-size="14">+1</text><line x1="472" x2="478" y1="226" y2="226" stroke="#1d2433"/><text x="482" y="231" fill="#1d2433" font-size="14">0</text><line x1="472" x2="478" y1="374" y2="374" stroke="#1d2433"/><text x="482" y="379" fill="#1d2433" font-size="14">−1</text><circle cx="461" cy="396" r="13" fill="#1d2433"/><text x="461" y="401" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4</text><circle cx="530" cy="84" r="13" fill="#1d2433"/><text x="530" y="89" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="552" y="89" fill="#1d2433" font-size="15" font-weight="600">Diagonal</text><text x="552" y="110" fill="#3a4357" font-size="14">Each variable against itself:</text><text x="552" y="129" fill="#3a4357" font-size="14">always exactly 1. Skip it.</text><circle cx="530" cy="166" r="13" fill="#1d2433"/><text x="530" y="171" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="552" y="171" fill="#1d2433" font-size="15" font-weight="600">One cell = one pair</text><text x="552" y="192" fill="#3a4357" font-size="14">Pressure (row) and Flow (column):</text><text x="552" y="211" fill="#3a4357" font-size="14">r = −0.82, as flow rises,</text><text x="552" y="230" fill="#3a4357" font-size="14">pressure falls.</text><circle cx="530" cy="267" r="13" fill="#1d2433"/><text x="530" y="272" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="552" y="272" fill="#1d2433" font-size="15" font-weight="600">Upper triangle</text><text x="552" y="293" fill="#3a4357" font-size="14">A mirror image of the lower one</text><text x="552" y="312" fill="#3a4357" font-size="14">(r of A with B = r of B with A).</text><text x="552" y="331" fill="#3a4357" font-size="14">Read one half only.</text><circle cx="530" cy="368" r="13" fill="#1d2433"/><text x="530" y="373" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="552" y="373" fill="#1d2433" font-size="15" font-weight="600">Diverging colour scale</text><text x="552" y="394" fill="#3a4357" font-size="14">Centred on 0. Hue = direction,</text><text x="552" y="413" fill="#3a4357" font-size="14">depth of colour = strength.</text><text x="20" y="436" fill="#5a6378" font-size="13">Pearson r from 10 readings of a pump (sample data). Values run from −1 (perfect negative)</text><text x="20" y="454" fill="#5a6378" font-size="13">through 0 (no linear link) to +1 (perfect positive).</text></svg>