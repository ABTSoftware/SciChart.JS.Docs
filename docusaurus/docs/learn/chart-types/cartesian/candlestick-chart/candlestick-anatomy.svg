<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15" viewBox="0 0 700 400"><title id="title">Anatomy of a candlestick</title><desc id="desc">A bullish (green) candle whose close is above its open, and a bearish (red) candle whose close is below its open. The body spans the open and close prices; the wicks reach the high and low.</desc><rect width="700" height="400" fill="#fff" rx="12"/><line x1="200" x2="200" y1="40" y2="320" stroke="#26a69a" stroke-width="3"/><rect width="60" height="140" x="170" y="110" fill="#26a69a"/><g fill="#333" text-anchor="end"><text x="118" y="45">High</text><text x="118" y="115">Close</text><text x="118" y="255">Open</text><text x="118" y="325">Low</text></g><g stroke="#999" stroke-dasharray="4 4"><line x1="124" x2="196" y1="40" y2="40"/><line x1="124" x2="168" y1="110" y2="110"/><line x1="124" x2="168" y1="250" y2="250"/><line x1="124" x2="196" y1="320" y2="320"/></g><g fill="#666" font-size="13"><text x="214" y="80">upper wick</text><text x="240" y="184">body</text><text x="214" y="290">lower wick</text></g><text x="200" y="365" fill="#1b7f75" font-weight="bold" text-anchor="middle">Bullish: closed above its open</text><line x1="500" x2="500" y1="60" y2="300" stroke="#ef5350" stroke-width="3"/><rect width="60" height="130" x="470" y="100" fill="#ef5350"/><g fill="#333"><text x="582" y="65">High</text><text x="582" y="105">Open</text><text x="582" y="235">Close</text><text x="582" y="305">Low</text></g><g stroke="#999" stroke-dasharray="4 4"><line x1="504" x2="576" y1="60" y2="60"/><line x1="532" x2="576" y1="100" y2="100"/><line x1="532" x2="576" y1="230" y2="230"/><line x1="504" x2="576" y1="300" y2="300"/></g><text x="500" y="365" fill="#c62828" font-weight="bold" text-anchor="middle">Bearish: closed below its open</text></svg>