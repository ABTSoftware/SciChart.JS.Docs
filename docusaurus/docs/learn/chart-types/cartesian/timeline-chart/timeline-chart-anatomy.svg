<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 470"><title id="t">The parts of a timeline chart</title><desc id="d">A state timeline with three lanes: Mixer M-1 and Conveyor C-2, each a row of coloured bands for running, idle and fault, and an Alarms lane with triangle markers. A time axis runs along the bottom from 08:00 to 12:00. Numbered callouts mark the lanes, the time axis, a state band with its start, end and duration, a short fault, and a point event, plus a colour key.</desc><rect width="900" height="470" fill="#fff"/><g fill="#333" font-size="14"><rect width="16" height="16" x="150" y="22" fill="#3FB47F"/><text x="172" y="35">Running</text><rect width="16" height="16" x="250" y="22" fill="#F4B740"/><text x="272" y="35">Idle</text><rect width="16" height="16" x="320" y="22" fill="#E5484D"/><text x="342" y="35">Fault</text><path fill="#E5484D" stroke="#333" d="m410 38 8-15 8 15Z"/><text x="432" y="35">Alarm</text><circle cx="522" cy="30" r="12" fill="#2B4C7E"/><text x="522" y="35" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="542" y="35">Colour key: what each colour means</text></g><g stroke="#e3e3e3"><line x1="150" x2="150" y1="60" y2="330"/><line x1="290" x2="290" y1="60" y2="330"/><line x1="430" x2="430" y1="60" y2="330"/><line x1="570" x2="570" y1="60" y2="330"/><line x1="710" x2="710" y1="60" y2="330"/></g><g fill="#222" font-size="15" text-anchor="end"><text x="142" y="104">Mixer M-1</text><text x="142" y="184">Conveyor C-2</text><text x="142" y="264">Alarms</text></g><rect width="60" height="40" x="150" y="80" fill="#F4B740"/><rect width="250" height="40" x="210" y="80" fill="#3FB47F"/><rect width="45" height="40" x="460" y="80" fill="#E5484D"/><rect width="40" height="40" x="505" y="80" fill="#F4B740"/><rect width="165" height="40" x="545" y="80" fill="#3FB47F"/><rect width="95" height="40" x="150" y="160" fill="#3FB47F"/><rect width="55" height="40" x="245" y="160" fill="#F4B740"/><rect width="160" height="40" x="300" y="160" fill="#3FB47F"/><rect width="85" height="40" x="460" y="160" fill="#F4B740"/><rect width="95" height="40" x="545" y="160" fill="#3FB47F"/><rect width="3" height="40" x="640" y="160" fill="#E5484D"/><rect width="67" height="40" x="643" y="160" fill="#3FB47F"/><path fill="#E5484D" stroke="#333" d="m452 268 8-16 8 16Z"/><path fill="#E5484D" stroke="#333" d="m633 268 8-16 8 16Z"/><line x1="150" x2="710" y1="330" y2="330" stroke="#333" stroke-width="1.5"/><g fill="#333" font-size="14" text-anchor="middle"><line x1="150" x2="150" y1="330" y2="337" stroke="#333"/><text x="150" y="354">08:00</text><line x1="290" x2="290" y1="330" y2="337" stroke="#333"/><text x="290" y="354">09:00</text><line x1="430" x2="430" y1="330" y2="337" stroke="#333"/><text x="430" y="354">10:00</text><line x1="570" x2="570" y1="330" y2="337" stroke="#333"/><text x="570" y="354">11:00</text><line x1="710" x2="710" y1="330" y2="337" stroke="#333"/><text x="710" y="354">12:00</text></g><g fill="#222" font-size="14"><circle cx="14" cy="180" r="12" fill="#2B4C7E"/><text x="14" y="185" fill="#fff" font-weight="bold" text-anchor="middle">1</text><line x1="26" x2="34" y1="180" y2="180" stroke="#2B4C7E" stroke-width="1.5"/><path fill="none" stroke="#2B4C7E" stroke-width="1.5" d="M40 92h-6v176h6"/><circle cx="430" cy="392" r="12" fill="#2B4C7E"/><text x="430" y="397" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="450" y="397">Time axis: left to right, same scale for every lane</text><path fill="none" stroke="#2B4C7E" stroke-width="1.5" d="M210 72v-8h250v8"/><circle cx="335" cy="64" r="12" fill="#2B4C7E"/><text x="335" y="69" fill="#fff" font-weight="bold" text-anchor="middle">3</text><line x1="641" x2="660" y1="200" y2="222" stroke="#2B4C7E" stroke-width="1.5"/><circle cx="668" cy="230" r="12" fill="#2B4C7E"/><text x="668" y="235" fill="#fff" font-weight="bold" text-anchor="middle">4</text><line x1="468" x2="500" y1="262" y2="280" stroke="#2B4C7E" stroke-width="1.5"/><circle cx="510" cy="286" r="12" fill="#2B4C7E"/><text x="510" y="291" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g><g fill="#222" font-size="14"><text x="728" y="92" font-weight="bold">3 State band</text><text x="728" y="110">starts and ends</text><text x="728" y="128">when the state</text><text x="728" y="146">changes; its width</text><text x="728" y="164">is how long it lasted</text><text x="728" y="212" font-weight="bold">4 A short fault</text><text x="728" y="230">is a hairline at</text><text x="728" y="248">this zoom</text><text x="728" y="292" font-weight="bold">5 Point event</text><text x="728" y="310">an instant, no width</text></g><text x="22" y="440" fill="#222" font-size="14"><tspan font-weight="bold">1 Lanes:</tspan> one row per machine, process or source. Read across a lane for its history, down the chart to compare lanes at one moment.</text></svg>