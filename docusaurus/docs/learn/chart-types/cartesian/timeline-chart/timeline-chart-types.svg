<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 900 560"><title id="t">Four types of timeline chart</title><desc id="d">Four small sketches. Event timeline: one line with dated dots and short labels. State timeline: lanes of coloured bands for running, idle and fault. Gantt chart: staggered task bars with an arrow from one task to the task that depends on it, and a today line. Video editor tracks: video and audio tracks with clips and a vertical playhead.</desc><rect width="900" height="560" fill="#fff"/><g fill="none" stroke="#d6d6d6"><rect width="430" height="260" x="10" y="10" rx="8"/><rect width="430" height="260" x="460" y="10" rx="8"/><rect width="430" height="260" x="10" y="290" rx="8"/><rect width="430" height="260" x="460" y="290" rx="8"/></g><text x="30" y="42" fill="#222" font-size="18" font-weight="bold">Event timeline</text><text x="30" y="64" fill="#555" font-size="13">Milestones or incidents as points in time</text><line x1="40" x2="410" y1="170" y2="170" stroke="#333" stroke-width="2"/><g fill="#2B4C7E"><circle cx="70" cy="170" r="7"/><circle cx="150" cy="170" r="7"/><circle cx="265" cy="170" r="7"/><circle cx="300" cy="170" r="7"/><circle cx="385" cy="170" r="7"/></g><g stroke="#888"><line x1="70" x2="70" y1="163" y2="120"/><line x1="150" x2="150" y1="177" y2="215"/><line x1="265" x2="265" y1="163" y2="120"/><line x1="300" x2="300" y1="177" y2="215"/><line x1="385" x2="385" y1="163" y2="120"/></g><g fill="#333" font-size="12" text-anchor="middle"><text x="70" y="112">Founded</text><text x="150" y="230">First release</text><text x="265" y="112">Merger</text><text x="300" y="230">New site</text><text x="385" y="112">Today</text></g><g fill="#777" font-size="11" text-anchor="middle"><text x="70" y="196">2009</text><text x="265" y="196">2018</text><text x="385" y="196">2026</text></g><text x="480" y="42" fill="#222" font-size="18" font-weight="bold">State timeline (swimlane)</text><text x="480" y="64" fill="#555" font-size="13">What each machine or process was doing, and when</text><g fill="#333" font-size="12" text-anchor="end"><text x="548" y="107">Line 1</text><text x="548" y="152">Line 2</text><text x="548" y="197">Line 3</text></g><rect width="120" height="26" x="556" y="90" fill="#3FB47F"/><rect width="30" height="26" x="676" y="90" fill="#E5484D"/><rect width="50" height="26" x="706" y="90" fill="#F4B740"/><rect width="114" height="26" x="756" y="90" fill="#3FB47F"/><rect width="60" height="26" x="556" y="135" fill="#F4B740"/><rect width="200" height="26" x="616" y="135" fill="#3FB47F"/><rect width="54" height="26" x="816" y="135" fill="#F4B740"/><rect width="170" height="26" x="556" y="180" fill="#3FB47F"/><rect width="70" height="26" x="726" y="180" fill="#4C8DF6"/><rect width="74" height="26" x="796" y="180" fill="#3FB47F"/><line x1="556" x2="870" y1="222" y2="222" stroke="#333"/><g fill="#777" font-size="11" text-anchor="middle"><text x="556" y="238">06:00</text><text x="713" y="238">10:00</text><text x="870" y="238">14:00</text></g><g fill="#333" font-size="11"><rect width="10" height="10" x="560" y="248" fill="#3FB47F"/><text x="574" y="257">Running</text><rect width="10" height="10" x="630" y="248" fill="#F4B740"/><text x="644" y="257">Idle</text><rect width="10" height="10" x="680" y="248" fill="#E5484D"/><text x="694" y="257">Fault</text><rect width="10" height="10" x="736" y="248" fill="#4C8DF6"/><text x="750" y="257">Cleaning</text></g><text x="30" y="322" fill="#222" font-size="18" font-weight="bold">Gantt chart</text><text x="30" y="344" fill="#555" font-size="13">Planned tasks, their dates and what depends on what</text><g fill="#333" font-size="12" text-anchor="end"><text x="108" y="381">Design</text><text x="108" y="416">Build</text><text x="108" y="451">Test</text><text x="108" y="486">Launch</text></g><g fill="#7E72C9"><rect width="90" height="20" x="116" y="368" rx="4"/><rect width="130" height="20" x="190" y="403" rx="4"/><rect width="70" height="20" x="300" y="438" rx="4"/><rect width="40" height="20" x="370" y="473" rx="4"/></g><path fill="none" stroke="#333" stroke-width="1.5" d="M320 413h15v19"/><path fill="#333" d="m330 430 5 8 5-8Z"/><line x1="262" x2="262" y1="360" y2="505" stroke="#E5484D" stroke-dasharray="5 4" stroke-width="2"/><text x="262" y="522" fill="#E5484D" font-size="11" text-anchor="middle">Today</text><g fill="#777" font-size="11" text-anchor="middle"><text x="116" y="522">Week 1</text><text x="400" y="522">Week 12</text></g><text x="480" y="322" fill="#222" font-size="18" font-weight="bold">Video editor tracks</text><text x="480" y="344" fill="#555" font-size="13">Clips laid out on tracks against a playhead</text><g fill="#333" font-size="12" text-anchor="end"><text x="520" y="391">V2</text><text x="520" y="426">V1</text><text x="520" y="461">A1</text><text x="520" y="496">A2</text></g><g fill="#5A8FD8"><rect width="90" height="20" x="600" y="378" rx="3"/><rect width="70" height="20" x="760" y="378" rx="3"/></g><g fill="#3E6FB5"><rect width="140" height="20" x="528" y="413" rx="3"/><rect width="110" height="20" x="670" y="413" rx="3"/><rect width="88" height="20" x="782" y="413" rx="3"/></g><g fill="#2FA4A8"><rect width="252" height="20" x="528" y="448" rx="3"/><rect width="88" height="20" x="782" y="448" rx="3"/><rect width="300" height="20" x="560" y="483" fill="#7CC9CC" rx="3"/></g><line x1="725" x2="725" y1="364" y2="512" stroke="#E5484D" stroke-width="2"/><path fill="#E5484D" d="M718 362h14l-7 10Z"/><text x="725" y="530" fill="#E5484D" font-size="11" text-anchor="middle">Playhead 00:01:12</text></svg>