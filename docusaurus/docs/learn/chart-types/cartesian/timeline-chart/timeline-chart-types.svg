<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Four types of timeline chart</title>
  <desc id="d">Four small sketches. Event timeline: one line with dated dots and short labels. State timeline: lanes of coloured bands for running, idle and fault. Gantt chart: staggered task bars with an arrow from one task to the task that depends on it, and a today line. Video editor tracks: video and audio tracks with clips and a vertical playhead.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <g stroke="#d6d6d6" fill="none"><rect x="10" y="10" width="430" height="260" rx="8"/><rect x="460" y="10" width="430" height="260" rx="8"/><rect x="10" y="290" width="430" height="260" rx="8"/><rect x="460" y="290" width="430" height="260" rx="8"/></g>

  <!-- 1 event timeline -->
  <text x="30" y="42" font-size="18" font-weight="bold" fill="#222">Event timeline</text>
  <text x="30" y="64" font-size="13" fill="#555">Milestones or incidents as points in time</text>
  <line x1="40" y1="170" x2="410" y2="170" stroke="#333" stroke-width="2"/>
  <g fill="#2B4C7E">
    <circle cx="70" cy="170" r="7"/><circle cx="150" cy="170" r="7"/><circle cx="265" cy="170" r="7"/><circle cx="300" cy="170" r="7"/><circle cx="385" cy="170" r="7"/>
  </g>
  <g stroke="#888" stroke-width="1"><line x1="70" y1="163" x2="70" y2="120"/><line x1="150" y1="177" x2="150" y2="215"/><line x1="265" y1="163" x2="265" y2="120"/><line x1="300" y1="177" x2="300" y2="215"/><line x1="385" y1="163" x2="385" y2="120"/></g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="112">Founded</text><text x="150" y="230">First release</text><text x="265" y="112">Merger</text><text x="300" y="230">New site</text><text x="385" y="112">Today</text>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle"><text x="70" y="196">2009</text><text x="265" y="196">2018</text><text x="385" y="196">2026</text></g>

  <!-- 2 state timeline -->
  <text x="480" y="42" font-size="18" font-weight="bold" fill="#222">State timeline (swimlane)</text>
  <text x="480" y="64" font-size="13" fill="#555">What each machine or process was doing, and when</text>
  <g font-size="12" fill="#333" text-anchor="end"><text x="548" y="107">Line 1</text><text x="548" y="152">Line 2</text><text x="548" y="197">Line 3</text></g>
  <rect x="556" y="90" width="120" height="26" fill="#3FB47F"/><rect x="676" y="90" width="30" height="26" fill="#E5484D"/><rect x="706" y="90" width="50" height="26" fill="#F4B740"/><rect x="756" y="90" width="114" height="26" fill="#3FB47F"/>
  <rect x="556" y="135" width="60" height="26" fill="#F4B740"/><rect x="616" y="135" width="200" height="26" fill="#3FB47F"/><rect x="816" y="135" width="54" height="26" fill="#F4B740"/>
  <rect x="556" y="180" width="170" height="26" fill="#3FB47F"/><rect x="726" y="180" width="70" height="26" fill="#4C8DF6"/><rect x="796" y="180" width="74" height="26" fill="#3FB47F"/>
  <line x1="556" y1="222" x2="870" y2="222" stroke="#333"/>
  <g font-size="11" fill="#777" text-anchor="middle"><text x="556" y="238">06:00</text><text x="713" y="238">10:00</text><text x="870" y="238">14:00</text></g>
  <g font-size="11" fill="#333"><rect x="560" y="248" width="10" height="10" fill="#3FB47F"/><text x="574" y="257">Running</text><rect x="630" y="248" width="10" height="10" fill="#F4B740"/><text x="644" y="257">Idle</text><rect x="680" y="248" width="10" height="10" fill="#E5484D"/><text x="694" y="257">Fault</text><rect x="736" y="248" width="10" height="10" fill="#4C8DF6"/><text x="750" y="257">Cleaning</text></g>

  <!-- 3 gantt -->
  <text x="30" y="322" font-size="18" font-weight="bold" fill="#222">Gantt chart</text>
  <text x="30" y="344" font-size="13" fill="#555">Planned tasks, their dates and what depends on what</text>
  <g font-size="12" fill="#333" text-anchor="end"><text x="108" y="381">Design</text><text x="108" y="416">Build</text><text x="108" y="451">Test</text><text x="108" y="486">Launch</text></g>
  <g fill="#7E72C9"><rect x="116" y="368" width="90" height="20" rx="4"/><rect x="190" y="403" width="130" height="20" rx="4"/><rect x="300" y="438" width="70" height="20" rx="4"/><rect x="370" y="473" width="40" height="20" rx="4"/></g>
  <path d="M320 413 L335 413 L335 432" fill="none" stroke="#333" stroke-width="1.5"/><path d="M330 430 L335 438 L340 430 Z" fill="#333"/>
  <line x1="262" y1="360" x2="262" y2="505" stroke="#E5484D" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="262" y="522" font-size="11" fill="#E5484D" text-anchor="middle">Today</text>
  <g font-size="11" fill="#777" text-anchor="middle"><text x="116" y="522">Week 1</text><text x="400" y="522">Week 12</text></g>

  <!-- 4 video editor -->
  <text x="480" y="322" font-size="18" font-weight="bold" fill="#222">Video editor tracks</text>
  <text x="480" y="344" font-size="13" fill="#555">Clips laid out on tracks against a playhead</text>
  <g font-size="12" fill="#333" text-anchor="end"><text x="520" y="391">V2</text><text x="520" y="426">V1</text><text x="520" y="461">A1</text><text x="520" y="496">A2</text></g>
  <g fill="#5A8FD8"><rect x="600" y="378" width="90" height="20" rx="3"/><rect x="760" y="378" width="70" height="20" rx="3"/></g>
  <g fill="#3E6FB5"><rect x="528" y="413" width="140" height="20" rx="3"/><rect x="670" y="413" width="110" height="20" rx="3"/><rect x="782" y="413" width="88" height="20" rx="3"/></g>
  <g fill="#2FA4A8"><rect x="528" y="448" width="252" height="20" rx="3"/><rect x="782" y="448" width="88" height="20" rx="3"/><rect x="560" y="483" width="300" height="20" rx="3" fill="#7CC9CC"/></g>
  <line x1="725" y1="364" x2="725" y2="512" stroke="#E5484D" stroke-width="2"/><path d="M718 362 L732 362 L725 372 Z" fill="#E5484D"/>
  <text x="725" y="530" font-size="11" fill="#E5484D" text-anchor="middle">Playhead 00:01:12</text>
</svg>
