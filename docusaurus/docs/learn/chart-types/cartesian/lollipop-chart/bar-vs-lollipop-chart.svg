<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 430"><title id="t">The same data as a bar chart and as a lollipop chart</title><desc id="d">Ten quiz scores between 74 and 88, sorted from highest to lowest, drawn twice from a zero baseline. On the left as thick horizontal bars, which form a dense block of colour; on the right as thin stems with a dot at each end, which use less ink and make the end points stand out.</desc><rect width="760" height="430" fill="#fff"/><text x="220" y="36" fill="#1b2633" font-size="19" font-weight="600" text-anchor="middle">Bar chart</text><line x1="80" x2="80" y1="70" y2="380" stroke="#c9d3dc"/><text x="80" y="402" fill="#5b6773" font-size="14" text-anchor="middle">0</text><line x1="150" x2="150" y1="70" y2="380" stroke="#c9d3dc"/><text x="150" y="402" fill="#5b6773" font-size="14" text-anchor="middle">25</text><line x1="220" x2="220" y1="70" y2="380" stroke="#c9d3dc"/><text x="220" y="402" fill="#5b6773" font-size="14" text-anchor="middle">50</text><line x1="290" x2="290" y1="70" y2="380" stroke="#c9d3dc"/><text x="290" y="402" fill="#5b6773" font-size="14" text-anchor="middle">75</text><line x1="360" x2="360" y1="70" y2="380" stroke="#c9d3dc"/><text x="360" y="402" fill="#5b6773" font-size="14" text-anchor="middle">100</text><text x="70" y="90.5" fill="#1b2633" font-size="15" text-anchor="end">Ana</text><rect width="246.4" height="23.56" x="80" y="73.72" fill="#1f8fb3"/><text x="70" y="121.5" fill="#1b2633" font-size="15" text-anchor="end">Ben</text><rect width="240.8" height="23.56" x="80" y="104.72" fill="#1f8fb3"/><text x="70" y="152.5" fill="#1b2633" font-size="15" text-anchor="end">Cleo</text><rect width="238" height="23.56" x="80" y="135.72" fill="#1f8fb3"/><text x="70" y="183.5" fill="#1b2633" font-size="15" text-anchor="end">Dev</text><rect width="232.4" height="23.56" x="80" y="166.72"