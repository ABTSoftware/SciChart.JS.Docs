<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 470"><title id="t">The parts of a lollipop chart</title><desc id="d">A lollipop chart of orders by region for six regions, sorted from North (42) to Islands (15). Callouts on the Islands lollipop label the dot, whose centre marks the value; the stem, a thin line from zero to the value; the baseline at zero; and the sorted category axis.</desc><rect width="760" height="470" fill="#fff"/><text x="270" y="32" fill="#1b2633" font-size="20" font-weight="600" text-anchor="middle">Orders by region (sample data)</text><line x1="90" x2="520" y1="390" y2="390" stroke="#c9d3dc"/><text x="80" y="395" fill="#5b6773" font-size="15" text-anchor="end">0</text><line x1="90" x2="520" y1="324" y2="324" stroke="#c9d3dc"/><text x="80" y="329" fill="#5b6773" font-size="15" text-anchor="end">10</text><line x1="90" x2="520" y1="258" y2="258" stroke="#c9d3dc"/><text x="80" y="263" fill="#5b6773" font-size="15" text-anchor="end">20</text><line x1="90" x2="520" y1="192" y2="192" stroke="#c9d3dc"/><text x="80" y="197" fill="#5b6773" font-size="15" text-anchor="end">30</text><line x1="90" x2="520" y1="126" y2="126" stroke="#c9d3dc"/><text x="80" y="131" fill="#5b6773" font-size="15" text-anchor="end">40</text><line x1="90" x2="520" y1="60" y2="60" stroke="#c9d3dc"/><text x="80" y="65" fill="#5b6773" font-size="15" text-anchor="end">50</text><text fill="#1b2633" font-size="16" text-anchor="middle" transform="rotate(-90 128.5 96.5)">Orders</text><line x1="125.83" x2="125.83" y1="390" y2="112.8" stroke="#1f8fb3" stroke-width="4"/><circle cx="125.83" cy="112.8" r="11" fill="#1f8fb3"/><text x="125.83" y="414" fill="#1b2633" font-size="15" text-anchor="middle">North</text><line x1="197.5" x2="197.5" y1="390" y2="152.4" stroke="#1f8fb3" stroke-width="4"/><circle cx="197.5" cy="152.4" r="11" fill="#1f8fb3"/><text x="197.5" y="414" fill="#1b2633" font-size="15" text-anchor="middle">East</text><line x1="269.17" x2="269.17" y1="390" y2="185.4" stroke="#1f8fb3" stroke-width="4"/><circle cx="269.17" cy="185.4" r="11" fill="#1f8fb3"/><text x="269.17" y="414" fill="#1b2633" font-size="15" text-anchor="middle">South</text><line x1="340.83" x2="340.83" y1="390" y2="211.8" stroke="#1f8fb3" stroke-width="4"/><circle cx="340.83" cy="211.8" r="11" fill="#1f8fb3"/><text x="340.83" y="414" fill="#1b2633" font-size="15" text-anchor="middle">West</text><line x1="412.5" x2="412.5" y1="390" y2="244.8" stroke="#1f8fb3" stroke-width="4"/><circle cx="412.5" cy="244.8" r="11" fill="#1f8fb3"/><text x="412.5" y="414" fill="#1b2633" font-size="15" text-anchor="middle">Central</text><line x1="484.17" x2="484.17" y1="390" y2="291" stroke="#1f8fb3" stroke-width="4"/><circle cx="484.17" cy="291" r="11" fill="#1f8fb3"/><text x="484.17" y="414" fill="#1b2633" font-size="15" text-anchor="middle">Islands</text><line x1="90" x2="520" y1="390" y2="390" stroke="#1b2633" stroke-width="2.5"/><line x1="557" x2="496.17" y1="145" y2="291" stroke="#d6336c" stroke-width="1.5"/><circle cx="496.17" cy="291" r="3.5" fill="#d6336c"/><text x="565" y="150" fill="#1b2633" font-size="16" font-weight="600">Dot (head)</text><text x="565" y="170" fill="#5b6773" font-size="14">Its centre marks the value:</text><text x="565" y="188" fill="#5b6773" font-size="14">Islands has 15 orders</text><line x1="557" x2="487.17" y1="240" y2="355.5" stroke="#d6336c" stroke-width="1.5"/><circle cx="487.17" cy="355.5" r="3.5" fill="#d6336c"/><text x="565" y="245" fill="#1b2633" font-size="16" font-weight="600">Stem</text><text x="565" y="265" fill="#5b6773" font-size="14">A thin line from zero</text><text x="565" y="283" fill="#5b6773" font-size="14">to the value</text><line x1="557" x2="514" y1="330" y2="390" stroke="#d6336c" stroke-width="1.5"/><circle cx="514" cy="390" r="3.5" fill="#d6336c"/><text x="565" y="335" fill="#1b2633" font-size="16" font-weight="600">Baseline at zero</text><text x="565" y="355" fill="#5b6773" font-size="14">Stem length shows the value,</text><text x="565" y="373" fill="#5b6773" font-size="14">so the axis must start at 0</text><line x1="557" x2="514.17" y1="420" y2="410" stroke="#d6336c" stroke-width="1.5"/><circle cx="514.17" cy="410" r="3.5" fill="#d6336c"/><text x="565" y="425" fill="#1b2633" font-size="16" font-weight="600">Categories, sorted</text><text x="565" y="445" fill="#5b6773" font-size="14">Largest to smallest makes</text><text x="565" y="463" fill="#5b6773" font-size="14">the ranking easy to read</text></svg>