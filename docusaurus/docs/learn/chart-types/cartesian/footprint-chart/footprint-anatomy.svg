<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" aria-labelledby="fp-title fp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 440"><title id="fp-title">Anatomy of one footprint bar</title><desc id="fp-desc">A five-minute footprint bar with five price rows from 5,001.00 to 5,002.00. Each row shows volume sold at the bid on the left and bought at the ask on the right. The busiest row, 5,001.75 with 214 contracts, is outlined as the point of control. A bracket marks the value area from 5,001.25 to 5,001.75. An arrow compares 150 bought at the ask at 5,001.75 with 40 sold at the bid one row lower, a 375% ask imbalance. A thin candle beside the rows shows the open, high, low and close, and a delta row underneath reads +20 on 678 contracts.</desc><rect width="760" height="440" fill="#fff"/><defs><marker id="fp-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1b2a41" d="m0 0 10 5-10 5z"/></marker></defs><text x="180" y="46" fill="#c62828" font-size="15" font-weight="600" text-anchor="middle">Bid (sells)</text><text x="280" y="46" fill="#00796b" font-size="15" font-weight="600" text-anchor="middle">Ask (buys)</text><text x="80" y="46" fill="#1b2a41" font-size="15" font-weight="600" text-anchor="middle">Price</text><rect width="208" height="164" x="126" y="108" fill="#5c7cfa" fill-opacity=".1"/><g fill="#1b2a41" font-size="17" text-anchor="middle"><text x="80" y="92">5,002.00</text><rect width="98" height="48" x="131" y="62" fill="#ef5350" fill-opacity=".1"/><rect width="98" height="48" x="231" y="62" fill="#26a69a" fill-opacity=".16"/><text x="180" y="92">6</text><text x="280" y="92">22</text><text x="80" y="144">5,001.75</text><rect width="98" height="48" x="131" y="114" fill="#ef5350" fill-opacity=".28"/><rect width="98" height="48" x="231" y="114" fill="#00c896"/><text x="180" y="144">64</text><text x="280" y="144" font-weight="700">150</text><text x="80" y="196">5,001.50</text><rect width="98" height="48" x="131" y="166" fill="#ef5350" fill-opacity=".2"/><rect width="98" height="48" x="231" y="166" fill="#26a69a" fill-opacity=".45"/><text x="180" y="196">40</text><text x="280" y="196">118</text><text x="80" y="248">5,001.25</text><rect width="98" height="48" x="131" y="218" fill="#ef5350" fill-opacity=".5"/><rect width="98" height="48" x="231" y="218" fill="#26a69a" fill-opacity=".24"/><text x="180" y="248">131</text><text x="280" y="248">45</text><text x="80" y="300">5,001.00</text><rect width="98" height="48" x="131" y="270" fill="#ef5350" fill-opacity=".38"/><rect width="98" height="48" x="231" y="270" fill="#26a69a" fill-opacity=".12"/><text x="180" y="300">88</text><text x="280" y="300">14</text></g><rect width="202" height="52" x="129" y="112" fill="none" stroke="#e0a800" stroke-width="3"/><line x1="262" x2="200" y1="150" y2="184" stroke="#1b2a41" stroke-width="2" marker-end="url(#fp-arrow)"/><line x1="352" x2="352" y1="86" y2="294" stroke="#26a69a" stroke-width="2"/><rect width="12" height="104" x="346" y="138" fill="#26a69a"/><text x="352" y="330" fill="#455a64" font-size="13" text-anchor="middle">candle</text><path fill="none" stroke="#5c7cfa" stroke-width="2.5" d="M376 112h8v156h-8"/><rect width="198" height="40" x="131" y="344" fill="#26a69a" fill-opacity=".18" rx="4"/><text x="230" y="370" fill="#1b2a41" font-size="16" text-anchor="middle">Delta +20 · Volume 678</text><g fill="#1b2a41" font-size="14"><text x="408" y="82">Point of control: the busiest price,</text><text x="408" y="100">5,001.75 with 64 + 150 = 214 contracts</text><line x1="404" x2="334" y1="92" y2="128" stroke="#e0a800" stroke-width="1.5"/><text x="408" y="176">Ask imbalance: 150 bought at the ask</text><text x="408" y="194">against 40 sold at the bid one row</text><text x="408" y="212">lower = 375% (threshold 300%)</text><line x1="404" x2="268" y1="186" y2="166" stroke="#1b2a41" stroke-dasharray="4 3" stroke-width="1.5"/><text x="408" y="250">Value area: the rows around the POC</text><text x="408" y="268">that hold at least 70% of the volume</text><text x="408" y="286">(5,001.25 to 5,001.75: 548 of 678)</text><text x="408" y="360">Delta: ask volume (349) minus</text><text x="408" y="378">bid volume (329) for the whole bar</text><line x1="404" x2="332" y1="368" y2="364" stroke="#1b2a41" stroke-width="1.5"/></g><text x="380" y="424" fill="#455a64" font-size="13" text-anchor="middle">One five-minute bar, rows one tick (0.25) tall. Sample numbers.</text></svg>