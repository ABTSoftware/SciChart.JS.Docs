<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="fp-title fp-desc">
  <title id="fp-title">Anatomy of one footprint bar</title>
  <desc id="fp-desc">A five-minute footprint bar with five price rows from 5,001.00 to 5,002.00. Each row shows volume sold at the bid on the left and bought at the ask on the right. The busiest row, 5,001.75 with 214 contracts, is outlined as the point of control. A bracket marks the value area from 5,001.25 to 5,001.75. An arrow compares 150 bought at the ask at 5,001.75 with 40 sold at the bid one row lower, a 375% ask imbalance. A thin candle beside the rows shows the open, high, low and close, and a delta row underneath reads +20 on 678 contracts.</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="180" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#c62828">Bid (sells)</text>
  <text x="280" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#00796b">Ask (buys)</text>
  <text x="80" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2a41">Price</text>

  <!-- Value area band (behind the rows) -->
  <rect x="126" y="108" width="208" height="164" fill="#5c7cfa" fill-opacity="0.10"/>

  <!-- Rows: top 5002.00 to bottom 5001.00, 52 px each, starting at y = 60 -->
  <g font-size="17" text-anchor="middle" fill="#1b2a41">
    <!-- 5002.00: bid 6, ask 22 -->
    <text x="80" y="92">5,002.00</text>
    <rect x="131" y="62" width="98" height="48" fill="#ef5350" fill-opacity="0.10"/>
    <rect x="231" y="62" width="98" height="48" fill="#26a69a" fill-opacity="0.16"/>
    <text x="180" y="92">6</text><text x="280" y="92">22</text>
    <!-- 5001.75: bid 64, ask 150 (ask imbalance) -->
    <text x="80" y="144">5,001.75</text>
    <rect x="131" y="114" width="98" height="48" fill="#ef5350" fill-opacity="0.28"/>
    <rect x="231" y="114" width="98" height="48" fill="#00c896"/>
    <text x="180" y="144">64</text><text x="280" y="144" font-weight="700">150</text>
    <!-- 5001.50: bid 40, ask 118 -->
    <text x="80" y="196">5,001.50</text>
    <rect x="131" y="166" width="98" height="48" fill="#ef5350" fill-opacity="0.20"/>
    <rect x="231" y="166" width="98" height="48" fill="#26a69a" fill-opacity="0.45"/>
    <text x="180" y="196">40</text><text x="280" y="196">118</text>
    <!-- 5001.25: bid 131, ask 45 -->
    <text x="80" y="248">5,001.25</text>
    <rect x="131" y="218" width="98" height="48" fill="#ef5350" fill-opacity="0.50"/>
    <rect x="231" y="218" width="98" height="48" fill="#26a69a" fill-opacity="0.24"/>
    <text x="180" y="248">131</text><text x="280" y="248">45</text>
    <!-- 5001.00: bid 88, ask 14 -->
    <text x="80" y="300">5,001.00</text>
    <rect x="131" y="270" width="98" height="48" fill="#ef5350" fill-opacity="0.38"/>
    <rect x="231" y="270" width="98" height="48" fill="#26a69a" fill-opacity="0.12"/>
    <text x="180" y="300">88</text><text x="280" y="300">14</text>
  </g>

  <!-- Point of control outline on 5001.75 -->
  <rect x="129" y="112" width="202" height="52" fill="none" stroke="#e0a800" stroke-width="3"/>

  <!-- Diagonal comparison arrow: ask 150 at 5001.75 against bid 40 at 5001.50 -->
  <line x1="262" y1="150" x2="200" y2="184" stroke="#1b2a41" stroke-width="2" marker-end="url(#fp-arrow)"/>

  <!-- Thin candle: open 5001.25, high 5002.00, low 5001.00, close 5001.75 -->
  <line x1="352" y1="86" x2="352" y2="294" stroke="#26a69a" stroke-width="2"/>
  <rect x="346" y="138" width="12" height="104" fill="#26a69a"/>
  <text x="352" y="330" text-anchor="middle" font-size="13" fill="#455a64">candle</text>

  <!-- Value area bracket -->
  <path d="M376,112 h8 v156 h-8" fill="none" stroke="#5c7cfa" stroke-width="2.5"/>

  <!-- Delta row -->
  <rect x="131" y="344" width="198" height="40" rx="4" fill="#26a69a" fill-opacity="0.18"/>
  <text x="230" y="370" text-anchor="middle" font-size="16" fill="#1b2a41">Delta +20 · Volume 678</text>

  <!-- Callouts -->
  <g font-size="14" fill="#1b2a41">
    <text x="408" y="82">Point of control: the busiest price,</text>
    <text x="408" y="100">5,001.75 with 64 + 150 = 214 contracts</text>
    <line x1="404" y1="92" x2="334" y2="128" stroke="#e0a800" stroke-width="1.5"/>

    <text x="408" y="176">Ask imbalance: 150 bought at the ask</text>
    <text x="408" y="194">against 40 sold at the bid one row</text>
    <text x="408" y="212">lower = 375% (threshold 300%)</text>
    <line x1="404" y1="186" x2="268" y2="166" stroke="#1b2a41" stroke-width="1.5" stroke-dasharray="4 3"/>

    <text x="408" y="250">Value area: the rows around the POC</text>
    <text x="408" y="268">that hold at least 70% of the volume</text>
    <text x="408" y="286">(5,001.25 to 5,001.75: 548 of 678)</text>

    <text x="408" y="360">Delta: ask volume (349) minus</text>
    <text x="408" y="378">bid volume (329) for the whole bar</text>
    <line x1="404" y1="368" x2="332" y2="364" stroke="#1b2a41" stroke-width="1.5"/>
  </g>

  <text x="380" y="424" text-anchor="middle" font-size="13" fill="#455a64">One five-minute bar, rows one tick (0.25) tall. Sample numbers.</text>
</svg>
