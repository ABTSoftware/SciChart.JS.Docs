<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 430"><title>DSM, DTM and height above ground in a point cloud cross-section</title><desc>A side view through a strip of point cloud with a house, two trees and sloping ground. Points are coloured by class: brown ground, green vegetation and red building. A blue line traces the digital surface model, the highest point at each position, running over the roof and the tree tops. A brown line traces the digital terrain model, the bare ground interpolated under the house and trees. Arrows show that height above ground, or the canopy height model over trees, is the surface model minus the terrain model: about 12 metres at the taller tree and 7 metres at the roof ridge.</desc><rect width="900" height="430" fill="#fff"/><line x1="60" x2="60" y1="40" y2="370" stroke="#9aa3b5" stroke-width="1.5"/><text x="50" y="44" fill="#5b6478" font-size="13" text-anchor="end">70 m</text><text x="50" y="374" fill="#5b6478" font-size="13" text-anchor="end">50 m</text><text x="24" y="210" fill="#5b6478" font-size="13" text-anchor="middle" transform="rotate(-90 24 210)">Elevation</text><path fill="none" stroke="#8a5a2b" stroke-width="3" d="M60 330c140-10 260-30 390-34s250 4 410-14"/><g fill="#b98b5e"><circle cx="72" cy="329" r="3.5"/><circle cx="92" cy="328" r="3.5"/><circle cx="112" cy="327" r="3.5"/><circle cx="132" cy="326" r="3.5"/><circle cx="214" cy="319" r="3.5"/><circle cx="236" cy="316" r="3.5"/><circle cx="258" cy="313" r="3.5"/><circle cx="190" cy="321" r="3.5"/><circle cx="420" cy="297" r="3.5"/><circle cx="440" cy="296" r="3.5"/><circle cx="610" cy="296" r="3.5"/><circle cx="630" cy="297" r="3.5"/><circle cx="560" cy="294" r="3.5"/><circle cx="790" cy="291" r="3.5"/><circle cx="812" cy="288" r="3.5"/><circle cx="834" cy="285" r="3.5"/><circle cx="854" cy="283" r="3.5"/></g><g fill="#2fae5b"><circle cx="140" cy="200" r="3.5"/><circle cx="158" cy="176" r="3.5"/><circle cx="176" cy="168" r="3.5"/><circle cx="194" cy="180" r="3.5"/><circle cx="210" cy="204" r="3.5"/><circle cx="166" cy="230" r="3.5"/><circle cx="186" cy="246" r="3.5"/></g><rect width="8" height="70" x="173" y="250" fill="#7a5230" opacity=".5"/><g fill="#ef5350"><circle cx="300" cy="222" r="3.5"/><circle cx="320" cy="208" r="3.5"/><circle cx="340" cy="194" r="3.5"/><circle cx="360" cy="180" r="3.5"/><circle cx="380" cy="194" r="3.5"/><circle cx="400" cy="208" r="3.5"/><circle cx="296" cy="260" r="3.5"/><circle cx="404" cy="270" r="3.5"/></g><g fill="#2fae5b"><circle cx="660" cy="150" r="3.5"/><circle cx="680" cy="112" r="3.5"/><circle cx="700" cy="96" r="3.5"/><circle cx="720" cy="104" r="3.5"/><circle cx="740" cy="132" r="3.5"/><circle cx="756" cy="166" r="3.5"/><circle cx="690" cy="170" r="3.5"/><circle cx="716" cy="196" r="3.5"/></g><rect width="9" height="98" x="704" y="200" fill="#7a5230" opacity=".5"/><g fill="#b98b5e"><circle cx="694" cy="299" r="3.5"/><circle cx="726" cy="298" r="3.5"/><circle cx="160" cy="324" r="3.5"/></g><path fill="none" stroke="#2c7bb6" stroke-dasharray="8 4" stroke-width="2.5" d="m60 330 72-4 8-126 18-24 18-8 18 12 16 24 4 115 44-6 38-13 4-78 60-42 40 28 4 89 206-1 40-2 10-144 20-38 20-16 20 8 20 28 16 34 14 126 90-10"/><line x1="700" x2="700" y1="102" y2="292" stroke="#1d2433" stroke-width="1.8"/><path fill="none" stroke="#1d2433" stroke-width="1.8" d="m694 110 6-10 6 10m-12 174 6 10 6-10"/><text x="770" y="196" fill="#1d2433" font-size="14">CHM ≈ 12 m</text><text x="770" y="214" fill="#5b6478" font-size="13">(tree height)</text><line x1="360" x2="360" y1="186" y2="300" stroke="#1d2433" stroke-width="1.8"/><path fill="none" stroke="#1d2433" stroke-width="1.8" d="m354 194 6-10 6 10m-12 98 6 10 6-10"/><text x="430" y="240" fill="#1d2433" font-size="14">≈ 7 m above ground</text><text x="430" y="258" fill="#5b6478" font-size="13">(roof ridge)</text><g fill="#1d2433" font-size="14"><line x1="80" x2="120" y1="398" y2="398" stroke="#2c7bb6" stroke-dasharray="8 4" stroke-width="2.5"/><text x="128" y="403">DSM: highest point, roofs and tree tops</text><line x1="430" x2="470" y1="398" y2="398" stroke="#8a5a2b" stroke-width="3"/><text x="478" y="403">DTM: bare earth from ground points</text><text x="80" y="424" fill="#5b6478">Height above ground (nDSM; CHM over trees) = DSM − DTM, cell by cell.</text></g></svg>