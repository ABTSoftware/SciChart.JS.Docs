<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>DSM, DTM and height above ground in a point cloud cross-section</title>
  <desc>A side view through a strip of point cloud with a house, two trees and sloping ground. Points are coloured by class: brown ground, green vegetation and red building. A blue line traces the digital surface model, the highest point at each position, running over the roof and the tree tops. A brown line traces the digital terrain model, the bare ground interpolated under the house and trees. Arrows show that height above ground, or the canopy height model over trees, is the surface model minus the terrain model: about 12 metres at the taller tree and 7 metres at the roof ridge.</desc>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Axis -->
  <line x1="60" y1="40" x2="60" y2="370" stroke="#9aa3b5" stroke-width="1.5"/>
  <text x="50" y="44" font-size="13" fill="#5b6478" text-anchor="end">70 m</text>
  <text x="50" y="374" font-size="13" fill="#5b6478" text-anchor="end">50 m</text>
  <text x="24" y="210" font-size="13" fill="#5b6478" transform="rotate(-90 24 210)" text-anchor="middle">Elevation</text>

  <!-- DTM -->
  <path d="M60,330 C200,320 320,300 450,296 C580,292 700,300 860,282" fill="none" stroke="#8a5a2b" stroke-width="3"/>
  <!-- ground points -->
  <g fill="#b98b5e">
    <circle cx="72" cy="329" r="3.5"/><circle cx="92" cy="328" r="3.5"/><circle cx="112" cy="327" r="3.5"/><circle cx="132" cy="326" r="3.5"/>
    <circle cx="214" cy="319" r="3.5"/><circle cx="236" cy="316" r="3.5"/><circle cx="258" cy="313" r="3.5"/>
    <circle cx="190" cy="321" r="3.5"/><circle cx="420" cy="297" r="3.5"/><circle cx="440" cy="296" r="3.5"/>
    <circle cx="610" cy="296" r="3.5"/><circle cx="630" cy="297" r="3.5"/><circle cx="560" cy="294" r="3.5"/>
    <circle cx="790" cy="291" r="3.5"/><circle cx="812" cy="288" r="3.5"/><circle cx="834" cy="285" r="3.5"/><circle cx="854" cy="283" r="3.5"/>
  </g>

  <!-- Tree 1 points -->
  <g fill="#2fae5b">
    <circle cx="140" cy="200" r="3.5"/><circle cx="158" cy="176" r="3.5"/><circle cx="176" cy="168" r="3.5"/><circle cx="194" cy="180" r="3.5"/>
    <circle cx="210" cy="204" r="3.5"/><circle cx="166" cy="230" r="3.5"/><circle cx="186" cy="246" r="3.5"/>
  </g>
  <rect x="173" y="250" width="8" height="70" fill="#7a5230" opacity="0.5"/>

  <!-- House points -->
  <g fill="#ef5350">
    <circle cx="300" cy="222" r="3.5"/><circle cx="320" cy="208" r="3.5"/><circle cx="340" cy="194" r="3.5"/><circle cx="360" cy="180" r="3.5"/>
    <circle cx="380" cy="194" r="3.5"/><circle cx="400" cy="208" r="3.5"/><circle cx="296" cy="260" r="3.5"/><circle cx="404" cy="270" r="3.5"/>
  </g>

  <!-- Tree 2 points (taller) -->
  <g fill="#2fae5b">
    <circle cx="660" cy="150" r="3.5"/><circle cx="680" cy="112" r="3.5"/><circle cx="700" cy="96" r="3.5"/><circle cx="720" cy="104" r="3.5"/>
    <circle cx="740" cy="132" r="3.5"/><circle cx="756" cy="166" r="3.5"/><circle cx="690" cy="170" r="3.5"/><circle cx="716" cy="196" r="3.5"/>
  </g>
  <rect x="704" y="200" width="9" height="98" fill="#7a5230" opacity="0.5"/>
  <g fill="#b98b5e"><circle cx="694" cy="299" r="3.5"/><circle cx="726" cy="298" r="3.5"/><circle cx="160" cy="324" r="3.5"/></g>

  <!-- DSM -->
  <path d="M60,330 L132,326 L140,200 L158,176 L176,168 L194,180 L210,204 L214,319 L258,313 L296,300 L300,222 L360,180 L400,208 L404,297 L610,296 L650,294 L660,150 L680,112 L700,96 L720,104 L740,132 L756,166 L770,292 L860,282" fill="none" stroke="#2c7bb6" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- Height arrows -->
  <line x1="700" y1="102" x2="700" y2="292" stroke="#1d2433" stroke-width="1.8"/>
  <path d="M694,110 L700,100 L706,110 M694,284 L700,294 L706,284" fill="none" stroke="#1d2433" stroke-width="1.8"/>
  <text x="770" y="196" font-size="14" fill="#1d2433">CHM ≈ 12 m</text>
  <text x="770" y="214" font-size="13" fill="#5b6478">(tree height)</text>
  <line x1="360" y1="186" x2="360" y2="300" stroke="#1d2433" stroke-width="1.8"/>
  <path d="M354,194 L360,184 L366,194 M354,292 L360,302 L366,292" fill="none" stroke="#1d2433" stroke-width="1.8"/>
  <text x="430" y="240" font-size="14" fill="#1d2433">≈ 7 m above ground</text>
  <text x="430" y="258" font-size="13" fill="#5b6478">(roof ridge)</text>

  <!-- Legend -->
  <g font-size="14" fill="#1d2433">
    <line x1="80" y1="398" x2="120" y2="398" stroke="#2c7bb6" stroke-width="2.5" stroke-dasharray="8 4"/>
    <text x="128" y="403">DSM: highest point, roofs and tree tops</text>
    <line x1="430" y1="398" x2="470" y2="398" stroke="#8a5a2b" stroke-width="3"/>
    <text x="478" y="403">DTM: bare earth from ground points</text>
    <text x="80" y="424" fill="#5b6478">Height above ground (nDSM; CHM over trees) = DSM − DTM, cell by cell.</text>
  </g>
</svg>
