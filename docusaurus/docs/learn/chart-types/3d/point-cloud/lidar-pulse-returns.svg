<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 540"><title>How an airborne LiDAR pulse becomes points</title><desc>An aircraft carrying a laser scanner, a GNSS receiver and an inertial measurement unit fires a laser pulse at a tree. The pulse returns three echoes: return 1 of 3 from the top of the canopy, return 2 of 3 from a branch, and return 3 of 3 from the ground. A second pulse hits a flat roof and returns once. The range is the speed of light times the round-trip time, divided by two, so one nanosecond of round trip is about 15 centimetres. On the right, one point record lists the fields each return is stored with: X, Y and Z coordinates, intensity, return number and number of returns, classification, scan angle and GPS time.</desc><rect width="900" height="540" fill="#fff"/><g transform="translate(150 58)"><rect width="140" height="28" x="-70" y="-14" fill="#3b4a6b" rx="14"/><path fill="#56678c" d="m-20-12-40-34h22l56 34Z"/><path fill="#56678c" d="m58-10 22-24h8L78-8Z"/><rect width="22" height="12" x="-10" y="14" fill="#e2627c" rx="3"/></g><text x="248" y="40" fill="#1d2433" font-size="15">Laser scanner</text><text x="248" y="60" fill="#1d2433" font-size="15">GNSS: where the aircraft is</text><text x="248" y="80" fill="#1d2433" font-size="15">IMU: which way it points</text><path fill="none" stroke="#8a5a2b" stroke-width="4" d="M20 452c100-6 200 6 310-2 70-5 120 2 190-1"/><text x="30" y="482" fill="#8a5a2b" font-size="14">Ground</text><rect width="12" height="112" x="146" y="340" fill="#7a5230"/><ellipse cx="152" cy="300" fill="#6cc08b" opacity=".85" rx="70" ry="66"/><path stroke="#7a5230" stroke-width="5" d="m152 360-34-30m34 50 36-30"/><rect width="130" height="120" x="360" y="330" fill="#c9ced8" stroke="#6b7385" stroke-width="2"/><line x1="360" x2="490" y1="330" y2="330" stroke="#6b7385" stroke-width="4"/><line x1="141" x2="141" y1="84" y2="450" stroke="#e2627c" stroke-dasharray="7 5" stroke-width="2.5"/><line x1="141" x2="425" y1="84" y2="330" stroke="#e2627c" stroke-dasharray="7 5" stroke-width="2.5"/><circle cx="141" cy="238" r="8" fill="#2fae5b" stroke="#1d2433" stroke-width="1.5"/><circle cx="141" cy="342" r="8" fill="#f6c343" stroke="#1d2433" stroke-width="1.5"/><circle cx="141" cy="450" r="8" fill="#f48420" stroke="#1d2433" stroke-width="1.5"/><circle cx="425" cy="330" r="8" fill="#50a7e0" stroke="#1d2433" stroke-width="1.5"/><g fill="#1d2433" font-size="14"><text x="24" y="226">Return 1 of 3</text><text x="24" y="242" fill="#5b6478">top of canopy</text><text x="24" y="368">Return 2 of 3</text><text x="24" y="384" fill="#5b6478">a branch</text><text x="165" y="430">Return 3 of 3</text><text x="165" y="446" fill="#5b6478">the ground</text><text x="400" y="296">Only return</text><text x="400" y="312" fill="#5b6478">a flat roof</text></g><rect width="230" height="80" x="300" y="160" fill="#f3f5fa" stroke="#c4cad8" rx="8"/><text x="315" y="188" fill="#1d2433" font-size="15">range = c × round-trip time ÷ 2</text><text x="315" y="212" fill="#5b6478" font-size="14">1 ns of round trip ≈ 15 cm</text><text x="315" y="230" fill="#5b6478" font-size="14">a 1,000 m range ≈ 6.7 µs</text><path fill="none" stroke="#6b7385" stroke-width="2" d="M540 300c35 0 45-50 72-50"/><path fill="none" stroke="#6b7385" stroke-width="2" d="m606 244 8 6-8 6"/><rect width="262" height="330" x="620" y="110" fill="#f3f5fa" stroke="#c4cad8" rx="10"/><text x="636" y="140" fill="#1d2433" font-size="16" font-weight="700">One point record</text><text x="636" y="160" fill="#5b6478" font-size="13">(return 1 of 3, the canopy top)</text><g fill="#1d2433" font-size="14"><text x="636" y="194">X (easting)</text><text x="866" y="194" text-anchor="end">412,836.27 m</text><text x="636" y="222">Y (northing)</text><text x="866" y="222" text-anchor="end">5,301,904.55 m</text><text x="636" y="250">Z (elevation)</text><text x="866" y="250" text-anchor="end">71.42 m</text><text x="636" y="278">Intensity</text><text x="866" y="278" text-anchor="end">18,240</text><text x="636" y="306">Return</text><text x="866" y="306" text-anchor="end">1 of 3</text><text x="636" y="334">Classification</text><text x="866" y="334" text-anchor="end">5 (high veg.)</text><text x="636" y="362">Scan angle</text><text x="866" y="362" text-anchor="end">−7°</text><text x="636" y="390">GPS time</text><text x="866" y="390" text-anchor="end">3.1 × 10⁸ s</text><text x="636" y="418" fill="#5b6478">+ RGB, NIR if recorded</text></g><text x="450" y="522" fill="#5b6478" font-size="13" text-anchor="middle">Not to scale. Example values; a survey stores millions of records like this one.</text></svg>