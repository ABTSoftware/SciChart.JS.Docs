<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How an airborne LiDAR pulse becomes points</title>
  <desc>An aircraft carrying a laser scanner, a GNSS receiver and an inertial measurement unit fires a laser pulse at a tree. The pulse returns three echoes: return 1 of 3 from the top of the canopy, return 2 of 3 from a branch, and return 3 of 3 from the ground. A second pulse hits a flat roof and returns once. The range is the speed of light times the round-trip time, divided by two, so one nanosecond of round trip is about 15 centimetres. On the right, one point record lists the fields each return is stored with: X, Y and Z coordinates, intensity, return number and number of returns, classification, scan angle and GPS time.</desc>
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- Aircraft -->
  <g transform="translate(150,58)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#3b4a6b"/>
    <path d="M-20,-12 L-60,-46 L-38,-46 L18,-12 Z" fill="#56678c"/>
    <path d="M58,-10 L80,-34 L88,-34 L78,-8 Z" fill="#56678c"/>
    <rect x="-10" y="14" width="22" height="12" rx="3" fill="#e2627c"/>
  </g>
  <text x="248" y="40" font-size="15" fill="#1d2433">Laser scanner</text>
  <text x="248" y="60" font-size="15" fill="#1d2433">GNSS: where the aircraft is</text>
  <text x="248" y="80" font-size="15" fill="#1d2433">IMU: which way it points</text>

  <!-- Ground line -->
  <path d="M20,452 C120,446 220,458 330,450 C400,445 450,452 520,449" fill="none" stroke="#8a5a2b" stroke-width="4"/>
  <text x="30" y="482" font-size="14" fill="#8a5a2b">Ground</text>

  <!-- Tree -->
  <rect x="146" y="340" width="12" height="112" fill="#7a5230"/>
  <ellipse cx="152" cy="300" rx="70" ry="66" fill="#6cc08b" opacity="0.85"/>
  <path d="M152,360 L118,330 M152,380 L188,350" stroke="#7a5230" stroke-width="5"/>

  <!-- Building -->
  <rect x="360" y="330" width="130" height="120" fill="#c9ced8" stroke="#6b7385" stroke-width="2"/>
  <line x1="360" y1="330" x2="490" y2="330" stroke="#6b7385" stroke-width="4"/>

  <!-- Beams -->
  <line x1="141" y1="84" x2="141" y2="450" stroke="#e2627c" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="141" y1="84" x2="425" y2="330" stroke="#e2627c" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- Returns -->
  <circle cx="141" cy="238" r="8" fill="#2fae5b" stroke="#1d2433" stroke-width="1.5"/>
  <circle cx="141" cy="342" r="8" fill="#f6c343" stroke="#1d2433" stroke-width="1.5"/>
  <circle cx="141" cy="450" r="8" fill="#f48420" stroke="#1d2433" stroke-width="1.5"/>
  <circle cx="425" cy="330" r="8" fill="#50a7e0" stroke="#1d2433" stroke-width="1.5"/>
  <g font-size="14" fill="#1d2433">
    <text x="24" y="226">Return 1 of 3</text>
    <text x="24" y="242" fill="#5b6478">top of canopy</text>
    <text x="24" y="368">Return 2 of 3</text>
    <text x="24" y="384" fill="#5b6478">a branch</text>
    <text x="165" y="430">Return 3 of 3</text>
    <text x="165" y="446" fill="#5b6478">the ground</text>
    <text x="400" y="296">Only return</text>
    <text x="400" y="312" fill="#5b6478">a flat roof</text>
  </g>

  <!-- Formula box -->
  <rect x="300" y="160" width="230" height="80" rx="8" fill="#f3f5fa" stroke="#c4cad8"/>
  <text x="315" y="188" font-size="15" fill="#1d2433">range = c × round-trip time ÷ 2</text>
  <text x="315" y="212" font-size="14" fill="#5b6478">1 ns of round trip ≈ 15 cm</text>
  <text x="315" y="230" font-size="14" fill="#5b6478">a 1,000 m range ≈ 6.7 µs</text>

  <!-- Arrow to record -->
  <path d="M540,300 C575,300 585,250 612,250" fill="none" stroke="#6b7385" stroke-width="2"/>
  <path d="M606,244 L614,250 L606,256" fill="none" stroke="#6b7385" stroke-width="2"/>

  <!-- Point record -->
  <rect x="620" y="110" width="262" height="330" rx="10" fill="#f3f5fa" stroke="#c4cad8"/>
  <text x="636" y="140" font-size="16" font-weight="700" fill="#1d2433">One point record</text>
  <text x="636" y="160" font-size="13" fill="#5b6478">(return 1 of 3, the canopy top)</text>
  <g font-size="14" fill="#1d2433">
    <text x="636" y="194">X (easting)</text><text x="866" y="194" text-anchor="end">412,836.27 m</text>
    <text x="636" y="222">Y (northing)</text><text x="866" y="222" text-anchor="end">5,301,904.55 m</text>
    <text x="636" y="250">Z (elevation)</text><text x="866" y="250" text-anchor="end">71.42 m</text>
    <text x="636" y="278">Intensity</text><text x="866" y="278" text-anchor="end">18,240</text>
    <text x="636" y="306">Return</text><text x="866" y="306" text-anchor="end">1 of 3</text>
    <text x="636" y="334">Classification</text><text x="866" y="334" text-anchor="end">5 (high veg.)</text>
    <text x="636" y="362">Scan angle</text><text x="866" y="362" text-anchor="end">−7°</text>
    <text x="636" y="390">GPS time</text><text x="866" y="390" text-anchor="end">3.1 × 10⁸ s</text>
    <text x="636" y="418" fill="#5b6478">+ RGB, NIR if recorded</text>
  </g>

  <text x="450" y="522" font-size="13" fill="#5b6478" text-anchor="middle">Not to scale. Example values; a survey stores millions of records like this one.</text>
</svg>
