<title id="t">A digital elevation model is a grid of heights</title>
<desc id="d">A 9 by 9 patch of the Mount St. Helens DEM used on this page, one square per 70 m cell, each labelled with its height in metres and tinted from dark (lower) to light (higher). The highest cell, 2,522 m on the crater rim, is outlined in red, and a blue 2,300 m contour line runs between the cells. Notes explain the cell size, the value, why the cell is lower than the 2,549 m summit, the contour line and the colours.</desc>
