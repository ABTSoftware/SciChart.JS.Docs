<path d="M542,64 L549,82 L535,82 Z" fill="#333"/><text x="542" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">N</text>
<text x="40" y="40" font-size="16" font-weight="bold" fill="#1f3a68">Part of a real DEM: Mount St. Helens crater rim (heights in metres)</text>
<text x="570" y="70" font-size="15" font-weight="bold" fill="#222">Cell</text>
<text x="570" y="90" font-size="15" fill="#333">The DEM divides the ground into equal</text>
<text x="570" y="109" font-size="15" fill="#333">squares. Here each is 70 m × 70 m.</text>
<text x="570" y="142" font-size="15" font-weight="bold" fill="#222">Value</text>
<text x="570" y="162" font-size="15" fill="#333">Each cell holds one number: the height</text>
<text x="570" y="181" font-size="15" fill="#333">of the ground there, in metres above</text>
<text x="570" y="200" font-size="15" fill="#333">the vertical datum (sea level, roughly).</text>
<text x="570" y="233" font-size="15" font-weight="bold" fill="#222">Red outline</text>
<text x="570" y="253" font-size="15" fill="#333">The highest cell in this patch, 2,522 m,</text>
<text x="570" y="272" font-size="15" fill="#333">on the crater rim. The real summit is</text>
<text x="570" y="291" font-size="15" fill="#333">2,549 m: a 70 m cell averages the peak</text>
<text x="570" y="310" font-size="15" fill="#333">with the lower ground around it.</text>
<text x="570" y="343" font-size="15" font-weight="bold" fill="#222">Blue line</text>
<text x="570" y="363" font-size="15" fill="#333">The 2,300 m contour. Software threads</text>
<text x="570" y="382" font-size="15" fill="#333">it between cell values, so the line</text>
<text x="570" y="401" font-size="15" fill="#333">separates cells above 2,300 m from</text>
<text x="570" y="420" font-size="15" fill="#333">cells below it.</text>
<text x="570" y="453" font-size="15" font-weight="bold" fill="#222">Colour</text>
<text x="570" y="473" font-size="15" fill="#333">Darker is lower, lighter is higher,</text>
<text x="570" y="492" font-size="15" fill="#333">stretched to the heights in this patch.</text>
</svg>