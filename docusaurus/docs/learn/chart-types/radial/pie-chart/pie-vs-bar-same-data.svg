<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 420"><title id="t">The same four values shown as a pie chart and as a bar chart</title><desc id="d">Survey answers for favourite season: Spring 23%, Summer 26%, Autumn 27%, Winter 24%. In the unlabelled pie chart on the left the four slices look almost the same size and it is hard to tell which is largest. In the bar chart on the right, sorted largest first against a percentage axis, Autumn is clearly the largest and Spring the smallest.</desc><rect width="760" height="420" fill="#fff"/><text x="190" y="40" fill="#14233C" font-size="19" font-weight="700" text-anchor="middle">As a pie chart</text><text x="190" y="62" fill="#4A5568" font-size="14" text-anchor="middle">No labels: which slice is biggest?</text><text x="545" y="40" fill="#14233C" font-size="19" font-weight="700" text-anchor="middle">As a bar chart</text><text x="545" y="62" fill="#4A5568" font-size="14" text-anchor="middle">Sorted bars: the order is obvious</text><path fill="#50C7E0" stroke="#fff" stroke-width="2" d="M190 215V75a140 140 0 0 1 138.9 122.5Z"/><text x="245.6" y="157" fill="#14233C" font-size="16" font-weight="700" text-anchor="middle">Spring</text><path fill="#F48420" stroke="#fff" stroke-width="2" d="m190 215 138.9-17.5a140 140 0 0 1-130.1 157.2Z"/><text x="254.7" y="273.5" fill="#14233C" font-size="16" font-weight="700" text-anchor="middle">Summer</text><path fill="#30BC9A" stroke="#fff" stroke-width="2" d="m190 215 8.8 139.7A140 140 0 0 1 50.3 206.2Z"/><text x="130.6" y="279.4" fill="#14233C" font-size="16" font-weight="700" text-anchor="middle">Autumn</text><path fill="#EC0F6C" stroke="#fff" stroke-width="2" d="m190 215-139.7-8.8A140 140 0 0 1 190 75Z"/><text x="132.5" y="158.8" fill="#14233C" font-size="16" font-weight="700" text-anchor="middle">Winter</text><line x1="470" x2="470" y1="87" y2="349" stroke="#D5DBE3"/><text x="470" y="367" fill="#4A5568" font-size="13" text-anchor="middle">0%</text><line x1="553.3" x2="553.3" y1="87" y2="349" stroke="#D5DBE3"/><text x="553.3" y="367" fill="#4A5568" font-size="13" text-anchor="middle">10%</text><line x1="636.7" x2="636.7" y1="87" y2="349" stroke="#D5DBE3"/><text x="636.7" y="367" fill="#4A5568" font-size="13" text-anchor="middle">20%</text><line x1="720" x2="720" y1="87" y2="349" stroke="#D5DBE3"/><text x="720" y="367" fill="#4A5568" font-size="13" text-anchor="middle">30%</text><rect width="225" height="46" x="470" y="95" fill="#30BC9A"/><text x="462" y="123" fill="#14233C" font-size="15" font-weight="700" text-anchor="end">Autumn</text><rect width="216.7" height="46" x="470" y="161" fill="#F48420"/><text x="462" y="189" fill="#14233C" font-size="15" font-weight="700" text-anchor="end">Summer</text><rect width="200" height="46" x="470" y="227" fill="#EC0F6C"/><text x="462" y="255" fill="#14233C" font-size="15" font-weight="700" text-anchor="end">Winter</text><rect width="191.7" height="46" x="470" y="293" fill="#50C7E0"/><text x="462" y="321" fill="#14233C" font-size="15" font-weight="700" text-anchor="end">Spring</text><text x="380" y="406" fill="#4A5568" font-size="13" text-anchor="middle">Illustrative survey data: favourite season. Spring 23%, Summer 26%, Autumn 27%, Winter 24%</text></svg>