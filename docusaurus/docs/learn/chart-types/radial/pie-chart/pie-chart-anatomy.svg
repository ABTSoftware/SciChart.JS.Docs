<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15" viewBox="0 0 700 430"><title id="title">Anatomy of a pie chart</title><desc id="desc">A pie chart of a household budget split into four slices: Housing 40%, Food 25%, Transport 20% and Other 15%. The slices start at 12 o&apos;clock and run clockwise, largest first. Each slice&apos;s angle is its share of 360 degrees, the slices add up to 100%, and a legend names each slice.</desc><rect width="700" height="430" fill="#fff" rx="12"/><path fill="#2b9fc0" stroke="#fff" stroke-width="3" d="M220 215V65a150 150 0 0 1 88.2 271.4Z"/><path fill="#f48420" stroke="#fff" stroke-width="3" d="m220 215 88.2 121.4a150 150 0 0 1-209.6-33.2Z"/><path fill="#30bc9a" stroke="#fff" stroke-width="3" d="M220 215 98.6 303.2a150 150 0 0 1 0-176.4Z"/><path fill="#8e9bae" stroke="#fff" stroke-width="3" d="M220 215 98.6 126.8A150 150 0 0 1 220 65Z"/><text x="308" y="192" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">40%</text><text x="205" y="313" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">25%</text><text x="127" y="221" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">20%</text><text x="178" y="138" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">15%</text><text x="470" y="40" fill="#333" font-weight="bold">Legend</text><rect width="16" height="16" x="470" y="56" fill="#2b9fc0" rx="3"/><text x="496" y="69" fill="#333">Housing</text><rect width="16" height="16" x="470" y="82" fill="#f48420" rx="3"/><text x="496" y="95" fill="#333">Food</text><rect width="16" height="16" x="470" y="108" fill="#30bc9a" rx="3"/><text x="496" y="121" fill="#333">Transport</text><rect width="16" height="16" x="470" y="134" fill="#8e9bae" rx="3"/><text x="496" y="147" fill="#333">Other</text><path fill="none" stroke="#14233c" stroke-width="2" d="M220 175a40 40 0 0 1 23.5 72.4"/><line x1="220" x2="220" y1="43" y2="61" stroke="#999" stroke-dasharray="4 4"/><text x="220" y="37" fill="#666" font-size="13" text-anchor="middle">starts at 12 o&apos;clock, runs clockwise</text><line x1="330" x2="462" y1="151" y2="185" stroke="#999" stroke-dasharray="4 4"/><line x1="258" x2="462" y1="221" y2="295" stroke="#999" stroke-dasharray="4 4"/><line x1="330" x2="462" y1="190" y2="240" stroke="#999" stroke-dasharray="4 4"/><line x1="169" x2="169" y1="356" y2="383" stroke="#999" stroke-dasharray="4 4"/><line x1="169" x2="462" y1="383" y2="383" stroke="#999" stroke-dasharray="4 4"/><text x="470" y="190" fill="#333" font-weight="bold">Slice</text><text x="470" y="209" fill="#666" font-size="13">one category (Housing)</text><text x="470" y="245" fill="#333" font-weight="bold">Label</text><text x="470" y="264" fill="#666" font-size="13">the slice&apos;s share, as a percentage</text><text x="470" y="300" fill="#333" font-weight="bold">Angle</text><text x="470" y="319" fill="#666" font-size="13">40% of 360° = 144°</text><text x="470" y="388" fill="#333" font-weight="bold">Whole circle</text><text x="470" y="407" fill="#666" font-size="13">all slices add up to 100%</text></svg>