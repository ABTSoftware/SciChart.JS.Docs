<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15" viewBox="0 0 700 430"><title id="title">Anatomy of a donut chart</title><desc id="desc">A donut chart of sales by region split into four segments: Europe 40%, North America 30%, Asia-Pacific 20% and Rest of world 10%. The hole in the middle shows the total, £4.2m. Each segment is read by the length of its arc around the ring, and a legend names each segment.</desc><rect width="700" height="430" fill="#fff" rx="12"/><path fill="#2b9fc0" stroke="#fff" stroke-width="3" d="M220 65a150 150 0 0 1 88.2 271.4l-36.5-50.2A88 88 0 0 0 220 127Z"/><path fill="#f48420" stroke="#fff" stroke-width="3" d="M308.2 336.4a150 150 0 0 1-230.9-75l59-19.2a88 88 0 0 0 135.4 44Z"/><path fill="#30bc9a" stroke="#fff" stroke-width="3" d="M77.3 261.4a150 150 0 0 1 54.5-167.8l36.5 50.2a88 88 0 0 0-32 98.4Z"/><path fill="#8e9bae" stroke="#fff" stroke-width="3" d="M131.8 93.6A150 150 0 0 1 220 65v62a88 88 0 0 0-51.7 16.8Z"/><text x="333" y="184" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">40%</text><text x="183" y="334" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">30%</text><text x="107" y="184" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">20%</text><text x="183" y="108" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">10%</text><text x="470" y="40" fill="#333" font-weight="bold">Legend</text><rect width="16" height="16" x="470" y="56" fill="#2b9fc0" rx="3"/><text x="496" y="69" fill="#333">Europe</text><rect width="16" height="16" x="470" y="82" fill="#f48420" rx="3"/><text x="496" y="95" fill="#333">North America</text><rect width="16" height="16" x="470" y="108" fill="#30bc9a" rx="3"/><text x="496" y="121" fill="#333">Asia-Pacific</text><rect width="16" height="16" x="470" y="134" fill="#8e9bae" rx="3"/><text x="496" y="147" fill="#333">Rest of world</text><text x="220" y="213" fill="#14233c" font-size="30" font-weight="bold" text-anchor="middle">£4.2m</text><text x="220" y="237" fill="#666" font-size="14" text-anchor="middle">total sales</text><path fill="none" stroke="#14233c" stroke-width="3" d="M220 53a162 162 0 0 1 95.2 293.1"/><line x1="335" x2="462" y1="100" y2="185" stroke="#999" stroke-dasharray="4 4"/><line x1="335" x2="462" y1="184" y2="240" stroke="#999" stroke-dasharray="4 4"/><line x1="272" x2="462" y1="221" y2="295" stroke="#999" stroke-dasharray="4 4"/><line x1="265" x2="462" y1="269" y2="350" stroke="#999" stroke-dasharray="4 4"/><text x="470" y="190" fill="#333" font-weight="bold">Arc length</text><text x="470" y="209" fill="#666" font-size="13">read a segment by its length</text><text x="470" y="245" fill="#333" font-weight="bold">Ring</text><text x="470" y="264" fill="#666" font-size="13">the segments: they add up to 100%</text><text x="470" y="300" fill="#333" font-weight="bold">Centre label</text><text x="470" y="319" fill="#666" font-size="13">a total or headline figure</text><text x="470" y="355" fill="#333" font-weight="bold">Hole</text><text x="470" y="374" fill="#666" font-size="13">the empty centre of the ring</text></svg>