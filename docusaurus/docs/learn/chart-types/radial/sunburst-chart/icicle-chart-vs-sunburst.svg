<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 430"><title id="t">A sunburst chart and the icicle chart of the same data</title><desc id="d">On the left, a sunburst chart of the example data: All (100) in the centre, A (50), B (30) and C (20) in the first ring, A1, A2, B1 and B2 in the second ring, and a and b in the third. A dashed line at 12 o&apos;clock marks where the rings are cut. On the right, the same data as an icicle chart: the rings are straightened into rows of rectangles, with All across the top, one row per level below it, each item directly under its parent, and each rectangle&apos;s width in proportion to its value.</desc><rect width="900" height="430" fill="#fff"/><circle cx="170" cy="205" r="40" fill="#1C2A44" stroke="#FFF" stroke-width="2.5"/><text x="170" y="203" fill="#FFF" font-size="15" font-weight="600" text-anchor="middle">All</text><text x="170" y="221" fill="#FFF" font-size="13" text-anchor="middle">100</text><path fill="#F48420" stroke="#FFF" stroke-width="2.5" d="M170 127a78 78 0 0 1 0 156v-38a40 40 0 0 0 0-80Z"/><text x="229" y="210" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">A</text><path fill="#50C7E0" stroke="#FFF" stroke-width="2.5" d="M170 283a78 78 0 0 1-74.2-102.1l36.2 11.7a40 40 0 0 0 38 52.4Z"/><text x="122.3" y="244.7" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">B</text><path fill="#30BC9A" stroke="#FFF" stroke-width="2.5" d="M95.8 180.9A78 78 0 0 1 170 127v38a40 40 0 0 0-38 27.6Z"/><text x="135.3" y="162.3" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">C</text><path fill="#F7A963" stroke="#FFF" stroke-width="2.5" d="M170 89a116 116 0 0 1 110.3 151.8l-36.1-11.7A78 78 0 0 0 170 127Z"/><text x="248.5" y="153" fill="#1E293B" font-size="14" font-weight="600" text-anchor="middle">A1</text><path fill="#F7A963" stroke="