<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">A sunburst chart and the icicle chart of the same data</title>
<desc id="d">On the left, a sunburst chart of the example data: All (100) in the centre, A (50), B (30) and C (20) in the first ring, A1, A2, B1 and B2 in the second ring, and a and b in the third. A dashed line at 12 o'clock marks where the rings are cut. On the right, the same data as an icicle chart: the rings are straightened into rows of rectangles, with All across the top, one row per level below it, each item directly under its parent, and each rectangle's width in proportion to its value.</desc>
