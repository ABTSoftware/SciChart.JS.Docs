<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 600"><title id="t">The parts of a sunburst chart</title><desc id="d">A sunburst chart of a total of 100 split into three groups, A (50), B (30) and C (20). A splits into A1 (30) and A2 (20), A1 into a (18) and b (12), and B into B1 (18) and B2 (12). Callouts mark the centre (the whole), the first ring (top-level groups), a segment&apos;s angle (its share of the total), children sitting outside their parent, a branch that ends early, and colour showing the top-level branch.</desc><rect width="900" height="600" fill="#fff"/><circle cx="450" cy="290" r="50" fill="#1C2A44"/><text x="450" y="286" fill="#FFF" font-size="16" font-weight="600" text-anchor="middle">All</text><text x="450" y="306" fill="#FFF" font-size="14" text-anchor="middle">100</text><path fill="#F48420" stroke="#FFF" stroke-width="2.5" d="M450 182a108 108 0 0 1 0 216v-58a50 50 0 0 0 0-100Z"/><text x="529" y="295" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">A</text><path fill="#F7A963" stroke="#FFF" stroke-width="2.5" d="M450 124a166 166 0 0 1 157.9 217.3l-55.2-17.9A108 108 0 0 0 450 182Z"/><text x="560.8" y="214.5" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">A1</text><path fill="#FBCEA6" stroke="#FFF" stroke-width="2.5" d="M450 76a214 214 0 0 1 193.6 122.9l-43.4 20.4A166 166 0 0 0 450 124Z"/><text x="551.8" y="134.6" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">a</text><path fill="#FBCEA6" stroke="#FFF" stroke-width="2.5" d="M643.6 198.9a214 214 0 0 1 9.9 157.2l-45.6-14.8a166 166 0 0 0-7.7-122Z"/><text x="639.6" y="283.1" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">b</text><path fill="#F7A963" stroke="#FFF" stroke-width="2.5" d="M607.9 341.3A166 166 0 0 1 450 456v-58a108 108 0 0 0 102.7-74.6Z"/><text x="530.5" y="405.8" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">A2</text><path fill="#50C7E0" stroke="#FFF" stroke-width="2.5" d="M450 398a108 108 0 0 1-102.7-141.4l55.1 17.9A50 50 0 0 0 450 340Z"/><text x="386.1" y="341.4" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">B</text><path fill="#84D8E9" stroke="#FFF" stroke-width="2.5" d="M450 456a166 166 0 0 1-150.2-95.3l52.5-24.7a108 108 0 0 0 97.7 62Z"/><text x="376.6" y="410.7" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">B1</text><path fill="#84D8E9" stroke="#FFF" stroke-width="2.5" d="M299.8 360.7a166 166 0 0 1-7.7-122l55.2 17.9a108 108 0 0 0 5 79.4Z"/><text x="313.3" y="303.6" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">B2</text><path fill="#30BC9A" stroke="#FFF" stroke-width="2.5" d="M347.3 256.6A108 108 0 0 1 450 182v58a50 50 0 0 0-47.6 34.5Z"/><text x="403.6" y="231.1" fill="#1E293B" font-size="16" font-weight="600" text-anchor="middle">C</text><line x1="500.4" x2="690" y1="162.6" y2="60" stroke="#64748B" stroke-width="1.5"/><circle cx="500.4" cy="162.6" r="4" fill="#64748B"/><text x="698" y="65" fill="#1E293B" font-size="17" font-weight="600">Children</text><text x="698" y="86" fill="#475569" font-size="15">A1 and A2 sit outside A</text><text x="698" y="107" fill="#475569" font-size="15">and fill its angle</text><line x1="526.2" x2="690" y1="331.9" y2="300" stroke="#64748B" stroke-width="1.5"/><circle cx="526.2" cy="331.9" r="4" fill="#64748B"/><text x="698" y="305" fill="#1E293B" font-size="17" font-weight="600">Angle = share of total</text><text x="698" y="326" fill="#475569" font-size="15">A is 50 of 100, so it</text><text x="698" y="347" fill="#475569" font-size="15">spans half the circle</text><circle cx="450" cy="322" r="4" fill="#64748B"/><line x1="450" x2="450" y1="322" y2="508" stroke="#64748B" stroke-width="1.5"/><text x="460" y="518" fill="#1E293B" font-size="17" font-weight="600">Centre: the whole (100)</text><text x="460" y="539" fill="#475569" font-size="15">Some charts leave it empty</text><path stroke="#64748B" stroke-width="2" d="M355.8 168.6h12m-6-6v12"/><line x1="361.8" x2="210" y1="168.6" y2="60" stroke="#64748B" stroke-width="1.5"/><circle cx="361.8" cy="168.6" r="4" fill="#64748B"/><text x="202" y="65" fill="#1E293B" font-size="17" font-weight="600" text-anchor="end">No ring here</text><text x="202" y="86" fill="#475569" font-size="15" text-anchor="end">C has no children</text><line x1="389.1" x2="210" y1="239.6" y2="200" stroke="#64748B" stroke-width="1.5"/><circle cx="389.1" cy="239.6" r="4" fill="#64748B"/><text x="202" y="205" fill="#1E293B" font-size="17" font-weight="600" text-anchor="end">Ring 1</text><text x="202" y="226" fill="#475569" font-size="15" text-anchor="end">Top-level groups: A, B</text><text x="202" y="247" fill="#475569" font-size="15" text-anchor="end">and C add up to the centre</text><line x1="417.5" x2="210" y1="435.4" y2="420" stroke="#64748B" stroke-width="1.5"/><circle cx="417.5" cy="435.4" r="4" fill="#64748B"/><text x="202" y="425" fill="#1E293B" font-size="17" font-weight="600" text-anchor="end">Colour = branch</text><text x="202" y="446" fill="#475569" font-size="15" text-anchor="end">B, B1 and B2 share one</text><text x="202" y="467" fill="#475569" font-size="15" text-anchor="end">hue, lighter further out</text></svg>