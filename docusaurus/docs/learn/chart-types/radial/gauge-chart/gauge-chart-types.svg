<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 900 300"><title id="t">Types of gauge chart</title><desc id="d">Four gauges showing the same value, 62 out of 100, with bands at 0 to 50, 50 to 80 and 80 to 100: a semicircular gauge with a 180 degree scale, a dial gauge with a 240 degree scale, a full-circle progress ring with no bands, and a horizontal linear gauge with a marker.</desc><rect width="900" height="300" fill="#FFF"/><path fill="#C9D2DE" stroke="#FFF" stroke-width="2" d="M27 165a88 88 0 0 1 88-88v26a62 62 0 0 0-62 62Z"/><path fill="#9DAABB" stroke="#FFF" stroke-width="2" d="M115 77a88 88 0 0 1 71.2 36.3l-21 15.3A62 62 0 0 0 115 103Z"/><path fill="#6E7D92" stroke="#FFF" stroke-width="2" d="M186.2 113.3A88 88 0 0 1 203 165h-26a62 62 0 0 0-11.8-36.4Z"/><path fill="#1F2A3C" d="m109.4 162.8 38.7-81.5-27.5 85.9Z"/><circle cx="115" cy="165" r="8" fill="#1F2A3C"/><text x="115" y="255" fill="#1F2A3C" font-size="16" font-weight="bold" text-anchor="middle">Semicircle</text><text x="115" y="277" fill="#5B6779" font-size="13" text-anchor="middle">180° scale</text><path fill="#C9D2DE" stroke="#FFF" stroke-width="2" d="M258.8 194A88 88 0 0 1 335 62v26a62 62 0 0 0-53.7 93Z"/><path fill="#9DAABB" stroke="#FFF" stroke-width="2" d="M335 62a88 88 0 0 1 83.7 60.8l-24.7 8A62 62 0 0 0 335 88Z"/><path fill="#6E7D92" stroke="#FFF" stroke-width="2" d="M418.7 122.8a88 88 0 0 1-7.5 71.2l-22.5-13a62 62 0 0 0 5.3-50.2Z"/><path fill="#1F2A3C" d="m329.7 147.1 48.7-76-38.1 81.8Z"/><circle cx="335" cy="150" r="8" fill="#1F2A3C"/><text x="335" y="255" fill="#1F2A3C" font-size="16" font-weight="bold" text-anchor="middle">Dial (speedometer)</text><text x="335" y="277" fill="#5B6779" font-size="13" text-anchor="middle">240° scale</text><circle cx="555" cy="135" r="73" fill="none" stroke="#E3E8EF" stroke-width="22"/><path fill="#2F6FDB" d="M555 51a84 84 0 1 1-57.5 145.2l15.1-16A62 62 0 1 0 555 73Z"/><text x="555" y="144" fill="#1F2A3C" font-size="26" font-weight="bold" text-anchor="middle">62%</text><text x="555" y="255" fill="#1F2A3C" font-size="16" font-weight="bold" text-anchor="middle">Progress ring</text><text x="555" y="277" fill="#5B6779" font-size="13" text-anchor="middle">360°, no bands</text><rect width="90" height="34" x="690" y="120" fill="#C9D2DE" stroke="#FFF" stroke-width="2"/><rect width="54" height="34" x="780" y="120" fill="#9DAABB" stroke="#FFF" stroke-width="2"/><rect width="36" height="34" x="834" y="120" fill="#6E7D92" stroke="#FFF" stroke-width="2"/><path fill="#1F2A3C" d="M793.6 104h16l-8 14Z"/><line x1="801.6" x2="801.6" y1="118" y2="154" stroke="#1F2A3C" stroke-width="3"/><text x="690" y="176" fill="#5B6779" font-size="13" text-anchor="middle">0</text><text x="780" y="176" fill="#5B6779" font-size="13" text-anchor="middle">50</text><text x="870" y="176" fill="#5B6779" font-size="13" text-anchor="middle">100</text><text x="780" y="255" fill="#1F2A3C" font-size="16" font-weight="bold" text-anchor="middle">Linear gauge</text><text x="780" y="277" fill="#5B6779" font-size="13" text-anchor="middle">horizontal or vertical</text></svg>