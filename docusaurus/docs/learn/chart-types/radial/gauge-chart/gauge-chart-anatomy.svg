<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 820 460"><title id="t">The parts of a gauge chart</title><desc id="d">A semicircular gauge from 0 to 100 showing an order fulfilment rate of 68 percent. Callouts label the scale with its minimum and maximum, the tick marks, three coloured bands (below target 0 to 60, close 60 to 80, on target 80 to 100), the needle, a target marker at 80, the value readout and the label with its units.</desc><rect width="820" height="460" fill="#FFF"/><path fill="#E8505B" stroke="#FFF" stroke-width="2" d="M165 300a205 205 0 0 1 268.3-195l-10.8 33.3A170 170 0 0 0 200 300Z"/><path fill="#F5B83D" stroke="#FFF" stroke-width="2" d="M433.3 105a205 205 0 0 1 102.5 74.5l-28.3 20.6a170 170 0 0 0-85-61.8Z"/><path fill="#3CBF7E" stroke="#FFF" stroke-width="2" d="M535.8 179.5A205 205 0 0 1 575 300h-35a170 170 0 0 0-32.5-99.9Z"/><line x1="161" x2="151" y1="300" y2="300" stroke="#1F2A3C" stroke-width="2"/><text x="135" y="305" fill="#5B6779" font-size="14" text-anchor="middle">0</text><line x1="171.2" x2="166.5" y1="235.4" y2="233.9" stroke="#1F2A3C"/><line x1="200.9" x2="192.8" y1="177.2" y2="171.3" stroke="#1F2A3C" stroke-width="2"/><text x="179.9" y="166.9" fill="#5B6779" font-size="14" text-anchor="middle">20</text><line x1="247.2" x2="244.2" y1="130.9" y2="126.9" stroke="#1F2A3C"/><line x1="305.4" x2="302.3" y1="101.2" y2="91.7" stroke="#1F2A3C" stroke-width="2"/><text x="297.4" y="81.5" fill="#5B6779" font-size="14" text-anchor="middle">40</text><line x1="370" x2="370" y1="91" y2="86" stroke="#1F2A3C"/><line x1="434.6" x2="437.7" y1="101.2" y2="91.7" stroke="#1F2A3C" stroke-width="2"/><text x="442.6" y="81.5" fill="#5B6779" font-size="14" text-anchor="middle">60</text><line x1="492.8" x2="495.8" y1="130.9" y2="126.9" stroke="#1F2A3C"/><line x1="539.1" x2="547.2" y1="177.2" y2="171.3" stroke="#1F2A3C" stroke-width="2"/><text x="560.1" y="166.9" fill="#5B6779" font-size="14" text-anchor="middle">80</text><line x1="568.8" x2="573.5" y1="235.4" y2="233.9" stroke="#1F2A3C"/><line x1="579" x2="589" y1="300" y2="300" stroke="#1F2A3C" stroke-width="2"/><text x="605" y="305" fill="#5B6779" font-size="14" text-anchor="middle">100</text><line x1="501.1" x2="542.3" y1="204.8" y2="174.8" stroke="#1F2A3C" stroke-width="4"/><path fill="#1F2A3C" d="m362.4 295.2 91.2-126.9-76 136.5Z"/><circle cx="370" cy="300" r="13" fill="#1F2A3C"/><text x="370" y="350" fill="#1F2A3C" font-size="34" font-weight="bold" text-anchor="middle">68%</text><text x="370" y="376" fill="#5B6779" font-size="15" text-anchor="middle">Orders shipped on time</text><line x1="188.4" x2="178" y1="253.4" y2="205" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="188.4" cy="253.4" r="3.5" fill="#2F6FDB"/><text x="172" y="210" fill="#2F6FDB" font-size="15" font-weight="bold" text-anchor="end">Bands</text><text x="172" y="229" fill="#5B6779" font-size="13" text-anchor="end">what each range means</text><line x1="302.3" x2="200" y1="91.7" y2="40" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="302.3" cy="91.7" r="3.5" fill="#2F6FDB"/><text x="194" y="45" fill="#2F6FDB" font-size="15" font-weight="bold" text-anchor="end">Scale and ticks</text><line x1="542.3" x2="650" y1="174.8" y2="95" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="542.3" cy="174.8" r="3.5" fill="#2F6FDB"/><text x="656" y="100" fill="#2F6FDB" font-size="15" font-weight="bold">Target marker</text><text x="656" y="119" fill="#5B6779" font-size="13">the goal: 80%</text><line x1="407.5" x2="650" y1="240.9" y2="215" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="407.5" cy="240.9" r="3.5" fill="#2F6FDB"/><text x="656" y="220" fill="#2F6FDB" font-size="15" font-weight="bold">Needle</text><text x="656" y="239" fill="#5B6779" font-size="13">points to the value</text><text x="113" y="305" fill="#2F6FDB" font-size="15" font-weight="bold" text-anchor="end">Minimum</text><text x="627" y="305" fill="#2F6FDB" font-size="15" font-weight="bold">Maximum</text><line x1="418" x2="650" y1="340" y2="345" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="418" cy="340" r="3.5" fill="#2F6FDB"/><text x="656" y="350" fill="#2F6FDB" font-size="15" font-weight="bold">Value readout</text><text x="656" y="369" fill="#5B6779" font-size="13">the exact number</text><line x1="465" x2="650" y1="372" y2="405" stroke="#2F6FDB" stroke-width="1.5"/><circle cx="465" cy="372" r="3.5" fill="#2F6FDB"/><text x="656" y="410" fill="#2F6FDB" font-size="15" font-weight="bold">Label and units</text><text x="656" y="429" fill="#5B6779" font-size="13">what is measured</text></svg>