<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">The parts of a waterfall chart</title>
<desc id="d">A month of household money as a waterfall chart. A grey starting bar of 1,200 dollars, a green floating bar for salary (+2,400), red floating bars for rent (-950) and bills (-310), a grey subtotal bar after fixed costs (2,340), red bars for groceries (-420) and a car repair (-380), a green bar for freelance work (+300), and a grey end-of-month total of 1,840 dollars. Dashed connector lines join the top of each bar to the start of the next. Numbered markers, explained in a key below, point out the starting value, an increase, a decrease, a connector line, the subtotal and the end total.</desc>
<rect width="900" height="670" fill="#ffffff"/>
<line x1="120" y1="450.0" x2="870" y2="450.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="110" y="455.0" text-anchor="end" font-size="15" fill="#475569">$0</text>
<line x1="120" y1="347.5" x2="870" y2="347.5" stroke="#E2E8F0" stroke-width="1"/>
<text x="110" y="352.5" text-anchor="end" font-size="15" fill="#475569">$1,000</text>
<line x1="120" y1="245.0" x2="870" y2="245.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="110" y="250.0" text-anchor="end" font-size="15" fill="#475569">$2,000</text>
<line x1="120" y1="142.5" x2="870" y2="142.5" stroke="#E2E8F0" stroke-width="1"/>
<text x="110" y="147.5" text-anchor="end" font-size="15" fill="#475569">$3,000</text>
<line x1="120" y1="40.0" x2="870" y2="40.0" stroke="#E2E8F0" stroke-width="1"/>
<text x="110" y="45.0" text-anchor="end" font-size="15" fill="#475569">$4,000</text>
<line x1="120" y1="450" x2="870" y2="450" stroke="#334155" stroke-width="1.5"/>
<text x="34" y="245" transform="rotate(-90 34 245)" text-anchor="middle" font-size="16" fill="#334155">Running total</text>
<rect x="135.8" y="327.0" width="51.7" height="123.0" fill="#64748B" rx="2"/>
<text x="161.7" y="319.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">$1,200</text>
<text x="161.7" y="474" text-anchor="middle" font-size="15" fill="#334155">Start of</text>
<text x="161.7" y="492" text-anchor="middle" font-size="15" fill="#334155">month</text>
<line x1="187.5" y1="327.0" x2="219.2" y2="327.0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="219.2" y="81.0" width="51.7" height="246.0" fill="#1E9E8F" rx="2"/>
<text x="245.0" y="73.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1E9E8F">+$2,400</text>
<text x="245.0" y="474" text-anchor="middle" font-size="15" fill="#334155">Salary</text>
<line x1="270.8" y1="81.0" x2="302.5" y2="81.0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="302.5" y="81.0" width="51.7" height="97.4" fill="#E5484D" rx="2"/>
<text x="328.3" y="73.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">−$950</text>
<text x="328.3" y="474" text-anchor="middle" font-size="15" fill="#334155">Rent</text>
<line x1="354.2" y1="178.4" x2="385.8" y2="178.4" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="385.8" y="178.4" width="51.7" height="31.8" fill="#E5484D" rx="2"/>
<text x="411.7" y="170.4" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">−$310</text>
<text x="411.7" y="474" text-anchor="middle" font-size="15" fill="#334155">Bills</text>
<line x1="437.5" y1="210.2" x2="469.2" y2="210.2" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="469.2" y="210.2" width="51.7" height="239.8" fill="#64748B" rx="2"/>
<text x="495.0" y="202.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">$2,340</text>
<text x="495.0" y="474" text-anchor="middle" font-size="15" fill="#334155">After fixed</text>
<text x="495.0" y="492" text-anchor="middle" font-size="15" fill="#334155">costs</text>
<line x1="520.8" y1="210.2" x2="552.5" y2="210.2" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="552.5" y="210.2" width="51.7" height="43.1" fill="#E5484D" rx="2"/>
<text x="578.3" y="202.2" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">−$420</text>
<text x="578.3" y="474" text-anchor="middle" font-size="15" fill="#334155">Groceries</text>
<line x1="604.2" y1="253.2" x2="635.8" y2="253.2" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="635.8" y="222.4" width="51.7" height="30.8" fill="#1E9E8F" rx="2"/>
<text x="661.7" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#1E9E8F">+$300</text>
<text x="661.7" y="474" text-anchor="middle" font-size="15" fill="#334155">Freelance</text>
<text x="661.7" y="492" text-anchor="middle" font-size="15" fill="#334155">work</text>
<line x1="687.5" y1="222.4" x2="719.2" y2="222.4" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="719.2" y="222.4" width="51.7" height="38.9" fill="#E5484D" rx="2"/>
<text x="745.0" y="214.4" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">−$380</text>
<text x="745.0" y="474" text-anchor="middle" font-size="15" fill="#334155">Car</text>
<text x="745.0" y="492" text-anchor="middle" font-size="15" fill="#334155">repair</text>
<line x1="770.8" y1="261.4" x2="802.5" y2="261.4" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="802.5" y="261.4" width="51.7" height="188.6" fill="#64748B" rx="2"/>
<text x="828.3" y="253.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">$1,840</text>
<text x="828.3" y="474" text-anchor="middle" font-size="15" fill="#334155">End of</text>
<text x="828.3" y="492" text-anchor="middle" font-size="15" fill="#334155">month</text>
<circle cx="161.7" cy="388.5" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="161.7" y="393.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">1</text>
<circle cx="245.0" cy="204.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="245.0" y="209.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">2</text>
<circle cx="328.3" cy="129.7" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="328.3" y="134.7" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">3</text>
<circle cx="453.3" cy="232.2" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="453.3" y="237.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">4</text>
<circle cx="495.0" cy="330.1" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="495.0" y="335.1" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">5</text>
<circle cx="828.3" cy="355.7" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="828.3" y="360.7" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">6</text>
<circle cx="92.0" cy="533.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="92.0" y="538.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">1</text>
<text x="112" y="538" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">Starting value:</tspan> a full bar from zero</text>
<circle cx="492.0" cy="533.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="492.0" y="538.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">2</text>
<text x="512" y="538" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">Increase:</tspan> floats up from the last total</text>
<circle cx="92.0" cy="567.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="92.0" y="572.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">3</text>
<text x="112" y="572" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">Decrease:</tspan> floats down from the last total</text>
<circle cx="492.0" cy="567.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="492.0" y="572.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">4</text>
<text x="512" y="572" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">Connector:</tspan> carries the total to the next bar</text>
<circle cx="92.0" cy="601.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="92.0" y="606.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">5</text>
<text x="112" y="606" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">Subtotal:</tspan> the running total so far, from zero</text>
<circle cx="492.0" cy="601.0" r="13" fill="#ffffff" stroke="#0F172A" stroke-width="2"/>
<text x="492.0" y="606.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">6</text>
<text x="512" y="606" font-size="15" fill="#334155"><tspan font-weight="700" fill="#0F172A">End total:</tspan> where the running total ends up</text>
</svg>
