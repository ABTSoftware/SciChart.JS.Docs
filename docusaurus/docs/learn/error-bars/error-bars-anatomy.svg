<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How to read an error bar, and how to measure the overlap between two</title>
  <desc>Left: one error bar around a group mean of 12.03 cm, with a marker at the mean, upper and lower arms, caps at each end, and the bar running from 10.89 to 13.17 cm, a 95% confidence interval for 10 plants. Right: the 95% confidence intervals of two groups, Low dose (12.38 to 14.18 cm) and Medium dose (13.87 to 15.95 cm), overlapping by 0.31 cm, about a third of an average arm of 0.97 cm.</desc>
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- Panel titles -->
  <text x="200" y="34" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Reading one error bar</text>
  <text x="600" y="34" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Comparing two error bars</text>
  <line x1="400" y1="20" x2="400" y2="420" stroke="#e5e7eb" stroke-width="2"/>

  <!-- LEFT PANEL: scale y = 380 - (v - 10) * 60 -->
  <line x1="50" y1="80" x2="50" y2="386" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="14" fill="#6b7280" text-anchor="end">
    <text x="42" y="385">10</text>
    <text x="42" y="325">11</text>
    <text x="42" y="265">12</text>
    <text x="42" y="205">13</text>
    <text x="42" y="145">14</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="46" y1="380" x2="54" y2="380"/>
    <line x1="46" y1="320" x2="54" y2="320"/>
    <line x1="46" y1="260" x2="54" y2="260"/>
    <line x1="46" y1="200" x2="54" y2="200"/>
    <line x1="46" y1="140" x2="54" y2="140"/>
  </g>
  <text x="14" y="240" font-size="14" fill="#6b7280" text-anchor="middle" transform="rotate(-90 14 240)">Height (cm)</text>

  <!-- the error bar -->
  <line x1="170" y1="189.8" x2="170" y2="326.6" stroke="#be185d" stroke-width="4"/>
  <line x1="148" y1="189.8" x2="192" y2="189.8" stroke="#be185d" stroke-width="4"/>
  <line x1="148" y1="326.6" x2="192" y2="326.6" stroke="#be185d" stroke-width="4"/>
  <circle cx="170" cy="258.2" r="9" fill="#be185d" stroke="#ffffff" stroke-width="2"/>

  <!-- labels -->
  <g font-size="15" fill="#1f2937">
    <line x1="196" y1="189.8" x2="236" y2="189.8" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="242" y="186"><tspan font-weight="700">Cap</tspan> (top)</text>
    <text x="242" y="204" fill="#6b7280">13.17 cm</text>

    <line x1="182" y1="258.2" x2="236" y2="258.2" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="242" y="254"><tspan font-weight="700">Marker</tspan>: the mean</text>
    <text x="242" y="272" fill="#6b7280">12.03 cm</text>

    <line x1="196" y1="326.6" x2="236" y2="326.6" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="242" y="323"><tspan font-weight="700">Cap</tspan> (bottom)</text>
    <text x="242" y="341" fill="#6b7280">10.89 cm</text>
  </g>
  <!-- arm brackets -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <path d="M138 192 h-6 v63 h6"/>
    <path d="M138 261 h-6 v63 h6"/>
  </g>
  <g font-size="14" fill="#374151" text-anchor="end">
    <text x="126" y="222">upper</text>
    <text x="126" y="238">arm</text>
    <text x="126" y="291">lower</text>
    <text x="126" y="307">arm</text>
  </g>
  <text x="40" y="410" font-size="14" fill="#374151">Each arm: 1.14 cm. Here: a 95% CI, n = 10.</text>
  <text x="40" y="428" font-size="14" fill="#374151">Captions must say which: SD, SE or CI, and n.</text>

  <!-- RIGHT PANEL: scale y = 380 - (v - 12) * 70 -->
  <line x1="470" y1="80" x2="470" y2="386" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="14" fill="#6b7280" text-anchor="end">
    <text x="462" y="385">12</text>
    <text x="462" y="315">13</text>
    <text x="462" y="245">14</text>
    <text x="462" y="175">15</text>
    <text x="462" y="105">16</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="466" y1="380" x2="474" y2="380"/>
    <line x1="466" y1="310" x2="474" y2="310"/>
    <line x1="466" y1="240" x2="474" y2="240"/>
    <line x1="466" y1="170" x2="474" y2="170"/>
    <line x1="466" y1="100" x2="474" y2="100"/>
  </g>

  <!-- overlap band -->
  <rect x="476" y="227.4" width="250" height="21.7" fill="#fde68a" opacity="0.8"/>

  <!-- Low dose: 12.38 - 14.18, mean 13.28 -->
  <line x1="540" y1="227.4" x2="540" y2="353.4" stroke="#0e7490" stroke-width="4"/>
  <line x1="522" y1="227.4" x2="558" y2="227.4" stroke="#0e7490" stroke-width="4"/>
  <line x1="522" y1="353.4" x2="558" y2="353.4" stroke="#0e7490" stroke-width="4"/>
  <circle cx="540" cy="290.4" r="9" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
  <text x="540" y="380" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Low dose</text>

  <!-- Medium dose: 13.87 - 15.95, mean 14.91 -->
  <line x1="640" y1="103.5" x2="640" y2="249.1" stroke="#0e7490" stroke-width="4"/>
  <line x1="622" y1="103.5" x2="658" y2="103.5" stroke="#0e7490" stroke-width="4"/>
  <line x1="622" y1="249.1" x2="658" y2="249.1" stroke="#0e7490" stroke-width="4"/>
  <circle cx="640" cy="176.3" r="9" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
  <text x="640" y="88" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Medium dose</text>

  <g font-size="14" fill="#1f2937">
    <text x="732" y="236" font-weight="700">overlap</text>
    <text x="732" y="252">0.31 cm</text>
  </g>
  <text x="470" y="410" font-size="14" fill="#374151">95% CIs overlap by about a third of an arm,</text>
  <text x="470" y="428" font-size="14" fill="#374151">yet a t-test gives P = 0.015: a real difference.</text>
</svg>
