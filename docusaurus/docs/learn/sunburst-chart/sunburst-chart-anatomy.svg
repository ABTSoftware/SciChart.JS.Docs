<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">The parts of a sunburst chart</title>
<desc id="d">A sunburst chart of a total of 100 split into three groups, A (50), B (30) and C (20). A splits into A1 (30) and A2 (20), A1 into a (18) and b (12), and B into B1 (18) and B2 (12). Callouts mark the centre (the whole), the first ring (top-level groups), a segment's angle (its share of the total), children sitting outside their parent, a branch that ends early, and colour showing the top-level branch.</desc>
<rect width="900" height="600" fill="#ffffff"/>
<circle cx="450" cy="290" r="50" fill="#1C2A44"/>
<text x="450" y="286" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">All</text>
<text x="450" y="306" text-anchor="middle" font-size="14" fill="#FFFFFF">100</text>
<path d="M450.0,182.0 A108,108 0 0 1 450.0,398.0 L450.0,340.0 A50,50 0 0 0 450.0,240.0 Z" fill="#F48420" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="529.0" y="295.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">A</text>
<path d="M450.0,124.0 A166,166 0 0 1 607.9,341.3 L552.7,323.4 A108,108 0 0 0 450.0,182.0 Z" fill="#F7A963" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="560.8" y="214.5" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">A1</text>
<path d="M450.0,76.0 A214,214 0 0 1 643.6,198.9 L600.2,219.3 A166,166 0 0 0 450.0,124.0 Z" fill="#FBCEA6" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="551.8" y="134.6" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">a</text>
<path d="M643.6,198.9 A214,214 0 0 1 653.5,356.1 L607.9,341.3 A166,166 0 0 0 600.2,219.3 Z" fill="#FBCEA6" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="639.6" y="283.1" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">b</text>
<path d="M607.9,341.3 A166,166 0 0 1 450.0,456.0 L450.0,398.0 A108,108 0 0 0 552.7,323.4 Z" fill="#F7A963" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="530.5" y="405.8" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">A2</text>
<path d="M450.0,398.0 A108,108 0 0 1 347.3,256.6 L402.4,274.5 A50,50 0 0 0 450.0,340.0 Z" fill="#50C7E0" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="386.1" y="341.4" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">B</text>
<path d="M450.0,456.0 A166,166 0 0 1 299.8,360.7 L352.3,336.0 A108,108 0 0 0 450.0,398.0 Z" fill="#84D8E9" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="376.6" y="410.7" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">B1</text>
<path d="M299.8,360.7 A166,166 0 0 1 292.1,238.7 L347.3,256.6 A108,108 0 0 0 352.3,336.0 Z" fill="#84D8E9" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="313.3" y="303.6" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">B2</text>
<path d="M347.3,256.6 A108,108 0 0 1 450.0,182.0 L450.0,240.0 A50,50 0 0 0 402.4,274.5 Z" fill="#30BC9A" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="403.6" y="231.1" text-anchor="middle" font-size="16" font-weight="600" fill="#1E293B">C</text>
<line x1="500.4" y1="162.6" x2="690.0" y2="60.0" stroke="#64748B" stroke-width="1.5"/>
<circle cx="500.4" cy="162.6" r="4" fill="#64748B"/>
<text x="698.0" y="65.0" text-anchor="start" font-size="17" font-weight="600" fill="#1E293B">Children</text>
<text x="698.0" y="86.0" text-anchor="start" font-size="15" fill="#475569">A1 and A2 sit outside A</text>
<text x="698.0" y="107.0" text-anchor="start" font-size="15" fill="#475569">and fill its angle</text>
<line x1="526.2" y1="331.9" x2="690.0" y2="300.0" stroke="#64748B" stroke-width="1.5"/>
<circle cx="526.2" cy="331.9" r="4" fill="#64748B"/>
<text x="698.0" y="305.0" text-anchor="start" font-size="17" font-weight="600" fill="#1E293B">Angle = share of total</text>
<text x="698.0" y="326.0" text-anchor="start" font-size="15" fill="#475569">A is 50 of 100, so it</text>
<text x="698.0" y="347.0" text-anchor="start" font-size="15" fill="#475569">spans half the circle</text>
<circle cx="450" cy="322" r="4" fill="#64748B"/><line x1="450" y1="322" x2="450" y2="508" stroke="#64748B" stroke-width="1.5"/>
<text x="460" y="518" font-size="17" font-weight="600" fill="#1E293B">Centre: the whole (100)</text>
<text x="460" y="539" font-size="15" fill="#475569">Some charts leave it empty</text>
<path d="M355.8,168.6 h12 M361.8,162.6 v12" stroke="#64748B" stroke-width="2"/>
<line x1="361.8" y1="168.6" x2="210.0" y2="60.0" stroke="#64748B" stroke-width="1.5"/>
<circle cx="361.8" cy="168.6" r="4" fill="#64748B"/>
<text x="202.0" y="65.0" text-anchor="end" font-size="17" font-weight="600" fill="#1E293B">No ring here</text>
<text x="202.0" y="86.0" text-anchor="end" font-size="15" fill="#475569">C has no children</text>
<line x1="389.1" y1="239.6" x2="210.0" y2="200.0" stroke="#64748B" stroke-width="1.5"/>
<circle cx="389.1" cy="239.6" r="4" fill="#64748B"/>
<text x="202.0" y="205.0" text-anchor="end" font-size="17" font-weight="600" fill="#1E293B">Ring 1</text>
<text x="202.0" y="226.0" text-anchor="end" font-size="15" fill="#475569">Top-level groups: A, B</text>
<text x="202.0" y="247.0" text-anchor="end" font-size="15" fill="#475569">and C add up to the centre</text>
<line x1="417.5" y1="435.4" x2="210.0" y2="420.0" stroke="#64748B" stroke-width="1.5"/>
<circle cx="417.5" cy="435.4" r="4" fill="#64748B"/>
<text x="202.0" y="425.0" text-anchor="end" font-size="17" font-weight="600" fill="#1E293B">Colour = branch</text>
<text x="202.0" y="446.0" text-anchor="end" font-size="15" fill="#475569">B, B1 and B2 share one</text>
<text x="202.0" y="467.0" text-anchor="end" font-size="15" fill="#475569">hue, lighter further out</text>
</svg>
