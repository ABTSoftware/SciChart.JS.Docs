<title id="t">The parts of a gauge chart</title>
<desc id="d">A semicircular gauge from 0 to 100 showing an order fulfilment rate of 68 percent. Callouts label the scale with its minimum and maximum, the tick marks, three coloured bands (below target 0 to 60, close 60 to 80, on target 80 to 100), the needle, a target marker at 80, the value readout and the label with its units.</desc>
