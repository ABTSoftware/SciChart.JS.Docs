<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The same three patterns in a scatter plot and in parallel coordinates</title>
  <desc id="d">Three panels, each showing five records of two variables, A and B, first as a scatter plot and then as two parallel axes. When A and B rise together, the dots climb to the right and the lines run parallel. When one rises as the other falls, the dots fall to the right and the lines all cross near one point between the axes. When there is no relationship, the dots are scattered and the lines cross at random. Each record has the same colour in both views.</desc>
  <rect width="780" height="470" fill="#FFFFFF"/>
  <g>
    <text x="140" y="30" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Positive relationship</text>
    <text x="50" y="58" font-size="12" fill="#6B7280">Scatter plot</text>
    <rect x="50" y="66" width="180" height="124" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="140" y="208" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="40" y="132" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <circle cx="77.6" cy="167.2" r="6" fill="#2B8CC4"/>
    <circle cx="108.8" cy="147.0" r="6" fill="#E07B00"/>
    <circle cx="140.0" cy="125.8" r="6" fill="#C8285A"/>
    <circle cx="171.2" cy="105.6" r="6" fill="#2E9E6A"/>
    <circle cx="202.4" cy="87.7" r="6" fill="#7A4FC2"/>
    <text x="50" y="240" font-size="12" fill="#6B7280">Parallel coordinates</text>
    <line x1="80" y1="252" x2="80" y2="380" stroke="#374151" stroke-width="2"/>
    <line x1="200" y1="252" x2="200" y2="380" stroke="#374151" stroke-width="2"/>
    <text x="80" y="400" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="200" y="400" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <line x1="80" y1="362.4" x2="200" y2="356.6" stroke="#2B8CC4" stroke-width="3"/>
    <line x1="80" y1="339.2" x2="200" y2="335.7" stroke="#E07B00" stroke-width="3"/>
    <line x1="80" y1="316.0" x2="200" y2="313.7" stroke="#C8285A" stroke-width="3"/>
    <line x1="80" y1="292.8" x2="200" y2="292.8" stroke="#2E9E6A" stroke-width="3"/>
    <line x1="80" y1="269.6" x2="200" y2="274.2" stroke="#7A4FC2" stroke-width="3"/>
    <text x="140" y="436" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">Lines run parallel</text>
  </g>
  <g>
    <text x="390" y="30" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Negative relationship</text>
    <text x="300" y="58" font-size="12" fill="#6B7280">Scatter plot</text>
    <rect x="300" y="66" width="180" height="124" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="390" y="208" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="290" y="132" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <circle cx="327.6" cy="85.4" r="6" fill="#2B8CC4"/>
    <circle cx="358.8" cy="105.6" r="6" fill="#E07B00"/>
    <circle cx="390.0" cy="128.0" r="6" fill="#C8285A"/>
    <circle cx="421.2" cy="150.4" r="6" fill="#2E9E6A"/>
    <circle cx="452.4" cy="170.6" r="6" fill="#7A4FC2"/>
    <text x="300" y="240" font-size="12" fill="#6B7280">Parallel coordinates</text>
    <line x1="330" y1="252" x2="330" y2="380" stroke="#374151" stroke-width="2"/>
    <line x1="450" y1="252" x2="450" y2="380" stroke="#374151" stroke-width="2"/>
    <text x="330" y="400" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="450" y="400" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <line x1="330" y1="362.4" x2="450" y2="271.9" stroke="#2B8CC4" stroke-width="3"/>
    <line x1="330" y1="339.2" x2="450" y2="292.8" stroke="#E07B00" stroke-width="3"/>
    <line x1="330" y1="316.0" x2="450" y2="316.0" stroke="#C8285A" stroke-width="3"/>
    <line x1="330" y1="292.8" x2="450" y2="339.2" stroke="#2E9E6A" stroke-width="3"/>
    <line x1="330" y1="269.6" x2="450" y2="360.1" stroke="#7A4FC2" stroke-width="3"/>
    <text x="390" y="436" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">Lines cross at one point</text>
  </g>
  <g>
    <text x="640" y="30" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">No relationship</text>
    <text x="550" y="58" font-size="12" fill="#6B7280">Scatter plot</text>
    <rect x="550" y="66" width="180" height="124" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="640" y="208" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="540" y="132" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <circle cx="577.6" cy="116.8" r="6" fill="#2B8CC4"/>
    <circle cx="608.8" cy="167.2" r="6" fill="#E07B00"/>
    <circle cx="640.0" cy="83.2" r="6" fill="#C8285A"/>
    <circle cx="671.2" cy="139.2" r="6" fill="#2E9E6A"/>
    <circle cx="702.4" cy="105.6" r="6" fill="#7A4FC2"/>
    <text x="550" y="240" font-size="12" fill="#6B7280">Parallel coordinates</text>
    <line x1="580" y1="252" x2="580" y2="380" stroke="#374151" stroke-width="2"/>
    <line x1="700" y1="252" x2="700" y2="380" stroke="#374151" stroke-width="2"/>
    <text x="580" y="400" font-size="12" fill="#4B5563" text-anchor="middle">A</text>
    <text x="700" y="400" font-size="12" fill="#4B5563" text-anchor="middle">B</text>
    <line x1="580" y1="362.4" x2="700" y2="304.4" stroke="#2B8CC4" stroke-width="3"/>
    <line x1="580" y1="339.2" x2="700" y2="356.6" stroke="#E07B00" stroke-width="3"/>
    <line x1="580" y1="316.0" x2="700" y2="269.6" stroke="#C8285A" stroke-width="3"/>
    <line x1="580" y1="292.8" x2="700" y2="327.6" stroke="#2E9E6A" stroke-width="3"/>
    <line x1="580" y1="269.6" x2="700" y2="292.8" stroke="#7A4FC2" stroke-width="3"/>
    <text x="640" y="436" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">Lines cross at random</text>
  </g>
</svg>
