<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title id="title">Anatomy of a radar chart</title>
  <desc id="desc">A radar chart with five axes (Speed, Comfort, Safety, Range and Value) radiating from a centre point at zero. Pentagon-shaped scale rings mark the values 2, 4, 6, 8 and 10 on every axis. One item's scores are plotted on each axis and joined into a filled polygon.</desc>
  <rect width="700" height="380" rx="12" fill="#ffffff"/>
  <!-- Scale rings at 2, 4, 6, 8 and 10 -->
  <g fill="none" stroke="#c8c8d0" stroke-width="1">
    <polygon points="330.0,175.0 358.5,195.7 347.6,229.3 312.4,229.3 301.5,195.7"/>
    <polygon points="330.0,145.0 387.1,186.5 365.3,253.5 294.7,253.5 272.9,186.5"/>
    <polygon points="330.0,115.0 415.6,177.2 382.9,277.8 277.1,277.8 244.4,177.2"/>
    <polygon points="330.0,85.0 444.1,167.9 400.5,302.1 259.5,302.1 215.9,167.9"/>
    <polygon points="330.0,55.0 472.7,158.6 418.2,326.4 241.8,326.4 187.3,158.6"/>
  </g>
  <!-- Axes (spokes) -->
  <g stroke="#9a9aa6" stroke-width="1.5">
    <line x1="330" y1="205" x2="330.0" y2="55.0"/>
    <line x1="330" y1="205" x2="472.7" y2="158.6"/>
    <line x1="330" y1="205" x2="418.2" y2="326.4"/>
    <line x1="330" y1="205" x2="241.8" y2="326.4"/>
    <line x1="330" y1="205" x2="187.3" y2="158.6"/>
  </g>
  <!-- Scale labels on the first axis -->
  <g fill="#888" font-size="11">
    <text x="335" y="202.0">0</text>
    <text x="335" y="172.0">2</text>
    <text x="335" y="142.0">4</text>
    <text x="335" y="112.0">6</text>
    <text x="335" y="82.0">8</text>
    <text x="335" y="52.0">10</text>
  </g>
  <!-- One item's scores, joined into a filled polygon -->
  <polygon points="330.0,85.0 415.6,177.2 409.4,314.2 294.7,253.5 230.1,172.6" fill="#50c7e0" fill-opacity="0.35" stroke="#1c8fb0" stroke-width="3"/>
  <g fill="#1c8fb0">
    <circle cx="330.0" cy="85.0" r="4.5"/>
    <circle cx="415.6" cy="177.2" r="4.5"/>
    <circle cx="409.4" cy="314.2" r="4.5"/>
    <circle cx="294.7" cy="253.5" r="4.5"/>
    <circle cx="230.1" cy="172.6" r="4.5"/>
  </g>
  <!-- Variable names at the end of each axis -->
  <g fill="#333" font-weight="bold">
    <text x="330.0" y="40.0" text-anchor="middle">Speed</text>
    <text x="482.7" y="163.6" text-anchor="start">Comfort</text>
    <text x="426.2" y="347.4" text-anchor="start">Safety</text>
    <text x="233.8" y="347.4" text-anchor="end">Range</text>
    <text x="177.3" y="163.6" text-anchor="end">Value</text>
  </g>
  <!-- Annotations -->
  <g stroke="#999" stroke-dasharray="4 4" fill="none">
    <line x1="519" y1="65" x2="330.0" y2="85.0"/>
    <line x1="519" y1="205" x2="461.2" y2="162.4"/>
    <line x1="519" y1="325" x2="360.0" y2="245.0"/>
    <line x1="108" y1="295" x2="260.8" y2="227.5"/>
    <line x1="80" y1="220" x2="330.0" y2="205.0"/>
  </g>
  <text x="525" y="65" fill="#333" font-weight="bold">Data point</text>
  <text x="525" y="83" fill="#666" font-size="13">Speed scores 8 out of 10</text>
  <text x="525" y="205" fill="#333" font-weight="bold">Axis (spoke)</text>
  <text x="525" y="223" fill="#666" font-size="13">one per variable</text>
  <text x="525" y="325" fill="#333" font-weight="bold">Filled polygon</text>
  <text x="525" y="343" fill="#666" font-size="13">one item's profile</text>
  <text x="20" y="295" fill="#333" font-weight="bold">Scale ring</text>
  <text x="20" y="313" fill="#666" font-size="13">the same value on every axis</text>
  <text x="20" y="220" fill="#333" font-weight="bold">Centre</text>
  <text x="20" y="238" fill="#666" font-size="13">the lowest value, here 0</text>
</svg>
