<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How to read a logarithmic axis</title>
<desc id="d">A base-10 logarithmic axis from 1 to 1,000. The major ticks 1, 10, 100 and 1,000 are equally spaced, and each gap is one decade, a factor of 10. Minor ticks for 2 to 9 times each power of ten get closer together towards the next power. Equal distances are equal ratios: 2 to 4 is as long as 50 to 100. The point halfway between 10 and 100 is about 32, not 55, and a point on the second minor tick after 100 reads 300.</desc>
<rect width="760" height="360" fill="#ffffff"/>
<path d="M73.0,122 v-10 H273.7 v10" fill="none" stroke="#1b75bb" stroke-width="2"/>
<text x="173.3" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b75bb">×10</text>
<path d="M279.7,122 v-10 H480.3 v10" fill="none" stroke="#1b75bb" stroke-width="2"/>
<text x="380.0" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b75bb">×10</text>
<path d="M486.3,122 v-10 H687.0 v10" fill="none" stroke="#1b75bb" stroke-width="2"/>
<text x="586.7" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b75bb">×10</text>
<text x="380.0" y="34" text-anchor="middle" font-size="15" fill="#1f2937">Each decade (1 to 10, 10 to 100, 100 to 1,000) is the same width</text>
