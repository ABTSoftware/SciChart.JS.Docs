<text x="452.2" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e44">50 → 100: ×2</text>
<circle cx="380.0" cy="170" r="6" fill="#d6336c"/>
<line x1="380.0" x2="380.0" y1="214" y2="250" stroke="#d6336c" stroke-width="1.5"/>
<text x="380.0" y="268" text-anchor="middle" font-size="14" fill="#d6336c">Halfway from 10 to 100</text>
<text x="380.0" y="286" text-anchor="middle" font-size="14" fill="#d6336c">is about 32, not 55</text>
<circle cx="581.9" cy="170" r="6" fill="#1b75bb"/>
<line x1="581.9" x2="581.9" y1="214" y2="250" stroke="#1b75bb" stroke-width="1.5"/>
<text x="581.9" y="268" text-anchor="middle" font-size="14" fill="#1b75bb">2nd minor tick after 100:</text>
<text x="581.9" y="286" text-anchor="middle" font-size="14" fill="#1b75bb">3 × 100 = 300</text>
<text x="100.2" y="268" text-anchor="start" font-size="14" fill="#1f2937">Minor ticks: 2 to 9 × the</text>
<text x="100.2" y="286" text-anchor="start" font-size="14" fill="#1f2937">power of ten, closer</text>
<text x="100.2" y="304" text-anchor="start" font-size="14" fill="#1f2937">together towards the next</text>
<text x="380.0" y="348" text-anchor="middle" font-size="14" fill="#1f2937">Equal distances are equal ratios, so there is no zero: the axis could carry on to 0.1, 0.01 … forever</text>
</svg>