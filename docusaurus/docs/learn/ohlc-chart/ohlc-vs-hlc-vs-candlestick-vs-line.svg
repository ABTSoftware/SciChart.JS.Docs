<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title id="title">The same five days drawn four ways</title>
  <desc id="desc">Five days of prices drawn as OHLC bars, HLC bars, candlesticks and a line of closing prices. Day 1 opens at 100 and closes at 103; day 2 opens at 103 and closes at 105; day 3 opens lower at 101 and closes at 102, so it rose on the day but ended below the previous close; day 4 opens at 102 and closes at 97; day 5 opens at 97 and closes at 100. The HLC bars drop the open tick, so they are drawn in one colour, and the line keeps only the closes.</desc>
  <rect width="700" height="540" rx="12" fill="#ffffff"/>
  <g>
    <rect x="15" y="15" width="330" height="235" rx="8" fill="#f7f8fa" stroke="#dde1e6"/>
    <text x="29" y="37" fill="#222" font-weight="bold" font-size="14">OHLC bars: open, high, low, close</text>
    <text x="65" y="240" text-anchor="middle" fill="#666" font-size="12">Day 1</text>
    <text x="123" y="240" text-anchor="middle" fill="#666" font-size="12">Day 2</text>
    <text x="181" y="240" text-anchor="middle" fill="#666" font-size="12">Day 3</text>
    <text x="239" y="240" text-anchor="middle" fill="#666" font-size="12">Day 4</text>
    <text x="297" y="240" text-anchor="middle" fill="#666" font-size="12">Day 5</text>
    <g stroke="#26a69a" stroke-width="4" stroke-linecap="square"><line x1="65" y1="83.8" x2="65" y2="161.2"/><line x1="51" y1="135.4" x2="65" y2="135.4"/><line x1="65" y1="96.7" x2="79" y2="96.7"/></g>
    <g stroke="#26a69a" stroke-width="4" stroke-linecap="square"><line x1="123" y1="57.9" x2="123" y2="122.5"/><line x1="109" y1="96.7" x2="123" y2="96.7"/><line x1="123" y1="70.8" x2="137" y2="70.8"/></g>
    <g stroke="#26a69a" stroke-width="4" stroke-linecap="square"><line x1="181" y1="83.8" x2="181" y2="148.3"/><line x1="167" y1="122.5" x2="181" y2="122.5"/><line x1="181" y1="109.6" x2="195" y2="109.6"/></g>
    <g stroke="#ef5350" stroke-width="4" stroke-linecap="square"><line x1="239" y1="96.7" x2="239" y2="187.1"/><line x1="225" y1="109.6" x2="239" y2="109.6"/><line x1="239" y1="174.2" x2="253" y2="174.2"/></g>
    <g stroke="#26a69a" stroke-width="4" stroke-linecap="square"><line x1="297" y1="122.5" x2="297" y2="187.1"/><line x1="283" y1="174.2" x2="297" y2="174.2"/><line x1="297" y1="135.4" x2="311" y2="135.4"/></g>
  </g>
  <g>
    <rect x="355" y="15" width="330" height="235" rx="8" fill="#f7f8fa" stroke="#dde1e6"/>
    <text x="369" y="37" fill="#222" font-weight="bold" font-size="14">HLC bars: no open tick, no up/down colour</text>
    <text x="405" y="240" text-anchor="middle" fill="#666" font-size="12">Day 1</text>
    <text x="463" y="240" text-anchor="middle" fill="#666" font-size="12">Day 2</text>
    <text x="521" y="240" text-anchor="middle" fill="#666" font-size="12">Day 3</text>
    <text x="579" y="240" text-anchor="middle" fill="#666" font-size="12">Day 4</text>
    <text x="637" y="240" text-anchor="middle" fill="#666" font-size="12">Day 5</text>
    <g stroke="#4a5260" stroke-width="4" stroke-linecap="square"><line x1="405" y1="83.8" x2="405" y2="161.2"/><line x1="405" y1="96.7" x2="419" y2="96.7"/></g>
    <g stroke="#4a5260" stroke-width="4" stroke-linecap="square"><line x1="463" y1="57.9" x2="463" y2="122.5"/><line x1="463" y1="70.8" x2="477" y2="70.8"/></g>
    <g stroke="#4a5260" stroke-width="4" stroke-linecap="square"><line x1="521" y1="83.8" x2="521" y2="148.3"/><line x1="521" y1="109.6" x2="535" y2="109.6"/></g>
    <g stroke="#4a5260" stroke-width="4" stroke-linecap="square"><line x1="579" y1="96.7" x2="579" y2="187.1"/><line x1="579" y1="174.2" x2="593" y2="174.2"/></g>
    <g stroke="#4a5260" stroke-width="4" stroke-linecap="square"><line x1="637" y1="122.5" x2="637" y2="187.1"/><line x1="637" y1="135.4" x2="651" y2="135.4"/></g>
  </g>
  <g>
    <rect x="15" y="270" width="330" height="235" rx="8" fill="#f7f8fa" stroke="#dde1e6"/>
    <text x="29" y="292" fill="#222" font-weight="bold" font-size="14">Candlesticks: body from open to close</text>
    <text x="65" y="495" text-anchor="middle" fill="#666" font-size="12">Day 1</text>
    <text x="123" y="495" text-anchor="middle" fill="#666" font-size="12">Day 2</text>
    <text x="181" y="495" text-anchor="middle" fill="#666" font-size="12">Day 3</text>
    <text x="239" y="495" text-anchor="middle" fill="#666" font-size="12">Day 4</text>
    <text x="297" y="495" text-anchor="middle" fill="#666" font-size="12">Day 5</text>
    <g><line x1="65" y1="338.8" x2="65" y2="416.2" stroke="#26a69a" stroke-width="2"/><rect x="53" y="351.7" width="24" height="38.8" fill="#26a69a"/></g>
    <g><line x1="123" y1="312.9" x2="123" y2="377.5" stroke="#26a69a" stroke-width="2"/><rect x="111" y="325.8" width="24" height="25.8" fill="#26a69a"/></g>
    <g><line x1="181" y1="338.8" x2="181" y2="403.3" stroke="#26a69a" stroke-width="2"/><rect x="169" y="364.6" width="24" height="12.9" fill="#26a69a"/></g>
    <g><line x1="239" y1="351.7" x2="239" y2="442.1" stroke="#ef5350" stroke-width="2"/><rect x="227" y="364.6" width="24" height="64.6" fill="#ef5350"/></g>
    <g><line x1="297" y1="377.5" x2="297" y2="442.1" stroke="#26a69a" stroke-width="2"/><rect x="285" y="390.4" width="24" height="38.8" fill="#26a69a"/></g>
  </g>
  <g>
    <rect x="355" y="270" width="330" height="235" rx="8" fill="#f7f8fa" stroke="#dde1e6"/>
    <text x="369" y="292" fill="#222" font-weight="bold" font-size="14">Line of closes: one price per day</text>
    <text x="405" y="495" text-anchor="middle" fill="#666" font-size="12">Day 1</text>
    <text x="463" y="495" text-anchor="middle" fill="#666" font-size="12">Day 2</text>
    <text x="521" y="495" text-anchor="middle" fill="#666" font-size="12">Day 3</text>
    <text x="579" y="495" text-anchor="middle" fill="#666" font-size="12">Day 4</text>
    <text x="637" y="495" text-anchor="middle" fill="#666" font-size="12">Day 5</text>
    <polyline points="405,351.7 463,325.8 521,364.6 579,429.2 637,390.4" fill="none" stroke="#3a6fd8" stroke-width="3"/>
    <circle cx="405" cy="351.7" r="4" fill="#3a6fd8"/>
    <circle cx="463" cy="325.8" r="4" fill="#3a6fd8"/>
    <circle cx="521" cy="364.6" r="4" fill="#3a6fd8"/>
    <circle cx="579" cy="429.2" r="4" fill="#3a6fd8"/>
    <circle cx="637" cy="390.4" r="4" fill="#3a6fd8"/>
  </g>
  <text x="350" y="528" text-anchor="middle" fill="#555" font-size="13">Day 3 is green (it closed above its open) but closed lower than day 2.</text>
</svg>
