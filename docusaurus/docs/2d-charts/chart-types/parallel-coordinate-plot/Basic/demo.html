<div class="container">
    <div id="controls">
        <span class="caption">Left-drag</span>
        <label><input type="radio" name="tool" value="highlight" checked /> Range highlight</label>
        <label><input type="radio" name="tool" value="reorder" /> Reorder axes</label>
        <label><input type="radio" name="tool" value="zoom" /> Rubber-band zoom</label>
        <label><input type="radio" name="tool" value="pan" /> Pan</label>
        <span class="caption">Hover</span>
        <label><input type="checkbox" id="selection" checked /> Highlight record</label>
        <label><input type="checkbox" id="cursor" /> Tooltip</label>
    </div>
    <div id="scichart-root"></div>
</div>
